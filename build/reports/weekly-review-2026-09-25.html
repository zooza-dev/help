onkrétnu registráciu alebo na úroveň programu / skupiny / termínu pre budúce klientov.", "cited": ["Collect information with a Google Form | Zooza Help", "Trial Classes FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Hledali jste tohle?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Chcem sa len uistiť, či ešte potrebujete pomoc s týmto problémom. Želáte si, aby som vás prepojil s ľudským pracovníkom? Ak nie, rád vám pomôžem ďalej, ak doplníte, čo potrebujete vyriešiť alebo objasniť.", "cited": []}], "verdict": "check", "vtitle": "Google formulár pripojený neskôr sa nepridá k existujúcim registráciám", "vnote": "Bot správne z helpu.", "cat": "programmes"}, {"channel": "intercom", "id": "215476056171200", "date": "2026-09-22 20:04", "day": "2026-09-22", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Notifications Center | Zooza Help", "Client Profile FAQ | Zooza Help", "Zooza Glossary | Zooza Help", "Booking FAQ | Zooza Help", "Automated notifications overview | Zooza Help", "Registration statuses — what each one means | Zooza Help", "Stay on top of activity with system messages | Zooza Help"], "q": "If a client has cancelled why can I still see it in my bookings?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Sabeena Kondogeorgis", "text": "If a client has cancelled why can I still see it in my bookings?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "This is expected behaviour.\n\n\nWhen a client cancels, the booking is not removed. It stays in your Bookings list so the full history is kept. The spot is freed, but the record remains and can be reactivated later if needed. \n\n\nIf you want it completely gone, you would need to delete the booking instead.\n\n\nSo seeing cancelled bookings is normal — they are kept for record-keeping.", "cited": ["Registration statuses — what each one means | Zooza Help", "Booking FAQ | Zooza Help", "Client Profile FAQ | Zooza Help", "Zooza Glossary | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Sabeena Kondogeorgis", "text": "should I get a notification if someone cancels?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — you can receive a notification when a client cancels. \n\n\n\n\n- In Settings → Other → Notification center, create a notification for New cancellation (all programmes).\n\n- Enter the email address where you want the alert sent. \n\n\nYou will also see a Booking cancelled message in the in‑app System messages sidebar automatically.", "cited": ["Notifications Center | Zooza Help", "Stay on top of activity with system messages | Zooza Help", "Automated notifications overview | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help with cancellation notifications or bookings, I’m here to assist. Would you like to share more about what you’re trying to understand?", "cited": []}], "verdict": "check", "vtitle": "Zrušená registrácia ostáva v zozname; notifikácia o zrušení", "vnote": "Bot správne vrátane Notification centre.", "cat": "bookings"}, {"channel": "intercom", "id": "215476054307773", "date": "2026-09-22 18:43", "day": "2026-09-22", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Getting Started with Zooza | Zooza Help", "Pay-as-you-go programme | Zooza Help", "Programmes List | Zooza Help", "Price and payment setup | Zooza Help", "Open Classes and Drop-in — Pay-as-you-go and Entry Passes | Zooza Help"], "q": "kde najdem ako nastaviť kurz na  jednorazove vstupne", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Dušan Frimer", "text": "kde najdem ako nastaviť kurz na  jednorazove vstupne", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Na jednorazové vstupné (drop‑in) máte dve možnosti:\n\n\n1. Priamo v programe\n\n\n\n\n- Idite na Programmes → otvorte program → Edit Settings → Price and Payment\n\n\n- Pri Programme type vyberte Pay-as-you-go (Open registration)\n\n\n- Nastavte unit price (cena za jeden termín).\n\n\n2. Použiť vstupné permanentky\n\n\n\n\n- Vytvorte Entry Pass v Products → Create New Product\n\n\n- Potom ho priradte k programu alebo skupine.\n\n\nPri Pay‑as‑you‑go klienti platia za každý termín zvlášť.", "cited": ["Price and payment setup | Zooza Help", "Getting Started with Zooza | Zooza Help", "Open Classes and Drop-in — Pay-as-you-go and Entry Passes | Zooza Help", "Programmes List | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak ešte potrebujete pomoc s nastavením jednorazového vstupného, som vám k dispozícii. Chcete doplniť, čo presne sa snažíte nastaviť alebo čomu potrebujete lepšie porozumieť?", "cited": []}, {"role": "customer", "who": "Dušan Frimer", "text": "este raz a po slovensky kde mam ist", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dušan, pre jednorazové vstupné choď takto:\n\n\nProgrammes → otvor program → Edit Settings → Price and Payment.\n\n\nTam pri Programme type vyber Pay-as-you-go (Open registration) a nastav unit price (cena za jeden termín).\n\n\nKlient potom platí za každý termín zvlášť.", "cited": ["Price and payment setup | Zooza Help", "Pay-as-you-go programme | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc s nastavením jednorazového vstupného, rád vám pomôžem. Chcete doplniť, kde sa pri nastavovaní neviete posunúť ďalej?", "cited": []}], "verdict": "check", "vtitle": "Jednorazové vstupné → PAYG; klient chcel po slovensky a dostal po slovensky", "vnote": "Jazykové pravidlo funguje.", "cat": "programmes"}, {"channel": "intercom", "id": "215476052558789", "date": "2026-09-22 16:29", "day": "2026-09-22", "human": true, "bucket": "HUMAN", "reask": 9, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Copy a programme or class | Zooza Help", "Transfer and Copy FAQ | Zooza Help", "Getting Help and Support | Zooza Help", "Prepare your programmes for the new school year | Zooza Help"], "q": "can I duplicate a full programme and class booking with just changes the dates", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "can I duplicate a full programme and class booking with just changes the dates", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes. You can duplicate a full programme or class and only change the dates. \n\n\n\n\n- Go to Programmes and click Copy on the programme or class.\n\n- When copying the class, choose how to shift the sessions (for example Move to a new first date).\n\n- Optionally tick Copy bookings to bring all registrations across. \n\n\nThe new class keeps the same settings, and you only adjust the dates before confirming.", "cited": ["Copy a programme or class | Zooza Help", "Transfer and Copy FAQ | Zooza Help", "Prepare your programmes for the new school year | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "I dont want registration to move across just set up new classes", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — that’s exactly how it works.\n\n\nWhen you copy a class, just leave “Copy bookings” unchecked.\n\n\nThe new class will be created with the same settings and sessions, but no registrations will be copied, so it starts empty and ready for new bookings. \n\n\nThis is the recommended way to set up a new term or season with the same class structure.", "cited": ["Transfer and Copy FAQ | Zooza Help", "Copy a programme or class | Zooza Help", "Prepare your programmes for the new school year | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help setting up new classes without carrying over registrations, I’m here to help. Would you like to share more about what you’re trying to set up?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "I think I need a call with someone to make sure this is done correctly", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Samantha, that’s completely understandable — it’s good to double‑check before setting up a new term.\n\n\nYou can request a human team member directly from the support panel:\n\n\n\n\n- Open the Help & Support chat panel\n\n- Click Create a ticket\n\n\n- Describe that you’d like help setting up the new classes and copying them correctly\n\nA team member can then follow up with you there. \n\n\n\nSource:\nGetting Help and Support | Zooza Help", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "ok", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Samantha", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "Hi Martin", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "What are you trying to achieve?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "I am struggling abit with zooza, just 3 weeks into using it for my classes, I am using the chat as best I can but lots of features I am unsure how to use.", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "Is it possible to jump on a call with someone", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Sure. It can be daunting sometimes as typically there are multiple ways to do stuff", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "for sure we can set up a call now if you want", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "perfect, Im in Dubai so 8.30pm here now, tomorrow would be good", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "if you're free we can hop on a call now but for sure we can set up a meeting for tomorrow as well", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "Yes now would be fine if your free", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Lets do this. Perhaps its something easy and it unblocks you:)", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "https://meet.google.com/hru-xcwj-zwz", "cited": []}], "verdict": "client", "vtitle": "Samantha — kopírovanie kurzu, dohodnutý call", "vnote": "Bot odpovedal správne, klientka chcela človeka. Fine.", "cat": "programmes"}, {"channel": "intercom", "id": "215476047769176", "date": "2026-09-22 12:44", "day": "2026-09-22", "human": false, "bucket": "D_assumed_with_kb", "reask": 9, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Membership Subscription Setup | Zooza Help", "Billing and invoicing | Zooza Help", "Discount types | Zooza Help", "Price and payment setup | Zooza Help", "Session payment adjustments | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Bookings | Zooza Help", "Children's Group Activities — Monthly Subscription Model | Zooza Help", "Add a one-off scheduled payment | Zooza Help", "Charge a monthly membership fee | Zooza Help"], "q": "i created a lead collection group in july adding 10 people with 0 to pay, because the course will start in late september. now i am in late september and i set a payment plan for the group but the payment plan did not apply to the customers that i ve enrolled. there are 2 options for membership: one that makes in you pay in 8 fees through the year, and the one when you pay entirely from the beginning with 10% discount. how should i know which parent needs with option? how can i make them choose by themself", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "i created a lead collection group in july adding 10 people with 0 to pay, because the course will start in late september. now i am in late september and i set a payment plan for the group but the payment plan did not apply to the customers that i ve enrolled. there are 2 options for membership: one that makes in you pay in 8 fees through the year, and the one when you pay entirely from the beginning with 10% discount. how should i know which parent needs with option? how can i make them choose by themself", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You have two parts here: how parents choose, and what to do for the ones already enrolled.\n\n\n1. Let parents choose themselves\n\n\nSet the programme to scheduled payments and activate both templates:\n\n\n\n\n- 8‑month instalment template\n\n- one‑off payment template (with 10% discount)\n\nWhen both are Active, parents will see both options on the booking form and choose the one they want. The first active template becomes the default. \n\n\n2. For the 10 people already enrolled\n\n\nPayment plans do not automatically update existing bookings. You can change it per registration:\n\n\n\n\n- Open the registration\n\n- Go to Payment plan\n\n\n- Click Replace plan and choose the template they want. \n\n\nSo the usual workflow is:\n\n\n\n\n- activate both templates for future bookings\n\n- manually Replace plan for the existing students once they tell you which option they prefer.", "cited": ["Price and payment setup | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Add a one-off scheduled payment | Zooza Help", "Discount types | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "ok, thanks. now at classes I have a set price of 300 lei even if the class will  have 29 sessions or 32 sessions, the fee is the same 300 lei per month. Where should I see for how many months will they pay? How is this going to work?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Good question — this is the key difference.\n\n\nBecause you set 300 lei as a monthly membership price, there is no fixed number of months. The system simply charges 300 lei every month for as long as the client stays enrolled. \n\n\nSo:\n\n\n\n\n- 29 sessions or 32 sessions → still 300 lei/month\n\n\n- No automatic “end date” for payments\n\n- The total amount depends on how long the parent keeps the child in the class\n\nIf you want a fixed total (for example: 3000 lei for the year, paid in 10 months), then you would use Programme fee, where the total is divided into instalments. \n\n\nIn your current setup, the “how many months” is not defined in the class — it’s simply ongoing monthly billing.", "cited": ["Charge a monthly membership fee | Zooza Help", "Price and payment setup | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "ok, and i set the date to make payment at 0 of the month, what does that mean?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "It means anniversary billing.\n\n\n\n\n- \nDay of the month when the payment is due = 0 → the payment is charged on the same day each month the parent originally enrolled. \n\n\nExample:\n\n\n\n\n- Parent enrolls on 15 September → they will be billed 15 October, 15 November, 15 December, etc.\n\nSo every parent keeps their own monthly billing date based on when they joined.", "cited": ["Membership Subscription Setup | Zooza Help", "Price and payment setup | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "which is better, if i set it to a day in the month, or 0?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Both work — it depends on what you prefer.\n\n\n\n\n- \nDay of the month (e.g. 1st)\nEveryone pays on the same day. Simpler to explain to parents and easier to track payments. \n\n\n- \n0 (anniversary billing)\nEach parent pays on the day they originally enrolled. Payments are spread across the month, so cash flow is steadier.\n\nMost programmes use a fixed day (like the 1st) because it’s easier to manage.", "cited": ["Children's Group Activities — Monthly Subscription Model | Zooza Help", "Price and payment setup | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Does this help you decide?", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "which is better for the romanian tax policies?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Neither option is better for Romanian tax policy.\n\n\nZooza does not tie billing date (0 vs fixed day) to any legal or tax structure. You can use either model regardless of your legal form. \n\n\nThe choice is only operational:\n\n\n\n\n- \nFixed day (e.g. 1st) – easier to explain to parents and reconcile payments. \n\n\n- \n0 (anniversary billing) – payments spread across the month, steadier cash flow.\n\nSo from a tax perspective, both are equivalent. The decision is about how you want to manage billing, not compliance.", "cited": ["Price and payment setup | Zooza Help", "Children's Group Activities — Monthly Subscription Model | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that clarify things?", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "so if i have at 0, and a parent decides to enroll in the class, when will  he pay?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you set Day of the month when the payment is due = 0, the parent pays on the same day of the month they enrolled. \n\n\nExample:\n\n\n\n\n- Parent enrolls on 15 September → first payment due 15 September\n\n\n- Then 15 October, 15 November, etc.\n\nSo the billing date is tied to their registration date, not the class start date.", "cited": ["Membership Subscription Setup | Zooza Help", "Children's Group Activities — Monthly Subscription Model | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "so if i start on 1 october and end on 15 june, and the parent enrolls on 1 october, won t he pay too much?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — with Day of the month when the payment is due = 0, the parent keeps paying every month on the same day they enrolled. The billing schedule is not tied to the class start or end date. \n\n\nExample:\n\n\n\n\n- Enrols 1 October → pays 1 October, 1 November, 1 December…\n\n\n- The system continues monthly billing until the booking is removed or the payment plan is changed. \n\n\nSo if the class ends 15 June, the parent would still be billed 1 June and 1 July unless you manually adjust the payment plan. \n\n\nThat is why many programmes switch to a fixed billing date (e.g. 1st) or use a programme fee with instalments when the course has a clear end date.", "cited": ["Membership Subscription Setup | Zooza Help", "Children's Group Activities — Monthly Subscription Model | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "cant i adjust automatically the membership payment plan to stop on 15 june and take them only a half of june?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Short answer: no — it cannot stop automatically on 15 June.\n\n\nWith a membership (Day of the month = 0), billing continues every month until the booking is cancelled.\n\n\nWhat you can do instead:\n\n\n\n\n- Cancel the booking on 15 June → future scheduled payments are removed\n\n- Or manually adjust the June payment amount in the booking’s Payment plan (edit the scheduled payment and change the amount)\n\n\nSo automatic “half month” billing at the end is not supported — it needs a manual adjustment or cancellation.", "cited": ["Membership Subscription Setup | Zooza Help", "Add a one-off scheduled payment | Zooza Help", "Session payment adjustments | Zooza Help", "Children's Group Activities — Monthly Subscription Model | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Does this clarify things?", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "or if i start in october and end in june just take them 8 fees. how can i see how many fees i took from them individually?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can see this per parent (per booking).\n\n\n\n\n- Go to Bookings\n\n\n- Open the parent’s booking\n\n- Go to the Payments tab\n\nThere you’ll see a table with:\n\n\n\n\n- Amount\n\n- Payment receiving date\n\n- Transaction type\n\nEach row is one payment, so you can count how many fees that specific parent has paid. \n\n\nIf you want a global overview, you can also go to Sales & Payments → Invoices and filter by date or client to see all invoices and payments.", "cited": ["Bookings | Zooza Help", "Billing and invoicing | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help understanding or tracking the number of fees for each parent, I’m here to help. Would you like to share more about what you’re trying to check?", "cited": []}], "verdict": "gap", "vtitle": "Rares: členské s dňom 0 beží donekonečna; kurz október–jún sa sám nezastaví", "vnote": "Bot to nakoniec povedal správne (9 otázok za sebou, všetky z helpu). WRITTEN: payment-templates-creation — členské sa samo nekončí + deň 0 vs pevný deň.", "cat": "pricing"}, {"channel": "intercom", "id": "215476046682002", "date": "2026-09-22 10:54", "day": "2026-09-22", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Trial sessions | Zooza Help", "Onboarding and Launch FAQ | Zooza Help", "Children's Group Activities — Block / Term Model | Zooza Help", "When to enrol clients yourself vs. send them a booking link | Zooza Help"], "q": "Is this a booking sign up and pay link or free trial link https://www.loudballers.com/booking?course_id=229&schedule_id=407", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Is this a booking sign up and pay link or free trial link https://www.loudballers.com/booking?course_id=229&schedule_id=407", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "It depends on how the trial is configured.\n\n\n\n\n- \nFree Trial – the link is a trial booking form and no payment is taken. \n\n\n- \nPaid Trial – the link is still a booking form, but clients pay the trial price when they sign up.\n\nIn both cases, the link is a booking form link where clients register themselves. \n\n\nI’m not able to open the URL you sent, but if you tell me whether the trial is set as Free Trial or Paid Trial, I can confirm which one it is.", "cited": ["Trial sessions | Zooza Help", "When to enrol clients yourself vs. send them a booking link | Zooza Help", "Onboarding and Launch FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "i want a sign up and pay link for this session Barnet PDC - Nursery to Year 3", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — you can send a sign‑up and pay link for that session.\n\n\nOn the class page for Barnet PDC - Nursery to Year 3:\n\n\n\n\n- Go to Programmes → open the programme\n\n- Open the class\n\n- Copy the booking link (share/copy icon)\n\nSend that link to parents. They open it, complete the form, and pay online during booking. \n\n\nTip: always share the class-specific link so it pre-fills the correct session.", "cited": ["Onboarding and Launch FAQ | Zooza Help", "When to enrol clients yourself vs. send them a booking link | Zooza Help", "Children's Group Activities — Block / Term Model | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help finding or sharing the sign-up and payment link for this session, I’m here to help. Would you like to provide more details about what you’re trying to resolve?", "cited": []}], "verdict": "check", "vtitle": "Je tento link na trial alebo na platenú registráciu", "vnote": "Bot správne priznal, že URL otvoriť nevie.", "cat": "bookings"}, {"channel": "intercom", "id": "215476046238860", "date": "2026-09-22 10:21", "day": "2026-09-22", "human": true, "bucket": "HUMAN", "reask": 30, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Automatic payment reminders | Zooza Help", "Payment Pairing for Bank Transfers & Direct Debit | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Edit payment on booking | Zooza Help", "Payment tile on booking | Zooza Help"], "q": "how do i change the grace period for payments to 0 so that payments must be made at time of booking?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "how do i change the grace period for payments to 0 so that payments must be made at time of booking?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Set the grace period to 0.\n\n\nSteps:\n\n\n\n\n- Go to Settings → Billing & Payments → Payment settings\n\n\n- Find Days before booking is marked unpaid (Slovak: Počet dní pre vystavenie splátky)\n\n- Set it to 0\n\n\nWith 0, there is no grace window. Any booking with an outstanding balance becomes Unpaid immediately when it is created.", "cited": ["Payments and Billing FAQ | Zooza Help", "Automatic payment reminders | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "how can i retrospectively add payments to customers who have been given a grace period?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Sam, Just to make sure the expectations are set correctly - there is no way to enforce the payment. Unpaid bookings are still in the system and if you don't want them to be there you need to cancel those manually.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can add the payment manually on the booking.\n\n\n\n\n- Go to Bookings and open the client’s booking.\n\n- In the booking details, go to Payments.\n\n- Click Add payment.\n\n- Enter the amount, date, and payment method, then save. \n\n\nThis records the payment even if it was received outside the system (bank transfer, cash, etc.).", "cited": ["Payments and Billing FAQ | Zooza Help", "Payment tile on booking | Zooza Help", "Edit payment on booking | Zooza Help", "Payment Pairing for Bank Transfers & Direct Debit | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "On your second question - You want to flag the payments manually?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Meaning that they paid you in cash or via bank transfer?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Or you want to remove the grace period?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "Hi Martin, thanks for this. I would like customers to be charged for payments as soon as they sign up", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "I want to remove the grace period", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ok, so those are two different things. Let me explain", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "When parents create the booking - they do immediately see the stripe screen where they can enter the payment information", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "But as it happens, the card payments are not 100% so the customer may not have their card at hand, or the card may be lacking funds or whatever is the case", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "The booking is still created and in the status - Awaiting for payment - aka the grace period", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "You can remove this by setting the grace period to 0 but that does not mean that users will be billed/charged", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "They can pay at any time for the booking via their parent portal and as I mentioned there is currently no automation which would cancel such bookings automatically", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "We have this in our roadmap though so its not that we did not receive such request, it just did not get the priority as most providers want to talk to these people before cancelling the booking", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "Ok all understood. I dont think it should cancel the booking as providers should be able to reach out but id be curious to see what the parents see on the parent portal?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Now when the grace period is on - you can simply remove that flag when you go on to that booking's payment screen", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Let me capture a screenshot for you from your portal", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "for example this booking, I want their first monthly payment to be made before the first class which is tomorrow. Whats the best way to try and get this payment?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "This is an example of a person who is in the status Awaiting for payment:", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "i want the customer to be charged their first monthly payment on 20th september which is whem signed up", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ok. let's get back to your question", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "As I mentioned the very first payment is different from the rest of the scheduled payments. Try to imagine your self as a customer - you need to create that first payment in order for subscription to take place and start", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Meaning - unless user actually makes that first payment - there are no card details to be stored and thus system can't charge anything against that customer", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "So you don't have any way to automatically charge that customer unless they actually made the first payment", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "They need to go to their parent portal and make the payment", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "What you can do is to remove that grace period to indicate that they should've already paid by now", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "That grace period can be set up globally in settings or per programme", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "Ah i see, so customers are not entering in their card info", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "I can see this on stripe where it says incomplete", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "because they havent entered it", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Yes", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "I used to use stripe subscriptions directly", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "and i had more success with customers entering their info", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "But that is the same scenario - the first payment need to be created", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "but that could have been those specific customers", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Yes, they do really need to make that first payment regardless whether that is stripe subscription or zooza subscription", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "yes i would like to remove the grace period globally", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "https://zooza.app/#settings/payment_settings", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "and for those parents that are showing as incomplete, not entering their payment info, do i send them directly to https://www.elizabethsamuelsdrama.it/parent-portal to make the first payment?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "its on this page - the very first input", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "yes", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "and i set it to 0?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Yes. Now there is also per programme automattion", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Which you should check out whether it is set and activated or not", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "as that might override the global setting", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "how do i find that?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "programme settings?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "In the programme's price and payment setting", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Yes", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "got it", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "here?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Yes. based on what you said you don't want this to be triggered. As basically you want to switch the booking to unpaid immediately. So you'd turn this off", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "yes", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "This is for the situations where you want to let customers have a time to pay and system will notify them", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "which you don't really want", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "You may want to turn on the later one - cancel unpaid bookings - but don't do that as the system would automatically cancel any new booking that did not receive the payment. I think you want to talk to the parent before you do that. That automation makes sense if you have the grace period on", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Great. What I'll do from our end is this - We'll look into how users are interacting with t  "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "I can't see whatapp", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "That’s expected if the WhatsApp integration isn’t enabled yet.\n\n\nIf you don’t see WhatsApp in Communication, it usually means one of these:\n\n\n\n\n- Your plan doesn’t include the WhatsApp integration, or\n\n- The WhatsApp Business Platform connection hasn’t been enabled for your account yet. \n\n\nWhatsApp messaging in our app is a separate integration (currently in beta) and requires connecting a Meta Business account and a phone number before it appears in the Communication screen.\n\n\nSo if it’s missing, you can still message those trial clients using email from Communication → Compose and filter by Trial status. \n\n\nIf you want, I can also show a simple way to export the trial attendees so you can message them in bulk outside the platform.", "cited": ["WhatsApp Integration & Usage (Beta) | Zooza Help", "Zooza 3.7: Back‑to‑School Release That Saves Time and Fills Classes", "Communication | Zooza Help", "Email and Communication FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "how do i set up whatapp", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can set it up directly inside the app:\n\n\n\n\n- Go to Communication → WhatsApp.\n\n- Click Connect to WhatsApp.\n\n- A Meta (Facebook) window opens. Log in with a Facebook Business Admin account.\n\n- Select your Business Account, add a dedicated phone number, and complete the SMS/voice verification.\n\n- Return to Zooza and refresh the page. The status should show Done.\n\n- Create a 6‑digit PIN and save it. \n\n\nYou’ll also need a Meta Business account and a phone number that isn’t used in the WhatsApp mobile app.\n\n\nOnce connected, conversations appear in Messages → WhatsApp → Conversations. \n\n\nIf you want, I can also explain how the 24‑hour reply window works when parents message you.", "cited": ["WhatsApp Integration & Usage (Beta) | Zooza Help", "WhatsApp Messaging for Classes | Reminders, Changes & Payments | Zooza", "WhatsApp | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that clarify how to set it up?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "I dont see whatsapp", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you don’t see “WhatsApp” in Communication, it usually means one of these:\n\n\n\n\n- Your plan doesn’t include the WhatsApp integration, or\n\n- The WhatsApp Business Platform hasn’t been enabled for your account yet. \n\n\nThis feature is currently in beta and only available to a limited number of accounts, so it may not appear in the menu until it’s enabled. \n\n\nSo in this case, the next step is to request access to the WhatsApp integration in this chat if you’d like to use it.\n\n\nIf you want, I can also show a quick workaround to message those trial attendees using email while you wait.", "cited": ["WhatsApp Integration & Usage (Beta) | Zooza Help", "Zooza 3.7: Back‑to‑School Release That Saves Time and Fills Classes"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Okay I can send sms", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Great — SMS works the same way as email for this.\n\n\nTo message the trial attendees:\n\n\n\n\n- Go to Communication → Send SMS\n\n\n- In the Target group, filter by Trial status (or filter the specific class and select trial bookings)\n\n- Write your message and send it\n\nTrial clients are a separate group from enrolled clients, so they won’t appear in the “all active clients” audience. You need to select the Trial filter to reach them. \n\n\nTip: you can also ie podnikateľov: výmysel alebo začínajúci trend? – vyplniť dotazník\n\n Vyplnenie dotazníka trvá približne 7 – 10 minút. Dotazník je anonymný a slúži výhradne na akademické účely. Zber prebieha do 30. 10. 2026.\n\n Zapojiť sa môžu aj tí, ktorí podnikanie už ukončili. Vaša skúsenosť je pre náš výskum rovnako cenná.\n\n Ak dotazník nevypĺňate Vy, budem vďačný za jeho preposlanie konateľovi alebo majiteľovi. Je určený podnikateľom z mikro, malých a stredných podnikov. Ak poznáte alebo máte v blízkom okolí podnikateľov, boli by sme radi, ak by ste im odkaz na dotazník mohli preposlať.\n\n Priebežné zistenia o vyhorení podnikateľov a neskôr aj odporúčania pre prax zverejňujeme na Facebooku na stránke „Vyhorenie podnikateľov v SR: výskum k diplomovej práci“.\n\n Keď budú výsledky spracované, rád Vám pošlem ich zhrnutie. Stačí odpísať na tento e-mail.\n\n Vašu e-mailovú adresu som našiel vo verejne dostupnom katalógu podnikateľských subjektov, prípadne priamo na webovej stránke Vašej firmy. Spracúvam ju len na toto jednorazové oslovenie k akademickému výskumu, na základe oprávneného záujmu podľa čl. 6 ods. 1 písm. f) nariadenia GDPR, a po ukončení zberu dát ju vymažem. Ak si neželáte ďalšiu komunikáciu, stačí odpísať a adresu okamžite vyradím.\n\n Ďakujeme za Váš čas a vyplnenie dotazníka.\n\n S pozdravom\n Bc. Róbert Javor\n Fakulta managementu Univerzity Komenského v Bratislave\n javorrobert@gmail.com · javor18@uniba.sk", "turns": [{"role": "customer", "who": "Robert Javor", "text": "Dobrý deň,\n\n volám sa Róbert Javor a študujem na Fakulte managementu Univerzity Komenského v Bratislave, odbor Podnikanie a strategický manažment. Píšem diplomovú prácu s názvom „Vyhorenie podnikateľov: výmysel alebo začínajúci trend?“ pod vedením Mgr. Diany Gašparík, PhD.\n\n Zisťujem v nej, akú mieru vyhorenia dnes zažívajú slovenskí podnikatelia, ako to súvisí s podnikateľskými stresormi a digitálnym stresom a čo to robí s udržateľnosťou ich podnikania.\n\n Poprosil by som Vás o vyplnen ailed. Check your app settings.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "riesi Matko", "cited": []}, {"role": "customer", "who": "Mikuláš Fedor", "text": "kde najdem v zozname registracii tuto, ktora ma status Deleted? niekedy tam boli, teraz ich tam nevidimhttps://zooza.app/#registrations/539832", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Tieto registrácie už sa v zozname Bookings (Registrácie) neukazujú. Filter Deleted bol z rozhrania odstránený. \n\n\nMôžete ich nájsť dvoma spôsobmi:\n\n\n\n\n- \nSettings → Tools → Trash – tu sú registrácie, ktoré boli vymazané a dajú sa obnoviť do 30 dní.\n\n- alebo otvorte zoznam registrácií priamo cez URL:\n#registrations?status=deleted\nTýmto spôsobom ich môžete pozrieť aj po 30 dňoch.\n\nAk ich nevidíte ani tam, môžu už byť trvalo odstránené (po 30 dňoch).", "cited": ["Recover deleted items: registrations, classes, sessions, and payments | Zooza Help", "Registration statuses — what each one means | Zooza Help"]}, {"role": "customer", "who": "Mikuláš Fedor", "text": "to je riadne odveci", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumiem — je to trochu matúce.\n\n\nV Zooza sú Deleted registrácie už v zozname Bookings (Registrácie) vôbec neviditeľné. Filter Deleted bol z rozhrania odstránený. \n\n\nMôžu sa nachádzať len na dvoch miestach:\n\n\n\n\n- \nSettings → Tools → Trash – tu ich môžete obnoviť do 30 dní.\n\n- priamo cez URL: #registrations?status=deleted – tu ich môžete pozrieť aj po 30 dňoch.\n\nAk ich nevidíte ani tam, už sú pravdepodobne trvalo odstránené.", "cited": ["Recover deleted items: registrations, classes, sessions, and payments | Zooza Help", "Registration statuses — what each one means | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Mrzí ma, že je to také mätúce — potrebujete ešte pomôcť s nájdením tejto registrácie? Chcete, aby som vás prepojil s pracovníkom podpory? Ak nie, rád pomôžem ďalej, ak doplníte, čo presne sa snažíte vyriešiť.", "cited": []}], "verdict": "gap", "vtitle": "Zalamovanie na Skupinách + 'kde je filter Zmazané'", "vnote": "Bot poslal #registrations?status=deleted — funguje, ale klient to nazval 'riadne odveci'. Pokryté opravou v getting-started + trash-and-restore.", "cat": "bookings"}, {"channel": "intercom", "id": "215476031565258", "date": "2026-09-21 16:38", "day": "2026-09-21", "human": false, "bucket": "D_assumed_with_kb", "reask": 6, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Discount types | Zooza Help", "How to assign Direct Debit mandates to bookings (GoCardless) | Zooza Help", "Payment templates creation | Zooza Help", "Price and payment setup | Zooza Help", "Roles and Permissions FAQ | Zooza Help", "Reports | Zooza Help", "Outstanding amount — why it does not follow price changes | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Bookings | Zooza Help", "Edit payment on booking | Zooza Help", "Exporting data and reports | Zooza Help"], "q": "In a class I have 13 kids, how can I get a PDF or Excel automatically with their names. to send them to the lecturer in a list", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "In a class I have 13 kids, how can I get a PDF or Excel automatically with their names. to send them to the lecturer in a list", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — you can export the list of children as an Excel file.\n\n\nSteps:\n\n\n\n\n- Go to Bookings (Rezervări).\n\n- Use the filters to show only the class you want (for example filter by programme or class).\n\n- Click Export at the top of the list.\n\nZooza will download an XLSX spreadsheet with the registrations, including the names of the children. You can then send that file to the lecturer. \n\n\nTip: the export always matches whatever filters are currently applied, so filter to that specific class first.", "cited": ["Bookings | Zooza Help", "Exporting data and reports | Zooza Help", "Reports | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "I dont see Bookings", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you don’t see Bookings (Rezervări) in the main menu, it’s usually a permissions issue. Exporting bookings depends on your role. \n\n\nPlease check this:\n\n\n\n\n- Go to Team & Settings → Access\n\n\n- Find your user\n\n- Check which role you have\n\nIf your role does not include access to bookings or exports, the menu item will not appear. An owner can change your role or run the export for you. \n\n\nIf you want, you can also tell me what menu items you do see in the left sidebar and I can guide you from there.", "cited": ["Roles and Permissions FAQ | Zooza Help", "Bookings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help finding the booking list or exporting the class names, I’m here to help. Would you like to share which menu items you see in the left sidebar?", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "i have another question, I have an issue. I have this class where I've set a payment plan, but the kids where put by me in the class manually and it says they have nothing to pay, even if the class has a payment plan. how can i make them pay?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "This happens because the amount owed is fixed when the booking is created. If the kids were added manually before the price or payment plan was set, the booking keeps 0 to pay and does not update automatically.  \n\n\nYou can fix it on each booking:\n\n\n\n\n- Open the booking\n\n- Go to Payments\n\n\n- Edit the Amount owed or add a Payment schedule (payment plan)\n\n- Save the changes\n\nAfter adjusting the amount, the system recalculates whether the booking is paid or unpaid. \n\n\nIf the booking was added late, you may also need to change the status to Registered so the payment schedule is confirmed.", "cited": ["Payments and Billing FAQ | Zooza Help", "Outstanding amount — why it does not follow price changes | Zooza Help", "Edit payment on booking | Zooza Help", "Payment templates creation | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "and i need to go to each one manually? cant i set in bloc?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "No — you don’t have to do it one by one. You can apply the payment plan to the whole class at once. \n\n\nSteps:\n\n\n\n\n- Open the Class\n\n\n- Go to Price & Payments\n\n\n- Click Apply payment template\n\n\n- Set the amount and choose which bookings it applies to (usually all)\n\n- Confirm\n\nThis assigns the payment plan to all selected registrations in that class in one go.", "cited": ["Payment templates creation | Zooza Help", "How to assign Direct Debit mandates to bookings (GoCardless) | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "i have something called payment schedules", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Good — payment schedules are the same thing as payment templates (instalment plans).\n\n\nYou can apply them to the whole class at once:\n\n\n\n\n- Open the Class\n\n\n- Go to Price & Payments\n\n\n- Click Apply payment template\n\n\n- Choose the payment schedule you want\n\n- Select which bookings (usually all)\n\n- Confirm\n\n\nThis assigns the instalment plan to all selected registrations in that class in one go.", "cited": ["Payment templates creation | Zooza Help", "Payments and Billing FAQ | Zooza Help", "How to assign Direct Debit mandates to bookings (GoCardless) | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "it is a problem because i don't know if they want to pay monthly or per year and i don t know where to put everyone. yearly has the advantage of a 10% discount if you pay everything from the firsttime", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You don’t need to decide for them. You can offer both options and let parents choose. \n\n\nSet it up like this:\n\n\n\n\n- Create two payment templates:\n• Monthly (no discount)\n• Yearly (with 10% discount)\n\n- In the programme, go to Settings → Price and Payment\n\n\n- Set Payment collection to scheduled payments\n\n- Activate both templates\n\n\nThen clients choose monthly or yearly when booking. \n\n\nThis is the standard setup when you want to reward paying the full year upfront.", "cited": ["Price and payment setup | Zooza Help", "Discount types | Zooza Help", "Payment templates creation | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help setting up the monthly and yearly payment options, I’m here to help. Would you like to share what you see in your programme’s payment settings?", "cited": []}], "verdict": "check", "vtitle": "Export detí v skupine; hromadné priradenie platobného plánu", "vnote": "Bot správne z helpu vrátane 'Apply payment template'.", "cat": "reports"}, {"channel": "intercom", "id": "215475843230655", "date": "2026-09-21 16:00", "day": "2026-09-21", "human": true, "bucket": "HUMAN", "reask": 1, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Dear Michael and Martin,\n\nFirst of all, I would like to thank you for all your support and assistance during this period. Although I haven’t been as present lately, I know from Mara and Sorina that you have been extremely helpful and professional, as always.\n\nI’m reaching out now with a request that both Mara and Sorina have also raised, regarding the additional step for authentication or continuing as a guest before the actual registration form appears, which was introduced recently.\n\nAs you know, for those of us working in education, especially in extracurricular activities, September and October are the most important months for children’s enrolments.\n\nBoth our agency and our franchise partners believe that it would help us significantly if this additional step could be removed. During this period, any simplification of the registration process can have an important impact on conversions and on the number of children enrolled.\n\nWe would greatly appreciate it if you could look into this possibility and let us know whether this change could be implemented.\n\nThank you very much for your continued support and collaboration!\n\nWarm regards,\nNomin", "turns": [{"role": "customer", "who": "Nomin Damdin", "text": "Dear Michael and Martin,\n\nFirst of all, I would like to thank you for all your support and assistance during this period. Although I haven’t been as present lately, I know from Mara and Sorina that you have been extremely helpful and professional, as always.\n\nI’m reaching out now with a request that both Mara and Sorina have also raised, regarding the additional step for authentication or continuing as a guest before the actual registration form appears, which was introduced recently.\n\nAs you know, for those of us working in education, especially in extracurricular activities, September and October are the most important months for children’s enrolments.\n\nBoth our agency and our franchise partners believe that it would help us significantly if this additional step could be removed. During this period, any simplification of the registration process can have an important impact on conversions and on the number of children enrolled.\n\nWe would greatly appreciate it if you could look into this possibility and let us know whether this change could be implemented.\n\nThank you very much for your continued support and collaboration!\n\nWarm regards,\nNomin", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Hi Nomin,\n\n\nThanks for reaching out! I'm Zooza Support, Zooza's AI Agent and I'm well trained to answer your query but you can reply and ask for the team at any time.\n\n\nI understand how this extra authentication step could create friction and impact your conversion rates during peak enrollment periods.\n\n\nThis is a product configuration request that requires review by our team, as it involves changes to your booking flow design and user experience. A human agent will be able to assess your specific setup, discuss the trade-offs between guest access and data collection, and explore whether adjustments to the step's visibility, wording, or layout might help — or whether removing it entirely is feasible for your use case.\n\n\nWould you like me to connect you with a member of our team who can review your request and discuss the options with you?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Nomin, thank you for reaching out. Michael probably did not have the time to write to Mara and Sorina, but just today we made the decision, on how to proceed with this and I think you'll be pleased to hear it. \n\n\n\n\n\nEssentially the problem is this - we do offer plenty of possibilities for priority registration, customer benefits such as loyalty programs or other upsell features that are only available to logged in users. However this is in conflict with a situation when the booking form is used as a lead generation tool as is in couple of your scenarios.\n​\n\n\nTherefore we decided to build a dedicated and greatly simplified new form specifically designed to capture leads. This new feature will also contain direct integration between Zooza and Meta to transfer captured leads from one platform to another. So I believe that in the end your existing customers will be happy as they get all the benefits from being already in the system and new customers will be happy as well because they will experience simplified and streamlined user interface.\n​\n\n\nWe will start working on this next week and hopefuly it wont take more than a week or two to get this done.\n\n\n\n\n\nOnce again thank you for your message. I really do appreciate your input and I just want to say that this is really the kind of partnership we love. We always listen to your questions and try to resolve them in a systemic way hopefully enabling your business to grow.\n\n\n\n\n\nAll the best\n\n\nMartin", "cited": []}, {"role": "customer", "who": "Brian James", "text": "Hi Nomin,\nThank you for your message and for the patience over the past weeks. I have good news.\nThe new Contact form for lead capture is ready for you to test. It's a completely new, simplified form built specifically for capturing leads — no account step, no verification before the form appears. It's already live in your Zooza account and set up for your business:\nhttps://help.zooza.online/clients/contact-form-lead-capture/\nWe built it with your feedback in mind, and I'd really like to hear how it works for you once you've had a chance to try it.\nOn the Meta side: the request for the direct Meta Leads ↔ Zooza integration is already submitted and in progress. Once approved, leads will sync both ways between Meta and Zooza automatically. This covers the Conversions API and attribution topics Sorina raised so your developers won't need the REST API for this; the integration handles it end to end.\nAnd one more thing: we've also shipped an update that makes the embedded form render significantly faster on page load. That delay Sorina and your franchisees mentioned should now be gone.\nIf you or your team have any questions while testing, just let us know.\nWarm regards,\nMichal", "cited": []}], "verdict": "product", "vtitle": "Nomin: odstrániť krok prihlásenia pred registračným formulárom → postavil sa nový contact form + Meta integrácia", "vnote": "Zavŕšenie témy z minulého týždňa. Help pre contact form už existuje. Nie KB.", "cat": "widgets"}, {"channel": "intercom", "id": "215476029453173", "date": "2026-09-21 14:40", "day": "2026-09-21", "human": false, "bucket": "D_assumed_with_kb", "reask": 1, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Managing client attendance — admin | Zooza Help", "Bookings | Zooza Help"], "q": "ako zmenim stav dietata ze nepride na kruzok", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": "Petronela Ševčíková", "text": "ako zmenim stav dietata ze nepride na kruzok", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Otvorte termín (hodinu) v kalendári a nájdite dieťa v zozname účasti.\n\n\nU každého klienta sú 4 stavové tlačidlá:\n\n\n\n\n- \nWill attend – má prísť\n\n- \nAttended – bolo prítomné\n\n- \nCancelled – dopredu sa odhlásilo\n\n- \nDid not attend – neprišlo bez odhlásenia\n\nKliknite na Cancelled (ak dopredu vedeli, že neprídu) alebo Did not attend (ak neprišlo bez správy). Stav sa zmení okamžite.", "cited": ["Managing client attendance — admin | Zooza Help", "Bookings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Hledali jste tohle?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak potrebujete s touto zmenou ešte pomôcť, som vám k dispozícii. Chcete doplniť viac informácií o tom, čo potrebujete vyriešiť?", "cited": []}], "verdict": "check", "vtitle": "Zmena stavu dochádzky", "vnote": "Fine.", "cat": "attendance"}, {"channel": "intercom", "id": "215476024777122", "date": "2026-09-21 13:16", "day": "2026-09-21", "human": true, "bucket": "HUMAN", "reask": 7, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": [], "q": "Ahoj, prosím ťa máme rodiča ktorý registroval dve deti, zvolil kvartálnu úhradu.\nPlná suma za obe deti na kvartálnej úhrade je 192€.\n- zľava kvartálnej úhrady 6€/dieťa\n- druhá registrácia 4€\nTo znamená že naplánovaná druhá kvartálna úhrada by mala byť vo výške 176€, no systém ukazuje 188€.\n\nČíslo registrácie: 541602\n\nVieš to skontrolovať?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Ahoj, prosím ťa máme rodiča ktorý registroval dve deti, zvolil kvartálnu úhradu.\nPlná suma za obe deti na kvartálnej úhrade je 192€.\n- zľava kvartálnej úhrady 6€/dieťa\n- druhá registrácia 4€\nTo znamená že naplánovaná druhá kvartálna úhrada by mala byť vo výške 176€, no systém ukazuje 188€.\n\nČíslo registrácie: 541602\n\nVieš to skontrolovať?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumiem, teraz vás spojím s niekým z nášho tímu, kto vám s týmto problémom pomôže. Medzitým, či by ste mohli poskytnúť ďalšie podrobnosti, ktoré by mohli urýchliť riešenie?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Treba niečo viac ako číslo registrácie?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Je to pri viacerých registráciách súrodencov, napríklad aj pri 541276.\n\nBojím sa že to bude pri každej registrácií súrodencov a kvartálnej úhrade.", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Aha, teraz som si všimol jednu vetu napísanú pri kvartálnych platobných šablónach - pri čísle zľava 6€ (Táto suma bude jednorázovo odčítaná z celkovej hodnoty registrácie.)\n\nTo znamená že na ďalšiu splátku už neplatí, dá sa to prenastaviť ?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Peter - nepamatam si ci pouzivate kurzovne alebo clenske. V pripade clenskeho sa vsetky zlavy aplikuju len na prvu splatku. Je to tak zamerne a vyplyva to z povahy clenskeho - kedy neviete, ci zakaznik bude chodit cely skolsky rok alebo nie, preto sa zlava uplatnuje cela a naraz. Zlava z lojalitneho programu sa uplatni na vsetky splatky aj v pripade clenskeho.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Zlavy momentalne hromadne upravovat na splatkach neviete, ale to by sme Vam vedeli spristupnit pomerne rychlo", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "A teda idealne by bolo, ak by ste vedeli povedat, ako by to malo vyzerat - prva registracia ma dostat tych 6 eur a druha tiez, alebo ako by to malo byt? Potom by sme vedeli skontrolovat nastavenie ci je v poriadku", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Ďakujem za odpoveď. Okrem jedného programu, máme všetko členské.\nMinulé roky to fungovalo tak, že keď si rodič zvolil kvartálnu úhradu, tak každá jedna z troch splátok mala zľavu.\n\nBudem písať na konkrétnom programe (ako príklad), YTA na Vašej škole.\nMesačné členské 32€, kvartálne 96€ (6€ zľava).\nPri zvolení kvartálnej úhrady by sme chceli docieliť to, že každá splátka bude ponížená o 6€.\n\nV podstate, budem musieť zmeniť/nahodiť zľavu pri všetkých registráciách, ktoré si zvolili kvartálnu úhradu. Pre to by mi veľmi pomohlo ak by ste mi do konca kalendárneho roka (keď sa budú blížiť druhé splátky kvartálnych úhrad) vedeli teda sprístupniť hromadnú úpravu zliav.\n\nVernostný program, pri druhej registrácií zľava 4€ funguje ako má. Ten ponecháme.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Jasne, super, okej tak myslim si, ze to vieme vyriesit do buducna aj tak, ze na tie platobne sablony mozeme vytvorit moznost uplatnovat tu zlavu zo sablony na kazdej splatke a tym padom by sa to do buducna vyriesilo. Nateraz si teda beriem dve veci: Do hromadnych uprav moznost pridat zmenu zliav; a druha: Do nastaveni sablony moznost priznat zlavu na vsetkych splatkach", "cited": []}, {"role": "customer", "who": "P volili Change for a class only, existujúce termíny (sessions) si stále držajú starého lektora.\n\n\nAk chcete, môžete mi povedať, na ktorom obrazovke ste — Classes (Skupiny) alebo Sessions (Termíny)?", "cited": ["Programmes, Timetables and Sessions FAQ | Zooza Help", "Booking Widget FAQ | Zooza Help"]}, {"role": "customer", "who": "Peter Longauer", "text": "skupiny", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Na obrazovke Classes (Skupiny) vidíte len hlavné nastavenie skupiny. Pri ukladaní sa vždy pýta, ako sa zmena má aplikovať. \n\n\n\n\n- \nChange for a class only (sessions will not change) – skupina sa zmení, ale existujúce termíny (sessions) si stále držajú starého lektora.\n\nAk chcete, aby sa zmena prejavila aj na termínoch, otvorte detail skupiny a pri ukladaní vyberte Change for all sessions alebo Change only for upcoming sessions. \n\n\nNa telefóne sa vám môže stále zobrazovať „lektor bude priradený“, pretože sa pozriete na termíny, ktoré ešte nemajú priradeného lektora.", "cited": ["Programmes, Timetables and Sessions FAQ | Zooza Help", "Class Detail | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc s týmto nastavením, som vám k dispozícii. Chcete doplniť, čo presne sa zobrazuje v skupine alebo pri jej termínoch?", "cited": []}], "verdict": "check", "vtitle": "Lektor na skupine sa na mobile neaktualizuje — cache / 'class only'", "vnote": "Bot rozumne.", "cat": "programmes"}, {"channel": "intercom", "id": "215476023863623", "date": "2026-09-21 11:06", "day": "2026-09-21", "human": true, "bucket": "HUMAN", "reask": 5, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Membership Subscription Setup | Zooza Help", "Programmes List | Zooza Help", "Late bookings (pro-rata management) | Zooza Help", "Payments and Billing FAQ | Zooza Help", "FAQ — Programmes | Zooza Help", "Add a one-off scheduled payment | Zooza Help", "Where to find things in Zooza — quick reference | Zooza Help"], "q": "i have a question, when i set the subscription payment plan it says 300 lei for a month but it takes an initial first payment of 80 lei, which i don't like. how can i get rid of the first partial payment?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "i have a question, when i set the subscription payment plan it says 300 lei for a month but it takes an initial first payment of 80 lei, which i don't like. how can i get rid of the first partial payment?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "That first partial payment happens because of the Include Initial Full Scheduled Payment setting. \n\n\nTo remove it:\n\n\n\n\n- Go to your programme → Advanced settings\n\n\n- Set Aliquot price calculation to Full programme price\n\n\n- Uncheck Include Initial Full Scheduled Payment\n\n\n- Save\n\nAfter this, clients will only pay the normal monthly amount (300 lei) on the regular billing schedule, with no extra upfront payment.", "cited": ["Membership Subscription Setup | Zooza Help", "Payments and Billing FAQ | Zooza Help", "FAQ — Programmes | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "i don t see where is programme and then advanced settings", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "No problem — it’s a bit hidden 🙂\n\n\nStart here:\n\n\n\n\n- Go to Activities → Programmes\n\n\n- Click on your programme\n\n- Click Settings\n\n\n- Open the Price and Payment tile\n\n- Expand Advanced settings\n\n\nInside Advanced settings, you’ll see:\n\n\n\n\n- Aliquot price calculation\n\n- Include Initial Full Scheduled Payment\n\nUncheck Include Initial Full Scheduled Payment, then save. \n\n\nThat’s where the “first partial payment” comes from.", "cited": ["Programmes List | Zooza Help", "Where to find things in Zooza — quick reference | Zooza Help", "Late bookings (pro-rata management) | Zooza Help", "Membership Subscription Setup | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help finding the subscription payment settings, I’m here to help. Would you like to share which screen you are currently viewing?", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "it is not checked", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If Include Initial Full Scheduled Payment is already unchecked, the 80 lei is most likely a pro‑rata (aliquot) first payment.\n\n\nThis happens when Aliquot price calculation is set to calculate automatically by the remaining days in the month. In that case, the first payment is reduced based on when the client joins.\n\n\nTo avoid that partial first payment:\n\n\n\n\n- Go to Programme → Settings → Price and Payment → Advanced settings\n\n\n- Set Aliquot price calculation to Full programme price\n\n\n- Save\n\nThis makes every client pay the full monthly amount (300 lei) instead of a reduced first payment.\n\n\nIf you want, you can also tell me: is the Aliquot price calculation currently set to automatic or to Full programme price?", "cited": ["Membership Subscription Setup | Zooza Help", "FAQ — Programmes | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Add a one-off scheduled payment | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help adjusting the first subscription payment, I’m here to help. Would you like to share what you currently see under Aliquot price calculation?", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Rares,\n\n\nDid you get the answer you needed? It could be a booking fee or an aliquot (pro-rata) charge , if you're not sure, just let us know and we can look into it in more detail. Thanks for reaching out!", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "i have a group with 32 sessions starting from this friday until 11 june. i set the monthly price using subscription at 330 lei. how can I see when will the money be taken and how many times through the year?", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Rares,\n\n\nFeel free to send me the link to that group.\n\n\n\n\n\nHere's how it works: a membership charges the same amount every month, regardless of the session dates. The first payment may include an aliquot (pro-rata) amount covering the period up to the next billing cycle, usually the 1st of the month. After that, the membership is invoiced every month until the group ends. At registration you'll see the first 3 instalments, and the rest are generated gradually until the group finishes.\n\n\n\n\n\nThe best thing would be to create a registration yourself, you'll see the whole process from the client's point of view in their profile, and how it looks from the admin side at the same time. The client sees the schedule but can't change it after registering. The admin sees the schedule and can change it (for example, if you switch the payment plan from monthly to quarterly, it doesn't delete the money already received, it just gets applied to the new plan).\n\n\n\n\n\nHave a look, and we can always jump on a short call so you're completely sure about it. I know you're covering for Bianca right now, so we're happy to give you extra support.", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "I think I found out, if I have more question I will come back to you, thank you!", "cited": []}], "verdict": "check", "vtitle": "Rares: prvá čiastočná platba 80 lei pri 300/mesiac — booking fee alebo alikvót", "vnote": "Bot ponúkol 'Include Initial Full Scheduled Payment' — to nastavenie som v KB nenašiel. Michal: existuje? Ak nie, je to vymyslené a treba doplniť pravidlo. Nepísal som.", "cat": "pricing"}, {"channel": "intercom", "id": "215476024882778", "date": "2026-09-21 10:50", "day": "2026-09-21", "human": false, "bucket": "D_assumed_with_kb", "reask": 0, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": [], "q": "Hi Michal,   \n   Response from our accountants, please can you assist as my VAT is to be submitted imminently . The last issue regarding refunds/credit notes is one which we will need to find a solution to otherwise I am not compliant with the UAE FTA.   \n   Here is her responses below in blue:  \n  Stripe payments not syncing to Xero / invoices showing as Awaiting Payment\n\n From my side, the Zooza/Xero setup looks correct from last reconnection. The Xero bank account and revenue account are both configured in Zooza.\n\n https://asia.zooza.app/#settings/invoice_profiles/8\n\n \n\n Could you please send us a screenshot example of an invoice or list of invoices where this is happening? See screenshot below. As you can see, all the September invoices still show as “Awaiting payment” even though Stripe has probably settled the majority.\n\n \n\n  \n\n If what you are seeing is correct, then we need to investigate it properly, but at first glance it may be something on the Xero side. \n\n One thing to take into account: Zooza only request invoice generation once payment has been received and the debt for that period is settled, so there should not normally be a situation where the invoice is generated but the related payment is not reflected.\n\n 3. Refunds / credit notes in Xero\n\n Yes, this is confirmed.\n\n Zooza currently does not automatically generate credit notes for refunds in Xero. That is by design at the moment, because credit note/refund handling differs quite a lot by country and accounting setup.\n\n I think the way you are handling it,,, posting one credit note for the total,,, is reasonable, although I understand your ac
