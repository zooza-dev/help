, aby sa zmena preniesla naozaj vsade.\n\n\n\n\n\nVo vseobecnosti si ten model predstavte tak, ze mate hlavny objekt - Osoba. Osoba moze mat pridelenu identitu (email, ktorym sa je mozne prihlasit do systemu). Ak ma osoba pridelenu identitu, je to v ramci aplikacie identifikovane vzdy ako klient. Takato osoba moze byt tak ucastnik ako aj klient. Na druhu stranu osoba BEZ identity - moze mat vyplneny email, ale tymto emailom sa neda do systemu prihlasit. Takato osoba nikdy nemoze byt klient, vzdy moze byt iba ucastnik.\n\n\nJe to mozno trochu komplikovane, lebo na prvy pohlad je email ako email a rozmyslame, ako to v appke rozlisit, takze ak mate nejaky napad, radi prijmeme spatnu vazbu\n\n\n\n\n\nDakujem,\n\n\nMartin", "cited": []}], "verdict": "gap", "vtitle": "Účastník vs klient: e-mail klienta je unikátny na DB úrovni, účastníka nie; účastníkov si viete zlúčiť sami", "vnote": "Model Osoba → identita → klient. WRITTEN: client-management-faq + slovník (attendee do_not_confuse_with).", "cat": "clients"}, {"channel": "intercom", "id": "215476045907554", "date": "2026-09-24 13:54", "day": "2026-09-24", "human": true, "bucket": "HUMAN", "reask": 6, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "2 otazky\n\nDobrý deň,\n\nMal by som 2 otázky:\n\n1. klienti krotí sa prihlásia na skušobnú hodinu, potom sa z nej odhlásia, tak sa nevedia naspäť prihlásiť na skušobnú hodinu, stao sa to už viac krát, ako sa to dá prosím upraviť aby to boo možné?\n\n2.Ak sa klient prihlási na čakaciu listinu na náhradnú hodinu , a následne to admin manuálne potvrdí - tak klient ktorý bol nahlásený na čakaciu listinu nedostane žiadnu notifikáciu o tom, že bol nahlásený na náhradný termín. ( potvrdil som z dôvodu, že v danej skupine sú disciplinované deti a bolo ok aj keď bola skupina cez kapacitu). \n\nďakujem pekne za odpoveď\n\nS pozdravom \n\nMichal Kiss", "turns": [{"role": "customer", "who": null, "text": "2 otazky\n\nDobrý deň,\n\nMal by som 2 otázky:\n\n1. klienti krotí sa prihlásia na skušobnú hodinu, potom sa z nej odhlásia, tak sa nevedia naspäť prihlásiť na skušobnú hodinu, stao sa to už viac krát, ako sa to dá prosím upraviť aby to boo možné?\n\n2.Ak sa klient prihlási na čakaciu listinu na náhradnú hodinu , a následne to admin manuálne potvrdí - tak klient ktorý bol nahlásený na čakaciu listinu nedostane žiadnu notifikáciu o tom, že bol nahlásený na náhradný termín. ( potvrdil som z dôvodu, že v danej skupine sú disciplinované deti a bolo ok aj keď bola skupina cez kapacitu). \n\nďakujem pekne za odpoveď\n\nS pozdravom \n\nMichal Kiss", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Vážený Michal,\n\n\nváš tiket byl přijat. Asistent Zooza se vám pokusí ihned pomoci — a člen našeho týmu jej také osobně zkontroluje.\n\n\n— Podpora Zooza", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Michal, V prvom pripade asi by bolo fajn ak viete poslat nejaky priklad zakaznika, ktory sa odhlasil a snazil sa prihlasit na nahradnu hodinu. Uplne idealne aj s nejakym casom, kedy to priblizne skusal (aspon priblizne). Vo vseobecnosti pokial sa zakaznik odhlasi z hodiny system by mu mal priznat nahradnu hodinu rovnako ako beznemu ucastnikovi a tu nahradnu hodinu by si mal byt schopny vybrat. Co sa druhej otazky tyka - ano takato notifikacia neexistuje, mame ju v backlogu, ale momentalne existuje iba notifikacia o prihlaseni na dodatocnu hodinu ale nie na nahradnu.", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "Je to tak, že nikomu kto je prihlásený na skušobnú hodinu z ktorej sa odhlási, sa následne nedá prihlásiť späť na skušobnú. Jede taký prípad čo si pamätám čerstvo zo včera je Nina Kaiserová. Ale ako vravím nikto, kto sa odhási zo skušobnej už následne nejde prihlásiť späť.\nTen druhý prípad ako funguje v prípade že sú na čakacej listine a uvoľní sa miesto? automaticky ich to prihlási na hodinu alebo ?", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobrý deň, pán Kiss,\n\n\n\n\n\npozreli sme sa na registráciu Niny Kaiserovej (skúšobná hodina v skupine Motýle) aj na jej profil.\n\n\n\n\n\nČo sa stalo:\n21.9. o 15:05 sa pani Erika Kaiserová cez svoj profil odhlásila z termínu 22.9. Keďže to stihla v rámci limitu na odhlásenie, systém jej automaticky vytvoril náhradnú hodinu (kredit platný do 5.11.2026). O pár minút neskôr ste Ninu v dochádzke prihlásili cez „Prihlásiť na termín\" na 29.9. Tým vznikla nová, bežná účasť. Náhradná hodina však zostala nevyužitá a klientka ju má stále k dispozícii.\n\n\nVýsledok je, že za jeden odhlásený termín má klientka teraz dva: prihlásenie na 29.9. aj voľnú náhradnú hodinu.\n\n\n\n\n\nAko to riešiť nabudúce:\nKeď sa klient zo skúšobnej hodiny v limite odhlási, termín mu ručne nepridávajte. Nechajte ho, aby si cez svoj profil sám vybral náhradnú hodinu, ktorá mu za odhlásený termín vznikla. Náhrada sa tak naviaže na pôvodný termín a kredit sa spotrebuje.\n​\n\n\nČo s touto registráciou teraz:\nAby mala klientka len jednu hodinu, máte dve možnosti:\n\n\n\n\n- \nNechať prihlásenie na 29.9. a vymazať (deaktivovať) jej nevyužitú náhradnú hodinu, alebo\n\n- \nZrušiť prihlásenie na 29.9. a nechať pani Kaiserovú, aby si sama vybrala termín cez náhradnú hodinu.\n\n\n\n\nS pozdravom,\nZooza tim", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Čo sa týka registrácií, ktoré sú na čakacej listine - v prípade, že sa uvoľní miesto na termíne, na ktorý čaká viač čakateľov, každý z nich obdrží email s informáciou, že v danom termíne sa uvoľnili miesto a ak majú záujem, môžu sa cez priložený link na termín prihlásiť.\n\n\nV tomto prípade platí - kto skôr príde, ten skôr melie.\n\nPrihlasovanie sa nedeje automaticky, kliet to musí spraviť vedome \n\n\n\n\n\npekný deň\n\n\nZooza tím", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "Ide o to, že žiadny z klientov keď sa odhlási zo skušobnej hodiny, nemá vo svojom profile na výber náhradnu hodinu. Raz som sa prihlásil cez klientov profil a videl som že tam reálne ta možnosť nie je. Ako píšem, stalo sa to pri veľa klientoch, alebo to nikto z nich nevie používať vrátane mňa a tým pádom to nie je user friendly . Pamätám si, ako to napísalo, že na výber nie je žiaden z voľných termínov. Aj tak si ale vytvorím skušobnú hodinu testovacím profilom a následne sa skúsim odhlásiť či to dunguje alebo nie. \n\n\nĎakujem", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "Vytvoril som si skusobnu hodinu , oshlasil som sa z nej a následne som dostal možnosť sa prihlásiť iba na tú náhradnú hodinu, z ktorej som bol odhlásený.", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "543347 - Michal Kiss (marcel kiss)", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "novo vytvoreny testovaci profil", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "dobrý deň, mohli by ste sa prosím na to pozriet? dakujem", "cited": []}], "verdict": "verify", "vtitle": "Po odhlásení zo skúšobnej hodiny sa klient nevie prihlásiť späť; notifikácia z čakačky na náhradu neexistuje", "vnote": "Tech Support rozobral jeden prípad (admin pridal termín ručne, kredit ostal nevyužitý). Michal Kiss to ale testoval na vlastnom profile a tvrdí, že ponuka nie je. Otvorené — Michal: dorieši sa to?", "cat": "trials"}, {"channel": "intercom", "id": "215475857821177", "date": "2026-09-24 12:53", "day": "2026-09-24", "human": true, "bucket": "HUMAN", "reask": 11, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Trial sessions | Zooza Help", "Blocks Configuration and Management | Zooza Help", "Manage trial bookings — reschedule, convert, and close | Zooza Help", "Programme Settings | Zooza Help", "Blocks (Term Segments) FAQ | Zooza Help", "Trial Classes FAQ | Zooza Help", "Booking Widget FAQ | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Bookings | Zooza Help", "Transfer and Copy FAQ | Zooza Help", "Capacity vs extra capacity — who can take which seat | Zooza Help"], "q": "Can I turn off people being able to book workshops and just have them being able to book a trial?\n​", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "Can I turn off people being able to book workshops and just have them being able to book a trial?\n​", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes, you can do that.\n\n\nGo to Programme → Settings → Online Registration (Edit) and find Booking Options Shown on Website.\n\n\nChange it to Trials only.\n\n\nThis means clients will only see and book trial sessions on your website, and full programme enrolments will be hidden. \n\n\nYou can also control this per programme in the booking settings, where Trials only shows only trial sessions to clients. \n\n\nIf you want, I can also show you how to limit how many trials someone can book.", "cited": ["Manage trial bookings — reschedule, convert, and close | Zooza Help", "Booking Widget FAQ | Zooza Help", "Programme Settings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help adjusting your programme’s booking options, I’m here to help. Would you like to share more about how you want trial bookings to work?", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "Yes that was it", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I'm glad to hear that was what you needed! If you have any more questions or want to explore other options, please feel free to ask. I'm here to help! 😊", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "If someone's booked a trial slot not through zooza but through direct contact with us, how can I remove that trial session so it doesn't get booke again (i.e. 10.15 on Sunday 13/9)", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can block that specific date by cancelling the individual session.\n\n\nSteps:\n\n\n\n\n- Go to the class in your programme.\n\n- Open the Sessions tab.\n\n- Find Sunday 13/9 at 10:15.\n\n- Open the session and click Cancel session. \n\n\nThis removes that date from the client-facing calendar, so no one can book it again. The rest of the weeks stay available.\n\n\nIf you ever need to remove a booking entirely, you can also open the booking and use Delete booking. \n\n\nIf you want, I can also show a quick way to keep that time available for future weeks while still blocking just that one date.", "cited": ["Programmes, Timetables and Sessions FAQ | Zooza Help", "Bookings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "But I don't want to delete the session from the programme becuase it's still going ahead and there'll be other children who attend that session every week", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Got it — thanks for clarifying. In that case, don’t cancel the session.\n\n\nInstead, limit how many future trial dates clients can see.\n\n\n\n\n- Go to Programme → Settings → Trial\n\n\n- Find Sessions Shown in Form\n\n\n- Set it to a fixed number of sessions (for example 2–3 upcoming weeks)\n\nThis means the booking form only shows a small number of upcoming trial dates. The 10:15 session on 13/9 will still run internally, but it won’t appear as a bookable trial option for clients. \n\n\nYour regular attendees can still attend every week — you’re just hiding that specific date from the trial booking list. \n\n\nIf you want, I can also show a simple way to keep that time available for future weeks while still preventing new trial bookings on that exact date.", "cited": ["Programmes, Timetables and Sessions FAQ | Zooza Help", "Manage trial bookings — reschedule, convert, and close | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "But if the time is within 2-3 weeks then it'll still show", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You’re right — if the date is within the 2–3 week window, it will still appear as a trial option.\n\n\nThe only way to hide just that one date while keeping the class running every week is to disable online booking for that specific class:\n\n\n\n\n- Go to Programmes → open the programme → select the class\n\n\n- Open Settings → Edit\n\n\n- Uncheck Allow online booking\n\n\n- Save\n\nThis keeps the class in your system for internal use, but it will no longer appear on the public booking form. \n\n\nThe “sessions shown in form” setting can only limit how many upcoming sessions appear, not remove a single date. \n\n\nIf you want, I can also show a simple way to keep that time bookable for future weeks while still preventing new trial bookings on that exact date.", "cited": ["Programmes, Timetables and Sessions FAQ | Zooza Help", "Trial sessions | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "But it's set up using blocks", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ah, that helps — since you’re using blocks, you can control this at the block level.\n\n\nOpen the block that contains the Sunday 13/9 at 10:15 session and turn off trials for that block:\n\n\n\n\n- Go to Programmes → open the class\n\n\n- Open the Price and Payment tile\n\n- Click the block that contains that date\n\n- Find Offer trial lessons for this block\n\n\n- Set it to No\n\n\n- Save\n\nThat block’s dates will stop appearing as trial bookings, while the class and other blocks can still run normally. \n\n\nOne thing to watch: if that session belongs to two blocks, it will still appear as a trial if any of those blocks has trials enabled.\n\n\nIf you want, I can also show a quick way to keep that time bookable for future weeks while still preventing new trial bookings on that exact date.", "cited": ["Blocks (Term Segments) FAQ | Zooza Help", "Blocks Configuration and Management | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "But I want other weeks at the same time to still be bookable", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You’re right to flag that — with blocks, there isn’t a way to hide just one specific date while keeping the same time bookable in other weeks.\n\n\nThe block setting Offer trial lessons for this block applies to all dates inside that block. If you turn it off, every session in that block disappears from trial bookings. \n\n\nSo in your case:\n\n\n\n\n- You can’t hide only Sunday 13/9 at 10:15 while keeping other Sundays at 10:15 bookable.\n\n- The system only allows trial control at the block level, not per individual session.\n\nIf you want, I can also show a simple workaround many schools use to manage this situation without affecting future bookings.", "cited": ["Blocks (Term Segments) FAQ | Zooza Help", "Blocks Configuration and Management | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Does this clarify things?", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "Yes show me the workarouund", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Good question — this is a common situation with blocks.\n\n\nWorkaround: limit the trial to extra capacity only and set that number to 1.\n\n\n\n\n- Go to Programme → Settings → Trial\n\n\n- Set Trial bookings use extra capacity only\n\n\n- Set the class Extra capacity to 1\n\n\nThis means:\n\n\n\n\n- The 10:15 session on 13/9 can still run normally for your regular attendees.\n\n- Only one trial spot is available for that date.\n\n- Once that spot is taken, the session disappears from the booking form. \n\n\nIf the trial is booked outside Zooza, you can simply leave that extra spot unused so no one else can book it online. \n\n\nIf you want, I can also show a simple way to keep that time fully open for future weeks while still preventing new trial bookings on that exact date.", "cited": ["Trial Classes FAQ | Zooza Help", "Capacity vs extra capacity — who can take which seat | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "But the trial hasn't been booked through zooza they messaged us directly", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Got it — thanks for clarifying. Since the trial was arranged outside Zooza, there isn’t a way to hide just that one date while keeping the same time bookable in other weeks.\n\n\nIn Zooza, trial availability is controlled at the block level, not per individual session. If a block allows trials, all sessions in that block can appear as trial options. \n\n\nSo the practical options are:\n\n\n\n\n- \nLeave it as is and simply don’t book that spot in Zooza.\n\n- \nCancel the specific session (Class → Sessions → open the session → Cancel session). This removes it from the client calendar, but the class will still run for your regular attendees. \n\n\nBecause the booking happened outside the system, Zooza can’t automatically block only that one date while keeping future weeks bookable.\n\n\nIf you want, I can also share a simple process many schools use to manage “offline” trials so they don’t accidentally get booked online.", "cited": ["Programmes, Timetables and Sessions FAQ | Zooza Help", "Blocks Configuration and Management | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help managing this offline trial without affecting future weeks, I’m here to help. Would you like to share more about how you currently record these direct bookings?", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "How do I edit a booking to select a specific block?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can change the block directly from the booking’s attendance view.\n\n\n\n\n- Open the booking detail\n\n\n- Go to the Attendance view\n\n- Change the client’s block assignment there\n\nThis is the correct way to move a client between blocks within the same class. \n\n\nNote: when you change the block, the previous attendance records are marked as Hidden (not deleted), so it’s worth exporting attendance first if you need a record of it.", "cited": ["Blocks Configuration and Management | Zooza Help", "Transfer and Copy FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Does this clarify things?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Katherine, were you able to do what you were after or you still need help?", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "Yes I was thank you, I just forgot how to find the right setting", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Great, if anything crops up, don't hesitate to contact us again:)", "cited": []}], "verdict": "check", "vtitle": "Ponúkať len skúšobné hodiny, nie workshopy → Booking Options Shown on Website = Trials only", "vnote": "Bot to trafil prvým razom; zvyšok vlákna je z predchádzajúcich týždňov (skrytie jedného termínu v bloku). Klientka: 'Yes I was thank you, I just forgot how to find the right setting'.", "cat": "trials"}, {"channel": "intercom", "id": "215476082737489", "date": "2026-09-24 12:46", "day": "2026-09-24", "human": true, "bucket": "HUMAN", "reask": 0, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Data correction or change client's data | Zooza Help", "Clients | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Invoice buyer data (orderer details) | Zooza Help"], "q": "Pekny den prajem , \n\nMame dvoch klientov ktorym sme potrebovali zmenit meno prihlasovatela kvoli tomu ze si faktury davaju preplacat u zamestnavatela a uz dva krat nam to bolo zamietnute \n\nMeno klienta Petra Marko a Romana Vránová\n\nS pozdravom / Kind regards\n\n \n\n \n\nKatarína Gráčiková\n\nMaly plavec s.r.o.\n\nHurbanova 1891/11\n\n955 01 Topoľčany\n\nTel: +421 905 165 799\n\nEmail: info@malyplavec.sk", "turns": [{"role": "customer", "who": "Katarina Gracikova", "text": "Pekny den prajem , \n\nMame dvoch klientov ktorym sme potrebovali zmenit meno prihlasovatela kvoli tomu ze si faktury davaju preplacat u zamestnavatela a uz dva krat nam to bolo zamietnute \n\nMeno klienta Petra Marko a Romana Vránová\n\nS pozdravom / Kind regards\n\n \n\n \n\nKatarína Gráčiková\n\nMaly plavec s.r.o.\n\nHurbanova 1891/11\n\n955 01 Topoľčany\n\nTel: +421 905 165 799\n\nEmail: info@malyplavec.sk", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Hi Katarína,\n\n\nThanks for reaching out! I'm Zooza Support, Zooza's AI Agent and I'm well trained to answer your query but you can reply and ask for the team at any time.\n\n\nPriamo zmena mena klienta v Zooze sa robí prostredníctvom žiadosti o korekciu údajov klienta v jeho profile. Túto žiadosť je potrebné odoslať a následne čaká na schválenie. \n\n\nPostup:\n\n\n\n\n- Otevriť profil klienta v Clients\n\n\n- Použiť možnosť Data correction\n\n\n- Zmeniť meno (prvé meno alebo priezvisko)\n\n- Kliknúť na Submit na odoslanie žiadosti \n\n\nSchválenie a spracovanie zmeny sa zvyčajne realizuje do približne 2 dní.\n\n\nDôležité: táto zmena sa aplikuje na všetky existujúce rezervácie daného klienta.\n\n\nAk ide iba o meno na faktúre (napr. zamestnávateľ), stačí upraviť profil v Invoice Buyer Data a následne použiť Regenerate invoices na rezervácii.  \n\n\nProsím, dejte mi vedieť, či to pomáha alebo či máte ešte nejaké ďalšie otázky.\n\n\nData correction or change client's data | Zooza Help\nClients | Zooza Help\nInvoice buyer data (orderer details) | Zooza Help\nPayments and Billing FAQ | Zooza Help", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Katka, neviem teraz presne dovody preco sme Vam to zamietli, zvacsa to robime v situacii, ked by sa zmenou emailu stratil pristup zakaznika k jeho registraciam v inych firmach. Konkretne Vasu situaciu ale viete vyriesit inak. V pripade ak ide o zmenu klienta - kupujuceho - v zooze mame na to samostatnu funkcionalitu. Priamo na detaile registracie mate dve karty - Ucastnik a Klient. Pri klientovi mate moznost kliknut na Zmenu klienta a vybrat ineho klienta. Nie je potrebne menit jeho udaje. V pripade ak tohto klienta nemate v databaze, vyrobte mu jednu registraciu manualne a nasledne sa Vam v zozname zobrazi. V pripade ak ale potrebujete upravit iba fakturacne udaje, nie je potrebne robit ani toto. Kazdu fakturu totiz viete vystavit nezavisle od klienta. Ked vojdete do detailu registracie a nasledne prejdete na Faktury -> vpravo hore mate tlacitko - Pridat udaje o odberatelovi. Tam mozete zadat fakturacne udaje a fakturu vystavit voci tymto udajom. Udaje sa potom zdielaju medzi jednotlivymi registraciami toho isteho klienta, teda ked nabuduce bude mat ten isty klient inu registraciu - budete vediet tie fakturacne udaje prepouzit.", "cited": []}], "verdict": "check", "vtitle": "Zamietnutá zmena mena prihlasovateľa → použiť Zmena klienta", "vnote": "Presne to, čo sme minulý týždeň napísali do client-management-faq. Potvrdené druhýkrát.", "cat": "clients"}, {"channel": "intercom", "id": "215476080570439", "date": "2026-09-24 12:11", "day": "2026-09-24", "human": true, "bucket": "HUMAN", "reask": 2, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Nezaevidovana platba\n\ndobry - prisla platba, ktoru vidim riadne v internetbankingu a ma aj riadne udaje vobec nie je uvedena v doslych platbach, ani nesparovanych v zooze. preco? \nhttps://zooza.app/#registrations/523392/payments", "turns": [{"role": "customer", "who": null, "text": "Nezaevidovana platba\n\ndobry - prisla platba, ktoru vidim riadne v internetbankingu a ma aj riadne udaje vobec nie je uvedena v doslych platbach, ani nesparovanych v zooze. preco? \nhttps://zooza.app/#registrations/523392/payments", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Vážený Mikuláš,\n\n\nváš tiket byl přijat. Asistent Zooza se vám pokusí ihned pomoci — a člen našeho týmu jej také osobně zkontroluje.\n\n\n— Podpora Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den, dovodov moze byt velmi vela. Na to aby sme zistili ci ku nam vobec platba prisla potrebujeme viac udajov o nej. Viete prosim poslat screenshot z internet bankingu s podrobnostami o transakcii? Dakujem.", "cited": []}, {"role": "customer", "who": "Mikuláš Fedor", "text": "V prilohe\nMikuláš Fedor Trainer & Franchiseewww.mladiinzinieri.skTel: +421 950 446 110Email: futureengineers@youngengineers.sk\n​", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den, v tom case sme zaznamenali vypadky parovania platieb voci Fio banke. Zavadzali totiz nove emailove sablony a niektore transakcie chodili este po starom a niektore uz po novom. Zaroven experimentovali s odosielatelom tychto sprav a tak posielali notifikacie z roznych emailovych adries. V ramci bezpecnosti prijimame notifikacie iba z overenych oficialnych emailovych adries (aby sa napriklad nestalo, ze niekto posle vymyslenu uhradu zo svojho vlastneho emailu). Tato situacia trvala zhruba dva tyzdne a zaciatkom septembra (2heho) sme uz zaznamenali stabilizaciu zo strany Fio banky. Cize v rozpati 18 august a 2 september mozete najst viacero platieb, ktore mate v bankingu ale nie v Zooze.", "cited": []}, {"role": "customer", "who": "Mikuláš Fedor", "text": "To by sedelo, lebo vtedy som nemal vela platieb a toto je zatial jedna co som zistil. Dik za info, aktualne to vyzera byt ok\n​\n\n\nMikuláš Fedor\n\n\nTrainer & Franchisee\n\n\nwww.mladiinzinieri.sk\nTel:+421 950 446 110\n\n\nEmail:futureengineers@youngengineers.sk\n\n\n\n \n\n\n\n​", "cited": []}], "verdict": "client", "vtitle": "Platba v banke, v Zooze nikde — čaká sa na screenshot z bankingu", "vnote": "—", "cat": "payments"}, {"channel": "intercom", "id": "215476082213906", "date": "2026-09-24 12:03", "day": "2026-09-24", "human": true, "bucket": "HUMAN", "reask": 7, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": ["Authentication | Zooza Developer Docs", "Deploying Zooza app on your website | Zooza Help", "Quickstart | Zooza Developer Docs", "Getting Help and Support | Zooza Help"], "q": "@Martin Rapavy - can you please send me a new API Key, I made the mistake to forward it via Whatsapp and the dev team now says we shouldn't use it. Thanks!", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Wie kann ich helfen?", "cited": []}, {"role": "customer", "who": "API Connect", "text": "@Martin Rapavy - can you please send me a new API Key, I made the mistake to forward it via Whatsapp and the dev team now says we shouldn't use it. Thanks!", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "A new REST API key cannot be generated from inside the app. It must be requested from our support team. \n\n\nPlease send a short request to:\n\n\nsupport@zooza.online\n\n\nInclude that the previous key was shared via WhatsApp and needs to be replaced. The team can then issue a new REST API key and client secret for your integration.", "cited": ["Authentication | Zooza Developer Docs", "Deploying Zooza app on your website | Zooza Help", "Quickstart | Zooza Developer Docs", "Getting Help and Support | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "API Connect", "text": "Please forward the message to Martin Rapavy. Thx.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I’m not able to forward messages to specific people.\n\n\nTo request a new REST API key, please email support@zooza.online and explain that the previous key was shared via WhatsApp and needs to be replaced. The team can then issue a new REST API key and client secret. \n\n\nYou can also create a support ticket from the Help & Support screen in the app if you prefer.", "cited": ["Authentication | Zooza Developer Docs", "Getting Help and Support | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "API Connect", "text": "No, connect to the team here, please.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I will connect you with someone from our team shortly. Meanwhile, could you please provide any additional details about your request to help them assist you more efficiently?", "cited": []}, {"role": "customer", "who": "API Connect", "text": "I'm referring to a previous exchange here with Martin, he knows what this is about.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi, no worries, the API key is public information. Only client secret is a private part so unless you compromised that, you're good. All api calls need user token which you obtain only with the combination of API key and Client secret.", "cited": []}, {"role": "customer", "who": "API Connect", "text": "Thanks, Martin. I just checked, I sent both 🙈, please send me a new Client secret ... 😇", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ok, here is the rotated secret: Tv96WsT25prhVgD79AmD76QbIZkMFfdx", "cited": []}, {"role": "customer", "who": "API Connect", "text": "ok, thanks, I'll keep it secret, this time 🙈🤦‍♂️😇", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "We should put this in the app anyways so you can manage that yourself. One day when we have nothing else to do... :)\nHave a great rest of the day. Should you have any questions on the endpoints, feel free to reach out.", "cited": []}, {"role": "customer", "who": "API Connect", "text": "Thanks, Martin - I'll have a meeting with them and we will see if there are any open items that pop up. Appreciate your support! Best wishes from Austria,\n\n\n\n\n\nMartin", "cited": []}], "verdict": "check", "vtitle": "API kľúč je verejná informácia, súkromný je len client secret", "vnote": "Zaujímavé, ale deploying-zooza-on-website to nepotrebuje. Nechal som.", "cat": "account"}, {"channel": "intercom", "id": "215476082274223", "date": "2026-09-24 11:57", "day": "2026-09-24", "human": false, "bucket": "D_assumed_with_kb", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "nefungujuci proces registracie po skusobnom treningu\n\nAhojte, \n\nklienti nam hlasia problem s ukoncenim registracie po skusobnom treningu. Presla som si cely proces a je to tak. na konci vyhadzuje chybu. \n\nOkrem toho, ak si existujuci klient chce robit dalsiu registraciu tak ho stale pyta udaje -adresu a datum narodenia.\n\nDakujem, \n\nJanka\n\nPS- robila som to na tejto registracii cca 13:53 pre nahlad logov.\n\nhttps://zooza.app/#registrations/543767/attendance", "turns": [{"role": "customer", "who": null, "text": "nefungujuci proces registracie po skusobnom treningu\n\nAhojte, \n\nklienti nam hlasia problem s ukoncenim registracie po skusobnom treningu. Presla som si cely proces a je to tak. na konci vyhadzuje chybu. \n\nOkrem toho, ak si existujuci klient chce robit dalsiu registraciu tak ho stale pyta udaje -adresu a datum narodenia.\n\nDakujem, \n\nJanka\n\nPS- robila som to na tejto registracii cca 13:53 pre nahlad logov.\n\nhttps://zooza.app/#registrations/543767/attendance", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Vážený Warrior,\n\n\nváš tiket byl přijat. Asistent Zooza se vám pokusí ihned pomoci — a člen našeho týmu jej také osobně zkontroluje.\n\n\n— Podpora Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}], "verdict": "product", "vtitle": "Chyba pri dokončení registrácie po skúšobnom tréningu; existujúci klient je opäť pýtaný o adresu a dátum narodenia", "vnote": "Bug + otázka o predvyplnení. Súvisí s Kieranovým duplikátom.", "cat": "trials"}, {"channel": "intercom", "id": "215476081239530", "date": "2026-09-24 10:05", "day": "2026-09-24", "human": true, "bucket": "HUMAN", "reask": 1, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Blocks Configuration and Management | Zooza Help", "Blocks (Term Segments) FAQ | Zooza Help", "Dynamic tags | Zooza Help"], "q": "Zdravím,\nnie je možné dynamickú značku *COURSE_TIME* nastaviť tak, aby ukazovala aj čas konca tréningu. Alebo pridať značku *COURSE_TIME_END*. \nV súčasnosti sa zobrazuje iba čas začiatku tréningu, čo je neúplná informácia. \nĎakujem\nJakub_MEDVEDICA", "turns": [{"role": "customer", "who": "Jakub Majoroš", "text": "Zdravím,\nnie je možné dynamickú značku *COURSE_TIME* nastaviť tak, aby ukazovala aj čas konca tréningu. Alebo pridať značku *COURSE_TIME_END*. \nV súčasnosti sa zobrazuje iba čas začiatku tréningu, čo je neúplná informácia. \nĎakujem\nJakub_MEDVEDICA", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Hi Jakub,\n\n\nThanks for reaching out! I'm Zooza Support, Zooza's AI Agent and I'm well trained to answer your query but you can reply and ask for the team at any time.\n\n\nAt the moment, the dynamic tag COURSE_TIME only outputs the start time of the programme. A tag for the end time (such as COURSE_TIME_END) is not currently available. \n\n\nAs a workaround, you can use the tag ORDER_SUMMARY in your email templates. This tag includes the full booking information, such as the programme, class, dates, and time slot, which helps clients see the correct schedule in confirmation emails.\n\n\nIf you are using blocks, you can also include the time in the block name (for example “Mondays 17:00”), because ORDER_SUMMARY will display that block name in the message. \n\n\nPlease let me know if this helps or if you have any further questions.\n\n\nDynamic tags | Zooza Help\nBlocks Configuration and Management | Zooza Help\nBlocks (Term Segments) FAQ | Zooza Help", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Jakub, samostatna znacka iba na koniec skupiny neexistuje. Najblizsie k tomu je znacka COURSE_DATE_START_END ktora obsahuje zaciatok a koniec skupiny ale nie jej cas. O co presne Vam ide? Ukazat posledny termin v skupine a jeho koniec? teda Zaciatok terminu + jeho trvanie? alebo nieco ine?", "cited": []}, {"role": "customer", "who": "Jakub Majoroš", "text": "Zdravím,\n\n\nukázať, kedy sa hodina/tréning začína a končí. Máme krúžky, kde aj deti vozíme a potom sa vracajú späť. Celkový čas \"lekcie\" tak môže byť aj 120 min ap. Aby mali v emaily rodičia jasnú informáciu, kedy sa tréning začína (vyzdvihovanie) a kedy si ich môžu prevziať späť v škole, čo je vlastne ukončenie tréningu. Ak je tam iba čas začiatku, rodičov môže mýliť. \n\n\nS pozdravom\n\n\nJakub", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Otazka je ci ide o uroven skupiny - potvrdenie registracie, alebo o uroven na termine - ranne pripomienky. Skupina a terminy mozu mat odlisnu dlzku. Pondelkove treningy mozu byt 60 minutove a kazdy druhy piatok mozu byt 120 minutove, preto sa pytam, ze o co presne ide. Na urovni skupiny mame znacku SCHEDULE_DURATION, ktora sa da pouzit pre ucely potvrdenia registracie na vyskladanie niecoho takehoto: Trening trva SCHEDULE_DURATION minut. Nie je to ideal ale da sa to urobit uz teraz. Ak by ste chceli konkretnu znacku, ktora by vyhodila koniec skupiny (cas) tak to by sme museli dorobit. Skuste mozno napisat konkretny text, ktory by ste chceli posielat zakaznikom a od toho to odvodime", "cited": []}], "verdict": "gap", "vtitle": "Neexistuje značka pre koniec termínu; COURSE_TIME je len začiatok", "vnote": "WRITTEN: dynamic-tags poznámka.", "cat": "comms"}, {"channel": "intercom", "id": "215476081191307", "date": "2026-09-24 09:50", "day": "2026-09-24", "human": false, "bucket": "D_assumed_with_kb", "reask": 3, "resolution": "confirmed_resolution", "rating": null, "carried": null, "sources": ["Cancellation limit settings | Zooza Help", "Make-up Sessions FAQ | Zooza Help", "Settings | Zooza Help", "23 docs tagged with \"settings\" | Zooza Help"], "q": "Cancellation limits help file please", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "Cancellation limits help file please", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can set a cancellation deadline for all sessions in your account.\n\n\n\n\n- Go to Settings → Programmes\n\n\n- Turn Set a limit for cancelling a scheduled session to Yes. \n\n\nThen choose the limit type:\n\n\n\n\n- \nFixed time – clients must cancel by a specific hour the day before the session.\n\n- \nRelative time – clients must cancel a set number of hours before the session starts.\n\nOptional settings:\n\n\n\n\n- \nAllow cancellations after the limit – clients can still cancel but no make‑up credit is given.\n\n- \nInstructions for the client – message shown when the deadline has passed.\n\n- \nBlock cancellations on weekends and holidays – moves the deadline to the previous working day.\n\nThis setting is global and applies to all programmes.", "cited": ["Cancellation limit settings | Zooza Help", "Make-up Sessions FAQ | Zooza Help", "Settings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "Yes but I want to send a link to a colleague with the explanation.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can send them this help article:\n\n\nhttps://help.zooza.online/programmes/cancellation-limit-settings/ \n\n\nIt explains how the cancellation limit works, including:\n\n\n\n\n- setting the deadline (fixed time or hours before the session)\n\n- allowing or blocking late cancellations\n\n- showing a custom message to clients when the limit is reached.", "cited": ["Cancellation limit settings | Zooza Help", "23 docs tagged with \"settings\" | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "yes", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I'm glad I could assist you! Please feel free to reach out if you have any more questions or need further help with Zooza. I'm here for you! 😊", "cited": []}], "verdict": "check", "vtitle": "Sarah: článok o limite zrušenia — bot poslal priamy odkaz na help.zooza.online", "vnote": "Prvýkrát vidím bota posielať link do helpu. Presne to chceme.", "cat": "makeups"}, {"channel": "intercom", "id": "215476055847818", "date": "2026-09-24 09:47", "day": "2026-09-24", "human": true, "bucket": "HUMAN", "reask": 1, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Network Application | Zooza Help", "Franchise and Multi-location Networks | Zooza Help"], "q": "Ahoj Maťo, \n\n prosím vieme spraviť a sprístupniť v reporte pre franšízy nejaký náhľad ich franš. poplatkov za produkty ? Ja to vidím v tej appke, ale chcem aby to videli aj oni priebežne. \n\n bolo by to možné ?:)\n\n diik za odpoveď\n\n --", "turns": [{"role": "customer", "who": "Zuzana Svoreňová", "text": "Ahoj Maťo, \n\n prosím vieme spraviť a sprístupniť v reporte pre franšízy nejaký náhľad ich franš. poplatkov za produkty ? Ja to vidím v tej appke, ale chcem aby to videli aj oni priebežne. \n\n bolo by to možné ?:)\n\n diik za odpoveď\n\n --", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Hi Zuzana,\n\n\nThanks for reaching out! I'm Zooza Support, Zooza's AI Agent and I'm well trained to answer your query but you can reply and ask for the team at any time.\n\n\nYes, this is possible through the Network Application reporting dashboard. It provides a shared reporting view across the whole network and can be filtered by company, product, location, and time period. \n\n\nIn this dashboard you can also see Royalties per branch, which are calculated based on rules defined at the network level. This allows franchisees to monitor their franchise-related fees alongside other metrics such as payments and revenue. \n\n\nThe reporting view is interactive and can switch between:\n\n\n\n\n- \nCompanies view – aggregated per franchisee\n\n- \nPlaces view – aggregated per location\n\nThis makes it easier for franchisees to analyse their own performance within the network.\n\n\nPlease let me know if this helps or if you have any further questions.\n\n\nFranchise and Multi-location Networks | Zooza Help\nNetwork Application | Zooza Help", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Cauko, cize by si chcela aby videli aktualny stav ich poplatku u seba vo svojich aplikaciach?", "cited": []}, {"role": "customer", "who": "Zuzana Svoreňová", "text": "Ahoj, áno. \n\n\nAby vedeli koľko majú za mesiac odviezť poplatok \n\n\n---\n​\n\n\n\n​\n\n\nDňa 2026-09-23 09:02 Martin from Zooza napísal(a):    \n\n\nCauko, cize by si chcela aby videli aktualny stav ich poplatku u seba vo svojich aplikaciach?    \n\n\nMartin Rapavý\n\n\nZoozahelp.zooza.onlineThis email and any attachments are confidential and intended solely for the recipient. If you are not the intended recipient, please notify the sender and delete this email. Any unauthorised use, disclosure, or distribution is prohibited.  On Tue, Sep 22, 2026 at 21:32 PM, Zooza Support from Zooza \u003csupport@zooza.online> wrote:\n​\n\n\nHi Zuzana,\n\n\nThanks for reaching out! I'm Zooza Support, Zooza's AI Agent and I'm well trained to answer your query but you can reply and ask for the team at any time.\n\n\nYes, this is possible through the Network Application reporting dashboard. It provides a shared reporting view across the whole network and can be filtered by company, product, location, and time period.\n\n\nIn this dashboard you can also see Royalties per branch, which are calculated based on rules defined at the network level. This allows franchisees to monitor their franchise-related fees alongside other metrics such as payments and revenue.\n\n\nThe reporting view is interactive and can switch between:\n\n\n\n\n- \nCompanies view – aggregated per franchisee\n\n- \nPlaces view – aggregated per location\n\nThis makes it easier for franchisees to analyse their own performance within the network.\n\n\nPlease let me know if this helps or if you have any further questions.\n\n\nFranchise and Multi-location Networks | Zooza Help\nNetwork Application | Zooza Help", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobre, skuste sa prosim nad tym zamysliet, ze ako by ste to chceli realizovat a potom to spravime. Ide o to, ze zrejme tam mate nejaky cutoff datum, cize napriklad by to mohlo vyzerat: Jun 2025 - 1000 Eur (predbezne, uzavierka 13. Jula 2026)\n\n\nAlebo mozete povedat, ze nebudeme ukazovat ten poplatok cely mesiac ale len povedzme tyzden pred uzavierkou. Hocico, len mi ide o to aby sa predislo nejakemu zbytocnemu rozruchu v sieti, ked si budu ludia porovnavat co komu kedy vychadza (zname svy lidi:))", "cited": []}], "verdict": "product", "vtitle": "Franšízy chcú vidieť svoje poplatky za produkty vo vlastnej appke — feature request", "vnote": "Nie KB.", "cat": "reports"}, {"channel": "intercom", "id": "215475961392012", "date": "2026-09-24 09:18", "day": "2026-09-24", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Login and Account FAQ | Zooza Help", "Roles and Permissions FAQ | Zooza Help", "Role Selection Guide | Zooza Help", "User roles | Zooza Help", "Add instructors and manage their access | Zooza Help"], "q": "ako pridať email pre dalsieho uživateľa zoozy", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Petra Navara", "text": "ako pridať email pre dalsieho uživateľa zoozy", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Pre pridanie emailu ďalšiemu užívateľovi v Zooze:\n\n\n\n\n- Prejdite do Settings → Team.\n\n- Kliknite Add.\n\n- Zadajte meno a email nového užívateľa.\n\n- Vyberte jeho rolu (napr. instructor, admin, receptionist).\n\n- Kliknite Add new user. \n\n\nUžívateľ dostane prihlasovací email. Prihlasovanie je bez hesla – na prihlasovacej stránke zada email a dostane prihlasovací link. \n\n\nDoporučenie: každý člen tímu by mal mať vlastný email, aby boli správne evidované oprávnenia a notifikácie.\n\n\nAk chcete, môžem vám tiež ukázať, ako nastaviť správne role pre tím.", "cited": ["Login and Account FAQ | Zooza Help", "Add instructors and manage their access | Zooza Help", "User roles | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak potrebujete ďalšiu pomoc s pridaním používateľa alebo nastavením jeho roly, som vám k dispozícii. Chcete doplniť, čo ešte potrebujete v Zooze nastaviť?", "cited": []}, {"role": "customer", "who": "Petra Navara", "text": "potrebujem vidiet neaktivnych lektorov", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Petra, neaktívnych lektorov môžete vidieť v Settings → Team → Access.\n\n\nNa tejto obrazovke sa nachádza zoznam všetkých používateľov. Pri každom lektorovi vidíte jeho rolu. Ak je nastavená Inactive instructor, je to neaktívny lektor.\n\n\nTento stav znamená:\n\n\n\n\n- lektor sa nemôže prihlásiť\n\n- všetky dáta zostávajú zachované (dochádzka, termíny, výplaty)\n\nAk chcete, môžem vám tiež ukázať, ako ich znova aktivovať.", "cited": ["Role Selection Guide | Zooza Help", "Roles and Permissions FAQ | Zooza Help", "User roles | Zooza Help", "Add instructors and manage their access | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Dostali jste odpověď na svou otázku?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc so zobrazením neaktívnych lektorov, som vám k dispozícii. Chcete doplniť, čo presne potrebujete v tejto časti Zoozy vyriešiť?", "cited": []}], "verdict": "check", "vtitle": "Pridať e-mail ďalšiemu používateľovi; neaktívni lektori", "vnote": "Bot z helpu, správne.", "cat": "team"}, {"channel": "intercom", "id": "215476072758054", "date": "2026-09-24 07:12", "day": "2026-09-24", "human": true, "bucket": "HUMAN", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "náhradná hodina\n\nDobrý deň, \nhttps://zooza.app/#registrations/538081 tohto klienta neviem prihlásiť na náhradnú hodinu Junior v piatok 23.9. o 9:50 v Prievidzi. Viete mi s tým pomôcť, prečo to tak je?\nĎakujem\nMaťka\nBaby Balance", "turns": [{"role": "customer", "who": null, "text": "náhradná hodina\n\nDobrý deň, \nhttps://zooza.app/#registrations/538081 tohto klienta neviem prihlásiť na náhradnú hodinu Junior v piatok 23.9. o 9:50 v Prievidzi. Viete mi s tým pomôcť, prečo to tak je?\nĎakujem\nMaťka\nBaby Balance", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Vážený Martina,\n\n\nváš tiket byl přijat. Asistent Zooza se vám pokusí ihned pomoci — a člen našeho týmu jej také osobně zkontroluje.\n\n\n— Podpora Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Martina, pre kazdu nahradnu hodinu si viete priamo v aplikacii pozriet, ci je lubovolny termin dostupny alebo nedostupny pre klienta v jeho profile. Najdite si prislusny kredit a kliknite na tlacitko diagnostika nahrad. Nasledne iba zvolite termin a system Vam ukaze, preco sa dany termin zobrazuje / nezobrazuje.", "cited": []}], "verdict": "check", "vtitle": "Náhradná hodina sa nedá prihlásiť — diagnostika kreditu", "vnote": "MATKO, presne ako v KB. Fine.", "cat": "makeups"}, {"channel": "intercom", "id": "215476079937611", "date": "2026-09-24 07:04", "day": "2026-09-24", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Transfer and copy bookings | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Edit payment on booking | Zooza Help", "Transfer and Copy FAQ | Zooza Help", "A client wants to move to a later date | Zooza Help"], "q": "Keď presúvam registráciu zo skupiny do skupiny s rozličnou sumou, zvolím použiť nový platobný plán a sumu tam mám nechať ako je?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Keď presúvam registráciu zo skupiny do skupiny s rozličnou sumou, zvolím použiť nový platobný plán a sumu tam mám nechať ako je?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Nie. Pri presúvaní registrácie medzi skupinami s rôznou cenou je odporúčané zaškrtnúť Do not change payments (nezmeniť platby). \n\n\n\n\n- Toto ponechá pôvodný platobný plán a sumy tak, ako boli. \n\n\n- Ak tento checkbox neznačíte, systém nahraje platobný plán z cieľovej skupiny a môže sa prepísať váš pôvodný plán.\n\nPo presúvaní môžete cenu alebo plán ešte ručne upraviť na registrácii, ak je to potrebné.", "cited": ["Transfer and copy bookings | Zooza Help", "Transfer and Copy FAQ | Zooza Help", "A client wants to move to a later date | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "ako zmením celkovú sumu?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Celkovú sumu môžete zmeniť dvoma spôsobmi:\n\n\n\n\n- Pri presúvaní registrácie: v kroku Set up payments zvolte Custom amount a zadajte novú celkovú sumu. \n\n\n- Po presúvaní: otvorte registráciu → sekcia Payments → upravte Amount owed (suma, ktorú klient musí zaplatiť). \n\n\nTáto suma sa dá meniť aj pomocou zľavy, nových platieb alebo úpravy platobného plánu.", "cited": ["Transfer and copy bookings | Zooza Help", "Edit payment on booking | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak potrebujete s úpravou celkovej sumy ešte pomôcť, som tu pre vás. Chcete doplniť, v ktorom kroku sa vám nedarí sumu zmeniť?", "cited": []}], "verdict": "check", "vtitle": "Presun medzi skupinami s inou cenou", "vnote": "Fine.", "cat": "bookings"}, {"channel": "intercom", "id": "215476079133253", "date": "2026-09-24 04:22", "day": "2026-09-24", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "confirmed_resolution", "rating": null, "carried": null, "sources": ["Managing client attendance — admin | Zooza Help", "Entry pass — client view | Zooza Help"], "q": "If a child is marked as attended in a Friday Club session, will that automatically deduct a session from their purchased passes if they didn't book as Will Attend?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "If a child is marked as attended in a Friday Club session, will that automatically deduct a session from their purchased passes if they didn't book as Will Attend?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "No. Marking a child as Attended does not deduct a pass entry. \n\n\nPass entries are deducted only when the client books a session in a Pay-as-you-go programme. The system removes one entry at the moment of booking. \n\n\nSo if the child was not booked as “Will attend” for that session, marking them as attended will not automatically deduct a pass entry.", "cited": ["Entry pass — client view | Zooza Help", "Managing client attendance — admin | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Yes - thanks!", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You are very welcome! I am glad I could clarify that for you. Please let me know if there is anything else I can help you with today.", "cited": []}], "verdict": "check", "vtitle": "Označenie 'Attended' nestrhne vstup z permanentky", "vnote": "Bot správne, confirmed_resolution.", "cat": "payments"}, {"channel": "intercom", "id": "215476071815373", "date": "2026-09-23 18:05", "day": "2026-09-23", "human": true, "bucket": "HUMAN", "reask": 1, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Missing ability to see details about students\n\nHi, when I started teaching, I could see details of my students: internal notes in their classroom and also add personal details about how they behaved. Now the options are only to say if they came or didn't come to class. I need to be able to see and add those details as before. I found a screenshot of how it used to look before, and I took one now of what I see on Zooza now. Please help me fix it. Thank you very much.", "turns": [{"role": "customer", "who": null, "text": "Missing ability to see details about students\n\nHi, when I started teaching, I could see details of my students: internal notes in their classroom and also add personal details about how they behaved. Now the options are only to say if they came or didn't come to class. I need to be able to see and add those details as before. I found a screenshot of how it used to look before, and I took one now of what I see on Zooza now. Please help me fix it. Thank you very much.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dear Lucia,\n\n\nyour ticket  has been received. Zooza Assistant will try to help you right away — and a member of our team will personally review it too.\n\n\n— Zooza Support", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Lucia, that is a view you toggled on - called Fast view designed to only take the attendance. In the top right corner of the screen you can toggle between the views.", "cited": []}, {"role": "customer", "who": "Lucia Koščová", "text": "Thank you very much.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Happy to help", "cited": []}], "verdict": "gap", "vtitle": "Lektorka nevidí detaily študentov — je zapnutý Fast/Quick view, prepína sa vpravo hore", "vnote": "attendance-and-catchups-faq Quick vs Full view popisuje, ale nie ako symptóm 'zmizli mi poznámky o študentoch'. Michal: doplniť jednu vetu? Nepísal som, je to hraničné.", "cat": "team"}, {"channel": "intercom", "id": "215476053692257", "date": "2026-09-23 17:39", "day": "2026-09-23", "human": true, "bucket": "HUMAN", "reask": 4, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Set up a contact form | Zooza Help", "Contact widget | Zooza Developer Docs"], "q": "The question is for Martin, please", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "The question is for Martin, please", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I'm passing it to the team, and could you please write in one or two sentences what it concerns, with a link or screenshot if you have one, so the team can pick it up straight away?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Hi Martin!\n\n\nThank you for the new contact form. We tested it and it looks just right.\n\n\nWe have a few questions:\n\n\nStatus: Blocked domain - what does this mean? Is it a good thing?\n\n\nIs it possible to have only one field, Nume (Name), instead of Name (Prenumele) and Surname (Numele de familie)? We need the two separate fields for the other forms. \n\n\nRegarding the consents, is it possible to have our terms come first?\n\n\nAlso, could you please change:\n\n\n“Făcând click pe butonul „Înregistrare”,...”\n\n\nto:\n\n\n“Apăsând pe butonul [TRIMITE], confirm...”\n\n\nThe issue is that the displayed name of the button is different depending on the form. Is it possible to retrieve the correct button name each time? Or maybe “Apăsând pe butonul de mai jos, confirm...” would be sufficient?\n\n\nThank you!", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thank you for the detailed questions and the screenshot.\n\n\n1. “Status: Blocked domain”\n\n\nThis status is not explained in the help article about contact forms, so I cannot confirm what it means from the documentation. \n\n\n2. Using only one name field\n\n\nYes. The contact form standard fields (First name, Surname, Email, Phone, Message) can be turned on or off. You can keep only First name and hide Surname for that form.\n\n\n3. Consent text order\n\n\nThe documentation only states that you choose which consents appear on the form. It does not mention changing the order of the consent text itself. \n\n\n4. Button name in the consent text\n\n\nThe documentation does not describe a way to automatically insert the button label into the consent text.", "cited": ["Set up a contact form | Zooza Help", "Contact widget | Zooza Developer Docs"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "A reply from Martin when convenient would be much appreciated. Thank you!", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I understand your preference to hear from Martin directly. I will make sure your questions are noted for him. Meanwhile, please feel free to share any other details or questions you have, and I will do my best to assist you. 😊", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I understand you would prefer a reply from Martin, and I’m here if you need any further help with these questions. Would you like to add any other details for the team?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Mara, thank you for getting back to us.\nBlocked domains - this form is really \"plain\" in a good sense - easy to fill. But that also exposes the risk of getting lots of spam messages from bots and various AI's of the world. Thus we had to build comprehensive spam protection and one of the features is that we only accept requests from the URL's which are declared within the app. Blocked domain simply means that there was incoming request/submission from unregistered domain. So in the Widget's setting (Team and settings -> publish -> widget -> contact - there you can manage list of domains from which you'll be accepting submissions.\n\n\n\n\n\nOn name field - I guess this could be possible but what would you expect to happen on the system's side? Leave the full name as it is or try to split it between first/last name columns?\n\n\n\n\n\nOn consents order: I guess this should not be an issue it is just about the priority, I did set your agreements to have higher priority so please check if that helped. \n\nOn translation - for sure. You know romanian language better than us:) so please send me the translation you want to have and we can do that. Or if you think you need to customize the button per form, we can put that into app directly so you can rename the butotn according to what the contact form is used for", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "On the Meta connection - we're still waiting for the approval from Meta. I expect it to land by the end of the week and if everything will go smoothly then you will be able to connect to your fb pages and fetch the leads from facebook and feed your contacts to fb audiences", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "This is how the integration looks like (on our test)\n​", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "So you will even be able to track the consents back from meta. The consents you set up need to be assigned to marketing category but that is just a small thing", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Hi Martin, thank you for your reply!\n\n\nOn name field – if possible, maybe leave the full name as it is and we’ll split it manually when they become clients.\n\n\nOn consents order – I’m afraid it hasn’t changed: https://nominjyuku.ro/contact-2/\n\n\nOn translation – The submit button has different names on the different forms. For the contact form, it is called TRIMITE; for the current demo form, it is called ÎNREGISTRARE; and for the class enrollment form, it is called ÎNSCRIEȚI-VĂ.\n\n\nThe text above the button refers to it as ÎNREGISTRARE, which may be a little confusing.\n\n\nIf possible, I would like this text to reflect the correct name of the button. As far as I know, this text can only be changed by you, as it refers to Zooza terms and is mandatory.\n\n\nRegarding the translation, the only thing I would change is Făcând clic... to Apăsând pe butonul...\n\n\nThanks for the Meta update. I’m sure Sorina and Nomin are looking forward to the approval.\n\n\nHave a lovely evening!", "cited": []}], "verdict": "gap", "vtitle": "Contact form: 'Blocked domain' = submission z domény, ktorá nie je v zozname povolených vo widgete", "vnote": "Martin pre Maru. Kontrola proti contact-form-on-your-website.md — Michal: je tam zoznam domén popísaný? Ak nie, doplním.", "cat": "widgets"}, {"channel": "intercom", "id": "215476068884292", "date": "2026-09-23 15:05", "day": "2026-09-23", "human": false, "bucket": "D_assumed_with_kb", "reask": 3, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Create a programme | Zooza Help", "Price and payment setup | Zooza Help", "Creating entry passes | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Billable sessions | Zooza Help", "Sell extra sessions on top of a booking | Zooza Help"], "q": "Mám otevřený kurz a potřebuju aby si lidi mohli koupit lekce. Kde to najdu?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": "Dominik Jandus", "text": "Mám otevřený kurz a potřebuju aby si lidi mohli koupit lekce. Kde to najdu?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Potřebujete nastavit lekce jako placené.\n\n\nNa úrovni lekce:\n\n\n\n\n- Otevřete lekci → Session settings → zapněte Billable session.\n\n\nDůležité: třída musí mít lekce a typ Fixed Period (ne Lead Collection), jinak klienti neuvidí možnost platby.\n\n\nTip: můžete i nastavit program na Pay-as-you-go, kde lidé platí jen za lekce, které si rezervují.", "cited": ["Billable sessions | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Create a programme | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Hledali jste tohle?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Pokud potřebujete s nastavením placených lekcí ještě pomoci, rád vám poradím. Chcete upřesnit, co se vám při nastavování nedaří?", "cited": []}, {"role": "customer", "who": "Dominik Jandus", "text": "můj profil mi říká: Nemáte zakoupené žádné vstupy. Před přihlášením na termín si prosím zakupte a uhraďte vstupy. jak to nastavím správně?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dominiku, tato hláška znamená, že klient nemá zakoupené lekce (vstupy). To se stane, když lekce nejsou správně označené jako placené.\n\n\nZkontrolujte dvě věci:\n\n\n\n\n- \nProgramme → váš kurz → Edit Settings → Price and Payment\n• nastavte Billable sessions na počet lekcí, které mají být placené. \n\n\n- \nSessions list (seznam lekcí kurzu)\n• vyberte lekce → bulk action → označte je jako Billable session.\n\nDůležité: počet na kurzu a označené lekce musí souhlasit.\n\n\nTaké ujistěte se, že kurz má lekce a typ Fixed Period, jinak klienti neuvidí možnost platby.", "cited": ["Billable sessions | Zooza Help", "Price and payment setup | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Dostali jste odpověď na svou otázku?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Pokud s nastavením placených lekcí stále potřebujete pomoc, rád vám pomohu. Můžete upřesnit, na kterém kroku se nastavení nedaří?", "cited": []}, {"role": "customer", "who": "Dominik Jandus", "text": "Moje registrace říká, že si budu moci zakoupit termíny po registraci ale nikde to nevidím. Přehlédl jsem někde nastavení jak povolit zakoupení termínů v profilu? Všechny termíny jsou nastavené jako billable", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dobře, tohle je typický případ 👍\n\n\nI když máte lekce označené jako Billable session, klienti je v profilu neuvidí, dokud nebudou mít produkt (vstup) k dispozici.\n\n\nPotřebujete nastavit jeden z těchto dvou způsobů:\n\n\n1) Vstupy (nejčastější)\n\n\n\n\n- Vytvořte entry pass (např. 1 lekce, 5 lekcí atd.)\n\n- Pak jděte na Programme → Class → Select Product\n\n\n- Vyberte tento pass a uložte\n\n\nDůležité:\n\n\n\n\n- Zapněte Profile availability → jinak se v profilu klienta neobjeví\n\n2) Pay-as-you-go\n\n\n\n\n- Zapněte Allow additional sessions v programu\n\n\n- Pak si klienti budou lekce kupovat přímo ze svého profilu\n\n👉 Nejčastěji je problém právě ten, že žádný pass není přiřazen k třídě, takže klienti nemají co koupit.\n\n\nChcete, abych vám řekl, který z těch dvou způsobů je pro váš kurz lepší?", "cited": ["Creating entry passes | Zooza Help", "Sell extra sessions on top of a booking | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Pokud stále potřebujete pomoc s nastavením nákupu termínů, rád vám poradím. Můžete upřesnit, co přesně se po registraci v profilu nezobrazuje?", "cited": []}], "verdict": "gap", "vtitle": "Otvorený kurz: klient nemá čo kúpiť, kým nie je k skupine priradený produkt (entry pass)", "vnote": "Bot to dal až na tretí pokus a pridal 'Profile availability' toggle. Michal: existuje to nastavenie? Ak áno, patrí do creating-entry-passes.", "cat": "pricing"}, {"channel": "intercom", "id": "215476067659922", "date": "2026-09-23 14:01", "day": "2026-09-23", "human": false, "bucket": "D_assumed_with_kb", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Nefunkčné zástupné znaky (event date, place, trainer) v potvrdzovacom e-maile skusobnej hodiny\n\nDobrý deň,\n\nobraciam sa na vás s technickým problémom ohľadom automatického potvrdzovacieho e-mailu, ktorý systém odosiela klientom po prihlásení sa na SKUSOBNU HODINU.\n\nV prilohe zasielam vzorovu sablonu potvrdenia skusobnej hodiny a email, ktoy mi prisiel.  Kedze klientom ponukam v kurze vybrat si rozne terminy skusobnej hodiny - chcela by som aby to bolo pre klienta prehladne a videl - na aky datum skusobnej hodiny sa prihlasil - tato informacia mi tam aktualne chyba.\n\nV odporucenej šablóne e-mailu od zoozy su použite zástupné znaky / premenné ako napr. {event_date}, {event_place}, {event_trainer}. V odoslanom e-maile, ktorý klient dostane, sa však tieto údaje vôbec nevyplnia (zostávajú prázdne).\n\nKonkrétna situácia a náš cieľ:\nPri registrácii na kurz si klienti vyberajú u nas z dvoch ponúkaných termínov skúšobnej hodiny (napr. utorok 22. 9. alebo utorok 29. 9.). Potrebujeme dosiahnuť, aby v potvrdzovacom e-maile klient hneď jasne a jednoznačne videl konkrétny dátum a čas, ktorý si zvolil, a vedel sa k tomu kedykoľvek spätne vrátiť. Samotná pripomienka pred termínom nie je postačujúca.\n\nMám podozrenie, že premenná {event_date} funguje len v notifikacii termínu, ale v potvrdzovacom e-maile k prihláške na skusobnu hodinu sa nenaťahuje.\n\nOtázky / požiadavka na riešenie:\n\nAký konkrétny tag / premennú máme použiť v tejto šablóne, aby systém do textu dotiahol zvolený termín(dátum) skúšobnej hodiny v prihlasovacom formuláry?\n\nAk systém nevie túto hodnotu preniesť cez premennú priamo do potvrdzovacieho e-mailu kurzu, ako máme nastavenie upraviť (napr. nastaviť skúšobné hodiny ako samostatné udalosti s okamžitým potvrdením), aby to fungovalo korektne?\n\nVopred ďakujem za preverenie a pomoc s nastavením.\n\nJanka Gereková", "turns": [{"role": "customer", "who": null, "text": "Nefunkčné zástupné znaky (event date, place, trainer) v potvrdzovacom e-maile skusobnej hodiny\n\nDobrý deň,\n\nobraciam sa na vás s technickým problémom ohľadom automatického potvrdzovacieho e-mailu, ktorý systém odosiela klientom po prihlásení sa na SKUSOBNU HODINU.\n\nV prilohe zasielam vzorovu sablonu potvrdenia skusobnej hodiny a email, ktoy mi prisiel.  Kedze klientom ponukam v kurze vybrat si rozne terminy skusobnej hodiny - chcela by som aby to bolo pre klienta prehladne a videl - na aky datum skusobnej hodiny sa prihlasil - tato informacia mi tam aktualne chyba.\n\nV odporucenej šablóne e-mailu od zoozy su použite zástupné znaky / premenné ako napr. {event_date}, hannel": "intercom", "id": "215475963876288", "date": "2026-09-23 13:49", "day": "2026-09-23", "human": true, "bucket": "HUMAN", "reask": 6, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": ["For Developers — Zooza", "Book a Meeting — Zooza", "Zooza Phone Assistant — Dedicated Support for Your Team | Zooza", "Contact — Zooza", "Customer Care — Zooza"], "q": "Dobrý deň, Martin,\nrád by som z našej strany inicioval stretnutie ohľadom dostupných možností na zlepšenie fungovania profilov, produktov a služieb.\nJedná sa totiž o produkty, ktoré sa v našich podmienkach hojne používajú a zároveň majú veľký potenciál na rozvoj. Dnes totiž z užívateľského pohľadu nefungujú najlepšie kvôli čomu veľmi zaťažujú náš administratívny proces. Zároveň by som chcel zistiť, ako je na tom v súčasnosti vývoj týchto systémov a akým smerom sa vlastne uberá. \nVedeli by sa v dohľadnej dobe k tejto veci stretnúť? Sme ochotní sa rozprávať aj o spolufinancovaní za dovyvíjanie týchto služieb na mieru pre nás.\nĎakujem a zostávam s pozdravom\nJakub_MEDVEDICA", "turns": [{"role": "customer", "who": "Jakub Majoroš", "text": "Dobrý deň, Martin,\nrád by som z našej strany inicioval stretnutie ohľadom dostupných možností na zlepšenie fungovania profilov, produktov a služieb.\nJedná sa totiž o produkty, ktoré sa v našich podmienkach hojne používajú a zároveň majú veľký potenciál na rozvoj. Dnes totiž z užívateľského pohľadu nefungujú najlepšie kvôli čomu veľmi zaťažujú náš administratívny proces. Zároveň by som chcel zistiť, ako je na tom v súčasnosti vývoj týchto systémov a akým smerom sa vlastne uberá. \nVedeli by sa v dohľadnej dobe k tejto veci stretnúť? Sme ochotní sa rozprávať aj o spolufinancovaní za dovyvíjanie týchto služieb na mieru pre nás.\nĎakujem a zostávam s pozdravom\nJakub_MEDVEDICA", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Hi Jakub,\n\n\nThanks for reaching out! I'm Zooza Support, Zooza's AI Agent and I'm well trained to answer your q ttings\n\n- posuňte sa k dlaždici Retention\n\n\n- kliknite na Edit\n\n\nTu môžete nastaviť počet dní, po ktoré klientovi zostáva aktívny odkaz na opätovné prihlásenie (predvolene 30 dní).", "cited": ["Retention | Zooza Help", "Trial Classes FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Hledali jste tohle?", "cited": []}, {"role": "customer", "who": "Silvia Dolínková", "text": "mam", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dobré, ďakujem.\n\n\nRetencia sa nastavuje na úrovni kurzu.\n\n\n\n\n- \nProgrammes → otvorte kurz\n\n- Settings\n\n- posuňte sa k dlaždici Retention\n\n\n- kliknite na Edit\n\n\n- nastavte počet dní, koľko bude aktívny odkaz na opätovné prihlásenie (predvolene 30 dní)\n\n- kliknite na Save \n\n\nTáto retencia sa aktivuje, keď je trial označený ako Trial Lost alebo keď je registrácia zrušená. Klientovi sa potom pošle odkaz na opätovné prihlásenie.", "cited": ["Retention | Zooza Help", "Trial Classes FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Dostali jste odpověď na svou otázku?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak potrebujete ďalšiu pomoc s nastavením retencie, som vám k dispozícii. Chcete doplniť, čomu pri tomto nastavení ešte potrebujete porozumieť?", "cited": []}], "verdict": "check", "vtitle": "Kde je retencia v nastaveniach kurzu", "vnote": "Fine.", "cat": "programmes"}, {"channel": "intercom", "id": "215476047149616", "date": "2026-09-23 11:48", "day": "2026-09-23", "human": true, "bucket": "HUMAN", "reask": 2, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Customer duplicates\n\nHi all.\n\nHope you’re well!\n\nI just wanted to check the best process for moving a customer from a trial into an enrolled membership.\n\nAt the moment, when someone books a trial they create a customer record. After their trial, I’ve then been sending them our standard enrolment/sign-up link. When they enrol through this, it seems to create a second customer record rather than continuing with their existing one.\n\nIs there a better way I should be doing this? For example, is there somewhere within their Parent Profile where an existing trial customer can enrol directly, rather than using the main sign-up link?\n\nIdeally, I’d like each family to have one account that follows their journey from trial through to becoming an enrolled customer, rather than having duplicate records.\n\nI think this would also help with our marketing data. For example, someone might originally tell us they heard about WeeKicks through Facebook, Google or word of mouth when booking their trial. On their new enrolment account, they may then select “attended a trial”, so we lose sight of where that customer originally came from.\n\nIdeally, it would be great to be able to follow:\n\nOriginal marketing source → Trial booked → Trial attended → Enrolled\n\nall within the same customer record.\n\nCould you let me know the best way to manage this within the system?\n\nThanks for your help!", "turns": [{"role": "customer", "who": null, "text": "Customer duplicates\n\nHi all.\n\nHope you’re well!\n\nI just wanted to check the best process for moving a customer from a trial into an enrolled membership.\n\nAt the moment, when someone books a trial they create a customer record. After their trial, I’ve then been sending them our standard enrolment/sign-up link. When they enrol through this, it seems to create a second customer record rather than continuing with their existing one.\n\nIs there a better way I should be doing this? For example, is there somewhere within their Parent Profile where an existing trial customer can enrol directly, rather than using the main sign-up link?\n\nIdeally, I’d like each family to have one account that follows their journey from trial through to becoming an enrolled customer, rather than having duplicate records.\n\nI think this would also help with our marketing data. For example, someone might originally tell us they heard about WeeKicks through Facebook, Google or word of mouth when booking their trial. On their new enrolment account, they may then select “attended a trial”, so we lose sight of where that customer originally came from.\n\nIdeally, it would be great to be able to follow:\n\nOriginal marketing source → Trial booked → Trial attended → Enrolled\n\nall within the same customer record.\n\nCould you let me know the best way to manage this within the system?\n\nThanks for your help!", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dear Kieran,\n\n\nyour ticket  has been received. Zooza Assistant will try to help you right away — and a member of our team will personally review it too.\n\n\n— Zooza Support", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Kieran,\n​\n\n\nThanks for getting in touch, and for explaining it so clearly. \nWhat you want (one family, one journey from trial to enrolment) is exactly what Zooza's trial flow is built for. The duplicates come from the standard sign-up link, because it skips that flow.\n​\n\n\nWhy duplicates are being created\nThe standard enrolment link is a \"fresh\" sign-up. Zooza can't tell that the person is continuing from a trial, so it treats them as a brand-new customer. It creates a new record and asks all the questions again, including where they heard about you.\n​\n\n\nHow the trial flow works\nAfter the trial, the parent should continue through their own personal enrolment link rather than the general sign-up link. They can get it two ways:\n\n\n\n\n- \nautomatically by email, if the trial automation is switched on for the course, or\n\n- \nfrom their Parent Profile: while their trial is active, the profile shows an option to enrol, with a button that takes them straight to the enrolment form. (The trial needs to be paid for this to appear.)\n\nWhen they enrol this way:\n\n\n\n\n- the enrolment form opens with some of their details already pre-filled in, including the answers they gave when booking the trial, such as how they heard about you,\n\n- the new enrolment is linked to their trial booking and stays under the same customer,\n\n- the trial is automatically marked as won (converted), so your trial conversions are tracked.\n\nIn the system you'll still see two bookings, the trial and the enrolment, but they are connected and sit under one customer. You can follow the whole journey from there: original source → trial booked → trial attended → enrolled.\n\n\nWhat to set up\n\n\n\n\n- \nTurn on the trial automation on the course(s) you offer trials for. Zooza then sends the parent their personal enrolment link automatically after the trial, so you don't need to send anything by hand.\n\n- \nStop sending the standard sign-up link to trial customers. The general link is for new customers only.\n\n- \nKeep your \"How did you hear about us\" question in the same position in the trial course and the course customers enroll into. Their original answer will then be carried over automatically.\n\nTip: If a child should continue in a different class from the one they trialled in, you can recommend that class when you resolve the trial (the summary window that appears after you mark attendance for their final trial session). Their enrolment link will then take them straight to it. If you leave it empty, the link takes them to the class where the trial took place.\n\n\n\n\n\n\n\n\nBest regards,\n\n\nZooza team", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "Thanks for this, I did think this might be the case. \n\n1- Turn on the trial automation \nIs it possible to check the trial automation I think I have this for all my actgive programmes WeeOnes,Twos, Threes, Fours and Kicks academy.\n\nDoes the link get sent only when the child has been marked ont he calerndar
