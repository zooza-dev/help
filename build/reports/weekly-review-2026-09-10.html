: "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, pan Kiss, \n\n\nv tom dashboarde, pocita Zooza prijmy a vydavky za registracie v stave Registrovany alebo Hosť (nezapocitava tam napriklad zrusene registracie). \n\nZaroven do tych dlznych (ciastocne, ci neuhradene), nezapocitava stav platby, kedy sa caka na uhradu. https://zooza.app/#registrations?billing_status=awaiting_payment&order_by=created_desc&page=0&page_size=20&person_id=0&payment_id=0&segment_id=0&schedule_id=0\n\n\nV takom pripade to bude sediet.", "cited": []}], "verdict": "gap", "vtitle": "Why the payments doughnut does not add up", "vnote": "Kiss counted by hand and got a different number. The dashboard counts only Registered and Guest bookings, and leaves awaiting-payment out of the unpaid figures. Nothing wrong, but nothing says so anywhere.", "cat": "reports"}, {"channel": "intercom", "id": "215475821279317", "date": "2026-09-07 06:58", "day": "2026-09-07", "human": false, "bucket": "D_assumed_with_kb", "reask": 1, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Using Zooza on mobile | Zooza Help", "Sending email/SMS to clients | Zooza Help", "Settings | Zooza Help"], "q": "Ahoj, v sekcii ,,komunikácia\" - ,,história\", dá sa nastaviť aby správy, ktoré prídu od rodičov upozornili notifikáciou ?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Ahoj, v sekcii ,,komunikácia\" - ,,história\", dá sa nastaviť aby správy, ktoré prídu od rodičov upozornili notifikáciou ?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Nie, v Zooza sa notifikácie na prichádzajúce správy od rodičov (v sekcii Komunikácia → História) nastaviť nedajú. \n\n\nSystém má len emailové notifikácie, ktoré môžete nastaviť v Settings → Notifications, ale tie sú určené pre udalosti ako napr. nová rezervácia, platba alebo import klienta – nie pre prichádzajúce správy. \n\n\nDôležité: Zooza ani neposiela push notifikácie do telefónu. \n\n\nTakže správy od rodičov sa kontrolujú priamo v Communication → Messages Overview, kde vidíte aj stav „unread“.", "cited": ["Settings | Zooza Help", "Sending email/SMS to clients | Zooza Help", "Using Zooza on mobile | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak potrebujete s nastavením upozornení alebo správami ešte pomôcť, som tu pre vás. Chcete doplniť, čo presne sa snažíte vyriešiť alebo nastaviť?", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215475821156768", "date": "2026-09-07 06:47", "day": "2026-09-07", "human": false, "bucket": "D_assumed_with_kb", "reask": 3, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Cum să automatizați afacerea dvs. de activități pentru copii (fără a pierde atingerea personală) — Zooza", "Attendance and Catch-up Classes FAQ | Zooza Help", "Daily Calendar — Room Swimlane View | Zooza Help"], "q": "Vreau să scriu rezumatul lecției de ieri pentru grupa de la 11:00", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Cu ce vă pot ajuta?", "cited": []}, {"role": "customer", "who": "Denisa Codiță", "text": "Vreau să scriu rezumatul lecției de ieri pentru grupa de la 11:00", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Poți scrie rezumatul lecției direct în sistem, ca un mesaj către părinți sau ca notă pentru curs. În Zooza, comunicarea cu părinții se face prin mesaje și notificări, iar instructorii pot marca și prezența direct în platformă. \n\n\nUn rezumat simplu ar putea arăta astfel:\n\n\n\n\n- \nData: 6 septembrie\n\n- \nGrupa: 11:00\n\n- \nTema: (ex. introducere în citire)\n\n- \nCe am făcut: activitățile principale din oră\n\n- \nObservații: progresul copiilor sau ce trebuie consolidat\n\n- \nTema următoare: ce veți face la următoarea lecție\n\nDacă vrei, îți pot arăta și un model scurt de mesaj pe care îl poți trimite părinților după lecție.\n\n\n\nSource:\nCum să automatizați afacerea dvs. de activități pentru copii (fără a pierde atingerea personală) — Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Asta căutați?", "cited": []}, {"role": "customer", "who": "Denisa Codiță", "text": "Nu, nu găsesc unde să scriu", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Înțeleg — în Zooza nu există un camp dedicat „rezumat lecție”. De obicei, instructorii scriu astfel de informații ca mesaj către părinți sau ca notă legată de sesiune. \n\n\nPentru a vă ghida exact, am nevoie de un mic detaliu:\n\n\nPe ce pagină sunteți acum în aplicație?\n\n\nDe exemplu: Calendar, Programmes, Classes, Sessions, sau Parent Zone.\n\n\nDupă ce îmi spuneți pagina, vă pot arăta exact unde să scrieți mesajul pentru grupa de la 11:00.\n\n\n\nSource:\nCum să automatizați afacerea dvs. de activități pentru copii (fără a pierde atingerea personală) — Zooza", "cited": []}, {"role": "customer", "who": "Denisa Codiță", "text": "Sunt pe calendar și îmi apar doar lecțiile viitoare nu și cele din trecut adică de ieri", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Este normal — în Calendar veți vedea în principal sesiunile viitoare. Pentru lecția de ieri, trebuie să navigați la data respectivă. \n\n\nPașii sunt simpli:\n\n\n\n\n- sus în Calendar folosiți săgeata ← Previous day până ajungeți la data de ieri\n\n- apăsați sesiunea grupelor de la 11:00\n\n\n- în detaliul sesiunii, jos în secțiunea Notes, scrieți în Session summary (visible to the client) — asta este rezumatul lecției pentru părinți. \n\n\nDacă doriți, vă pot arăta și un model foarte scurt de rezumat pe care îl puteți copia după fiecare lecție.", "cited": ["Attendance and Catch-up Classes FAQ | Zooza Help", "Daily Calendar — Room Swimlane View | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Ați primit răspuns la întrebarea dvs.?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dacă mai aveți nevoie de ajutor pentru a adăuga rezumatul lecției de ieri, sunt aici să vă sprijin. Doriți să îmi spuneți ce anume nu reușiți să găsiți în Calendar?", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215475811526581", "date": "2026-09-07 04:40", "day": "2026-09-07", "human": true, "bucket": "HUMAN", "reask": 1, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Stripe Payments\n\nHello! There seems to be an issue connecting to Stripe with the following error message - have tried on separate laptops and same issue when trying to take payment?", "turns": [{"role": "customer", "who": null, "text": "Stripe Payments\n\nHello! There seems to be an issue connecting to Stripe with the following error message - have tried on separate laptops and same issue when trying to take payment?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dear TOMMY,\n\n\nyour ticket  has been received. Zooza Assistant will try to help you right away — and a member of our team will personally review it too.\n\n\n— Zooza Support", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Tommy,\n\n\nYes, I can see what’s happening. The Stripe message is actually pointing to the same issue as the browser ,,, if you look at the top of your screenshot, it says “Not Secure”.\n\n\nIt means the page has been opened via http:// rather than https://, and Stripe won’t allow live payments on a non-secure connection.\n\n\nI’ve checked the Zooza widgets and everything is configured correctly there.\n\n\nThe best fix is to ask whoever manages your hosting/domain to set up an automatic redirect from HTTP to HTTPS across the whole website. There are also WordPress plugins that can handle this, but ideally it should be configured at hosting/domain level.\n\n\nOnce that redirect is in place, Stripe should always work normally.", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Thank you!\n\n\nI'll take a look at the automatic redirect and try to resolve.\n\n\nAppreciate the quicik response!\n\n\nTommy Wingrove\n\n\nFounder | Get Set Go Kids\n\n\nEarly years sports & movement programmes for children aged 1-6yrs \nHelping children build confidence through movement \nConfidence • Fundamentals • Fun \n​\n\n\n\ntommy@getsetgokids.comwww.getsetgokids.com Instagram | Facebook", "cited": []}], "verdict": "gap", "vtitle": "Stripe will not take a payment on http", "vnote": "Tommy's checkout failed on two laptops. The page was served over http and Stripe refuses live payments on an insecure connection. The fix is an http-to-https redirect at hosting level. A launch trap that will hit the next self-hosted widget customer too.", "cat": "payments"}, {"channel": "email", "id": "email-yta-company-email", "date": "2026-09-06T09:00:00", "day": "2026-09-06", "human": true, "bucket": "EMAIL", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Sablona e-mailu - neevidujeme platbu (6 Sep)", "turns": [{"role": "customer", "who": "Peter Longauer", "text": "V sablone co chodi automaticky e-mail o neuhradeni splatky mame v texte na konci nespravny e-mail. Veta znie: 'Aby sme vedeli platbu rychlejsie priradit, poslite nam, prosim, udaje o platbe na jozef.d.filipek@gmail.com'. Potrebovali by sme zmenit e-mailovu adresu v texte na yta@yta.sk. Neviem to dohladat.", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Predpokladam, ze som to nasiel: Zooza / Nastavenia / Vseobecne", "cited": []}], "verdict": "gap", "vtitle": "Wrong address in the overdue-payment email is the company email, not the template", "vnote": "The automatic overdue-payment email ends with 'send us the payment details to jozef.d.filipek@gmail.com' and Peter wants yta@yta.sk. He could not find where to change it and guessed Settings - General. He is right: the template renders *|COMPANY_EMAIL|*, which is the company email field, so editing the template text changes nothing. Verified in api-v1 locale_text_content.php line 447 and Merge_Vars.php (co.email), and the field is Settings - General - Account information in app/pages/settings/general.html. NOT ANSWERED YET — he wrote on Saturday and there is no reply in the thread. Also: dynamic-tags.md documents *|COMPANY|* but neither COMPANY_EMAIL nor COMPANY_URL.", "cat": "comms", "from": "Peter Longauer — YTA"}, {"channel": "intercom", "id": "215475791898887", "date": "2026-09-06 12:11", "day": "2026-09-06", "human": true, "bucket": "HUMAN", "reask": 3, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Consents and agreements (GTC, GDPR) | Zooza Help", "Consents and Agreements FAQ | Zooza Help", "Email and Communication FAQ | Zooza Help", "Settings | Zooza Help"], "q": "where can i insert my terms and conditions?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "where can i insert my terms and conditions?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can add your Terms and Conditions in Settings → Consents & Agreements. \n\n\nSteps:\n\n\n\n\n- Go to Settings\n\n\n- Open Consents & Agreements\n\n\n- Click Add\n\n\n- Enter the consent name (the text shown on the booking form)\n\n- Add the full T&C text in the Consent text field\n\n- Set the consent type (for example Check box if parents must tick it) \n\n\nYou can also link to your own website instead of pasting the full text by adding a link in the consent name, for example:\n\n\n\u003ca href=\"https://yourwebsite.com/terms\">Terms and Conditions\u003c/a>\n\n\nThe consent will then appear on the booking or order form for clients to accept.", "cited": ["Consents and agreements (GTC, GDPR) | Zooza Help", "Consents and Agreements FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help adding or displaying your Terms and Conditions in Zooza, I’m here to help. Would you like to share more about what you’re trying to set up?", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "I want to receive email notifications when I recieve a new order, how do i do this?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can enable this in the Notifications Center.\n\n\nSteps:\n\n\n\n\n- Go to Settings → Notifications\n\n\n- Click Add new notification\n\n\n- Choose the notification type (for example new booking created)\n\n- Enter the email address where you want the alert sent\n\n- Click Create Notification \n\n\nOnce set, you’ll receive an email whenever a new booking (including trials) is created. \n\n\nTip: if you want multiple people to receive the alert, create a separate notification entry for each email address.", "cited": ["Settings | Zooza Help", "Email and Communication FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "i cant find it", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "It’s in Settings → Notifications. From there you can add an email alert for new bookings. \n\n\nSteps:\n\n\n\n\n- Go to Settings\n\n\n- Open Notifications\n\n\n- Click Add new notification\n\n\n- Choose the notification type (for example when a new booking is created)\n\n- Enter your email address\n\n- Click Create Notification\n\n\nOnce saved, you’ll receive an email whenever a new booking or trial is created. \n\n\nIf you don’t see Notifications in the Settings menu, which page are you currently on in the app?", "cited": ["Settings | Zooza Help", "Email and Communication FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help finding the Notifications setting, I’m here to help. Would you like to share which page you’re currently viewing?", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Samuel, you can find it here: https://zooza.app/#settings/notifications\n\n\n\n\n\nin the menu: Team & Settings > Other > Notification centrum", "cited": []}], "verdict": "gap", "vtitle": "Terms and conditions live in the notification centre", "vnote": "Samuel asked where to put his T&Cs. Answer: Settings -> Notifications (#settings/notifications), under Team & Settings > Other > Notification centrum. Nobody would guess that location, which is exactly why it belongs in the KB.", "cat": "account"}, {"channel": "intercom", "id": "215475812286425", "date": "2026-09-06 10:57", "day": "2026-09-06", "human": false, "bucket": "D_assumed_with_kb", "reask": 1, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Message Templates | Zooza Help", "Automatic reminders for payment schedule | Zooza Help", "Message templates — automatic and manual emails | Zooza Help"], "q": "Ahoj, prosím ťa ako zmením v šablóne upomienky na neuhradenú platbu. v texte na konci šablóny máme kontaktný mail kde ma klient odoslať úhradu pre lepšie spárovanie.", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Ahoj, prosím ťa ako zmením v šablóne upomienky na neuhradenú platbu. v texte na konci šablóny máme kontaktný mail kde ma klient odoslať úhradu pre lepšie spárovanie.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Tento text zmeníte priamo v šablóne upomienky.\n\n\nPostup:\n\n\n\n\n- Prejdite do Communication → Message Templates.\n\n- Vyhľadajte šablónu Missed payment (upozornenie na neuhradenú platbu).\n\n- Otvorte ju a upravte text v tele správy – napr. na konci môžete pridať svoj kontaktný e‑mail.\n\n- Uložte zmeny. \n\n\nTip: systémové šablóny sa nedajú premenovať ani zmazať, ale môžete ich upraviť alebo vytvoriť vlastnú variantu, ak chcete mať viac verzí.", "cited": ["Automatic reminders for payment schedule | Zooza Help", "Message Templates | Zooza Help", "Message templates — automatic and manual emails | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak potrebujete s úpravou šablóny upomienky ešte pomôcť, som vám k dispozícii. Chcete doplniť, čo presne potrebujete v texte zmeniť alebo nastaviť?", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215475812064515", "date": "2026-09-06 09:55", "day": "2026-09-06", "human": false, "bucket": "D_assumed_with_kb", "reask": 1, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Video widget | Zooza Developer Docs", "Deploying Zooza app on your website | Zooza Help", "Widget Embedding Troubleshooting | Zooza Help", "Embed videos — Vimeo setup for client access | Zooza Help"], "q": "Dobrý deň, nejde prehrávať videá na stránke, ktoré som nahrala. Ja mám dve stránky a automaticky prepája na stránku na stránku www.babybalancenitra.sk, chcela by som aby prehrávalo videá na stránke www.babybalance.sk", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": "Simona Jarošová", "text": "Dobrý deň, nejde prehrávať videá na stránke, ktoré som nahrala. Ja mám dve stránky a automaticky prepája na stránku na stránku www.babybalancenitra.sk, chcela by som aby prehrávalo videá na stránke www.babybalance.sk", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Tento problém je obvykle nastavením URL stránky pre video widget.\n\n\nZooza používa túto adresu na to, aby vedelo, kde má video prehrávať. Ak je tam zadaná druhá doména, automaticky presmeruje na túto stránku. \n\n\nPostup:\n\n\n\n\n- V Zooza otvorte Settings → Publish\n\n\n- Otvorte nastavenia Video widget\n\n\n- V poli URL zadajte presne adresu stránky, kde má video bežať:\nhttps://www.babybalance.sk\n\n\n- Uložte a skúste znovu. \n\n\nDôležité: pre každý widget musí byť zadaná presne tá stránka, kde je widget na webe vložený. \n\n\nAk chcete, môžem vám ešte ukázať, ako správne vložiť video widget na túto stránku, aby sa videá prehrávali priamo na stránke.", "cited": ["Widget Embedding Troubleshooting | Zooza Help", "Deploying Zooza app on your website | Zooza Help", "Video widget | Zooza Developer Docs"]}, {"role": "bot", "who": "Zooza Support", "text": "Hledali jste tohle?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Na screenshotu je viditeľná hláška z Vimeo: „Because of its privacy settings, this video cannot be played here.“ To znamená, že video je na Vimeo nastavené tak, že ho neumožňuje prehrávať na tejto doméne. \n\n\nNajčastejšia oprava:\n\n\n\n\n- Prihláste sa na Vimeo → video → Settings → Privacy\n\n\n- \nWho can watch this video: Only people with the private link (Unlisted)\n\n\n- \nWhere can this be embedded: Specific domains\n\n\n- pridajte doménu: babybalance.sk (a prípadne aj zooza.app)\n\n- uložte.\n\nAk je video nastavené na Private, klienti ho nebudú môcť prehrať.\n\n\nAk chcete, môžem vám ešte ukázať rýchly test, ktorým si overíte, či je problém naozaj v Vimeo nastavení.\n\n\n\nSource:\nEmbed videos — Vimeo setup for client access | Zooza Help", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dostali jste odpověď na svou otázku?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc s prehrávaním videí, som vám k dispozícii. Chcete doplniť, na ktorej stránke sa video pokúšate prehrávať a čo sa zobrazí po úprave nastavení?", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215475791219335", "date": "2026-09-05 02:49", "day": "2026-09-05", "human": false, "bucket": "D_assumed_with_kb", "reask": 9, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Concepts & glossary | Zooza Developer Docs", "Billing and invoicing | Zooza Help", "VAT management | Zooza Help", "Locations and Venues FAQ | Zooza Help", "Documents | Zooza Help", "Managing client attendance — admin | Zooza Help", "Calendar | Zooza Help", "Attendance and Catch-up Classes FAQ | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Bookings | Zooza Help", "Creating a class | Zooza Help", "Settings | Zooza Help", "Creating and managing locations | Zooza Help"], "q": "How to view attendance registers?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "How to view attendance registers?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can view attendance registers in two main ways:\n\n\n1. From the Calendar (class register)\n\n\n\n\n- Go to Calendar.\n\n- Click the session tile for the class.\n\n- The attendance panel opens with two views:\n• Quick view – simple list with buttons like Will attend, Attended, Cancelled, Did not attend.\n• Full view – detailed register with notes, make‑up sessions, and cancellation reasons. \n\n\n2. From a client’s booking\n\n\n\n\n- Go to Bookings.\n\n- Open the client’s booking.\n\n- Select the Attendance tab to see their session‑by‑session attendance history. \n\n\nQuick view is best for daily class registers; Full view is better when you need detailed records.", "cited": ["Calendar | Zooza Help", "Attendance and Catch-up Classes FAQ | Zooza Help", "Managing client attendance — admin | Zooza Help", "Bookings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Can you alphabetize the list at all?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "No — the attendance register list cannot be alphabetized.\n\n\nWhen you open a session from the Calendar, the attendance panel (both Quick view and Full view) simply shows the client list for that session. There is no sorting option to arrange the names alphabetically. \n\n\nThe only sorting controls available in the class area are for reports and exports, where you can change the sort order (for example by registration progress or class progress). \n\n\nSo for the live attendance register itself, the order is fixed and not customizable.", "cited": ["Creating a class | Zooza Help", "Attendance and Catch-up Classes FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Yes", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I'm glad I could assist you! If you have any more questions or need further help, please feel free to ask. I'm here for you! 😊", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "When filtering venues in the classes menu, there are 2 of the same venue, 1 with a room, 1 without - how to delete one?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "That usually means there are two separate locations in Settings → Locations with the same name (one with a room, one without).\n\n\nTo remove the duplicate:\n\n\n\n\n- Go to Settings → Locations.\n\n- Find the venue you want to remove.\n\n- Open it and click Delete.\n\nImportant: you can only delete a venue after no classes or sessions are assigned to it. If any classes still use that venue, you must first change those classes to a different venue. \n\n\nRooms are optional inside a location, so you can also keep one venue and simply delete the extra room if you don’t need it. \n\n\nIf you want, I can also show a quick way to check which classes are using the duplicate venue.", "cited": ["Locations and Venues FAQ | Zooza Help", "Creating and managing locations | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "No - there is only 1 of the venue in the venue list?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If there is only one venue in Settings → Locations, the duplicate you see in the Classes menu is usually coming from rooms inside that location, not a second venue. \n\n\nRooms are optional subdivisions of a location (for example “Studio A”, “Room 1”, etc.). When a class is assigned to a specific room, the system can display it as “Venue – Room”, while other classes may show just “Venue” if no room is selected. \n\n\nWhat to check:\n\n\n\n\n- Go to Settings → Locations\n\n\n- Open that venue\n\n- Look at the Rooms section\n\nIf you only want one entry, you can delete the extra room there. Rooms are optional and can be removed from the location settings.\n\n\nIf you want, I can also explain how to check which classes are assigned to the room version.", "cited": ["Locations and Venues FAQ | Zooza Help", "Creating and managing locations | Zooza Help", "Concepts & glossary | Zooza Developer Docs"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help resolving the duplicate venue entry, I’m here to help. Would you like to share more about what you see in the Classes menu so we can continue?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "can you generate receipts?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes. You can generate receipts in two ways:\n\n\n\n\n- \nDynamic document (receipt template) – create a receipt template in Settings → Documents, then generate it from a booking. One document is created per registration. \n\n\n- \nInvoice – open the booking → Payments → Show payments → Generate invoice. The invoice PDF is created and emailed to the client. \n\n\nTip: invoices are often used for accounting, while dynamic documents are better for custom receipt formats.", "cited": ["Documents | Zooza Help", "Billing and invoicing | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Does this clarify how receipts work?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help with generating receipts or configuring the relevant document, I’m here to assist. Would you like to share more about the receipt you’re trying to create?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "how can I add VAT to invoices appropriate to UAE", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can add VAT to invoices by creating a VAT level and assigning it to your invoice profile.\n\n\n1. Create the VAT rate\n\n\n\n\n- Go to Settings → Billing\n\n\n- Scroll to VAT\n\n\n- Create a VAT level with the rate you need (e.g. 5% for UAE)\n\n- Choose how it is applied:\n• No VAT on gross – the price already includes VAT and the system calculates it\n• Add VAT to net – VAT is added on top of the entered price \n\n\n2. Apply it to invoices\n\n\n\n\n- Go to Settings → Billing → Invoice profiles\n\n\n- Open your invoice profile\n\n- Enable VAT payer\n\n\n- Select the VAT level you created\n\n- Optionally enable Display VAT payment on invoice so the tax appears on the PDF\n\nYou can also override the VAT at the booking → Payments → Invoices level when generating a specific invoice.\n\n\nTip: If you issue invoices automatically, setting the VAT in the invoice profile ensures every generated invoice uses the correct rate.", "cited": ["VAT management | Zooza Help", "Billing and invoicing | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Where is Billing in Settings?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You’ll find it in the Settings hub.\n\n\n\n\n- Go to Settings in the main menu.\n\n- Look for the Billing tile on that page.\n\n- Click it to open the Billing section. \n\n\nInside Settings → Billing, you’ll see areas like:\n\n\n\n\n- Billing periods\n\n- Invoice profiles\n\n- Invoices and Payments. \n\n\nTip: once you’re there, you can also open Invoice profiles to manage company details, tax ID, and VAT settings used on invoices.", "cited": ["Billing and invoicing | Zooza Help", "Settings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help finding Billing or configuring VAT for your invoices, I’m here to assist. Would you like to share what options you see in your Settings hub?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Can I download an invoice without sending to email?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes. You can download the invoice PDF without sending it by email.\n\n\nTwo easy ways:\n\n\n\n\n- \nFrom the booking:\nOpen the booking → Payments → Show payments → in the Invoices section you will see a link to download the PDF. \n\n\n- \nFrom the invoices list:\nGo to Sales & Payments → Invoices and download the invoice PDF directly from the list. \n\n\nThe email is sent automatically when the invoice is generated, but you can still download the PDF anytime from these places.", "cited": ["Billing and invoicing | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help downloading or managing the invoice, I’m here to assist. Would you like to share more about what you’re trying to do?", "cited": []}], "verdict": "gap", "vtitle": "How to view attendance registers — asked nine times, answered from the developer docs", "vnote": "The bot cited Concepts and glossary from the developer docs, Billing and invoicing, and VAT management. None of them is about attendance registers. Nine re-asks says the article the bot needed does not exist in a form it can find.", "cat": "reports"}, {"channel": "intercom", "id": "215475779589808", "date": "2026-09-04 13:45", "day": "2026-09-04", "human": true, "bucket": "HUMAN", "reask": 1, "resolution": "—", "rating": null, "carried": "2026-09-03", "sources": [], "q": "NEjde podla navodu pripojit Zoozu na ChatGPT - v Juli zmenili postup\n\nhttps://zooza.app/#mcp\n\nToto nefunguje. Prosim dajte tam aktualny presny postup, lebo podla Chat GPT noavodu som sa stratil. Vraj to asi ani mozno nejde pripojit, ak nemam nejaky enterprise ucet po novom...Dakujem", "turns": [{"role": "customer", "who": null, "text": "NEjde podla navodu pripojit Zoozu na ChatGPT - v Juli zmenili postup\n\nhttps://zooza.app/#mcp\n\nToto nefunguje. Prosim dajte tam aktualny presny postup, lebo podla Chat GPT noavodu som sa stratil. Vraj to asi ani mozno nejde pripojit, ak nemam nejaky enterprise ucet po novom...Dakujem", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Vážený Mikuláš,\n\n\nváš tiket byl přijat. Asistent Zooza se vám pokusí ihned pomoci — a člen našeho týmu jej také osobně zkontroluje.\n\n\n— Podpora Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, pan Fedor, ano, chatgpt to menil uz niekolkokrat. Najlepsie je chatgpt dat rovno prompt a mu povedat nech vas navedie ako to urobi. On to zvladne. Navod sme kazdopadn ooza", "Zooza PRO - Zooza"]}, {"role": "customer", "who": "Anna Minarovič", "text": "Na pierwszej stronie", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "W naszym systemie zarządza się nauczycielami z jednego panelu, gdzie są też harmonogramy, wiadomości, płatności i obecność. W materiałach, które mam tu pod ręką, nie ma jednak konkretnych kroków, gdzie dokładnie kliknąć, żeby usunąć lub dezaktywować lektora.\n\n\nNa jakiej stronie w aplikacji jest Pani teraz, gdy próbuje Pani znaleźć Ustawienia i zarządzać lektorami?\n\n\n\nSource:\nZooza PRO - Zooza", "cited": []}, {"role": "customer", "who": "Anna Minarovič", "text": "Tak", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "W naszym systemie instruktorzy są częścią zarządzania harmonogramem i widzą swój plan w swoim profilu. W Zooza PRO jest też możliwość zarządzania instruktorami, ale nie ma tu konkretnych kroków, gdzie dokładnie kliknąć, żeby usunąć lub dezaktywować instruktora.\n\n\nNa jakiej stronie w aplikacji jest Pani teraz, gdy próbuje Pani znaleźć Ustawienia i instruktorów?", "cited": ["Cennik — Zooza", "Zooza PRO - Zooza", "Jak zautomatyzować firmę zajmującą się zajęciami dla dzieci (bez utraty osobistego podejścia) — Zooza"]}, {"role": "bot", "who": "Zooza Support", "text": "Jeśli nadal potrzebuje Pani pomocy z dezaktywacją lektora, proszę opisać dokładniej, co chce Pani osiągnąć. Czy chce Pani kontynuować i podać więcej szczegółów dotyczących tego problemu?", "cited": []}, {"role": "customer", "who": "Anna Minarovič", "text": "Chce wyrzucic z systemu nieaktywnzch lektorow", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "W naszym systemie instruktorzy są częścią zarządzania harmonogramem i widzą swój plan w swoim profilu. W cenniku widzę też, że instruktorów można mieć nieograniczoną liczbę, więc nie ma tu limitu liczby instruktorów w bazie. W tych materiałach nie ma jednak konkretnych kroków, gdzie kliknąć, żeby usunąć lub dezaktywować instruktora.\n\n\nNa Sessions FAQ | Zooza Help", "Managing sessions in a class | Zooza Help", "Holiday and Term Management FAQ | Zooza Help"], "q": "if i delete a session that has a trial client booked into - will they be informed?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Sarah Bell-Woods", "text": "if i delete a session that has a trial client booked into - will they be informed?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes - if you choose to send the notification.\n\n\nWhen you cancel or delete a session, you are prompted whether to notify clients. If you tick that option, an email is sent only to the clients who are registered in that specific session, including trial clients. \n\n\nA couple of useful notes:\n\n\n\n\n- The notification is optional - you can cancel the session without sending an email.\n\n- If the session had a trial booking, the trial is not automatically moved to another date. You would need to reschedule it manually. \n\n\nIf you want, I can also show you the easiest way to reschedule a trial after cancelling a session.", "cited": ["Holiday and Term Management FAQ | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Manage trial bookings — reschedule, convert, and close | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Sarah Bell-Woods", "text": "can you show me how to turn the notification off", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can turn it off during the cancel/delete step.\n\n\nSteps:\n\n\n\n\n- Go to the class → Sessions tab.\n\n- Open the session you want to remove.\n\n- Click Cancel session (or delete it).\n\n- When the confirmation window appears, do not tick the option to notify clients.\n\n- Confirm the cancellation.\n\nThe notification is optional, so if that box is left unticked, no email will be sent to the clients registered in that session. \n\n\nTip: if you cancel a session instead of deleting it, reminders for that date are automatically suppressed as well.", "cited": ["Holiday and Term Management FAQ | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Managing sessions in a class | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Sarah Bell-Woods", "text": "i didn't get the confirmation window pop up when i cancelled a session - so i assume nothing was sent?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — that’s a reasonable assumption.\n\n\nWhen a session is cancelled, Zooza automatically suppresses all automated notifications for that date (such as reminders or day‑before alerts). You do not need to turn anything off manually. \n\n\nThe optional notification email only appears when the system prompts you to send one during the cancellation step. If that prompt did not appear, no manual notification email would have been sent. \n\n\nSo in this case, it’s very likely that no emails were sent to the clients.\n\n\nIf you want, I can also show you where to check the email log to confirm whether any message was sent.", "cited": ["Managing sessions in a class | Zooza Help", "Holiday and Term Management FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help checking the notification or email history, I’m here to assist. Would you like to share more about what you’re trying to confirm?", "cited": []}], "verdict": "verify", "vtitle": "Does deleting a session notify a trial client booked into it", "vnote": "Asked three times. A yes or no we should be able to state, but I will not guess which it is.", "cat": "trials"}, {"channel": "intercom", "id": "215475782192470", "date": "2026-09-03 20:19", "day": "2026-09-03", <script id="app">
const el = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MARKETING = /— Zooza$|Zooza PRO|Cen[íi]k|Cennik/;
const CATLBL = Object.fromEntries(META.categories);
const DECS = META.decisions.map(d => d[0]);
const SHORT = {ok:'Fine', kb:'KB', dig:'Dig', product:'Product'};

let filter='todo', catf='', q='', open=null, cursor=0, readOnly=false;

const S = c => (c && c.id ? (STATE[c.id] ||= {d:'', cat:c.cat, note:'', sug:''})
                          : {d:'', cat:'', note:'', sug:''});
const byId = id => DATA.find(c => c.id === id);

const FILTERS = [
  ['todo',   'To decide', '',        c => !S(c).d],
  ['all',    'All',       '',        c => true],
  ['kb',     'KB',        'k-kb',    c => S(c).d === 'kb'],
  ['dig',    'Dig',       'k-dig',   c => S(c).d === 'dig'],
  ['ok',     'Fine',      'k-ok',    c => S(c).d === 'ok'],
  ['waiting','Still waiting','k-wait',c => !!c.carried],
  ['noted',  'My notes',  '',        c => !!S(c).note],
  ['human',  'Human',     '',        c => c.human && c.channel === 'intercom'],
  ['bot',    'AI only',   '',        c => !c.human],
];

/* ── saving ───────────────────────────────────────────── */
let timer=null, artifact=null, dirty=false;
const mirror = () => { try{ localStorage.setItem('zb-'+META.end, JSON.stringify(STATE)); }catch(e){} };
const setSave = (t,c) => { const s=el('#save'); s.textContent=t; s.className='save '+(c||''); };
function touch(){ dirty=true; mirror(); setSave('Unsaved…'); clearTimeout(timer); timer=setTimeout(commit,2500); }

function buildDoc(){
  const css=document.getElementById('sheet').textContent;
  const skel=document.getElementById('skeleton').innerHTML;
  const app=document.getElementById('app').textContent;
  const enc=o=>JSON.stringify(o).replace(/</g,'\\u003c')
    .replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  const S_='<'+'script', E_='<'+'/script>';
  return '<!doctype html><html lang="en"><head><meta charset="utf-8">'
    +'<meta name="viewport" content="width=device-width,initial-scale=1">'
    +'<title>'+esc(document.title)+'</title><style id="sheet">'+css+'</style></head><body>'
    +skel+'<template id="skeleton">'+skel+'</template>'
    +S_+' id="data">const DATA='+enc(DATA)+';const META='+enc(META)+';'+E_
    +S_+' id="state">const STATE='+enc(STATE)+';'+E_
    +S_+' id="app">'+app+E_+'</body></html>';
}
async function commit(){
  if(!dirty||readOnly) return;
  if(!artifact){ setSave('Saved on this device'); dirty=false; return; }
  setSave('Saving…');
  try{
    sessionStorage.setItem('zb-open', open||''); sessionStorage.setItem('zb-filter', filter);
    await artifact.publish(buildDoc()); dirty=false; setSave('Saved','on');
  }catch(e){
    const c=e&&e.code;
    if(c==='conflict') return;
    if(c==='rate_limited'){ timer=setTimeout(commit,8000); setSave('Queued…'); return; }
    if(['not_writer','not_granted','not_declared','capability_disabled','capability_removed'].includes(c)){
      readOnly=true; setSave('Read-only view','err'); return; }
    setSave('Saved on this device only','err');
  }
}

/* ── rendering ────────────────────────────────────────── */
function matches(c){
  if(!FILTERS.find(f=>f[0]===filter)[3](c)) return false;
  if(catf && S(c).cat!==catf) return false;
  if(!q) return true;
  return (c.q+' '+c.vtitle+' '+c.vnote+' '+c.id+' '+S(c).note+' '+
          c.turns.map(t=>t.text).join(' ')).toLowerCase().includes(q);
}
const visible = () => DATA.filter(matches);

function renderBar(){
  const n=DATA.length, by={ok:0,kb:0,dig:0,product:0};
  DATA.forEach(c=>{ const d=S(c).d; if(d) by[d]=(by[d]||0)+1; });
  const done=by.ok+by.kb+by.dig+by.product;
  el('#seg').innerHTML=DECS.map(k=>by[k]?'<i class="'+k+'" style="width:'+(by[k]/n*100)+'%" title="'+SHORT[k]+' '+by[k]+'"></i>':'').join('');
  el('#done').innerHTML='<b>'+done+'</b> / '+n+' decided';
  el('#chips').innerHTML=FILTERS.map(([k,label,cls,fn])=>
    '<button class="chip '+cls+'" data-f="'+k+'" aria-pressed="'+(filter===k)+'">'+
    label+' <b>'+DATA.filter(fn).length+'</b></button>').join('');
}

function rowHTML(c){
  const s=S(c), out=[];
  out.push('<span class="pill cat">'+esc(CATLBL[s.cat]||s.cat)+'</span>');
  if(c.carried) out.push('<span class="pill wait">waiting since '+c.carried+'</span>');
  if(c.reask>=4) out.push('<span class="pill re">'+c.reask+'× re-asked</span>');
  if(s.note) out.push('<span class="pill note">note</span>');
  if(!s.d&&s.sug) out.push('<span class="pill sug">'+SHORT[s.sug]+'?</span>');
  return '<div class="line">'
    +'<span class="dot '+(c.human?'h':'b')+'" title="'+(c.human?'A human replied':'AI only')+'"></span>'
    +'<span class="tm mono">'+c.date.slice(11)+'</span>'
    +'<span class="ttl">'+esc(c.vtitle||c.q)+'</span>'
    +'<span class="meta">'+out.join('')+'</span>'
    +'<span class="acts">'+DECS.map(k=>
        '<button class="act a-'+k+'" data-d="'+k+'" data-id="'+c.id+'" aria-pressed="'+(s.d===k)+'"'
        +' title="'+SHORT[k]+'">'+SHORT[k]+'</button>').join('')+'</span>'
    +'</div>';
}

function panelHTML(c){
  const s=S(c);
  let h='<div class="panel">';
  if(c.verdict) h+='<div class="read"><div class="k">Claude reads this as: '+esc(c.verdict)+'</div><p>'+esc(c.vnote)+'</p></div>';
  h+='<div class="frm">'
    +'<button class="idc mono" data-copy="'+c.id+'">'+c.id+'</button>'
    +'<select class="sel" data-cat="'+c.id+'">'+META.categories.map(([k,l])=>
        '<option value="'+k+'"'+(s.cat===k?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select>'
    +'<textarea class="note" data-note="'+c.id+'" placeholder="What you want done with this one. Screenshots go in the chat — quote the id.">'+esc(s.note)+'</textarea>'
    +'</div><div class="thread">';
  for(const t of c.turns){
    if(!t.text&&!t.cited.length) continue;
    const r=t.role==='customer'?'customer':(t.role==='human'?'human':'bot');
    const w=r==='customer'?esc(t.who||'Client'):r==='human'?esc(t.who||'Zooza'):'AI';
    h+='<div class="turn t-'+r+'"><div class="who">'+w+'</div><div class="bub">'+esc(t.text);
    if(t.cited.length) h+='<div class="cited"><b>Cited</b>'+t.cited.map(x=>
      '<div class="'+(MARKETING.test(x)?'m':'')+'">'+esc(x)+'</div>').join('')+'</div>';
    h+='</div></div>';
  }
  return h+'</div></div>';
}

function renderList(){
  const rows=visible();
  if(cursor>=rows.length) cursor=Math.max(0,rows.length-1);
  if(!rows.length){ el('#list').innerHTML='<p class="empty">Nothing matches that.</p>'; return; }
  let h='', day='';
  rows.forEach((c,i)=>{
    if(c.day!==day){ day=c.day;
      h+='<div class="day">'+new Date(day+'T12:00:00').toLocaleDateString('en-GB',
         {weekday:'long',day:'numeric',month:'long'})+'</div>'; }
    const s=S(c), isOpen=open===c.id;
    h+='<div class="row'+(s.d?' decided d-'+s.d:'')+(isOpen?' open':'')+(i===cursor?' cursor':'')
      +'" data-id="'+c.id+'" data-i="'+i+'">'+rowHTML(c)+(isOpen?panelHTML(c):'')+'</div>';
  });
  el('#list').innerHTML=h;
}

function renderRoll(){
  const keys=META.categories.map(x=>x[0]), agg={};
  keys.forEach(k=>agg[k]={n:0,kb:0,dig:0,ok:0,product:0,todo:0});
  DATA.forEach(c=>{ const s=S(c), a=agg[s.cat]||(agg[s.cat]={n:0,kb:0,dig:0,ok:0,product:0,todo:0});
    a.n++; if(s.d) a[s.d]++; else a.todo++; });
  const rows=keys.filter(k=>agg[k].n).sort((a,b)=>agg[b].n-agg[a].n);
  const cell=v=>v?String(v):'<span class="z">·</span>';
  let h='<table class="rt"><thead><tr><th>Category</th><th>All</th><th>KB</th><th>Dig</th><th>Fine</th><th>Left</th></tr></thead><tbody>';
  rows.forEach(k=>{const a=agg[k];
    h+='<tr><td><button data-cat-filter="'+k+'">'+esc(CATLBL[k]||k)+'</button></td><td>'+a.n+'</td><td>'
      +cell(a.kb)+'</td><td>'+cell(a.dig)+'</td><td>'+cell(a.ok)+'</td><td>'+cell(a.todo)+'</td></tr>';});
  el('#roll').innerHTML=h+'</tbody></table>';
}

const render=()=>{ renderBar(); renderList(); renderRoll(); };

function scrollCursor(){
  const r=el('.row.cursor'); if(!r) return;
  const top=r.getBoundingClientRect().top, h=el('.bar').offsetHeight;
  if(top<h+8||top>window.innerHeight-60) r.scrollIntoView({block:'center'});
}

/* ── acting ───────────────────────────────────────────── */
function decide(id,d){
  const s=S(byId(id)); s.d = s.d===d ? '' : d; touch(); render();
}
function toggle(id){ open = open===id ? null : id; renderList();
  if(open){ const r=el('.row.open'); if(r) r.scrollIntoView({block:'nearest'}); } }

el('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip'); if(!b) return;
  filter=b.dataset.f; cursor=0; render(); window.scrollTo({top:0});});
el('#catf').addEventListener('change',e=>{catf=e.target.value; cursor=0; render();});
el('#q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase(); cursor=0; render();});
el('#roll').addEventListener('click',e=>{const b=e.target.closest('[data-cat-filter]'); if(!b) return;
  catf=b.dataset.catFilter; el('#catf').value=catf; filter='all'; render(); window.scrollTo({top:0});});

el('#list').addEventListener('click',e=>{
  const a=e.target.closest('.act'); if(a){ e.stopPropagation(); decide(a.dataset.id,a.dataset.d); return; }
  const cp=e.target.closest('[data-copy]'); if(cp){ e.stopPropagation();
    navigator.clipboard?.writeText(cp.dataset.copy);
    const t=cp.textContent; cp.textContent='copied'; setTimeout(()=>{cp.textContent=t;},900); return; }
  if(e.target.closest('.note')||e.target.closest('.sel')) return;
  const r=e.target.closest('.row'); if(!r) return;
  cursor=+r.dataset.i; toggle(r.dataset.id);
});
el('#list').addEventListener('input',e=>{
  const n=e.target.closest('[data-note]'); if(n){ S(byId(n.dataset.note)).note=n.value; touch(); }});
el('#list').addEventListener('change',e=>{
  const c=e.target.closest('[data-cat]'); if(c){ S(byId(c.dataset.cat)).cat=c.value; touch(); renderBar(); renderRoll(); }
  const n=e.target.closest('[data-note]'); if(n) renderList();});

function nextUndecided(){
  const rows=visible();
  for(let i=1;i<=rows.length;i++){ const j=(cursor+i)%rows.length;
    if(!S(rows[j]).d){ cursor=j; open=rows[j].id; renderList(); scrollCursor(); return; } }
  setSave('All decided','on');
}
el('#next').addEventListener('click',nextUndecided);

document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const t=e.target.tagName;
  if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT'){ if(e.key==='Escape') e.target.blur(); return; }
  const rows=visible(); if(!rows.length) return;
  if(e.key==='j'||e.key==='ArrowDown'){ e.preventDefault(); cursor=Math.min(cursor+1,rows.length-1); renderList(); scrollCursor(); }
  else if(e.key==='k'||e.key==='ArrowUp'){ e.preventDefault(); cursor=Math.max(cursor-1,0); renderList(); scrollCursor(); }
  else if(e.key==='Enter'){ e.preventDefault(); toggle(rows[cursor].id); }
  else if(e.key==='Escape'&&open){ open=null; renderList(); }
  else if(e.key==='n'){ e.preventDefault(); nextUndecided(); }
  else if(e.key==='/'){ e.preventDefault(); el('#q').focus(); }
  else if('1234'.includes(e.key)){ e.preventDefault(); decide(rows[cursor].id,DECS[+e.key-1]); scrollCursor(); }
});

/* ── handoff ──────────────────────────────────────────── */
el('#hand').addEventListener('click',()=>{
  const head={kb:'Into the KB',dig:'Dig into it first',product:'Product, not KB',ok:'Fine as answered'};
  let out='# Weekly review — '+META.start+' to '+META.end+'\n';
  const left=DATA.filter(c=>!S(c).d).length;
  out+='\n'+(DATA.length-left)+' of '+DATA.length+' decided'+(left?', '+left+' still open':'')+'.\n';
  ['kb','dig','product','ok'].forEach(d=>{
    const rows=DATA.filter(c=>S(c).d===d); if(!rows.length) return;
    out+='\n## '+head[d]+' ('+rows.length+')\n\n';
    rows.forEach(c=>{ const s=S(c);
      if(d==='ok'&&!s.note){ out+='- '+c.id+' — '+(c.vtitle||c.q.slice(0,70))+'\n'; return; }
      out+='- **'+c.id+'** ['+(CATLBL[s.cat]||s.cat)+'] '+(c.vtitle||c.q.slice(0,90))+'\n';
      if(c.carried) out+='  - unanswered since '+c.carried+'\n';
      if(s.note) out+='  - Michal: '+s.note.replace(/\n+/g,' ')+'\n'; });
  });
  const un=DATA.filter(c=>!S(c).d);
  if(un.length){ out+='\n## Not decided yet ('+un.length+')\n\n';
    un.forEach(c=>{ out+='- '+c.id+' — '+(c.vtitle||c.q.slice(0,70))+'\n'; }); }
  el('#hout').value=out; el('#hdlg').showModal();
});
el('#hclose').addEventListener('click',()=>el('#hdlg').close());
el('#hcopy').addEventListener('click',async()=>{
  const t=el('#hout'); t.select();
  try{ await navigator.clipboard.writeText(t.value); }catch(e){ document.execCommand('copy'); }
  el('#hcopy').textContent='Copied'; setTimeout(()=>{el('#hcopy').textContent='Copy';},1200);
});
window.addEventListener('beforeunload',e=>{ if(dirty){ commit(); e.preventDefault(); e.returnValue=''; }});

/* ── boot ─────────────────────────────────────────────── */
el('#wkrange').textContent=META.start+' – '+META.end+' · '+META.counts.total+' conversations';
el('#catf').innerHTML='<option value="">Every category</option>'+
  META.categories.map(([k,l])=>'<option value="'+k+'">'+esc(l)+'</option>').join('');
open=sessionStorage.getItem('zb-open')||null;
filter=sessionStorage.getItem('zb-filter')||'todo';
sessionStorage.removeItem('zb-open'); sessionStorage.removeItem('zb-filter');
setSave('');
render();
if(typeof claude!=='undefined'&&claude&&typeof claude.use==='function'){
  claude.use('artifact').then(a=>{ artifact=a;
    setSave(a?'Saving is on':'Saved on this device', a?'on':''); })
    .catch(()=>setSave('Saved on this device'));
} else setSave('Saved on this device');
</script>
