<title>Help desk triage — 2026-09-04 to 2026-09-10</title>
<style id="sheet">
:root{
  --ground:#ffffff; --surface:#f7f8f2; --surface-2:#eef2f5; --raise:#ffffff;
  --line:#dde3e1; --line-soft:#ebefed;
  --ink:#414141; --ink-deep:#1a222b; --muted:#6f7d7b; --faint:#9aa7a4;
  --teal:#0e7972; --teal-soft:#e2efee;
  --brand:#fa6900; --brand-dark:#e35f00;
  --ok:#3f6212; --ok-soft:#eef4e4;
  --kb:#0e7972; --kb-soft:#e2efee;
  --dig:#8a5200; --dig-soft:#fff2df;
  --prod:#6f7d7b; --prod-soft:#eef2f5;
  --critical:#a20000; --critical-soft:#f7e6e6;
}

  :root:not([data-theme="light"]){
    --ground:#12171a; --surface:#181f22; --surface-2:#1f282c; --raise:#171e21;
    --line:#2c383d; --line-soft:#222b2f;
    --ink:#ccd5d3; --ink-deep:#f2f6f4; --muted:#8b9997; --faint:#6b7876;
    --teal:#4fb6ae; --teal-soft:#12302e;
    --brand:#ff8434; --brand-dark:#ff9a56;
    --ok:#a3c266; --ok-soft:#1e2718;
    --kb:#4fb6ae; --kb-soft:#12302e;
    --dig:#e3ac63; --dig-soft:#2e2417;
    --prod:#8b9997; --prod-soft:#1f282c;
    --critical:#ff7b72; --critical-soft:#33201f;
  }
}
:root[data-theme="dark"]{
  --ground:#12171a; --surface:#181f22; --surface-2:#1f282c; --raise:#171e21;
  --line:#2c383d; --line-soft:#222b2f;
  --ink:#ccd5d3; --ink-deep:#f2f6f4; --muted:#8b9997; --faint:#6b7876;
  --teal:#4fb6ae; --teal-soft:#12302e;
  --brand:#ff8434; --brand-dark:#ff9a56;
  --ok:#a3c266; --ok-soft:#1e2718;
  --kb:#4fb6ae; --kb-soft:#12302e;
  --dig:#e3ac63; --dig-soft:#2e2417;
  --prod:#8b9997; --prod-soft:#1f282c;
  --critical:#ff7b72; --critical-soft:#33201f;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:13.5px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px;border-radius:3px}

/* ══ command bar ══ */
.bar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1240px;margin:0 auto;padding:9px 20px;display:flex;flex-direction:column;gap:8px}
.bar-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.wk{display:flex;flex-direction:column;line-height:1.15;margin-right:auto}
.wk b{font-size:13px;color:var(--ink-deep);font-weight:700}
.wk span{font-size:11px;color:var(--muted)}
.done{font-size:12px;color:var(--muted);white-space:nowrap}
.done b{color:var(--ink-deep);font-size:14px}
.seg{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--surface-2);
     border:1px solid var(--line);flex:1;min-width:120px;max-width:300px}
.seg i{display:block;height:100%}
.seg i.ok{background:var(--ok)} .seg i.kb{background:var(--kb)}
.seg i.dig{background:var(--dig)} .seg i.product{background:var(--prod)}
.btn{font-size:12px;padding:5px 11px;border-radius:6px;border:1px solid var(--line);background:var(--raise)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dark);border-color:var(--brand-dark)}
.save{font-size:11px;color:var(--muted);white-space:nowrap}
.save.on{color:var(--teal)} .save.err{color:var(--critical)}

.bar-bot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);
      background:transparent;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.chip:hover{border-color:var(--muted)}
.chip b{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink-deep);border-color:var(--ink-deep);color:var(--ground)}
.chip[aria-pressed="true"] b{color:var(--ground);opacity:.75}
.chip.k-ok[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.k-kb[aria-pressed="true"]{background:var(--kb);border-color:var(--kb);color:#fff}
.chip.k-dig[aria-pressed="true"]{background:var(--dig);border-color:var(--dig);color:#fff}
.chip.k-wait[aria-pressed="true"]{background:var(--critical);border-color:var(--critical);color:#fff}
.srch{margin-left:auto;font:inherit;font-size:12px;padding:4px 9px;border:1px solid var(--line);
      border-radius:6px;background:var(--raise);color:var(--ink);width:190px}
.srch::placeholder{color:var(--faint)}
.sel{font:inherit;font-size:12px;padding:4px 7px;border:1px solid var(--line);border-radius:6px;
     background:var(--raise);color:var(--ink)}

/* ══ list ══ */
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 60px}
.day{display:flex;align-items:center;gap:9px;padding:14px 2px 5px;font-size:10.5px;
     letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600}
.day::after{content:"";flex:1;height:1px;background:var(--line-soft)}

.row{display:block;width:100%;text-align:left;background:var(--raise);border:0;
     border-bottom:1px solid var(--line-soft);border-left:3px solid transparent;padding:0}
.row:hover{background:var(--surface)}
.row.cursor{background:var(--surface-2)}
.row.d-ok{border-left-color:var(--ok)} .row.d-kb{border-left-color:var(--kb)}
.row.d-dig{border-left-color:var(--dig)} .row.d-product{border-left-color:var(--prod)}
.row.decided .ttl{color:var(--muted)}
.line{display:grid;grid-template-columns:auto 46px 1fr auto auto;align-items:center;
      gap:10px;padding:7px 10px;min-height:38px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.h{background:var(--teal)} .dot.b{border:1.5px solid var(--faint)}
.tm{font-size:11px;color:var(--faint);text-align:right}
.ttl{color:var(--ink-deep);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.meta{display:flex;gap:5px;align-items:center;flex-wrap:nowrap}
.pill{font-size:10px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);
      color:var(--muted);white-space:nowrap}
.pill.cat{background:var(--surface-2)}
.pill.wait{color:var(--critical);border-color:var(--critical);background:var(--critical-soft);font-weight:600}
.pill.re{color:var(--dig);border-color:var(--dig);background:var(--dig-soft)}
.pill.note{color:#fff;background:var(--brand);border-color:var(--brand)}
.pill.sug{border-style:dashed;color:var(--faint)}

.acts{display:flex;gap:3px}
.act{font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:3px 8px;border-radius:5px;
     border:1px solid var(--line);background:var(--raise);color:var(--muted);line-height:1.5}
.act:hover{border-color:var(--muted);color:var(--ink-deep)}
.act[aria-pressed="true"]{color:#fff;border-color:transparent}
.act.a-ok[aria-pressed="true"]{background:var(--ok)}
.act.a-kb[aria-pressed="true"]{background:var(--kb)}
.act.a-dig[aria-pressed="true"]{background:var(--dig)}
.act.a-product[aria-pressed="true"]{background:var(--prod)}

/* ══ expanded ══ */
.open{border-left-width:3px;background:var(--surface)}
.panel{padding:2px 10px 16px 30px;display:flex;flex-direction:column;gap:12px}
.read{border-left:2px solid var(--kb);background:var(--raise);padding:9px 13px;border-radius:0 6px 6px 0}
.read .k{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.read p{margin:3px 0 0}
.frm{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.note{flex:1;min-width:240px;font:inherit;font-size:12.5px;padding:7px 9px;border:1px solid var(--line);
      border-radius:6px;background:var(--raise);color:var(--ink);resize:vertical;min-height:52px}
.note::placeholder{color:var(--faint)}
.idc{font-size:11px;border:1px solid var(--line);background:var(--raise);border-radius:5px;padding:2px 7px}
.idc:hover{border-color:var(--brand);color:var(--brand)}
.thread{display:flex;flex-direction:column;gap:8px;max-height:min(60vh,620px);overflow-y:auto;
        padding-right:4px}
.turn{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:start}
.turn .who{font-size:10px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;
           color:var(--faint);padding-top:5px;text-align:right;overflow-wrap:anywhere}
.turn.t-customer .who{color:var(--ink-deep)} .turn.t-human .who{color:var(--teal)}
.bub{font-family:Georgia,"Iowan Old Style",serif;font-size:13.5px;line-height:1.55;white-space:pre-wrap;
     overflow-wrap:anywhere;padding:7px 11px;border-radius:6px;background:var(--raise);
     border:1px solid var(--line-soft)}
.turn.t-customer .bub{background:var(--surface-2);border-color:var(--line)}
.turn.t-human .bub{background:var(--teal-soft);border-color:var(--teal)}
.cited{margin-top:6px;font-family:ui-sans-serif,system-ui,sans-serif;font-size:10.5px;color:var(--muted);
       border-top:1px dashed var(--line);padding-top:5px}
.cited b{display:block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.cited .m{color:var(--critical)}

.empty{padding:40px 10px;text-align:center;color:var(--muted)}
.foot{max-width:1240px;margin:0 auto;padding:4px 20px 40px;display:flex;gap:26px;flex-wrap:wrap;
      font-size:11.5px;color:var(--faint)}
.foot kbd{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;border:1px solid var(--line);
          border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted);background:var(--raise)}

details.roll{border-top:1px solid var(--line-soft)}
details.roll summary{cursor:pointer;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
                     color:var(--muted);font-weight:600;padding:11px 2px;list-style:none}
details.roll summary::-webkit-details-marker{display:none}
details.roll summary::before{content:"▸ ";color:var(--faint)}
details.roll[open] summary::before{content:"▾ "}
table.rt{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:14px}
table.rt th{text-align:right;font-weight:600;color:var(--faint);font-size:10px;text-transform:uppercase;
            letter-spacing:.06em;padding:0 6px 4px 0}
table.rt th:first-child{text-align:left}
table.rt td{padding:3px 6px 3px 0;border-top:1px solid var(--line-soft);text-align:right;
            font-variant-numeric:tabular-nums}
table.rt td:first-child{text-align:left;color:var(--ink-deep)}
table.rt td.z{color:var(--line)}
.rt button{background:none;border:0;padding:0;font:inherit;text-align:left}
.rt button:hover{color:var(--brand);text-decoration:underline}

dialog{border:1px solid var(--line);border-radius:10px;background:var(--raise);color:var(--ink);
       padding:0;max-width:min(760px,92vw);width:100%}
dialog::backdrop{background:rgba(26,34,43,.5)}
.dlg{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.dlg h2{margin:0;font-size:15px;color:var(--ink-deep)}
.dlg p{margin:0;font-size:12px;color:var(--muted)}
.dlg textarea{width:100%;height:320px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;
              line-height:1.5;padding:10px;border:1px solid var(--line);border-radius:6px;
              background:var(--surface);color:var(--ink);resize:vertical}
.dlg .rw{display:flex;gap:8px;justify-content:flex-end}

@media (max-width:820px){
  .line{grid-template-columns:auto 1fr;grid-template-areas:"d t" "m m" "a a";gap:5px 9px}
  .tm{display:none}
  .meta{grid-area:m;flex-wrap:wrap} .acts{grid-area:a}
  .ttl{white-space:normal}
  .srch{width:100%;margin-left:0;order:99}
  .panel{padding-left:12px}
  .turn{grid-template-columns:1fr;gap:2px}
  .turn .who{text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script id="data">const DATA=[{"channel": "email", "id": "email-magikats-claude-delete", "date": "2026-09-10T09:00:00", "day": "2026-09-10", "human": true, "bucket": "EMAIL", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Using Claude (8-10 Sep)", "turns": [{"role": "customer", "who": "Sarah Marsh", "text": "Is there a reason why Claude is not allowed to delete a session? Or am I asking it the wrong question? It's for Hove again - they want to delete specific time slots on specific days when those become full.", "cited": []}, {"role": "human", "who": "Michal", "text": "Session deletion isn't available through Claude just yet - we haven't enabled it as an MCP action. The main reason was caution: bulk delete is powerful and we didn't want anyone accidentally wiping sessions. That said, it's quick to do directly in the App: go to Sessions, filter by the specific time slot, and bulk delete from there. Should take under a minute. We'll be rolling out more actions to Claude gradually - deletion is on the list.", "cited": []}], "verdict": "gap", "vtitle": "Claude will not delete sessions — bulk delete is an app job", "vnote": "Sarah asked whether she was asking Claude the wrong question. Hove wants to remove specific time slots on specific days once they fill up. Michal: session deletion is deliberately not an MCP action (bulk delete is powerful, nobody should wipe sessions by accident); do it in the app — Sessions, filter by the time slot, bulk delete. Deletion is on the roadmap. Our connector page lists cancelling a session as app-only but never mentions deleting, and never gives the filter-then-bulk-delete route.", "cat": "ai", "from": "Sarah Marsh — MagiKats"}, {"channel": "email", "id": "email-gsgk-entry-passes", "date": "2026-09-10T09:00:00", "day": "2026-09-10", "human": true, "bucket": "EMAIL", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Managing a booking payment (9-10 Sep)", "turns": [{"role": "customer", "who": "Tommy Wingrove", "text": "I need to assign x12 entry passes to both children's bookings whilst ensuring the booking balance is AED0 as she has already paid. The passes I've tried to add are just creating more balance as I can't check them as paid.", "cited": []}, {"role": "human", "who": "Martin", "text": "Two ways: parents buy them from the customer portal, or you add them manually — open the booking, use the products card on the right-hand side to create a new order.", "cited": []}, {"role": "human", "who": "Martin", "text": "1) navigate to the booking and hit Buy. 2) tick the payment method option and OK — this creates an order. 3) if the product has the entrance vouchers as mandatory, the system adds them; if the booking form lets the parent choose, you open the order and use Add item to order. 4) go to the booking and hit Add Payment to mark it already paid. All entry passes are generated at this point and released for the parent to use.", "cited": []}], "verdict": "gap", "vtitle": "Adding entry passes to a booking that is already paid for", "vnote": "Tommy took two Friday Club bookings before the programme was configured, and needed to put 12 entry passes on each while leaving the balance at zero. Every attempt raised the balance instead. Martin gave the full procedure and the fact that unblocks it: the passes are generated only when the order is marked paid. Nothing in the KB describes adding passes to an existing booking from the admin side.", "cat": "payments", "from": "Tommy Wingrove — Get Set Go Kids (AE)"}, {"channel": "email", "id": "email-gsgk-booking-without-payment", "date": "2026-09-10T09:00:00", "day": "2026-09-10", "human": true, "bucket": "EMAIL", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Bookings that exist without payment (10 Sep)", "turns": [{"role": "customer", "who": "Tommy Wingrove", "text": "I'm not sure if there is an option to prevent any booking being made without payment? I'm not sure how or why parents are booking but then missing the payment stage.", "cited": []}, {"role": "human", "who": "Martin", "text": "The booking itself can happen without the payment purely because the payment follows the booking creation. In order to pay for a booking, that booking needs to exist — same as shopping on Amazon: if your payment fails, the booking exists so you can change card without re-ordering. The very existence of a booking without payment is not a problem.", "cited": []}], "verdict": "gap", "vtitle": "A booking without a payment is by design, not a fault", "vnote": "Tommy asked whether booking can be blocked until payment succeeds. Martin: the payment follows the booking because the booking has to exist to be paid for — same as a failed card at any checkout, so the parent can retry without rebuilding the order. Worth writing down; it reads as a bug to every new operator. Tommy also reports a payment confirmation arriving without a payment — that one is unverified and Martin asked for the booking.", "cat": "payments", "from": "Tommy Wingrove — Get Set Go Kids (AE)"}, {"channel": "email", "id": "email-weekicks-bfa", "date": "2026-09-10T09:00:00", "day": "2026-09-10", "human": true, "bucket": "EMAIL", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Zooza / BFA (10 Sep)", "turns": [{"role": "customer", "who": "weekicks", "text": "Making an introduction — Helen has been absolutely amazing for us in our journey so far within the BFA.", "cited": []}], "verdict": "client", "vtitle": "Introduction to Helen Thompson at the BFA", "vnote": "Partnership introduction, no product question. Nothing for the KB. The 'Zooza - leveraging AI' Zoom with the weekicks franchisees ran on 9 Sep — if anything came out of it that customers will ask about, it is not in the mailbox.", "cat": "account", "from": "weekicks — info@weekicks.co.uk"}, {"channel": "intercom", "id": "215475889682869", "date": "2026-09-10 21:32", "day": "2026-09-10", "human": false, "bucket": "D_assumed_with_kb", "reask": 4, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Getting Started with Zooza | Zooza Help", "Trial Classes FAQ | Zooza Help", "Payment Pairing for Bank Transfers & Direct Debit | Zooza Help", "Client Profile 101 | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Automatic reminders for payment schedule | Zooza Help", "WhatsApp Messaging for Classes | Reminders, Changes & Payments | Zooza", "Class Payments & Invoicing | Zooza"], "q": "for a payment plan like the instalment one, how is the remaining one collected", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Jochelle Laguipo-Strzalkowska", "text": "for a payment plan like the instalment one, how is the remaining one collected", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "The remaining balance is collected automatically through the payment plan schedule.\n\n\n\n\n- When a client books, the deposit is charged immediately.\n\n- The remaining amount is split into instalments based on the payment plan you configured.\n\n- Each instalment becomes a payment request for the parent. \n\n\nHow it’s paid depends on the payment methods you enabled:\n\n\n\n\n- \nCard (Stripe) – can be charged automatically on the due date if the parent saved their card.\n\n- \nDirect debit (CardPay) – can also be charged automatically.\n\n- \nBank transfer – the parent receives payment instructions and pays manually. \n\n\nZooza also sends reminders before the due date so parents don’t miss the instalment.\n\n\nIf you want, I can also explain how to set it up so parents can choose pay in full vs deposit + instalments on the same programme.", "cited": ["Payments and Billing FAQ | Zooza Help", "Getting Started with Zooza | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help understanding how instalment payments are collected, I’m here to help. Would you like to share more about what you’re trying to configure or clarify?", "cited": []}, {"role": "customer", "who": "Jochelle Laguipo-Strzalkowska", "text": "are parents going to be sent a payment link?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes. Parents receive a payment link automatically.\n\n\n\n\n- After booking, they get a confirmation email with a link to their Client Profile.\n\n- Inside the profile, they go to Payments, where they can open the unpaid instalment and pay online or view bank transfer instructions.  \n\n\nThey also receive email reminders when a payment is created or upcoming, so they know when to pay. \n\n\nIf you use WhatsApp notifications, payment reminders can also include a “pay now” link directly in the message. \n\n\nIf you want, I can also explain how to make the instalment payments charge automatically instead of parents paying manually.", "cited": ["Trial Classes FAQ | Zooza Help", "Automatic reminders for payment schedule | Zooza Help", "Client Profile 101 | Zooza Help", "WhatsApp Messaging for Classes | Reminders, Changes & Payments | Zooza"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Jochelle Laguipo-Strzalkowska", "text": "can they pay in advance>", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes, parents can pay in advance.\n\n\n\n\n- They may choose to pay the full amount upfront instead of following the instalment schedule. \n\n\n- They can also pay before the next instalment is due if they prefer to settle it early. \n\n\nOne thing to note: if a payment arrives before the instalment is created, it may not automatically match to the booking. In that case, it can be paired manually using the payment reference.\n\n\nIf you want, I can also explain how to clearly show both options (pay in full vs instalments) so parents can choose easily.", "cited": ["Class Payments & Invoicing | Zooza", "Payment Pairing for Bank Transfers & Direct Debit | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Jochelle Laguipo-Strzalkowska", "text": "how can they pay before the next instalment", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Parents can pay early by simply paying the amount before the next instalment is due.\n\n\n\n\n- They can go to their Client Profile → Payments and pay the outstanding balance manually (card, bank transfer, etc.).\n\n- They can also send a bank transfer in advance if they prefer. \n\n\nOne thing to note: if the payment arrives before the instalment is created, the system may not automatically match it to the booking. In that case, it can be paired manually in Payments → Payment reconciliation using the payment reference. \n\n\nSo parents can settle the remaining balance anytime before the scheduled instalment.", "cited": ["Payment Pairing for Bank Transfers & Direct Debit | Zooza Help", "Getting Started with Zooza | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help understanding early instalment payments, I’m here to help. Would you like to share more about what you’re trying to configure or clarify?", "cited": []}], "verdict": "gap", "vtitle": "How the remaining instalment gets collected", "vnote": "Asked four times, bot cited Getting Started and the Trial FAQ. This is a core payment-plan question and the retrieval is nowhere near it.", "cat": "payments"}, {"channel": "intercom", "id": "215475888115299", "date": "2026-09-10 20:02", "day": "2026-09-10", "human": false, "bucket": "D_assumed_with_kb", "reask": 1, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Instructors working hours | Zooza Help", "User roles | Zooza Help", "Instructors | Zooza Help"], "q": "hi, If I am in a role of owner but also I am teaching, here I can ad my absence and working hours ?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "barbora zajacova", "text": "hi, If I am in a role of owner but also I am teaching, here I can ad my absence and working hours ?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes. If you are the Owner and also teach, you can add both your working hours and absences. \n\n\nJust go to:\n\n\n\n\n- Instructors\n\n- Open your instructor profile\n\n\n- Go to the Working hours tab\n\n- Click Add availability\n\n\nFrom there you can:\n\n\n\n\n- Add Working Hours (when you are available to teach)\n\n- Add Absence (for holidays, illness, etc.) \n\n\nThese settings are then used by the system when scheduling new sessions.\n\n\nTip: if you want, I can also show you how to set up recurring weekly working hours so you do not have to enter them every time.", "cited": ["Instructors working hours | Zooza Help", "User roles | Zooza Help", "Instructors | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help with setting your working hours or absence as an instructor, I’m here to assist. Would you like to share more about what you’re trying to configure?", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215475375978780", "date": "2026-09-10 19:34", "day": "2026-09-10", "human": true, "bucket": "HUMAN", "reask": 3, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Denny prehlad nieje scrollovatelny v mobile view\n\nDobry den, denny prehlad nieje scrollovatelny v mobilnom view. Iphone13,ios 26.4, zooza verze N tional.", "cat": "programmes"}, {"channel": "intercom", "id": "215475880263676", "date": "2026-09-10 13:56", "day": "2026-09-10", "human": true, "bucket": "HUMAN", "reask": 1, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Login and Account FAQ | Zooza Help", "How to clear your cache | Zooza Help", "Managing sessions in a class | Zooza Help"], "q": "Dobrý deň, začalo sa nám na niektorých počítačoch zobrazovať čierne pozadie. Nebolo by to až také tragické, pretože konečne dobre vidieť oranžové písmo, ale v kalendári vôbec nevidno mriežku ani hodiny (čas) ďakujem", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Dagmar Lévayova", "text": "Dobrý deň, začalo sa nám na niektorých počítačoch zobrazovať čierne pozadie. Nebolo by to až také tragické, pretože konečne dobre vidieť oranžové písmo, ale v kalendári vôbec nevidno mriežku ani hodiny (čas) ďakujem", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "To vyzerá na cache prehliadača – často sa po aktualizácií zobrazí staršia verzia stránky a niektoré prvky (napr. mriežka v kalendári) sa nevykreslia správne. \n\n\nSkúste najskôr:\n\n\n\n\n- na stránke stlačiť Ctrl + Shift + R (hard refresh)\n\n- ak to nepomôže, otvorte Zooza v súkromnom / incognito okne\n\n\nAk sa vám zapol tmavý režim, môžete ho tiež zmeniť v Settings → My profile → Appearance → Theme → Light. \n\n\nAk chcete, pošlite prosím:\n\n\n\n\n- screenshot kalendára\n\n- URL stránky, kde to vidíte\n\nMôžem vám povedať, či je to pravdepodobne cache alebo niečo iné. 🙂", "cited": ["How to clear your cache | Zooza Help", "Login and Account FAQ | Zooza Help", "Managing sessions in a class | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc s čiernym pozadím a chýbajúcou mriežkou v kalendári, som tu pre vás. Chcete doplniť, na ktorých stránkach alebo zariadeniach sa problém zobrazuje?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den dagmar. To v akom style sa zooza zobrazuje si mozete individualne prisposobit vo svojom pouzivatelskom profile. System sa automaticky prepina do tmaveho rezimu ak tak mate nastaveny pocitac ale da sa to aj prepnut tak aby bol stale v svetlych farbach. Poslite prosim screenshot ako sa Vam to zobrazuje a farby samozrejme doladime. Tato zmena je v aplikacii uz vyse roka, takze to, ze sa Vam to zacalo zobrazovat iba teraz bude pravdepodobne sposobene nejakou aktualizaciu v ramci tych pocitacov", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215475879590045", "date": "2026-09-10 13:32", "day": "2026-09-10", "human": true, "bucket": "HUMAN", "reask": 27, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Online booking | Zooza Help", "Programme Settings | Zooza Help", "Registration and Booking FAQ | Zooza Help", "Publish (Widgets) | Zooza Help", "Widget Embedding Troubleshooting | Zooza Help", "Booking form settings overview | Zooza Help"], "q": "I have a session tonight. capacity is 20. 15 players have confirmed coming. When parents are trying to book via the website the session is not showing.", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "I have a session tonight. capacity is 20. 15 players have confirmed coming. When parents are trying to book via the website the session is not showing.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "This usually happens when the programme settings are hiding it from the public booking page.\n\n\nPlease check this first:\n\n\n\n\n- Go to Programmes → select the programme → Edit Settings\n\n\n- Open Online Booking\n\n\n- Make sure Allow online booking is ON\n\n- Make sure Display in catalogue is checked\n\n- Save the settings\n\nIf either of these is off, the programme will not appear on the website booking page or widget, even if the class still has capacity. \n\n\nOne quick question: Are you using the booking widget on your website, or the public booking page?\n\n\nThat will help narrow down the next thing to check.", "cited": ["Registration and Booking FAQ | Zooza Help", "Widget Embedding Troubleshooting | Zooza Help", "Publish (Widgets) | Zooza Help", "Programme Settings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help making tonight’s session visible for booking, I’m here to help. Would you like to share whether you’re using the booking widget or the public booking page?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "its on", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Got it — thanks for confirming that.\n\n\nIf Allow online booking and Display in catalogue are already on, the next things to check are:\n\n\n\n\n- \nClass selected for online booking\nGo to Programmes → your programme → Settings → Class Settings and make sure the class with tonight’s session is toggled on. If the class is not selected, it will not appear in the booking form. \n\n\n- \nHide before start setting\nIn Programmes → Settings → Online Booking, check Hide from booking form N hours before the programme begins. If this is set, the class may disappear close to the start time.  \n\n\n- \nWidget programme selection\nIf you’re using a website widget, open Team & Settings → Publish → your widget → Choose programmes and confirm the programme is included. \n\n\nQuick check: are you using the public booking page or a booking widget on your website? That will help narrow it down.", "cited": ["Publish (Widgets) | Zooza Help", "Programme Settings | Zooza Help", "Booking form settings overview | Zooza Help", "Online booking | Zooza Help"]}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Louis, could you please do send me a link to that session? We will have a look why it's not showing, whether its some kind of setting or what... Thank you", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "https://www.loudballers.com/barnet-pdc so the 5.30 - 6.30 session isn't showing.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "It says I have 20 players enrolled but only 15 attending. But also I would prefer it still showed on the website so people could join a waiting list.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Thank you Louis. My mistake. I would want to know which session it is in zooza so if you can navigate to that session within zooza and just copy the URL from the browser and paste it here, that'd be really helpful", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "As for the 20 vs 15 situation - I believe you are using Pay as you go type of class for this.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "https://uk.zooza.app/#courses/events/24184", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "No this is a trial and monthly sub session.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "If that is the case then those are two different numbers. Pay As You go programmes work in an Opt In fashion. Meaning that parents need to \"enroll\" to the class. but then they need to Opt in - Book to a specific session", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ah. Ok, then yes, the numbers stand", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Thank you for the link, let me check that and I'll get back to you", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Thanks", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ok, so if I understand you correctly Louis, you want that today's session to be available for people to sign into a trial?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "yes.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "So what is preventing this is that in your trial settings you have flagged that you want to Reserve seat for trial attendees.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Which means that if system would allow one more trial attendee it would mean you would have 21 enrollments", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "So thats fine. But there is a gap no? 20 enrolled 15 coming but only 2 paying as everyone is coming on the free trial?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Id prefer it so 20 players sign up and then 20 players are due to attend.  If 5 can't attend then we should have 5 spaces this evening?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "So the discrepancy is actually in the sessions I believe. When you offer trial sessions on your website, you offer up to 5 sessions from which the players can choose. Which in reality means that out of the total of 18 trials - not all of them would necessarily attend today's session. They might be booked in for a different time.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "ahh", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "So should every one of those trial attendees convert to paying customers your class would be full", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "If your venue/situation allows juggling the classes then you could turn off the reservation of the seat and allow people to book in", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "That makes sense.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "And then you would need to reshuffle them to a different class", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "because that way you could easily have over capacity issues", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "How about we just increased the cap to 25. We will never get more than 80% sign up after trials.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Also if we have a full class shouldn't it show on the website as full join waiting list?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "This would be doable, but you need to think this through. Currently you do offer both - trials and paid bookings. Which means that if you increase the capacity to 25, it would pose a risk of 25 people enrolling to the class as paid customers.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "This is common source of confusion as intuition says one thing and reality is often little more complicated:) Please let me explain:", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Say that you have capacity of 20 and turn off the seat reservation. You get 19 bookings for full programme - paying customers skipping the trial phase", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Then you get one trial for that last spot", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Since you don't reserve his seat, on your website we still advertise the last spot", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Someone will take that spot and book as a paying customer", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "This way you would get 21 people on one session", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "and for the rest of the programme you would have 20 but that one trial would need to be sorted and moved to a different time", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "An how would that show on the website?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Because trial does not constitute as a full enrollment. That is why you have that Reservation of the seat turned on. You see - when people enroll they enroll for the full class (every session within that class) but trial attendee is registered only for that single session. So without the Reservation flag - it will occupy only that single session's space.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "So essentially your setting is correct. There are businesses for which this is not a problem because plus one or two kids on a class is not a problem for them. But if your occupancy limits are strict I think it is best to have the setting turned on as you have", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "I mean we could perhaps create some hybrid model. So we would allow people in but clearly communicate that even though this trial session is in class A, after enrollment they'd need to be attending class B or something like that.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "I wouldn't want more than 22 players full enrolled. However If a session is sold out I would 100% want that to show on the website as sold out joining waiting list or join a different session?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Then you need to keep the class at 20 people", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "To prevent this in the future, you may consider offering just one trial session", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "That would make everyone to book at the same date essentially", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Players are only allowed 1 trial.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "I mean the options to choose the dates from", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "I would prefer that really", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "not the quantity of the trial sessions", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "These are your current settings - at the top you say that you have Single Trial session", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "yes maybe just to choose for next session coming.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "And then below the setting says - Let customers choose from 5 upcoming sessions", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "So if we change that 5 to 1, then only the very next session will be offered for trials", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "perfect.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "I changed that for you. It won't affect the today's session though as people already booked their preferred time. But it will help in the future", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Thank you so much for your help. Much appreciated.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Happy to help Louis:)", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "👍", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Sorry while I have you", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Just a quick one regarding automations before/after the session. What are we sending?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Before the session there is a Session reminder - This is sent one day before the session if enabled on the programme (it is enabled by default). It gives people a chance co cancel from that session for any reason.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "For pay as you go programmes there is also a Session Notification - which is the opposite of the session reminder. It is sent to people who are not attending that session as a reminder that they can book. This is also optional and needs to be turned on (by default it is turned off)", "cited": []}, { m their pc/phone and never finished the payment. This parent did that twice and eventually paid on third attempt.\n\n\n.", "cited": []}], "verdict": "gap", "vtitle": "An expired Stripe payment is an abandoned attempt, not a failure", "vnote": "Tommy saw outstanding in Zooza, incomplete in Stripe, and a confirmation in the parent's inbox. The parent had started the payment twice, wandered off, and paid on the third go. Expired means an intent that was never finished.", "cat": "payments"}, {"channel": "intercom", "id": "215475855336922", "date": "2026-09-10 08:30", "day": "2026-09-10", "human": true, "bucket": "HUMAN", "reask": 0, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": [], "q": "Hi both,\n\n\nApologies - I've hit another snag that neither I nor Claude can solve.\n\n\nWe received 2 bookings for Friday Club before the programme was set up correctly. Its was for siblings Bettina and Beanie Barnett from Misty Barnett.\n\n\nI've tried following the ai support and Claude's instructions but the passes I've tried to add to the booking is just creating more balance as I can't check them as paid.\n\n\nI need to assign x12 entry passes to both childrens bookings whilst ensuring the booking balance is AED0 as she has already paid.\n\n\nAny ideas how I can manage this one before I create even more mess?\n\n\nThanks\n\n\n\nTommy Wingrove\nFounder | Get Set Go Kids\n\n\nEarly years sports & movement programmes for children aged 1-6yrs \n\nHelping children build confidence through movement \nConfidence • Fundamentals • Fun \n\n\n\n\ntommy@getsetgokids.com\nwww.getsetgokids.com\n\n\n\nInstagram | Facebook", "turns": [{"role": "customer", "who": "TOMMY WINGROVE", "text": "Hi both,\n\n\nApologies - I've hit another snag that neither I nor Claude can solve.\n\n\nWe received 2 bookings for Friday Club before the programme was set up correctly. Its was for siblings Bettina and Beanie Barnett from Misty Barnett.\n\n\nI've tried following the ai support and Claude's instructions but the passes I've tried to add to the booking is just creating more balance as I can't check them as paid.\n\n\nI need to assign x12 entry passes to both childrens bookings whilst ensuring the booking balance is AED0 as she has already paid.\n\n\nAny ideas how I can manage this one before I create even more mess?\n\n\nThanks\n\n\n\nTommy Wingrove\nFounder | Get Set Go Kids\n\n\nEarly years sports & movement programmes for children aged 1-6yrs \n\nHelping children build confidence through movement \nConfidence • Fundamentals • Fun \n\n\n\n\ntommy@getsetgokids.com\nwww.getsetgokids.com\n\n\n\nInstagram | Facebook", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Sorry,\n\n\nQuestions are coming thick and fast...\n\n\nRegarding automated Templates...\n\n\nFollowing our call yesterday, we decided a Session Notification was automatically delivered to all those registered for the session the next day.\n\n\nThe Session Reminder was shared with those that hadn't booked in that programme?\n\n\nI've created a new copy / variation of the session notification but am unable to do the same for the session reminder? It seems this template is not specific to any programme in particular?\n\n\nI was looking at sending an email to all those enroilled in the Friday Club but who hadn't booked / bought an entry pass for that week? Is this even possible?\n\n\nOr will the Session Notification be sent to all those enrolled in the programme regardless as to whether they have booked a specific session that week?\n\n\nI'm trying to work out the best way to automate a weekly message either encouraging them to book, or cancel if they are no longer attending.\n\n\nThanks\n\n\nTommy Wingrove\n\n\nFounder | Get Set Go Kids\n\n\nEarly years sports & movement programmes for children aged 1-6yrs \nHelping children build confidence through movement \nConfidence • Fundamentals • Fun \n​\n\n\n\ntommy@getsetgokids.comwww.getsetgokids.com Instagram | Facebook", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Tommy,\n\n\n\n\n- No there is currently only one single version of the Session reminder. That email can be customised just per company not per programme.\n\n- 13 Session reminders were sent in total so far. 6 for yesterday. You can get a quick glance on whether emails were sent on reports' dashboard at the very bottom.\n\n- Session notification is sent to everyone with the list of sessions that are available to book for them - in other words if I booked for friday session but there is no more upcomming sessions that I could book I should not get it.\n\nThere might be adjustments you may want in regard of the session notifications and the mechanics how and to whom it is sent so if you have some comments regarding this, please let me know:)", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Hi both,\n\n\nJust following up on this - is there a way I can resolve the booking manually? I need to add entry passes to a booking so they can schedule sessions.\n\n\nFor some reason any issues we are encountering is with the Pay-As-You-Go Friday Club bookings.\n\n\nWe've had a missed sibling discount, missing entry passes and issues booking their sessions. I've never actually been able to complete the booking process on my own device without a wrong price being displayed?\n\n\nI'm not sure if there is an easier way to manage this programme? The entry pass logic is great for what I'd like to achieve but if the parents can't or won't use it for whatever reason maybe we can look at a different solution?\n\n\nI'm not sure if there is an option to prevent any booking being made without payment also? I'm not sure how or why parents are booking but then missing the payment stage?!\n\n\nLets discuss this tomorrow anyway.\n\n\nThanks!\n\n\nTommy Wingrove\n\n\nFounder | Get Set Go Kids\n\n\nEarly years sports & movement programmes for children aged 1-6yrs \nHelping children build confidence through movement \nConfidence • Fundamentals • Fun \n​\n\n\n\ntommy@getsetgokids.comwww.getsetgokids.com Instagram | Facebook", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Tommy,\n\n\nif you need to add new entry passes to an existing booking there are two ways to do that:\n\n\n1) parents can purchase them directly from the customer portal\n\n\n2) you can add that manually - Just navigate to the booking and on the right hand side - you will see a products card from which you can create new order for that booking. Since you collect money via card payments - parent would still need to navigate to customer portal and pay right there.\n\n\n\n\n\nAs for the sibling discount - not sure whether this is for the friday club but I don't think that sibling discount is available for this type of class.\n\n\n\n\n\nPrice being wrong on your device - Lets discuss this tomorrow. I will need to see your screen. And lastly - the booking itself can happen without the payment purely because the payment follows the booking creation. In other words - in order to be able to pay for a booking that booking needs to exist. This is same as when you're shopping on amazon - you create a booking and then you get send to a payment and if your payment fails for any reason that booking exists in their system so that you have an option to change a card or pay in a different way without re-ordering the same items again. So the very existence of a booking without payment is not a problem but we need to see whether this is systemic - e.g. we need to take action - or just life. You've had issues on your website with the https certificate - which is one of the reason why the payment could not be completed - but that is already sorted I believe.\n\n\n\n\n\nI'm confident that we'll resolve this. But on your point of having an alternative solution - there are really only two options:\n\n\n\n\n- Parents opt in - the current pay as you go model\n\n- Parents opt out - the regular full registration courses\n\nOpt in obviously requires more maintenance from the parent perspective, while opt out model means that the money aspect is harder to manage on your end and probably classes can't be paid in advance if you want to charge only for attended sessions. So I still believe that the opt in is better solution going ahead.\n\n\n\n\n\nLooking forward talking to you tomorrow. \n\n\nMartin", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Hi Martin,\n\n\nThanks for getting back to me.\n\n\nWe can take a look at this tomorrow also.\n\n\nThe passes in question were paid for before the system was set up properly (my fault) as I bumbled my way through. Payment has been made and received - I just need to add passes at zero fees to her account if at all possible?\n\n\nFor the sibling discount, I set this up for all programmes and it has been applied on other Friday Club bookings. Otherwise I'd like to understand how customers can use discount codes so I can share manually.\n\n\nUnderstood about the payment system - I wasn't sure whether there was a way to navigate around receiving a booking confirmation requesting payment when paymentisn't made? We also had an instance that payment wasn't made or successful this morning but a payment confirmation was sent?\n\n\nI'm also confident this can all be resolved, however, as it isn't working on my screen I'm always dubious whether it is user or system error when people are telling me it's not working.\n\n\nI'll try and put a list of our current points together before we catch up tomorrow to speed the process along a little.\n\n\nSpeak then and thanks for your patience as always.\n\n\nCheers\n\n\nTommy Wingrove\n\n\nFounder | Get Set Go Kids\n\n\nEarly years sports & movement programmes for children aged 1-6yrs \nHelping children build confidence through movement \nConfidence • Fundamentals • Fun \n​\n\n\n\ntommy@getsetgokids.comwww.getsetgokids.com Instagram | Facebook", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "I see. So this process is little bit cumbersome although we're currently working on improving it but that update is not ready yet.\n\n\n1) navigate to booking and hit the buy button here:\n\n\n2) You need to tick the payment method option and OK. This will create an order for you\n\n\n3) Based on the product configuration this should add all mandatory items to the order and link the order to that booking.\n\n\nTwo things may happen at this point:\n\n\na) Either you created an order for a product where the entrance vouchers have been mandatory - system will automatically add those to the order\n\n\nb) You created an order for a product where in the booking form Parent would choose between the options - you as admin won't choose. You have to go to the order and add the entrance pass to that order. This is for example your order:\n\n\nYou would hit the Add item to order button - and proceed through the wizard.\n\n\n\n\n\n4) Last thing would be to clear that order - You can simply go to the booking and hit the Add Payment to mark that the customer already paid. All entry passes will be generated at this point and released for parent to be used.\n\n\n\n\n\nCan you please send over that booking or email? I can check what happened there but I really can't see a way how a payment confirmation would be sent without a payment.\n\n\n\n\n\nTo be honest, I think it is always a mix of things - You learning new tool - still not fully trusting it because you are just learning it and at the same time parents are navigating this for the first time. Combined with the fact that you opted for one of the most complicated models available - I think it is pretty natural that you experience difficulties. But I believe that once we get the ball rolling it will get better.", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215475877092690", "date": "2026-09-10 07:28", "day": "2026-09-10", "human": false, "b o I find the dates set for automation emails to be sent after a trial has eneded", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can find the timing for those emails in the programme’s Trial automation settings.\n\n\nGo to:\n\n\nProgrammes → open the programme → Automations → Trials. \n\n\nThere you can set:\n\n\n\n\n- When the booking link is sent after the trial ends\n\n- \nFirst follow-up (after N days)\n\n- \nSecond follow-up (after additional N days)\n\n- When the trial is automatically marked Trial Lost. \n\n\nThese settings control the exact number of days after the trial session when each email is sent. \n\n\nIf you open a specific trial booking, you can also see the scheduled send dates in the booking timeline.", "cited": ["Trial Classes FAQ | Zooza Help", "Programme Settings | Zooza Help", "Automated notifications overview | Zooza Help", "Programme Automations | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help finding or understanding the trial automation email dates, I’m here to help. Would you like to share more about what you’re trying to check?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "how do I add someone to full program booking from a trial", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can convert a trial into a full programme booking directly from the trial booking.\n\n\nSteps:\n\n\n\n\n- Open the trial booking.\n\n- Click Enrol.\n\n- Select the class/programme you want them to join.\n\n- Set the payment amount (or choose a payment template).\n\n- Confirm. \n\n\nThis creates a new standard booking for the full programme and changes the trial status to Trial Won. The client will receive a confirmation email and can complete payment from their client profile.\n\n\nAlternative: you can also open the booking and use Change status → Enrolled to keep them in the same class. \n\n\nIf you want, I can also show you the cleanest way to send the enrolment link automatically after the trial ends.", "cited": ["Manage trial bookings — reschedule, convert, and close | Zooza Help", "Trial Classes FAQ | Zooza Help", "Bookings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "on change status I cant see enrol", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "only trial won", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "That’s expected. When the trial is still active (for example Trial started), the Change status menu will only show options like Trial Won or Trial Lost. The Enrolled option is not available yet. \n\n\nTo enrol them into the full programme:\n\n\n\n\n- Open the trial booking.\n\n- Click Enrol (this is a separate button on the booking page).\n\n- Choose the class/programme.\n\n- Set the payment amount or template and confirm. \n\n\nThis creates a normal programme booking and the trial status becomes Trial Won.\n\n\nIf you want, I can also show the quickest way to do this after the trial automation finishes.", "cited": ["Manage trial bookings — reschedule, convert, and close | Zooza Help", "Registration statuses — what each one means | Zooza Help", "Trial Classes FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help enrolling the trial participant into the full programme, I’m here to help. Would you like to share what you see on the trial booking page?", "cited": []}], "verdict": "gap", "vtitle": "Where the post-trial automation dates are set", "vnote": "Asked four times. Related to 215475848537071 — the same Trial sessions automation panel answers both.", "cat": "trials"}, {"channel": "intercom", "id": "215475875570472", "date": "2026-09-10 03:46", "day": "2026-09-10", "human": false, "bucket": "D_assumed_with_kb", "reask": 1, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Billing and invoicing | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Invoicing in Zooza — Overview | Zooza Help"], "q": "How to create an invoice for a client from a paid booking?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "How to create an invoice for a client from a paid booking?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can create an invoice directly from the booking.\n\n\nSteps:\n\n\n\n\n- Open the booking detail.\n\n- Find the Payments tile.\n\n- Click Show payments.\n\n- In the Invoices section, choose the Invoice profile.\n\n- Click Generate invoice.\n\nThe invoice is created immediately and sent to the client by email as a PDF. It will also appear in the booking’s invoice list with a downloadable link. \n\n\nNote: clicking Generate invoice again creates a new invoice, so avoid doing it twice unless you intentionally need another one. \n\n\nTip: you can also enable automatic invoice generation so invoices are created whenever a booking becomes paid.", "cited": ["Payments and Billing FAQ | Zooza Help", "Billing and invoicing | Zooza Help", "Invoicing in Zooza — Overview | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I hope this helped, but I’m here if you need any further assistance with creating an invoice from a paid booking. Would you like to share more about what you’re trying to do or anything that remains unclear?", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "email", "id": "email-gsgk-templates", "date": "2026-09-09T09:00:00", "day": "2026-09-09", "human": true, "bucket": "EMAIL", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Session reminder vs session notification (9 Sep)", "turns": [{"role": "customer", "who": "Tommy Wingrove", "text": "I've created a new copy of the session notification but am unable to do the same for the session reminder? It seems this template is not specific to any programme in particular?", "cited": []}, {"role": "human", "who": "Martin", "text": "No, there is currently only one single version of the Session reminder. That email can be customised just per company, not per programme. 13 Session reminders were sent in total so far. You can get a quick glance on whether emails were sent on the reports dashboard at the very bottom. Session notification is sent to everyone with the list of sessions that are available to book for them — if I booked the Friday session and there are no more upcoming sessions I could book, I should not get it.", "cited": []}], "verdict": "gap", "vtitle": "Session reminder is one template per company; session notification picks its own audience", "vnote": "Tommy copied the session notification per programme and could not do the same for the session reminder. Martin: there is only one session reminder and it is customisable per company, not per programme. The session notification goes to everyone who still has sessions available to book — someone with nothing left to book should not receive it. Whether the emails actually went out is visible at the very bottom of the reports dashboard. Three facts, none of them in the KB.", "cat": "comms", "from": "Tommy Wingrove — Get Set Go Kids (AE)"}, {"channel": "email", "id": "email-gsgk-onboarding", "date": "2026-09-09T09:00:00", "day": "2026-09-09", "human": true, "bucket": "EMAIL", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Onboarding Support (9 Sep)", "turns": [{"role": "customer", "who": "Tommy Wingrove", "text": "I've been trying to get to grips with the system over the past couple of weeks with varying degrees of success. I think I've reached a stage where I need some support.", "cited": []}, {"role": "human", "who": "Martin", "text": "We're happy to help you with the audit and walk through the setup together on Friday.", "cited": []}], "verdict": "client", "vtitle": "Asked for an account audit and a walkthrough", "vnote": "Martin booked a Friday session and is taking the audit. Account-specific, nothing to write, but it is the same account behind three of the gaps above.", "cat": "account", "from": "Tommy Wingrove — Get Set Go Kids (AE)"}, {"channel": "intercom", "id": "215475870830834", "date": "2026-09-09 22:02", "day": "2026-09-09", "human": false, "bucket": "D_assumed_with_kb", "reask": 6, "resolution": "confirmed_resolution", "rating": null, "carried": null, "sources": ["Programmes, classes, and sessions explained | Zooza Help", "Programme Settings | Zooza Help", "Registration and Booking FAQ | Zooza Help", "Roles and Permissions FAQ | Zooza Help", "User roles | Zooza Help", "Customizing widgets | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Booking form settings overview | Zooza Help", "Add instructors and manage their access | Zooza Help"], "q": "dá sa hromadne vypnúť zobrazovanie skupín na úrovni online zobrazovania v kalendári na webovej stránke?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": "Zuzana Daneková", "text": "dá sa hromadne vypnúť zobrazovanie skupín na úrovni online zobrazovania v kalendári na webovej stránke?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno – dá sa to, ale nie priamo ako „globálne vypnúť skupiny“ v kalendári.\n\n\nNajjednoduchší spôsob je vypnúť online rezervácie na úrovni programu. Tým sa skryjú všetky skupiny (kurzy) v danom programe z webu naraz. \n\n\nPostup:\n\n\n\n\n- otvorte Programme → Settings → Online Booking\n\n\n- nastavte Allow online booking = No\n\n\n- uložte\n\nTým sa celý program (všetky skupiny) skryje z online kalendára a rezervačnej stránky.\n\n\nKalendár widget má aj ďalšie nastavenia (napr. čo sa má zobraziť u jednotlivých hodín), ale globálne vypnutie samotných skupín v kalendári nie je samostatné nastavenie.", "cited": ["Programmes, Timetables and Sessions FAQ | Zooza Help", "Customizing widgets | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Hledali jste tohle?", "cited": []}, {"role": "customer", "who": "Zuzana Daneková", "text": "nemám v možnostiach programme. ako je to v slovenčine?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "V slovenčine sa tá položka volá „Povoliť online rezervácie“.\n\n\nCesta je:\n\n\n\n\n- \nProgramy → otvorte konkrétny program\n\n- \nNastavenia → Online rezervácie → Upraviť\n\n\n- nastavte Povoliť online rezervácie = Nie → uložte. \n\n\nTento prepínač je hlavný – ak je vypnutý, celý program (všetky skupiny) sa skryje z webu a z rezervačného formulára. \n\n\nAk chcete, môžem vám aj ukázať, kde presne to nájdete v menu, keď ste na stránke Programy.", "cited": ["Programmes, Timetables and Sessions FAQ | Zooza Help", "Programme Settings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Dostali jste odpověď na svou otázku?", "cited": []}, {"role": "customer", "who": "Zuzana Daneková", "text": "kde nájdem povoliť online registrácie?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Nájdete to v nastavení konkrétného programu.\n\n\nPostup:\n\n\n\n\n- \nProgramy → otvorte daný program\n\n- v prehľade dlaždíc nájdete Online Booking\n\n\n- kliknite Edit\n\n\n- nájdete prepínač Allow online booking (v slovenčine „Povoliť online registrácie“)\n\n- nastavte na Nie a uložte. \n\n\nTento prepínač je hlavný – ak je vypnutý, celý program (všetky skupiny) sa skryje z webu a z rezervačnej stránky.", "cited": ["Programmes, Timetables and Sessions FAQ | Zooza Help", "Programme Settings | Zooza Help", "Booking form settings overview | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Pomohlo vám to?", "cited": []}, {"role": "customer", "who": "Zuzana Daneková", "text": "ja nemám možnosť program. po Activity ide rovno klienti", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "To je pravdepodobne kvôli roli používateľa.\n\n\nAk v menu vidíte len Activity → Clients a nevidíte Kurzy (Programmes), pravdepodobne máte rolu Main instructor. Táto rola nemá prístup k menu Kurzy ani k ich nastaveniam. \n\n\nV tejto úrovni môžete pracovať len s:\n\n\n\n\n- skupinami (skupinami)\n\n- termínmi\n\n- svojimi klientmi a rezerváciami. \n\n\nNastavenie online registrácie je na úrovni Kurzy, takže ho vidí len administrátor alebo používateľ s rolou Assistant. \n\n\nAk chcete, môžem vám ešte povedať, kde sa táto rola zmení v nastavení.", "cited": ["Programmes, classes, and sessions explained | Zooza Help", "User roles | Zooza Help", "Roles and Permissions FAQ | Zooza Help", "Add instructors and manage their access | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Bylo to užitečné?", "cited": []}, {"role": "customer", "who": "Zuzana Daneková", "text": "ja som majiteľ", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "To je pravdepodobne len rozdiel v názve menu.\n\n\nV slovenčine sa Programmes volá Kurzy. Je to tá istá sekcia – len má iný názov. \n\n\nSkúste teda hľadať v ľavom menu položku Kurzy.\n\n\nPo otvorení kurzu nájdete nastavenie Online rezervácie, kde sa dá prepínač Povoliť online registrácie zapnúť alebo vypnúť. \n\n\nAk chcete, môžem vám ešte povedať presne, kde je tá položka v nastavení kurzu.", "cited": ["Programmes, classes, and sessions explained | Zooza Help", "User roles | Zooza Help", "Registration and Booking FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Pomohlo to?", "cited": []}, {"role": "customer", "who": "Zuzana Daneková", "text": "áno", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Skvelé, že som mohol pomôcť! Ak budete mať ešte nejaké otázky alebo budete potrebovať ďalšiu pomoc, som tu pre vás. 😊", "cited": []}], "verdict": "gap", "vtitle": "Bulk-hide classes from the website calendar — asked six times", "vnote": "Same family as 215475865695873. Turning online display off one class at a time is the known route; whether it can be done in bulk is the actual question.", "cat": "widgets"}, {"channel": "intercom", "id": "215475870169149", "date": "2026-09-09 21:24", "day": "2026-09-09", "human": false, "bucket": "D_assumed_with_kb", "reask": 3, "resolution": "confirmed_resolution", "rating": null, "carried": null, "sources": ["Jak automatizovat vaše podnikání v oblasti dětských aktivit (aniž byste ztratili osobní kontakt) — Zooza", "Checklist pred spustením nových kurzov: Na čo nezabudnúť, aby sa sezóna nezačala chaosom — Zooza", "Proč řešení „neviditelného“ rodičovského problému buduje silnější značku — Zooza", "Registrační stránka pro dětské kroužky: 5sekundový návod — Zooza", "Žebřík důvěry rodičů: 3 standardy pro dětské aktivity, které zvyšují retenci — Zooza"], "q": "informácie k úhrade , klientovi príde mail s údajmi na úhradu bez QR code ale po otvorení profilu v časti platba QR code, dá sa nastaviť aby QR code prišiel aj v maily?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": "Barbora Kubíková", "text": "informácie k úhrade , klientovi príde mail s údajmi na úhradu bez QR code ale po otvorení profilu v časti platba QR code, dá sa nastaviť aby QR code prišiel aj v maily?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ano – klientovi sa po registrácii odosiela e‑mail s faktúrou a možnosťami úhrady. V tejto fázi systém automaticky posiela informácie o platbe, ktoré klient môže použiť na úhradu. \n\n\nQR kód je dostupný priamo v profile klienta v časti Platba, kde si ho môže otvoriť a použiť na platbu.\n\n\nV súčasnosti nie je k dispozícii nastavenie, ktoré by automaticky pridávalo QR kód aj do e‑mailu s údajmi na úhradu.\n\n\nAk chcete, môžem vám ukázať aj spôsob, ako zjednodušiť platby pre rodičov a znížiť počet otázok ohľadom úhrady.\n\n\n\nSource:\nJak automatizovat vaše podnikání v oblasti dětských aktivit (aniž byste ztratili osobní kontakt) — Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Hledali jste tohle?", "cited": []}, {"role": "customer", "who": "Barbora Kubíková", "text": "ako zjednodušiť spôsob platby", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Najjednoduchší spôsob je zmeniť platbu na jednoduchý a okamžitý proces pre rodičov. Niekoľko osvedčených krokov:\n\n\n\n\n- \nUkážte cenu jasne hneď – koľko sa platí teraz a koľko neskôr. To zníži počet otázok a odchodov. \n\n\n- \nNechajte rodičov platiť sami v profile – môžu zaplatiť kedykoľvek bez čakania na administrátora. \n\n\n- \nAutomatizujte e‑maily – potvrdenie, faktúra a upozornenia na platbu môžu chodiť automaticky. \n\n\n- \nOtestujte celý proces ako rodič – nájdenie kurzu → registrácia → platba → potvrdenie. \n\n\nKlíč je, aby rodič vedel rovno zaplatiť a dostať okamžité potvrdenie.\n\n\nAk chcete, môžem vám ukázať aj konkrétne nastavenia v Zooze, ktoré robia platby pre rodičov ešte jednoduchšie.", "cited": ["Registrační stránka pro dětské kroužky: 5sekundový návod — Zooza", "Žebřík důvěry rodičů: 3 standardy pro dětské aktivity, které zvyšují retenci — Zooza", "Checklist pred spustením nových kurzov: Na čo nezabudnúť, aby sa sezóna nezačala chaosom — Zooza", "Jak automatizovat vaše podnikání v oblasti dětských aktivit (aniž byste ztratili osobní kontakt) — Zooza", "Proč řešení „neviditelného“ rodičovského problému buduje silnější značku — Zooza"]}, {"role": "bot", "who": "Zooza Support", "text": "Dostali jste odpověď na svou otázku?", "cited": []}, {"role": "customer", "who": "Barbora Kubíková", "text": "dakujem", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rád som vám mohol pomôcť! Ak budete mať ďalšie otázky alebo budete potrebovať s niečím pomôcť, neváhajte sa ozvať. Som tu pre vás! 😊", "cited": []}], "verdict": "gap", "vtitle": "Can the QR code be included in the payment email", "vnote": "Asked three times; bot cited three blog posts. The QR tag exists and dynamic-tags documents what it needs — this is retrieval failing on a question the KB can answer.", "cat": "payments"}, {"channel": "intercom", "id": "215475869917705", "date": "2026-09-09 21:15", "day": "2026-09-09", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Programme Settings | Zooza Help", "Instructors working hours | Zooza Help", "User roles | Zooza Help", "Instructors | Zooza Help", "Automated notifications overview | Zooza Help"], "q": "hey, can I see a document how to set up working hours and setting absence in the instructors profile ? how to approve new lesson with student?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "barbora zajacova", "text": "hey, can I see a document how to set up working hours and setting absence in the instructors profile ? how to approve new lesson with student?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — you can set this directly in the instructor’s profile.\n\n\n1. Set working hours\n\n\n\n\n- Go to Team & Settings → Instructors\n\n\n- Open the instructor’s profile\n\n- Go to the Working hours tab\n\n- Click Add availability\n\n\n- Choose Working hours\n\n\n- Set the date range and time range (e.g. 9:00–16:00)\n\n- Optionally set weekly repetition. \n\n\n2. Add an absence (holiday, illness, etc.)\n\n\n\n\n- In the same Working hours tab\n\n- Click Add availability\n\n\n- Choose Absence\n\n\n- Enter the date range and time when the instructor is unavailable.\n\nImportant: an absence only affects new scheduling. Sessions already in the calendar will still show that instructor, so they may need to be reassigned manually.\n\n\n3. Approving a new lesson with a student\n\n\nThere is no separate “approval” step in the instructor profile. Instructors mainly:\n\n\n\n\n- manage their working hours and absences\n\n\n- record attendance in the Calendar for their classes. \n\n\nIf you want, I can also show you the typical workflow for scheduling lessons and assigning instructors so everything fits the availability automatically.", "cited": ["Instructors working hours | Zooza Help", "User roles | Zooza Help", "Instructors | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "barbora zajacova", "text": "what is the next step for instructor if student reschudule the lesson on their own ?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If a student reschedules a lesson themselves, the next step for the instructor depends on a setting in the programme.\n\n\n\n\n- \nIf “Automatically approve requests for session rescheduling” is enabled:\nThe change is approved automatically. The instructor does not need to do anything. \n\n\n- \nIf this setting is disabled:\nThe instructor must review and approve or reject the reschedule request. The request appears in the attendance view, and the instructor decides whether to accept it.\n\nAfter the decision, the client receives an automatic notification about the result. \n\n\nTip: enabling auto‑approval removes the manual step and keeps scheduling faster for both sides.", "cited": ["Programme Settings | Zooza Help", "Automated notifications overview | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help with instructor availability or student rescheduling, I’m here to assist. Would you like to share more about the workflow you’re trying to set up?", "cited": []}], "verdict": "gap", "vtitle": "Instructor working hours, absence, and approving a lesson with a student", "vnote": "Asked twice. Instructors working hours was cited, so part of it exists; the absence and approval halves are the gap.", "cat": "team"}, {"channel": "intercom", "id": "215475868206271", "date": "2026-09-09 20:34", "day": "2026-09-09", "human": false, "bucket": "D_assumed_with_kb", "reask": 7, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Client Management FAQ | Zooza Help", "Login and Account FAQ | Zooza Help", "Clients | Zooza Help", "Instructors | Zooza Help", "Zooza Glossary | Zooza Help", "Add instructors and manage their access | Zooza Help"], "q": "nemozem zmenit email lektorky", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": "Anna Gavalová", "text": "nemozem zmenit email lektorky", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Na screenshotu je vidět hláška „E‑mail je už zaregistrovaný“. To znamená, že tento email je v systému už použitý u jiného uživatele. V Zooza může mít každý instruktor jen jeden unikátní email.\n\n\nMožnosti řešení:\n\n\n\n\n- Použijte jiný email, který ještě není v systému registrovaný.\n\n- Nebo přidejte instruktora znovu jako nového uživatele v Settings → Team → Add a zadejte jiný email.\n\n\nDoporučení: každý instruktor by měl mít vlastní email, aby měl samostatný přístup a historii.\n\n\nPokud chcete, můžu vám také ukázat, jak bezpečně přejít z osobního emailu na firemní, aniž by instruktor ztratil přístup.", "cited": ["Login and Account FAQ | Zooza Help", "Add instructors and manage their access | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Hledali jste tohle?", "cited": []}, {"role": "customer", "who": "Anna Gavalová", "text": "lektorka je aj klient moze to byt chyba?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Nie, to nie je chyba. Je to ed amount\n\n- Confirmation of the expected vs actual total\n\nThis will help our team investigate further if needed.\n\n\nPayments and Billing FAQ | Zooza Help", "cited": []}, {"role": "customer", "who": "Jakub Majoroš", "text": "Wait for the team", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "https://zooza.atlassian.net/browse/ZOOZA-4851", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Toto sme uz medzicasom urobili", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215475865695873", "date": "2026-09-09 18:32", "day": "2026-09-09", "human": false, "bucket": "D_assumed_with_kb", "reask": 6, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Deploying the Zooza app on your website - Zooza", "Customizing widgets | Zooza Help", "Booking Widget FAQ | Zooza Help", "Bookings | Zooza Help", "Make-up Sessions — Complete Guide | Zooza Help", "Calendar widget | Zooza Developer Docs", "Settings | Zooza Help", "Change the language in Zooza | Zooza Help"], "q": "viem nastavit v zpoza aby v kalnedari na nasej stranke neukazovali informacie napríklad kto uci danu hodinu?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Natália Varkondová", "text": "viem nastavit v zpoza aby v kalnedari na nasej stranke neukazovali informacie napríklad kto uci danu hodinu?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno, dá sa to nastaviť. V kalendári na vašej stránke môžete skryť informácie ako napr. ktorý instruktor vyučuje hodinu.\n\n\nPostup:\n\n\n\n\n- Prejdite do Team & Settings → Publish\n\n\n- Otvorte váš widget\n\n- V sekcii Calendar môžete nastaviť, ktoré informácie sa majú zobraziť\n\n- Vypnite položku Instructor\n\n\nTým sa me
