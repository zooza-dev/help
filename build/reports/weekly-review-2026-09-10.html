 mať priamy účet ani faktúry od Stripe alebo GoCardless.\n\n \n-  Podporuje vaša integrácia CardPay automatické opakované platby kartou, teda tokenizáciu a následné platby bez nového zadávania karty? \n-  Používa sa na to CardPay, ComfortPay alebo tatrapay+ od Tatra banky? \n-  Je možné nastaviť členstvo na 8 vstupov počas 35 dní, bez prenosu nevyužitých vstupov, s automatickým obnovením a zablokovaním rezervácií po neúspešnej platbe? \n-  Je možné po skoršom vyčerpaní 8 vstupov ponúknuť klientovi predčasné manuálne obnovenie? \n-  Kto mi vystavuje faktúru za 3,5 % poplatok platobnej brány — Zooza s.r.o., Tatra banka, Stripe alebo iný zahraničný poskytovateľ? \n-  Musím mať vlastný Stripe alebo GoCardless účet, alebo dostanem všetky faktúry iba od Zooza s.r.o. so slovenským IČ DPH?  Ďakujem.\n\nS pozdravomSergey Polyakov", "turns": [{"role": "customer", "who": "Sergey", "text": "Dobrý deň,\n potrebujem automaticky obnovované členstvo pre skupinové fitness tréningy, ale nechcem mať priamy účet ani faktúry od Stripe alebo GoCardless.\n\n \n-  Podporuje vaša integrácia CardPay automatické opakované platby kartou, teda tokenizáciu a následné platby bez nového zadávania karty? \n-  Používa sa na to CardPay, ComfortPay alebo tatrapay+ od Tatra banky? \n-  Je možné nastaviť členstvo na 8 vstupov počas 35 dní, bez prenosu nevyužitých vstupov, s automatickým obnovením a zablokovaním rezervácií po neúspešnej platbe? \n-  Je možné po skoršom vyčerpaní 8 vstupov ponúknuť klientovi predčasné manuálne obnovenie? \n-  Kto mi vystavuje faktúru za 3,5 % poplatok platobnej brány — Zooza s.r.o., Tatra banka, Stripe alebo iný zahraničný poskytovateľ? \n-  Musím mať vlastný Stripe alebo GoCardless účet, alebo dostanem všetky faktúry iba od Zooza s.r.o. so slovenským IČ DPH?  Ďakujem.\n\nS pozdravomSergey Polyakov", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thanks for reaching out!\n\n\nI'm Zooza Support, Zooza's AI Agent and I'm well trained to answer your query but you can reply and ask for the team at any time.\n\n\nHello,\n\n\nThank you for your message! I'm Zooza Support, Zooza's AI Agent and I’m happy to help you with your questions.\n\n\n1. Automatic card recurring payments (tokenization)\n\n\nYes, online card payments are supported. You use either CardPay (Tatra banka) or Stripe. With CardPay, the gateway is already integrated into the system and requires no additional setup. The fee for the payment gateway is 3.5% and is charged as a third-party service.  \n\n\n2. Which gateway is used\n\n\n\n\n- CardPay — managed directly in Zooza, no need for your own account.\n\n- Stripe — you can connect your own Stripe account.\n\n3. “8 entries for 35 days” with automatic renewal\n\n\nThis model is not directly supported as an automatic renewal. The closest approach is an Entry Pass (e.g. 8 entries), which the client purchases manually and entries are deducted when booking. \n\n\n4. Early renewal after entries are used up\n\n\nYes — when the pass runs out, the client can buy a new pass manually.\n\n\n5. Invoices for the gateway fee\n\n\nThe 3.5% fee is the payment gateway fee (a third party).\n\n\n6. Invoices for your services\n\n\nIn Zooza, you have built-in invoicing, so invoices can be generated directly by the system according to your invoicing profile entity (your company, tax ID, VAT ID, etc.). \n\n\n7. Do you need your own Stripe account\n\n\nNo — when using CardPay, you don’t need any own account.\n\n\nIf you want, I can also explain how fitness centers most commonly set up this model (8 entries / 35 days) in Zooza.\n\n\nIf you need anything else, feel free to follow up.\n\n\nPayment options | Zooza Help\nSet up how Zooza collects money from clients | Zooza Help\nPay-as-you-go FAQ | Zooza Help\nInvoicing in Zooza — Overview | Zooza Help", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Hello, I’m writing to follow up on the detailed information I provided regarding your questions about CardPay, Stripe integration, and membership setup for your group fitness classes. Please let me know if you would like to continue the conversation or need any further assistance with these topics at your convenience.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Sergey,\n\n\nZooza ponuka tuto moznost pre Stripe. Z Vasho pohladu aj z pohladu klienta v obchodnom vztahu vystupuje Zooza s.r.o. a ide o klasicku platbu kartou. Cize zakaznik plati Zooza s.r.o. a Vam fakturu vystavuje Zooza s.r.o. Faktury vystavujeme raz alebo dva krat mesacne v zavislosti od poziadaviek klienta a vzajomnej dohody. V tomto scenari nemusite mat svoj vlastny Stripe ani GoCardless ucet ale potrebujete mat entitu, kam budeme vyplacat peniaze. Peniaze nevyplacame na sukromne ucty a pred pouzitim sluzby si potrebujeme overit, ze mate zalozenu legalnu entitu v ramci EU.\nZ pohladu funkcnosti sa pytate na nieco co system nerobi. Zooza nema pod kontrolou vstup zakaznika priamo na prevadzku. Teda pripadne zablokovanie vstupu do centra po tom, co sa zakaznikovi minu vsetky vstupy, je riesitelne vami. Ak by ste na prevadzke mali turnikety a chceli ich napojit na Zoozu, je to mozne, Zooza poskytuje otvorene API, kde vsetky potrebne udaje su, ale priamu integraciu na nejaky komercny produkt momentalne nemame. Cize aby som to zosumariloval:\n\n\n\n\n- Viete prevadzkovat platby (aj opakovane) cez Zoozu bez nutnosti mat vlastny Stripe ucet\n\n- Na fakturach a platbach nefigurujete vy, ale Zooza\n\n- Zooza vyplaca akumulovane prostriedky iba legalnym entitam a to jeden alebo dva krat mesacne\n\n- Z pohladu kontroly vstupov - teda ci ma clovek pravo vojst do centra a cvicit - Zooza nema hotovu integraciu na turniketove systemy, takato integracia ale je mozna, v pripade ak mate turniketovy system, ktory vie byt napojeny na externe api.\n​\n\nV pripade dalsich otazok nas nevahajte kontaktovat,\n\n\ns pozdravom\n\n\nMartin", "cited": []}, {"role": "customer", "who": "Sergey", "text": "Dobrý deň, pán Rapavý,\n\n\nďakujem za odpoveď. Rád by som upresnil, čo som mal na mysli.\n\n\nMáme s.r.o., táto spoločnosť má vlastný bankový účet a dokonca máme aj účet v Stripe. Hlavné, čomu sa snažím vyhnúť, je dostávať Stripe Tax Invoice priamo od spoločnosti Stripe, pretože to pre nás znamená povinnosť každý mesiac podávať priznanie k DPH. Takto sme už fungovali a nevyhovovalo nám to.\n\n\nAk existuje možnosť, aby platby klientov cez Stripe prijímala vaša spoločnosť, aká by bola celková provízia?\n\n\nViem, že Stripe ponúka aj iný model, pri ktorom posiela platby priamo na účet našej s.r.o., ale poplatky Stripe sú zahrnuté vo faktúre za rezervačný systém, akým je napríklad váš systém. Ktorý z týchto modelov používate vy – prvý alebo druhý?\n\n\nPokiaľ ide o počet vstupov, mal som na mysli nasledujúci model: klient si kúpi mesačné členstvo, ktoré sa automaticky obnovuje a platba sa pravidelne strháva z karty cez Stripe. Súčasťou členstva je 8 vstupov. Keď klient všetkých 8 vstupov využije, systém mu neumožní rezervovať si deviaty tréning, kým si nedokúpi ďalšie vstupy alebo kým sa jeho členstvo automaticky neobnoví na ďalšie obdobie.\n\n\nĎakujem za upresnenie.\n\n\nS pozdravom\n\n\nSergey Polyakov\n​", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den,\nV principe mame zakaznikov, ktori bud maju vlastny stripe ucet a v tom pripade ide o rovnake riesenie, ake ste pouzivali aj doteraz. Alebo mame druhu skupinu zakaznikov, ktori z roznych dovodov nechcu mat vlastny stripe a vtedy vsetky platby tecu na nas stripe ucet a my robime payouty spolu s fakturou za rezervacny system a v pripade vacsich objemov aj extra v ramci mesiaca podla konkretnej dohody so zakaznikom tak aby mal pod kontrolou cashflow. Celkova provizia je 3.5 percenta, ale v pripade vacsieho objemu sa vieme samozrejme dohodnut na nizsej provizi, ale nebude to take vyhodne ako keby ste pouzivali priamo Stripe, kedze nam tymto processingom vznikaju naklady. Rovnaku sluzbu ponukame aj pre CardPay, tam ale ide iba o jednorazove platby - automaticke platby takto zintegrovane nemame. Tam by sa s poplatkom dalo ist nizsie kedze Tatra banka ma lepsie podmienky ako Stripe.\n\nCo sa tyka samotneho modelu - v zakladnom ramci to takto funguje, ale su potrebne urcite podmienky aby to fungovalo aj naozaj. Zakladnou je, ze ak nemate na prevadzke turniketovy system, ktory by ste pouzivali na kontrolu dochadzky, potom by to v realite vyzeralo takto:\n\n\n\n\n- Zakaznik vojde na vas web, prihlasi sa do svojho profilu a zakupi si prislusny pocet vstupov\n\n- Standardne to funguje tak, ze zakaznik sa prihlasi na trening, o ktory ma zaujem - napriklad Streda o 15:00.\n\n- Nasledne pri vstupe na prevadzku by niekto musel zakaznika zastavit a zapisat mu vyuzity vstup priamo v aplikacii.\n\nTo co Zooza standardne nerobi je vstup ad hoc - teda bez toho aby v aplikacii existoval zodpovedajuci treningovy cas - zakaznik vojde a odide do priestorov kedy chce. Viem si predstavit, ze by sme takuto podporu urobili, stale tam ale ostava nutnost osobnej kontroly pri vstupe. System je mozne nastavit tak aby si zakaznik nevedel registrovat dalsie treningy bez toho aby mal najskor vyplatene tie predchadzajuce.\n\n\nOde teda o to ako fungujete: Ak je to skor tak, ze mate zverejnene terminy treningov a chcete aby sa ludia na ne prihlasovali - potom je Zooza v sucasnom stave fit na to co potrebujete. Ak je to skor tak, ze ludia chodia kedy chcu a vy potrebujete len odcitat vstup v momente kedy sa na prevadzke zjavia, potom Zooza toto robit momentalne nevie, ale viem si predstavit, ze to do nej dorobime. Z casu na cas sa tato poziadavka objavi aj od inych klientov.\n\n\nZaroven plati ze kontrola vstupu na prevadzku je v standarde manualna a pripadnu integraciu na turnikety by bolo nutne realizovat extra.\n\n\n\n\n\ns pozdravom\n\n\nMartin", "cited": []}, {"role": "customer", "who": "Sergey", "text": "Dobrý deň,\n\n\nčo sa týka vášho riešenia cez Stripe, už tomu rozumiem. Vyplácanie raz mesačne nám vyhovuje.\n\n\nZatiaľ fungujeme v menšom rozsahu – máme jedného trénera, ktorý si prenajíma priestory vo fitness centrách, preto turnikety nepotrebujeme. Klienti chodia na tréningy podľa rozvrhu, na konkrétny čas a na základe predchádzajúcej rezervácie. Mesačný obrat je približne 1 000 až 2 000 eur. Evidovať využitý vstup v aplikácii pre nás nie je problém.\n\n\nJe možné nastaviť systém tak, aby si klient kúpil napríklad permanentku na 8 tréningov mesačne, ktorá sa bude cez váš Stripe každý mesiac automaticky predlžovať? Zároveň by sa každý mesiac automaticky stiahla platba z karty a klient by získal presne 8 nových vstupov.\n\n\nTeda išlo by o permanentku na 8 tréningov mesačne s automatickým mesačným predĺžením a automatickou platbou kartou.\n\n\nĎakujem za informáciu.\n​", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Sergey,\n\n\nAutomaticke predlzovanie permanentky v systeme momentalne nemame, ale nevidim problem to doprogramovat. Zatial vsetci, ktori pouzivali vstupove permanentky to nechali na zakaznika aby si dalsie vstupy dokupil sam. Vo vasom pripade je to tak, ze ma zakaznik 8 vstupov mesacne a ak ich nevycerpa tak tieto vstupy zanikaju a system mu ma automaticky pridelit novych 8 vstupov?\n\n\n\n\n\nDakujem,\n\n\nMartin", "cited": []}, {"role": "customer", "who": "Sergey", "text": "Dobrý deň.\n\n\nÁno, presne takto sme fungovali aj predtým – 8 vstupov na mesiac a automatické strhávanie platby každý mesiac.\n\n\nAk tomu správne rozumiem, máte Entry Pass bez automatického predĺženia a Membership bez obmedzenia počtu vstupov. Ako ideálny minimálny variant by sa javilo spojiť tieto dva produkty do jedného.\n\n\nEšte lepšie by bolo, keby sa dalo nastaviť napríklad 8 vstupov s automatickou platbou nielen každý mesiac, ale napríklad každých 5 týždňov. Niekedy klient tréning vynechá a týmto spôsobom by mal jeden rezervný týždeň na nahradenie vynechaného tréningu.\n\n\nV Stripe je možné nastaviť predplatné podľa počtu týždňov namiesto kalendárnych mesiacov.\n\n\nSergey Polyakov", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Urcite to vieme spravit. Zooza je v tomto pripade zdroj pravdy a urcuje kedy a kolko sa ma strhnut zakaznikovi, takze sa nespoliehame na funkcionalitu Stripeu. Cize ak to zosumarizujem, to co vy predavate je: Ako klient mam v obdobi 5 tyzdnov garantovanych 8 vstupov. Ci ich vyuzijem alebo nie je na mne, ak ich vyuzijem, v poriadku, ak nie tak vstupy prepadaju. Tak ci onak, kazdych 5 tyzdnov sa vstupy resetuju a dostavam novych 8.\n\n\nAk je to takto, tak myslim, ze by nemal byt problem takyto typ produktu dorobit. Je tam este jedna vec - momentalne obmedzujeme datum, kedy sa clovek moze prihlasit na tri mesiace a neda sa to priamo v appke konfigurovat. Cize vo vasom pripade - mam 8 vstupov volnych a je september - To znamena ze si vstupy mozem minut na terminy v septembri, oktobri, novembri. Vzhladom na to specifikum, akym pracujete so vstupmi - budete to chciet obmedzit tak aby si zakaznik nemohol vyberat na tri mesiace vopred ale iba v ramci aktualneho obdobia?\n\n\n\n\n\nDakujem,\n\n\nMartin", "cited": []}, {"role": "customer", "who": "Sergey", "text": "Dobrý deň,\n\n\náno, máte pravdu. Ideálne by bolo, keby si klient pri kúpe permanentky na 8 tréningov s platnosťou 5 týždňov mohol rezervovať termíny iba v rámci platnosti tejto permanentky.\n\n\nPo automatickom predĺžení by potom dostal nových 8 vstupov a mohol by si rezervovať ďalšie termíny. Ak by počas 5 týždňov nevyužil všetkých 8 vstupov, nevyužitý zostatok by prepadol.\n\n\nAk by, naopak, využil všetkých 8 vstupov skôr a do ďalšieho automatického strhnutia platby by mu zostával napríklad ešte jeden týždeň, mohol by požiadať trénera o posunutie dátumu ďalšej platby na skorší termín.\n\n\nTakto približne sme to mali nastavené u nás.\n\n\nSergey Polyakov", "cited": []}, {"role": "customer", "who": "Sergey", "text": "Dobry den prajem,\n\n\nVdaka za info o dalsich krokoch.\n​\n\n\nS pozdravom\n\n\nSergey Polyakov\n​", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Sergey,\nPotvrdzujem, ze vieme system upravit tak, aby splnal to co pozadujete. Jediny problem je casovanie. O chvilu je tu september a to je najrusnejsie obdobie roka, kedy nie je uplne dobre do aplikacie zavadzat nejake vyraznejsie novinky.\n\n\nNavrhujem skoordinovat vyvoj na nasej strane s tym kedy by ste chceli zacat. Za nas je predbezny termin, kedy by permanentky mohli byt v tejto forme - koniec septembra.\n\n\nVyhovuje Vam to, alebo mate inu predstavu?\n\n\nDakujem,\n\n\nMartin", "cited": []}, {"role": "customer", "who": "Sergey", "text": "Dobrý deň,\n\n\ntermín koncom septembra nám vyhovuje.\n\n\nAko môžeme začať systém už teraz skúšať, aby platby cez Stripe prechádzali prostredníctvom vás? Stačí sa zaregistrovať na vašej webovej stránke, alebo je potrebné z vašej strany ešte niečo nastaviť?\n\n\nĎakujem.\n​", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, Sergey, \n\n\nano, staci, ked si otvoríte ucet, po jeho overení nami mozete začať využívať stripe od Zooza okamžite. Dovtedy si viete nastavovať ponuku. Overenie trva spravidla par dni, po vyplneni fakturacnych informacii a overeni entity. Začat môžete tu: https://signup.zooza.online/", "cited": []}, {"role": "customer", "who": "Sergey", "text": "Dobrý deň, pán Rapavý.\nPísali ste:\n> „Automatické predlžovanie permanentky v systéme momentálne nemáme, ale nevidím problém to doprogramovať.“\nChcem si len upresniť, či obaja rovnako chápeme, o akých konkrétnych nastaveniach v Zooze hovoríme.\nMomentálne to mám nastavené takto:\n1. Vytvoril som kurz typu „Otvorená registrácia“.\n2. Do skupín tohto kurzu som pridal produkty.\n3. V produktoch používam Položky na predaj typu Vstupová permanentka.\nChápem správne, že keď ste hovorili o možnosti doprogramovať automatické predlžovanie permanentky, mysleli ste práve tento typ Vstupová permanentka?\nTeda že by sa takáto permanentka mohla automaticky predĺžiť:\npo skončení jej platnosti;\na ideálne aj po vyčerpaní všetkých vstupov, aj keď jej časová platnosť ešte neskončila.\nA pamätám si správne, že takúto funkcionalitu by bolo možné orientačne očakávať do konca septembra?\nFYI – vo vašom registračnom formulári Zooza momentálne nefungujú oba odkazy:\nGeneral Terms and Conditions\n​\n\n\nPrinciples of Personal Data Processing\n\n\ns pozdravom\n\n\nSergey Polyakov\n​", "cited": []}, {"role": "human", "who": "Tech Support", "text": "principialne sa chapeme, vyzaduje si to analyzu na nasej strane, presny mechanizmus neviem potvrdit, robime na tom.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobrý deň,\n\n\n\n\n\n\n\n\n\n\n\nRozumieme si správne - hovoríme presne o nastavení, ktoré popisujete: kurz typu „Otvorená registrácia\", produkty priradené v skupinách kurzu, a v nich Položka na predaj typu Vstupová permanentka. Áno, práve o tomto type permanentky bola reč, keď sme spomínali možnosť doprogramovať jej automatické predĺženie\n\n\n\n\n\nPresný mechanizmus, akým by sa predĺženie realizovalo, si zatiaľ netrúfam potvrdiť - vyžaduje si to analýzu na našej strane. Momentálne na tom pracujeme. Termín do konca septembra preto zatiaľ neviem s istotou potvrdiť.\n\n\n\n\n\n\n\n\nK vašej poznámke ohľadom nefunkčných odkazov (General Terms and Conditions a Principles of Personal Data Processing) v registračnom formulári - ďakujeme za upozornenie, dáme to preveriť.\n\n\n\n\n\nS pozdravom\n\n\nKatarína", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215475859264439", "date": "2026-09-09 13:53", "day": "2026-09-09", "human": true, "bucket": "HUMAN", "reask": 1, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Termíny sa nezobrazuju v dennom prehľade\n\nDobrý deň,  prosím akú podmineku musí splniť vytvorený termín aby sa zobrazil v dennom prehľade ? máme termín, kde teda nieje žiaden študent a lektor bude pridelený ale vat a tak si zabezpecit, ze sa zobrazia aj v dennom prehlade.\n\n\n\n\n\npekny den\n\n\nKatarina", "cited": []}, {"role": "customer", "who": "barbora zajacova", "text": "Dobry den, jasne rozumiem, takze staci pridat studenta.\nĎakujem, \nB", "cited": []}], "verdict": "gap", "vtitle": "The daily overview shows rooms with people in them, not empty bookings", "vnote": "Barbora wanted to see a room blocked out with no students assigned. The daily overview is driven by enrolled attendees, so an empty session is invisible. Katarina's workaround is a test registration copied into the blocked sessions.", "cat": "reports"}, {"channel": "intercom", "id": "215475859668709", "date": "2026-09-09 13:37", "day": "2026-09-09", "human": false, "bucket": "D_assumed_with_kb", "reask": 3, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Payment Correction vs Refund Guide | Zooza Help", "Zooza Glossary | Zooza Help", "Bookings | Zooza Help", "Edit payment on booking | Zooza Help"], "q": "Ako mám u registrovaného klienta/dieťaťa nastaviť nulovú platbu? Je tam použitá 100% zľava na krúžok.", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Ako mám u registrovaného klienta/dieťaťa nastaviť nulovú platbu? Je tam použitá 100% zľava na krúžok.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak máte registrované dieťa a chcete, aby platba bola 0 €, môžete to nastaviť priamo v rezervácii.\n\n\nPostup:\n\n\n\n\n- Otvorte Bookings a vyberte danú rezerváciu.\n\n- Prejdite do záložky Payments.\n\n- V zozname transakcií kliknite na More (tri bodky) pri platbe.\n\n- Vyberte Edit payment.\n\n- Zmeňte Amount na 0 a uložte. \n\n\nIná možnosť je použiť Discount, ktorým znížite sumu, ktorú klient musí zaplatiť. \n\n\nAk chcete, môžem vám ešte ukázať, kedy je lepšie použiť zľavu a kedy priame nastavenie platby na 0 €.", "cited": ["Payment Correction vs Refund Guide | Zooza Help", "Edit payment on booking | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Prelož pokyny do slovenčiny.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak chcete u registrovaného klienta/dieťaťa nastaviť nulovú platbu, môžete to urobiť priamo v rezervácii:\n\n\n\n\n- Otvorte Bookings a vyberte danú rezerváciu.\n\n- Prejdite do záložky Payments.\n\n- V zozname transakcií nájdite platbu a kliknite na More (tri bodky).\n\n- Vyberte Edit payment.\n\n- Zmeňte Amount na 0 a uložte. \n\n\nTýmto spôsobom platbu ručne nastavíte na 0 €.\n\n\n\nSource:\nPayment Correction vs Refund Guide | Zooza Help", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Prelož pokyny do slovenčiny, čo je Bookings, Paymensts. ...", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Tu je preklad do slovenčiny s vysvetlením pojmov:\n\n\nBookings = Rezervácie\n\n\nJe zoznam všetkých prihlásených klientov (napr. detí) do krúžka. Pri rezervácii vidíte klienta, dieťa, krúžok a stav platby. \n\n\nPayments = Platby\n\n\nJe záložka v konkrétnej rezervácii, kde vidíte zoznam všetkých platieb a môžete ich upravovať. \n\n\nPostup v slovenčine:\n\n\n\n\n- Otvorte Rezervácie a vyberte danú rezerváciu.\n\n- Prejdite do záložky Platby.\n\n- V zozname transakcií nájdite platbu a kliknite na More (tri bodky).\n\n- Vyberte Edit payment.\n\n- Zmeňte Amount na 0 a uložte. \n\n\nTýmto spôsobom nastavíte platbu na 0 € priamo v rezervácii.", "cited": ["Payment Correction vs Refund Guide | Zooza Help", "Zooza Glossary | Zooza Help", "Bookings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this information helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak potrebujete s nastavením nulovej platby ešte pomôcť, som vám k dispozícii. Chcete doplniť, s ktorým krokom máte problém?", "cited": []}], "verdict": "check", "vtitle": "Zero payment with a 100 percent discount applied", "vnote": "Re-asked three times, bot cited the refund guide and the glossary. Same underlying question as 215475839045054 — write once, cover both.", "cat": "payments"}, {"channel": "intercom", "id": "215475858917679", "date": "2026-09-09 12:29", "day": "2026-09-09", "human": false, "bucket": "D_assumed_with_kb", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Sibling Discount issue\n\nA member has tried booking FRIDAY CLIUB booking numbers 1920 and 1921 but sibling discount isn't being applied. Any ideas as to why?", "turns": [{"role": "customer", "who": null, "text": "Sibling Discount issue\n\nA member has tried booking FRIDAY CLIUB booking numbers 1920 and 1921 but sibling discount isn't being applied. Any ideas as to why?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dear TOMMY,\n\n\nyour ticket  has been received. Zooza Assistant will try to help you right away — and a member of our team will personally review it too.\n\n\n— Zooza Support", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}], "verdict": "verify", "vtitle": "Sibling discount not applied on two specific bookings", "vnote": "Same thread as 215475857824306. Held together.", "cat": "pricing"}, {"channel": "intercom", "id": "215475858272739", "date": "2026-09-09 12:28", "day": "2026-09-09", "human": true, "bucket": "HUMAN", "reask": 5, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": [], "q": "Prečo sa po nahodení skupiny nezobrazuje rodičom možnosť polročnej platby? Ako túto chybu odstránim?\n​", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Prečo sa po nahodení skupiny nezobrazuje rodičom možnosť polročnej platby? Ako túto chybu odstránim?\n​", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumiem, že chýbajúca možnosť polročnej platby môže byť frustrujúca. Chcete, aby som vás spojil s ľudským agentom? Alebo môžete poskytnúť viac informácií a budem sa snažiť pomôcť priamo.", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Áno poprosím spojiť s ľudským agentom.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Sure — I’ll pass this to the team. Before I do, please share the link/URL and a screenshot so they have all the details to assist you better.", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Zooza \\ Skupiny", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den,\n\n\n\n\n\nje platobna sablona aktivovana pre konkretny kurz a skupinu o ktoru ide?\n\nJe tato sablona spravnej formy - teda v pripade zberu penazi cez kurzovne ma sablona formu predplatenych sablon, v pripade clenskeho je to forma sablony pre clenske?\n\n\n\n\n\nprosim prekontrolujte si tieto dve zakladne otazky a nasledne, v pripade, ze su obe nastavenia spravene spravne nam zaslite cislo konkretnej skupiny a takisto konretnu sablonu, ktora by sa mala pri registracii zobrazovat.\n\nDakujem\n\n\nKatarina", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Neviem ako postupovať. Ide o skupinu Tanečníček_MŠ Ružová Stupava 206/27. Poprosím o nastavenie parametrov tak,  aby bolo možné platiť aj polročne.", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Zooza \\ Skupiny", "cited": []}, {"role": "human", "who": "Tech Support", "text": "vyberiete platobnu sablonu, ktoru chcete, aby zakaznik mohol vidiet pre dany kurz: https://zooza.app/#settings/payment_schedule_templates\n​\n\n\n\n\n\nsablonu si pomenujte tak, aby bolo pre klienta jednoduche vybrat si.\n\nnasledne vnutri sablony skontrolujete nastavenia a zaktivnite sablonu pre vybrane kurzy tlacidlom Aktivovat\n​\n\n\n\n\n\nto sposobi, ze sablona bude dostupna na kurze a aj na skupinach.\nAk by sa Vam na skupine nezobrazila, vojdete do casti Cena a Platba na skupine a cez tlacidlo Spravovat si pridate sablonu ktoru chcete.\nAk mate aktivnu niektoru zo sablon, ktore pre konretnu skupinu pouzivat nechcete, rovnako si ju na skupine manualne deaktivujete.\n\n\n\n\n\nvdaka\n\n\nKatarina", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215475857824306", "date": "2026-09-09 12:20", "day": "2026-09-09", "human": false, "bucket": "D_assumed_with_kb", "reask": 6, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Discounts and Sibling Pricing FAQ | Zooza Help", "Automatic payment reminders | Zooza Help", "Price and payment setup | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Loyalty discounts — what clients and admins see | Zooza Help", "Loyalty Program | Zooza Help", "Sibling Discount | Zooza Help", "Loyalty Program FAQ | Zooza Help", "Automatically cancel unpaid registrations | Zooza Help"], "q": "Sibling discount on Friday Club?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Sibling discount on Friday Club?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — you can offer a sibling discount for Friday Club.\n\n\n\n\n- Go to Sales & Payments → Loyalty Programme → Sibling Discount.\n\n- Add a rule (for example: 2nd child = 10% off).\n\n- Turn the feature on and optionally limit the rule to the Friday Club programme. \n\n\nThe discount applies automatically when the same parent registers another child. The first child always pays full price, and the discount starts from the second child. \n\n\nOne thing to note: if Friday Club is pay‑as‑you‑go (pay per session), the sibling discount may not behave as expected because the counting logic is designed for subscription, instalment, or one‑off payment plans. \n\n\nIf you want, I can also show you how to limit the rule so it only applies to Friday Club and not other programmes.", "cited": ["Loyalty Program | Zooza Help", "Sibling Discount | Zooza Help", "Loyalty Program FAQ | Zooza Help", "Discounts and Sibling Pricing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help setting up the sibling discount for Friday Club, I’m here to assist. Would you like to share more about your payment setup or what you’re trying to configure?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "I set up sibling discount for all programmes - any reason why it wasn't applied for a recent Friday Club booking? Or is it applied at checkout?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — the sibling discount is applied at checkout (during the booking). The system checks eligibility once at the moment the booking is completed and applies the discount instantly. The parent can see the discount as a separate line item before confirming payment.  \n\n\nIf it didn’t appear for that Friday Club booking, the most common reasons are:\n\n\n\n\n- The booking was created manually in the admin panel (loyalty discounts only apply automatically when the client books through the booking widget). \n\n\n- The programme is pay‑as‑you‑go, where the sibling discount logic may not behave as expected.\n\n- The booking was the first child under that parent email (the discount starts from the second child). \n\n\nIf you want, I can also show a quick way to check whether the booking was created manually or through the booking widget.", "cited": ["Sibling Discount | Zooza Help", "Loyalty Program FAQ | Zooza Help", "Loyalty Program | Zooza Help", "Loyalty discounts — what clients and admins see | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Almost - why does it behave differently of pay-as-you-go?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Good question — the difference comes down to how the system counts “children” for the discount.\n\n\nThe sibling discount works by counting how many registered bookings already exist under the same parent email at the moment of booking. The current booking becomes the Nth child, and the system applies the rule that matches that number. \n\n\nWith pay‑as‑you‑go (pay per session) programmes, each session is essentially its own booking. Because of that, the counting logic used for subscriptions, instalments, or one‑off payments doesn’t behave as reliably, so the discount may appear inconsistently. \n\n\nThat’s why it’s currently not recommended for pay‑as‑you‑go setups.\n\n\nIf you want, I can also show a couple of practical ways clubs usually handle sibling discounts for pay‑as‑you‑go sessions.", "cited": ["Sibling Discount | Zooza Help", "Loyalty Program FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Please show me then", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Good follow-up — for pay‑as‑you‑go sessions, the built‑in sibling discount isn’t reliable, so clubs usually handle it manually.\n\n\nTwo practical options:\n\n\n\n\n- \nDiscount code\nCreate a one‑time code (e.g. “SIBLING10”) and apply it to the sibling’s booking at checkout. \n\n\n- \nPayment plan with a built‑in discount\nSet up a payment plan that includes a percentage discount and assign it to that registration. This keeps the discount consistent for that booking.\n\nThe reason: the sibling discount counting logic is designed for subscriptions, instalments, or one‑off payments, not per‑session bookings. \n\n\nIf you want, I can also show a simple workflow many clubs use to keep sibling discounts consistent across multiple Friday Club sessions.", "cited": ["Sibling Discount | Zooza Help", "Loyalty Program FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "👍", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I'm glad to hear that! If you have any more questions or need further assistance, please feel free to ask. I'm here to help! 😊", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "How do I edit the payment reminder / auto cancel fro unpaid bookings?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can edit both the payment reminders and the auto‑cancel rule in the same place.\n\n\nSteps:\n\n\n\n\n- Go to Programme → Settings\n\n\n- In the Price and Payment tile, click Edit\n\n\n- Scroll to Payment Reminder Settings\n\n\n- Click Change\n\n\nThere you can adjust:\n\n\n\n\n- \nCancel after N days unpaid – when the auto‑cancel process starts\n\n- \nCancellation lead time (days) – how many days before the booking is actually cancelled\n\n- Reminder timing and whether unpaid bookings are automatically deleted after reminders. \n\n\nNote: this only applies to new registrations after you enable it.\n\n\nTip: you can also change the Awaiting payment deadline on an individual booking if you want to give one parent extra time.", "cited": ["Automatically cancel unpaid registrations | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Price and payment setup | Zooza Help", "Automatic payment reminders | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help adjusting the payment reminders or automatic cancellation set gr. Lenka Pechová\n\n\n\n\n\nKurzy, PR, marketing\n\n\n\nTel. 0290900497\n\nwww.cirkuskus.sk\nFB / IG cirkuskus", "turns": [{"role": "customer", "who": "Lenka Pechová", "text": "Dobry den,\n\n\nprosim mame maly problem. Mame kurz multicirkus, ktore rozne skupiny sa realizuju na roznych miestach. Skupina multicirkus 8-15 r utorok zac. 17:15, ma v popise uvedene, ze sa kona na mieste Nova trznica ale ked idem do rozpisu teminov, tak je tam uvedene ine miesto. tak isto aj v kalendari sa ukazuje na mieste, kde sa nekona. Spravne je meisto, ktore je uvedene v popise skupiny.\nProsim, mohli by ste sa na to pozriet?\n\n\ndakujem\ns pozdravom,\n\nMgr. Lenka Pechová\n\n\n\n\n\nKurzy, PR, marketing\n\n\n\nTel. 0290900497\n\nwww.cirkuskus.sk\nFB / IG cirkuskus", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Hi Lenka,\n\n\nThanks for reaching out! I'm Zooza Support, Zooza's AI Agent and I'm well trained to answer your query but you can reply and ask for the team at any time.\n\n\nI understand you're seeing a location mismatch for the Multicirkus course (8–15 years, Tuesday 17:15) — the group description shows \"Nová Tržnica\" but the schedule and calendar display a different location.\n\n\nThank you for providing the screenshots. This is helpful. Based on what you've shared, it appears there's a discrepancy between where the course is set up and how it's displaying in the schedule view.\n\n\nSince this involves specific data in your account (the course setup, location settings, and how they're syncing across different views), I'm not able to investigate this directly. A member of our team will need to look into your account to identify whether this is a data sync issue, a display bug, or a configuration problem.\n\n\nCould you please submit a support ticket with:\n\n\n\n\n- The link/URL to your Zooza admin page for this course\n\n- The two screenshots you've already shared (they're perfect)\n\n- Confirmation of the correct location where this group should be held\n\nA human agent can then investigate and correct the location across all views.", "cited": []}, {"role": "customer", "who": "Lenka Pechová", "text": "Thank you, I will do that. \n\n\ns pozdravom,\n\n\nMgr. Lenka Pechová\n\n\nKurzy, PR, marketing\n\n\n\n\nTel.0290900497\n\n\nwww.cirkuskus.sk\nFB / IG cirkuskus\n​", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Hi Lenka,\n\n\nZooza Support is here if you need anything else.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Lenka. Je bezne ze terminy v ramci jednej skupiny mozu mat ine charakteristiky. Napriklad pondelky mozu byt s lektorom Ferko a utorky s Miskom. Pondelky mozu byt 60 minutove a utorky 90 minutove. Rovnako to plati aj o lokalite. Cize jedna vec je lokalita na termine a druha vec je lokalita na skupine. Kedze skupiny su ponukane v ramci registracneho formulara, je na Vas, ktoru lokalitu, lektora alebo dlzku hodiny komunikujete zakaznikom. Skusim to este povedat inak - Na skupine mozete mat lokalitu X a na terminoch lokalitu Y. Ked vojdete do skupiny a jej nastaveni - a zmenite lokalitu - system sa Vas vzdy opyta tri veci: Mam zmenit terminy - len na skupine, na vsetkych terminoch, len na nadchadzajucich terminoch. Cize ak chcete aby lokalita bola rovnaka na skupine a na terminoch staci vojst do nastaveni skupiny a tam lokalitu zmenit. Toto co sa Vam stalo je predpokladam dosledkom toho, ze ste menili lokalitu na terminoch a nie na skupine.", "cited": []}, {"role": "customer", "who": "Lenka Pechová", "text": "Dobry den Martin,\n\n\ndakujem za vysvetlenie, uz to mam spravne. \n\n\nToto som povodne nenastavovala ja, takze neviem, povedat, co sa tam vlastne stalo.\n\n\nVdaka,\n\n\ns pozdravom,\n\n\nMgr. Lenka Pechová\n\n\nKurzy, PR, marketing\n\n\n\n\nTel.0290900497\n\n\nwww.cirkuskus.sk\nFB / IG cirkuskus\n​", "cited": []}], "verdict": "gap", "vtitle": "The venue on the class and the venue on a session are two different things", "vnote": "Sessions within one class can legitimately differ in venue, instructor and length. The class value is what the booking form advertises. Changing the venue on the class asks whether to apply it to the class only, all sessions, or upcoming ones — the same cascade we documented for the connector. Worth saying once, properly.", "cat": "programmes"}, {"channel": "intercom", "id": "215475838083926", "date": "2026-09-09 11:39", "day": "2026-09-09", "human": true, "bucket": "HUMAN", "reask": 1, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Email-notification payment matching | Zooza Help", "Price and payment setup | Zooza Help", "Set up how Zooza collects money from clients | Zooza Help", "Set up invoice profiles and bank accounts | Zooza Help"], "q": "Customer Provides IBAN for Invoice Payment\n\nCustomer confirmed billing profile is correct and provided IBAN SK0602000000007289830751 for payment transfer as requested by support.", "turns": [{"role": "customer", "who": null, "text": "Customer Provides IBAN for Invoice Payment\n\nCustomer confirmed billing profile is correct and provided IBAN SK0602000000007289830751 for payment transfer as requested by support.", "cited": []}, {"role": "customer", "who": "Anastasiia Poliakova", "text": "Dobry den.\n\n\nAno.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den,\n\n\n\n\n\nprosim o doplnenie IBANu, kam peniaze zasleme.\n\n\n\n\n\ndakujem\n\n\nKatarina", "cited": []}, {"role": "customer", "who": "Anastasiia Poliakova", "text": "Dobrý deň.\nZasielam náš IBAN: SK0602000000007289830751\nS pozdravom\nSergey Polyakov", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "This message was deleted", "cited": []}, {"role": "customer", "who": "Anastasiia Poliakova", "text": "Dobrý deň.\n\n\nĎakujem. V súčasnosti nechceme, aby nám klienti mohli posielať peniaze bankovým prevodom na účet. Plánujeme prijímať platby iba kartou.\n\n\ns pozdravom\n\n\nSergey Polyakov\n​", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dobrý deň,\n\n\nak chcete prijímať iba platby kartou, stačí jednoducho vypnúť možnosť bankového prevodu v nastavení.\n\n\nPostup je nasledovný:\n\n\n\n\n- Prejdite do Settings → Billing & Payments → Payment collection setup.\n\n- V kroku Cash / bank transfer vypnite túto možnosť.\n\n- Dokončite wizard.\n\nTento prepínač ovláda hotovosť aj bankový prevod, takže ich vypnutím zabezpečíte, že klienti nebudú mať možnosť platiť prevodom. \n\n\nDodatočne môžete túto možnosť vypnúť aj priamo v konkrétnom programe:\n\n\nProgrammes → vybraný program → Edit Settings → Price and Payment → Payment Methods, kde môžete ponechať iba online platbu kartou. \n\n\nAk chcete, môžem vám tiež ukázať, ako nastaviť kartové platby (napr. Stripe), aby boli pre klientov čo najjednoduchšie.\n\n\nProsím, dajte mi vedieť, či to pomohlo, alebo ak máte ďalšie otázky.\n\n\nSet up how Zooza collects money from clients | Zooza Help\nPrice and payment setup | Zooza Help", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den,\n\n\n\n\n\nsamozrejme rozumieme, nas chatbot sa rozhodol Vam este doposlat pripadnu informaciu.\n\nBerte jeho spravu ako bezpredmetnu.\n\n\n\n\n\ndakujem\n\n\nKatarina", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215475791125308", "date": "2026-09-09 11:38", "day": "2026-09-09", "human": true, "bucket": "HUMAN", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "kontrola nastavenia zlavy pri blokoch\n\nAhojte, \n \n ​ \n \n chcela by som poradit pri kontrole nastavenia zlavy pri blokoch. Mam to nastavene ako v print screene. Zlava by mala byt nasledovna : jednotkova cena terminu je 13€ ale pri vybere 2 blokoch je 12€ a pri 3 blokoch je 11€. Mam 16 terminov v kurze, cize ked si vy ba vysku zlavy upravit podla toho, kolko terminov ma klient pred sebou.\n\nrozsirenie funkcionality mozem zaevidovat Matovi ako poziadavku na vyvoj, zatial vsak bez predbezneho terminu dodania, ci celkovej akceptacie vyvoja\n\n\n\n\n\nvdaka za porozumenie\n\n\nKatka", "cited": []}, {"role": "human", "who": "Tech Support", "text": "ZOOZA-4921", "cited": []}], "verdict": "gap", "vtitle": "Block discount is a fixed amount, not a per-session price", "vnote": "Jani wanted 13 EUR a session falling to 12 and 11 as blocks are added. The system only deducts a fixed discount for the number of blocks chosen. And for a late registration the discount has to be adjusted by hand before confirming, because it was calculated against the sessions the client still has ahead of them.", "cat": "pricing"}, {"channel": "intercom", "id": "215475857893236", "date": "2026-09-09 11:24", "day": "2026-09-09", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Login and Account FAQ | Zooza Help", "Client Profile FAQ | Zooza Help", "Sending email/SMS to clients | Zooza Help", "Email Delivery Troubleshooting | Zooza Help", "Email and Communication FAQ | Zooza Help"], "q": "Ahoj, prosím ťa v poslednej dobe nám priebežne rodičia píšu že im nepríde spätný e-mail s prihlasovacím kódom.\nPo kontrole, udali správnu adresu, nemajú e-mailovú adresu azet.sk, každopádne registrácia prebehne, aj v systéme daných športovcov evidujeme.\n\nČím to môže byť spôsobené ?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Ahoj, prosím ťa v poslednej dobe nám priebežne rodičia píšu že im nepríde spätný e-mail s prihlasovacím kódom.\nPo kontrole, udali správnu adresu, nemajú e-mailovú adresu azet.sk, každopádne registrácia prebehne, aj v systéme daných športovcov evidujeme.\n\nČím to môže byť spôsobené ?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Najčastejšie je tento problém na strane e‑mailovej schránky rodiča, nie na strane systému. Prihlásenie v Zooza funguje tak, že systém po zadaní e‑mailu pošle jednorázový kód na túto adresu. \n\n\nMožné príčiny:\n\n\n\n\n- e‑mail skončil v Spam / Junk / Promotions priečinku\n\n- e‑mailový provider filtruje správy ako spam\n\n- schránka je plná\n\n- rodič v minulosti označil Zooza e‑mail ako nežiaduci\n\n- niektorí provideri aplikujú agresívne filtrovanie a správy sa nedostanú do doručených \n\n\nDoporučené kroky:\n\n\n\n\n- požiadajte rodiča, aby skontroloval spam priečinok\n\n- aby pridal adresu @zooza.app do bezpečných odosielateľov\n\n- ak je to možné, použiť iný e‑mail (napr. Gmail)\n\nAk chcete, môžem vám ukázať aj ako skontrolovať v registrácii, či sa e‑mail zo systému naozaj odoslal.", "cited": ["Client Profile FAQ | Zooza Help", "Email and Communication FAQ | Zooza Help", "Email Delivery Troubleshooting | Zooza Help", "Login and Account FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak potrebujete ďalšiu pomoc s nedoručenými prihlasovacími kódmi, som vám k dispozícii. Chcete doplniť viac informácií o tom, ktorým rodičom e-maily neprichádzajú?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "ukáž", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Môžete si to rýchlo skontrolovať pri konkrétnej registrácii:\n\n\n\n\n- Otvorte registráciu / booking daného rodiča.\n\n- Prejdite do záložky Communication.\n\n- V zozname sent email log nájdete správu s prihlasovacím kódom. \n• Ak e‑mail v logu je → systém ho odoslal a problém je na strane schránky rodiča (spam, filtr, plná schránka). \n• Ak v logu nie je → e‑mail sa zo systému neodoslal a je potrebné ho poslať manuálne z tejto záložky.\n\nTip: všetky odoslané e‑maily môžete sledovať aj v Communication → Messages Overview, kde máte históriu komunikácie. \n\n\nAk chcete, môžem vám ukázať aj ako e‑mail z tejto záložky ručne znova odoslať.", "cited": ["Email Delivery Troubleshooting | Zooza Help", "Email and Communication FAQ | Zooza Help", "Sending email/SMS to clients | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak potrebujete ďalšiu pomoc s kontrolou alebo opätovným odoslaním prihlasovacieho kódu, som vám k dispozícii. Chcete doplniť, čo presne potrebujete overiť?", "cited": []}], "verdict": "verify", "vtitle": "Login codes missing for addresses that are NOT azet.sk", "vnote": "Re-asked twice. The operator checked: correct address, not azet, the registration goes through and the athlete is in the system, but no code. That is a different failure from the azet one and from the wrong-address one. Needs someone to look before anything is written.", "cat": "account"}, {"channel": "intercom", "id": "215475857821177", "date": "2026-09-09 10:52", "day": "2026-09-09", "human": false, "bucket": "D_assumed_with_kb", "reask": 9, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Trial sessions | Zooza Help", "Blocks Configuration and Management | Zooza Help", "Manage trial bookings — reschedule, convert, and close | Zooza Help", "Programme Settings | Zooza Help", "Blocks (Term Segments) FAQ | Zooza Help", "Trial Classes FAQ | Zooza Help", "Booking Widget FAQ | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Bookings | Zooza Help", "Capacity vs extra capacity — who can take which seat | Zooza Help"], "q": "Can I turn off people being able to book workshops and just have them being able to book a trial?\n​", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "Can I turn off people being able to book workshops and just have them being able to book a trial?\n​", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes, you can do that.\n\n\nGo to Programme → Settings → Online Registration (Edit) and find Booking Options Shown on Website.\n\n\nChange it to Trials only.\n\n\nThis means clients will only see and book trial sessions on your website, and full programme enrolments will be hidden. \n\n\nYou can also control this per programme in the booking settings, where Trials only shows only trial sessions to clients. \n\n\nIf you want, I can also show you how to limit how many trials someone can book.", "cited": ["Manage trial bookings — reschedule, convert, and close | Zooza Help", "Booking Widget FAQ | Zooza Help", "Programme Settings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help adjusting your programme’s booking options, I’m here to help. Would you like to share more about how you want trial bookings to work?", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "Yes that was it", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I'm glad to hear that was what you needed! If you have any more questions or want to explore other options, please feel free to ask. I'm here to help! 😊", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "If someone's booked a trial slot not through zooza but through direct contact with us, how can I remove that trial session so it doesn't get booke again (i.e. 10.15 on Sunday 13/9)", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can block that specific date by cancelling the individual session.\n\n\nSteps:\n\n\n\n\n- Go to the class in your programme.\n\n- Open the Sessions tab.\n\n- Find Sunday 13/9 at 10:15.\n\n- Open the session and click Cancel session. \n\n\nThis removes that date from the client-facing calendar, so no one can book it again. The rest of the weeks stay available.\n\n\nIf you ever need to remove a booking entirely, you can also open the booking and use Delete booking. \n\n\nIf you want, I can also show a quick way to keep that time available for future weeks while still blocking just that one date.", "cited": ["Programmes, Timetables and Sessions FAQ | Zooza Help", "Bookings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "But I don't want to delete the session from the programme becuase it's still going ahead and there'll be other children who attend that session every week", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Got it — thanks for clarifying. In that case, don’t cancel the session.\n\n\nInstead, limit how many future trial dates clients can see.\n\n\n\n\n- Go to Programme → Settings → Trial\n\n\n- Find Sessions Shown in Form\n\n\n- Set it to a fixed number of sessions (for example 2–3 upcoming weeks)\n\nThis means the booking form only shows a small number of upcoming trial dates. The 10:15 session on 13/9 will still run internally, but it won’t appear as a bookable trial option for clients. \n\n\nYour regular attendees can still attend every week — you’re just hiding that specific date from the trial booking list. \n\n\nIf you want, I can also show a simple way to keep that time available for future weeks while still preventing new trial bookings on that exact date.", "cited": ["Programmes, Timetables and Sessions FAQ | Zooza Help", "Manage trial bookings — reschedule, convert, and close | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "But if the time is within 2-3 weeks then it'll still show", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You’re right — if the date is within the 2–3 week window, it will still appear as a trial option.\n\n\nThe only way to hide just that one date while keeping the class running every week is to disable online booking for that specific class:\n\n\n\n\n- Go to Programmes → open the programme → select the class\n\n\n- Open Settings → Edit\n\n\n- Uncheck Allow online booking\n\n\n- Save\n\nThis keeps the class in your system for internal use, but it will no longer appear on the public booking form. \n\n\nThe “sessions shown in form” setting can only limit how many upcoming sessions appear, not remove a single date. \n\n\nIf you want, I can also show a simple way to keep that time bookable for future weeks while still preventing new trial bookings on that exact date.", "cited": ["Programmes, Timetables and Sessions FAQ | Zooza Help", "Trial sessions | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "But it's set up using blocks", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ah, that helps — since you’re using blocks, you can control this at the block level.\n\n\nOpen the block that contains the Sunday 13/9 at 10:15 session and turn off trials for that block:\n\n\n\n\n- Go to Programmes → open the class\n\n\n- Open the Price and Payment tile\n\n- Click the block that contains that date\n\n- Find Offer trial lessons for this block\n\n\n- Set it to No\n\n\n- Save\n\nThat block’s dates will stop appearing as trial bookings, while the class and other blocks can still run normally. \n\n\nOne thing to watch: if that session belongs to two blocks, it will still appear as a trial if any of those blocks has trials enabled.\n\n\nIf you want, I can also show a quick way to keep that time bookable for future weeks while still preventing new trial bookings on that exact date.", "cited": ["Blocks (Term Segments) FAQ | Zooza Help", "Blocks Configuration and Management | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "tex red? When they use an entry pass to book a specific session, which template is sent?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Good question — the flow is slightly different depending on how the client books.\n\n\n1. Client enrolls in the Friday Club pay‑as‑you‑go programme\n\n\n\n\n- \nSign up for an open session template is sent automatically.\n\n- This happens when the client enrols in the pay‑as‑you‑go programme itself. \n\n\n2. Client books a specific session (even if using an entry pass)\n\n\n\n\n- \nSigned up for open session template is sent automatically.\n\n- This notification is triggered when a client enrols in a specific pay‑as‑you‑go session. \n\n\n3. Session reminders\n\n\n\n\n- \nAutomatic session reminder is sent the day before the session to enrolled clients.\n\nSimple sequence\n\n\n\n\n- Enrol in programme → Sign up for an open session\n\n\n- Book a specific session → Signed up for open session\n\n\n- Day before session → Automatic session reminder\n\n\nIf you want, I can also explain how to customise the “Signed up for open session” email so it mentions entry passes or pass deductions.", "cited": ["Message Templates | Zooza Help", "Automated notifications overview | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Signed up for open session - where is this?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can find it in Communication → Templates. \n\n\nSteps:\n\n\n\n\n- Go to Communication in the main menu\n\n- Open Templates\n\n\n- Scroll through the list until you reach the Notifications section\n\n- Look for the template used for session notifications (for example the one sent when a client signs up for a session) \n\n\nAll automated emails use templates stored in this list, including booking confirmations and session reminders. \n\n\nTip: if you want to customise it, create a variant of the template rather than editing the original system template.", "cited": ["Message templates — automatic and manual emails | Zooza Help", "Message Templates | Zooza Help", "Edit automatic notifications of an upcoming session | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help locating or understanding the “Signed up for open session” template, I’m here to assist. Would you like to share what you see in the Templates section so we can continue?", "cited": []}], "verdict": "gap", "vtitle": "Which automated emails a pay-as-you-go client receives, in order", "vnote": "Tommy asking the same thing he asked over email. Nobody can answer it today because no article sets out the sequence for entry-pass bookings. Pairs with the session-reminder-versus-notification question that Martin and the app's own labels disagree on.", "cat": "comms"}, {"channel": "intercom", "id": "215475818348922", "date": "2026-09-09 05:44", "day": "2026-09-09", "human": true, "bucket": "HUMAN", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Dobrý deň,\n\n\nZa posledné dva dni som našla v banke platby, ku ktorým rodičia uviedli správny VS ale neboli vôbec spárované. Chcem sa opýtať aká je chybovosť systému. Či mi odporúčate kontrolovať platby ručne? Myslela som, že program to spraví lepšie než ja. Je to nepríjemné upozorňovať zákazníkov, že neuhradili splátku a dostať v zapätí odpoveď, že však uhradili. V prílohe posielam printscreen platieb, ktoré systém úplne odignoroval. Nie sú ani medzi nespárovanými platbami. Prosím o vyjadrenie či jedna sa o ojedinelú chybu systému alebo je to niečo čo sa bude stavať pravidelne. Platby som zaťal ručne nepripísala k registráciám aby bolo vidno, že tam nie sú. \n\n\nS pozdravom, \n\n\nAnna Minarovič | Helen Doron English Dunajská Lužná\n\n\nTel.: +421(0)908 062 975\n\n\nE-mail: dunajskaluz {"role": "customer", "who": "Anna Minarovič", "text": "Dobrý deň Martin,\n\n\nĎakujem pekne za odpoveď. Rozumiem, že nemáte vplyv na banku. Avšak mohli by ste nás spätne informovať, že v takom a takom období mohlo dôjsť k nesparovaniu platieb a aby sme si to radšej pozreli. \n\n\nOkrem toho v mojich dvoch platbách sú úplne iné dátumy. Jedna platba je z 31. augusta ale druha je z 19. apríla. To aj v apríli menila banka šablóny? Odporúčate mi kontrolovať všetko ručne? \n\n\nVopred ďakujem za odpoveď .\n\n\nS pozdravom,\n\n\nAnna Minarovič | Helen Doron English Dunajská Lužná\n\n\nTel.: +421(0)908 062 975\n\n\nE-mail:dunajskaluzna@helendoron.sk| Facebook | www.helendoron.sk\n\n\n\n\n\nA world of educational excellence, enjoyment, creativity and knowledge\n\n\nKangi Club\n |  Helen Doron Radio |   HDE Google Play  | HDE App Store |", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Anna, momentalne na to nemame system aby sme vedeli notifikovat iba pouzivatelov tej danej konkretnej banky ale je to dobry napad, urcite to do systemu zapracujeme. Co sa tej aprilovej platby tyka tak to bude iny problem. Fio je celkovo v dorucovani tychto emailov nespolahlive. Netyka sa to len Zoozy, robili sme si viacero testov a tie emaily jednoducho nechodia vzdy. Cize v pripade, ze mate Fio banku, tak je dobre si to raz za mesiac zbehnut - vygenerovat si export prijatych platieb v zooze a stiahnut si export z banky a nechat nejake AIcko to skontrolovat, ze kde je pripadna chyba.", "cited": []}, {"role": "customer", "who": "Anna Minarovič", "text": "Dobrý deň Martin,\n\n\nJa som nemyslela aby informovať platiteľov o probléme ale nás – Vašich zákazníkov.\n\n\nS pozdravom, \n\n\nAnna Minarovič | Helen Doron English Dunajská Lužná\n\n\nTel.: +421(0)908 062 975\n\n\nE-mail:dunajskaluzna@helendoron.sk| Facebook | www.helendoron.sk\n\n\n\n\n\nA world of educational excellence, enjoyment, creativity and knowledge\n\n\nKangi Club\n |  Helen Doron Radio |   HDE Google Play  | HDE App Store |", "cited": []}], "verdict": "gap", "vtitle": "Fio outage window has dates now: mid-August to 2 September", "vnote": "Anna found bank payments with the correct VS that never paired. Martin gave the window: roughly mid-August to 2 September, caused by Fio changing sender and templates repeatedly. Our KB covers the Fio breakage but not the dates, and the dates are what let an operator work out which payments to chase by hand.", "cat": "payments"}, {"channel": "intercom", "id": "215475855266366", "date": "2026-09-09 04:54", "day": "2026-09-09", "human": false, "bucket": "D_assumed_with_kb", "reask": 7, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Edit automatic notifications of an upcoming session | Zooza Help", "Message Templates | Zooza Help", "Creating entry passes | Zooza Help", "Entry pass — client view | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Payment tile on booking | Zooza Help", "Message templates — automatic and manual emails | Zooza Help", "Automatic notification of an upcoming session | Zooza Help"], "q": "How can I create Entry Passes for a clients booking?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "How can I create Entry Passes for a clients booking?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can create an Entry Pass as a product and then assign it to the class.\n\n\n1. Create the pass\n\n\n\n\n- Go to Products → Create New Product\n\n\n- Configure the payment methods and save\n\n- In Items for sale → Add, choose Entry Pass\n\n\n- Set the number of entries (e.g. 10 sessions), price, and validity\n\n- Save the product. \n\n\n2. Assign it to the class\n\n\n\n\n- Open the Programme → Class\n\n\n- Select the entry pass product\n\n- Save.\n\n3. Add it to a specific client booking\n\n\n\n\n- Open the booking\n\n- Click Buy next to the entry pass\n\n- Choose the payment method and confirm (you can mark it as paid if they already paid). \n\n\nTip: You can offer multiple passes (e.g. 5‑session and 10‑session) for the same class to give clients more flexibility.", "cited": ["Creating entry passes | Zooza Help", "Entry pass — client view | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help creating or assigning an Entry Pass, I’m here to help. Would you like to share more about what you’re trying to set up?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Where exactly can I mark this as paid?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You mark it as paid while assigning the entry pass to the booking.\n\n\nSteps:\n\n\n\n\n- Open the booking detail\n\n\n- Click Buy next to the entry pass\n\n- Choose the payment method\n\n- Tick Paid if the client already paid you outside the system\n\n- Confirm the purchase. \n\n\nIf you need to record the payment later, you can also go to Bookings → open the booking → Payments → Add payment and enter the amount and payment method there. \n\n\nTip: the Paid checkbox is the quickest way when you’re assigning the pass and already know the client paid you directly.", "cited": ["Entry pass — client view | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Paid wasn't an option once I clicked Buy", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "That can happen. The Paid checkbox only appears in the Buy window when the entry pass is being assigned to the booking. If it’s not visible there, you can still record the payment afterward. \n\n\nAlternative way:\n\n\n\n\n- Go to Bookings\n\n\n- Open the booking\n\n- Go to Payments\n\n\n- Click Add payment\n\n\n- Enter the amount and payment method, then confirm. \n\n\nThis records the payment manually if the client paid outside the system (e.g., bank transfer or cash).\n\n\nIf you want, I can also explain when it’s better to use the Paid checkbox vs Add payment.", "cited": ["Entry pass — client view | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Payment tile on booking | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help recording the payment for the Entry Pass, I’m here to assist. Would you like to share what you see after clicking Buy so we can continue?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "How do I create a variant for Session Notification template?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You create a variant for a Session Notification template by adding a new custom template.\n\n\nSteps:\n\n\n\n\n- Go to Communication → Templates.\n\n- Scroll to the Notifications section.\n\n- Under Automatic session reminder, click Add new template.\n\n- Edit the subject and message as needed, then Save. \n\n\nAfter creating it, you can assign it to a specific programme:\n\n\n\n\n- Open the Programme\n\n\n- Go to Online Registration → Change\n\n\n- Select your custom template in the Communication section\n\n- Save.\n\nThis lets different programmes send different session reminder emails.", "cited": ["Automatic notification of an upcoming session | Zooza Help", "Edit automatic notifications of an upcoming session | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "There is no Add new Template option?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you don’t see Add new template, the most common reason is your user role.\n\n\nOnly Owner or Admin roles can create or edit templates. If your role is Instructor, the option will not appear. \n\n\nYou can check this here:\n\n\n\n\n- Go to Settings → Users\n\n\n- Look at your role in the list\n\nIf you are an Instructor, an Owner/Admin on your account would need to change your role to Admin or Owner.\n\n\nIf you are already an Admin/Owner, let me know and we can check the next thing that might be hiding the button.", "cited": ["Message templates — automatic and manual emails | Zooza Help", "Automatic notification of an upcoming session | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "I am Owner / Admin", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Since you’re an Owner/Admin, the button should appear in this exact place:\n\n\n\n\n- Go to Communication → Templates\n\n\n- Scroll down to Notifications\n\n\n- Under Automatic session reminder, you should see the standard template and the Add new template option. \n\n\nIf you still don’t see it, one common reason is that you’re looking in the system template list instead of the Notifications section. The button only appears under that specific notification template. \n\n\nQuick check: are you currently on Communication → Templates, and are you scrolled down to the Notifications → Automatic session reminder section?", "cited": ["Automatic notification of an upcoming session | Zooza Help", "Message Templates | Zooza Help"]}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Yes but my screen is not your version", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Got it — thanks for confirming. If your screen looks different, the Add new template button may appear in a different place.\n\n\nOn Communication → Templates, there are two possible layouts:\n\n\n\n\n- \nList view: you’ll see a table of templates. At the top of the list, there is an Add new template button to create a custom variant. \n\n\n- \nNotification section view: scroll down to Notifications → Automatic session reminder, where the Add new template option appears under that notification. \n\n\nQuick check:\n\n\nDo you currently see a table/list of templates, or a sectioned page with “Notifications”?", "cited": ["Message Templates | Zooza Help", "Edit automatic notifications of an upcoming session | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Thanks for the screenshot — that helps a lot. You’re already inside the system template editor, which is why you don’t see Add new template.\n\n\nSystem templates (like Session Notification) cannot be edited directly. To create a variant, you need to duplicate it.\n\n\nDo this on the screen you’re on:\n\n\n\n\n- Click Make a copy (bottom of the page)\n\n- Give the new template a name\n\n- Edit the subject/message as needed\n\n- Click Save template\n\n\nThat creates a user template variant, which you can then assign to a specific programme.", "cited": ["Message templates — automatic and manual emails | Zooza Help", "Message Templates | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help creating or assigning the Session Notification variant, I’m here to assist. Would you like to share what happens when you click “Make a copy”?", "cited": []}], "verdict": "gap", "vtitle": "Creating entry passes for a client's booking — asked seven times", "vnote": "The bot reached for the session notification and message template articles before finding Creating entry passes. Same subject as Tommy's email thread, where Martin had to give the whole procedure by hand. Strongest single KB gap of the week.", "cat": "payments"}, {"channel": "intercom", "id": "215475855046949", "date": "2026-09-09 03:59", "day": "2026-09-09", "human": false, "bucket": "D_assumed_with_kb", "reask": 1, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Getting Started with Zooza | Zooza Help", "Common Booking Scenarios | Zooza Help", "Client Management FAQ | Zooza Help", "Bookings | Zooza Help"], "q": "How do I cancel a booking for APOLLON Polychronopoulos?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "How do I cancel a booking for APOLLON Polychronopoulos?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can cancel it from the booking record.\n\n\nSteps:\n\n\n\n\n- Go to Bookings.\n\n- Find the booking for APOLLON Polychronopoulos and open the booking detail.\n\n- Click Change status and set it to Cancelled. \n\n\nThis ends the enrolment, frees the spot for another client, and keeps the booking history in reports.\n\n\nTip: all enrolment actions (cancel, transfer, pause) are done from the booking, not the client profile. \n\n\nIf you want, I can also show you how to transfer the booking to another class instead of cancelling it.", "cited": ["Common Booking Scenarios | Zooza Help", "Bookings | Zooza Help", "Getting Started with Zooza | Zooza Help", "Client Management FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help with cancelling the booking, I’m here to assist. Would you like to share more about what you’re trying to resolve?", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215475848537071", "date": "2026-09-08 20:33", "day": "2026-09-08", "human": true, "bucket": "HUMAN", "reask": 14, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "HADZE DO PORADOVNIKA\n\nDobrý deň,\n\nna kurze RYSY mi hádže potvrdené registrácie do poradovníkov, viete mi prosím povedať prečo? Už druhá registrácia tento týždeň.\nĎakujem za odp a nezaregistruje do nejakej lehoty tak sa prekonvertuje do stavu Skusobna hodina stratena. Cize stav skusobna hodina skoncena znamena, ze zakaznik sa este nerozhodol. A kedze mate nastavene ze skusobna hodina ma rezervovane miesto v kurze tak vam tym padom blokuju miesto. Preto tam mame v ramci tych automatizacii aj takuto moznost aby to system cistil sam automaticky", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "myslite toto predposledne ?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Nie je to nove nastavenie", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Nie, sekundu poslem Vam screenshot", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "tuto, to predposledne policko", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Aha pardon nie predposledne ale to Zmenit stav na neuspesny po N dnoch", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "dakujem za podrobne vysvetlenie , ale pokial tomu sptravne rozumiem tak ja by som nemal mat ze skusobna hodina blokuje miesto , na ziadnom inom kurze to tak nemam a ani som sa s tym nestretol zeby blokovalo miesto skusobna hodina to som riesil davnejsie a bolo mi povedane ze sa to tak nenastavuje pretoze platiaci klient je prednejsi skusobnej hodine vramci biznisu ..", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "To predposledne je este nieco ine - stava sa napriklad ze sa niekto prihlasi na skusobnu hodinu - registracia je v stave Skusobna hodina zacata", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "A zakaznik sa z terminu odhlasi a uz sa neprihlasi na dalsi termin. A tym padom ostane registracia visiet v stave registracia zacata a opat - blokuje miesto", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Predpokladam, ze to Vam vravela kolegyna - to o tom, ze platiaci zakaznik je prednejsi", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Je to samo  je zapnute a len na 2 kurzoch z piatich", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "To sa moze samozrejme stat. Neviem ci mate prepojenu Zoozu s AIckom ale nedavno sme dorabali moznost aby vedelo aj nastavovat kurzy tak, mozno by som skusil touto cestou ist - nech porovna tie nastavenia aj inych parametrov a popise Vam rozdiely. Mozno tam takychto nezrovnalosti bude viac", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "nepouzivam zooza s AI , kurzy som nastavoval spolocne este s p. Babiakovou cez online prvé sedenia", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "a teda vedeli by ste to vypnut na tych rysoch a liskach?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Jasne, je to vypnute momentalne na vsetkych kurzoch. Vyskusajte pripadne to AIcko, vie to celkom urychlit pracu napriklad aj pri zapise dochadzky.", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "tu ssa to pouziva?", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "dakujem za nastavenie, takze teraz by nemal byt problem s poradovnikom chapem to spravne", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "ano, nemal by uz tento problem byt.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Nie. to je len ukazka ako sa to da pouzivat. Na stranke: https://zooza.app/#mcp najdete navod ako to spojazdnit aj co vsetko to robi", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "dakujem pekne", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Nemate zac. Pekny vecer este prajem", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "aj vam", "cited": []}], "verdict": "gap", "vtitle": "Expired trials keep blocking seats until you clean them up", "vnote": "Confirmed bookings were landing on the waiting list because finished trials that never converted still hold their places. There is a setting for it: course -> Settings -> T
