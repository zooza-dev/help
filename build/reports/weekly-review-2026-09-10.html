onal content about the sender's services, website, and social media links, which is irrelevant to a support query. It does not appear to be a legitimate customer support request.", "cited": []}], "verdict": "gap", "vtitle": "Where to see how many children are enrolled in each course", "vnote": "No KB source cited for what ought to be a first-week question.", "cat": "reports"}, {"channel": "intercom", "id": "215475827252125", "date": "2026-09-08 14:50", "day": "2026-09-08", "human": true, "bucket": "HUMAN", "reask": 3, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Dnes neodoslalo mailovú informáciu o zajtrajších hodinách klientom\n\nDobrý deň, chcela by som sa spýtať. Dnes nechodil mail klientom o zajtrajšej hodine. Viete sa prosím na to pozrieť:?\nĎakujem veľmi pekne. \nS pozdravom, Jarošová Simona - Baby Balance Nitra", "turns": [{"role": "customer", "who": null, "text": "Dnes neodoslalo mailovú informáciu o zajtrajších hodinách klientom\n\nDobrý deň, chcela by som sa spýtať. Dnes nechodil mail klientom o zajtrajšej hodine. Viete sa prosím na to pozrieť:?\nĎakujem veľmi pekne. \nS pozdravom, Jarošová Simona - Baby Balance Nitra", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Vážený Simona,\n\n\nváš tiket byl přijat. Asistent Zooza se vám pokusí ihned pomoci — a člen našeho týmu jej také osobně zkontroluje.\n\n\n— Podpora Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, \n\n\nviete poslat priklad takej registracie, ktora nemala dostat notifikáciu?  V Systeme vidime, ze pripominky odchadzali v poriadku.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Tato zpráva byla smazána.", "cited": []}, {"role": "customer", "who": "Simona Jarošová", "text": "Ďakujem. Napríklad Nela Šmondrk. Aj dnes nám mamičky písali či bude zajtra hodina, keďže im nič neprišlo.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Email jej prisiel. Akurat ako pozeram tak tam mate nastavenu nejaku inu sablonu, kde je natvrdo napisany nazov kurzu a nie su v nej uvedene tie informacie, ktore tam zvycajne su. Zrejme ide o nejaku prisposobenu sablonu. Skontrolujte si prosim nastavenie, aka sablona sa posiela na tom kurze.", "cited": []}, {"role": "customer", "who": "Simona Jarošová", "text": "Ahoj, nerozumiem tomu, lebo pri kurzoch mam nastevnú štadnardnú šablonu a odosiela uplne niečo iné. Aj som si ju kontrolovala a malo by ju odosielať správne", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "No je to tak, ze standardnu sablonu si vymazala takze v tvojom ucte su momentalne iba prisposobene sablony. Akoze mohol by system poslat defaultnu zoozacku ale tvoja standardna je momentalne odmazana", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Spravime to tak, ze ak je tvoja sablona vymazana, posle sa standardna zo Zoozy", "cited": []}, {"role": "customer", "who": "Simona Jarošová", "text": "Ďakujem Martin, neviem ako sa to stalo.", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215475843230655", "date": "2026-09-08 14:26", "day": "2026-09-08", "human": true, "bucket": "HUMAN", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Dear Michael and Martin,\n\nFirst of all, I would like to thank you for all your support and assistance during this period. Although I haven’t been as present lately, I know from Mara and Sorina that you have been extremely helpful and professional, as always.\n\nI’m reaching out now with a request that both Mara and Sorina have also raised, regarding the additional step for authentication or continuing as a guest before the actual registration form appears, which was introduced recently.\n\nAs you know, for those of us working in education, especially in extracurricular activities, September and October are the most important months for children’s enrolments.\n\nBoth our agency and our franchise partners believe that it would help us significantly if this additional step could be removed. During this period, any simplification of the registration process can have an important impact on conversions and on the number of children enrolled.\n\nWe would greatly appreciate it if you could look into this possibility and let us know whether this change could be implemented.\n\nThank you very much for your continued support and collaboration!\n\nWarm regards,\nNomin", "turns": [{"role": "customer", "who": "Nomin Damdin", "text": "Dear Michael and Martin,\n\nFirst of all, I would like to thank you for all your support and assistance during this period. Although I haven’t been as present lately, I know from Mara and Sorina that you have been extremely helpful and professional, as always.\n\nI’m reaching out now with a request that both Mara and Sorina have also raised, regarding the additional step for authentication or continuing as a guest before the actual registration form appears, which was introduced recently.\n\nAs you know, for those of us working in education, especially in extracurricular activities, September and October are the most important months for children’s enrolments.\n\nBoth our agency and our franchise partners believe that it would help us significantly if this additional step could be removed. During this period, any simplification of the registration process can have an important impact on conversions and on the number of children enrolled.\n\nWe would greatly appreciate it if you could look into this possibility and let us know whether this change could be implemented.\n\nThank you very much for your continued support and collaboration!\n\nWarm regards,\nNomin", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Hi Nomin,\n\n\nThanks for reaching out! I'm Zooza Support, Zooza's AI Agent and I'm well trained to answer your query but you can reply and ask for the team at any time.\n\n\nI understand how this extra authentication step could create friction and impact your conversion rates during peak enrollment periods.\n\n\nThis is a product configuration request that requires review by our team, as it involves changes to your booking flow design and user experience. A human agent will be able to assess your specific setup, discuss the trade-offs between guest access and data collection, and explore whether adjustments to the step's visibility, wording, or layout might help — or whether removing it entirely is feasible for your use case.\n\n\nWould you like me to connect you with a member of our team who can review your request and discuss the options with you?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Nomin, thank you for reaching out. Michael probably did not have the time to write to Mara and Sorina, but just today we made the decision, on how to proceed with this and I think you'll be pleased to hear it. \n\n\n\n\n\nEssentially the problem is this - we do offer plenty of possibilities for priority registration, customer benefits such as loyalty programs or other upsell features that are only available to logged in users. However this is in conflict with a situation when the booking form is used as a lead generation tool as is in couple of your scenarios.\n​\n\n\nTherefore we decided to build a dedicated and greatly simplified new form specifically designed to capture leads. This new feature will also contain direct integration between Zooza and Meta to transfer captured leads from one platform to another. So I believe that in the end your existing customers will be happy as they get all the benefits from being already in the system and new customers will be happy as well because they will experience simplified and streamlined user interface.\n​\n\n\nWe will start working on this next week and hopefuly it wont take more than a week or two to get this done.\n\n\n\n\n\nOnce again thank you for your message. I really do appreciate your input and I just want to say that this is really the kind of partnership we love. We always listen to your questions and try to resolve them in a systemic way hopefully enabling your business to grow.\n\n\n\n\n\nAll the best\n\n\nMartin", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215475843046845", "date": "2026-09-08 13:28", "day": "2026-09-08", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "confirmed_resolution", "rating": null, "carried": null, "sources": ["Price and payment setup | Zooza Help", "Create a programme | Zooza Help"], "q": "Ahoj, chcem sa ubezpečiť ohľadom nastavenia.\n\nNa úrovni programu nastavené, typ platby (v splátkach, kurzovné), jednotková cena 59,90€.\n\nNa úrovni skupiny, som prepísal jednotkovú cenu na 7,4875€ (nakoľko tam máme v kurze 8 tréningov).\n\nJe to tak správne?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Ahoj, chcem sa ubezpečiť ohľadom nastavenia.\n\nNa úrovni programu nastavené, typ platby (v splátkach, kurzovné), jednotková cena 59,90€.\n\nNa úrovni skupiny, som prepísal jednotkovú cenu na 7,4875€ (nakoľko tam máme v kurze 8 tréningov).\n\nJe to tak správne?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno, nastavenie má zmysel.\n\n\n\n\n- \nJednotková cena (unit price) je cena za jeden tréning.\n\n- Zooza z nej automaticky vypočíta celkovú cenu kurzu:\ncelková cena = jednotková cena × počet tréningov. \n\n\nAk má kurz 8 tréningov a nastavíte 7,4875 € za tréning, výsledná celková cena bude približne 59,90 €, takže vaše prepísanie na úrovni skupiny je správne.\n\n\nNa úrovni programu je táto hodnota len default, ktorý môže byť na úrovni skupiny prepísaný. \n\n\nAk chcete, môžem vám ešte ukázať, ako správne nastaviť 2 splátky na začiatku a v polovici kurzu, aby to fungovalo presne podľa vášho plánu.", "cited": ["Price and payment setup | Zooza Help", "Create a programme | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "to už mám nastavené, ďakujem", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumiem, ďakujem za informáciu. Ak budete potrebovať pomoc s niečím ďalším, som tu pre vás! 😊", "cited": []}], "verdict": "check", "vtitle": "Unit price overridden at class level", "vnote": "Operator set 59.90 at programme level and 7.4875 at class level for 8 sessions, and wants to know if that is right. Same family as the billable-sessions answer to Tommy.", "cat": "pricing"}, {"channel": "intercom", "id": "215475719267008", "date": "2026-09-08 12:59", "day": "2026-09-08", "human": true, "bucket": "HUMAN", "reask": 20, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Getting Started with Zooza | Zooza Help", "Programmes List | Zooza Help", "Registration and Booking FAQ | Zooza Help", "Login and Account FAQ | Zooza Help", "Onboarding and Launch FAQ | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Managing sessions in a class | Zooza Help", "Creating a class | Zooza Help", "Class Detail | Zooza Help", "Sessions List | Zooza Help", "Add instructors and manage their access | Zooza Help", "Share a course or class registration link | Zooza Help"], "q": "how do i add another person to my account", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "how do i add another person to my account", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can add another person from Settings → Team.\n\n\nSteps:\n\n\n\n\n- Go to Settings\n\n\n- Open Team\n\n\n- Click Add\n\n\n- Enter the person’s name and email address\n\n\n- Choose their role (owner, admin, instructor, etc.)\n\n- Click Add new user to save. \n\n\nEach team member must have their own email address. Shared logins are not supported because they can cause issues with permissions, notifications, and audit trails. \n\n\nAfter you add them, they can log in using the passwordless login link sent to their email.", "cited": ["Login and Account FAQ | Zooza Help", "Add instructors and manage their access | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any additional help adding a team member to your Zooza account, I’m here to assist. Would you like to share more about what you’re trying to set up?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "how do i share session details so parents can book", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "The easiest way is to share a booking link to your class or programme.\n\n\nSteps:\n\n\n\n\n- Go to Programmes\n\n\n- Open the programme\n\n- Open the class\n\n- Click Share and copy the booking link\n\n\n- Send that link to parents (email, WhatsApp, social media, etc.) \n\n\nParents open the link, enter their details, and book online without you creating the booking manually.\n\n\nYou can also share your main booking page where they see all available classes:\n\n\nyourbrand.zooza.online/booking/ \n\n\nTip: you can also copy the link directly from the class card using Share and paste it anywhere you communicate with parents. \n\n\nIf you want, I can also show you how to send a link that opens one specific class so parents don’t have to choose from the full list.", "cited": ["Registration and Booking FAQ | Zooza Help", "Onboarding and Launch FAQ | Zooza Help", "Share a course or class registration link | Zooza Help", "Getting Started with Zooza | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help sharing session details with parents, I’m here to help. Would you like to share more about what you’re trying to set up?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "I have a session today but I can't quite see how to edit the time for the session as the duration is incorrect.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can’t change the time directly from the timetable for an existing session. Instead, edit it from the class’s Sessions area. \n\n\nQuick way:\n\n\n\n\n- Go to Classes\n\n\n- Open the class\n\n- Go to the Sessions tab\n\n- Click the session that’s today\n\n- Edit the date and time, then save. \n\n\nIf you need to change several sessions at once, select them and use Bulk edit → Edit date and time. \n\n\nTip: after editing, open the class and save it once to refresh the displayed dates if needed.", "cited": ["Programmes, Timetables and Sessions FAQ | Zooza Help", "Managing sessions in a class | Zooza Help", "Class Detail | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "okay how do I do that for the same session every week", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "For a weekly recurring session, you don’t edit each one manually.\n\n\nWhen you create the class, you set the schedule once and our system generates all sessions automatically.\n\n\nQuick way:\n\n\n\n\n- Go to Programmes → open the programme → New Class\n\n\n- In the session schedule step set:\n• Day of week (e.g. Monday)\n• Start time\n• Start date\n• End date\n• Repeat: Weekly\n\n\n- Confirm to generate all sessions for that period. \n\n\nZooza will then create every Monday session automatically. You only edit them later if something changes (for example a one‑off holiday or special time).\n\n\nTip: if you ever need to change many sessions at once, you can select them in the Sessions tab and use Bulk edit to update the time.", "cited": ["Programmes, Timetables and Sessions FAQ | Zooza Help", "Managing sessions in a class | Zooza Help", "Class Detail | Zooza Help", "Programmes List | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "So the session has already been created but the duration is incorrect.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Got it — this is a common confusion.\n\n\nThe duration parents see on the booking form does not come from the individual sessions. It comes from a class setting. \n\n\nSo to fix it:\n\n\n\n\n- Go to Classes\n\n\n- Open the class\n\n- Go to Settings → Class properties\n\n\n- Change Duration of sessions\n\n\n- Save\n\nThat number is what parents see when booking, even if the actual sessions have different lengths.\n\n\nYou can still edit the time of specific sessions in the Sessions tab if one week runs differently. \n\n\nTip: if you want, I can also show you how to adjust many weekly sessions at once if the time changes for the whole term.", "cited": ["Creating a class | Zooza Help", "Managing sessions in a class | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Does this clarify how to update it?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "so the duration say 105 (correct) but when i view the session it says 12mins", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "This is expected behaviour. The 105 minutes and the 12 minutes are coming from two different places.\n\n\n\n\n- \n105 minutes → the class setting (what parents see on the booking form).\n\n- \n12 minutes → the actual time difference between the start and end time of that specific session. \n\n\nSo if the session shows 12 minutes, the start and end time on that session are only 12 minutes apart.\n\n\nTo fix it, open the session and adjust the start and end time so the total equals 105 minutes. \n\n\nQuick check:\n\n\n\n\n- Classes → open the class → Sessions tab\n\n- Click the session\n\n- Change the end time so the duration becomes 105 minutes.\n\nTip: if many sessions have the wrong length, you can select them and use Bulk edit to update the time for all of them at once.", "cited": ["Creating a class | Zooza Help", "Class Detail | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Managing sessions in a class | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "I can't see end times", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "That’s normal — the end time is not a separate field in the session view.\n\n\nIn Zooza, each session shows a time range like this:\n\n\n\n\n- 10:00 - 11:00\n\nSo the end time is simply the second time in that range. You edit the session and change the time range to adjust the duration. \n\n\nQuick path:\n\n\n\n\n- Go to Classes\n\n\n- Open the class\n\n- Go to the Sessions tab\n\n- Click the session\n\n- Edit the time range (start and end time) and save. \n\n\nIf you want, I can also show you the fastest way to fix this for all weekly sessions at once.", "cited": ["Class Detail | Zooza Help", "Sessions List | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "yes please i want to fix this across all tuesday sessions", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can fix all Tuesday sessions at once using Bulk edit.\n\n\nSteps:\n\n\n\n\n- Go to Classes → open the class → Sessions tab\n\n\n- Click Overview to open the Sessions section with the class filter applied\n\n- Use the filter to show Tuesday sessions\n\n\n- Click Choose all (or select the Tuesday sessions)\n\n- Click Bulk edit\n\n\n- Select Edit date and time\n\n\n- Choose Set new time for all selected sessions and enter the correct time range\n\n- Click Continue → Start to apply it. \n\n\nThis updates the time for every selected session in one go. \n\n\nTip: after bulk editing, open the class and save it once to refresh the displayed dates if needed.", "cited": ["Managing sessions in a class | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Class Detail | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help correcting the Tuesday session times, I’m here to assist. Would you like to share what you see when you try the bulk edit?", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Done, all Tuesday sessions have been updated to the new duration. They're live on the class now, so you and parents will see the corrected times straight away. Give one a quick look and shout if anything doesn't match what you expected. https://uk.zooza.app/#courses/events?day=3&filter=filter&page=0&page_size=50&sort_by=upcoming_asc", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "perfect thank you.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "the payment link that im sending out to parents doesn't seem to be showing a to pay now. It says £0 to pay now. I think it then sends them an email or they have to go to parent Zone to find the session and pay. Is there a way I can just send a link to anyone and they can instantly sign up and pay without leaving or having to go to another area? https://www.loudballers.com/booking?share=e178c60984575728259d7bd6e08da5a2926b4ccba36f0a82aa50608f2fc6a7a8", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Louis,\n\n\nThat's working as intended, it's a booking link, not a payment link.\n\n\nTuesday Elite is set up as pay-as-you-go, so parents pay per session rather than for a block. That means two steps: first they create their booking profile (nothing to pay at that point, hence the £0), then they choose which Tuesday dates they want and pay for those. The payment happens at the second step, once they've picked their sessions.\n\n\nTo answer your actual question, no, not for this programme type. A single link that signs them up and takes payment in one go only works where there's a fixed amount to charge at signup, like the camps or a monthly membership. With pay-as-you-go, the system can't know what to charge until they've chosen their dates.\n\n\nIf you'd rather have the one-step version, we'd need to change Tuesday Elite from pay-as-you-go to a fixed booking — say a block of sessions paid upfront. That's a real option, just a different commercial model, so worth thinking about whether you want parents committing to a block or picking week by week.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Okay cool. So the process should be. Link - register - select sessions and pay. So lets say they sign up for today only. would they need to follow the same process again? link - register - select session pay. or would they just go to the last step?", "cited": []}, {"role": "human", "who": "Tech Support", "text": "No, the registration is a one-off. Once a parent has been through it, they have a profile and they never repeat that step.\n\n\n\n\n\nFrom then on it's just: pick the session, pay. They can do that from their Parent Zone or the calendar, and the system will also email them about upcoming Tuesday dates so they can book straight from there.\n\n\n\n\n\nSo your process is right for the first time only. After that it's the last step alone, as often as they like.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Because the session is invite only and is hidden from public are they still able to see the session on the calendar?", how replies actually work", "vnote": "Third account this week reporting it (see 215475821347282 and 215475824387919). Delivery to @azet.sk fails on Azet's side, no ETA. Martin also explains the evergreen part: only selected templates go from no-reply@zooza.app, the bulk is sent from us and replies land back in the app, with a notification you switch on in the notification centre. The outage dates; the reply mechanic does not.", "cat": "comms"}, {"channel": "intercom", "id": "215475840214252", "date": "2026-09-08 11:33", "day": "2026-09-08", "human": true, "bucket": "HUMAN", "reask": 9, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": [], "q": "Hi, the booking system isnt prorating the cost", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "Hi, the booking system isnt prorating the cost", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I understand that the booking system not prorating the cost can be frustrating. Would you like me to connect you with a human agent? Or if you prefer, you can provide more details and I’ll do my best to assist you further.", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "yes please", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I will connect you with someone from our team shortly. Meanwhile, could you please share any additional details about the issue? This will help them assist you more efficiently.", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "I have held a large number of trials today and the cost of the term isnt correct, it should prorate", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Sam, can you share more details or a specific booking? We're on it.", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "Hi, so I have done a lot of trials today, trials  classes are priced at 60aed, regular classes are 110aed", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "I have got a 6 week term -", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Sam, the pro-rata pricing works based on the number of sessions remaining in the group.\n\n\nThe system looks at how many upcoming sessions are still left in the particular class and multiplies that by the regular class price of 110 AED.\n\n\nSo, for example, if there are 5 sessions remaining, the price would be:\n\n\n5 × 110 AED = 550 AED.\n\n\nThe 60 AED trial price is separate and only applies to the trial class.", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "yes thats correct", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "but someone who came for a trial today already paid the 60aed and has been charged 670aed", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Could you share the detail about the booking. \nAre you using booking fee, as well?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "Its booking 1891 - Kate macleenan (grace maclennan potter)", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Sam, but this particular registration isn’t a trial or from a trial. It was created this morning, ~4hours before the first session in the group took place, so the price includes all 6 sessions plus the registration fee.\n\n\nFrom what I can see, everything has been calculated correctly. Am I missing something?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "Ohhh ok, thanks for clearly this up", "cited": []}, {"role": "human", "who": "Tech Support", "text": "👍🧡 Great, no worries.", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215475753258608", "date": "2026-09-08 11:27", "day": "2026-09-08", "human": true, "bucket": "HUMAN", "reask": 32, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": [], "q": "Term fees are displaying as AED0 on the website booking form for Core Netball classes - can you tell me what is wrong?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Term fees are displaying as AED0 on the website booking form for Core Netball classes - can you tell me what is wrong?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I understand that seeing AED0 for term fees can be confusing. Would you like me to connect you with a human agent who can look into this for you? Or if you prefer, you can provide more details and I’ll do my best to assist you further.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I’m sorry this term-fee display issue is causing confusion, and I’m here to help with it. Would you like to share more details about what you’re seeing so we can continue troubleshooting?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Here's a draft you can send to Zooza support as-is (via their support form or email):\n\n\nSubject: Bug: billing_period_id writes don't persist — causes AED0 pricing on live booking pages\n\n\nCompany: Get Set Go Kids (company_id: 10, region: AE, server: Asia) Reported by: Tommy Wingrove (tommy@getsetgokids.com)\n\n\nSummary: Several classes under our \"After School Clubs and ECA's\" programme (course_id 48) are displaying AED 0.00 on the public booking form instead of their actual price, even though the class-level price fields are correctly set.\n\n\nAffected classes (schedule IDs):\n\n\n\n\n- GET INTO SPORT NLCS KG1 — schedule_id 294\n\n- GET INTO SPORT NLCS KG2 — schedule_id 295\n\n- GET INTO SPORT NLCS G1-2 — schedule_id 296\n\n- CORE NETBALL NLCS KG1 — schedule_id 312\n\n- CORE NETBALL NLCS KG2 — schedule_id 313\n\n- CORE NETBALL NLCS G1-2 — schedule_id 314\n\nWhat we found: All six classes have billing_period_id = null, despite having correct, non-zero prices set (e.g. schedule 295 has price = AED 990, unit_price = AED 90). On the live registration page (e.g. https://getsetgokids.com/registration?schedule_id=295&course_id=48&place_id=33_0), the class details, dates, and instructor display correctly, but Price shows as AED 0.00.\n\n\nOur company has exactly one billing period configured (id 10, \"First billing period's name,\" active, open-ended date range).\n\n\nThe specific bug: We attempted to set billing_period_id to 10 on all six classes via the Zooza API. Each update call returned a success response (\"updated\": true), but immediately re-checking the class afterward still shows billing_period_id: null. We repeated this twice with the same result — the write is silently not persisting despite the API confirming success.\n\n\nSeparately, for context: We also found that three of these classes (CORE NETBALL — originally schedule_ids 308/309/310) had a stale public registration link pointing to an old, unrelated, empty programme (course_id 49) instead of their actual programme (course_id 48), which we believe was the original cause of their AED0 display. We resolved that by archiving and recreating those three classes (now schedule_ids 312/313/314), but the new classes came up with the same missing billing_period_id issue described above, so their pricing is still showing AED0 on the site.\n\n\nRequest: Could you please:\n\n\n\n\n- Set billing_period_id = 10 on the six schedules listed above, or advise why this write isn't persisting via the API.\n\n- Let us know if there's a reason new/edited classes aren't auto-assigning the company's active billing period, since this seems to be the underlying trigger for the AED0 display bug.\n\nHappy to provide further detail or screen recordings if useful.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thank you for providing such detailed information about the issue. Would you like me to connect you with a human agent who can assist you further with this? Or if you prefer, I can continue helping you here with any additional details you want to share.", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Yes please", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I will connect you with someone from our team shortly. Meanwhile, could you please share any additional details or context that might help them address your issue more efficiently?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Our booking form on our website is displaying fees as zero on select classes - Claude has reviewed and provided the response I shared above", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Can someone please look into this and contact me via email? tommy@getsetgokids.com", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Tommy, this is caused by billable sessions you set on class level. This is a two step setup and you only did the first step:\nThe default behaviour of the app is this: All sessions are considered billable - which means that if the app has to calculate the price it will take ALL sessions within the class and multiplies by Unit price.\nHowever. Not every class is like that and if that is the case then you might want to tell the class: Hey, I want to have 10 billable sessions in this class (This is the step 1 that you did). This switches the app's default mode and from now on only sessions that are EXPLICITLY marked as billable will be used for the price calculation. And you did not mark those sessions. As a result none of your classes calculates prices because there is no billable session in them.\nThere are two ways out of this:\n1) if you indeed want all sessions to be billable then simply remove the billable from class' price settings.\n2) if on the other hand you want to have for example 16 sessions in the class but customers would pay only for 11 of them, then you need to flag those billable sessions. This can be done as a bulk operation either directly from the class or from the sessions list.\nPlease let me know if it helped.\nAlso - from time to time we get this kind of a mistake in the setup so I'll take it to the team and we'll work on this so that it is clearer to the admin what is going on.", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Hey Martin - thank you! I've updated this and it's fixed - appreciate your help", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Glad I could help. As I said, we'll try to rework this so that it is clearer how the system operates:) Have a great day.", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Hi Martin - apologies for another question - I have an issue with the NLCS FRIDAY CLUB setup - I tried offering a term bundle as a one off payment for 10 sessions and receive any additional sessions (currently 3) free. I'll then remove this class option in week 3 - how do I just collect a single payment without parents having to select sessions - I feel it's a similar solution to the billable sessions above?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hm, this may be either complicated or truly very simple:) I'm not exactly sure what you want to offer but let me recap if I understand it:\nYour class currently has 13 sessions IF parents will book NOW then they will pay for the 10 sessions and those three will be offered for free.\nThen later - in week 3 of the class, you'll disable this option and users will pay for the rest of the class (which in week 3 is still 10 classes). But during week 1 and 2 all users will be offered this benefit. Do I understand it correctly?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Correct - in my simple mind they basically get the first 3 weeks free (if they book now). From week 3 I'll then turn the bundle option off and they can simply select the sessions they want to attend ad -hoc", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "then yes, the easiest way to achieve this is using the billable sessions setting. So what you would do is this: 1) You go to the class and set the billable sessions to 13.\n2) Scroll down on the class detail screen and check the checkbox for first 10 sessions\n3) Go to bulk changes and choose Billable sessions operation. Check yes, finish the bulk editing.\nYou will see little pile of coins next to the session status to confirm that they are billable.\n\nNow. You might be asking - I put 13 sessions to the settings but I only marked 10 as billable. Is that correct?\nYes it is - the app will use all sessions within class that are marked as billable to caclulate the class' price.\nWhat the setting 13 does for you is this: When you go to class list and you expand the Status filter, there is an option: Under billable (or something like that) - This will then list all classes where the billable sessions setting does not match the actual situation in that class. So come week 3 - you go to class list, hit this filter and it will list all classes that need the final step:\n4) open class, hit the check button next to those three remaining sessions and convert them to billable.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "If all classes belong to a single course then there is even easier way: Go to Activities -> Sessions -> filter by programme and date and you can bulk update all sessions that are not billable from that single screen", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Ah I think I have found my problem - I have set the Programme to Pay-as-you-go which I assume is why parents are being asked to select sessions when trying to book the bundle? Is there a logical work around on this?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "I just have a single session in the class and have the session rate at AED1500 instead of AED150?", "cit st the available entry passes so that users go directly to checkout and purchase some. I'm sure there will be some more gaps like these that we discover along the way.\n\nHope this helps. So it is up \n\n\nto you now to make some decisions - For example in the booking what you could do is to create 3 entry pass option that is mandatory and with the price 0; This would even explicitly show to customers that hey - they are giving us 3 passes for free and I can purchase up to 10 more:\n\n\nProducts in general gives you great variety how to top up or upsell your bookings with various stuff. It is whole another universe and I'm probably repeating myself a bit:) but once you get the grasp of it it will be easy.", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Hey Martin,\n\n\nThanks for taking the time to do this - it seems like a great system.\n\n\nIntroducing Products into the system set up is a whole new layer of potential confusion for me - it would be great to take 15 mins of your time to walk through a potential set up process.\n\n\nThis particular programme has reached a level of urgency for us today as the school has shared information and parents are requesting to book.\n\n\nIs there someone who can help me get this set up to at least a basic process of registration and payment?\n\n\nFrom what I now understand I need to create new products for the specific options?\n\n\nWhat I don't understand is how these products are linked to the Programme / session selection process? A product for 10 passes allows 10 sessions to be selected? This isn't very clear to me at present.\n\n\nIf that is the case could we offer the following products:\n\n\n3 hour camp:\n\n\n10 passes (allows 12 sessions to be booked ie 2 free) total price AED2250\n\n\n5 passes (allows 6 sessions to be booked ie 1 free) total price AED1125\n\n\n1 pass (single session booking on date of their choice). total price AED225\n\n\nAs we have x2 timing options I assume we would then crea ale) → Franchisenehmer (Kampfkatzenpartner) → Standorte → Kurse → Teilnehmer und Interessenten", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ja – Ihr Anwendungsfall passt sehr gut zu dem, wofür unsere Plattform entwickelt wurde.\n\n\nKurz gesagt: Das von Ihnen beschriebene Franchise‑Modell mit zentraler Verwaltung, mehreren Standorten, Kursen, Wartelisten und Interessenten kann in unserer Plattform abgebildet werden. \n\n\nWas bereits abgedeckt ist:\n\n\n\n\n- \nFranchise‑Netzwerk: Zentrale Verwaltung von Franchisenehmern, Standorten und Netzwerk‑Reporting. \n\n\n- \nRollen & Zugriff: Franchisenehmer sehen nur ihre eigenen Daten, während das Franchise‑Management alle Standorte einsehen kann. \n\n\n- \nKurse & Buchungen: Kurse, Termine, Anmeldungen, Wartelisten und Teilnehmerverwaltung. \n\n\n- \nNetzwerk‑Reporting: Standortübergreifende Auswertungen und Berichte für das Management.\n\n- \nAPI: Eine öffentliche API erlaubt individuelle Integrationen und Lösungen.\n\nWordPress‑Integration:\n\n\nDie Plattform kann über API‑Integrationen oder Website‑Synchronisation mit Webseiten verbunden werden, sodass Kurse und Buchungen auf Ihrer Website angezeigt werden können.\n\n\nInteressenten ohne Kurs:\n\n\nDer Ablauf „Interesse anmelden → Anfrage dem zuständigen Standort zuordnen → Nachfrage auswerten“ ist grundsätzlich ein typischer Use‑Case für Netzwerke mit mehreren Standorten.\n\n\nWenn Sie möchten, kann ich Ihnen auch kurz zeigen, wie man so ein Franchise‑Netzwerk in der Praxis strukturiert (Zentrale → Partner → Standorte → Kurse).", "cited": ["Kundengeschichte: Baby Balance von 300 Kunden zu einer multinationalen Marke mit zooza - Zooza", "Zooza PRO - Zooza", "Franchise-Planungssoftware für Kinderaktivitäten | Zooza", "Führen Sie Ihr Kinderaktivitätenunternehmen reibungslos"]}, {"role": "bot", "who": "Zooza Support", "text": "Entspricht dies dem, wonach Sie gesucht haben?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Falls Sie noch antly, tracking each\n\nswimmer's learning progress.\n\n\n\nFor an initial quotation, please use a capacity of up to 250\n\nswimmers/enrolments and explain exactly how you count bookings or\n\nactive swimmers. My maximum budget is GBP 1,450 per year, spread over\n\nmonthly payments. Please show all costs transparently, including any\n\nmonthly-payment premium, setup, migration, training, support, taxes\n\nand payment-processing fees.\n\n\n\nSwimming progress is my essential requirement. Could you confirm:\n\n- Can I create my own swimming curriculum, levels and individual\n\ncompetencies, including Swiss Swimming-style levels?\n\n- Can teachers assess each skill on a phone/tablet at the pool, record\n\nassessment dates and comments, and retain progress history across\n\nterms and teachers? Is offline assessment available?\n\n- Can parents see completed skills, skills still being learned,\n\nprogress reports and certificates, and receive achievement\n\nnotifications?\n\n- Can progression guide next-level booking/re-enrolment? Please\n\ndistinguish features available now from add-ons or planned\n\ndevelopment.\n\n\n\nCould you also answer these practical questions:\n\n- Can a Swiss business charge in CHF and receive CHF payouts to a\n\nSwiss bank account? Which of TWINT, cards, Swiss QR invoices, bank\n\ntransfers and recurring payments are actually supported in your\n\nsystem?\n\n- Please give the complete processing fee for an example CHF 300\n\ncourse payment, plus any refund, failed-payment or currency-conversion\n\ncharges. Are payment records automatically reconciled?\n\n- Are German, English and French available for parents and staff?\n\n- Do you support siblings in one parent account, group/private\n\nlessons, multiple pools, attendance, trials, waitlists, make-ups and\n\nmid-term enrolment?\n\n- What are the contract length, cancellation terms, limits and prices\n\nas the school grows beyond 250?\n\n- Where is data hosted, do you provide a data-processing agreement for\n\na Swiss school, and can we export all customer, payment, attendance\n\nand skill/progress records?\n\n- What onboarding/training is included, and can you provide references\n\nfrom swimming schools in Switzerland or continental Europe?\n\n\n\nCould we arrange a 20–30 minute video call/demo? Please suggest a few\n\ntimes in the Europe/Zurich time zone. I would particularly like to see\n\na sample swimmer assessed skill by skill, the parent view of that\n\nprogress, a certificate and movement to the next level.\n\n\n\nKind regards,\n\nStamatis Anastasakis", "turns": [{"role": "customer", "who": "Stamatis Anastasakis", "text": "Hello Zooza team,\n\n\n\nYour swimmer stages, badges and next-level re-enrolment look relevant.\n\nPlease clarify whether you also support detailed individual skill\n\nassessments and progress history within each stage.\n\n\n\nI run a swimming school in Basel, Switzerland, and am looking for one\n\nsystem for bookings, payments and, most importantly, tracking each\n\nswimmer's learning progress.\n\n\n\nFor an initial quotation, please use a capacity of up to 250\n\nswimmers/enrolments and explain exactly how you count bookings or\n\nactive swimmers. My maximum budget is GBP 1,450 per year, spread over\n\nmonthly payments. Please show all costs transparently, including any\n\nmonthly-payment premium, setup, migration, training, support, taxes\n\nand payment-processing fees.\n\n\n\nSwimming progress is my essential requirement. Could you confirm:\n\n- Can I create my own swimming curriculum, levels and individual\n\ncompetencies, including Swiss Swimming-style levels?\n\n- Can teachers assess each skill on a phone/tablet at the pool, record\n\nassessment dates and comments, and retain progress history across\n\nterms and teachers? Is offline assessment available?\n\n- Can parents see completed skills, skills still being learned,\n\nprogress reports and certificates, and receive achievement\n\nnotifications?\n\n- Can progression guide am nastavit zdielanu miestnost pre dve skupiny?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Aby dve skupiny (classes) používali rovnakú miestnosť v rovnaký čas, použite funkciu Shared sessions.\n\n\nPostup:\n\n\n\n\n- V aplikácii otvorte Team & Settings → General → Shared sessions.\n\n- Vytvorte nový shared‑sessions set (zadajte len názov).\n\n- V časti Classes sharing the room zaškrtnite obe skupiny, ktoré chcete mať v tej istej miestnosti.\n\n- Kliknite Add. \n\n\nDôležité:\n\n\n\n\n- Obidve skupiny musia mať rovnakú miestnosť (venue).\n\n- Musia mať rovnaký deň a prekrývajúci čas.\n\nVýsledkom je, že systém ich spojí do jednej miestnosti a použije kapacitu miestnosti, takže sa nepreda viac miest, než miestnosť kapacita dovolí.\n\n\nAk chcete, môžem vám ešte ukázať aj typický príklad nastavenia (napr. začínajúci + pokročilí v jednej miestnosti).", "cited": ["Shared sessions — two classes in one room | Zooza Help", "Creating and managing locations | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further assistance with setting up shared rooms or have other questions about managing your groups, I am here to help. Would you like to provide more details about what you are trying to accomplish so we can continue?", "cited": []}, {"role": "customer", "who": "Lenka Pechová", "text": "a viem nastavit spolocnu kapacitu pre obe skupiny spolu a potom je jedno kolko registracii je v jednotlivych skupinach?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno. Pri použití Shared sessions sa kapacita zjednotí na úrovni miestnosti. \n\n\n\n\n- Kapacita už nie je oddelená pre každú skupinu.\n\n- Systém použije kapacitu miestnosti (venue) ako spoločný limit.\n\n- Je teda úplne jedno, koľko rezervácií je v každej jednotlivej skupine – dôležitý je len celkový počet ľudí v miestnosti.\n\nPríklad: miestnosť má kapacitu 10 ent available.", "cited": []}, {"role": "customer", "who": "Jakub Majoroš", "text": "Zdravím,\nprosím o posunutie na tím.\nS pozdravom\nJakub_MEDVEDICA", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Jakub, ide o dva rozdielne rezimy registracie - ak sa prihlasujem na cely kurz, potom system predpoklada, ze sa prihlasujem do vsetkych terminov v skupine. Aj z pohladu ceny ide o dve samostatne vetvy - zatial co pri blokoch mate samostatne nastavenie ceny a zliav, pri celej skupine sa vypocet ceny riadi inymi pravidlami. Teda to co sa snazite odfiltrovat sa v jednom filtri urobit neda. Ak je zapnuty filter len na blok (na zozname registracii), potom tento filter nezahrna ludi, ktori su registrovani do celeho kurzu. Jedna cesta ako to obist je prihlasit tie deti na vsetky bloky, ale to je manualna praca. Otazka je, ako by ste si predstavovali aby to fungovalo? Preto spominam tu cenu, pretoze teoreticky by sme to mohli vyriesit tak, ze ak si zakaznik pri registracii vyberie ze chce ist do celeho kurzu, mohli by sme ho \"prihlasit\" na vsetky bloky ale tym by zaroven dostal aj taku cenu ako keby si sam bol vsetky bloky v registracnom formulari vyklikal. Bolo by toto riesenie za Vas okej, alebo by ste preferovali aktualne fungovanie a jedine, co treba doriesit je reporting?", "cited": []}, {"role": "customer", "who": "Jakub Majoroš", "text": "Zdravím, Martin,\n\n\náno, ako vravíte, sú to dve odlišné vetvy. Na jednu stranu sme chceli rodičom umožniť prihlásenie na celý kurz so zľavou za celoročné prihlásenie, no časť rodičov chcela íst iba na vybrané bloky (bez zľavy). Keďže systém ponúka spojenie týchto dvoch možností (čo je super), tak sme im to umožnili. Až potom som si ale uvedomil, že sa tie deti z celého roka asi nepretavia do blokov a môže nastať problém pri exporte. \n\n\nNo musím sa teraz priznať, že mea culpa, lebo v nastavení zliav blokov sa zjavne dá nastaviť zľavu za výber určitého počtu blokov... Čo vlastne celý tento problém rieši "text": "kde jen mail?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Na obrazovce, kterou máte otevřenou (Termíny), tlačítko Email není vidět. Je v levém menu.\n\n\nPostup:\n\n\n\n\n- v levém menu klikněte na Komunikace\n\n\n- otevřete Zprávu poslat\n\n\n- tam připravíte e‑mail a vyberete příjemce\n\nTato sekce slouží právě pro hromadnou komunikaci a šablony zpráv. \n\n\nTip: pokud chcete, můžu vám také ukázat, jak vybrat jen rodiče z bazénu Dobiášova, aby šla zpráva jen jim.\n\n\n\nSource:\nZooza PRO - Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Bylo to užitečné?", "cited": []}, {"role": "customer", "who": "Ondřej Fisenko", "text": "A kde vberu všem z bazénu dobiášova?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Na této obrazovce (Komunikace → Zprávu poslat) bohužel lokalitu vybrat nejde. Zde můžete zvolit jen obecné cílové skupiny, např.:\n\n\n\n\n- Všem klientům s aktivní registrací\n\n- Všem klientům\n\n- Konkrétní skupině\n\n- Jednomu klientovi\n\n- Vybraným registracím \n\n\nPokud chcete poslat e‑mail jen klientům z bazénu Dobiášova, je potřeba použít filtr v Termíny (Classes):\n\n\n\n\n- otevřete Termíny\n\n\n- filtr Místo → Bazén Dobiášova\n\n\n- nahoře klikněte Email\n\n\nVšichni klienti z vyfiltrovaných termínů se automaticky stanou příjemci. \n\n\nTip: tento způsob je obvykle nejrychlejší, když chcete oslovit klienty z jedné konkrétní lokality.", "cited": ["Email and Communication FAQ | Zooza Help", "Sending email/SMS to clients | Zooza Help", "Send Email | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Dostali jste odpověď na svou otázku?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Jste na správné stránce Termíny a máte už nastavený filtr Místo: Bazén Dobiášova. Teď jen potřebujete otevřít hromadnou akci.\n\n\nPostup:\n\n\n\n\n- zaškrtněte termíny (ty checkboxy u každé lekce)\n\n- nahoře v liště klikněte Hromadná úprava\n\n\n- zvolte Send email\n\n\nTím se otevře editor e‑mailu a všichni klienti z vybraných termínů se automaticky stanou příjemci.\n\n\nTento způsob je doporučený, když chcete oslovit klienty z konkrétní lokality nebo vyfiltrovaných lekcí.\n\n\nTip: pokud chcete, můžu vám také ukázat, jak poslat zprávu jen jedné konkrétní lekci v bazénu Dobiášova.", "cited": ["Sending email/SMS to clients | Zooza Help", "Calendar bulk actions | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Pomohlo vám to?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Jste na správné stránce Termíny, ale ještě jste v režimu Hromadná úprava. Tady se e‑mail neukazuje.\n\n\nPostup je tento:\n\n\n\n\n- zaškrtněte termíny (ty checkboxy u lekcí)\n\n- \nneklikněte na Hromadná úprava\n\n\n- nahoře v liště nad termíny se objeví toolbar\n\n- tam klikněte Send email\n\n\nTím se otevře editor e‑mailu a všichni klienti z vybraných termínů se automaticky stanou příjemci. \n\n\nTip: pokud chcete, můžu vám také ukázat, jak poslat zprávu jen jedné konkrétní lekci v bazénu Dobiášova.", "cited": ["Calendar bulk actions | Zooza Help", "Sending email/SMS to clients | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Bylo to užitečné?", "cited": []}, {"role": "customer", "who": "Ondřej Fisenko", "text": "podle  mě to není funknčí", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Děkuji za screenshot – podle něj je vidět, že jste v režimu Hromadná úprava. V tomto režimu se e‑mail opravdu neukazuje. \n\n\nPostup je tento:\n\n\n\n\n- zaškrtněte termíny\n\n- neklikněte na Hromadná úprava\n\n- nahoře nad seznamem termínů se objeví toolbar\n\n- tam klikněte Send email\n\n\nTím se otevře editor e‑mailu a všichni klienti z vybraných termínů se automaticky stanou příjemci.\n\n\nPokud se tlačítko Send email ani po zaškrtnutí termínů neobjeví, může to být také oprávnění role (např. externí instruktor nemůže posílat e‑maily). \n\n\nMůžete prosím poslat ještě jeden screenshot celé horní lišty nad termíny, když máte nějaké termíny zaškrtnuté? Rád se podívám, kde přesně se to skrývá.", "cited": ["Calendar bulk actions | Zooza Help", "Sending email/SMS to clients | Zooza Help", "Instructor Access and Roles FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Pokud stále potřebujete pomoci s odesláním e-mailu klientům z bazénu Dobiášova, jsem zde pro vás; omlouvám se za dosavadní nejasnosti. Chcete doplnit, co přesně se po zaškrtnutí termínů zobrazuje?", "cited": []}, {"role": "customer", "who": "Ondřej Fisenko", "text": "Send mail nevidím předej to tvým lidským kolegům aby to zapracovali do další verze zoozy. Děkuji", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumím, hned vás předám někomu z našeho týmu. Předtím, než odejdete, můžete mi prosím sdílet ještě nějaké detaily o vašem problému? Pomůže to našim kolegům rychleji najít řešení.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, pan Fisenko,\n\n\nje viacero sposobov ako mozete poslat email na lokalitu. \n\n\n\n\n- Zoznam registracii, si do filtra vyfiltrujete miesto a poslete hromadnu spravu https://zooza.app/#registrations\n\n\n- V zozname skupin si vyberiete miesto a polsete hromadnu spravu cez poslat email https://zooza.app/#courses/schedules\n\n\nNa toto sa zoznam terminov nepouziva. Je tam este nejaky iny filter, ktory by ste potrebovali urobit? Ak chcete informovat napriklad o odstavke bazena v tento den, tak je mozne cez tlacidlo \"hromadna uprava\" poslat aj z kalendara, kde cez naseldne vyklikate terminy, ktorym chcete poslat spravu. Sprava sa odosle vsetkym uvedenym na termine. https://zooza.app/#calendar\n\nDajte vediet, ci pomohlo.", "cited": []}, {"role": "customer", "who": "Ondřej Fisenko", "text": "Dobrý den, pomohlo. Mockrát děkuji. Asi mě zatím nenapadá žádný potřebný filtr. Pěkný den", "cited": []}], "verdict": "gap", "vtitle": "How to email everyone at one venue", "vnote": "Three routes from Martin: filter the registrations list by location and send a bulk message; pick the location in the classes list and send from there; or, for something like a pool closure on one day, use bulk edit on the calendar to message everyone on the selected sessions. He also says plainly what not to use — the sessions list. Good, complete, generalises.", "cat": "comms"}, {"channel": "intercom", "id": "215475822142393", "date": "2026-09-07 08:18", "day": "2026-09-07", "human": true, "bucket": "HUMAN", "reask": 1, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Ukazovanie dieťaťa v dochádzke po presune\n\nDobrý deň, v dochádzke ukazuje stále dieťa po presune. Presun je v rámci jednej pobočky a jednej školy. V dochádzke sa nemá čo ukazovať presunuté dieťa, nakoľko to je mätúce. Rodičom  tiež ukazuje pôvodnú skupinu,napriek tomu, že dieťa mám presunuté v inej skupine. \nViem, že sa to týka okrem BA1 aj Trnavy. \nPrint screen v prílohe.", "turns": [{"role": "customer", "who": null, "text": "Ukazovanie dieťaťa v dochádzke po presune\n\nDobrý deň, v dochádzke ukazuje stále dieťa po presune. Presun je v rámci jednej pobočky a jednej školy. V dochádzke sa nemá čo ukazovať presunuté dieťa, nakoľko to je mätúce. Rodičom  tiež ukazuje pôvodnú skupinu,napriek tomu, že dieťa mám presunuté v inej skupine. \nViem, že sa to týka okrem BA1 aj Trnavy. \nPrint screen v prílohe.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dear Maja,\n\n\nyour ticket  has been received. Zooza Assistant will try to help you right away — and a member of our team will personally review it too.\n\n\n— Zooza Support", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, pani Minarovic,\n\n\ndakujeme za napisanie. Registracia bola presunuta v case, ked klientke uz vznikol zapis na hodine v povodnej skupine, \n\n\nak to chcete upravit, (napriklad skryt, alebo nahradit za iny), je to mozne priamo v detaile registracie. V tomto ma admin plnu kontrolu. https://zooza.app/#registrations/508561/attendance", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den, je to uplne v poriadku. Na danej registracii je oznaceny dochadzkovy zaznam ze dieta pride, preto ho system nadalej na termine ukazuje. Pri presuvani registracie mate moznost urcit k akemu datumu dieta presuvate a ak tento datum urcite, potom system vsetky terminy, pred tymto datumom, ktore nemaju dochadzkovy zaznam skryje. Tu ale dochadzkovy zaznam existuje - inymi slovami system ocakava, ze dieta pride, pretoze je to jednoznacne v dochadzke napisane (dochadzkovy zaznam doslova hovori - Pride). Ak teda tento dochadzkovy zaznam vznikol omylom, alebo uz z akehokolvek dovodu dieta nema prist, mozete tento dochadzkovy zaznam kedykolvek skryt:", "cited": []}, {"role": "customer", "who": "Maja Minarovič", "text": "Presun dieťaťa bol robený k dátumu 6.9., potom čo rodičom prišla notifiácia o termíne v pondelok. Potrebujem aby to tam nebolo keďže do dochádzky chodia aj lektori, ktorí berú deti na základe toho čo je napísané v dochádzke. Ja si to viem skryť ale lektor potrebuje mať presný zoznam detí v daný deň. Presuny sa robia hlavne po ohlásení rodičom notifikáciou, lebo práve vtedy si uvedomia, že musia zmeniť termíny výuky.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Tak ako som pisal a je to vidno aj na screenshote, ktory som posiela - ten dochadzkovy zaznam je mozne skryt a tym padom sa zobrazovat nebude. To co opisujete sedi s tym ako ten dochadzkovy zaznam vyzera. Ak presuvate dieta, ktore uz ma dochadzkovy zaznam na niektorom z terminov, potom je nutne tieto dochadzkove zaznamy vzdy doriesit rucne. System sa nevie sam rozhodnut ci vy ako administratori chcete aby dieta na termin prislo alebo nie. Automaticky nastavuje dochadzku na skrytu iba na terminoch, ktore dochadzkovy zaznam nemaju.", "cited": []}], "verdict": "gap", "vtitle": "After a transfer the child still shows in the old group's attendance", "vnote": "Because attendance was already recorded before the move. The admin can hide it or swap it for another session from registration detail -> attendance. Confusing enough that the operator thought it was a bug across two branches.", "cat": "clients"}, {"channel": "intercom", "id": "215475814140795", "date": "2026-09-07 08:06", "day": "2026-09-07", "human": true, "bucket": "HUMAN", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Neprehráva videá klientom\n\nDobrý deň,nahrala som do dochádzky videá. Avšak keď som skúšala sa prihlásiť a chcem ich zobraziť automaticky ma hádže na starú stránku www.babybalancenitra.sk a tam mi ich nezobrazuje. Nová stránka je www.babybalance.sk, ale keďže kvôli niektorým produktom si chcem zachovať aj tú starú stránku. Ďakujem za odpoveď", "turns": [{"role": "customer", "who": null, "text": "Neprehráva videá klientom\n\nDobrý deň,nahrala som do dochádzky videá. Avšak keď som skúšala sa prihlásiť a chcem ich zobraziť automaticky ma hádže na starú stránku www.babybalancenitra.sk a tam mi ich nezobrazuje. Nová stránka je www.babybalance.sk, ale keďže kvôli niektorým produktom si chcem zachovať aj tú starú stránku. Ďakujem za odpoveď", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Vážený Simona,\n\n\nváš tiket byl přijat. Asistent Zooza se vám pokusí ihned pomoci — a člen našeho týmu jej také osobně zkontroluje.\n\n\n— Podpora Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "https://zooza.atlassian.net/browse/ZOOZA-4920", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215475821347282", "date": "2026-09-07 07:50", "day": "2026-09-07", "human": true, "bucket": "HUMA
