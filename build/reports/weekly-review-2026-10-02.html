udete potrebovať pomoc s niečým innym, som tu pre vás k dispozícii. 😊", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215475928134448", "date": "2026-09-29 08:43", "day": "2026-09-29", "human": true, "bucket": "HUMAN", "reask": 78, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Onboarding and Launch FAQ | Zooza Help", "FAQ — Programmes | Zooza Help", "When to enrol clients yourself vs. send them a booking link | Zooza Help", "Where to find things in Zooza — quick reference | Zooza Help", "Share a course or class registration link | Zooza Help"], "q": "is there a quick way to see if all the people that attended last Tuesdays session have been invited to this weeks session.", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "is there a quick way to see if all the people that attended last Tuesdays session have been invited to this weeks session.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — there is a quick way to check this.\n\n\nIf the invitations were sent through auto‑enrolment, you can see exactly who has been invited and their response status.\n\n\nOption 1 (best for this):\n\n\n\n\n- Go to Programmes → Auto‑enrolment responses\n\n\n- You’ll see every invited client with their status:\n• Accepted\n• Declined\n• Not decided yet\n\nThis page lets you quickly confirm whether everyone who attended last week has been invited and whether they’ve responded. \n\n\nOption 2:\n\n\n\n\n- Go to Bookings\n\n\n- Use the Auto‑enrolment filter to view Accepted / Declined / Not decided yet.\n\nIf you want, I can also show a quick workflow many coaches use to make sure last week’s attendees are always invited to the next session.\n\n\n\nSource:\nFAQ — Programmes | Zooza Help", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Okay please can i have a link for the new session? That way I can just drop everyone a email with the link.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — you can grab a direct booking link for that specific session and send it by email. \n\n\nQuick way:\n\n\n\n\n- Go to Programmes\n\n\n- Open the programme\n\n- Open the class for this week’s session\n\n- Click the Share or copy link icon on the class\n\n- Paste that link into your email to parents\n\nThat link takes them straight to the registration page for that session. \n\n\nYou can also copy the link from the class tile in the programme view if that’s faster. \n\n\nTip: many coaches send this link in a short message like “Book your spot for this week’s session here” so parents can register themselves quickly.", "cited": ["Onboarding and Launch FAQ | Zooza Help", "Share a course or class registration link | Zooza Help", "Where to find things in Zooza — quick reference | Zooza Help", "When to enrol clients yourself vs. send them a booking link | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help checking attendance invitations or sharing the session link, I’m here to help. Would you like to share more about what you’re trying to do?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Louis, no such report is not available anywhere. If you want to nudge users to sign up for this week, the easiest way is to send a bulk email to everyone with an active booking and ask them to book new session inside the customer portal.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "I would not send them booking link as that would mean that they would need to book again and as I understand it the programme you're talking about is of type - pay as you go", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "sorry Martin", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "I have somehow switched chats.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "how do i filter", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "No worries:)", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "On Classes simply choose the Programme filter and tick the tickbox next to it", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "This will filter all classes for that programme", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Then at the top you'll see the email button", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "This is how the customer portal looks like for someone who is in the trial.\n​", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "I don't see email.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "And this is the dashboard of a customer who is enrolled with the Pay As You go programme\n​", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Sorry, you don't want to go to the session level", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "this is where you want to be - Classes", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "At the top - Send email", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "If you want to send these reminders manually we can create a repeatable process for you so that it would be a one button for you. And more crucially would not send it to customers that already booked for that session", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "You are in the Sessions. Click on Classes", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Got it", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Nice", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Those are two different things. Also the thing you were asking about the 9 people being enrolled", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Do I need to add anything or just hit continue.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Just hit continue", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "This?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "So this is the actual email that is going to be sent. So fill in the subject - something catchy like: Don't forget to book for tomorrow's session", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "And in the email body don't forget to add the link: \u003ca href=\"*|WIDGET_PROFILE_URL|*\">BOOOK HERE\u003c/a>", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "You can just type Book here, select the text and click on the Hyperlink icon and add *|WIDGET_PROFILE_URL|* there in the dialog", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "You can save it into your user templates so next time you'll just pick it up and don't have to write it again", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "okay let me try. with the stars?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Yes", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "You can also copy and paste that from the right hand toolbar if you're not sure whether you spelled it correctly", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ah sorry, the right hand toolbar is not on that screen", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "its on the template editing screen", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "My bad", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "is this good to save?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Yes", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Can I also confirm that automations are setup for players that attended free trials on Thursday and Saturday?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Or should i do this for everyone that attended the free trial sessions?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "What programmes are those please?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Saturday Academy both sessions, Younger and older & Barnet PDC both sessionsYounger and older.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ok so on both the trial automations are set up. Just to confirm that this is something else than what we were just doing. Is that correct? These are not pay as you go sessions", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Yes this is not pay as you go. Both Saturday and PDC are free trial - Monthly membership", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ok, then yes you have the automation set up correctly there", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "perfect thank you.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "You are welcome", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "There are couple things I'd like to follow up", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "You mentioned that you were kind of confused about the terminology - 9 enrolled for the class but no one actually attending tomorrow's sessions", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "yes", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "I'm thinking about how to redesign this because those are two different things. The class can actually hold more bookings/enrollments than its capacity, because capacity for this programme is actually gated by the session", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "So by creating enrollment - people are basically getting access to the customer portal from which they can book the session", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "So I'm thinking about how to make it clearer for newcomers like yourself", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Makes sense", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "And also I would like to create this option for you to send the manual notification to those who are enrolled but NOT booked to a particular session", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "enrolments (allowed to book)", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hm, that is good. And I'm thinking of skipping the capacity there at all. I think it just makes things confusing", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "So I had a parent sign up and pay for last week and this weeks Tuesday elite sessions. However I don't see them on the will attend list.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "This is for the pay as you go classes? Can you please give me the booking number?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "yes for the pay as you go class.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Sorry how would i find booking number?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Alistair Naqvi players name", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "It's the big number on the booking when you enter the booking detail:)", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Let me find mr Naqvi", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "he has created 4 bookings, can you please help me narrow this down as for which programme you are looking at?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "tuesday elite session. Pay as you go. Session 2", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "thank you Louis, I can see that he is actually on that session but he's not showing up on register, let me take it to our tech team and I'll get back to you on this", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "great", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Also when i look at the register is there away to organise into alphabetical order?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hm, not really. The register is built in terms of order of attendance so those who booked first are at the top. but for sure this should not be a problem to add", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Yeah would be helpful. I was struggling to find names on my phone.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "are you using the quick view for that matter?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "yes quick view.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "ok, thank you :)", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Louis, this is what is going on", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "The session with ID: 26877 to which Mr Naqvi was booked was deleted on 8th of september", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "So that is the reason why you can't see that session anywhere and why his attendance is also not showing up", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Oh no", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "His booking to that session was therefore \"lost\" silently", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "that session's original date was: 2026-09-15 17:30:00", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "What you can do is to locate that session in the trash: https://uk.zooza.app/#settings/trash?page=0&page_size=25", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Restore it temporarily, then re-book mr Naqvi from that session and add thim manually to tomorrow's session", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Now I'm thinking whether it wouldn't be just easier if we do it from the backend", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "As when you'll cancel the attendance an email will be fired to mr Naqvi which is probably not something we want to do", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "okay. How has the session been deleted?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "It is marked to be deleted by you via bulk operation", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "okay", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "not sure how ive managed that.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "is it possible that there are multiple attendees that might've been cropped up like this?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Looking into the database this seem to be the only booking", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "I've re-booked that attendee to session nr 27608 which is happening tomorrow at the same time as the original - now deleted session", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "perfect thank you. is there a link so they can just go stright to the session select it and pay?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "I believe that it is the one you already sent via email earlier. As long as they are logged into the system then they can book easily from the calendar as well (which is a public link)", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Good morning.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "I want to directly contact the parents that attended trials. But can’t locate the. Is there a simple way to see past sessions players and who hasn’t signed up?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Louis, essentially it's all within the bookings screen. There are all stages of the trial process captured in the booking status. So based on your message you are looking to bookings in stage Trial Ended or Trial Lost. Trial ended means that customer enrolled into trial - attended - but did not convert yet. Trial lost - booking is transitioned to this status according to your automation settings. So for example - customer attended the trial -> switched to status trial ended -> system sends two reminders and after those two reminders if customer still did not convert it will transition that booking into trial lost.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Yes exactly. Ive had a couple of people mention that they didn't receive the sign up emial or it was sent to spam/promotions. Am I able to automatically send a sign up text or whatapp also?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Was just thinking it might increase sign ups", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "For whatsapp you'd need to connect your whatsapp for business account with zooza and then zooza will send these automatically using both - email and whatsapp.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Of course you can send them a nudge manually at any time", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Okay cool. How do i connect whatapp", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "ho", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Hi", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Louis,\n\n\nApologies for the slow reply on this one ,,, and thanks for chasing.\n\n\nWhatsApp is available in your account and there's a step-by-step guide built into the setup page:\n\n\nhttps://uk.zooza.app/#communication/whatsapp/setup\n\n\nGive it a go and shout if you get stuck anywhere.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "So I use my business whatsapp with another marketing tool. Can it be connected still?", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Louis,\n\n\nYes, until recently that wasn't possible, but Meta released a version a few weeks ago that allows a number to be shared across more than one tool, and we updated Zooza to support it as soon as it went live. So you should be able to connect your business number even though it's already used by your marketing tool.\n\n\nOne honest caveat: it's new enough that we don't have much real-world experience with it yet, and Meta can be unpredictable in this area compared with most providers. So do connect it, but keep an eye on the first few messages going out rather than assuming it's all fine.\n\n\nShout if anything behaves oddly and we'll look at it with you.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "I need to cancel this membership", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Sonny Pearson", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Team Membership U9", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Louis, just navigate to the booking and there is a button to cancel the booking", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Either right now, or scheduled cancellation", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "I also need to change older group Saturday session programme to 10.30-11.30 not 11.30-12.30. I edited the time which now shows on the website but the description still says 11.30-12.30", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Have you bulk edited the sessions?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "I believe so", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "The time that is advertised on the website is typically the very first session of that class. So if you only changed the upcoming sessions that would be the reason why it is showing wrong time", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Louis - one small update - last week we talked about the statistics on the class overview not being particularly helpful when it comes to Pay as you go classes. We've overhauled the information so that now it carries specific atendance for upcoming session. Below that are two links - Sign-ups - people who signed up for that class, Not booked - People who have no upcoming session booked. So if you want to message to those who have not booked, just click on the \"Not booked\" button and send an email. This will go into production today so you'll see it in the ap tomorrow morning", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Hi guys I  need to change a few things. ATM people can’t book Thursday PDC first session 5.30-6.30. It’s saying full but at the same time we only had 12 attend last week. I don’t know how to fix this. As when I look at the session I can see only a handful have actually signed up.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Louis,\n\n\nThe session isn't actually full, the seats are being held by trial bookings that haven't been closed off yet.\n\n\n\n\n\nYou currently have 13 trials still sitting as \"started\" on that group. Each one holds a seat until it's resolved, which is why only a dozen turn up but the system shows no space. \n\n\n\n\n\nTwo things are causing it:\n\n\n1. Trials with no attendance marked. If a trial comes and goes without being marked, the seat stays reserved. Marking attendance each week clears them.\n\n\n2. Trials marked as \"Cancelled\". That status freezes the booking, because it tells the system you'll be offering that child a replacement date. If someone simply didn't turn up and you're not offering another date, mark them \"Did not attend\" instead,,that closes the trial as lost and frees the seat.\n\n\nThe easiest place to see the whole picture is the group detail page: https://uk.zooza.app/#courses/schedules/407\n\n\n\n\n\nGoing forward, I can switch on automatic clearing so unresolved trials close themselves a couple of days after the trial date, rather than sitting there indefinitely: https://uk.zooza.app/#courses/229/settings?edit=trial\n\n\n\n\n\nDo you agree? If so I'll turn it on for you.\n\n\n\n\n\nThat was deliberately left off at the start so you wouldn't lose trials you might still want to chase by hand. Now you've got volume coming through, automatic is probably the better setting, say the word and I'll turn it on.\n\n\n\n\n\nIn the meantime, if you go through those 13 and mark each one either Attended, Did not attend, or move them into the membership, the Thursday seats will free up straight away.https://uk.zooza.app/#registrations?status=trial_started&order_by=created_desc&page=0&page_size=20&person_id=0&payment_id=0&segment_id=0&schedule_id=407", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Yes that would be so much better. Its just creating a bottle neck. So people can't book on or see the session on the website. I think approximately 40/45% of players booked on for trials actually attended.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Thanks for getting back to us Louis. We'll adjust the settings accordingly. The 45 percent turnout is not really unusual. Some providers have better numbers than others. But perhaps you could also think about adjusting the copy on the confirmation email that would clearly communicate that if they don't show up, their seat will be taken off of the register or something like that to encourage parents to attend. Just a thought:)", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Yes that makes sense. Where would i find the conformation email so i can adjust copy?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "it would be here: https://uk.zooza.app/#communication/templates?type=registration_trial_done", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Thanks", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Hi just trying to get this right. I have adjusted the email slightly. But what other emails are sent to a parent before the trial?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Its these four:", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "https://zooza.app/#communication/templates?name=trial", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Oh sorry not reading:)", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Before the trial it is the one that I sent to you and potentially the session reminder", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "https://uk.zooza.app/#communication/templates?type=event_notification", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "But this is sent to everyone regardless whether they are on trial or not", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "When is the reminder sent?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Day prior the session", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "if you have it enabled on the programme", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Right okay. Could you help then please.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "TimingMessage\n\n\nImmediately\n\n\nYour free trial is booked — full confirmation\n\n\n48 hours before\n\n\nOnly 2 days to go — excitement and preparation\n\n\n24 hours before\n\n\nPlease confirm attendance — reply YES\n\n\n2–3 hours before\n\n\nToday’s session reminder — time, venue and arrival\n\n\nAfterward\n\n\nMembership invitation or no-show rebooking", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "I actually think 72hrs could be good also.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Hopefully that chain of contact could get us to a much higher rate of conversion.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Or even this as the absolute optimal.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "TimingChannelPurpose\n\n\nImmediately\n\n\nEmail\n\n\nFull confirmation and practical details\n\n\n48 hours before\n\n\nEmail\n\n\nBuild excitement and prepare them\n\n\n24 hours before\n\n\nSMS\n\n\nAsk them to reply YES\n\n\n2–3 hours before\n\n\nSMS\n\n\nFinal time and venue reminder\n\n\nNo 24-hour response\n\n\nManual WhatsApp\n\n\nPersonal confirmation follow-up\n\n\nAfter trial\n\n\nEmail + SMS\n\n\nMembership invitation or rebooking", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Louis,\n\n\nAutomatic cleanup is now switched on: any trial left unresolved clears itself 5 days after the trial date, so this won't build up again. I've also manually moved 3 registrations to lost, so there are seats free on Thursday right now.\n\n\n\n\n\n\n\n\nThe rest you can work through here as they come up, until the automation catches them:\nhttps://uk.zooza.app/#registrations?status=trial_started&order_by=created_desc&page=0&page_size=20&person_id=0&payment_id=0&segment_id=0&schedule_id=407\n\n\n\nOn the reminder chain, I'd push back on this, honestly.\n\n\n\n\n\nWhat you've described is five messages before a single free session. In our experience that tips over from helpful into bombardment, and the usual result is people muting you or unsubscribing, which costs you the ability to reach them later, when it actually matters.\n\n\n\n\n\nZooza already sends a booking confirmation immediately and a reminder the day before. That's the sensible core.\n\n\n\n\n\nMore importantly: your 40–45% attendance rate is quite normal for free trials. That's what free does, it costs nothing to book and nothing to skip, so people book on impulse and forget. More reminders won't change that psychology much. Three things will move it far more:\n\n\n\n\n\n1. Connect WhatsApp to Zooza. A WhatsApp reminder gets read; a fourth email doesn't. Same number of touches, far better reach. You've already got the setup link.\n\n\n2. A single weekly message. At the start of each week, one note to that week's trialists ,, who's booked, when, where. One message doing the work of three.\n\n\n3. Charge for the trial. Even £5 changes the behaviour entirely. People who've paid turn up. This is by far the biggest lever available to you, and it also filters out the browsers who were never going to join.\n\n\n\n\n\nIf after all that you still want the full sequence, it is possible , you'd connect your own Claude to your email , or mailchimp, or sms provider and Zooza and have it run the timed messages as scheduled jobs. Effectively your own assistant handling the chain. Happy to point you in that direction if you want to go down that route.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Thank you for your feedback. I think that makes sense.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Just can't seem. to connect Whatsapp", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi - the error you're seeing comes from Meta, not from Zooza. It means the WhatsApp Business Account that +44 7917 137503 sits under is already shared with a WhatsApp partner (a \"BSP\"). Meta doesn't let a number switch partners inside this flow, so you'll need to remove the existing partner first.\n\n\nTo check who it is:\n\n\n1. Go to business.facebook.com → Business settings → Accounts → WhatsApp accounts\n\n\n2. Select the WhatsApp account containing this number\n\n\n3. Open the Partners (or Partner access) tab — any partner with access will be listed there\n\n\n4. Remove that partner\n\n\n\n\n\nIt's often a provider you used in the past (e.g. Twilio, 360dialog, Wati, an agency setup) — access stays in place even after you stop using the tool. If the number is currently live in the WhatsApp Business app on a phone, disconnecting it there first also clears the link.\n\n\n\n\n\nOnce no partner is listed, come back to the Zooza connection screen and run the setup again.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Okay cool. Its connected to lead connector app", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "So you probably won't be able to use that number in both scenarios. You'd probably need a new number :/", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Not sure about this.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "please let me know. Ill resend him the booking link.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Louis, do you know which booking id this is? We'll look into it asap", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Barnet PDC younger group.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Yes, but can you please open that customer's booking and look up in the breadcrumbs for the number that booking has? that way we can look it up in our logs. Many thanks Louis", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "https://www.loudballers.com/booking?course_id=229&schedule_id=407", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "is this the sign up link", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Yes but I'd need that specific customer's booking. Or there is only one customer there?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Also - from your screenshot it looks like the message he sent you was sent on 20th of september. Is that correct?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "yes", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "i believe so.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ok I think I have him. it is the email: Gazi123@live.com ?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "yes i think thats him", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ok, here's the situation - He clicked on the book now link - probably from his phone. The discount field was actually populated by a fragment from our email, probably when he hit the Autofill button on one of the form inputs. So he actually submitted invalid discount coupon. The problem appears to be with recent update of the iOs that Apple rolled out past week", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "We are working on a fix from our end to prevent autofill on discount coupon", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "okay great.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "And second related issue is that you should first apply the discount coupon and only then submit it along with the booking so that is another tweak we're rolling", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "It should be ready within 20-30 minutes", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "I'll keep you posted", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Okay perfect.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "one thing i wanted to check as im getting asked a bit.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "parents that signed up for different programmes have been charged on the 1st but again on the 21st is that correct? is that for october?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "You should see that in the app. When you open that customers' booking you should see the charge in the transactions list along with the information on which installment it was. It is possible that they get charged multiple times per month if the first payment was prorated and you did not set up the system in a way which would merge first prorated payment with second full payment. However with the Direct debit the situation is usually the opposite - it takes 3-5 business days to collect the money so its worthed to look at one customer to see if everything is correct", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "BTW we're working on streamlining the pay as you go classes and the update should roll out today. It will make it much easier to book sessions and should turn the unengaged customers into engaged ones. It is mostly in the customer zone area but one example that will get changed is the upcoming sessions reminder. Here's the preview of the new email: https://claude.ai/artifact/YZzgnw7i9XqyMtGZy4ppo9", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "So for example Jack White.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Has he signed up twice to team membership?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Yes that payment is for October. If you see the payment plan details that matches what I mentioned about the nature of the direct debit. If it was a card payment he would've been charged at 16th of september. But because direct debit takes quite some time to process it was actually at 21st", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Next payment for november would be the same - processed on 17th october - charged around 20-21st", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Okay that makes sense.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ok, we're rolling the fix to production now. Please let the customer know to try one more time. If for any reason the enrollment fail again, please ask him to send over the screenshots and check whether the discount code field was actually filled or empty. But hopefuly it should be fixed", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "okay will do.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Is it possible to create a 15% discount code for parents with 2 children", "cited": []}], "verdict": "gap", "vtitle": "No report of 'who attended last week and has not booked this week'", "vnote": "Confirmed: no such report. Workaround from the human: bulk email everyone with an active booking and ask them to book in the client portal. Worth an FAQ entry -- it is a question that will recur with pay-as-you-go.", "cat": "reports"}, {"channel": "intercom", "id": "215476150241970", "date": "2026-09-29 08:31", "day": "2026-09-29", "human": false, "bucket": "D_assumed_with_kb", "reask": 4, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Edit automatic notifications of an upcoming session | Zooza Help", "Message Templates | Zooza Help", "Automated notifications overview | Zooza Help", "Message templates — automatic and manual emails | Zooza Help", "Automatic notification of an upcoming session | Zooza Help"], "q": "Ahoj, prosím ťa viem vytvoriť novú šablónu ,,Notifikácia o termíne\" ?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Ahoj, prosím ťa viem vytvoriť novú šablónu ,,Notifikácia o termíne\" ?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ano, môžete. \n\n\nPostup:\n\n\n\n\n- Pôjdite do Communication → Templates\n\n\n- Zostúpte do sekcie Notifications\n\n\n- Pri Automatic session reminder kliknite na Add new template\n\n\n- Zadajte názov a napíšte predmet a text emailu\n\n- Uložte\n\nTento šablónu potom môžete priradiť aj konkrétnemu programu.", "cited": ["Automatic notification of an upcoming session | Zooza Help", "Edit automatic notifications of an upcoming session | Zooza Help", "Message templates — automatic and manual emails | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak potrebujete s vytvorením šablóny „Notifikácia o termíne“ ešte pomôcť, som vám k dispozícii. Chcete doplniť, čo presne potrebujete nastaviť alebo objasniť?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "keď vytvorím novú šablónu, je tam napísaný text že ,,je pre manuálne odosielanie e-mailov\". To znamená, že neviem pri novo vytvorenej šablóne aktivovať automatické odosielanie?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno, presne tak. \n\n\nKeď vytvoríte novú šablónu cez “Add new template”, stane sa z nej užívateľská šablóna (User template). Tieto sa používajú na manuálne odosielanie e‑mailov z rezervácie alebo triedy. \n\n\nAutomatické emaily (ako napr. Automatic session reminder) používajú systemové šablóny. Túto šablónu môžete:\n\n\n\n\n- skopírovať cez Add variant alebo Duplicate\n\n\n- upraviť text\n\n- a potom priradiť k programu\n\nTakže:\n\n\n\n\n- Novú šablónu od nuly → manuálne odosielanie\n\n- \nVariantu systémovej šablóny → automatické odosielanie", "cited": ["Message templates — automatic and manual emails | Zooza Help", "Automated notifications overview | Zooza Help", "Message Templates | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "a v automatickej šablóne zmením text, resp. vytvorím kópiu. Stará šablóna sa ponechá a bude odosielaná?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno. Stará systémová šablónka zostáva zachovaná. \n\n\nKeď vytvoríte variantu (kópiu) systémovej šablóny, systém stále používa pôvodnú šablónu. Vaša kópia sa začne používať až vtedy, keď ju priradíte na úrovni programu (napr. v nastaveniach programu). \n\n\nTakže:\n\n\n\n\n- pôvodná šablónka → zostáva a môže sa používať\n\n- vaša kópia → používa sa až keď ju vyberiete v programe", "cited": ["Message templates — automatic and manual emails | Zooza Help", "Message Templates | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Je to pre vás teraz jasné?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "a kde nájdem vytvorenú kópiu?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Nájdete ju na rovnakom mieste ako ostatné šablóny.\n\n\n\n\n- Pôjdite do Communication → Templates\n\n\n- V zozname šablón nájdete aj vašu kópiu (variantu)\n\n- Kliknite na názov šablóny a môžete ju otvoriť a upraviť\n\n\nKópie sa v zozname zobrazujú ako samostatné šablóny a môžu mať vlastný názov, ktorý ste zadali pri vytváraní varianty.", "cited": ["Message templates — automatic and manual emails | Zooza Help", "Message Templates | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Bolo to pre vás užitočné?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak budete potrebovať ďalšiu pomoc s nájdením alebo úpravou kópie šablóny, som vám k dispozícii. Chcete doplniť, čo sa vám pri hľadaní šablóny nedarí?", "cited": []}], "verdict": "gap", "vtitle": "Can a second 'Session notification' template be created", "vnote": "Asked four times. Whether templates of that type can be duplicated or only edited is a straightforward product fact that the KB should state.", "cat": "comms"}, {"channel": "intercom", "id": "215476082213906", "date": "2026-09-29 08:24", "day": "2026-09-29", "human": true, "bucket": "HUMAN", "reask": 8, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": ["Authentication | Zooza Developer Docs", "Deploying Zooza app on your website | Zooza Help", "Quickstart | Zooza Developer Docs", "Getting Help and Support | Zooza Help"], "q": "@Martin Rapavy - can you please send me a new API Key, I made the mistake to forward it via Whatsapp and the dev team now says we shouldn't use it. Thanks!", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Wie kann ich helfen?", "cited": []}, {"role": "customer", "who": "API Connect", "text": "@Martin Rapavy - can you please send me a new API Key, I made the mistake to forward it via Whatsapp and the dev team now says we shouldn't use it. Thanks!", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "A new REST API key cannot be generated from inside the app. It must be requested from our support team. \n\n\nPlease send a short request to:\n\n\nsupport@zooza.online\n\n\nInclude that the previous key was shared via WhatsApp and needs to be replaced. The team can then issue a new REST API key and client secret for your integration.", "cited": ["Authentication | Zooza Developer Docs", "Deploying Zooza app on your website | Zooza Help", "Quickstart | Zooza Developer Docs", "Getting Help and Support | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "API Connect", "text": "Please forward the message to Martin Rapavy. Thx.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I’m not able to forward messages to specific people.\n\n\nTo request a new REST API key, please email support@zooza.online and explain that the previous key was shared via WhatsApp and needs to be replaced. The team can then issue a new REST API key and client secret. \n\n\nYou can also create a support ticket from the Help & Support screen in the app if you prefer.", "cited": ["Authentication | Zooza Developer Docs", "Getting Help and Support | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "API Connect", "text": "No, connect to the team here, please.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I will connect you with someone from our team shortly. Meanwhile, could you please provide any additional details about your request to help them assist you more efficiently?", "cited": []}, {"role": "customer", "who": "API Connect", "text": "I'm referring to a previous exchange here with Martin, he knows what this is about.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi, no worries, the API key is public information. Only client secret is a private part so unless you compromised that, you're good. All api calls need user token which you obtain only with the combination of API key and Client secret.", "cited": []}, {"role": "customer", "who": "API Connect", "text": "Thanks, Martin. I just checked, I sent both 🙈, please send me a new Client secret ... 😇", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ok, here is the rotated secret: Tv96WsT25prhVgD79AmD76QbIZkMFfdx", "cited": []}, {"role": "customer", "who": "API Connect", "text": "ok, thanks, I'll keep it secret, this time 🙈🤦‍♂️😇", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "We should put this in the app anyways so you can manage that yourself. One day when we have nothing else to do... :)\nHave a great rest of the day. Should you have any questions on the endpoints, feel free to reach out.", "cited": []}, {"role": "customer", "who": "API Connect", "text": "Thanks, Martin - I'll have a meeting with them and we will see if there are any open items that pop up. Appreciate your support! Best wishes from Austria,\n\n\n\n\n\nMartin", "cited": []}, {"role": "customer", "who": "API Connect", "text": "Hi Martin, here is a message from the AI agent that we tried to use for setting up the 8n8 connection to Zooza API: \n\n\nwe are trying to connect Zooza to our administration system via the REST API (n8n, server-to-server) and are following the documentation \"Authentication → Via client secret\".\n\n\nRequest: POST https://api.zooza.app/v1/login\n\n\nHeaders: Content-Type: application/json, Accept: application/json, X-ZOOZA-API-KEY: \u003cour key>, X-ZOOZA-COMPANY: 548\n\n\nBody: {\"login\": \"…\", \"verification_method\": \"client_secret\", \"client_secret\": \"\u003cthe secret you sent us>\"}\n\n\nWe tested with zooza-api-linz@helendoron.at. The response was as in the screenshot attached + a token.\n\n\nCould you please check:\n\n\n\n\n- For which user email address was the client secret issued, and is it active?\n\n- Do our API key and the client secret belong together?\n\n- Is the user zooza-api-linz@helendoron.at fully set up, and does it have a role in company 548? According to /v1/user it shows user_valid: false.\n\n- How long is a token from /v1/login valid?\n\nThank you!\n\n\nBest wishes from Austria, Martin", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Martin. The client secret is not issued against an email but rather that api key we sent you so yes API key and client secret do belong together. The token generated by login is persistent and its expiry is one year although it can be revoked at any time thus you need to have a method for retrieving new token once the old one has been invalidated.\n\n\nThis request with your api key and client secret:\ncurl --location 'https://api.zooza.app/v1/login' \\\n\n\n--header 'Content-Type: application/json' \\\n\n\n--header 'Accept: application/json' \\\n\n\n--header 'X-ZOOZA-API-KEY: \u003cAPI_KEY>' \\\n\n\n--data-raw '{\n\n\n\"login\": \"zooza-api-linz@helendoron.at\",\n\n\n\"verification_method\": \"client_secret\",\n\n\n\"client_secret\": \"\u003cCLIENT_SECRET>\"\n\n\n}'\n\n\n\n\n\nproduced a valid response:\n\n\n{\n\n\n\"login_email_sent\": false,\n\n\n\"message\": \"email_not_sent\",\n\n\n\"token\": \"\u003cTOKEN>\"\n\n\n}\n\n\n\n\n\nFor the login operation you dont have to attach company id although it is harmless if you do so. Please double check you did call the api with correct credentials.", "cited": []}], "verdict": "gap", "vtitle": "The API key is public; only the client secret is private", "vnote": "Martin: the API key is public information, the client secret is the private half, and every API call needs a user token obtained from the combination of the two. Someone forwarded a key over WhatsApp and their dev team panicked. Worth stating plainly -- pairs with 215476136244794 (Company ID for API use).", "cat": "ai"}, {"channel": "intercom", "id": "215476150276606", "date": "2026-09-29 08:21", "day": "2026-09-29", "human": false, "bucket": "D_assumed_with_kb", "reask": 1, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Roles and Permissions FAQ | Zooza Help", "Role Selection Guide | Zooza Help", "User roles | Zooza Help"], "q": "Funkcie lektorov čo obsahuju", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Dušan Frimer", "text": "Funkcie lektorov čo obsahuju", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Funkcie lektorov v Zooza závisia od ich role. Hlavné sú:\n\n\n\n\n- \nMain instructor (hlavný lektor)\n• môže pozerať a editovať všetky skupiny a termíny\n• spravovať dochádzku\n• komunikovať so svojimi klientmi\n• nahrávať dokumenty\n• nemá prístup k programom, nastaveniam programu ani sekcii Settings\n\n\n- \nInstructor (lektor)\n• vidí a spravuje iba svoje skupiny a klientov\n• nemá prístup k administrativným sekciám ani reportom\n\n\n- \nExternal instructor (externý lektor)\n• nemá kontaktné údaje klientov\n• nemôže spravovať rezervácie ani platby\n\nZhrnutie: lektorovské role sú hlavne na správu skupín, termínov, dochádzky a komunikácie so svojimi klientmi.", "cited": ["Role Selection Guide | Zooza Help", "Roles and Permissions FAQ | Zooza Help", "User roles | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak potrebujete ďalšiu pomoc s funkciami lektorov, som tu pre vás. Chcete doplniť, ktorú konkrétnu rolu alebo oprávnenie potrebujete bližšie objasniť?", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215476150024210", "date": "2026-09-29 07:56", "day": "2026-09-29", "human": false, "bucket": "D_assumed_with_kb", "reask": 3, "resolution": "confirmed_resolution", "rating": null, "carried": null, "sources": ["Registration and Booking FAQ | Zooza Help", "Recover deleted items: registrations, classes, sessions, and payments | Zooza Help", "Where to find things in Zooza — quick reference | Zooza Help"], "q": "omylom som vymazala regostraciu klienta, ktory sa zaregistroval viackrat, viem sa k nej este vratit? Vymazalo mi to vsetky jeho registracie", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": "Nikol Bedecsová", "text": "omylom som vymazala regostraciu klienta, ktory sa zaregistroval viackrat, viem sa k nej este vratit? Vymazalo mi to vsetky jeho registracie", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Nikol, áno — dá sa to vrátiť.\n\n\nVymazané registrácie sa okamžite nezničia. Systém ich uchováva v Trash po dobu 30 dní a môže ich odtiaľ obnovovať. \n\n\nPostup:\n\n\n\n\n- Pôjdite do Settings → Tools → Trash\n\n\n- Filtrujte podľa Type → Registration\n\n\n- Nájdite registráciu klienta a kliknite na Restore \n\n\nPo obnovení sa registrácia vráti na svoje miesto v zozname.\n\n\nDôležité: obnoviť ju môžete iba do 30 dní od vymazania.", "cited": ["Recover deleted items: registrations, classes, sessions, and payments | Zooza Help", "Registration and Booking FAQ | Zooza Help", "Where to find things in Zooza — quick reference | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Hledali jste tohle?", "cited": []}, {"role": "customer", "who": "Nikol Bedecsová", "text": "dakujem, ano", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rád som vám mohol pomôcť! Ak budete potrebovať ďalšiu pomoc, neváhajte sa ozvať. Som tu pre vás! 😊", "cited": []}, {"role": "customer", "who": "Nikol Bedecsová", "text": "dakujem", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rád som vám mohol pomôcť! Ak budete mať ešte nejaké otázky alebo budete potrebovať ďalšiu pomoc, neváhajte sa ozvať. Som tu pre vás! 😊", "cited": []}], "verdict": "check", "vtitle": "Deleted a registration by mistake and it removed all of that client's registrations", "vnote": "Asked three times. We have reference/recover-deleted-items. Three conversations this week asked a recovery question (also 215476150471639 and 215476170685615) and the bot cited the right article at least twice -- so the article exists and is not landing. Worth reading it as a client would.", "cat": "bookings"}, {"channel": "intercom", "id": "215476103977525", "date": "2026-09-29 07:30", "day": "2026-09-29", "human": true, "bucket": "HUMAN", "reask": 3, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Client Management FAQ | Zooza Help", "Contact form (lead capture): turn website enquiries into contacts | Zooza Help", "Contact form and contacts FAQ | Zooza Help", "Work with contacts and enquiries | Zooza Help"], "q": "Dobrý den, jak prosím z účastníka vytvořím klienta?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": "Lada Šulcová", "text": "Dobrý den, jak prosím z účastníka vytvořím klienta?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Účastník (contact) se v Zooze nepřevádí na klienta ručně. Máte dvě možnosti:\n\n\n\n\n- \nPřevést na klienta:\nOtevřete kontakt a klikněte na Convert to client.\nSystém vytvoří klienta z jeho jména, emailu a telefonu a kontakt označí jako Converted. \n\n\n- \nNebo:\nKdyž tento člověk provede rezervaci, kontakt se automaticky označí jako Converted a stane se klientem. \n\n\nPoté ho můžete normálně rezervovat do kurzů.", "cited": ["Work with contacts and enquiries | Zooza Help", "Client Management FAQ | Zooza Help", "Contact form (lead capture): turn website enquiries into contacts | Zooza Help", "Contact form and contacts FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Hledali jste tohle?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Pokud potřebujete s převodem účastníka na klienta ještě pomoci, ráda vám poradím. Chcete upřesnit, u kterého kroku potřebujete podporu?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Lado, navod, ktory Vam AIcko poskytlo sa tyka kontaktnych formularov a nie beznych ucastnikov. V principe neviete skonvertovat ucastnika na klienta. Najjednoduchsi sposob je vytvorit manualne registraciu s emailom danej osoby.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Kazdopadne, asi by sme nieco take do systemu mali dopracovat, tak ak Vam to pocka do pondelka, vydrzte:)", "cited": []}, {"role": "customer", "who": "Lada Šulcová", "text": "Dobrý den Martine, moc Vám děkuji za nabídku pomoci. Ozvala se nám slečna, že po nabytí zletilosti chce existující objednávku převést na sebe. Jedná se o registraci číslo 535941. Určitě to počká do příštího týdne. Přeji Vám hezký víkend:)", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Podobne, urcite sa to objavi v changelogu ale aj sa ozvem, ked to bude hotove:) Pekny vikend aj Vam", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, Lado, dakujeme za inspiraciu a je to bolo to vyvinute. Nech sa paci, mozete zrealizovat na danej osobe v systeme v detaile klienta. Dakujeme", "cited": []}, {"role": "customer", "who": "Lada Šulcová", "text": "Dobrý den, moc Vám děkuji za rychlé vyřízení!", "cited": []}], "verdict": "verify", "vtitle": "Can an attendee be turned into a client?", "vnote": "Human answer on 29 September: in principle you cannot convert an attendee into a client, the simplest route is to create a registration manually with that person's email. But API-20260927-001 and APP-20260927-001 -- 'Attendee to buyer conversion' -- are marked implemented on 27 September: an owner can give an attendee an identity and move the account-holder role across their registrations, from the attendee card on a registration or the person card on client detail. I need to know whether that is live in production before writing either version.", "cat": "clients"}, {"channel": "intercom", "id": "215476135979396", "date": "2026-09-29 07:30", "day": "2026-09-29", "human": true, "bucket": "HUMAN", "reask": 16, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Getting Started with Zooza | Zooza Help", "Create a programme | Zooza Help", "Programme settings tile | Zooza Help", "Programme Settings | Zooza Help", "Payment templates creation | Zooza Help", "Price and payment setup | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Outstanding amount — why it does not follow price changes | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Billable sessions | Zooza Help", "FAQ — Programmes | Zooza Help", "Archive or delete a Programme | Zooza Help"], "q": "how to add payment plan in new programme", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Jochelle Laguipo-Strzalkowska", "text": "how to add payment plan in new programme", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You add a payment plan to a new programme in two steps:\n\n\n\n\n- \nCreate the payment template\n• Go to Settings → Billing & Payments → Payment schedule templates\n• Create a template (for example monthly instalments).\n\n\n- \nActivate it in the programme\n• Go to Programmes → select the programme → Edit Settings → Price and Payment\n• Set Payment collection to Scheduled payments\n• Enable the template you created.\n\n\nClients will then choose the instalment plan when booking.", "cited": ["Payments and Billing FAQ | Zooza Help", "Create a programme | Zooza Help", "Price and payment setup | Zooza Help", "Payment templates creation | Zooza Help", "Getting Started with Zooza | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Jochelle Laguipo-Strzalkowska", "text": "how apply payment plan to a new programme", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "To apply a payment plan to a new programme:\n\n\n\n\n- Go to Programmes → select the programme → Edit Settings → Price and Payment. \n\n\n- Set Payment collection to Scheduled payments. \n\n\n- In the same section, enable the payment template(s) you want clients to use. \n\n\nClients will then choose the instalment plan when booking.", "cited": ["Payment templates creation | Zooza Help", "Price and payment setup | Zooza Help", "Create a programme | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Jochelle Laguipo-Strzalkowska", "text": "there is no payment colletion aeea", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "This usually happens when the programme is set to One‑off payment.\n\n\nWhen a programme is set to One‑off, the Payment frequency section disappears completely, so you will not see any payment plan options. \n\n\nTo use instalments:\n\n\n\n\n- Go to Programmes → select the programme → Edit Settings → Price and Payment\n\n\n- Change Payment collection to Scheduled payments\n\n\n- Then you can enable the payment templates you want clients to choose from.\n\nAlso make sure the programme type is Fixed Period or Membership, because instalment plans cannot be used with Open courses or one‑time events. \n\n\nIf you want, you can tell me what programme type you selected and I can guide you from there.", "cited": ["Price and payment setup | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Create a programme | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "Jochelle Laguipo-Strzalkowska", "text": "how to change one off payment", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can change it in the programme settings.\n\n\n\n\n- Go to Programmes → select the programme → Edit Settings → Price and Payment.\n\n- Find How do you want to collect payments?\n\n\n- Change it from One off payment to Scheduled payments.\n\n- Save. \n\n\nOnce it is set to Scheduled payments, the Payment Frequency section appears and you can activate your payment templates.", "cited": ["Price and payment setup | Zooza Help", "Programme Settings | Zooza Help", "Create a programme | Zooza Help"]}, {"role": "customer", "who": "Jochelle Laguipo-Strzalkowska", "text": "how to change programme type", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can change the programme type in the programme settings.\n\n\n\n\n- Go to Programmes → open the programme → Edit Settings\n\n\n- Find the Programme Type section\n\n- Select the new type and save. \n\n\nYes, the type can be changed after creation, but it may affect existing classes and bookings, so sometimes creating a new programme is safer if you are unsure. \n\n\nFor instalment plans, the programme type must be Fixed Period or Membership.", "cited": ["Programmes, Timetables and Sessions FAQ | Zooza Help", "Programme settings tile | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Jochelle Laguipo-Strzalkowska", "text": "how to delete programme", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can delete a programme from its settings.\n\n\n\n\n- Go to Programmes and open the programme.\n\n- Go to Programme → Settings → Programme settings → Edit.\n\n- Click Delete programme (next to the Save button).\n\n- Confirm the deletion. \n\n\nDeletion is a soft delete. The programme and its data move to Settings → Tools → Trash and can be restored within 30 days. After that, it is permanently removed. \n\n\nTip: if you only want to hide it but keep bookings and history, use Archive instead.", "cited": ["Archive or delete a Programme | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "FAQ — Programmes | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help with changing or deleting a programme, I’m here to assist. Would you like to share more about what you’re trying to resolve?", "cited": []}, {"role": "customer", "who": "Jochelle Laguipo-Strzalkowska", "text": "price showing 0 in website", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "This usually means no price is set on the thing the client is buying. \n\n\nPlease check two places:\n\n\n\n\n- \nProgrammes → open the programme → Settings → Price and payment\nMake sure a price or unit price is entered.\n\n- \nOpen the class the website link points to\nThe class can also have its own price. If the class price is empty, the website may show 0,00.\n\nImportant: if the class has no sessions yet, the registration form will show no price at all until sessions are added.\n\n\nAre you viewing the programme page or a specific class page on the website?", "cited": ["Price and payment setup | Zooza Help", "FAQ — Programmes | Zooza Help"]}, {"role": "customer", "who": "Jochelle Laguipo-Strzalkowska", "text": "class", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If the class page on the website shows 0,00, it usually means the class itself has no price set. \n\n\nPlease check this:\n\n\n\n\n- Go to Programmes → open the programme → Classes\n\n\n- Open the specific Class\n\n\n- Check the price field on the class and enter a value\n\n- Save\n\nIf the class price is empty, the website will show 0,00 even if the programme has a price. \n\n\nIf you want, you can also tell me: does the class currently have any sessions added?", "cited": ["Price and payment setup | Zooza Help", "FAQ — Programmes | Zooza Help"]}, {"role": "customer", "who": "Jochelle Laguipo-Strzalkowska", "text": "still showing zero", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If the class page still shows 0,00, the most common cause is the billable sessions setting. \n\n\nPlease check this:\n\n\n\n\n- Go to Programmes → open the programme → Classes → open the Class\n\n\n- Look for the billable sessions counter\n\n- If it shows a number (for example 13), make sure the same number of sessions are marked as billable in the sessions list\n\nIf the count is set but no sessions are marked billable, the system cannot calculate the price and the result is 0.\n\n\nYou can fix it by:\n\n\n\n\n- marking the sessions as billable, or\n\n- resetting the billable sessions counter to 0 so all sessions are included in the price. \n\n\nIf you want, you can also tell me: does the class have a billable sessions number set?", "cited": ["Price and payment setup | Zooza Help", "Outstanding amount — why it does not follow price changes | Zooza Help", "Billable sessions | Zooza Help"]}, {"role": "customer", "who": "Jochelle Laguipo-Strzalkowska", "text": "hoq to mark sessions as bullable", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can mark sessions as billable from the class sessions list.\n\n\n\n\n- Go to Classes → open the class\n\n- Open the sessions list\n\n\n- Tick the sessions that should be paid\n\n- Use the bulk action toolbar to mark them as billable\n\nEach billable session will show a money symbol. The number of marked sessions must match the Billable sessions number on the class, otherwise the price will show 0.", "cited": ["Billable sessions | Zooza Help", "Outstanding amount — why it does not follow price changes | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help marking sessions as billable or resolving the zero price, I’m here to assist. Would you like to share what you see in the class’s sessions list?", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Jochelle,\n\n\nI can see your chat with our AI assistant from yesterday. If the class is still showing a price of 0, just send me the link to the class or its name and we'll take a look and help you sort it out.\n\n\n\n\n\nIt's most likely down to one of these: the price set on the class, the sessions (the class needs at least one), or the billable sessions setting.\n\n\nBest,\nMichal", "cited": []}, {"role": "customer", "who": "Jochelle Laguipo-Strzalkowska", "text": "Hi Michal,\n\n\nThank you 😭😭😭i literally gave up yesterday cause my head was spinning. I was going to sit down to figure it out today. It’s the halloween camp one for both classes 🥲🥲\n​\n\n\nAll the best,\n\n\nJochelle\nSent from Outlook for iOS", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Jochelle,\n\n\nNo worries at all :) Happy to help, and I can set it up for you.\n\n\nJust let me know how you'd like it to work for the Halloween camp:\n\n\n\n\n- \nPrice: How much should the camp cost? Is it the same for both classes?\n\n- \nPayment: Should parents pay the full amount upfront when booking, or in instalments (e.g. a deposit now and the rest later)?\n\n- \nBooking: Do parents book the whole camp, or can they pick individual days?\n\nOnce I know that, I'll set it up so the right price shows on the website.\n\n\nBest,\nMichal", "cited": []}, {"role": "customer", "who": "Jochelle Laguipo-Strzalkowska", "text": "Hi Michal,\n\n\nYou're amazing thank youuuuu\n​\n\n\n1-day is 50; 2-day is 85\n\n\  another moment. I will set it up for you. \n\n\nBest,\nMichal", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Jochelle,\n\n\nI've set it up a bit differently, so parents can choose their day. I used a feature you may not have come across yet: blocks (segments). Each camp day is its own block, and parents simply tick the day or days they want. The price updates automatically: €50 for one day, €85 for both.\n\n\nSo now there's just one link for the whole camp:\nhttps://corkcity.youngengineers.ie/registration/?share=b9d507dff1960fa95f8ec892267a17acfa31f2bd73cea7fa0745ec25dfd4639e\n\n\nHave a look and try it out as a parent would. If anything looks off, just let me know. I'm also happy to walk you through how blocks work, so you can use them for your next camps.\n\n\nBest,\nMichal", "cited": []}, {"role": "customer", "who": "Jochelle Laguipo-Strzalkowska", "text": "Waaah that’s amazing!!! I would have never figured that out 🥲 thank you so much for your help. You have no idea how much you made my day!! I just had a baby 3 months ago so my brain is only at 20% most days hahaha \n​\n\n\nI will play around with it using the ai assistant first and if I'm super stuck i'll reach out to you\n​\n\n\nThank you very much!! Have a great day \n​\n\n\nAll the best,\n\n\nJochelle\nSent from Outlook for iOS", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Jochelle,\n\n\nCongratulations on your baby! Wishing you all lots of health, and enjoy these early days. 20% is more than enough, you're doing great! :-D\n\n\nOf course, feel free to reach out anytime. We keep an eye on things, and I'm happy to help whenever you need.\n\n\nAnd yes, blocks are a bit more advanced, but a camp where parents choose their days is exactly the kind of case they're made for.\n\n\nHave a lovely day!\n\n\nBest,\nMichal", "cited": []}, {"role": "customer", "who": "Jochelle Laguipo-Strzalkowska", "text": "Young Engineers Cork reacted to your message:", "cited": []}], "verdict": "gap", "vtitle": "Class shows a price of 0 -- the three things to check", "vnote": "Human answer names the checklist: the price set on the class, the sessions (the class needs at least one), and the billable sessions setting. That triplet is the generalisable part and it answers a repeating question. Same symptom as 215476088296377.", "cat": "pricing"}, {"channel": "intercom", "id": "215476149481015", "date": "2026-09-29 07:25", "day": "2026-09-29", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Getting Started with Zooza | Zooza Help", "Email and Communication FAQ | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Automated notifications overview | Zooza Help"], "q": "ako zruším automatické správy pre klienta?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": "Lenka Holiš", "text": "ako zruším automatické správy pre klienta?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Automatické správy (upomienky a oznámenia) sa zastavia, keď zrušíte rezerváciu klienta. \n\n\nPostup:\n\n\n\n\n- Pôjdite do Bookings\n\n\n- Otvorte detail klientovej rezervácie\n\n- Zmeňte stav na Cancelled\n\n\nTým sa uvoľní miesto a systém prestane posielať automatické upomienky a oznámenia pre túto rezerváciu.", "cited": ["Payments and Billing FAQ | Zooza Help", "Getting Started with Zooza | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Hledali jste tohle?", "cited": []}, {"role": "customer", "who": "Lenka Holiš", "text": "nie, nechcem mu zrušiť registráciu, len nechcem aby mu chodili upomienky na tréning", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Môžete vypnúť upomienky iba pre túto jednu registráciu.\n\n\nPostup:\n\n\n\n\n- Otvorte booking/registration detail klienta\n\n- Prejdite na záložku Options\n\n\n- Vypnite prepínač Reminder\n\n\nTým sa zastavia upom \nĎakujem pekne \n\nS pozdravom \n\nMichal Kiss", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Vážený Michal,\n\n\nváš tiket byl přijat. Asistent Zooza se vám pokusí ihned pomoci — a člen našeho týmu jej také osobně zkontroluje.\n\n\n— Podpora Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Michal, preverime to. Ale ak si dobre spominam, v tom nastaveni sablony by ste nemali mat nic. nie {N}, to kludne odmazte. Ten riadok vyplnate iba ked nechcete mat standardne jednoduche cislo faktury", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "ked som vosiel do profilu klienta a dal fakturu pregenerovat, vtedy sa to zenilo na čislo 2 . Pregeneroval som ju nakoľko som menil popis vo faktúre a zmenilo sa aj cislo. Tu šablonu som vymazal a po ulozeni tam automaticky vlozi {N} , akoby to bolo prednastavene a nemenne.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Nechať preferiť Filipovi Filip Vnenčák", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, pan Kiss,\n\n\n\n\n\nNa vašom fakturačnom profile sme odstránili šablónu {N}. Faktúry sa odteraz číslujú štandardne a ďalšia nová faktúra dostane číslo 4 (čísla 1–3 sú z marca).\n\n\n\nVaše dve septembrové faktúry majú teraz rôzne čísla (0001 a 0002). Pri ďalšom pregenerovaní, napr. po úprave popisu, si už svoje číslo ponechajú.\n\n\n\n\n\nDakujeme za trpezlivost.", "cited": []}], "verdict": "gap", "vtitle": "Invoice number series template should normally be empty", "vnote": "Client got a duplicate invoice number and cannot edit the number afterwards. Human answer: the series template field should be empty, {N} can be deleted; you only fill that line when you do not want the standard simple invoice number. This lines up exactly with API-20260928-001, which shipped on 28 September and fixes the fact that clearing the field did not persist, that regenerating an issued invoice changed its number, and that saving the settings form rewound the counter.", "cat": "payments"}, {"channel": "intercom", "id": "215476123663594", "date": "2026-09-29 07:16", "day": "2026-09-29", "human": true, "bucket": "HUMAN", "reask": 3, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Nastavenie platobnej šablóny - úprava\n\nDobrý deň, potrebovala by som prosím pomoct s nastavenim platobnych sablon - my sme kedysi nastavovali mesacne platobne sablony, ale teraz by som to potrebovala upravit trosku inak.\nmame kurzy aktualne ktore trvaju 8 mesiacov - oktober-máj, max do prvého týždňa v júni, ale počítame to celé ako 8 mesačných platieb\n\nkurz stoji pri ročnej platbe napr 300eur, alebo 344 po 8x 43eur mesačne, \nalebo 150eur pri ročnej platbe a 200 pri 8x25eur mesačne, \nmáme ešte 280eur pri ročnej platbe alebo 312 eur pri 8x39eur mesacne\n\nteda by som tu nasu mesacnu platobnu sablonu potrebovala upravit na cele ciastky a iba 8 mesiacov\n\nked som sa to snazila nastavit na konkretnu registraciu napr - 533612 - https://zooza.app/#registrations/533612, tak mi tu platbu za kurz rozpočíta na 9 splatok - obrazok v prilohe a mesacne splatky su s centami. \n\nviete mi prosim poradit ako si to spravne upravit aby som pripadne mohla nastavit vlastnu sumu a pocet mesiacov ? este ma napadlo to riesit cez to clenske ale tiez som sa v tom stratila a nechcem to nastavit zle \n\nje lepsie nastavit 3 rozne sablony podla tych nasich platieb vyssie alebo to vie spracovat aj jedna genericka platobna sablona ?\neste poznámka: chcem to nastavit na konkretny kurz a skupinu, ale sablonu bude vyuzivat iba niekolko konkretnych registracii - to sa da nastavit ze sablona bude aktivna na urovni kurzu ale pre kazdu registraciu si ju pridam zvlast ?\n\nDakujem za pomoc a trpezlivost, \nB", "turns": [{"role": "customer", "who": null, "text": "Nastavenie platobnej šablóny - úprava\n\nDobrý deň, potrebovala by som prosím pomoct s nastavenim platobnych sablon - my sme kedysi nastavovali mesacne platobne sablony, ale teraz by som to potrebovala upravit trosku inak.\nmame kurzy aktualne ktore trvaju 8 mesiacov - oktober-máj, max do prvého týždňa v júni, ale počítame to celé ako 8 mesačných platieb\n\nkurz stoji pri ročnej platbe napr 300eur, alebo 344 po 8x 43eur mesačne, \nalebo 150eur pri ročnej platbe a 200 pri 8x25eur mesačne, \nmáme ešte 280eur pri ročnej platbe alebo 312 eur pri 8x39eur mesacne\n\nteda by som tu nasu mesacnu platobnu sablonu potrebovala upravit na cele ciastky a iba 8 mesiacov\n\nked som sa to snazila nastavit na konkretnu registraciu napr - 533612 - https://zooza.app/#registrations/533612, tak mi tu platbu za kurz rozpočíta na 9 splatok - obrazok v prilohe a mesacne splatky su s centami. \n\nviete mi prosim poradit ako si to spravne upravit aby som pripadne mohla nastavit vlastnu sumu a pocet mesiacov ? este ma napadlo to riesit cez to clenske ale tiez som sa v tom stratila a nechcem to nastavit zle \n\nje lepsie nastavit 3 rozne sablony podla tych nasich platieb vyssie alebo to vie spracovat aj jedna genericka platobna sablona ?\neste poznámka: chcem to nastavit na konkretny kurz a skupinu, ale sablonu bude vyuzivat iba niekolko konkretnych registracii - to sa da nastavit ze sablona bude aktivna na urovni kurzu ale pre kazdu registraciu si ju pridam zvlast ?\n\nDakujem za pomoc a trpezlivost, \nB", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Vážený barbora,\n\n\nváš tiket byl přijat. Asistent Zooza se vám pokusí ihned pomoci — a člen našeho týmu jej také osobně zkontroluje.\n\n\n— Podpora Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobrý deň,\n\n\nďakujem za podrobný popis, hneď vysvetlím, čo sa deje.\n\n\nPrečo 9 splátok s centami: Mesačná šablóna delí finálne kurzovné podľa počtu mesiacov, v ktorých má skupina termíny. Posledné hodiny sú v júni, preto Zooza ráta 9 mesiacov (344 € / 9 = 38,22 €). Pri 8 splátkach vyjdú celé sumy: 43 €, 25 € aj 39 €.\n\n\nAko to nastaviť na 8 splátok:\n\n\n\n\n- \nŠablóna s 8 fixnými splátkami. Namiesto „kurzovné – mesačne“ použite šablónu s pevným počtom 8 splátok. Kurzovné sa rovnomerne rozdelí do 8 platieb bez ohľadu na to, koľko mesiacov kurz trvá.\n\n- \nPoužiť mesačné, ale júnové termíny ako nezapočítané do platby. Termíny v júni odznačte ako „billable“. Dochádzka aj pripomienky pre ne fungujú ďalej, len sa nezapočítajú do splátkového kalendára, takže sa platba rozloží len na október až máj.\n\nKoľko šablón: Na skupine nastavte ako cenu kurzu plnú sumu pri splátkach (344 / 200 / 312 €).\n\n\n\n\n- \nSplátky: stačí jedna šablóna s 8 splátkami pre všetky skupiny. Rozdelí cenu, ktorú má daná skupina.\n\n- \nRočná platba: cenu pri ročnej platbe nastavíte ako zľavu na šablóne (absolútnu alebo percentuálnu). Keďže vaše zľavy sú pri každej cene iné (44 €, 50 € a 32 €), potrebujete tri ročné šablóny, každú s vlastnou absolútnou zľavou. Ak by vám vyhovovala rovnaká percentuálna zľava pre všetky kurzy, stačila by jedna ročná šablóna, ale ročné ceny by sa tým trochu zmenili.\n\nŠablóna len pre niektoré registrácie: Áno, dá sa. Šablónu môžete nastaviť ako neverejnú. Klienti ju pri prihlasovaní neuvidia, ale vy ju ako admin môžete manuálne priradiť vybraným registráciám, aj tým, ktoré už existujú (napr. 533612).\n\n\nČlenské: Je to tiež možnosť, ale funguje inak. Za každé obdobie sa vygeneruje rovnaká suma bez ohľadu na počet termínov, a to postupne, obdobie po období, nie ako harmonogram na celý rok dopredu. Automaticky sa ukončí, keď skončí skupina. Keďže vaša skupina má termíny aj v júni, vygenerovala by sa aj 9. platba za jún, pokiaľ júnové termíny neoznačíte ako „non-billable“. Pre váš prípad preto odporúčam skôr šablónu s 8 splátkami, kde klient vid
