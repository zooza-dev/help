human": false, "bucket": "D_assumed_with_kb", "reask": 1, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Setting the rate/reward for instuctors | Zooza Help", "Zooza 101 for Instructors | Zooza Help", "Instructors | Zooza Help"], "q": "how do I download the resume of how many lessons I've taught this month?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Bianca Grey Holubová", "text": "how do I download the resume of how many lessons I've taught this month?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can download a monthly summary of lessons you taught using the instructor report.\n\n\nSteps:\n\n\n\n\n- Go to Instructors (Instruktori).\n\n- Select your instructor profile.\n\n- Open the Instructors' report for download tab.\n\n- Set Date from and Date to to this month.\n\n- Click Download to export the report. \n\n\nThe report shows the number of sessions, total teaching time, and other summary statistics for the selected period.\n\n\nYou can also view your taught hours for a selected period directly in the Instructor section of your profile.", "cited": ["Instructors | Zooza Help", "Zooza 101 for Instructors | Zooza Help", "Setting the rate/reward for instuctors | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help downloading the monthly lesson summary, I’m here to assist. Would you like to share more about what you’re trying to find or understand?", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215476015418521", "date": "2026-10-02 08:58", "day": "2026-10-02", "human": true, "bucket": "HUMAN", "reask": 2, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Student zostal v termine v zalozke “Presunuti”\n\nDobry den, dneska som Maxima Kucera prehadzovala do inej skupiny ktora zacina v utorok 22.9 ale stale ho vidim v detaile terminu ako “presunuti” v povodnej skupine ktora zacina uz zajtra. \nViete mi prosim vysvetlit preco to tak je? co to znamena? Deje sa to pri kazdom presune?\n\nJedna sa o tento termin - https://zooza.app/#calendar/1579329\n\nJa mu to potom v tej dochadzke schovam lebo urcite nepride\n\nDakujem za pomoc, \nB", "turns": [{"role": "customer", "who": null, "text": "Student zostal v termine v zalozke “Presunuti”\n\nDobry den, dneska som Maxima Kucera prehadzovala do inej skupiny ktora zacina v utorok 22.9 ale stale ho vidim v detaile terminu ako “presunuti” v povodnej skupine ktora zacina uz zajtra. \nViete mi prosim vysvetlit preco to tak je? co to znamena? Deje sa to pri kazdom presune?\n\nJedna sa o tento termin - https://zooza.app/#calendar/1579329\n\nJa mu to potom v tej dochadzke schovam lebo urcite nepride\n\nDakujem za pomoc, \nB", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dear barbora,\n\n\nyour ticket  has been received. Zooza Assistant will try to help you right away — and a member of our team will personally review it too.\n\n\n— Zooza Support", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Barbora, v zasade ide o kozmeticku vec aby bolo jasne, ze tento konkretny ziak v skupine nebol od zaciatku. V povodnej skupine by ziak zostal potom iba na tych terminoch, na ktorych ma dochadzkovy zaznam. Ak dochadzkovy zaznam neexistuje tak tie terminy zooza automaticky skryje. Ak ho na tej hodine nechcete mat, staci mu dochadzkovy zaznam skryt.", "cited": []}, {"role": "customer", "who": "barbora zajacová", "text": "Dobrý deň, tu som vám zabudla odpísať, deje sa nam to u dosť vela registrácii (napr asi 5 sme teraz riešili) tak som im to opravila v dochadzke, ze som ten povodny termin odkial boli presunuti tak som skryla, ale je to velmi matuce pre lektorov ze to tam zostava ak sa presunul študent ešte pred začatím skupiny. \ndochádzkovy zaznam \"pride\" sa automaticky nastavi systemovo pred terminom alebo to musia nejak rodicia povrdit ?\nDakujem, \nB", "cited": []}, {"role": "human", "who": "Tech Support", "text": "dochadzka sa do stavu pride dostava po tom, ako klientovi pride ranna pripomienka, teda systemovo rano o 09:00 den pred terminom, ak si cas neupravite v samotnej sablone.\n\n\n\n\n\nvdaka\n\n\nKatarina", "cited": []}, {"role": "customer", "who": "barbora zajacová", "text": "jasne rozumiem, takze ak ja prehlasim studenta po odoslani pripomienky o termine, je automaticky zaznamenany ze pride a tym padom ak ho presuniem zostava mu \"zaznamenana\" dochadzka aj v starej skupine\n\n\nĎakujem,\n\n\nB\n\n\n\n​", "cited": []}, {"role": "human", "who": "Tech Support", "text": "ano, lebo uz je tak zapisany v databaze na danom termine.", "cited": []}], "verdict": "gap", "vtitle": "What 'Transferred' means on a session after moving a client", "vnote": "Strong general answer: the Transferred marker is cosmetic, it shows the attendee was not in the group from the start. In the original group the attendee stays only on sessions where they have an attendance record; sessions without one are hidden automatically. To get them off a session, hide the attendance record. This explains a whole family of 'client disappeared / client still showing' questions -- see 215476123313841 and 215476138385717.", "cat": "makeups"}, {"channel": "intercom", "id": "215476170792120", "date": "2026-10-02 08:57", "day": "2026-10-02", "human": true, "bucket": "HUMAN", "reask": 4, "resolution": "confirmed_resolution", "rating": null, "carried": null, "sources": ["Programme Settings | Zooza Help", "Message Templates | Zooza Help", "Email and Communication FAQ | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Bookings | Zooza Help", "Message templates — automatic and manual emails | Zooza Help", "Camps — Day Camps, Week Camps, Holiday Programmes | Zooza Help", "Add a one-off scheduled payment | Zooza Help"], "q": "how do i change the confirmation email when it is being booked", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Jochelle Laguipo-Strzalkowska", "text": "how do i change the confirmation email when it is being booked", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You change it in two places: create your email template, then assign it to the programme.\n\n\n\n\n- Go to Communication → Templates.\n\n- Find Confirmation of booking.\n\n- Click Add variant (or Duplicate) and edit the subject and message.\n\n- Save the new template. \n\n\nThen assign it to the programme:\n\n\n\n\n- Open the Programme\n\n\n- Go to Settings → Online booking\n\n\n- In Confirmation email, choose your new template\n\n- Save. \n\n\nTip: system templates cannot be edited directly, so creating a variant is the recommended way to customise the confirmation email.", "cited": ["Programme Settings | Zooza Help", "Message templates — automatic and manual emails | Zooza Help", "Message Templates | Zooza Help", "Email and Communication FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help changing the booking confirmation email, I’m here to assist. Would you like to share more about what you’re trying to customise?", "cited": []}, {"role": "customer", "who": "Jochelle Laguipo-Strzalkowska", "text": "how do i ensure that in scheduled payments, the first payment is paid when book like the 50% deposit, and then the second one before the class starts", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can do this with a down payment + scheduled payment plan.\n\n\n\n\n- Go to Programme → Settings → Price and payment.\n\n- Set the total price and choose a payment plan.\n\n- In Down payment, choose Percentage and enter 50%.\n\n- Save. \n\n\nHow it works:\n\n\n\n\n- The 50% deposit is charged immediately when the client books.\n\n- The remaining 50% is split into instalments according to the payment plan schedule.\n\nTo have the second payment before the class starts, set the instalment date in the payment template (for example, 2 weeks before the start date). \n\n\nThis setup is commonly used for camps and events where a deposit is taken at booking and the balance is paid later.", "cited": ["Payments and Billing FAQ | Zooza Help", "Camps — Day Camps, Week Camps, Holiday Programmes | Zooza Help", "Programme Settings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Jochelle Laguipo-Strzalkowska", "text": "how do i set the instalment date", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You set the instalment date in the payment template used by the programme.\n\n\n\n\n- Go to the programme → Payment templates\n\n\n- Open the template used for the instalment plan\n\n- Set the due date for the second payment (for example: 2 weeks before the class starts)\n\n- Save the template. \n\n\nWhen a client books, the deposit is charged immediately and the remaining balance is scheduled for that due date.\n\n\nYou can also edit the due date later in a specific booking under the Payment plan tab if needed.", "cited": ["Camps — Day Camps, Week Camps, Holiday Programmes | Zooza Help", "Bookings | Zooza Help", "Add a one-off scheduled payment | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help setting the instalment date, I’m here to assist. Would you like to share more about what you’re trying to configure?", "cited": []}, {"role": "customer", "who": "Jochelle Laguipo-Strzalkowska", "text": "all good now thank you", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I'm glad to hear that everything is all good now! If you have any more questions or need further assistance, please feel free to reach out. I'm here to help! 😊", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Jochelle,\n\n\nI saw you asked the assistant about the deposit and the second payment. Just a quick tip on where to find it:\n\n\nWhen the deposit is due: In the programme's payment settings (https://zooza.app/#courses/9859/settings?edit=price), under Advanced settings → Down payment, you can choose when the 50% deposit has to be paid. At the moment it's set to 5 days after booking. You can change this to a number of days before the camp starts instead.\n\n\n\n\n\nUnpaid bookings: At the bottom of the same page there's Auto-cancel unpaid bookings. If you turn it on, bookings that aren't paid on time are cancelled automatically, which frees up the spot for someone else. It's currently off.\n\n\n\n\n\nHow would you like it to work? Should unpaid bookings be cancelled automatically, or would you rather follow up with parents yourself?\n\n\nBest,\nMichal", "cited": []}], "verdict": "gap", "vtitle": "When the deposit is due, and auto-cancelling unpaid bookings", "vnote": "Two concrete settings named: programme payment settings > Advanced settings > Down payment controls when the deposit must be paid (a number of days after booking, or before the start), and Auto-cancel unpaid bookings at the bottom of the same page cancels unpaid bookings and frees the place. Both are weakly covered. Read together with 215476046238860, which says payment cannot be enforced -- I want your read before writing.", "cat": "pricing"}, {"channel": "intercom", "id": "215476189741775", "date": "2026-10-02 08:53", "day": "2026-10-02", "human": true, "bucket": "HUMAN", "reask": 0, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": [], "q": "Dobrý den,\n\n\nchtěl bych se zeptat a poradit, na filtr registrací podle stavu platby nebo značky. Zdá se mi, že ten filtr nezahrnuje všechny registrace a nevím proč. Posílám video s klientkou v příloze, kde vidím, že by se mi měla podle filtru ukázat, ale v seznamu registrací ji nemám...\n\n\nUž před videem, jsem zjistil, že některé registrace se nezahrnuly do seznamu, když jsem vyfiltroval jejich Značku (zkratka kurzu resp. skupiny v Zooze přiřazená k jednotlivým registracím), ale když jsem zaškrtl značku kurzu (zkratka konceptu resp. kurzu v Zooze), tak se tam objevily.\n\n\nPro dovysvětlení - mám zkratky kurzů/skupin u všech registrací v kurzu + mám zkratky jednotlivých kurzů jako takových, posílám prtsc níže.\n\n\nMůžete mi prosím poradit, proč filtr neukazuje vše, co pod něj spadá? Děkuju.\n\n\nS pozdravem\nTomáš V.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n-- \nIng. Tomáš Vávra\nTaneční studio NO LIMIT, z.s.\nLidická 1272/240 370 07 České Budějovice www.tsnolimit.cz, www.nolimitproduction.cz", "turns": [{"role": "customer", "who": "Tomáš Vávra", "text": "Dobrý den,\n\n\nchtěl bych se zeptat a poradit, na filtr registrací podle stavu platby nebo značky. Zdá se mi, že ten filtr nezahrnuje všechny registrace a nevím proč. Posílám video s klientkou v příloze, kde vidím, že by se mi měla podle filtru ukázat, ale v seznamu registrací ji nemám...\n\n\nUž před videem, jsem zjistil, že některé registrace se nezahrnuly do seznamu, když jsem vyfiltroval jejich Značku (zkratka kurzu resp. skupiny v Zooze přiřazená k jednotlivým registracím), ale když jsem zaškrtl značku kurzu (zkratka konceptu resp. kurzu v Zooze), tak se tam objevily.\n\n\nPro dovysvětlení - mám zkratky kurzů/skupin u všech registrací v kurzu + mám zkratky jednotlivých kurzů jako takových, posílám prtsc níže.\n\n\nMůžete mi prosím poradit, proč filtr neukazuje vše, co pod něj spadá? Děkuju.\n\n\nS pozdravem\nTomáš V.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n-- \nIng. Tomáš Vávra\nTaneční studio NO LIMIT, z.s.\nLidická 1272/240 370 07 České Budějovice www.tsnolimit.cz, www.nolimitproduction.cz", "cited": []}, {"role": "customer", "who": "Tomáš Vávra", "text": "Ještě doplním, že to zkouším postupně a např. když teď zaškrtnu zkratku UD (Urban Dancers), tak v kurzu jsou 3 registrace, které nejsou uhrazené. Ale do filtrovaného seznamu se mi přidá jen jedna z nich. Registrace č. 523955 (Marie Anna Krasova) a č. 497978 (Elisa Řeháková) se mi v seznamu registrací filtrovaných podle stavu platby a značky neukážou.", "cited": []}, {"role": "customer", "who": "Tomáš Vávra", "text": "Ještě přikládám jedno video, kde filtruji podle stavu platby a fakturačního období. Je zde vidět, že když se kouknu do kurzu Dance Beginners, tak se mi ukáže několik neuhrazených registrací. Když potom zkusím v seznamu filtrovaných registrací dohledat 2 lidi, kteří mají neuhrazeno a jsou ve stejném kurzu, tzn. měli by mít stejné fakturační období, tak mi to jednoho vyfiltruje a druhého ne. Takže bude pravděpodobně problém ve filtru Stavu platby.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, Tomasi, \n\n\ndakujeme za napisanie, skusame to podla Vasho videa a dostaneme ocakavane vysledky, jediny rozdiel je, ze v tych registraciach, ktore sa Vam nedari najst cez ten filter tak v tom case vyhladavania boli v stave zelenej ikonky symbolu €. Moze to byt stav awaiting payment, alebo materializacia dat. Pozrieme sa na to.", "cited": []}], "verdict": "product", "vtitle": "Registration filter by payment status or tag misses registrations", "vnote": "Reproduction attempt gave the expected result; the missing registrations were in a green euro state at the time, possibly awaiting payment or mid-materialisation. Under investigation.", "cat": "bookings"}, {"channel": "intercom", "id": "215476188131258", "date": "2026-10-02 07:50", "day": "2026-10-02", "human": true, "bucket": "HUMAN", "reask": 1, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": ["Get single registration | Zooza Developer Docs", "Additional fields on the booking form | Zooza Help", "Client Management FAQ | Zooza Help", "Documents | Zooza Help", "Registrations | Zooza Developer Docs"], "q": "Dobrý deň,\nskúšal som claude naučiť vytvárať potvrdenia na účely športového príspevku na dieťa. K väčšine potrebných informácií (meno a priezvisko, názov kurzu, obdobie/termín, a suma. sa ako tak vie dostať, no vypisuje, že nevie zistiť dátum narodenia účastníka. \nZároveň sa trošku obávam, či vie správne dohľadať dátum prvej registrácie pri danom účastníkovi. Skúšal som to zatiaľ len na klientovi s jednou registráciou.\nPlánuje sa v tomto smere v blízkej budúcnosti nejaký update?\nĎakujem\nJakub_MEDVEDICA", "turns": [{"role": "customer", "who": "Jakub Majoroš", "text": "Dobrý deň,\nskúšal som claude naučiť vytvárať potvrdenia na účely športového príspevku na dieťa. K väčšine potrebných informácií (meno a priezvisko, názov kurzu, obdobie/termín, a suma. sa ako tak vie dostať, no vypisuje, že nevie zistiť dátum narodenia účastníka. \nZároveň sa trošku obávam, či vie správne dohľadať dátum prvej registrácie pri danom účastníkovi. Skúšal som to zatiaľ len na klientovi s jednou registráciou.\nPlánuje sa v tomto smere v blízkej budúcnosti nejaký update?\nĎakujem\nJakub_MEDVEDICA", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Hi Jakub,\n\n\nThanks for reaching out! I'm Zooza Support, Zooza's AI Agent and I'm well trained to answer your query but you can reply and ask for the team at any time.\n\n\nGood news — the data you need is available in Zooza.\n\n\n\n\n- \nDate of birth is stored as a field called dob on the registration record. \n\n\n- It can also be stored as an extra field ef_dob if you collect it through the booking form. \n\n\n- In documents and emails, you can insert it using the dynamic tag |EF_DOB|. \n\n\nFor the first registration date, there is also a field called first_event, which represents the date-time of the first registration event.\n\n\nRegarding your concern about documents: currently there is no dedicated tag that summarises multiple children in one confirmation. A summarising tag for cases like this (including names, dates of birth, and enrolment dates) is being considered. \n\n\nPlease let me know if this helps or if you have any further questions.\n\n\nRegistrations | Zooza Developer Docs\nGet single registration | Zooza Developer Docs\nDocuments | Zooza Help\nAdditional fields on the booking form | Zooza Help\nClient Management FAQ | Zooza Help", "cited": []}, {"role": "customer", "who": "Jakub Majoroš", "text": "Wait for the team", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, Jakub,\n\n\nmcp neustale vylepsujeme, tak najlepsie je tam cez clauda raisnut issue, normlane mu povedzte, ze ked to nevidi, nech vytvori poziadavku na vylepsenie, on to potom zapise tak, ze sa na to developeri vedia pozriet. Je mozne pouzit aj export zo Zooza na dokoncenie specifickych uloh. Tie poziadavky riesime priebezne.", "cited": []}], "verdict": "gap", "vtitle": "How to raise an MCP improvement request from inside Claude", "vnote": "The client could not get an attendee's date of birth through MCP. Answer: tell Claude to raise a request and it files it so developers can pick it up; a Zooza export can cover specific one-off tasks meanwhile. That is a reusable instruction for every MCP limitation, and it scales better than us documenting each missing field.", "cat": "ai"}, {"channel": "intercom", "id": "215476045907554", "date": "2026-10-02 07:48", "day": "2026-10-02", "human": true, "bucket": "HUMAN", "reask": 7, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "2 otazky\n\nDobrý deň,\n\nMal by som 2 otázky:\n\n1. klienti krotí sa prihlásia na skušobnú hodinu, potom sa z nej odhlásia, tak sa nevedia naspäť prihlásiť na skušobnú hodinu, stao sa to už viac krát, ako sa to dá prosím upraviť aby to boo možné?\n\n2.Ak sa klient prihlási na čakaciu listinu na náhradnú hodinu , a následne to admin manuálne potvrdí - tak klient ktorý bol nahlásený na čakaciu listinu nedostane žiadnu notifikáciu o tom, že bol nahlásený na náhradný termín. ( potvrdil som z dôvodu, že v danej skupine sú disciplinované deti a bolo ok aj keď bola skupina cez kapacitu). \n\nďakujem pekne za odpoveď\n\nS pozdravom \n\nMichal Kiss", "turns": [{"role": "customer", "who": null, "text": "2 otazky\n\nDobrý deň,\n\nMal by som 2 otázky:\n\n1. klienti krotí sa prihlásia na skušobnú hodinu, potom sa z nej odhlásia, tak sa nevedia naspäť prihlásiť na skušobnú hodinu, stao sa to už viac krát, ako sa to dá prosím upraviť aby to boo možné?\n\n2.Ak sa klient prihlási na čakaciu listinu na náhradnú hodinu , a následne to admin manuálne potvrdí - tak klient ktorý bol nahlásený na čakaciu listinu nedostane žiadnu notifikáciu o tom, že bol nahlásený na náhradný termín. ( potvrdil som z dôvodu, že v danej skupine sú disciplinované deti a bolo ok aj keď bola skupina cez kapacitu). \n\nďakujem pekne za odpoveď\n\nS pozdravom \n\nMichal Kiss", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Vážený Michal,\n\n\nváš tiket byl přijat. Asistent Zooza se vám pokusí ihned pomoci — a člen našeho týmu jej také osobně zkontroluje.\n\n\n— Podpora Zooza", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Michal, V prvom pripade asi by bolo fajn ak viete poslat nejaky priklad zakaznika, ktory sa odhlasil a snazil sa prihlasit na nahradnu hodinu. Uplne idealne aj s nejakym casom, kedy to priblizne skusal (aspon priblizne). Vo vseobecnosti pokial sa zakaznik odhlasi z hodiny system by mu mal priznat nahradnu hodinu rovnako ako beznemu ucastnikovi a tu nahradnu hodinu by si mal byt schopny vybrat. Co sa druhej otazky tyka - ano takato notifikacia neexistuje, mame ju v backlogu, ale momentalne existuje iba notifikacia o prihlaseni na dodatocnu hodinu ale nie na nahradnu.", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "Je to tak, že nikomu kto je prihlásený na skušobnú hodinu z ktorej sa odhlási, sa následne nedá prihlásiť späť na skušobnú. Jede taký prípad čo si pamätám čerstvo zo včera je Nina Kaiserová. Ale ako vravím nikto, kto sa odhási zo skušobnej už následne nejde prihlásiť späť.\nTen druhý prípad ako funguje v prípade že sú na čakacej listine a uvoľní sa miesto? automaticky ich to prihlási na hodinu alebo ?", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobrý deň, pán Kiss,\n\n\n\n\n\npozreli sme sa na registráciu Niny Kaiserovej (skúšobná hodina v skupine Motýle) aj na jej profil.\n\n\n\n\n\nČo sa stalo:\n21.9. o 15:05 sa pani Erika Kaiserová cez svoj profil odhlásila z termínu 22.9. Keďže to stihla v rámci limitu na odhlásenie, systém jej automaticky vytvoril náhradnú hodinu (kredit platný do 5.11.2026). O pár minút neskôr ste Ninu v dochádzke prihlásili cez „Prihlásiť na termín\" na 29.9. Tým vznikla nová, bežná účasť. Náhradná hodina však zostala nevyužitá a klientka ju má stále k dispozícii.\n\n\nVýsledok je, že za jeden odhlásený termín má klientka teraz dva: prihlásenie na 29.9. aj voľnú náhradnú hodinu.\n\n\n\n\n\nAko to riešiť nabudúce:\nKeď sa klient zo skúšobnej hodiny v limite odhlási, termín mu ručne nepridávajte. Nechajte ho, aby si cez svoj profil sám vybral náhradnú hodinu, ktorá mu za odhlásený termín vznikla. Náhrada sa tak naviaže na pôvodný termín a kredit sa spotrebuje.\n​\n\n\nČo s touto registráciou teraz:\nAby mala klientka len jednu hodinu, máte dve možnosti:\n\n\n\n\n- \nNechať prihlásenie na 29.9. a vymazať (deaktivovať) jej nevyužitú náhradnú hodinu, alebo\n\n- \nZrušiť prihlásenie na 29.9. a nechať pani Kaiserovú, aby si sama vybrala termín cez náhradnú hodinu.\n\n\n\n\nS pozdravom,\nZooza tim", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Čo sa týka registrácií, ktoré sú na čakacej listine - v prípade, že sa uvoľní miesto na termíne, na ktorý čaká viač čakateľov, každý z nich obdrží email s informáciou, že v danom termíne sa uvoľnili miesto a ak majú záujem, môžu sa cez priložený link na termín prihlásiť.\n\n\nV tomto prípade platí - kto skôr príde, ten skôr melie.\n\nPrihlasovanie sa nedeje automaticky, kliet to musí spraviť vedome \n\n\n\n\n\npekný deň\n\n\nZooza tím", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "Ide o to, že žiadny z klientov keď sa odhlási zo skušobnej hodiny, nemá vo svojom profile na výber náhradnu hodinu. Raz som sa prihlásil cez klientov profil a videl som že tam reálne ta možnosť nie je. Ako píšem, stalo sa to pri veľa klientoch, alebo to nikto z nich nevie používať vrátane mňa a tým pádom to nie je user friendly . Pamätám si, ako to napísalo, že na výber nie je žiaden z voľných termínov. Aj tak si ale vytvorím skušobnú hodinu testovacím profilom a následne sa skúsim odhlásiť či to dunguje alebo nie. \n\n\nĎakujem", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "Vytvoril som si skusobnu hodinu , oshlasil som sa z nej a následne som dostal možnosť sa prihlásiť iba na tú náhradnú hodinu, z ktorej som bol odhlásený.", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "543347 - Michal Kiss (marcel kiss)", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "novo vytvoreny testovaci profil", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "dobrý deň, mohli by ste sa prosím na to pozriet? dakujem", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Preštudovať, čo chce a ako to riešiť.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, pan Kiss, dakujeme za trpezlivost, bolo potrebne to trochu rozobrat aj s timom.\n\n\n\n\n\n1. Odhlásenie zo skúšobnej hodiny\nKeď sa klient odhlási zo skúšobnej hodiny a na programe máte povolené náhradné hodiny, systém mu automaticky vytvorí kredit na náhradu — vo svojom profile si potom vie vybrať iný termín. Toto je cesta, ktorou sa má na skúšobnú hodinu vrátiť a funguje to.\n\n\nČo zatiaľ nejde: prihlásiť sa znova cez prihlasovací formulár na skúšobnú hodinu v tej istej skupine. Systém takú registráciu odmietne, pretože pôvodná skúšobná registrácia stále beží (odhlásenie z termínu ju neruší) ,preto tá hláška, že skúšobnú hodinu už má rezervovanú. Ak chcete klienta vrátiť cez formulár, treba pôvodnú skúšobnú registráciu najprv zrušiť/uzavrieť v administrácii; inak stačí, aby si klient vybral náhradný termín z kreditu.\n\n\n\n\n\n2. Čakacia listina na náhradnú hodinu\nPotvrdili ste to správne. Momentálne však platí, že keď klienta z čakacej listiny potvrdíte manuálne (napr. nad rámec kapacity), systém mu o tom neposiela žiadnu notifikáciu , informáciu treba zatiaľ poslať ručne. Klient dostane len bežnú pripomienku deň pred hodinou, ak ju máte na programe zapnutú.\n\n\nToto je zaujimavá vec na doriešenie , zapisujeme to ako požiadavku na vývoj, aby mohli dostat klienti potvrdenie o priradeni do terminu automaticky alebo volbou adminom.\n\n\nS pozdravom", "cited": []}, {"role": "human", "who": "Tech Support", "text": "https://zooza.atlassian.net/browse/ZOOZA-4933", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "Dobrý deň,\n\nopäť som sa skúsil prihlásiť na náhradnú hodinu vytvorenú zo skúšobnej hodiny a nešlo mi to . Prikladám vám k tomu screenshoty postupu, otvril som svoj profil-> vsetci clenovia -> Benefity - Náhradky 1 -> Veveričky Dostupná náhradka do 7.11. -> Momentálne nie sú k dispozícii žiadne náhradné hodiny .  Takže ak som postupoval správne, tak to nefunguje tak tko popisujete", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, pan Kiss, to by ale znamenalo, ze system nevidi terminy, ktore moze ponuknut, da sa v systeme skontrolovat preco to tak je. Bud su plne skupiny, alebo je to nastavenim nahradnych hodin. Da sa to skontrolovat cez system MATKO, https://uk.zooza.app/#settings/matko kde zadate cislo kreditu (najdete v detaile klienta a vyberiete termin, ktory si myslite, ze by sa mal ponuknut. Pripadne napiste termin, radi pozrieme za vas.", "cited": []}], "verdict": "gap", "vtitle": "No notification when a waiting-list place is confirmed as a make-up", "vnote": "Two questions. (1) A client who cancels a trial cannot book a trial again -- agent asked for an example, unresolved, do not document. (2) Confirmed: there is no notification for a waiting-list to make-up confirmation; only the additional-session sign-up notification exists. It is in the backlog. Document the gap so the bot stops implying it exists.", "cat": "trials"}, {"channel": "intercom", "id": "215476150478172", "date": "2026-10-02 07:45", "day": "2026-10-02", "human": true, "bucket": "HUMAN", "reask": 14, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Discounts and Sibling Pricing FAQ | Zooza Help", "Discount code | Zooza Help", "Discounts | Zooza Help", "Sibling Discount | Zooza Help"], "q": "Is it possible to create a 15% discount code for parents with 2 children", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Is it possible to create a 15% discount code for parents with 2 children", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — you can create a 15% discount code for this. \n\n\nSteps:\n\n\n\n\n- Go to Sales & Payments → Discounts → Discount codes\n\n\n- Click Create\n\n\n- Set:\n• Code: e.g. SIBLING15\n• Discount type: percentage\n• Value: 15%\n• Choose usage limits and programmes if needed\n\nParents enter the code during checkout. \n\n\nEven better: you can also enable Sibling Discount in Sales & Payments → Loyalty Programme → Sibling Discount, which automatically gives a discount when the same parent books a second child.", "cited": ["Discounts and Sibling Pricing FAQ | Zooza Help", "Sibling Discount | Zooza Help", "Discounts | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "New discount code please walk me through it? Name? Code? Amount of use? Absolute discount? And the rest of these fields what exactly am i putting.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Great — here’s exactly what to put in each field when creating a 15% code.\n\n\nStep 1: New Discount Code\n\n\n\n\n- \nName\nInternal name (only you see it).\nExample: Sibling 15% discount\n\n\n- \nCode\nThe code parents type at checkout.\nExample: SIBLING15\n\n\n- \nAmount of use\nMaximum times the code can be used.\n• Example: 100 if you want to limit it\n• 0 = unlimited uses\n\n\n- \nAbsolute discount\nLeave this empty if you want a percentage discount.\nThis field is only for a fixed amount (e.g. £10 off).\n\n\n- \nRelative discount in percentage\nEnter: 15\nThis gives a 15% discount on the total programme price.\n\n- \nDate / Time\nSet an expiry date if you want the code to stop working later.\nLeave blank if you want it to stay active.\n\nStep 2: Configure where the code can be used\n\n\n\n\n- Select the Programmes (or classes) where parents can use the code.\n\nStep 3: Finish\n\n\n\n\n- Review the settings and confirm to create the code.\n\nQuick example you could copy:\n\n\n\n\n- Name: Sibling 15% discount\n\n\n- Code: SIBLING15\n\n\n- Amount of use: 0\n\n\n- Relative discount: 15%\n\n\nParents will enter the code in the Discount field on the booking form during checkout.\n\n\nIf you want, I can also show you a simple way to limit it so it only works for parents booking two children.", "cited": ["Discounts | Zooza Help", "Discount code | Zooza Help", "Discounts and Sibling Pricing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "this is what im seeing. have i filled this out correctly?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — based on what you shared, it looks correctly filled out for a 15% code. \n\n\nYour settings match the expected setup:\n\n\n\n\n- \nName: Sibling 15% discount ✅ (internal label)\n\n- \nCode: SIBLING15 ✅ (what parents enter)\n\n- \nAmount of use: 100 ✅ (limits how many times it can be used)\n\n- \nAbsolute discount: 0 ✅ (left empty because you’re using percentage)\n\n- \nRelative discount in percentage: 15 ✅ (this creates the 15% discount)\n\n- \nExpiration date: 2026-12-29 ✅ (optional expiry)\n\nNext step: click Continue, then select the Programmes where this code can be used, and confirm to finish creating it. \n\n\nSo you’re on the right track 👍", "cited": ["Discounts | Zooza Help", "Discount code | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help reviewing or completing the discount code setup, I’m here to help. Would you like to share what you’re unsure about next?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "I have just asked a parent to use this discount code and this is what they have got.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "stop", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I understand, I will stop here. Please let me know if you need anything else later on.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "incorrect image", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thanks for clarifying. I can’t see the result from your screenshot because it shows a website content editor, not the booking form where the discount is applied. \n\n\nFor the code to work, the parent must enter SIBLING15 in the Discount field on the booking form during checkout. The discounted total appears before they confirm the booking.\n\n\nCould you send a screenshot of the booking form page where the parent enters the code (the page with the Discount field)? That will help identify what they are seeing.", "cited": ["Discount code | Zooza Help", "Discounts | Zooza Help"]}, {"role": "customer", "who": "Louis Dainty", "text": "this was the image", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thanks for the screenshot — this explains what’s happening.\n\n\nYour code is set up correctly, but percentage discount codes don’t work with monthly memberships. When a booking uses a recurring payment plan (like “£60.00 every month”), there is no fixed total order value, so a percentage discount cannot be calculated. \n\n\nThat’s why the parent is seeing a large discount amount (£87.75) and no place to enter the code.\n\n\nWhat to do instead:\n\n\n\n\n- Use an absolute discount (for example £10 or £15 off), or\n\n- Use the built-in Sibling Discount in Sales & Payments → Loyalty Programme → Sibling Discount, which applies automatically when the same parent books multiple children.\n\nSo your code setup is fine — the issue is just that percentage codes aren’t supported on monthly memberships.", "cited": ["Discounts and Sibling Pricing FAQ | Zooza Help", "Discount code | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Louis, can you please share with me the booking link for that class?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "give me a prompt that i can ask chat (now linked) to create the exact discount code I need.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "From the screenshot you posted it seems that the coupon is set up correctly, I would like to see how the set up is on the class. Therefore if you could share that booking link that'd help to find where is the problem", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "https://www.loudballers.com/booking?course_id=229&schedule_id=407", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "give me a prompt (for chatgpt) to create the exact sibling discount code i need.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "oh sorry i thought i was talking to AI.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "No worries", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Louis there seems to be a problem with the coupon itself. We'll investigate it and get back to you as soon as possible.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Louis, the discount coupon should now work as intended:\n​", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Thats great thank you.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Hi just looking at a couple of payemts and i see this in blue. Will charge offline? what does that mean?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Also if/when a payment does go through where is that information.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Louis,\n\n\n\"Will charge offline\" just means the payment is scheduled to be collected automatically from the parent's account, through their GoCardless Direct Debit or Stripe subscription, rather than them being asked to pay manually. Nothing for you to do; it'll go out on the due date.\n\n\nOnce a payment actually goes through, you'll see it in two places: under Transactions, and on the registration itself, where the payment status and the parent's current balance are shown.", "cited": []}], "verdict": "client", "vtitle": "15% discount for parents with two children", "vnote": "Agent asked for the booking link. Sibling pricing is already documented; nothing new yet.", "cat": "pricing"}, {"channel": "intercom", "id": "215476194049069", "date": "2026-10-01 18:16", "day": "2026-10-01", "human": false, "bucket": "D_assumed_with_kb", "reask": 6, "resolution": "confirmed_resolution", "rating": null, "carried": null, "sources": ["Billing and invoicing | Zooza Help", "Zooza Glossary | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Integrations | Zooza Help", "Invoicing in Zooza — Overview | Zooza Help", "Connect SuperFaktura as Your Invoice Engine | Zooza Help", "Government e-invoicing mandates and Zooza | Zooza Help", "E-invoicing FAQ | Zooza Help"], "q": "Dobrý deň, predĺžila som si licenciu na používanie programu Zooza na ďalšie ročné obdobie. V súčasnosti sa často v mediách spomína novinka, ktorá bude platiť od roku 2027 a to e-faktúra. Pre vytváranie faktúr používam práve váš program, preto by som chcela zistiť, či po tejto zmene bude program Zooza umožňovať aj odosielanie vytvorených faktúr priamo na finančnú správu prostredníctvom elektronického ,,poštára\" alebo či to budete pre klientov nejako zabezpečovať. Pri vstupnom pohovore s vami som dostala informáciu, že váš program používajú aj firmy, ktoré sú platcami DPH. My zatiaľ nie sme, ale v priebehu nasledujúceho roka na tento spôsob pravdepodobne prejdeme. Rada by som bola na to pripravená a keďže používane na fakturáciu práve váš program, ktorý nám šetrí čas, chcela by som sa vyhnúť vytváraniu faktúr duplicitne. Budem rada, ak mi niektorý z Vašich pracovníkov na túto otázku odpovie, predpokladám, že to zisťuje viac vašich zákazníkov. Ďakujem za odpoveď S pozdravom Zuzana Vincze", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Zuzana Vincze", "text": "Dobrý deň, predĺžila som si licenciu na používanie programu Zooza na ďalšie ročné obdobie. V súčasnosti sa často v mediách spomína novinka, ktorá bude platiť od roku 2027 a to e-faktúra. Pre vytváranie faktúr používam práve váš program, preto by som chcela zistiť, či po tejto zmene bude program Zooza umožňovať aj odosielanie vytvorených faktúr priamo na finančnú správu prostredníctvom elektronického ,,poštára\" alebo či to budete pre klientov nejako zabezpečovať. Pri vstupnom pohovore s vami som dostala informáciu, že váš program používajú aj firmy, ktoré sú platcami DPH. My zatiaľ nie sme, ale v priebehu nasledujúceho roka na tento spôsob pravdepodobne prejdeme. Rada by som bola na to pripravená a keďže používane na fakturáciu práve váš program, ktorý nám šetrí čas, chcela by som sa vyhnúť vytváraniu faktúr duplicitne. Budem rada, ak mi niektorý z Vašich pracovníkov na túto otázku odpovie, predpokladám, že to zisťuje viac vašich zákazníkov. Ďakujem za odpoveď S pozdravom Zuzana Vincze", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Zuzana, v súčasnosti Zooza neumožňuje odosielanie e‑faktúr na finančnú správu. Program generuje iba PDF faktúry a neodosiela ich prostredníctvom digitálneho „poštára“ ani nehlási dáta daňovej správy.  \n\n\nOd 1.1.2027 sa povinná e‑faktúra týka hlavne B2B a B2G (faktúry firmám alebo verejnému sektoru). Ak budete fakturovať iba súkromným osobám (B2C), nič sa pre vás meniť nebude.  \n\n\nAk budete musieť vydávať e‑faktúry, budú musieť vznikať v službe podporujúcej e‑faktúru (napr. SuperFaktura), ktorá ich odosiela a hlási. Zooza môže túto službu použiť ako invoice engine.", "cited": ["Payments and Billing FAQ | Zooza Help", "Government e-invoicing mandates and Zooza | Zooza Help", "Invoicing in Zooza — Overview | Zooza Help", "E-invoicing FAQ | Zooza Help", "Connect SuperFaktura as Your Invoice Engine | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Zuzana Vincze", "text": "ďakujem, viete mi povedať viac ako službe invoice engine v Zooze?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Zuzana, invoice engine je služba, ktorá naozaj vytvára samotný dokument faktúry. \n\n\n\n\n- Zooza zhromažďuje dáta (kto zaplatil, koľko, za čo).\n\n- Tieto dáta pošle do invoice engine.\n\n- Ten priradí číslo faktúry a vygeneruje PDF.\n\n- Zooza uloží PDF a môže ho klientovi poslať e‑mailom. \n\n\nMôžete použiť:\n\n\n\n\n- \nFaktury Online (štandardný, bez nastavenia)\n\n- \nZooza Invoice (beta) – vlastný systém s QR kódom a sledovaním platby\n\n- alebo externú účetnú službu ako Fakturoid, ABRA Flexi, Xero, SmartBill, Számlázz.hu, Oblio. \n\n\nPri povinných e‑faktúrach od 2027: Zooza ich neodosiela na finančnú správu. Ak budú potrebné, musia ich vytvárať služba podporujúca e‑faktúru, ktorá je pripojená ako invoice engine.", "cited": ["Invoicing in Zooza — Overview | Zooza Help", "Zooza Glossary | Zooza Help", "Integrations | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Government e-invoicing mandates and Zooza | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Zuzana Vincze", "text": "ďakujem, nájdem túto možnosť niekde priamo v menu Zooza, resp. viem sa k tomu niekde preklikať?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Zuzana, áno — túto možnosť nájdete priamo v menu.\n\n\nNa obrazovke Settings → Billing & Payments → Invoices môžete vybrať invoice engine. \n\n\nTu môžete:\n\n\n\n\n- použiť štandardný Faktury Online (žiadne nastavenie)\n\n- alebo použiť Zooza Invoice (beta) – interný systém s QR kódom a sledovaním platby.\n\nAk chcete použiť externú účetnú službu, tiež ju vyberiete na tejto obrazovke.\n\n\nPripojené systémy môžu byť napríklad Fakturoid, ABRA Flexi, Xero, SmartBill, Számlázz.hu alebo Oblio.", "cited": ["Invoicing in Zooza — Overview | Zooza Help", "Billing and invoicing | Zooza Help", "Integrations | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak budete potrebovať ďalšiu pomoc s nastavením invoice engine, som vám k dispozícii. Chcete doplniť, čo presne potrebujete v Zooze nastaviť alebo objasniť?", "cited": []}, {"role": "customer", "who": "Zuzana Vincze", "text": "ďakujem, chcem sa len uistiť, či som pochopila podstatu, poviem to teda laicky: takže nejaký externý program (ktorý podporuje vytvorenie a odoslanie e-faktúry) môže byť k Zooze ,,pripojený\" cez službu Invoice engine, niečo ako keď pripájam napr. bankový účet?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Zuzana, áno — presne takto to môžete chápať.\n\n\n\n\n- \nZooza zhromažďuje dáta (kto zaplatil, koľko, za čo).\n\n- Tieto dáta pošle do invoice engine (externého účetného alebo fakturačného systému).\n\n- Ten systém vytvorí samotnú e‑faktúru a môže ju odosielať na finančnú správu. \n\n\nZooza teda „posiela dáta“, ale skutočný dokument a odosielanie robí externý systém. \n\n\nJe to podobné ako pripojenie iného systému — dáta z Zoozy sa prenášajú do externého programu, ktorý sa stará o samotnú faktúru.", "cited": ["Invoicing in Zooza — Overview | Zooza Help", "Zooza Glossary | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Government e-invoicing mandates and Zooza | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Zuzana Vincze", "text": "v poriadku, toto mi stačí, chcela som iba vedieť, či nebudem musieť tvoriť faktúry v dvoch nezávislých programoch. Áno, je pravda, že väčšina faktúr odchádza súkromným osobám, ale vyskytujú sa aj situácie, keď vystavujeme faktúru firmám alebo organizáciám, preto túto informáciu potrebujem. Ďakujem, postup som si uložila, ak s ním budem pracovať ozvem sa v prípade nezrovnalostí.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Zuzana, presne tak — vaša pochopenia je správna.\n\n\n\n\n- Zooza zhromažďuje dáta (kto zaplatil, koľko, za čo).\n\n- Tieto dáta sa pošlú do invoice engine (interného alebo externého systému).\n\n- Ten systém vytvorí samotnú e‑faktúru a môže ju odosielať na finančnú správu. \n\n\nTeda nemusíte tvoriť faktúry v dvoch systémoch — dáta z Zoozy sa prenášajú a externý systém sa stará o samotnú e‑faktúru.", "cited": ["Invoicing in Zooza — Overview | Zooza Help", "Government e-invoicing mandates and Zooza | Zooza Help", "Zooza Glossary | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this information helpful?", "cited": []}, {"role": "customer", "who": "Zuzana Vincze", "text": "áno, ďakujem, prajem pekný večer", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thank you for your kind words, Zuzana. I am here whenever you need further assistance. Wishing you a pleasant evening as well! 😊", "cited": []}], "verdict": "check", "vtitle": "Will Zooza support the 2027 e-invoice mandate (asked 6 times)", "vnote": "We shipped an e-invoicing FAQ recently and the bot still cited the generic billing article six times over. Check whether the FAQ actually answers 'will your program handle e-faktura from 2027' in the words a client uses, and whether it is reachable from billing.", "cat": "payments"}, {"channel": "intercom", "id": "215476185970272", "date": "2026-10-01 09:37", "day": "2026-10-01", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Billing and invoicing | Zooza Help", "Subscription and Billing FAQ | Zooza Help", "Zooza Glossary | Zooza Help", "Invoicing in Zooza — Overview | Zooza Help"], "q": "how is the invoice produced for active clients and can this be invoiced in AED", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "how is the invoice produced for active clients and can this be invoiced in AED", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Samantha, invoices are created from payment data on a booking. When a payment is recorded, Zooza sends the data to the connected invoice engine, which assigns an invoice number and generates a PDF invoice. The PDF is stored and emailed to the client if notifications are enabled.  \n\n\nYou can generate invoices in two ways:\n\n\n\n\n- \nAutomatic – enabled in Settings → Billing & Payments → Invoices → Automatic invoice generation upon payment.\n\n- \nManual – open the booking → Payments tile → Generate invoice. \n\n\nThe help centre does not specify currency options (such as AED) for client invoices.", "cited": ["Invoicing in Zooza — Overview | Zooza Help", "Billing and invoicing | Zooza Help", "Zooza Glossary | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "NO my invoice for using the booking system", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Got it — you mean the invoice for your Zooza subscription, not client invoices.\n\n\nYou can download it here:\n\n\n\n\n- Click your name/profile (top right)\n\n- Go to Subscription\n\n\n- Click Manage subscription\n\n\n- Open Details → Invoices\n\n\nThis opens the billing portal where you can download past invoices and update billing details. \n\n\nThe help centre does not specify whether these subscription invoices can be issued in AED.", "cited": ["Subscription and Billing FAQ | Zooza Help", "Billing and invoicing | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help with your Zooza subscription invoice or its currency, I’m here to help. Would you like to share more about what you need to clarify?", "cited": []}], "verdict": "check", "vtitle": "Invoicing active clients in AED", "vnote": "Asked twice. Currency support per invoicing profile -- check what we already say before answering.", "cat": "payments"}, {"channel": "intercom", "id": "215476185202699", "date": "2026-10-01 09:00", "day": "2026-10-01", "human": false, "bucket": "D_assumed_with_kb", "reask": 3, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Getting Started with Zooza | Zooza Help", "Common Booking Scenarios | Zooza Help", "Payment Correction vs Refund Guide | Zooza Help", "Sending email/SMS to clients | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Manage your to-do list | Zooza Help", "Connect Zooza to Claude or ChatGPT (Zooza AI) | Zooza Help"], "q": "Ahoj, prosím ťa ako presuniem októbrovú splátku na novembrovú - október je uhradený, no športovec nemôže celý mesiac trénovať kvôli zdravotným problémom?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Ahoj, prosím ťa ako presuniem októbrovú splátku na novembrovú - október je uhradený, no športovec nemôže celý mesiac trénovať kvôli zdravotným problémom?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ano, dá sa to jednoducho — stačí posunúť ďalšiu splátku na neskorší dátum. \n\n\nPostup:\n\n\n\n\n- Idite na Bookings → Detail → Payments → Payment Plan\n\n\n- Kliknite na nasledujúcu splátku\n\n- Zmeňte Scheduled for na novembrový dátum\n\n- Uložte\n\nTým sa fakturácia pozastaví a pokračuje až od nového dátumu.", "cited": ["Common Booking Scenarios | Zooza Help", "Getting Started with Zooza | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Spravil som čo si mi napísal, no dátum sa nezmenil na 1.12. ani po refresh stránky. Je možné že zmena naskočí dodatočne?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Zmena dátumu splátky by sa mala premeniť okamžite po uložení. Žiadne dodatočné naskočenie sa v dokumentácii neuvádza. \n\n\nAk sa dátum nezmenil, skúste ho upraviť aj cez Edit payment:\n\n\n\n\n- Bookings → otvorte registráciu\n\n- Payments\n\n- u transakcie kliknite na More (three-dot menu) → Edit payment\n\n\n- zmeňte dátum a uložte. \n\n\nVidíte na tejto obrazovke aj túto možnosť Edit payment u tej splátky?", "cited": ["Payments and Billing FAQ | Zooza Help", "Payment Correction vs Refund Guide | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc so zmenou dátumu splátky, som vám k dispozícii; mrzí ma, ak predchádzajúci postup nepomohol. Chcete doplniť, na ktorej obrazovke sa dátum po uložení stále nezmení?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Prejdem na inú záležitosť, za pomoci Clauda riešim momentálne komunikáciu, odosielať správy vie, vie ich aj označiť ako vyriešené (alebo to musím robiť ručne) ?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ano — Claude vie čítať a analyzovať odpovede klientov na emaily poslané cez Zooza a môže ich označiť ako unread, needs a human alebo handled. \n\n\nV Zooza sa však označovanie správ ako „solved“ robí ručne v Communication → Messages Overview, kde môžete filtrovať správy podľa stavu unread, to do, solved. \n\n\nPodobne aj úlohy (to‑dos) sa označujú ako hotové ručne v zozname úloh.", "cited": ["Sending email/SMS to clients | Zooza Help", "Connect Zooza to Claude or ChatGPT (Zooza AI) | Zooza Help", "Manage your to-do list | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak ešte potrebujete pomoc s komunikáciou alebo označovaním správ, rada vám pomôžem. Chcete doplniť, čo presne potrebujete v Claudovi nastaviť alebo overiť?", "cited": []}], "verdict": "gap", "vtitle": "Moving a paid October instalment to November because the athlete is injured", "vnote": "Asked three times. The bot cited the payment-correction guide without answering. A seasonal, recurring request -- illness and injury pauses.", "cat": "payments"}, {"channel": "email", "id": "email-15", "date": "2026-10-01 08:55", "day": "2026-10-01", "human": true, "bucket": "EMAIL", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Trial → enrolment, odstup naplánovania a splatnosti splátky, limity AI napojenia", "turns": [{"role": "human", "who": "Tech Support", "text": "Hi Kieran,\n\nThanks for getting in touch, and for explaining it so clearly. What you want (one family, one journey from trial to enrolment) is exactly what Zooza's trial flow is built for. The duplicates come from the standard sign-up link, because it skips that flow.\n\nWhy duplicates are being created The standard enrolment link is a \"fresh\" sign-up. Zooza can't tell that the person is continuing from a trial, so it treats them as a brand-new customer. It creates a new record and asks all the questions again, including where they heard about you.\n\nHow the trial flow works After the trial, the parent should continue through their own personal enrolment link rather than the general sign-up link. They can get it two ways:\n\n- automatically by email, if the trial automation is switched on for the course, or\n\n- from their Parent Profile: while their trial is active, the profile shows an option to enrol, with a button that takes them straight to the enrolment form. (The trial needs to be paid for this to appear.)\n\nWhen they enrol this way:\n\n- the enrolment form opens with some of their details already pre-filled in, including the answers they gave when booking the trial, such as how they heard about you,\n\n- the new enrolment is linked to their trial booking and stays under the same customer,\n\n- the trial is automatically marked as won (converted), so your trial conversions are tracked.\n\nIn the system you'll still see two bookings, the trial and the enrolment, but they are connected and sit under one customer. You can follow the whole journey from there: original source → trial booked → trial attended → enrolled.\n\nWhat to set up\n\n1. Turn on the trial automation on the course(s) you offer trials for. Zooza then sends the parent their personal enrolment link automatically after the trial, so you don't need to send anything by hand.\n\n2. Stop sending the standard sign-up link to trial customers. The general link is for new customers only.\n\n3. Keep your \"How did you hear about us\" question in the same position in the trial course and the course customers enroll into. Their original answer will then be carried over automatically.\n\nTip: If a child should continue in a different class from the one they trialled in, you can recommend that class when you resolve the trial (the summary window that appears after you mark attendance for their final trial session). Their enrolment link will then take them straight to it. If you leave it empty, the link takes them to the class where the trial took place.\n\nBest regards,\n\nZooza team", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "Thanks for this, I did think this might be the case. 1- Turn on the trial automation Is it possible to check the trial automation I think I have this for all my actgive programmes WeeOnes,Twos, Threes, Fours and Kicks academy. Does the link get sent only when the child has been marked ont he calerndar as attended or does this happen ebven without this action. if it could that would be great.\n\n1. Stop sending the standard sign-up link to trial customers. T\n\n2. Keep your \"How did you hear about us\" question in the same position in the trial course and the course customers enroll into. Their original answer will then be carried over automatically.", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "[Image] sorry sent this too soon.\n1. Stop sending the standard sign-up link to trial customers.\nSo parent use th elinks which is sent out or they can juat log into their parent profile and complete enrolment. Is this simple and ovbious for them to do or are there some short instructions I could send just to ensure if They are doing this on their phone for example they can do this simply. 3. Keep your \"How did you hear about us\" question in the same position I've now changed this to a drop down menu so parents can select how they heard about us and I can track the marketing engine effectiveness.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Kieran,\n\nI've checked this properly for you and your WeeOnes setup is a good example of how the full trial → enrolment flow should work.\n\n1. Trial automation\n\nYour WeeOnes trial automation is already active here (scroll down):\n\nhttps://uk.zooza.app/#courses/104/settings?edit=trial\n\n[Image] At the moment it's set to:\n\n- send the enrolment link when the trial ends\n\n- send the first follow-up after 2 days\n\n- send a second follow-up 2 days later\n\n- if they still don't enrol, mark the trial as Trial Lost after a further 2 days\n\n- notify the parent when the trial is marked as lost\n\nHave a look through those timings and make sure you're happy with them.\n\nYou can then replicate the same setup across WeeTwos, WeeThrees, WeeFours and Kicks Academy. You can also use the Zooza AI connection you've set up to help with this – for example, ask it to check the trial settings across your programmes or set them consistently based on how you want the process to work.\n\n2. What triggers the enrolment email?\n\nThe automation starts once the trial has been completed and moved to Trial Ended.\n\nSo when you're doing your attendance after the trial session, Zooza takes you through resolving the trial and this is what starts the next part of the journey.\n\nThe parent then receives your Trial Ended email, which already contains their personal enrolment link.\n\nYou can see and edit that template here:\n\nhttps://uk.zooza.app/#communication/templates?type=registration_trial_ended\n\nYou also already have the Trial Follow-up and Trial Lost templates in your communication templates, which are used by the automation if they don't enrol.\n\n3. Parent Profile\n\nThe parent doesn't necessarily need to find the original email again either.\n\nWhile the enrolment opportunity is active, they'll see an ENROL NOW action directly in their Parent Profile. That takes them into the enrolment process for their existing trial rather than creating a completely new customer journey.\n\nI'd actually encourage parents to use their profile wherever possible – it's the simplest place for them to manage everything.\n\nSo your instruction to a parent can be as simple as:\n\nLog into your WeeKicks Parent Profile and select \"ENROL NOW\" under your child's trial.\n\n[Image]\n\n4. What happens when they enrol?\n\nIf they use this flow rather than your general public booking link, Zooza connects the enrolment to the existing trial/customer.\n\nOnce they complete the enrolment, the trial is automatically recorded as Won, so you can track the journey properly:\n\nOriginal marketing source → Trial → Enrolment\n\nThis is why I would stop sending the normal public sign-up link manually after a trial. Let the trial automation and Parent Profile handle that journey instead.\n\n5. \"How did you hear about us?\"\n\nI saw you've changed this to a dropdown ,,,that makes sense for tracking your marketing channels.\n\nThe important thing now is to keep that question consistent throughout the journey so you can retain the original acquisition source rather than asking the customer to effectively start again after their trial.\n\nSo overall, you're very close. I'd use the WeeOnes setup as your reference, check that you're happy with the automation timings, and then apply the same logic across your other active programmes.", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "[Image] Thank you for this — I’ll have a look through everything later today and make any necessary changes.\nI also wanted to check something regarding the payment plans.\nI have a customer who has had a change in circumstances and can no longer attend. They let me know on 14th September, which was before their next payment was scheduled on 21st September.\nLooking at their payment plan, I can see the payment was scheduled for 21st September, but the due date is 6th October.\nIs the gap between these dates related to the GoCardless collection process? And does the due date mean the date the payment is expected to clear/be received?\nI just wanted to understand whether this is the standard setup, as there seems to be quite a long period between the scheduled date and due date. Is there any way this can be shortened within the payment plan settings?\nIt would also be useful to understand, for cancellations like this one, which date determines whether the next payment can still be stopped — the scheduled date or the due date?\nThanks for your help!", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Kieran,\n\nThanks for the detail, that makes it easy to answer.\n\nThe 15-day gap is a setting, and you can change it.\n\nZooza raises each instalment 15 days before its due date by default. That's why you're seeing \"scheduled for 21 September, due 6 October\" , the 6th is the due date, and the 21st is when Zooza actually starts the collection.\n\nYou'll find it under Settings → Payment settings → Payment acceptance policy, in the field \"Days before booking is marked unpaid\". One thing to watch: yours is currently set to 0, and 0 means \"use the 15-day default\" rather than \"no gap\". To shorten it, put in an actual number — set it to 5, for example, and new instalments will be raised 5 days before their due date.\n\nhttps://uk.zooza.app/#settings/payment_settings\n\n[Image]\n\nWhy the gap is there. On the scheduled date, Zooza hands the payment to GoCardless and the direct debit collection begins. GoCardless then needs several working days to take the money and confirm it has cleared, often close to a week. The due date is the date we expect the money to actually be on your account, so the gap is the buffer that lets the collection complete on time. If you shorten it a lot, payments will still work, but they'll be more likely to confirm after the due date and show as overdue in the meantime. Something in the 5–10 day range is usually a comfortable middle ground.\n\nOne heads-up: this same number is also the grace period before an unpaid booking flips from \"Awaiting payment\" to \"Unpaid\". So a shorter setting means both a tighter collection window and a shorter grace period. Also, changing it applies to instalments created from that point on — payments already sitting in an existing plan keep the dates they were given.\n\nOn stopping a payment ,, it's the scheduled date that matters, not the due date. Once the scheduled date passes and the payment goes to GoCardless, it's on its way. So for your customer who cancelled on 14 September with a payment scheduled for the 21st, you had a week in hand , that one could be stopped cleanly.\n\nOne related setting worth knowing about, just below on the same page: \"Cooldown for stored card / direct debit\" under Payment created. For customers on direct debit, this lets you skip the \"payment created\" email if their previous payment in the same plan was less than N months ago , handy if a monthly plan is generating more email than your customers need. Set to 0 it always sends, and customers paying by bank transfer always get it regardless.\n\nHappy to help you pick a number if you tell me how your plans are usually spaced.", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "[Image] Thanks for explaning, I've got the Weeones trial automation as my temlpate which the others will follow. I did try and do this through my ChatGPT Zooza connection but it said it couldn't make the changes from the hidden part of the automation (I assume the attached image is what it is refering to) process I did screenshot as wel so perhaps a limiation from ChatGPT? thanks for the information on the payment length of time. I've changed this now to 5 days. } Thanks for your help. Kieran", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Kieran,\n\nYes, that's possible. There are still some areas of Zooza that the AI connection can't access or change yet, so it may well be a current limitation.\n\nOne useful thing you can do directly in ChatGPT is ask it to report the missing capability to the Zooza team. The connection can raise this as a request directly on our server, so our developers can see it and use it to improve what the AI can do.\n\nWe're still expanding the capabilities, so feedback like this is genuinely useful.\n\nBest", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "Thanks have done this now so it should report these to you now 👍", "cited": []}], "verdict": "verify", "vtitle": "Prečo je medzi naplánovaním a splatnosťou splátky 15 dní a ktorý dátum rozhoduje o zastavení platby", "vnote": "Vlákno začalo 22. 9. (prvá správa zákazníka v e-maile nie je); do sledovaného okna patrí odpoveď o trial flow (26. 9.), otázka o splátkach (28. 9.) a odpoveď (29. 9.), preto kategória ‚payments‘. Odpovede sú hodnotné do dokumentácie, ale obsahujú konkrétne produktové tvrdenia, ktoré treba pred zápisom overiť: default 15 dní a ‚0 = použi default, nie žiadny odstup‘ v poli ‚Days before booking is marked unpaid‘; to isté číslo je aj grace period Awaiting payment → Unpaid; zmena platí len pre nové splátky; o zastavení rozhoduje scheduled date; ‚Cooldown for stored card / direct debit‘. Trial flow (osobný enrolment link, ENROL NOW v Parent Profile, spúšťač = Trial Ended, prenesenie odpovede ‚How did you hear about us‘) je tiež materiál pre dokumentáciu. AI: ChatGPT napojenie nevedelo zmeniť ‚skrytú časť‘ trial automatizácie – zákazník to nahlásil cez konektor; je to produktový podnet. Splátky v tom istom týždni riešila aj ELA Jazykovka (email-02).", "cat": "payments", "from": "Kieran Townsend (WeeKicks Central Berks)"}, {"channel": "intercom", "id": "215476047149616", "date": e questions again, including where they heard about you.\n​\n\n\nHow the trial flow works\nAfter the trial, the parent should continue through their own personal enrolment link rather than the general sign-up link. They can get it two ways:\n\n\n\n\n- \nautomatically by email, if the trial automation is switched on for the course, or\n\n- \nfrom their Parent Profile: while their trial is active, the profile shows an option to enrol, with a button that takes them straight to the enrolment form. (The trial needs to be paid for this to appear.)\n\nWhen they enrol this way:\n\n\n\n\n- the enrolment form opens with some of their details already pre-filled in, including the answers they gave when booking the trial, such as how they heard about you,\n\n- the new enrolment is linked to their trial booking and stays under the same customer,\n\n- the trial is automatically marked as won (converted), so your trial conversions are tracked.\n\nIn the system you'll still see two bookings, the trial and the enrolment, but they are connected and sit under one customer. You can follow the whole journey from there: original source → trial booked → trial attended → enrolled.\n\n\nWhat to set up\n\n\n\n\n- \nTurn on the trial automation on the course(s) you offer trials for. Zooza then sends the parent their personal enrolment link automatically after the trial, so you don't need to send anything by hand.\n\n- \nStop sending the standard sign-up link to trial customers. The general link is for new customers only.\n\n- \nKeep your \"How did you hear about us\" question in the same position in the trial course and the course customers enroll into. Their original answer will then be carried over automatically.\n\nTip: If a child should continue in a different class from the one they trialled in, you can recommend that class when you resolve the trial (the summary window that appears after you mark attendance for their final trial session). Their enrolment link will then take them straight to it. If you leave it empty, the link takes them to the class where the trial took place.\n\n\n\n\n\n\n\n\nBest regards,\n\n\nZooza team", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "Thanks for this, I did think this might be the case. \n\n1- Turn on the trial automation \nIs it possible to check the trial automation I think I have this for all my actgive programmes WeeOnes,Twos, Threes, Fours and Kicks academy.\n\nDoes the link get sent only when the child has been marked ont he calerndar as attended or does this happen ebven without this action. if it could that would be great. \n​\n\n\n\n\n- \nStop sending the standard sign-up link to trial customers. T\n\n- \nKeep your \"How did you hear about us\" question in the same position in the trial course and the course customers enroll into. Their original answer will then be carried over automatically.", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "sorry sent this too soon.\n​\n\n\n\n\n- \n Stop sending the standard sign-up link to trial customers. \n\nSo parent use th elinks which is sent out or they can juat log into their parent profile and complete enrolment. Is this simple and ovbious for them to do or are there some short instructions I could send just to ensure if They are doing this on their phone for example they can do this simply. \n\n3. Keep your \"How did you hear about us\" question in the same position\n\nI've now changed this to a drop down menu so parents can select how they heard about us and I can track the marketing engine effectiveness.\n\n \n\n\n\n​", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Kieran,\n\n\nI've checked this properly for you and your WeeOnes setup is a good example of how the full trial → enrolment flow should work.\n\n\n1. Trial automation\nYour WeeOnes trial automation is already active here (scroll down):\n\n\nhttps://uk.zooza.app/#courses/104/settings?edit=trial\n\n\nAt the moment it's set to:\n\n\n\n
