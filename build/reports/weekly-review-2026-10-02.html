appens when they enrol?\nIf they use this flow rather than your general public booking link, Zooza connects the enrolment to the existing trial/customer.\n\n\nOnce they complete the enrolment, the trial is automatically recorded as Won, so you can track the journey properly:\n\n\nOriginal marketing source → Trial → Enrolment\n\n\nThis is why I would stop sending the normal public sign-up link manually after a trial. Let the trial automation and Parent Profile handle that journey instead.\n\n\n\n\n\n5. \"How did you hear about us?\"\nI saw you've changed this to a dropdown ,,,that makes sense for tracking your marketing channels.\n\n\nThe important thing now is to keep that question consistent throughout the journey so you can retain the original acquisition source rather than asking the customer to effectively start again after their trial.\n\n\n\n\n\nSo overall, you're very close. I'd use the WeeOnes setup as your reference, check that you're happy with the automation timings, and then apply the same logic across your other active programmes.", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "Thank you for this — I’ll have a look through everything later today and make any necessary changes.\n\n\nI also wanted to check something regarding the payment plans.\n\n\nI have a customer who has had a change in circumstances and can no longer attend. They let me know on 14th September, which was before their next payment was scheduled on 21st September.\n\n\nLooking at their payment plan, I can see the payment was scheduled for 21st September, but the due date is 6th October.\n\n\nIs the gap between these dates related to the GoCardless collection process? And does the due date mean the date the payment is expected to clear/be received?\n\n\nI just wanted to understand whether this is the standard setup, as there seems to be quite a long period between the scheduled date and due date. Is there any way this can be shortened within the payment plan settings?\n\n\nIt would also be useful to understand, for cancellations like this one, which date determines whether the next payment can still be stopped — the scheduled date or the due date?\n\n\nThanks for your help!", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Kieran,\n\n\nThanks for the detail, that makes it easy to answer.\n\n\nThe 15-day gap is a setting, and you can change it.\n\n\n\n\n\nZooza raises each instalment 15 days before its due date by default. That's why you're seeing \"scheduled for 21 September, due 6 October\" , the 6th is the due date, and the 21st is when Zooza actually starts the collection.\n\n\n\n\n\nYou'll find it under Settings → Payment settings → Payment acceptance policy, in the field \"Days before booking is marked unpaid\". One thing to watch: yours is currently set to 0, and 0 means \"use the 15-day default\" rather than \"no gap\". To shorten it, put in an actual number — set it to 5, for example, and new instalments will be raised 5 days before their due date.\n\n\nhttps://uk.zooza.app/#settings/payment_settings\n\n\n\n\n\nWhy the gap is there. On the scheduled date, Zooza hands the payment to GoCardless and the direct debit collection begins. GoCardless then needs several working days to take the money and confirm it has cleared, often close to a week. The due date is the date we expect the money to actually be on your account, so the gap is the buffer that lets the collection complete on time. If you shorten it a lot, payments will still work, but they'll be more likely to confirm after the due date and show as overdue in the meantime. Something in the 5–10 day range is usually a comfortable middle ground.\n\n\n\n\n\nOne heads-up: this same number is also the grace period before an unpaid booking flips from \"Awaiting payment\" to \"Unpaid\". So a shorter setting means both a tighter collection window and a shorter grace period. Also, changing it applies to instalments created from that point on — payments already sitting in an existing plan keep the dates they were given.\n\n\n\n\n\nOn stopping a payment ,, it's the scheduled date that matters, not the due date. Once the scheduled date passes and the payment goes to GoCardless, it's on its way. So for your customer who cancelled on 14 September with a payment scheduled for the 21st, you had a week in hand , that one could be stopped cleanly.\n\n\n\n\n\nOne related setting worth knowing about, just below on the same page: \"Cooldown for stored card / direct debit\" under Payment created. For customers on direct debit, this lets you skip the \"payment created\" email if their previous payment in the same plan was less than N months ago , handy if a monthly plan is generating more email than your customers need. Set to 0 it always sends, and customers paying by bank transfer always get it regardless.\n\n\n\n\n\nHappy to help you pick a number if you tell me how your plans are usually spaced.", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "Thanks for explaning, I've got the Weeones trial automation as my temlpate which the others will follow. I did try and do this through my ChatGPT Zooza connection but it said it couldn't make the changes from the hidden part of the automation (I assume the attached image is what it  is refering to) process I did screenshot as wel so perhaps a limiation from ChatGPT?\n\nthanks for the information on the payment length of time. I've changed this now to 5 days. }\n\nThanks for your help.\n\nKieran", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Kieran,\n\n\nYes, that's possible. There are still some areas of Zooza that the AI connection can't access or change yet, so it may well be a current limitation.\n\n\nOne useful thing you can do directly in ChatGPT is ask it to report the missing capability to the Zooza team. The connection can raise this as a request directly on our server, so our developers can see it and use it to improve what the AI can do.\n\n\nWe're still expanding the capabilities, so feedback like this is genuinely useful.\n\n\nBest", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "Thanks have done this now so it should report these to you now 👍", "cited": []}], "verdict": "gap", "vtitle": "Trial to enrolment creates a duplicate client unless the personal link is used", "vnote": "Best answer of the week and fully general. The standard sign-up link is a fresh sign-up, so Zooza cannot tell the person is continuing from a trial and creates a second customer record. After the trial the parent must continue through their own personal enrolment link, which is what the trial flow is built for. Directly answers the duplicate-client complaints. Related: 215476112052967 (one trial per person) and 215476086122998 (duplicate attendees).", "cat": "trials"}, {"channel": "intercom", "id": "215476177700356", "date": "2026-09-30 18:42", "day": "2026-09-30", "human": false, "bucket": "D_assumed_with_kb", "reask": 5, "resolution": "confirmed_resolution", "rating": null, "carried": null, "sources": ["Billing and invoicing | Zooza Help", "Automatic payment reminders | Zooza Help", "Dynamic tags | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Automatic reminders for payment schedule | Zooza Help", "Automated notifications overview | Zooza Help", "Invoicing in Zooza — Overview | Zooza Help", "Choose which invoice profile applies | Zooza Help"], "q": "is it possible for a booking to have a different invoicing profile than its class?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "is it possible for a booking to have a different invoicing profile than its class?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes. A booking can have a different invoice profile than its class. \n\n\nZooza resolves invoicing through this chain:\n\n\nDefault profile → Programme → Class → Booking.\n\n\nThe lowest level that has a profile set wins. So if you set a profile on the booking, it overrides the class profile. \n\n\nYou can change it in the Invoicing card on the booking’s Payments screen.", "cited": ["Choose which invoice profile applies | Zooza Help", "Billing and invoicing | Zooza Help", "Invoicing in Zooza — Overview | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any additional help with invoice profiles or booking settings, I’m here to help. Would you like to share more about what you’re trying to configure?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "I am not sure. We are not issuing invoices for the booking, we just want them to receive the correct payment notification", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Good question — this is different from invoicing.\n\n\nPayment notifications are not controlled by the invoice profile. They are controlled by notification settings instead. \n\n\n\n\n- Global payment notifications are configured in Settings → Billing & Payments → Payment settings → Scheduled-payment notifications. \n\n\n- Per-programme reminders (like overdue or upcoming payments) are configured in Programmes → programme → Settings → Price and payment → Payment Reminder Settings.\n\nSo if you want different payment notifications, you would configure them at the programme level, not via the booking’s invoice profile.", "cited": ["Automated notifications overview | Zooza Help", "Automatic payment reminders | Zooza Help", "Automatic reminders for payment schedule | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Yes it did and it s not the answer I d hope for", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I understand that the information provided may not have met your expectations. Please feel free to share more details about what you are trying to achieve with payment notifications or invoicing. I am here to help you find the best solution for your needs.", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "I wish I could change the payment data included in the notification settings for specific bookings only", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Mara, the short answer is no — payment notification content cannot be customised per booking.\n\n\nWhat you can do:\n\n\n\n\n- Global payment notifications are configured in Settings → Billing & Payments → Payment settings. \n\n\n- Per‑programme reminders are configured in Programmes → programme → Settings → Price and payment → Payment Reminders.\n\nSo the notification text and settings apply to all bookings in that programme. You cannot change the payment data included in those notifications for a single booking only. \n\n\nThe only booking‑level customisation available is the Awaiting payment deadline, which can be changed per booking.", "cited": ["Payments and Billing FAQ | Zooza Help", "Automated notifications overview | Zooza Help", "Dynamic tags | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "got it", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I'm glad to hear that you understood the information. If you have any more questions or need further assistance, please feel free to ask. I'm here to help! 😊", "cited": []}], "verdict": "check", "vtitle": "Can a booking use a different invoicing profile from its class (asked 5 times)", "vnote": "We have guides/invoice-profile-overrides.md. Five re-asks says it is either not findable or does not answer the question as posed. Read it before writing anything new.", "cat": "payments"}, {"channel": "email", "id": "email-14", "date": "2026-09-30 17:27", "day": "2026-09-30", "human": true, "bucket": "EMAIL", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Billing setup – neúplná adresa na faktúrach v SmartBill / e-Factura", "turns": [{"role": "customer", "who": "Bianca Chitoranu", "text": "Hi Michal,\n\nHow are you? I hope everything is fine on your side 🙂\nWe have started the enrollments and we have already clients that paid for the course, which led me to find again the errors in smart bill, where the address is incomplete and the invoices are not sent automatically in E-factura.\nSo, to resolve this I created 2 separate lines in the enrollment page, but I need you to tell me if smart bill will automatically import the data from there. If not, tell me how to make it mandatory for parents to complete it to make sure the info will then be imported in smartbill.\n\nThanks a lot!", "cited": []}, {"role": "human", "who": "Michal", "text": "Hi Bianca,\n\nFirst of all, how are *you* doing? 😊 How are you feeling? I hope you’re enjoying these weeks and your new way of life! Hopefully we’ll get a chance to catch up sometime over the next few weeks if you have some time. 🙂\n\nRegarding the address: yes, the first thing is that the *Address field needs to be enabled and set as mandatory* in the booking form.\n\nYou can do this under:\n\n*Programme settings → Additional fields → Address → Mandatory*\n\nFor example, on this programme the Address field isn’t currently enabled at all:\nhttps://zooza.app/#courses/8197/settings?edit=extra_fields\n\n[image: image.png]\n\nYou don’t need to create separate custom fields for the address; use the standard *Address* field, as this is the information connected to the client and invoicing.\n\nFor registrations that already exist, you can also go to *Registration → Invoices* and edit the buyer information manually. There is also a refresh button there (by the invoice number - right bottom corner), which should send an update request to SmartBill.\n\n[image: image.png]\n\nGive that a try. In the meantime, I’ll double-check with our guys exactly how SmartBill handles updates to buyer information, as every invoicing system allows slightly different things.\n\nBest,\nMichal", "cited": []}], "verdict": "verify", "vtitle": "Faktúry do SmartBill/e-Factura idú bez úplnej adresy, lebo zákazníčka zbiera adresu vo vlastných poliach namiesto štandardného poľa Address", "vnote": "Mimo pôvodného zoznamu odosielateľov. Všeobecne platné a do dokumentácie (najmä pre RO trh s e-Factura): adresu pre fakturáciu treba zbierať štandardným poľom Address (Programme settings → Additional fields → Address → Mandatory), nie vlastnými poľami; pri existujúcich registráciách sa kupujúci dá upraviť v Registration → Invoices. ‚Verify‘ preto, že Michal sám píše, že tlačidlo refresh ‚should‘ poslať update do SmartBillu a že si to overí s vývojom – výsledok vo vlákne nie je; od Bianky odpoveď zatiaľ neprišla. SmartBill integrácia robí problémy v ten istý týždeň aj Scoala de Actorie Metamorfoza (email-13) – stojí za to pozrieť ju ako celok.", "cat": "payments", "from": "Bianca Chitoranu (Young Engineers București)"}, {"channel": "email", "id": "email-13", "date": "2026-09-30 16:34", "day": "2026-09-30", "human": true, "bucket": "EMAIL", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Re: Summary of Today's Zooza Meeting – Course & Group Pricing Setup", "turns": [{"role": "customer", "who": "Stefan Nastase", "text": "Hi,\n\nPlease, I had the following two questions:\n\nHow can a Membership programme offer a second payment option — one payment for the whole year, with a discount — alongside the monthly payment option? Is this possible at all, or is it excluded by design because a membership has no fixed end date?\n\nIf an annual prepayment with a discount is not possible under Membership, what would you recommend instead — the “old” payment method we used before, or a different structure?\n\nCould we please continue with the setup so we can finalize everything?\n\nWhat would the next steps be?\n\nThank you!\n\nStefan", "cited": []}, {"role": "customer", "who": "Stefan Nastase", "text": "Hi Katarína,\n\nHow can we move forward with the implementation?\n\nThank you!\n\nStefan", "cited": []}, {"role": "human", "who": "Michal", "text": "Hi Stefan,\n\nThanks for copying me in. I'll take this one.\n\nA quick request first: please send questions like this to *support@zooza.online* or open a ticket in Zooza. That way nothing gets lost and whoever is on duty can pick it up straight away.\n\nTo your questions:\n\n*1. Can Membership offer monthly and annual payment side by side?*\nYes. You can set up two membership payment options on the same group or programme:\n\n   - *Monthly membership*: billed every month\n   - *Annual membership*: billed once a year, with your discount built into the price\n\nYour client then chooses the option that suits them. Because a membership has no fixed end date, both options simply keep renewing while the registration is active or class has sessions.\n\n*2. Should you go back to the \"old\" payment method?*\nNo, there's no need. Membership covers both options, so you can keep it as your model.\n\n*Next steps*\nPlease send us (keeping support@zooza.online in cc) a link to the programme or group where you're setting this up. We'll take a look and help you finish the configuration.\n\nBest regards,\nMichal", "cited": []}, {"role": "customer", "who": "Stefan Nastase", "text": "Hi Martin,\n\nWe have now been through the whole registration flow, the parent profile and every email template. Below is everything we need from you, in our order of priority. We are close to opening registration to real parents, so at the end I also ask about booking a call with you.\n\n0A) zooza It is calling the SmartBill API every 5 minutes and locking our SmartBill account\n\nSmartBill's own support has told us that our account is receiving a request roughly every 5 minutes, querying the invoice series, and that this is what is getting our account locked. Their instruction to us was literally: stop the trigger that keeps sending requests to SmartBill.\n\nWe cannot find any such trigger in Zooza. It is quite possible that we did not set the SmartBill integration up correctly — we never fully understood how it is supposed to work.\n\n0B) An invoice was issued and emailed on its own (30 September 2026, 11:40)\n\nAn email went out to stevejr110@gmail.com with the subject \"Factura noua pentru:\", carrying invoice no. 1 for 2,180 RON, made out to \"Steve Test\". Nobody on our side clicked anything.\n\nThe invoice record (#payments/invoices/69572) says \"INVOICING SYSTEM: smart_bill\", which again points at the integration still being live on your side.\n\nIt is tied to a test booking from 16 August, in a test class called \"ZZ TEST regula 3 ore\". That class has since been DELETED, and so has the booking. There is no pending scheduled payment left either — all 42 are \"Processed\".\n\nOn the PDF: Issue date 16.8.2026, but Supply date 30.9.2026. So the document was generated TODAY and back-dated to August.\n\nWe checked our SmartBill account: there is no document there — not on 16.08, not on 30.09. So the invoice was produced entirely by Zooza, using our own invoice profile numbering.\n\n0C) How do we delete this invoice?\n\nWe cannot delete or cancel it from the app. The \"Edit\" button answers: \"Invoices can only be edited in your invoice management system. To edit, go to the application.\" But there is no document in SmartBill to go to — the invoice exists only inside Zooza.\n\n0D) Two defects in the invoice document and email\n\n- The invoice PDF is entirely in English, with \"ks\" as the unit of measure. For Romanian customers it would need to be in Romanian, with \"buc\".\n- In the invoice email, the company name is followed by a stray \">\" (\"Scoala de Actorie Metamorfoza>\"), and the last line of the body is just \"9554\", which is the course id.\n\n1) The \"(Offline)\" templates — which one is sent, and how do we edit them?\n\nWe have pairs of templates: \"New Payment\" and \"New Payment (Offline)\", \"Upcoming Payment\" / \"(Offline)\", \"Missed Payment\" / \"(Offline)\". We collect by bank transfer.\n\nWe have written good Romanian copy for the ones without \"(Offline)\", but we suspect parents actually receive the \"(Offline)\" ones, which still carry your default text.\n\nCould you confirm which variant is sent for bank transfer? And what switches between them — the payment method on the course, or the payment collection setup?\n\nOn top of that, the three \"(Offline)\" templates cannot be edited at all: when we open them, the \"Version\" selector is empty and neither the subject field nor the editor appears. How do we create a version for them?\n\n2) Two templates that are not translated into Romanian\n\n- \"User Template\" (the manual message): the subject is `email_user_template_subject` and the body is `email_user_template_body` — the keys, not the text. If we send a manual message, is that what the parent receives?\n- The template list contains one named `email_templates__name__sessions_booked`, also untranslated.\n\n3) The default Romanian translations contain errors\n\nIn \"New Payment\" and \"Upcoming Payment\" (the default variants):\n- broken HTML: `\u003c/strong>>` and `\u003cstrong>strong>`; the table is opened once and closed twice\n- words left in English: \"Payment is due\", \"Sum\"\n- an invalid colour value: `#efefefef`\n\n4) The \"Payments\" tab in the profile breaks on an unconfirmed booking\n\nIt does not open. Console: TypeError: Cannot read properties of undefined (reading 'total_debt'), in course_detail_tab_payments.\n\nOn the same screen, the \"Make-up sessions\" card reads \"you are entitled to undefined make-up sessions\".\n\n5) Date of birth is not pre-filled for an existing child\n\nIn the registration form, when a parent picks a child they have already registered before, the date of birth is not filled in, even though the field is required. The widget has code for this (DOB_PRESET), but the child data arrives without a date.\n\n6) A template that does not appear in the interface\n\n\"registration_invitation_confirmation\" — the email we use to invite a parent we have registered ourselves — exists in the data but does not appear in the template list in the app, so we cannot edit it. Its text says \"press the confirmation button\", but there is no button in it; we suspect the confirmation tag is missing. How do we edit it?\n\n7) Notification center does not open\n\nSettings -> Notification center stays blank. Console: Uncaught Error: Unknown component 'notification_center' (knockout.min.js).\n\n8) Importing our existing clients — about 300 children\n\nThis is the last big step before we can start using Zooza for real, and we would rather not get it wrong.\n\n- Does the import send emails to parents (for example \"Booking imported\" or an account-ready message)? We are importing many children at once and we do not want mail going out without knowing.\n- If it does, can it be switched off for the duration of the import, and then switched on again?\n- Can you confirm the exact column format you expect, and send us a sample file that is known to work?\n- Can the import create the booking in a specific class and with a specific payment schedule, or do we set those afterwards?\n- Is there a way to run a trial import of two or three rows and roll it back if something is wrong?\n- What happens on a second import if a parent or child already exists — duplicate, or match and update?\n\nWhere we are — what we have already set up\n\nSo you know what state the account is in before the call, here is what is done on our side.\n\nOn the website (suntemsam.ro, WordPress):\n- We built our own plugin around your two widgets, the registration form and the parent profile.\n- The form: Romanian copy throughout, numbered headings when a parent registers a second child, an age warning when the child does not fit the age range of the class, and the site's own visual design.\n- The profile: the same design language as the form, a mobile layout for the tabs, copy-to-clipboard buttons for the IBAN and the payment reference, and a few translation fixes.\n- Both were tested at phone width as well as desktop.\n\nIn Zooza:\n- All 14 programmes moved to the Membership price type.\n- Monthly membership templates active: 545 RON, and 650 RON for the English-language programmes. We also built the annual one, but deliberately left it inactive, since the window for paying the full year has passed.\n- The previous payment model has been deleted.\n- Late bookings set to automatic confirmation on all programmes, so the payment schedule is applied without us intervening. We verified this with a real test booking end to end.\n- Make-up sessions: credits expire 90 days after the entitlement is created; the per-programme limit is left at 0, which your documentation says means \"as many as there are sessions in the class\".\n- We rewrote 10 email templates in Romanian, keeping your merge tags intact, and added two things that were missing from the parent's point of view: the discount code and the link to the form.\n- Two invoice profiles exist (a sole trader and a company); the sole trader one is the default.\n- All test bookings and test classes have been deleted.\n\nWhat is still open on our side, and which is why we are asking for a call: the three \"(Offline)\" templates we cannot edit, the SmartBill situation above, and the import of roughly 300 children.\n\n9) Could we book a call to finish the setup?\nI think I have reached the limit of what I can do with Claude, and I need help for the final parts.\n\nWe are at the point where the remaining questions are faster to settle live than by email. Could we book one or two screen-share sessions with someone from your team?\n\nWhat we would want to go through:\n- the SmartBill integration\n- the invoicing question above, until we are sure nothing is issued automatically\n- which payment templates actually reach parents on bank transfer\n- a dry run of the client import, together, before we do all 300\n- a final review of our settings before we open registration: payment schedules, late bookings, make-up sessions, the emails that go out at each step\n- a walk-through of our zooza setting, plus some form of training, so that we learn to use the system properly.\n\nPlease let us know what times suit you in the following days, and whether this is included in our plan or something we pay for — either is fine, we just want it done properly.\n\nThank you,\nStefan", "cited": []}, {"role": "human", "who": "Martin", "text": "hi Stefan, let's arrange a meeting on Friday morning. Please do send an invite to whatever time suits you best. I have no meetings in the morning:)\nLooking forward meeting you again:)\nMartin", "cited": []}], "verdict": "product", "vtitle": "Nový rumunský zákazník pred spustením narazil na sériu chýb: SmartBill integrácia volá API každých 5 min, faktúra sa vystavila sama, rozbité šablóny a widgety", "vnote": "Mimo pôvodného zoznamu odosielateľov (madalina.marcus81@gmail.com, podpis Stefan; škola podľa e-mailu ‚Scoala de Actorie Metamorfoza‘, web suntemsam.ro). Najdôležitejšie vlákno týždňa mimo zoznamu. Prvá otázka (24. 9., mimo okna) je v turns kvôli kontextu. Správa z 30. 9. obsahuje konkrétne, reprodukovateľné chyby – na Jiru: (0A) SmartBill dotaz na sériu faktúr každých ~5 min, SmartBill im účet zamyká; (0B) faktúra č. 1 na 2 180 RON vystavená a odoslaná sama k zmazanej testovacej registrácii, issue date 16. 8., supply date 30. 9., v SmartBille neexistuje; (0C) nedá sa zmazať; (0D) PDF faktúry v angličtine s jednotkou ‚ks‘, v e-maile zvyšok ‚>‘ a ID kurzu ‚9554‘; (1) šablóny ‚(Offline)‘ nemajú verziu a nedajú sa editovať; (2) netranslatované kľúče email_user_template_subject/body a email_templates__name__sessions_booked; (3) rozbité HTML a anglické slová v rumunskom preklade New/Upcoming Payment; (4) tab Payments v profile padá (total_debt undefined) a ‚entitled to undefined make-up sessions‘; (5) dátum narodenia sa nepredvyplní pre existujúce dieťa; (6) šablóna registration_invitation_confirmation nie je v zozname; (7) Notification center prázdny (Unknown component 'notification_center'). Plus otázky na import ~300 detí (posiela import e-maily? formát, skúšobný import, duplicity) – to je ‚gap‘ do dokumentácie. Michalova odpoveď o mesačnom + ročnom členskom vedľa seba treba overiť proti tomu, čo tím v ten istý týždeň písal ELA Jazykovke o členskom (email-02). Martin navrhol stretnutie v piatok 2. 10. ráno; na samotné body e-mailom nikto neodpovedal. Zákazník píše, že ‚došiel na limit toho, čo zvládne s Claude‘. SmartBill rieši v ten istý týždeň aj Young Engineers București (email-14).", "cat": "payments", "from": "Stefan Nastase (Scoala de Actorie Metamorfoza)"}, {"channel": "intercom", "id": "215476172816216", "date": "2026-09-30 14:59", "day": "2026-09-30", "human": false, "bucket": "D_assumed_with_kb", "reask": 3, "resolution": "confirmed_resolution", "rating": null, "carried": null, "sources": ["Create a programme | Zooza Help", "Programmes List | Zooza Help", "Price and payment setup | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Class Detail | Zooza Help", "FAQ — Programmes | Zooza Help"], "q": "I have a programme with a price per session and included  in that programme there is a class with a different duration per session and a different price per session. How can I set them?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "I have a programme with a price per session and included  in that programme there is a class with a different duration per session and a different price per session. How can I set  "I think it s alright now, thx", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You are very welcome, Mara! I am glad to hear that everything is working correctly now. Please feel free to reach out if you need any further assistance in the future.", "cited": []}], "verdict": "gap", "vtitle": "A class with a different session length and price inside a programme priced per session", "vnote": "Asked three times. Whether per-session price can be overridden at class level is a basic pricing fact.", "cat": "pricing"}, {"channel": "intercom", "id": "215476169000541", "date": "2026-09-30 14:49", "day": "2026-09-30", "human": true, "bucket": "HUMAN", "reask": 1, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Problem s prihlasenim do profilu\n\nDobry den, prosim o pomoc s prihlasovanim do profilu na ela-jazykovka.sk\nDostali sme feedback od studentov ze im “nefunguje prihlasenie do profilu” (info cez lektora)\nViac informacii zistujem, ale teda ani neviem co je presne za problem, ci neprisiel kod alebo co..ale vraj to “nefunguje”\nJedna sa o tieto registracie:\n1. dobrovodskyr@gmail.com - reg: 521289\n2. barborka.hazikova@gmail.com  - Reg: 521399\n3. blescakova.a@centrum.sk -reg:521446\n4. basa.slovakova@gmail.com  - reg: 523627\n5. smejdirova.e@gmail.com - reg: 529129\n6. lu.kruzliakova@gmail.com  - Reg: 538485\n\nVedeli by ste to prosim overit ci vobec sa snazili prihlasit alebo ci tam vidite nejaky problem?\n\nDakujem za pomoc\nB", "turns": [{"role": "customer", "who": null, "text": "Problem s prihlasenim do profilu\n\nDobry den, prosim o pomoc s prihlasovanim do profilu na ela-jazykovka.sk\nDostali sme feedback od studentov ze im “nefunguje prihlasenie do profilu” (info cez lektora)\nViac informacii zistujem, ale teda ani neviem co je presne za problem, ci neprisiel kod alebo co..ale vraj to “nefunguje”\nJedna sa o tieto registracie:\n1. dobrovodskyr@gmail.com - reg: 521289\n2. barborka.hazikova@gmail.com  - Reg: 521399\n3. blescakova.a@centrum.sk -reg:521446\n4. basa.slovakova@gmail.com  - reg: 523627\n5. smejdirova.e@gmail.com - reg: 529129\n6. lu.kruzliakova@gmail.com  - Reg: 538485\n\nVedeli by ste to prosim overit ci vobec sa snazili prihlasit alebo ci tam vidite nejaky problem?\n\nDakujem za pomoc\nB", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dear barbora,\n\n\nyour ticket  has been received. Zooza Assistant will try to help you right away — and a member of our team will personally review it too.\n\n\n— Zooza Support", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Barbora, ano pozrieme sa na to. Kazdopadne to ci a kedy naposledy bol klient prihlaseny v profile vidite aj priamo na detaile registracie. Skusal som pozerat pana dobrovodskeho a uplne v pohode som sa vedel prihlasit priamo z login emailu o ktory ziadal. Cize bude treba asi upresnit alebo poslat nejake screenshoty, ze co im nefunguje", "cited": []}, {"role": "customer", "who": "barbora zajacová", "text": "aha vidite, to ma nenapadlo pozriet na tej registracii. pozriem sa este, zajtra s nimi ma lektorka hodinu tak ma prikazane zistit viac. dakujem", "cited": []}], "verdict": "gap", "vtitle": "Where to see whether and when a client last logged into their profile", "vnote": "Reported as 'login does not work' with no detail. The reusable part of the answer: whether and when the client last logged into the portal is visible on the registration detail, and an admin can test the magic link from the login email themselves. Good first-line triage step.", "cat": "clients"}, {"channel": "intercom", "id": "215476172289777", "date": "2026-09-30 14:35", "day": "2026-09-30", "human": false, "bucket": "D_assumed_with_kb", "reask": 0, "resolution": "routed_to_team", "rating": null, "carried": "2026-09-30", "sources": [], "q": "Hi Martin,\nWe have now been through the whole registration flow, the parent profile and every email template. Below is everything we need from you, in our order of priority. We are close to opening registration to real parents, so at the end I also ask about booking a call with you.\n\n\n0A) zooza It is calling the SmartBill API every 5 minutes and locking our SmartBill account\nSmartBill's own support has told us that our account is receiving a request roughly every 5 minutes, querying the invoice series, and that this is what is getting our account locked. Their instruction to us was literally: stop the trigger that keeps sending requests to SmartBill.\nWe cannot find any such trigger in Zooza. It is quite possible that we did not set the SmartBill integration up correctly — we never fully understood how it is supposed to work.\n0B) An invoice was issued and emailed on its own (30 September 2026, 11:40)\nAn email went out to stevejr110@gmail.com with the subject \"Factura noua pentru:\", carrying invoice no. 1 for 2,180 RON, made out to \"Steve Test\". Nobody on our side clicked anything.\nThe invoice record (#payments/invoices/69572) says \"INVOICING SYSTEM: smart_bill\", which again points at the integration still being live on your side.\nIt is tied to a test booking from 16 August, in a test class called \"ZZ TEST regula 3 ore\". That class has since been DELETED, and so has the booking. There is no pending scheduled payment left either — all 42 are \"Processed\".\nOn the PDF: Issue date 16.8.2026, but Supply date 30.9.2026. So the document was generated TODAY and back-dated to August.\nWe checked our SmartBill account: there is no document there — not on 16.08, not on 30.09. So the invoice was produced entirely by Zooza, using our own invoice profile numbering.\n\n\n0C) How do we delete this invoice?\nWe cannot delete or cancel it from the app. The \"Edit\" button answers: \"Invoices can only be edited in your invoice management system. To edit, go to the application.\" But there is no document in SmartBill to go to — the invoice exists only inside Zooza.\n\n\n0D) Two defects in the invoice document and email\n- The invoice PDF is entirely in English, with \"ks\" as the unit of measure. For Romanian customers it would need to be in Romanian, with \"buc\".- In the invoice email, the company name is followed by a stray \">\" (\"Scoala de Actorie Metamorfoza>\"), and the last line of the body is just \"9554\", which is the course id.\n\n1) The \"(Offline)\" templates — which one is sent, and how do we edit them?\nWe have pairs of templates: \"New Payment\" and \"New Payment (Offline)\", \"Upcoming Payment\" / \"(Offline)\", \"Missed Payment\" / \"(Offline)\". We collect by bank transfer.\nWe have written good Romanian copy for the ones without \"(Offline)\", but we suspect parents actually receive the \"(Offline)\" ones, which still carry your default text.\nCould you confirm which variant is sent for bank transfer? And what switches between them — the payment method on the course, or the payment collection setup?\nOn top of that, the three \"(Offline)\" templates cannot be edited at all: when we open them, the \"Version\" selector is empty and neither the subject field nor the editor appears. How do we create a version for them?\n\n2) Two templates that are not translated into Romanian\n- \"User Template\" (the manual message): the subject is `email_user_template_subject` and the body is `email_user_template_body` — the keys, not the text. If we send a manual message, is that what the parent receives?- The template list contains one named `email_templates__name__sessions_booked`, also untranslated.\n\n3) The default Romanian translations contain errors\nIn \"New Payment\" and \"Upcoming Payment\" (the default variants):- broken HTML: `\u003c/strong>>` and `\u003cstrong>strong>`; the table is opened once and closed twice- words left in English: \"Payment is due\", \"Sum\"- an invalid colour value: `#efefefef`\n\n4) The \"Payments\" tab in the profile breaks on an unconfirmed booking\nIt does not open. Console: TypeError: Cannot read properties of undefined (reading 'total_debt'), in course_detail_tab_payments.\nOn the same screen, the \"Make-up sessions\" card reads \"you are entitled to undefined make-up sessions\".\n\n5) Date of birth is not pre-filled for an existing child\nIn the registration form, when a parent picks a child they have already registered before, the date of birth is not filled in, even though the field is required. The widget has code for this (DOB_PRESET), but the child data arrives without a date.\n\n6) A template that does not appear in the interface\n\"registration_invitation_confirmation\" — the email we use to invite a parent we have registered ourselves — exists in the data but does not appear in the template list in the app, so we cannot edit it. Its text says \"press the confirmation button\", but there is no button in it; we suspect the confirmation tag is missing. How do we edit it?\n\n7) Notification center does not open\nSettings -> Notification center stays blank. Console: Uncaught Error: Unknown component 'notification_center' (knockout.min.js).\n\n8) Importing our existing clients — about 300 children\nThis is the last big step before we can start using Zooza for real, and we would rather not get it wrong.\n- Does the import send emails to parents (for example \"Booking imported\" or an account-ready message)? We are importing many children at once and we do not want mail going out without knowing.- If it does, can it be switched off for the duration of the import, and then switched on again?- Can you confirm the exact column format you expect, and send us a sample file that is known to work?- Can the import create the booking in a specific class and with a specific payment schedule, or do we set those afterwards?- Is there a way to run a trial import of two or three rows and roll it back if something is wrong?- What happens on a second import if a parent or child already exists — duplicate, or match and update?\n\nWhere we are — what we have already set up\nSo you know what state the account is in before the call, here is what is done on our side.\nOn the website (suntemsam.ro, WordPress):- We built our own plugin around your two widgets, the registration form and the parent profile. - The form: Romanian copy throughout, numbered headings when a parent registers a second child, an age warning when the child does not fit the age range of the class, and the site's own visual design.- The profile: the same design language as the form, a mobile layout for the tabs, copy-to-clipboard buttons for the IBAN and the payment reference, and a few translation fixes.- Both were tested at phone width as well as desktop.\nIn Zooza:- All 14 programmes moved to the Membership price type.- Monthly membership templates active: 545 RON, and 650 RON for the English-language programmes. We also built the annual one, but deliberately left it inactive, since the window for paying the full year has passed.- The previous payment model has been deleted.- Late bookings set to automatic confirmation on all programmes, so the payment schedule is applied without us intervening. We verified this with a real test booking end to end.- Make-up sessions: credits expire 90 days after the entitlement is created; the per-programme limit is left at 0, which your documentation says means \"as many as there are sessions in the class\".- We rewrote 10 email templates in Romanian, keeping your merge tags intact, and added two things that were missing from the parent's point of view: the discount code and the link to the form.- Two invoice profiles exist (a sole trader and a company); the sole trader one is the default.- All test bookings and test classes have been deleted.\nWhat is still open on our side, and which is why we are asking for a call: the three \"(Offline)\" templates we cannot edit, the SmartBill situation above, and the import of roughly 300 children.\n\n ress the confirmation button\", but there is no button in it; we suspect the confirmation tag is missing. How do we edit it?\n\n7) Notification center does not open\nSettings -> Notification center stays blank. Console: Uncaught Error: Unknown component 'notification_center' (knockout.min.js).\n\n8) Importing our existing clients — about 300 children\nThis is the last big step before we can start using Zooza for real, and we would rather not get it wrong.\n- Does the import send emails to parents (for example \"Booking imported\" or an account-ready message)? We are importing many children at once and we do not want mail going out without knowing.- If it does, can it be switched off for the duration of the import, and then switched on again?- Can you confirm the exact column format you expect, and send us a sample file that is known to work?- Can the import create the booking in a specific class and with a specific payment schedule, or do we set those afterwards?- Is there a way to run a trial import of two or three rows and roll it back if something is wrong?- What happens on a second import if a parent or child already exists — duplicate, or match and update?\n\nWhere we are — what we have already set up\nSo you know what state the account is in before the call, here is what is done on our side.\nOn the website (suntemsam.ro, WordPress):- We built our own plugin around your two widgets, the registration form and the parent profile. - The form: Romanian copy throughout, numbered headings when a parent registers a second child, an age warning when the child does not fit the age range of the class, and the site's own visual design.- The profile: the same design language as the form, a mobile layout for the tabs, copy-to-clipboard buttons for the IBAN and the payment reference, and a few translation fixes.- Both were tested at phone width as well as desktop.\nIn Zooza:- All 14 programmes moved to the Membership price type.- Monthly membership templates active: 545 RON kusim zistit a dam vediet, ak sa nico zachytilo na logoch.\n​", "cited": []}, {"role": "human", "who": "Tech Support", "text": "v logoch zial nemame ziadnu zmienku o moznom vypadku v spominanom case\nS najvacsou pravdepodobnostou doslo k chvilkovej, lokalnej chybe.\n\nSom rada ze sa Vam to po case uz podarilo a hromadna uprava presla bez problemov.\n\n\n\n\n\npekny den\n\n\nKatarina", "cited": []}], "verdict": "product", "vtitle": "Bulk time change fails with 'object object'", "vnote": "No network activity, reproduced across browsers and incognito. Agent asked for the sessions and the approximate time so logs can be checked. Defect.", "cat": "programmes"}, {"channel": "email", "id": "email-11", "date": "2026-09-30 10:51", "day": "2026-09-30", "human": true, "bucket": "EMAIL", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Klientke (reg. 519328) nechodia e-maily", "turns": [{"role": "customer", "who": "Jana Vašková", "text": "Dobrý deň, pani Farkas 519328 nechodia na email upozorenia-žiadna komunikácia. Email má správny, ale nechodí jej do schránky nič. My v komunikácií vidíme emaili. Kde prosím môže byť chyba?", "cited": []}, {"role": "customer", "who": "Jana Vašková", "text": "Klientka pozrela spam-nemá to tam, schránku nemá plnú-potvrdené, emailová adresa je bez chyby-správna. Minulý školský rok dcéra tiež chodila na krúžok a chodilo jej pekne všetko. Tento školský rok jej vôbec nechodia emaili.", "cited": []}, {"role": "customer", "who": "Jana Vašková", "text": "Zatiaľ stačí chat tu, ak by sa nenašla chyba neskôr kontaktovať ľudského agenta.ďakujem", "cited": []}, {"role": "customer", "who": "Jana Vašková", "text": "Zistím od klientky či niekedy neoznačila nejakú našu správu ako spam.", "cited": []}, {"role": "customer", "who": "Jana Vašková", "text": "Klientka má doménu na gmail.com", "cited": []}, {"role": "customer", "who": "Jana Vašková", "text": "V registrácií som- Aktuálny stav dala na aktívny. Mohlo to byť to?", "cited": []}, {"role": "human", "who": "Martin", "text": "Dobry den Jana. To ci klient oznaci spravu ako spam nevieme zistit. To je interna informacia, ktoru ziadna emailova sluzba neposiela odosielatelovi. Za poslednych 7 dni jej boli dorucene tieto emaily a ako vidite - email s prihlasovacim kodom si aj dva krat otvorila. Takze emaily jej urcite chodia.\n[Image]", "cited": []}, {"role": "customer", "who": "Jana Vašková", "text": "Áno emaili chodia, ale až keď sa prihlási do profilu vidí čo jej prišlo.", "cited": []}, {"role": "human", "who": "Martin", "text": "Tomu nie velmi rozumiem. V profile nie je prehlad emailov. Vo vseobecnosti nase emaily do spamu nechodia. Ak tak zvyknu skoncit v niektorej zo zaloziek v gmaili - najcastejsie v Aktualizaciach - kam vlastne aj po spravnosti patria. Cize najlepsie co moze zakaznicka urobit je skontrolovat si spam ci jej tam tie emaily nekoncia. Je naozaj mozne, ze omylom oznacila niektory nas email ako spam.", "cited": []}, {"role": "customer", "who": "Jana Vašková", "text": "Povedala som jej možnosti, lebo ja vidím, že jej prišli. Ona tvrdí, že jej neprišiel žiadny email...na úhradu chodí email, ale ona ho vraj nedostala...preverím ešte či neoznačila niektorý email od nás ako spam.Ďakujem.", "cited": []}, {"role": "human", "who": "Martin", "text": "Dakujem, Ak by bolo treba este cokolvek dohladat, ozvite sa:) Prajem este pekny den", "cited": []}, {"role": "customer", "who": "Jana Vašková", "text": "Ďakujem, pekný deň aj Vám prajem.", "cited": []}], "verdict": "verify", "vtitle": "Rodič tvrdí, že nedostáva e-maily, hoci logy ukazujú doručenie aj otvorenie", "vnote": "Martin dôkazom z logov ukázal, že e-maily sú doručené a prihlasovací kód bol 2× otvorený; rady (záložky Gmailu ‚Aktualizácie‘, spam, odosielateľ nevie zistiť označenie ako spam) sú všeobecne použiteľné. Pred zápisom do dokumentácie treba overiť dve tvrdenia: Martin píše ‚V profile nie je prehľad e-mailov‘, kým zákazníčka tvrdí, že klientka po prihlásení do profilu vidí, čo jej prišlo – jedno z toho nesedí. A AI bot (odpovede som vynechal) tvrdil, že stav ‚aktívny klient‘ sa nastavuje automaticky a nedá sa meniť ručne, hoci zákazníčka píše, že ho v registrácii ručne zmenila. Bot tiež odporúčal pridať do kontaktov @zooza.app. Konverzácia je v schránke dvakrát (dve Intercom notifikácie), spojil som ich do jedného záznamu. Organizácia zákazníčky z e-mailu priamo nevyplýva; adresa jana.tsnexum@gmail.com naznačuje Tanečnú školu NEXUM, s ktorej CEO Michal v ten istý týždeň komunikoval (email-10) – nie je overené. Doručovanie e-mailov sa v týždni opakuje: Mikuláš Fedor (email-08), Anna Blackwell (email-16).", "cat": "comms", "from": "Jana Vašková"}, {"channel": "intercom", "id": "215476151162374", "date": "2026-09-30 10:40", "day": "2026-09-30", "human": false, "bucket": "D_assumed_with_kb", "reask": 6, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Getting Started with Zooza | Zooza Help", "Discounts and Sibling Pricing FAQ | Zooza Help", "Discount code | Zooza Help", "Payment Correction vs Refund Guide | Zooza Help", "Session payment adjustments | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Bookings | Zooza Help", "Add a one-off scheduled payment | Zooza Help", "Refund a Stripe payment — step by step | Zooza Help"], "q": "can I raise a credit on someones account so when they pay for the next block of classes it deducts this", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "can I raise a credit on someones account so when they pay for the next block of classes it deducts this", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — you can add a credit that will reduce their next payment. \n\n\n\n\n- Open the client’s Booking\n\n\n- Go to Payment plan\n\n\n- Click the scheduled payment\n\n- In Adjustments, enter a positive amount (this is the credit)\n\n- Add a description and click Save\n\n\nThat credit reduces what they owe, and it will automatically come off their next scheduled payment.", "cited": ["Payments and Billing FAQ | Zooza Help", "Session payment adjustments | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "I havent got payment scheduled on, its one off payment would this still work", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — it can still work, but a bit differently.\n\n\nIf there’s no scheduled payment, you can’t use the adjustment method. Instead:\n\n\n\n\n- Add a credit to the booking (for example by overpaying or applying a manual credit).\n\n- This creates a negative balance, meaning the client has credit on their account. \n\n\nWhen they book the next block, you can apply that credit to the new registration manually when they pay.\n\n\nSo the credit still reduces their next payment — it just isn’t applied automatically without a scheduled payment plan.", "cited": ["Payments and Billing FAQ | Zooza Help", "Add a one-off scheduled payment | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "can they client apply the credit to point of payment", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "No — clients cannot apply that credit themselves at checkout.\n\n\nIf a client has a negative balance (credit) on a booking, it stays on the account and you apply it manually to their next registration when they book again. \n\n\nSo the flow is:\n\n\n\n\n- Client books the next block\n\n- You apply the existing credit to that booking manually\n\nClients can see the credit on their booking, but they don’t have a way to redeem it during payment.\n\n\n\nSource:\nPayments and Billing FAQ | Zooza Help", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "where do I add a credit", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You add it from the booking itself.\n\n\n\n\n- Open the client’s Booking\n\n\n- Go to Credits and make-up sessions\n\n\n- Click Create credit for booking\n\n\n- Enter the credit details and click Create\n\n\nThis creates a credit on that booking. If it comes from an overpayment, it will appear in Payments on the booking as a credit amount.", "cited": ["Bookings | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Does this clarify things?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "can the client use the code at checkout", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "No — a credit on a booking cannot be used by the client at checkout. \n\n\nIf you want the client to enter something themselves at payment, you would use a discount code instead. Clients can enter the code in the booking form during checkout and see the reduced total before paying.\n\n\nSo in short:\n\n\n\n\n- Credit on a booking → you apply it manually\n\n- Discount code → the client can enter it at checkout", "cited": ["Discounts and Sibling Pricing FAQ | Zooza Help", "Discount code | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help deciding between a booking credit and a discount code, I’m here to help. Would you like to share more about how you want the credit to be used?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "how do I process a refund", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can process a refund from the booking:\n\n\n\n\n- Go to Bookings and open the client’s booking\n\n- Go to Payments\n\n\n- Select the original transaction\n\n- Click Refund\n\n\n- Choose Full refund or enter a Partial refund amount and confirm\n\n\nIf the payment was made via Stripe, the refund is sent automatically to the client’s card. For bank transfers, you return the money manually and record the refund in Zooza.", "cited": ["Payments and Billing FAQ | Zooza Help", "Payment Correction vs Refund Guide | Zooza Help", "Refund a Stripe payment — step by step | Zooza Help", "Getting Started with Zooza | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help with processing the refund, I’m here to assist. Would you like to share more about what you’re trying to resolve?", "cited": []}], "verdict": "gap", "vtitle": "Raising a credit on an account that comes off the next block (asked 6 times)", "vnote": "The bot cited discount and sibling-pricing articles, which is the wrong answer shape -- the client wants a balance carried forward, not a discount code. Needs the real mechanism named.", "cat": "payments"}, {"channel": "intercom", "id": "215476088296377", "date": "2026-09-30 10:06", "day": "2026-09-30", "human": true, "bucket": "HUMAN", "reask": 5, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Programmes, classes, and sessions explained | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help"], "q": "nezobrazuje sa cena za skupinu\n\ndobry den, v poslednej dobe mam problem ze sa nezobrazuje cena za skupinu na detaile skupiny\nnapr - https://zooza.app/#courses/schedules/104202 \nje tam nastavena cena za skupinu 300, ale vidim to iba v tom nastaveni a nezobrazi sa to na detaile skupiny \na dokonca teraz som davala aj registraciu na web a vidim tam 0\n\nale pri ostatnych skupinach co som to dneska menila tak sa zobrazuju na webe spravne s cenou za tu skupinu (aj ked na detaile skupiny tu cenu nevidim, iba v tom nastaveni)\n\nje tam chyba ze som nieco zle nast lucit my, aj ked je lepsie to urobit cez appku, aby sa zmena preniesla naozaj vsade.\n\n\n\n\n\nVo vseobecnosti si ten model predstavte tak, ze mate hlavny objekt - Osoba. Osoba moze mat pridelenu identitu (email, ktorym sa je mozne prihlasit do systemu). Ak ma osoba pridelenu identitu, je to v ramci aplikacie identifikovane vzdy ako klient. Takato osoba moze byt tak ucastnik ako aj klient. Na druhu stranu osoba BEZ identity - moze mat vyplneny email, ale tymto emailom sa neda do systemu prihlasit. Takato osoba nikdy nemoze byt klient, vzdy moze byt iba ucastnik.\n\n\nJe to mozno trochu komplikovane, lebo na prvy pohlad je email ako email a rozmyslame, ako to v appke rozlisit, takze ak mate nejaky napad, radi prijmeme spatnu vazbu\n\n\n\n\n\nDakujem,\n\n\nMartin", "cited": []}, {"role": "customer", "who": "Tomáš Vávra", "text": "Dobrý den, Martine, \n\n\nděkuji za váš email. Myslím, že to, jak to funguje Klient vs. Účastník jsem pochopil na teoretické rovině. Ale nevím moc, jak to přenést do praktických kroků v systému. \n\n\nV tomto případě, je Martina Halířová klient (rodič) a účastník Aneta Halířová (dcera). Ale v databázi máme Anetu Halířovou 2x, ale u obou účastníků (tzn. u Anety Halířové 1 i u Anety Halířové 2) je stejný klient, tj. rodič Martina Halířová. A já vlastně nerozumím tomu, jak se stane to, že se u jednoho klienta vytvoří 2x stejný účastník. \n\n\nJelikož má u nás klientka Martina Halířová 2 dcery, tak ve svém profilu momentálně vidí 3 účastníky, tzn. 2x Anetu a 1x Kristýnu a nevím, kdy resp. jak tato situace vznikne. Nicméně účastníky se mi podařilo sloučit, původně jsem to zkoušel přes profily Účastníka Anety a nedohledal to, ale nakonec jsem zjistil, že se to dělá u Klienta. \n\n\nPopravdě do téhle sekce jsem se zatím moc neponořil, protože mi přišla nepřehledná v definování těch vztahů u jedné rodiny a nevěděl jsem, jestli označuji klienta jako Rodiče, nebo označuji jejich dítě jako Rodiče..\n\n\nKdyž zůstanu u stejné rodiny Halířů, tak po rozkliknutí klienta Martiny Halířové, tak to, co tam vidím mi dává docela smysl\n\n\n1) Mám rodiče Martinu a 2 děti Anetu a Kristýnu\n\n\n2) Nicméně pokud kliknu na Anetu, tak vidím rodiče/klienta s úplně stejným popiskem \"Child\". Protože tuto rodinu už znám, tak rozumím tomu, že si to mám zřejmě přeložit jakože Aneta je Child klienta Martiny, ale u rodin, které neznám, tak si vlastně nejsem jistý, jestli to chápu správně, nebo jestli to klient třeba nevyplnil špatně. \n\n\n3) Takže když jsem chtěl upravovat některému účastníkovi vztah, tak jsem si nebyl jistý.. protože kdybych klikl nejprve na Anetu Halířovou (účastník), vidím v rodině a vztazích Martinu Halířovou (klient), pod Martinou je napsáno \"child\", tak kliknu na \"upravit vztahy\" a vidím tam už jen Martinu Halířovou, pod kterou je napsáno Child. \n\n\n4) Potom kliknu na Upravit vztah a vidím, že teď je pravděpodobně \"vlevo Parent toho vpravo\". Když se v tom zorientuju, tak to asi dává smysl, ale dovedl bych si to představit intuitivnější. \n\n\nV tomhle kroku č.4) konkrétně tak, že místo šipek zleva doprava bych dal jednoduše pod Martinu (Parent) a pod Anetu (Child). Jinak v kroku 2) a 3) bych držel linku a všude kde je Martina, tak bych pod ni dal Parent namísto Child. To by mi přišlo přehlednější, ale samozřejmě nevím, jestli se jedná jen o mě a pro ostatní je to srozumitelnější takto, protože jde o úhel pohledu, ale zdá se mi jasnější když u každého jména je jeho role než obráceně tzn. jakou roli má účastník na kterého jsem kliknul oproti jménům, které tam vidím. \n\n\nOmlouvám se za delší email, ale snad je to srozumitelné. \n\n\nS pozdravem \n\n\nTomáš V. \n  \n\n\nNeobsahuje žádné viry.www.avast.com", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Tomasi, dakujem za podrobny email, kiez by vsetci posielali takto pekne spisane otazky:) Najskor ta zasadna odpoved - To ze je jeden ucastnik v systeme dva krat sa moze stat velmi lahko. Niekto zaregistruje dieta raz ako Tomas, e app than by us so the change propagates. This is the answer to a recurring class of confusion.", "cat": "clients"}, {"channel": "intercom", "id": "215475753194796", "date": "2026-09-30 08:29", "day": "2026-09-30", "human": true, "bucket": "HUMAN", "reask": 8, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": ["Ceník — Zooza", "Žebřík důvěry rodičů: 3 standardy pro dětské aktivity, které zvyšují retenci — Zooza", "Nemůžete škálovat, co nemá logiku: CEO playbook pro vzdělávací a dětské značky — Zooza"], "q": "Dobrý den, \n\n\nchtěl bych se zeptat, zdali by bylo možné přidat možnost hromadné úpravy termínů i pro Dodatečné lektory? \n\n\nPo zkušenosti z minulého roku, kdy se stávalo, že místo zkušeného trenéra brali trénink 2 méně zkušení, tak jsem letos přidal do všech našich kurzů 1) Hlavního lektora 2) Všechny ostatní lektory mezi dodatečné lektory. \n\n\n\n\n\n\nTo mi umožňuje měnit (přidávat) pohodlně lektora na konkrétním termínu jen tím, že termín rozkliknu a zaškrtnu dalšího lektora. \n\n\n\n\nJenže u nás máme dodatečné lektory, kteří chodí např. na každý druhý trénink. Nebo máme vypsané konkrétní data, kdy dodatečný lektor bude chodit na tréninky. Proto by mi pomohlo, kdyby bylo možné např. přidat do hromadných úprav \"Změnit dodatečné lektory\" a tam by se dalo zaškrtnou/odškrtnout dodatečné lektory přidané k danému kurzu (stejně jako je to na druhém obrázku výše) \n\n\n\n\n\n\n\n\nBudu moc rád za zpětnou vazbu. Děkuju a přeji hezký den.\n\n\nTomáš\n\n\n-- \nIng. Tomáš Vávra\nTaneční studio NO LIMIT, z.s.\nLidická 1272/240 370 07 České Budějovice www.tsnolimit.cz, www.nolimitproduction.cz \n\n\n\n\n\n\n\n\n\n\nNeobsahuje žádné viry.www.avast.com", "turns": [{"role": "customer", "who": "Tomáš Vávra", "text": "Dobrý den, \n\n\nchtěl bych se zeptat, zdali by bylo možné přidat možnost hromadné úpravy termínů i pro Dodatečné lektory? \n\n\nPo zkušenosti z minulého roku, kdy se stávalo, že místo zkušeného trenéra brali trénink 2 méně zkuš
