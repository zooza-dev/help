", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Patrik, pravdepodobne je to spôsobené price per session v nastavení platby. Aj keď máte total price = 0, systém môže vypočítavať cenu z ceny za termín. \n\n\nSkontrolujte toto:\n\n\n\n\n- Idite na Programmes → váš program → Settings → Price and Payment\n\n\n- Pozrite sa na price per session\n\n\n- Nastavte ho na 0\n\n\nAk je tam hodnota (napr. 110), systém ju používa na výpočet ceny v registračnom formulári.\n\n\nDôležité: v Zooze sa vždy počíta s cenou na úrovni programu alebo triedy a klienti kupujú konkrétnu triedu, ktorá môže mať vlastnú cenu. \n\n\nChcete mi povedať, či v Price and Payment vidíte aj pole price per session a či tam nie je hodnota?", "cited": ["Price and payment setup | Zooza Help", "Payments and Billing FAQ | Zooza Help", "FAQ — Programmes | Zooza Help"]}, {"role": "customer", "who": "Patrik", "text": "zmenil som to na 1 tu hodnotu a zrazu mi skace ze 106. cim to je", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Patrik, to je presne ako to počíta systém.\n\n\n\n\n- Keď dáte price per session = 1 €, systém vypočítava celkovú cenu podľa počtu termínov v skupine. \n\n\n- Ak máte napr. 106 termínov, výsledok je 106 €.\n\nTo je normálne správanie – systém vždy počíta:\n\n\ncena za termín × počet termínov.\n\n\nDôležité: aj keď máte total price = 0, systém môže používať túto hodnotu na výpočet. \n\n\nChcete mi povedať, koľko termínov má vaša skupina? To presne vysvetlí, prečo je to 106.", "cited": ["Price and payment setup | Zooza Help", "Managing sessions in a class | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Ak ešte potrebujete pomoc s pochopením výpočtu ceny, som Vám k dispozícii. Chcete opísať, kde presne sa suma zobrazuje a čo máte nastavené pri platobnom pláne?", "cited": []}, {"role": "customer", "who": "Patrik", "text": "stale to nejde, cena za jednotku je nula, cena za termin je nula, trvanie je cely den, terminy som zrusil a aj tak stale iba ako jednorazovy nakup. Taketo vseobecne predplatne, za ktore sa neposkytuje ziadna sluzba v aplikacii momentalne nemame. Ak to naopak chcete ako formu platby za kruzok/kurz, tak to samozrejme ide nastavit a to prostrednictvom platobnych sablon.", "cited": []}], "verdict": "gap", "vtitle": "Services are a one-off purchase, not a subscription", "vnote": "Confirmed limitation: an extra sold alongside a registration can only be a Service, which is a one-off purchase; there is no general subscription product that provides no service in the app. If it is meant as a way to pay for the class, that is normal payment setup instead. Worth stating so the bot stops recommending Services as a membership.", "cat": "payments"}, {"channel": "intercom", "id": "215476220127352", "date": "2026-10-02 20:07", "day": "2026-10-02", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "confirmed_resolution", "rating": null, "carried": null, "sources": ["Client Management FAQ | Zooza Help", "Clients | Zooza Help", "Sending email/SMS to clients | Zooza Help", "Automated notifications overview | Zooza Help"], "q": "dobrý večer môžem niekde v zooze vypnút reklamné maily v cele skupine? alebo musím u každého klienta zrušiť zasielanie reklamných mailov zvlášť", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": "Barbora Kubíková", "text": "dobrý večer môžem niekde v zooze vypnút reklamné maily v cele skupine? alebo musím u každého klienta zrušiť zasielanie reklamných mailov zvlášť", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "V Zooze sa reklamné emaily nedajú vypnúť celoplošne pre celú skupinu. Nastavenie je na úrovni klienta. \n\n\nMusíte to urobiť takto:\n\n\n\n\n- \nClients (Klienti) → otvorte klienta\n\n- Notes and preferences\n\n- zrušte zatrženie Send promotional emails \n\n\nToto sa dá tiež na úrovni registrácie (termínu) v Options, ale to platí iba pre danú registráciu. \n\n\nTakže áno – aktuálne sa to rieši po klientoch, nie hromadne pre skupinu.", "cited": ["Sending email/SMS to clients | Zooza Help", "Automated notifications overview | Zooza Help", "Clients | Zooza Help", "Client Management FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Hledali jste tohle?", "cited": []}, {"role": "customer", "who": "Barbora Kubíková", "text": "ano dakujem mám to", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rád som vám mohol pomôcť! Ak budete mať ešte nejaké otázky, neváhajte sa na nás obrátiť. Som tu pre vás! 😊", "cited": []}], "verdict": "gap", "vtitle": "Turning off marketing emails for a whole group instead of client by client", "vnote": "Asked twice. Same as 215476149481015 from the other end: per-client versus bulk consent handling.", "cat": "comms"}, {"channel": "email", "id": "email-21", "date": "2026-10-02 16:42", "day": "2026-10-02", "human": true, "bucket": "EMAIL", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "New centre Bishops Stortford", "turns": [{"role": "customer", "who": "Sarah Marsh", "text": "Hi Michal,\n\nWe have a new centre opening - please see their details attached.\n\nRegards,", "cited": []}, {"role": "human", "who": "Michal", "text": "Hi Sarah,\n\nThanks for the Bishop's Stortford form, the new tabs are a real\nimprovement, the blocks and closure dates were exactly what we needed.\n\nTwo gaps before I can build it, though:\n\n*Class times.* On the Classes tab, all six rows have the day, duration,\ncapacity and start date, but *Start time and End time are empty*. Without\nthose I can't generate the sessions. Could Danielle fill those in for all\nthree Monday blocks and all three Saturday ones? Or just reply.\n\n*The address.* The centre's postal address is blank, and the Venues tab is\nempty too ,,, so at the moment the account has a venue with no street. If\nthe venue is known, could she add it? If it isn't confirmed yet, let me\nknow and I' ed code for\n   Bishop's Stortford is ready on the usual page:\n*https://magikats.zooza.online/embed/\n   \u003chttps://magikats.zooza.online/embed/> *\n\nBest,\nMichal", "cited": []}], "verdict": "client", "vtitle": "Založenie nového franšízového centra MagiKats Bishop's Stortford podľa setup formulára", "vnote": "Klientsky špecifické nastavenie (dva programy, tri časové bloky, Birchwood High School, od 2./7. 11. 2026 do konca júla 2027, bez UK bank holidays). Nový formulár s tabmi pre bloky, trial a closure dates výrazne skrátil prácu – dobrý vzor pre ďalších franšízových klientov. Otvorené body: (1) Sarah odpísala len ‚those items corrected‘ v priloženom xlsx, ktorý som neotváral – nevidím, či potvrdila cenu (£85/£160 vs. £80/£150/£210); Michalova finálna správa cenu nespomína, treba overiť, ktorá sada sa použila; (2) Danielle musí nastaviť platobnú metódu na každom programe (samotné prepojenie Stripe/GoCardless nestačí) – to je všeobecne platná rada, ktorá by mohla byť aj v dokumentácii; (3) chýba stránka /bishops-stortford na webe MagiKats.", "cat": "programmes", "from": "Sarah Marsh (MagiKats)"}, {"channel": "email", "id": "email-20", "date": "2026-10-02 15:26", "day": "2026-10-02", "human": true, "bucket": "EMAIL", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Pay Now v klientskom profile vracia klienta na rezerváciu", "turns": [{"role": "customer", "who": "Samantha Skelton", "text": "Client is trying to pay an outstanding balance but when she clicks pay now it’s asking her to book again", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "They are trying to pay, click pay now and then it’s just taking them to booking again", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "Can someone help with this please", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Sam,\n\nWe’re going to take a look at this. Do you have the specific registration where this is happening,  "text": "Dobrý deň, ďakujem. Váš postup mi pomohol. Zmenu statusu lektora som urobila. Príjemný víkend prajem!", "cited": []}], "verdict": "gap", "vtitle": "Neaktívny lektor zmizne zo zoznamu lektorov a znova sa dá aktivovať len na stránke tímu dole", "vnote": "Ľudská odpoveď je všeobecne platná a mala by byť v dokumentácii v slovenčine: neaktívni lektori sú na https://zooza.app/#settings/team úplne dole, rola sa mení tlačidlom ‚zmeniť‘; opätovné zadanie ako nového lektora skončí hláškou ‚už je registrovaný‘. AI bot (odpovede vynechané) dal cestu ‚Settings → Team → Access‘ v angličtine a po žiadosti o slovenčinu preložil len okolité vety, nie názvy menu – zákazníčka nerozumela a žiadala človeka. To je slabé miesto bota/dokumentácie: názvy obrazoviek v jazyku rozhrania zákazníka. Problém s AI botom sa v týždni opakuje (email-04, email-16, email-20).", "cat": "team", "from": "Daniela Ružičková (Animateam)"}, {"channel": "intercom", "id": "215476208726329", "date": "2026-10-02 13:40", "day": "2026-10-02", "human": true, "bucket": "HUMAN", "reask": 5, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": ["Registration and Booking FAQ | Zooza Help", "Client Profile 101 | Zooza Help", "Client Profile FAQ | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Widget Embedding Troubleshooting | Zooza Help", "Registration statuses — what each one means | Zooza Help"], "q": "Client is trying to pay an outstanding balance but when she clicks pay now it’s asking her to book again", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "Client is trying to pay an outstanding balance but when she clicks pay now it’s asking her to book again", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "This usually happens when the client is trying to pay from the booking page instead of their Client Profile.\n\n\nAsk them to pay this way instead:\n\n\n\n\n- Go to their Client Profile\n\n\n- Open the Payments section\n\n- Select the unpaid item\n\n- Click to continue to the payment gateway\n\nClients can complete outstanding payments directly there without booking again. \n\n\nThe booking already exists, so payment is done later from the profile rather than creating a new registration.", "cited": ["Client Profile FAQ | Zooza Help", "Registration statuses — what each one means | Zooza Help", "Client Profile 101 | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "From your screenshot, the client is on the public site page (the one with the “Choose an option” dropdown). That page is for making a new booking, which is why it asks them to select a class again. \n\n\nThey should pay from their Client Profile instead:\n\n\n\n\n- Open their Client Profile\n\n- Go to Payments\n\n\n- Open the item marked Outstanding\n\n\n- Click Pay Now to continue to the payment gateway\n\nClients can complete unpaid balances directly there without creating another booking. \n\n\nThe booking already exists, so the payment step simply finishes the original registration.", "cited": ["Client Profile FAQ | Zooza Help", "Registration statuses — what each one means | Zooza Help", "Registration and Booking FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "No", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I apologize for the inconvenience. Could you please provide more details about the issue the client is experiencing when trying to pay? I am here to help you resolve this. 😊", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "They are trying to pay, click pay now and then it’s just taking them to booking again", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "This usually means the Client Profile widget link is pointing to the wrong page on your website. When that happens, the “Pay Now” button sends the client to the booking page instead of the payment screen. \n\n\nPlease check this in Zooza:\n\n\n\n\n- Go to Settings → Publish\n\n\n- Open the widget set used on your site\n\n- Find the Client Profile widget\n\n- Verify the URL matches the exact page where the profile widget is embedded on your website\n\n- Save if you change it\n\nIf the URL is wrong, the payment link will redirect to the booking form instead of the payment step.\n\n\nOnce the booking exists, clients should be able to complete the payment later from their Client Profile.", "cited": ["Widget Embedding Troubleshooting | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "Can someone help with this please", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I will connect you with someone from our team who can assist you further. Meanwhile, could you please share any additional details about the issue to help them understand your situation better?", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Sam,\n\n\nWe’re going to take a look at this. Do you have the specific registration where this is happening, so we can reproduce it on the same case?", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Sam,\n\n\nI found an incorrect URL in the widget settings in you Zooza account and have corrected it, so the payment link from the profile should now work properly.\n\n\nIf you send me the specific registration where the client had the issue, I’ll check that one as well just to make sure everything is correct.", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "Hi \n​\n\n\nIt’s a booking for \n\n\n2277 - Laura McGladrigan (Theodore Mulholland)\n\n\nChristmas party class, outstanding is 217.50AED \n\n\nThanks \n\n\nMagic Sprinkles \n Sam ❤️\n Franchise owner \n Hartbeeps UAE\nsam@hartbeeps.com", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Sam,\n\n\nYes, I’ve checked registration 2277 – Laura McGladrigan (Theodore Mulholland) and can confirm the link is now directing correctly to the payment screen for the outstanding 217.50 AED.\n\n\nPlease send her to the profile here:\n\n\nhttps://www.hartbeeps.ae/profile/\n\n\nFrom there she should be able to open the outstanding payment and complete it by card.\n\n\nThanks,", "cited": []}], "verdict": "product", "vtitle": "'Pay now' on an outstanding balance asks the client to book again", "vnote": "Agent asked for the specific registration to reproduce. If this is real it is a payment-flow defect.", "cat": "payments"}, {"channel": "email", "id": "email-17", "date": "2026-10-02 13:38", "day": "2026-10-02", "human": true, "bucket": "EMAIL", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Zooza for Music Squad", "turns": [{"role": "customer", "who": "Hannah Donkin", "text": "Hi Michal\n\nHope you're well?\n\nWe spoke about moving Music Squad over to Zooza around this time last year. It wasn’t quite the right time for us then, but we’ve recently relaunched the project to find a new operating system and I’d love to explore Zooza again. Finding a new system is our current priority.\n\nI’m now really clear on the functionality we need and the problems we’re looking to solve, so I wondered what the best next step would be to properly explore whether Zooza could be a good fit for Music Squad?\n\n--\nThanks so much,\n\nHannah", "cited": []}, {"role": "human", "who": "Michal", "text": "Hi Hannah,\n\nGreat to hear from you! Of course I remember. Music Squad has a lovely, really memorable brand, and it would be great to have it on Zooza.\n\nIf I remember rightly, you were using ThinkSmart? I'm confident we can make the move a smooth one, and I think you'll be happy with the result.\n\nIt's great that you're now clear on what you need. The best next step would be:\n\n   1. *You send me your scope.* This is the functionality and processes you want to cover, written in your own words. It should include your business model and how you sell, for example monthly payments or termly invoicing, make-up classes, sibling discounts, trial classes in a group, 1-2-1 lessons and the school → programme → day booking flow. Add anything else that's part of how Music Squad runs, plus the main problems you're looking to solve.\n   2. *We go through it together on a call.* I'll show you a fresh preview of Zooza built around your scope, so you can see exactly how it would work for you. Book a call.\n   3. *We set it up for one franchise first.* Once you've confirmed everything works the way you want, we copy the same setup across to the other franchises.\n\nAnd of course, if we go ahead, my goal is that you're happy with it, not just signed up.\n\nCould you send the scope over when it's ready? I'm happy to put a call in the diary as soon as I have it.\n\nBest,\nMichal", "cited": []}, {"role": "customer", "who": "Hannah Donkin", "text": "Hi Michal\n\nThanks so much for this, yes we're using Thinksmart, Musicbiz.\n\nI've attached a Moscow list - here \u003chttps://docs.google.com/spreadsheets/d/1gHo1m0IY-phHHbslKyvfOwepgPTw_f7nNhsipORE8uQ/edit?usp=sharing>\n\nThe main problems that we are looking to solve are:\n\n   - *Online registration and parent portal - *Much more seamless online booking experience for families, followed by access to 1 easy online portal\n   - *Media sharing - *Capacity to send home videos and pictures to families, within the same family portal (we currently do this via a separate app called Seesaw)\n   - *Core operations - *Much more user friendly backend admin system - we are limited on many things in Thinksmart\n   - *Card payments - *Changing our invoicing process to move away from Direct Debit and onto card payments instead (still subscription model)\n   - *Reporting - *automatic dashboards for each branch plus visibility for me across whole franchise network\n\nNot deal breakers but also important:\n\n   - *Teacher portal - *better push notifications for changes to registers etc and notes for children, but not a deal breaker\n   - *Royalties - *ideally able to take royalties at source, but not a deal breaker\n   - *School portal - *ideally give schools the capacity to have their own portal and to see registers, but also not a deal breaker\n\nWe currently manage make-up sessions manually and we don't do sibling discounts or free trials, although we'd like to introduce these too.\n\nProbably worth chatting through the rest of the detail on a call if that works? Just want to check that's OK with you and if you need a certain amount of time before I book\n\nThanks again", "cited": []}, {"role": "human", "who": "Michal", "text": "Hi Hannah,\n\nA call is absolutely fine, go ahead and book it. An hour is plenty and I don't need any lead time.\n\nBefore then, here's your Moscow list with our side filled in. Your rows are untouched; I've added the status, how it works in Zooza, and a link into our help documentation on each row so you can check every answer yourself:\n\nhttps://docs.google.com/spreadsheets/d/1OC82O6-VLB0evk0v6_-VIh_z5X7mAXBt/edit?usp=sharing&ouid=106147421765031470700&rtpof=true&sd=true\n\nThe short version: all five of your main problems are standard, online registration and one parent portal, photos and videos to families inside that same portal so Seesaw goes away, card payments on a subscription with Direct Debit still available, and per-branch dashboards plus your network view across all franchises. Make-up sessions, sibling discounts and free trials are standard too, so you could switch those on as well. Royalties at source is the one thing we'd build for you, included.\n\nIf you'd like a look before we speak, https://www.playfulmotion.co.uk/ is a live Demo Zooza booking flow.\n\nLooking forward to it.\n\nBest,\nMichal", "cited": []}, {"role": "customer", "who": "Hannah Donkin", "text": "Hi Michal\n\nWow that's brilliant thank you so much. I've had a good read through and will have a go at the registration form live demo before we meet on Monday - I've booked a meeting for 7am UK time.\n\nLook forward to seeing you then!", "cited": []}, {"role": "human", "who": "Michal", "text": "Hi Hannah, Perfect. Monday 7am is in my diary, confirmed. Do have a play with the registration form beforehand. If anything doesn't behave the way you'd expect, jot it down and we'll go through it together on the call. See you Monday. Best, Michal", "cited": []}], "verdict": "verify", "vtitle": "Franšízová sieť Music Squad sa vracia k výberu Zoozy ako náhrady za ThinkSmart; demo je v pondelok 5. 10.", "vnote": "Mimo pôvodného zoznamu odosielateľov. Nejde o support, ale o predaj – kategóriu ‚account‘ som zvolil ako najbližšiu, v zozname chýba ‚sales‘. Michal tvrdí, že všetkých päť hlavných požiadaviek je štandard (registrácia + jeden rodičovský portál, fotky a videá rodinám v portáli namiesto Seesaw, kartové platby na predplatné s ponechaním Direct Debit, dashboardy za pobočku aj za celú sieť) a že royalties at source postavíme v cene – pred demom stojí za to overiť najmä zdieľanie médií v portáli a sieťový reporting, aby demo neukazovalo niečo, čo nie je hotové. Otvorené: teacher portal (push notifikácie), school portal – v odpovedi nie sú adresované. Hovor: pondelok 5. 10. 2026 o 8:00 CEST (7:00 UK), pozvánku Hannah prijala. Vyplnený MoSCoW zoznam je v Google Sheets – neotváral som ho.", "cat": "account", "from": "Hannah Donkin (Music Squad)"}, {"channel": "email", "id": "email-16", "date": "2026-10-02 13:11", "day": "2026-10-02", "human": true, "bucket": "EMAIL", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Email Templates", "turns": [{"role": "customer", "who": "Anna Blackwell", "text": "Hello,\n\nI have been trying to access the AI assistant all morning but it just keeps the loading circle and nothing happens. This is a common occurence which I have raised with Michal before. Martin you mentioned the other day when I had a query that I emailed to you, that the AI assistant would have answered the questions, but I very rarely find that it works.\n\nMichal when we set up the templates, we went through the ones that applied to me and I personalised them and then they were all set up and you said it was all ready to go. However, now a customer said she didnt get a confrimation and upon checking this - I dont htink any of them are receiving the template that I created? Under templates it says - Booking Confirmation - sent when a booking is confirmed. but when i check message history it seems like no one has ever received this. Which is honestly a bit of a disaster, not only as it looks unprofessional by me but also becuase they are missing receiving vital information they need before coming to class.\n\nThe email subejct of the template Im concerned about is this:\n\nThank you for booking |COURSE_NAME| - we look forward to welcoming you! 🐢\n\nAs with many aspects of Zooza, I just feel that it is all set out so confusingly and not easy to work out.\n\nThanks and look forward to your reply.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Anna,\nI checked this now using one of the latest registrations, Alice.\nYou can see the communication history directly on her registration here: https://asia.zooza.app/#registrations/2327/registrations_communication\n[Image]\nI also checked the system logs, and they confirm that the booking confirmation emails are being sent and received.\n[Image]\nThe template is also active on your programmes, which is visible in the template detail, so from what I can see, everything is set correctly.\nhttps://asia.zooza.app/#communication/templates?type=registration_done\n[Image]\nYou can find the full history of on template.\nhttps://asia.zooza.app/#communication/compose?target_group=registration&to_email=jeevakadhirvaani@gmail.com&template=custom®istration_id=2271\n\nThe confirmation email is normally sent when a customer makes a booking through the standard booking flow. In this case, it was different because the booking was created manually by copying.\n\nDo you remember why this booking was copied on 29 September, and from where? That will help us confirm the exact flow.", "cited": []}], "verdict": "gap", "vtitle": "Zákazníčka má pocit, že potvrdenie rezervácie nechodí nikomu; v skutočnosti chýbalo len pri ručne skopírovanej rezervácii", "vnote": "Všeobecne platné a do dokumentácie: kde vidieť históriu odoslaných e-mailov (komunikácia na registrácii, Sent communication s filtrom šablóny), že pri kopírovaní rezervácie sa potvrdenie posiela len ak sa zaškrtne voľba, a ako ho poslať dodatočne ručne. Ďalšie vrstvy: (1) Anna očakáva potvrdenie aj pri zaplatení po skúšobnej hodine (‚most people sign up after they do a trial‘) – zatiaľ nezodpovedané, môže to byť produktová otázka o trial → enrolment toku; (2) vyhľadávanie ‚booking confirmation‘ v rozhraní šablónu nenašlo – UX; (3) AI asistent sa jej opakovane len načítava – tím to označil za lokálny problém, nie je overené; (4) tím sa na konci pýta, prečo bola rezervácia 29. 9. skopírovaná – odpoveď zatiaľ nie je. Kópia vlákna je v schránke aj ako Intercom notifikácia (spojené do tohto záznamu). Doručovanie/viditeľnosť e-mailov je téma týždňa aj u Jany Vaškovej (email-11) a Mikuláša Fedora (email-08); nefunkčný AI asistent aj u Daniely Ružičkovej (email-18) a Samanthy Skelton (email-20). Anna je zjavne frustrovaná (‚As with many aspects of Zooza… confusingly‘) – druhé vlákno v týždni (email-06).", "cat": "comms", "from": "Anna Blackwell (Turtle Tots Dubai)"}, {"channel": "intercom", "id": "215476211004672", "date": "2026-10-02 12:06", "day": "2026-10-02", "human": false, "bucket": "D_assumed_with_kb", "reask": 1, "resolution": ther take any action based upon its contents, nor copy or show it to anyone. Please contact the sender if you believe you have received this email in error.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Anna,\n\n\nI checked this now using one of the latest registrations, Alice.\n\n\nYou can see the communication history directly on her registration here:\nhttps://asia.zooza.app/#registrations/2327/registrations_communication\n\n\n\n\n\nI also checked the system logs, and they confirm that the booking confirmation emails are being sent and received.\n\n\n\n\n\n\n\n\n\n\n\nThe template is also active on your programmes, which is visible in the template detail, so from what I can see, everything is set correctly.\n\n\nhttps://asia.zooza.app/#communication/templates?type=registration_done\n\n\n\n\n\nYou can find the full history of sent Booking confirmation emails here by applying the template filter:\nhttps://asia.zooza.app/#communication/sent_communication\n\n\n\n\n\nIf you have a specific customer who says they did not receive it, please send me their name or email and we can check that exact case. \n\n\n\n\n\nRegarding the AI assistant, this looks more like a local/loading issue, we do have other clients in the Emirates using it successfully.  For now, please continue using this email as an alternative while we investigate it. We are also working on alternative options through WhatsApp and customer care.\n\n\nP.S. Alternatively, you can also use the ChatGPT/Claude connection with Zooza for these types of questions, if that works better for you. https://asia.zooza.app/#mcp\n\n\n\n\n\nBest", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "Thanks for your email - I was typing in booking confirmation in the search box and it wasnt coming up. I will use the other method. \n​\n\n\nThe customer I have who is asking is jeevakadhirvaani@gmail.com.\n\n\n\\\n\n\nShe received the invoice and payment email but shouldnt the booking confirmation be sent out when people pay? If not, that doesnt make sense becuase most people sign up after they do a trial and so are not getting the most improtant booking confirmation email\n    \n\n\nBest Wishes    Anna Blackwell\nOwner - Turtle Tots Dubai  T: 052 748 1060\nE:anna.blackwell@turtletots.com    \n\n\n\nhttps://www.facebook.com/turtletotsdubai\"/>\nhttps://www.instagram.com/turtletotsdubai/\"/>WHP2-Block-A Commercial, Property Number P2AG-A09, Plot 13-0 | DM Land No: 532-8359 | Saih Shuaib 3 | Dubai | UAE |   \n\n\nThis email and any attachments to it may be confidential and are intended solely for the use of the individual to whom it is addressed. Any views or opinions expressed are solely those of the author and do not necessarily represent those of Turtle Tots. If you are not the intended recipient of this email, you must neither take any action based upon its contents, nor copy or show it to anyone. Please contact the sender if you believe you have received this email in error.\n​", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Anna,\n\n\nThank you, that helps.\n\n\nWe checked the logs for jeevakadhirvaani@gmail.com. She did receive the invoice and payment confirmation emails.\n\n\n\n\n\nThe reason she did not receive the booking confirmation (for the last of her bookings) is that this particular booking was created by copying an existing booking on 29 September. When a booking is copied, there is an option to send the confirmation email, but it looks like this was not selected at the time.\n\n\nhttps://asia.zooza.app/#registrations/2271\n\n\nYou can still send it manually if needed: open the registration, go to communication/send email, and choose the Booking confirmation template.\n\n\nhttps://asia.zooza.app/#communication/compose?target_group=registration&to_email=jeevakadhirvaani@gmail.com&template=custom&registration_id=2271\n\n\n\n\n\nThe confirmation email is normally sent when a customer makes a booking through the standard booking flow. In this case, it was different because the booking was created manually by copying.\n\n\n\n\n\nDo you remember why this booking was copied on 29 September, and from where? That will help us confirm the exact flow.", "cited": []}], "verdict": "gap", "vtitle": "Where to prove a booking confirmation was actually sent", "vnote": "Two reusable locations: the communication history on the registration detail, and the sent-communication screen filtered by template. Plus the template detail shows which programmes it is active on. That is the standard 'my client says they got nothing' triage path. The AI assistant failing to load for this client is a separate product problem.", "cat": "comms"}, {"channel": "intercom", "id": "215476176091676", "date": "2026-10-02 10:45", "day": "2026-10-02", "human": true, "bucket": "HUMAN", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Presmerovanie faktúr na iný mail\n\nDobrý deň, bolo by možné aby FA za vaše predplatné chodili na miniMOVE@bezpapiera.kros.sk ? Ďakujem :)", "turns": [{"role": "customer", "who": null, "text": "Presmerovanie faktúr na iný mail\n\nDobrý deň, bolo by možné aby FA za vaše predplatné chodili na miniMOVE@bezpapiera.kros.sk ? Ďakujem :)", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dear Kristína,\n\n\nyour ticket  has been received. Zooza Assistant will try to help you right away — and a member of our team will personally review it too.\n\n\n— Zooza Support", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, dakujeme za napisanie. Preposielame na kolegov, aby poziadavku zapracovali. Pekny den.", "cited": []}], "verdict": "noise", "vtitle": "Redirect Zooza subscription invoices to another address", "vnote": "Billing admin request.", "cat": "account"}, {"channel": "intercom", "
