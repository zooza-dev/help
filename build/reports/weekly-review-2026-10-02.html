| Zooza Help\nBlocks Configuration and Management | Zooza Help\nBlocks (Term Segments) FAQ | Zooza Help", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Jakub, samostatna znacka iba na koniec skupiny neexistuje. Najblizsie k tomu je znacka COURSE_DATE_START_END ktora obsahuje zaciatok a koniec skupiny ale nie jej cas. O co presne Vam ide? Ukazat posledny termin v skupine a jeho koniec? teda Zaciatok terminu + jeho trvanie? alebo nieco ine?", "cited": []}, {"role": "customer", "who": "Jakub Majoroš", "text": "Zdravím,\n\n\nukázať, kedy sa hodina/tréning začína a končí. Máme krúžky, kde aj deti vozíme a potom sa vracajú späť. Celkový čas \"lekcie\" tak môže byť aj 120 min ap. Aby mali v emaily rodičia jasnú informáciu, kedy sa tréning začína (vyzdvihovanie) a kedy si ich môžu prevziať späť v škole, čo je vlastne ukončenie tréningu. Ak je tam iba čas začiatku, rodičov môže mýliť. \n\n\nS pozdravom\n\n\nJakub", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Otazka je ci ide o uroven skupiny - potvrdenie registracie, alebo o uroven na termine - ranne pripomienky. Skupina a terminy mozu mat odlisnu dlzku. Pondelkove treningy mozu byt 60 minutove a kazdy druhy piatok mozu byt 120 minutove, preto sa pytam, ze o co presne ide. Na urovni skupiny mame znacku SCHEDULE_DURATION, ktora sa da pouzit pre ucely potvrdenia registracie na vyskladanie niecoho takehoto: Trening trva SCHEDULE_DURATION minut. Nie je to ideal ale da sa to urobit uz teraz. Ak by ste chceli konkretnu znacku, ktora by vyhodila koniec skupiny (cas) tak to by sme museli dorobit. Skuste mozno napisat konkretny text, ktory by ste chceli posielat zakaznikom a od toho to odvodime", "cited": []}, {"role": "customer", "who": "Jakub Majoroš", "text": "Jedná sa o potvrdenie registrácie, resp. informačný email pred začiatkom samotných kurzov s inštrukciami. \n\n\nMilí rodičia,\n\n\nďakujeme, že ste svoje dieťa prihlásili na lezecký krúžok so Športovým klubom MEDVEDICA. Posielame Vám základné organizačné informácie pred začiatkom tréningov. Deti vyzdvihneme v škole podľa uvedeného harmonogramu a spoločne sa presunieme do lezeckého centra.\n\n\nNázov kurzu: MUDROŇKA - Lezenie Mudroňka\nTermín kurzu: 21. 9. 2026 - 7. 6. 2027\nČas tréningu: Od 14.00 Do 16.00 (COURSE_TIME_END)\nLokalita tréningu: Lezecké centrum Vertigo, Trenčianska 47, Ružinov, Bratislava\n\n\nďalšie info.\n\n\nJeden všeobecný email s informáciami ide na rôzne skupiny s inými časmi tréningov.\n\n\nS pozdravom\n\n\nJakub\n​", "cited": []}], "verdict": "gap", "vtitle": "There is no dynamic tag for the end time of a session", "vnote": "Confirmed: no COURSE_TIME_END. COURSE_TIME is the start only; the closest tag is COURSE_DATE_START_END, which carries the start and end dates of the group, not times. Belongs in guides/dynamic-tags.md as an explicit 'does not exist' line, otherwise the bot will keep inventing it.", "cat": "comms"}, {"channel": "intercom", "id": "215476148423018", "date": "2026-09-29 04:58", "day": "2026-09-29", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Holiday settings | Zooza Help", "Custom holidays | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Managing sessions in a class | Zooza Help", "Holiday and Term Management FAQ | Zooza Help"], "q": "how do I bulk change the holiday dates on all classes", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "how do I bulk change the holiday dates on all classes", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can bulk change the dates, but holiday rules cannot be reapplied afterwards. \n\n\nHow to bulk change dates:\n\n\n\n\n- Go to Sessions\n\n\n- Use the filter to find the sessions you want to change\n\n- Click Select All (or select specific sessions)\n\n- Click Bulk Edit\n\n\n- Choose Set new date and time or Move by interval\n\n\n- Click Continue, then Start to confirm. \n\n\nImportant: if the new dates fall on holidays, the system will not automatically skip them. You would need to delete those sessions and recreate them with Skip Holidays enabled.\n\n\nYou can also create the holiday itself in Settings → Custom Holidays so future sessions skip those dates automatically.", "cited": ["Managing sessions in a class | Zooza Help", "Holiday and Term Management FAQ | Zooza Help", "Custom holidays | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help with adjusting the holiday dates, I’m here to help. Would you like to share more about what you’re trying to change?", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "I need to change some dates. I had half term booked for one week and had deleted the session but now its moved a week earlier", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "This usually happens when sessions are bulk‑moved after the holiday was removed. When you shift sessions by a week, Zooza treats it as a manual change and does not re‑apply holiday‑skip rules, so the dates can land on the wrong week. \n\n\nTo fix it:\n\n\n\n\n- Open the class and review the session list.\n\n- Find the sessions that now fall on the half‑term week.\n\n- \nDelete those sessions or bulk move them to the correct dates. \n\n\nIf you want the holidays to be respected automatically again, delete the affected sessions and recreate them with Skip Holidays enabled.", "cited": ["Holiday and Term Management FAQ | Zooza Help", "Managing sessions in a class | Zooza Help", "Holiday settings | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help correcting the session dates, I’m here to help. Would you like to share which dates need changing?", "cited": []}], "verdict": "gap", "vtitle": "Bulk changing holiday dates across all classes", "vnote": "Asked twice, and the human answer in 215476150457518 contains the real explanation: holidays apply when you schedule, not retroactively; afterwards it is bulk operations on sessions. Write once, link both.", "cat": "programmes"}, {"channel": "intercom", "id": "215476143371500", "date": "2026-09-28 19:14", "day": "2026-09-28", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Getting Started with Zooza | Zooza Help", "Types of bookings | Zooza Help", "Common Booking Scenarios | Zooza Help", "Registration and Booking FAQ | Zooza Help", "Waiting List FAQ | Zooza Help"], "q": "how to add children to a class waiting list", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "how to add children to a class waiting list", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Kieran, you don’t add children to the waiting list manually.\n\n\n\n\n- When a class is full, parents can still submit a booking.\n\n- Their booking is automatically placed on the Waitlist.\n\n- You can then view them in Bookings with Status = Waitlist and approve them if a space opens. \n\n\nIf you are creating the booking yourself, just make sure the participant is the child (not the parent) when confirming the booking.", "cited": ["Getting Started with Zooza | Zooza Help", "Common Booking Scenarios | Zooza Help", "Waiting List FAQ | Zooza Help", "Registration and Booking FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "it's a class whivh hasn't started yet", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "That’s fine — the class does not need to have started yet for a waiting list to exist.\n\n\nThe waiting list only appears when the class is full.\n\n\n\n\n- If the class still has spaces → new bookings are normal enrolments.\n\n- If the class is full → new bookings automatically go to Status = Waitlist.\n\nSo if the class hasn’t started but still has places, you won’t see a waiting list yet. It only activates once capacity is reached.", "cited": ["Types of bookings | Zooza Help", "Getting Started with Zooza | Zooza Help", "Common Booking Scenarios | Zooza Help", "Waiting List FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help adding children to the waiting list for a class that has not started, I’m here to help. Would you like to share more about what you’re trying to set up?", "cited": []}], "verdict": "check", "vtitle": "How to add children to a class waiting list", "vnote": "Asked twice. We have a waiting-list FAQ; the bot cited Getting Started and Types of bookings instead, which suggests a findability problem rather than a missing article.", "cat": "bookings"}, {"channel": "intercom", "id": "215476138385717", "date": "2026-09-28 15:00", "day": "2026-09-28", "human": false, "bucket": "D_assumed_with_kb", "reask": 5, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Blocks Configuration and Management | Zooza Help", "Client Management FAQ | Zooza Help", "Bookings | Zooza Help", "Schedule a registration cancellation | Zooza Help", "Change the language in Zooza | Zooza Help"], "q": "ako nastavím v dochádzke klienta termín, ktorý je skrytý, aby bol znova viditeľný? vôbec netuším, kde takéto nastavenie je, keďže daný termín nevidím", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Mirka Vícen", "text": "ako nastavím v dochádzke klienta termín, ktorý je skrytý, aby bol znova viditeľný? vôbec netuším, kde takéto nastavenie je, keďže daný termín nevidím", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Toto sa stáva, keď je klientovi zrušená registrácia alebo keď sa zmení jeho block (skupina dochádzky). V takom prípade sa niektoré termíny označenia ako Hidden a nevidíte ich v dochádzke. \n\n\nAby ste ich spravili znova viditeľnými:\n\n\n\n\n- otvorte klientovu registráciu\n\n- kliknite na Actions → Revoke cancellation\n\n\nTým sa všetky automaticky skryté termíny znova zobrazia. \n\n\nAk chcete, môžem vám aj vysvetliť, kedy sa termíny skrývajú automaticky (napr. pri zmenách blockov), aby ste tomu predišli.", "cited": ["Schedule a registration cancellation | Zooza Help", "Blocks Configuration and Management | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Mirka Vícen", "text": "prelož mi prosím tento príkaz do slovenského jazyka Actions → Revoke cancellation", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Do slovenčiny by sa tento príkaz preložil takto:\n\n\n\n\n- Actions → Revoke cancellation\n\n- Akcie → Zrušiť zrušenie\n\nTento krok sa používa na obnovenie termínov, ktoré boli automaticky skryté po naplánovanom zrušení registrácie. \n\n\n\nSource:\nSchedule a registration cancellation | Zooza Help", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Mirka Vícen", "text": "kde v klientovej dochádzke nájdem \"Actions\"", "cited": []}, {"role": "customer", "who": "Mirka Vícen", "text": "resp. kde v jeho registrácii", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Nájdete ho v registrácii klienta (booking detail), nie v dochádzke.\n\n\nPostup:\n\n\n\n\n- Idite na Clients → Bookings\n\n\n- Otvorte konkrétnu registráciu klienta (booking detail)\n\n- V tejto registrácii uvidíte tlačidlo Actions\n\n\n- Tam je Actions → Revoke cancellation\n\n\nTento príkaz sa nachádza vždy v detaili registrácie a slúži na obnovenie automaticky skrytých termínov.", "cited": ["Schedule a registration cancellation | Zooza Help", "Client Management FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "Mirka Vícen", "text": "rozprávaš so mnou polovične anglicky a polovične slovensky. mám nastavený systém na slovenčinu a nikde \"Actions\" tlačidlo nevidím. Je možné, že v slovenčine má iný názov, ale akcia to určite nie je", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dobre, ďakujem za upřesnenie — máte pravdu, že v slovenčine sa tento názov môže líšiť.\n\n\nPodľa dokumentácie sa tento tlačidlo nachádza v registrácii klienta (booking detail). \n\n\nPostup:\n\n\n\n\n- Idite na Clients → Bookings\n\n\n- Otvorte konkrétnu registráciu klienta\n\n- V detaili registrácie sa nachádzajú všetky akcie týkajúce sa registrácie (zmena stavu, zrušenie, atď.) \n\n\nDôležité: v slovenčine sa názov tlačidla môže líšiť, pretože jazyk rozhrania si každý používateľ volí samostatne v your name (top right) → My profile → Application Communication Language. \n\n\nMôžete mi povedať, čo presne vidíte v detaili registrácie (ktoré tlačidlá tam máte)? Pomôže mi to presnejšie vás nasmerovať.", "cited": ["Client Management FAQ | Zooza Help", "Bookings | Zooza Help", "Change the language in Zooza | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Ďakujem za screenshot, Mirka — veľmi pomohol. Máte pravdu: na tejto obrazovke skutočne nevidíte tlačidlo „Actions“. \n\n\nPodľa dokumentácie sa tento príkaz nachádza v detaili registrácie a volá sa Actions → Revoke cancellation. \n\n\nNa vašom obrázku však tento panel nevidím. V detaili registrácie sú viditeľné iba:\n\n\n\n\n- Zmeniť stav\n\n- Zrušiť registráciu\n\n- Vymazať registráciu\n\n- Skopírovať registráciu\n\nTlačidlo Actions sa na tejto obrazovke nezobrazuje.\n\n\nMôžem sa ešte spýtať: v Dochádzke u daného klienta sa termíny zobrazujú ako Hidden, alebo sú úplne skryté a nevidíte ich vôbec?", "cited": ["Schedule a registration cancellation | Zooza Help", "Client Management FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Does this clarify things?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc s obnovením skrytého termínu, rada vám pomôžem pokračovať. Chcete doplniť, či sa termín v dochádzke zobrazuje ako „Hidden“, alebo ho nevidíte vôbec?", "cited": []}], "verdict": "gap", "vtitle": "Making a hidden session visible again in a client's attendance (asked 5 times)", "vnote": "The exact inverse of the Transferred answer: sessions with no attendance record are hidden, and the client cannot find where to unhide one. Bot cited Blocks configuration again. High-value, low-effort fix.", "cat": "makeups"}, {"channel": "intercom", "id": "215476137726090", "date": "2026-09-28 14:11", "day": "2026-09-28", "human": false, "bucket": "D_assumed_with_kb", "reask": 1, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Managing client attendance — admin | Zooza Help", "Calendar | Zooza Help", "Attendance and Catch-up Classes FAQ | Zooza Help"], "q": "who was absent last monday NaF course t\non the 21.9.", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Viktória  Rasovská", "text": "who was absent last monday NaF course t\non the 21.9.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I can’t see your account data, but you can check this quickly in the session attendance.\n\n\n\n\n- Go to Calendar\n\n\n- Click the session from 21.9. (Monday)\n\n\n- Open the attendance panel and switch to Quick view or Full view\n\n\nThere you’ll see each client with statuses: Attended, Cancelled, or Did not attend. Anyone marked Did not attend was absent. \n\n\nIf you connect Zooza to Claude or ChatGPT (Zooza AI Assistant in the main menu), it can do this directly in your account — see https://help.zooza.online/setup/claude-plugin/.", "cited": ["Managing client attendance — admin | Zooza Help", "Attendance and Catch-up Classes FAQ | Zooza Help", "Calendar | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help checking attendance for the 21 September session, I’m here to help. Would you like to share more about what you’re trying to find?", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215476136244794", "date": "2026-09-28 13:14", "day": "2026-09-28", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["API overview | Zooza Developer Docs", "Authentication | Zooza Developer Docs", "Quickstart | Zooza Developer Docs"], "q": "what is the Zooza Company ID for API use", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Wie kann ich helfen?", "cited": []}, {"role": "customer", "who": "API Connect", "text": "what is the Zooza Company ID for API use", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "There isn’t a single fixed Company ID you can look up in advance.\n\n\nYou retrieve it via the API:\n\n\n\n\n- First get a token via POST /v1/login\n\n\n- Then call GET /v1/user\n\n\n- In the response, look at data.user.companies\n\n\n- Use the id of the company you want as the value for the X-ZOOZA-COMPANY header in all requests. \n\n\nExample: if a company in that list has id: 65, you send:\n\n\nX-ZOOZA-COMPANY: 65", "cited": ["Authentication | Zooza Developer Docs", "Quickstart | Zooza Developer Docs", "API overview | Zooza Developer Docs"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "API Connect", "text": "what is our company ID", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I can’t see your account data, so I’m not able to tell you the exact company ID.\n\n\nYou can retrieve it via the API:\n\n\n\n\n- First get a token via POST /v1/login\n\n\n- Then call GET /v1/user\n\n\n- In the response, look at data.user.companies\n\n\n- The id of the company you want is the value for the X-ZOOZA-COMPANY header in your requests. \n\n\nExample: if a company in that list has id: 65, you send X-ZOOZA-COMPANY: 65.", "cited": ["Authentication | Zooza Developer Docs", "Quickstart | Zooza Developer Docs"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help finding your company ID, I’m here to help. Would you like to share more about where you’re getting stuck?", "cited": []}], "verdict": "gap", "vtitle": "Where to find the Zooza Company ID for API use", "vnote": "Asked twice; the bot pointed at the developer docs. Pairs with 215476082213906 -- a short 'API credentials: what is what and where to find it' answer covers both.", "cat": "ai"}, {"channel": "intercom", "id": "215476079133253", "date": "2026-09-28 11:05", "day": "2026-09-28", "human": false, "bucket": "D_assumed_with_kb", "reask": 4, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Managing client attendance — admin | Zooza Help", "Creating entry passes | Zooza Help", "Entry pass — client view | Zooza Help", "Booking FAQ | Zooza Help"], "q": "If a child is marked as attended in a Friday Club session, will that automatically deduct a session from their purchased passes if they didn't book as Will Attend?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "If a child is marked as attended in a Friday Club session, will that automatically deduct a session from their purchased passes if they didn't book as Will Attend?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "No. Marking a child as Attended does not deduct a pass entry. \n\n\nPass entries are deducted only when the client books a session in a Pay-as-you-go programme. The system removes one entry at the moment of booking. \n\n\nSo if the child was not booked as “Will attend” for that session, marking them as attended will not automatically deduct a pass entry.", "cited": ["Entry pass — client view | Zooza Help", "Managing client attendance — admin | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Yes - thanks!", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You are very welcome! I am glad I could clarify that for you. Please let me know if there is anything else I can help you with today.", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "How can I deduct a pass entry from someones account if they have attended prior to paying?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You cannot manually deduct a pass entry from a client’s account.\n\n\nIn Zooza, entry pass entries are deducted automatically only when a client books a session in a Pay-as-you-go programme. The system removes one entry at the moment of booking.  \n\n\nSo if a child attended before booking or paying, the pass entry will not be deducted automatically. The usual approach is to have the client book the session (or record the booking on their behalf) so the pass entry is deducted through the normal booking process.", "cited": ["Entry pass — client view | Zooza Help", "Creating entry passes | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answe : [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "Can I turn off the automatic communication emails for a trial booking?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes. You can turn off the automatic emails for trial bookings at the programme level. \n\n\nGo to:\n\n\n\n\n- Programmes → programme → Automations → Trials\n\nThere you can toggle each trial notification on or off individually, including:\n\n\n\n\n- Trial booking confirmation\n\n- Trial ended – booking link\n\n- Trial follow‑up emails\n\n- Trial lost notification\n\nYou can also review or edit the email templates in Communication → Templates if you want to change the message content.", "cited": ["Automated notifications overview | Zooza Help", "Trial Classes FAQ | Zooza Help", "Programme Settings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help adjusting the automatic trial-booking emails, I’m here to help. Would you like to share more about what you’re trying to change?", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215476123893301", "date": "2026-09-27 10:29", "day": "2026-09-27", "human": false, "bucket": "D_assumed_with_kb", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "(no client message)", "turns": [], "verdict": "noise", "vtitle": "Empty conversation", "vnote": "No client message.", "cat": "noise"}, {"channel": "intercom", "id": "215476123288233", "date": "2026-09-27 08:25", "day": "2026-09-27", "human": false, "bucket": "D_assumed_with_kb", "reask": 5, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Blocks Configuration and Management | Zooza Help", "Make-up Sessions FAQ | Zooza Help", "Managing client attendance — admin | Zooza Help", "Make-up Sessions — Complete Guide | Zooza Help", "Getting Help and Support | Zooza Help", "A client wants to move to a later date | Zooza Help"], "q": "presunula som klienta medzi dvoma skupinami  z 9.00 na 9:50 po tom, čo si na jednom termíne 29.9. urobil odhlásenú absenciu a vybral si náhradnú hodinu 6.10. o 9:00. avšak teraz v dochádzke nefiguruje na 6.10. o 9:50 vôbec.", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Mirka Vícen", "text": "presunula som klienta medzi dvoma skupinami  z 9.00 na 9:50 po tom, čo si na jednom termíne 29.9. urobil odhlásenú absenciu a vybral si náhradnú hodinu 6.10. o 9:00. avšak teraz v dochádzke nefiguruje na 6.10. o 9:50 vôbec.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "To sa stáva, keď sa náhradná hodina potvrdí, ale klient sa v dochádzke na túto skutočnú session neobjaví. \n\n\nSkontrolujte dve veci:\n\n\n\n\n- Na Calendar → Session (6.10. 9:50) otvorte dochádzku a skontrolujte, či klient v zozname vôbec je.\n\n- Na registrácii klienta skontrolujte sekciu s kreditmi – či sa kredit na náhradnú hodinu už spotreboval.\n\nAk v dochádzke ani v kreditoch nič nevidíte, pravdepodobne sa náhradná hodina potvrdila, ale nebola skutočne zarezervovaná na túto session.\n\n\nVidíte klienta v dochádzke na tejto session (6.10. 9:50) alebo tam vôbec nie je?", "cited": ["Make-up Sessions — Complete Guide | Zooza Help", "A client wants to move to a later date | Zooza Help"]}, {"role": "customer", "who": "Mirka Vícen", "text": "na náhradnej hodine 9:00 ho vidím, ale na jeho riadnej skupine, kde by mal teraz už figurovať o 9:50 nie je", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "To je očakávané správanie. Keď klient absolvuje náhradnú hodinu v inom skupine, dochádzka sa zaznamenáva v tejto skupine, kde sa náhradná hodina uskutočnila – nie v pôvodnej skupine. \n\n\nV pôvodnej skupine (9:00) uvidíte:\n\n\n\n\n- túto session ako Cancelled (kvôli odhláseniu)\n\n- klient už tam nebude v dochádzke\n\nA v novej skupine (9:50) sa objaví ako klient na náhradnej hodine.\n\n\nDôležité: dochádzka sa neprepojuje medzi skupinami. Ak klient prejde medzi skupinami, dochádzka sa sleduje zvlášť v každej skupine. \n\n\nTakže to, čo vidíte (v 9:00 áno, v 9:50 nie), je správne správanie systému.", "cited": ["Make-up Sessions FAQ | Zooza Help", "Managing client attendance — admin | Zooza Help", "Blocks Configuration and Management | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Mirka Vícen", "text": "pozor - on sa neodhlásil vôbec z termínu 9:50, má tam figurovať", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "To je pravdepodobne preto, že klient má dva oddelené bookings – jeden v pôvodnej skupine a druhý v novej. Dochádzka sa sleduje zvlášť na každom bookingu. \n\n\nNa Calendar → Session (6.10. 9:50) otvorte dochádzku a skontrolujte:\n\n\n\n\n- či klient je v zozname na tejto session\n\n- či sa nachádza v sekcii make‑up students pod hlavným zoznamom\n\nPri náhradných hodinách sa klienti v dochádzke zobrazujú pod hlavným zoznamom ako make‑up students, nie medzi štandardnými účastníkmi. \n\n\nVidíte ho v tejto sekcii na session 9:50?", "cited": ["Managing client attendance — admin | Zooza Help", "Make-up Sessions FAQ | Zooza Help"]}, {"role": "customer", "who": "Mirka Vícen", "text": "nenachádza sa tam vôbec", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Díky za upřesnění. Pokud klient není v docházce na session 6.10. 9:50 a ani v sekci make‑up students, systém pravděpodobně nemá na této session žádnou rezervaci pro něj. \n\n\nSkontrolujte dve veci:\n\n\n\n\n- Na Calendar → Session (6.10. 9:50) otvorte dochádzku a skontrolujte, či klient v zozname vôbec je.\n\n- Na registrácii klienta skontrolujte sekciu Credits – či sa kredit na náhradnú hodinu už spotreboval. \n\n\nAk v dochádzke ani v kreditoch nič nevidíte, môže sa stať, že náhradná hodina bola potvrdená, ale skutočná rezervácia na túto session nebola vytvorená.\n\n\nVidíte na klientovej registrácii v Credits, že kredit na náhradnú hodinu je označený ako Used?", "cited": ["Make-up Sessions FAQ | Zooza Help", "Make-up Sessions — Complete Guide | Zooza Help", "Managing client attendance — admin | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc s týmto problémom, rada vám pomôžem ho ďalej objasniť. Môžete opísať, čo presne vidíte pri registrácii klienta a pri session 6.10. o 9:50?", "cited": []}, {"role": "customer", "who": "Mirka Vícen", "text": "oslovila som radšej team a vytvorila ticket", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ďakujem, Mirka — to je úplne správny postup.\n\n\nKeď ide o špecifický booking a dochádzku v konkrétnej session, je najlepšie, keď sa tím pozrie na presné dáta v účte. Pri ticketu je dobré pridať:\n\n\n\n\n- screenshot session 6.10. 9:50\n\n\n- profil klienta\n\n- krátky popis, čo sa stalo\n\nTo pomáha rýchlejšie identifikovať, prečo klient v dochádzke nefiguruje. \n\n\n\nSource:\nGetting Help and Support | Zooza Help", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak budete potrebovať s týmto problémom ešte pomôcť, som vám k dispozícii. Chcete doplniť niečo ďalšie k vytvorenému ticketu alebo k situácii s dochádzkou?", "cited": []}], "verdict": "gap", "vtitle": "Moved between groups, now missing from attendance on the make-up date (asked 5 times)", "vnote": "Same root cause as 215476015418521 and 215476123313841. The bot cited Blocks configuration, which is not related. One good article on the attendance lifecycle closes all three.", "cat": "makeups"}, {"channel": "intercom", "id": "215476123111577", "date": "2026-09-27 08:03", "day": "2026-09-27", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "confirmed_resolution", "rating": null, "carried": null, "sources": ["Individual Sessions: How to Sell, Plan, and Manage 1:1 Sessions in Zooza | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Add a one-off scheduled payment | Zooza Help"], "q": "Dobry den, ako prosim nastavim platobnu sablonu iba pre konkretnu 1 registráciu a nie pre celú skupinu ?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": "barbora zajacová", "text": "Dobry den, ako prosim nastavim platobnu sablonu iba pre konkretnu 1 registráciu a nie pre celú skupinu ?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Platobná šablóna sa v Zooza nedá nastaviť iba pre jednu konkrétnu registráciu. Šablóny sa vytvárajú na úrovni programu a potom sa používajú na úrovni triedy (skupiny).\n\n\nAk potrebujete špeciálny platobný plán iba pre jedného klienta, máte dve možnosti:\n\n\n\n\n- Použiť existujúcu šablónu a priradiť ju k tej registrácii.\n\n- Pridať jednorazové plánované platby priamo v registrácii:\n• Bookings → otvorte registráciu\n• Payment plan\n• Add scheduled payment\n\n\nTýmto spôsobom môžete vytvoriť úplne špeciálny plán iba pre túto jednu registráciu.", "cited": ["Payments and Billing FAQ | Zooza Help", "Add a one-off scheduled payment | Zooza Help", "Individual Sessions: How to Sell, Plan, and Manage 1:1 Sessions in Zooza | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Hledali jste tohle?", "cited": []}, {"role": "customer", "who": "barbora zajacová", "text": "ano, pozriem sa na to,zatial dakujem", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rád vám pomôžem, kedykoľvek budete potrebovať ďalšiu pomoc. Neváhajte sa ozvať, ak budete mať ďalšie otázky! 😊", "cited": []}], "verdict": "check", "vtitle": "Setting a payment template for one registration rather than the whole group", "vnote": "Asked twice. The bot cited Add a one-off scheduled payment, which may well be the right answer -- check whether the article frames it as 'one registration only'.", "cat": "payments"}, {"channel": "intercom", "id": "215476109457055", "date": "2026-09-26 10:37", "day": "2026-09-26", "human": true, "bucket": "HUMAN", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Preco maily, ktore chodia zo Zoozy na klientov su z adresy REPLY - uz v minulosti sa toto riesilo a malo to ist aspon z adresy NOREPLY\n\nSom si dnes zas vsimol, ze odchadzajuci mail isiel z adresy menom REPLY + nebolo v nom zas uvedene, ako byva pri niektorych automatickych, ze je to adresa, na ktoru nemaju odpovedat...\n\nUz ste to kedysi riesili a na standardne maily ste dali aspon tu hlasku o neodpovedani na koniec + adresa sa zmenila na noreply. Aletoto REPLY je uplne odveci, lebo vserci tam odpovedaju a ja uz neviem odpovedat v stringu na to priamo z mailu, ked uz. \n\nZaroven preco tam nie je v odosielatelovi okrem ZOOZA adresy aj moja futureengineers@youngengineers.sk. Ked mi odpovedia, aspon by som im vedel odpovedat spat rovno z mailu. Zo zoozy je to odveci, lebo nemam track mailov v mailboxe a tiez to nedrzi historiu, co si pamatam, myslim mail string. \n\nDalo by sa to nastavit normalne, ako byvaju ticketovacie systemy? Ze clovek pise v maile, napriklad outlooku a zaroven sa to zapisuje do systemu? \n\npi 25. 9. 2026 o 11:20 Young Engineers - Slovakia  napísal(a):\n \n\nAhojte, \n \nchcem Vas v prvom rade privitat na nasom kruzku Algo Play v Rovinke, na ktory ste sa prihlasili a ktory zacne od prvej oktobrovej STREDY. \nZaroven sa nam na predchadzajuci kruzok v Rovinke neprihlasilo dost deti, tak tento rok Bricks Challenge neotvorime k oktobru urcite, co nam otvara moznost posunut cas zaciatku Vasho Algo Play zo 16:45 na 15:00. Koncili by sme 16:15. \n \nDajte mi pls vediet, idealne dnes, odpovedou na tento email, ale na nasledujucu adresu: futureengineers@youngengineers.sk\nAk by ste s tym bolii OK vsetci 7mi prihlaseni, mozme to posunut. Deti si z druziny, ak chodia do Kulturaku v Rovinke, vieme brat sami. Aj ich tam teoreticky vieme vratit. \n \nVopred dakujem za info a tesim sa na zaciatok kurzu, \n \nMikuláš Fedor\n \nTrainer & Franchisee\nwww.mladiinzinieri.sk\n \nTel: +421 950 446 110\nEmail: futureengineers@youngengineers.sk", "turns": [{"role": "customer", "who": null, "text": "Preco maily, ktore chodia zo Zoozy na klientov su z adresy REPLY - uz v minulosti sa toto riesilo a malo to ist aspon z adresy NOREPLY\n\nSom si dnes zas vsimol, ze odchadzajuci mail isiel z adresy menom REPLY + nebolo v nom zas uvedene, ako byva pri niektorych automatickych, ze je to adresa, na ktoru nemaju odpovedat...\n\nUz ste to kedysi riesili a na standardne maily ste dali aspon tu hlasku o neodpovedani na koniec + adresa sa zmenila na noreply. Aletoto REPLY je uplne odveci, lebo vserci tam odpovedaju a ja uz neviem odpovedat v stringu na to priamo z mailu, ked uz. \n\nZaroven preco tam nie je v odosielatelovi okrem ZOOZA adresy aj moja futureengineers@youngengineers.sk. Ked mi odpovedia, aspon by som im vedel odpovedat spat rovno z mailu. Zo zoozy je to odveci, lebo nemam track mailov v mailboxe a tiez to nedrzi historiu, co si pamatam, myslim mail string. \n\nDalo by sa to nastavit normalne, ako byvaju ticketovacie systemy? Ze clovek pise v maile, napriklad outlooku a zaroven sa to zapisuje do systemu? \n\npi 25. 9. 2026 o 11:20 Young Engineers - Slovakia  napísal(a):\n \n\nAhojte, \n \nchcem Vas v prvom rade privitat na nasom kruzku Algo Play v Rovinke, na ktory ste sa prihlasili a ktory zacne od prvej oktobrovej STREDY. \nZaroven sa nam na predchadzajuci kruzok v Rovinke neprihlasilo dost deti, tak tento rok Bricks Challenge neotvorime k oktobru urcite, co nam otvara moznost posunut cas zaciatku Vasho Algo Play zo 16:45 na 15:00. Koncili by sme 16:15. \n \nDajte mi pls vediet, idealne dnes, odpovedou na tento email, ale na nasledujucu adresu: futureengineers@youngengineers.sk\nAk by ste s tym bolii OK vsetci 7mi prihlaseni, mozme to posunut. Deti si z druziny, ak chodia do Kulturaku v Rovinke, vieme brat sami. Aj ich tam teoreticky vieme vratit. \n \nVopred dakujem za info a tesim sa na zaciatok kurzu, \n \nMikuláš Fedor\n \nTrainer & Franchisee\nwww.mladiinzinieri.sk\n \nTel: +421 950 446 110\nEmail: futureengineers@youngengineers.sk", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Vážený Mikuláš,\n\n\nváš tiket byl přijat. Asistent Zooza se vám pokusí ihned pomoci — a člen našeho týmu jej také osobně zkontroluje.\n\n\n— Podpora Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Napísať, \n\n\n\n\n- nemá vlastný mailový server mesačne, po overení domény, 40 eur, odosielať si z vlastnej domén\n\n- notifikácia na reply\n\n- a niektoré maily su reply a niektoré no reply\n\n- odchádzanie z emailovaj adresy (mailový server)", "cited": []}], "verdict": "verify", "vtitle": "Why client emails come from a reply address rather than no-reply", "vnote": "Recurring complaint. The agent's note mentions sending from your own domain after verification for 40 EUR a month, and that some mails are reply and some no-reply. Those are claims about pricing and behaviour in an internal note, not a finished answer to the client -- I will not put them in the KB without you confirming them.", "cat": "comms"}, {"channel": "intercom", "id": "215476053692257", "date": "2026-09-26 10:33", "day": "2026-09-26", "human": true, "bucket": "HUMAN", "reask": 4, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Set up a contact form | Zooza Help", "Contact widget | Zooza Developer Docs"], "q": "The question is for Martin, please", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "The question is for Martin, please", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I'm passing it to the team, and could you please write in one or two sentences what it concerns, with a link or screenshot if you have one, so the team can pick it up straight away?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Hi Martin!\n\n\nThank you for the new contact form. We tested it and it looks just right.\n\n\nWe have a few questions:\n\n\nStatus: Blocked domain - what does this mean? Is it a good thing?\n\n\nIs it possible to have only one field, Nume (Name), instead of Name (Prenumele) and Surname (Numele de familie)? We need the two separate fields for the other forms. \n\n\nRegarding the consents, is it possible to have our terms come first?\n\n\nAlso, could you please change:\n\n\n“Făcând click pe butonul „Înregistrare”,...”\n\n\nto:\n\n\n“Apăsând pe butonul [TRIMITE], confirm...”\n\n\nThe issue is that the displayed name of the button is different depending on the form. Is it possible to retrieve the correct button name each time? Or maybe “Apăsând pe butonul de mai jos, confirm...” would be sufficient?\n\n\nThank you!", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thank you for the detailed questions and the screenshot.\n\n\n1. “Status: Blocked domain”\n\n\nThis status is not explained in the help article about contact forms, so I cannot confirm what it means from the documentation. \n\n\n2. Using only one name field\n\n\nYes. The contact form standard fields (First name, Surname, Email, Phone, Message) can be turned on or off. You can keep only First name and hide Surname for that form.\n\n\n3. Consent text order\n\n\nThe documentation only states that you choose which consents appear on the form. It does not mention changing the order of the consent text itself. \n\n\n4. Button name in the consent text\n\n\nThe documentation does not describe a way to automatically insert the button label into the consent text.", "cited": ["Set up a contact form | Zooza Help", "Contact widget | Zooza Developer Docs"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "A reply from Martin when convenient would be much appreciated. Thank you!", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I understand your preference to hear from Martin directly. I will make sure your questions are noted for him. Meanwhile, please feel free to share any other details or questions you have, and I will do my best to assist you. 😊", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I understand you would prefer a reply from Martin, and I’m here if you need any further help with these questions. Would you like to add any other details for the team?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Mara, thank you for getting back to us.\nBlocked domains - this form is really \"plain\" in a good sense - easy to fill. But that also exposes the risk of getting lots of spam messages from bots and various AI's of the world. Thus we had to build comprehensive spam protection and one of the features is that we only accept requests from the URL's which are declared within the app. Blocked domain simply means that there was incoming request/submission from unregistered domain. So in the Widget's setting (Team and settings -> publish -> widget -> contact - there you can manage list of domains from which you'll be accepting submissions.\n\n\n\n\n\nOn name field - I guess this could be possible but what would you expect to happen on the system's side? Leave the full name as it is or try to split it between first/last name columns?\n\n\n\n\n\nOn consents order: I guess this should not be an issue it is just about the priority, I did set your agreements to have higher priority so please check if that helped. \n\nOn translation - for sure. You know romanian language better than us:) so please send me the translation you want to have and we can do that. Or if you think you need to customize the button per form, we can put that into app directly so you can rename the butotn according to what the contact form is used for", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "On the Meta connection - we're still waiting for the approval from Meta. I expect it to land by the end of the week and if everything will go smoothly then you will be able to connect to your fb pages and fetch the leads from facebook and feed your contacts to fb audiences", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "This is how the integration looks like (on our test)\n​", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "So you will even be able to track the consents back from meta. The consents you set up need to be assigned to marketing category but that is just a small thing", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Hi Martin, thank you for your reply!\n\n\nOn name field – if possible, maybe leave the full name as it is and we’ll split it manually when they become clients.\n\n\nOn consents order – I’m afraid it hasn’t changed: https://nominjyuku.ro/contact-2/\n\n\nOn translation – The submit button has different names on the different forms. For the contact form, it is called TRIMITE; for the current demo form, it is called ÎNREGISTRARE; and for the class enrollment form, it is called ÎNSCRIEȚI-VĂ.\n\n\nThe text above the button refers to it as ÎNREGISTRARE, which may be a little confusing.\n\n\nIf possible, I would like this text to reflect the correct name of the button. As far as I know, this text can only be changed by you, as it refers to Zooza terms and is mandatory.\n\n\nRegarding the translation, the only thing I would change is Făcând clic... to Apăsând pe butonul...\n\n\nThanks for the Meta update. I’m sure Sorina and Nomin are looking forward to the a  ste mohli. Dakujeme", "cited": []}], "verdict": "gap", "vtitle": "Client cannot work out how payments fit together, asks for a walkthrough", "vnote": "Parents keep getting underpayment and overpayment emails although she has reconciled everything. Offer was a screen-share, so there is no answer to lift -- but a client asking for a call to understand the payment model is a KB signal. Check whether a plain-language 'how payments work end to end' overview exists or whether we only have per-screen articles.", "cat": "payments"}, {"channel": "intercom", "id": "215476112052967", "date": "2026-09-26 05:37", "day": "2026-09-26", "human": false, "bucket": "D_assumed_with_kb", "reask": 7, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Trial sessions | Zooza Help", "New programme with existing clients | Zooza Help", "Programme Settings | Zooza Help", "Blocks (Term Segments) FAQ | Zooza Help", "Registration and Booking FAQ | Zooza Help", "Trial Classes FAQ | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Class Detail | Zooza Help", "Run a term reset — move all clients to a new term | Zooza Help", "Priority registration for returning customers | Zooza Help"], "q": "can zooza only allow someone to book one trail, I am starting a new class term and do not want people who have already booked a trial to be able to book a trial again", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "can zooza only allow someone to book one trail, I am starting a new class term and do not want people who have already booked a trial to be able to book a trial again", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — you can limit trials to one session per client.\n\n\nSet the trial to Single Session in the programme settings. When this is selected, clients can register for one trial session only, and after that the normal post‑trial process begins. \n\n\nYou can configure this in:\n\n\nProgramme → Settings → Trial and choose Free Trial (Single Session) or Paid Trial (Single Session). \n\n\nOne extra detail: if a trial is still active, the system will also not allow a new registration with the same email into the same class, which helps prevent repeat trials during the trial period.\n\n\nSo for a new term, setting the trial to Single Session is the usual way to ensure people only take one trial.", "cited": ["Trial Classes FAQ | Zooza Help", "Trial sessions | Zooza Help", "Registration and Booking FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "yes", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I'm glad to hear that was helpful! If you have any more questions or need further assistance with your class setup, please feel free to ask. I'm here to help! 😊", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "can I change the trial price per class", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — but it works at the programme level, not per class.\n\n\n\n\n- In Programme → Settings → Trial, you set a Unit price for Trial.\n\n- That price is used for every trial session in that programme. \n\n\nIf you want different prices for different classes, you can set a class-level price for the regular programme price, but the trial price itself is still the same across the programme.  \n\n\nSo: trial price = one value per programme, not per class.", "cited": ["Trial sessions | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Programme Settings | Zooza Help", "Class Detail | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "yes so I have done trials at 60aed for the first classes but want to increase this to 80aed for my next block of classes, if I change it at programme levels its going to change them all", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You’re right — changing the trial price in Programme → Settings → Trial will update it for all trial sessions in that programme. \n\n\nIf you want 60 AED for the first block and 80 AED for the next, the clean way is to run them in separate programmes. That lets you set a different trial unit price for each programme. \n\n\nQuick summary:\n\n\n\n\n- Trial price is set per programme\n\n- Changing it affects all trials in that programme\n\n- Different trial prices → use separate programmes\n\nThis is the recommended setup when you want different pricing between terms or blocks.", "cited": ["Trial sessions | Zooza Help", "Trial Classes FAQ | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help managing different trial prices for your class blocks, I’m here to help. Would you like to share more about how your programmes and upcoming classes are arranged?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "can someone who has already booked a trial, book another one on the new term", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — they can book another trial in a new term.\n\n\nOnce a trial reaches a final state (for example Trial Won or Trial Lost), the client is allowed to register again. \n\n\nAlso, if you run the new term as a separate programme, the system treats it as a completely different booking, so the same client can sign up again. \n\n\nSo in practice:\n\n\n\n\n- Client does a trial in term 1\n\n- Trial finishes\n\n- They can book a trial again in the new term/programme", "cited": ["Trial Classes FAQ | Zooza Help", "New programme with existing clients | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "can I turn this off", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — you can stop trials for the new term.\n\n\nGo to Programme → Settings → Trial and set Trial type: None. This removes trial bookings completely, so clients will only see the option to enrol in the programme. \n\n\nIf you are using blocks (terms), you can also open the block and set Offer trial lessons for this block to No to hide trials just for that block.", "cited": ["Run a term reset — move all clients to a new term | Zooza Help", "Blocks (Term Segments) FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "I want trials but for only new clients", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Short answer: no — Zooza cannot restrict trials to “new clients only.”\n\n\nTrials are configured at the programme level, and the system does not have a setting to block clients who have already taken a trial from booking another one.\n\n\nWhat you can do instead:\n\n\n\n\n- Use Priority registration to give returning clients early access to the term before it opens to everyone.\n\n\n- Or run the new term as a separate programme and manage access manually.\n\nSo the platform supports prioritising returning clients, but not fully excluding them from trials.", "cited": ["Trial Classes FAQ | Zooza Help", "Priority registration for returning customers | Zooza Help", "Blocks (Term Segments) FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help managing trials for new and returning clients, I’m here to help. Would you like to share more about how you want to organise access for the new term?", "cited": []}], "verdict": "gap", "vtitle": "Preventing someone who already had a trial from booking another (asked 7 times)", "vnote": "Bot cited Trial sessions and Programme Settings and never answered. Pairs with 215476047149616 and 215476045907554 -- trials are the weakest area this week.", "cat": "trials"}, {"channel": "intercom", "id": "215476062944131", "date": "2026-09-23 06:46", "day": "2026-09-23", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "routed_to_team", "rating": null, "carried": "2026-09-23", "sources": [], "q": "Poprosím o spojenie s ľudským asistentom.", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Poprosím o spojenie s ľudským asistentom.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I'm connecting you with someone from our team now. Meanwhile, could you please share a bit more about what you need help with? This will help them assist you more efficiently.", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Dobrý deň, potrebovali by sme zrušiť časový limit na potvrdenie registrácie rodiča, ktorý je momentálne nastavený na 5 minút. Je to súrne. Ďakujeme za promtné vybavenie našej požiadavky.", "cited": []}], "verdict": "noise", "vtitle": "Request for a human agent", "vnote": "No content.", "cat": "noise"}, {"channel": "intercom", "id": "215476024882778", "date": "2026-09-21 10:50", "day": "2026-09-21", "human": false, "bucket": "D_assumed_with_kb", "reask": 0, "resolution": "routed_to_team", "rating": null, "carried": "2026-09-21", "sources": [], "q": "Hi Michal,   \n   Response from our accountants, please can you assist as my VAT is to be submitted imminently . The last issue regarding refunds/credit notes is one which we will need to find a solution to otherwise I am not compliant with the UAE FTA.   \n   Here is her responses below in blue:  \n  Stripe payments not syncing to Xero / invoices showing as Awaiting Payment\n\n From my side, the Zooza/Xero setup looks correct from last reconnection. The Xero bank account and revenue account are both configured in Zooza.\n\n https://asia.zooza.app/#settings/invoice_profiles/8\n\n \n\n Could you please send us a screenshot example of an invoice or list of invoices where this is happening? See screenshot below. As you can see, all the September invoices still show as “Awaiting payment” even though Stripe has probably settled the majority.\n\n \n\n  \n\n If what you are seeing is correct, then we need to investigate it properly, but at first glance it may be something on the Xero side. \n\n One thing to take into account: Zooza only request invoice generation once payment has been received and the debt for that period is settled, so there should not normally be a situation where the invoice is generated but the related payment is not reflected.\n\n 3. Refunds / credit notes in Xero\n\n Yes, this is confirmed.\n\n Zooza currently does not automatically generate credit notes for refunds in Xero. That is by design at the moment, because credit note/refund handling differs quite a lot by country and accounting setup.\n\n I think the way you are handling it,,, posting one credit note for the total,,, is reasonable, although I understand your accountant’s point that ideally each line/refund would have its own credit note.\n\n Just want to reiterate that it has to be separate. The tax authorities could request this at any point. We are only doing the bulk credit note as an interim measure.\n\n The link below leads to the log in page for Zooza which we don’t deal with. Please can you download the report and send to us as csv file.\n\n Zooza does provide the refund list for visibility and reconciliation. Here is the August refund export view:\n https://asia.zooza.app/#payments/refunds/issued?start=2026-08-01&end=2026-08-31&page=0&page_siz hing to take into account: Zooza only request invoice generation once payment has been received and the debt for that period is settled, so there should not normally be a situation where the invoice is generated but the related payment is not reflected.\n\n 3. Refunds / credit notes in Xero\n\n Yes, this is confirmed.\n\n Zooza currently does not automatically generate credit notes for refunds in Xero. That is by design at the moment, because credit note/refund handling differs quite a lot by country and accounting setup.\n\n I think the way you are handling it,,, posting one credit note for the total,,, is reasonable, although I understand your accountant’s point that ideally each line/refund would have its own credit note.\n\n Just want to reiterate that it has to be separate. The tax authorities could request this at any point. We are only doing the bulk credit note as an interim measure.\n\n The link below leads to the log in page for Zooza which we don’t deal with. Please can you download the report and send to us as csv file.\n\n Zooza does provide the refund list for visibility and reconciliation. Here is the August refund export view:\n https://asia.zooza.app/#payments/refunds/issued?start=2026-08-01&end=2026-08-31&page=0&page_size=50\n\n We know this topic has been open for a while, and it is part of the wider refund/reporting improvements we have been discussing.\n\n  \n\n  \n\n  \n    \n           Best Wishes          Anna Blackwell\n Owner - Turtle Tots Dubai\n    T: 052 748 1060\n E: anna.blackwell@turtletots.com\n                          WHP2-Block-A Commercial, Property Number P2AG-A09, Plot 13-0 | DM Land No: 532-8359 | Saih Shuaib 3 | Dubai | UAE |      \n     This email and any attachments to it may be confidential and are intended solely for the use of the individual to whom it is addressed. Any views or opinions expressed are solely those of the author and do not necessarily represent those of Turtle Tots. If you are not the intended recipient of this email, you must neither take any action based upon its contents, nor copy or show it to anyone. Please contact the sender if you believe you have received this email in error.", "cited": []}, {"role": "customer", "who": "Brian James", "text": "Hi Anna,\n\n\nThank you for sending this through.\n\n\nRegarding the September invoices showing as Awaiting Payment in Xero, thank you for the screenshot, that is very helpful. From my side, the Xero setup in Zooza still looks correct, but I’ll pass this to the team to investigate properly.\n\n\nJust to clarify, each payment would have been received in Stripe first, otherwise Zooza would not send the request to generate the invoice in Xero. So the payment side itself should be fine, but we need to check why Xero is not marking those invoices correctly as paid.\n\n\nI’ll ask the team to look into this and I’ll come back to you once we have more detail.\n\n\nRegarding refunds and credit notes, I understand the accountant’s point that this needs to be separated properly for compliance, and that the current bulk credit note is only an interim workaround.\n\n\nAt the moment, Zooza provides the refund report/export for reconciliation. The report is available inside Zooza and can be downloaded as a CSV. We can send this report to you, and potentially it can also be sent directly from the app if you set that up.\n\n\nFor now, I’ll arrange the refund export/report and share it with you so you can forward it to your accountant.\n\n\nBest,\nMichal", "cited": []}], "verdict": "check", "vtitle": "UAE VAT: refunds and credit notes for FTA compliance", "vnote": "Unanswered for 11 days with a VAT deadline attached. Credit notes are a genuine product gap, not a KB question.", "cat": "payments"}, {"channel": "intercom", "id": "215475993271114", "date": "2026-09-18 13:32", "day": "2026-09-18", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "routed_to_team", "rating": null, "carried": "2026-09-18", "sources": [], ent? I’m also happy to assist further if you share what you’re trying to confirm about the Stripe setup.", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "connect to human agent", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Certainly, I will connect you with someone from our team. Meanwhile, could you please share any additional details about your Stripe connection issue to help them assist you more efficiently?", "cited": []}], "verdict": "check", "vtitle": "Stripe disconnected after the ghost accounts were deleted", "vnote": "Unanswered for 14 days and marked urgent by the client -- they cannot send booking links. Worth chasing regardless of the KB.", "cat": "payments"}, {"channel": "intercom", "id": "215475989640724", "date": "2026-09-18 06:08", "day": "2026-09-18", "human": false, "bucket": "D_assumed_with_kb", "reask": 17, "resolution": "routed_to_team", "rating": null, "carried": "2026-09-18", "sources": ["Lista de verificare pentru lansarea noilor cursuri: Ce uită majoritatea înainte de sezon — Zooza"], "q": "de ce nu imi apare o clasa nou creata pe site?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Cu ce vă pot ajuta?", "cited": []}, {"role": "customer", "who": "Dan Teodorescu", "text": "de ce nu imi apare o clasa nou creata pe site?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Cel mai des, o clasă creată în admin nu apare pe site pentru că nu a fost testată și verificată ca flux complet de înregistrare. Înainte de lansare, este important să parcurgeți procesul ca un părinte: să găsiți cursul, să deschideți pagina lui, să selectați grupul și să mergeți până la confirmare. Dacă ceva se rupe în acest parcurs, cursul poate să nu fie accesibil pe site. \n\n\nPentru să vă pot ghida mai exact: pe ce pagină în admin ați creat clasa?\n\n\n\nSource:\nLista de verificare pentru lansarea noilor cursuri: Ce uită majoritatea înainte de sezon — Zooza", "cited": []}, {"role": "customer", "who": "Dan Teo <script id="app">
const el = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MARKETING = /— Zooza$|Zooza PRO|Cen[íi]k|Cennik/;
const CATLBL = Object.fromEntries(META.categories);
const DECS = META.decisions.map(d => d[0]);
const SHORT = {ok:'Fine', kb:'KB', dig:'Dig', product:'Product'};

let filter='todo', catf='', q='', open=null, cursor=0, readOnly=false;

const S = c => (c && c.id ? (STATE[c.id] ||= {d:'', cat:c.cat, note:'', sug:''})
                          : {d:'', cat:'', note:'', sug:''});
const byId = id => DATA.find(c => c.id === id);

const FILTERS = [
  ['todo',   'To decide', '',        c => !S(c).d],
  ['all',    'All',       '',        c => true],
  ['kb',     'KB',        'k-kb',    c => S(c).d === 'kb'],
  ['dig',    'Dig',       'k-dig',   c => S(c).d === 'dig'],
  ['ok',     'Fine',      'k-ok',    c => S(c).d === 'ok'],
  ['waiting','Still waiting','k-wait',c => !!c.carried],
  ['noted',  'My notes',  '',        c => !!S(c).note],
  ['human',  'Human',     '',        c => c.human && c.channel === 'intercom'],
  ['bot',    'AI only',   '',        c => !c.human],
];

/* ── saving ───────────────────────────────────────────── */
let timer=null, artifact=null, dirty=false;
const mirror = () => { try{ localStorage.setItem('zb-'+META.end, JSON.stringify(STATE)); }catch(e){} };
const setSave = (t,c) => { const s=el('#save'); s.textContent=t; s.className='save '+(c||''); };
function touch(){ dirty=true; mirror(); setSave('Unsaved…'); clearTimeout(timer); timer=setTimeout(commit,2500); }

function buildDoc(){
  const css=document.getElementById('sheet').textContent;
  const skel=document.getElementById('skeleton').innerHTML;
  const app=document.getElementById('app').textContent;
  const enc=o=>JSON.stringify(o).replace(/</g,'\\u003c')
    .replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  const S_='<'+'script', E_='<'+'/script>';
  return '<!doctype html><html lang="en"><head><meta charset="utf-8">'
    +'<meta name="viewport" content="width=device-width,initial-scale=1">'
    +'<title>'+esc(document.title)+'</title><style id="sheet">'+css+'</style></head><body>'
    +skel+'<template id="skeleton">'+skel+'</template>'
    +S_+' id="data">const DATA='+enc(DATA)+';const META='+enc(META)+';'+E_
    +S_+' id="state">const STATE='+enc(STATE)+';'+E_
    +S_+' id="app">'+app+E_+'</body></html>';
}
async function commit(){
  if(!dirty||readOnly) return;
  if(!artifact){ setSave('Saved on this device'); dirty=false; return; }
  setSave('Saving…');
  try{
    sessionStorage.setItem('zb-open', open||''); sessionStorage.setItem('zb-filter', filter);
    await artifact.publish(buildDoc()); dirty=false; setSave('Saved','on');
  }catch(e){
    const c=e&&e.code;
    if(c==='conflict') return;
    if(c==='rate_limited'){ timer=setTimeout(commit,8000); setSave('Queued…'); return; }
    if(['not_writer','not_granted','not_declared','capability_disabled','capability_removed'].includes(c)){
      readOnly=true; setSave('Read-only view','err'); return; }
    setSave('Saved on this device only','err');
  }
}

/* ── rendering ────────────────────────────────────────── */
function matches(c){
  if(!FILTERS.find(f=>f[0]===filter)[3](c)) return false;
  if(catf && S(c).cat!==catf) return false;
  if(!q) return true;
  return (c.q+' '+c.vtitle+' '+c.vnote+' '+c.id+' '+S(c).note+' '+
          c.turns.map(t=>t.text).join(' ')).toLowerCase().includes(q);
}
const visible = () => DATA.filter(matches);

function renderBar(){
  const n=DATA.length, by={ok:0,kb:0,dig:0,product:0};
  DATA.forEach(c=>{ const d=S(c).d; if(d) by[d]=(by[d]||0)+1; });
  const done=by.ok+by.kb+by.dig+by.product;
  el('#seg').innerHTML=DECS.map(k=>by[k]?'<i class="'+k+'" style="width:'+(by[k]/n*100)+'%" title="'+SHORT[k]+' '+by[k]+'"></i>':'').join('');
  el('#done').innerHTML='<b>'+done+'</b> / '+n+' decided';
  el('#chips').innerHTML=FILTERS.map(([k,label,cls,fn])=>
    '<button class="chip '+cls+'" data-f="'+k+'" aria-pressed="'+(filter===k)+'">'+
    label+' <b>'+DATA.filter(fn).length+'</b></button>').join('');
}

function rowHTML(c){
  const s=S(c), out=[];
  out.push('<span class="pill cat">'+esc(CATLBL[s.cat]||s.cat)+'</span>');
  if(c.carried) out.push('<span class="pill wait">waiting since '+c.carried+'</span>');
  if(c.reask>=4) out.push('<span class="pill re">'+c.reask+'× re-asked</span>');
  if(s.note) out.push('<span class="pill note">note</span>');
  if(!s.d&&s.sug) out.push('<span class="pill sug">'+SHORT[s.sug]+'?</span>');
  return '<div class="line">'
    +'<span class="dot '+(c.human?'h':'b')+'" title="'+(c.human?'A human replied':'AI only')+'"></span>'
    +'<span class="tm mono">'+c.date.slice(11)+'</span>'
    +'<span class="ttl">'+esc(c.vtitle||c.q)+'</span>'
    +'<span class="meta">'+out.join('')+'</span>'
    +'<span class="acts">'+DECS.map(k=>
        '<button class="act a-'+k+'" data-d="'+k+'" data-id="'+c.id+'" aria-pressed="'+(s.d===k)+'"'
        +' title="'+SHORT[k]+'">'+SHORT[k]+'</button>').join('')+'</span>'
    +'</div>';
}

function panelHTML(c){
  const s=S(c);
  let h='<div class="panel">';
  if(c.verdict) h+='<div class="read"><div class="k">Claude reads this as: '+esc(c.verdict)+'</div><p>'+esc(c.vnote)+'</p></div>';
  h+='<div class="frm">'
    +'<button class="idc mono" data-copy="'+c.id+'">'+c.id+'</button>'
    +'<select class="sel" data-cat="'+c.id+'">'+META.categories.map(([k,l])=>
        '<option value="'+k+'"'+(s.cat===k?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select>'
    +'<textarea class="note" data-note="'+c.id+'" placeholder="What you want done with this one. Screenshots go in the chat — quote the id.">'+esc(s.note)+'</textarea>'
    +'</div><div class="thread">';
  for(const t of c.turns){
    if(!t.text&&!t.cited.length) continue;
    const r=t.role==='customer'?'customer':(t.role==='human'?'human':'bot');
    const w=r==='customer'?esc(t.who||'Client'):r==='human'?esc(t.who||'Zooza'):'AI';
    h+='<div class="turn t-'+r+'"><div class="who">'+w+'</div><div class="bub">'+esc(t.text);
    if(t.cited.length) h+='<div class="cited"><b>Cited</b>'+t.cited.map(x=>
      '<div class="'+(MARKETING.test(x)?'m':'')+'">'+esc(x)+'</div>').join('')+'</div>';
    h+='</div></div>';
  }
  return h+'</div></div>';
}

function renderList(){
  const rows=visible();
  if(cursor>=rows.length) cursor=Math.max(0,rows.length-1);
  if(!rows.length){ el('#list').innerHTML='<p class="empty">Nothing matches that.</p>'; return; }
  let h='', day='';
  rows.forEach((c,i)=>{
    if(c.day!==day){ day=c.day;
      h+='<div class="day">'+new Date(day+'T12:00:00').toLocaleDateString('en-GB',
         {weekday:'long',day:'numeric',month:'long'})+'</div>'; }
    const s=S(c), isOpen=open===c.id;
    h+='<div class="row'+(s.d?' decided d-'+s.d:'')+(isOpen?' open':'')+(i===cursor?' cursor':'')
      +'" data-id="'+c.id+'" data-i="'+i+'">'+rowHTML(c)+(isOpen?panelHTML(c):'')+'</div>';
  });
  el('#list').innerHTML=h;
}

function renderRoll(){
  const keys=META.categories.map(x=>x[0]), agg={};
  keys.forEach(k=>agg[k]={n:0,kb:0,dig:0,ok:0,product:0,todo:0});
  DATA.forEach(c=>{ const s=S(c), a=agg[s.cat]||(agg[s.cat]={n:0,kb:0,dig:0,ok:0,product:0,todo:0});
    a.n++; if(s.d) a[s.d]++; else a.todo++; });
  const rows=keys.filter(k=>agg[k].n).sort((a,b)=>agg[b].n-agg[a].n);
  const cell=v=>v?String(v):'<span class="z">·</span>';
  let h='<table class="rt"><thead><tr><th>Category</th><th>All</th><th>KB</th><th>Dig</th><th>Fine</th><th>Left</th></tr></thead><tbody>';
  rows.forEach(k=>{const a=agg[k];
    h+='<tr><td><button data-cat-filter="'+k+'">'+esc(CATLBL[k]||k)+'</button></td><td>'+a.n+'</td><td>'
      +cell(a.kb)+'</td><td>'+cell(a.dig)+'</td><td>'+cell(a.ok)+'</td><td>'+cell(a.todo)+'</td></tr>';});
  el('#roll').innerHTML=h+'</tbody></table>';
}

const render=()=>{ renderBar(); renderList(); renderRoll(); };

function scrollCursor(){
  const r=el('.row.cursor'); if(!r) return;
  const top=r.getBoundingClientRect().top, h=el('.bar').offsetHeight;
  if(top<h+8||top>window.innerHeight-60) r.scrollIntoView({block:'center'});
}

/* ── acting ───────────────────────────────────────────── */
function decide(id,d){
  const s=S(byId(id)); s.d = s.d===d ? '' : d; touch(); render();
}
function toggle(id){ open = open===id ? null : id; renderList();
  if(open){ const r=el('.row.open'); if(r) r.scrollIntoView({block:'nearest'}); } }

el('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip'); if(!b) return;
  filter=b.dataset.f; cursor=0; render(); window.scrollTo({top:0});});
el('#catf').addEventListener('change',e=>{catf=e.target.value; cursor=0; render();});
el('#q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase(); cursor=0; render();});
el('#roll').addEventListener('click',e=>{const b=e.target.closest('[data-cat-filter]'); if(!b) return;
  catf=b.dataset.catFilter; el('#catf').value=catf; filter='all'; render(); window.scrollTo({top:0});});

el('#list').addEventListener('click',e=>{
  const a=e.target.closest('.act'); if(a){ e.stopPropagation(); decide(a.dataset.id,a.dataset.d); return; }
  const cp=e.target.closest('[data-copy]'); if(cp){ e.stopPropagation();
    navigator.clipboard?.writeText(cp.dataset.copy);
    const t=cp.textContent; cp.textContent='copied'; setTimeout(()=>{cp.textContent=t;},900); return; }
  if(e.target.closest('.note')||e.target.closest('.sel')) return;
  const r=e.target.closest('.row'); if(!r) return;
  cursor=+r.dataset.i; toggle(r.dataset.id);
});
el('#list').addEventListener('input',e=>{
  const n=e.target.closest('[data-note]'); if(n){ S(byId(n.dataset.note)).note=n.value; touch(); }});
el('#list').addEventListener('change',e=>{
  const c=e.target.closest('[data-cat]'); if(c){ S(byId(c.dataset.cat)).cat=c.value; touch(); renderBar(); renderRoll(); }
  const n=e.target.closest('[data-note]'); if(n) renderList();});

function nextUndecided(){
  const rows=visible();
  for(let i=1;i<=rows.length;i++){ const j=(cursor+i)%rows.length;
    if(!S(rows[j]).d){ cursor=j; open=rows[j].id; renderList(); scrollCursor(); return; } }
  setSave('All decided','on');
}
el('#next').addEventListener('click',nextUndecided);

document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const t=e.target.tagName;
  if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT'){ if(e.key==='Escape') e.target.blur(); return; }
  const rows=visible(); if(!rows.length) return;
  if(e.key==='j'||e.key==='ArrowDown'){ e.preventDefault(); cursor=Math.min(cursor+1,rows.length-1); renderList(); scrollCursor(); }
  else if(e.key==='k'||e.key==='ArrowUp'){ e.preventDefault(); cursor=Math.max(cursor-1,0); renderList(); scrollCursor(); }
  else if(e.key==='Enter'){ e.preventDefault(); toggle(rows[cursor].id); }
  else if(e.key==='Escape'&&open){ open=null; renderList(); }
  else if(e.key==='n'){ e.preventDefault(); nextUndecided(); }
  else if(e.key==='/'){ e.preventDefault(); el('#q').focus(); }
  else if('1234'.includes(e.key)){ e.preventDefault(); decide(rows[cursor].id,DECS[+e.key-1]); scrollCursor(); }
});

/* ── handoff ──────────────────────────────────────────── */
el('#hand').addEventListener('click',()=>{
  const head={kb:'Into the KB',dig:'Dig into it first',product:'Product, not KB',ok:'Fine as answered'};
  let out='# Weekly review — '+META.start+' to '+META.end+'\n';
  const left=DATA.filter(c=>!S(c).d).length;
  out+='\n'+(DATA.length-left)+' of '+DATA.length+' decided'+(left?', '+left+' still open':'')+'.\n';
  ['kb','dig','product','ok'].forEach(d=>{
    const rows=DATA.filter(c=>S(c).d===d); if(!rows.length) return;
    out+='\n## '+head[d]+' ('+rows.length+')\n\n';
    rows.forEach(c=>{ const s=S(c);
      if(d==='ok'&&!s.note){ out+='- '+c.id+' — '+(c.vtitle||c.q.slice(0,70))+'\n'; return; }
      out+='- **'+c.id+'** ['+(CATLBL[s.cat]||s.cat)+'] '+(c.vtitle||c.q.slice(0,90))+'\n';
      if(c.carried) out+='  - unanswered since '+c.carried+'\n';
      if(s.note) out+='  - Michal: '+s.note.replace(/\n+/g,' ')+'\n'; });
  });
  const un=DATA.filter(c=>!S(c).d);
  if(un.length){ out+='\n## Not decided yet ('+un.length+')\n\n';
    un.forEach(c=>{ out+='- '+c.id+' — '+(c.vtitle||c.q.slice(0,70))+'\n'; }); }
  el('#hout').value=out; el('#hdlg').showModal();
});
el('#hclose').addEventListener('click',()=>el('#hdlg').close());
el('#hcopy').addEventListener('click',async()=>{
  const t=el('#hout'); t.select();
  try{ await navigator.clipboard.writeText(t.value); }catch(e){ document.execCommand('copy'); }
  el('#hcopy').textContent='Copied'; setTimeout(()=>{el('#hcopy').textContent='Copy';},1200);
});
window.addEventListener('beforeunload',e=>{ if(dirty){ commit(); e.preventDefault(); e.returnValue=''; }});

/* ── boot ─────────────────────────────────────────────── */
el('#wkrange').textContent=META.start+' – '+META.end+' · '+META.counts.total+' conversations';
el('#catf').innerHTML='<option value="">Every category</option>'+
  META.categories.map(([k,l])=>'<option value="'+k+'">'+esc(l)+'</option>').join('');
open=sessionStorage.getItem('zb-open')||null;
filter=sessionStorage.getItem('zb-filter')||'todo';
sessionStorage.removeItem('zb-open'); sessionStorage.removeItem('zb-filter');
setSave('');
render();
if(typeof claude!=='undefined'&&claude&&typeof claude.use==='function'){
  claude.use('artifact').then(a=>{ artifact=a;
    setSave(a?'Saving is on':'Saved on this device', a?'on':''); })
    .catch(()=>setSave('Saved on this device'));
} else setSave('Saved on this device');
</script>
