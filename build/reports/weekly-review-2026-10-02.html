ting": null, "carried": null, "sources": ["Programme settings | Zooza Help", "Programme Settings | Zooza Help", "Programmes List | Zooza Help", "Make-up Sessions FAQ | Zooza Help", "Make-up Sessions — Complete Guide | Zooza Help", "Where to find things in Zooza — quick reference | Zooza Help"], "q": "A customer keeps trying to select a different venue for a make up class. Each time he does, the venue he wants does not appear and I have to manually change it in my settings to allow all venues to show. How can I do this as a blanket setting across all customers that they can book at any other venue?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "A customer keeps trying to select a different venue for a make up class. Each time he does, the venue he wants does not appear and I have to manually change it in my settings to allow all venues to show. How can I do this as a blanket setting across all customers that they can book at any other venue?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Anna, this is controlled by a venue restriction in the programme’s make‑up settings. \n\n\nTo allow customers to book make‑ups at any venue:\n\n\n\n\n- Go to Programmes → open the programme\n\n- Go to Settings → Make-up sessions → Edit\n\n\n- In Restrictions, remove any Venue limits\n\nIf a venue is selected there, clients will only see that location when choosing a make‑up session.\n\n\nThere is no separate global “all venues allowed” switch — the restriction is set per programme.", "cited": ["Programme Settings | Zooza Help", "Make-up Sessions — Complete Guide | Zooza Help", "Make-up Sessions FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "where is the settings button in programmes", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Anna, it’s on the programme page.\n\n\n\n\n- Go to Activities → Programmes\n\n\n- Click the programme you want\n\n- On the programme overview page, click Edit Settings at the top\n\n\nThat opens the programme settings dashboard where you can edit things like Make-up Sessions.", "cited": ["Programmes List | Zooza Help", "Programme settings | Zooza Help", "Where to find things in Zooza — quick reference | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "So I have to do it inidivually for all programmes", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes, Anna — currently it has to be done per programme.\n\n\nMake‑up session restrictions (including Venue limits) are configured inside each programme’s settings, so there isn’t a global switch that allows all venues for every programme at once. \n\n\nThe only global place is Settings → Other → Make-up sessions, but that only sets defaults like credit expiry or time restrictions — it does not control venue restrictions.", "cited": ["Programme Settings | Zooza Help", "Make-up Sessions — Complete Guide | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "yes thank you", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I'm glad I could assist you, Anna! Please feel free to reach out if you have any more questions or need further help with your programmes. I'm here for you! 😊", "cited": []}], "verdict": "gap", "vtitle": "Allowing all venues for make-ups across every class instead of one by one", "vnote": "Asked four times. The client changes a setting manually each time a parent wants a different venue. Whether there is an account-level setting needs checking, but the venue dimension of make-ups is clearly undocumented.", "cat": "makeups"}, {"channel": "email", "id": "email-09", "date": "2026-09-29 21:54", "day": "2026-09-29", "human": true, "bucket": "EMAIL", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Cena skupiny sa nezobrazuje na detaile skupiny ani neprenáša na registráciu", "turns": [{"role": "customer", "who": "Barbora Zajacová", "text": "dobrý deň, pridávam ešte otázku- ako som popisoval že sa cena za skupinu nezobrazí na detaile skupiny, tak v tom prípade sa nám napr ani neprežije cena skupiny na novo vytvorenú registráciu- napr reg 545629 pangracova, musela byt cena za skupinu následne odpísala ručne. Je to tiez nejakym nasim nastavenim alebo je tam delay v prepise ? Ďakujem za pomoc", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, tam skor vyzera, ze nebola dobre zapisana ta suma. Iba som sumu v nastaveniach skupiny preulozil a zobrazuje to na webe uz spravne. https://www.ela-jazykovka.sk/registracia/?course_id=8127&schedule_id=104202\n\n[Image]", "cited": []}, {"role": "customer", "who": "Barbora Zajacová", "text": "Super, dakujem za pomoc.\nuprimne, preukladala som tu sumu viac krat este v ten den a aj druhy den som skusala znova preulozit a nic :(", "cited": []}, {"role": "customer", "who": "Barbora Zajacová", "text": "dobrý deň, pridávam ešte otázku- ako som popisoval že sa cena za skupinu nezobrazí na detaile skupiny, tak v tom prípade sa nám napr ani neprežije cena skupiny na novo vytvorenú registráciu- napr reg 545629 pangracova, musela byt cena za skupinu následne odpísala ručne. Je to tiez nejakym nasim nastavenim alebo je tam delay v prepise ? Ďakujem za pomoc", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, ano, je to ten isty problem, na danom kurze sa prepinalo nastavenie medzi clenkym/membershipom a jednou platbou. Opat to bolo preulozene na urovni programu > Cena a platby (membership > jednorazovu platbu) a ulozit. Uz to zobrazuje sumu. Dajte vediet, ci pomohlo", "cited": []}, {"role": "customer", "who": "Barbora Zajacová", "text": "dakujem za kontrolu a pomoc, teraz vyzera ze sa to na tie registracie prepisuje spravne.", "cited": []}, {"role": "customer", "who": "Barbora Zajacová", "text": "tak teraz sa mi to znova stalo - nastavena cena na skupine, vidim v detaile nastavenia 300eur, ale nie v detaile skupiny. doplnila som novu registraciu a cena za skupinu sa neprepisalo - https://zooza.app/#registrations/546348 nerozbila som ziadne zmeny pokial viem na nastaveniach kurzu ze platba jednorazova alebo za terminy...", "cited": []}], "verdict": "product", "vtitle": "Cena skupiny sa po prepínaní typu platby na programe stratí a vracia sa aj po ‚oprave‘ preuložením", "vnote": "Vyzerá to na chybu, nie na nastavenie: zákazníčka sumu viackrát preukladala bez efektu, tím to dvakrát ‚opravil‘ preuložením (raz na skupine, raz na programe: membership → jednorazová platba) a večer 29. 9. sa problém vrátil na reg. 546348 bez toho, aby podľa nej menila typ platby. Táto posledná správa je v e-maile bez odpovede. Dopad: nová registrácia nedostane cenu skupiny, treba ju dopisovať ručne (reg. 545629). Otázku z 9:19 poslala ešte raz o 12:56 – v turns sú obe. Pôvodný popis tiketu (24. 9.) v e-maile chýba. Súvisí s témou ‚cena sa nezobrazuje/je 0‘ u Young Engineers Cork (email-04), tam však šlo skôr o nastavenie. Tá istá zákazníčka má ďalšie tikety: email-02, email-12, email-19.", "cat": "pricing", "from": "Barbora Zajacová (ELA Jazykovka)"}, {"channel": "intercom", "id": "215476155588889", "date": "2026-09-29 18:03", "day": "2026-09-29", "human": true, "bucket": "HUMAN", "reask": 2, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": [], "q": "Dobrý deň,\nprosím, čo mám na tomto kurze zle nastavené, že mi nezobrazuje možnosť prihlásiť sa na skúšobné hodiny?\nhttps://zooza.app/#courses/4325/settings\nNeviem sa z toho vysomáriť...\nĎakujem\nJakub_Medvedica", "turns": [{"role": "customer", "who": "Jakub Majoroš", "text": "Dobrý deň,\nprosím, čo mám na tomto kurze zle nastavené, že mi nezobrazuje možnosť prihlásiť sa na skúšobné hodiny?\nhttps://zooza.app/#courses/4325/settings\nNeviem sa z toho vysomáriť...\nĎakujem\nJakub_Medvedica", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Hi Jakub,\n\n\nThanks for reaching out! I'm Zooza Support, Zooza's AI Agent and I'm well trained to answer your query but you can reply and ask for the team at any time.\n\n\nI understand you're having trouble finding the option to sign up for trial classes on your Bike bloky course.\n\n\nI'm not able to open links or access your account data. For this, please submit a support ticket or reach out to a member of our team — they'll be able to look into it directly.\n\n\nHowever, I can help guide you through the setup. To show trial classes (skúšobné hodiny) as a sign-up option on a course, you need to enable them in the course settings. Could you let me know: are you looking at the Classes (Skupiny) settings or the Programmes (Programy) settings where this course is listed?", "cited": []}, {"role": "customer", "who": "Jakub Majoroš", "text": "Forward it to the team.\n\n\n---------------------------\n\n\nJakub Majoroš\n\n\n0944 976 917\n\n\njakub.medvedicatour@gmail.com\nŠportový klub MEDVEDiCA\nhttp://www.medvedicatour.sk\n​\n\n\n#davajbomby\n​\n\n\nDňa ut 29. 9. 2026, 17:43 Zooza Support from Zooza \u003csupport@zooza.online> napísal(a):\n​", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Jakub, v online registracii mate nastavene ze registracny formular ma ponukat len bloky. To bude problem", "cited": []}, {"role": "customer", "who": "Jakub Majoroš", "text": "Zdravím,\n\n\nďakujem za promptnú odpoveď. Áno, tam bol ten pes zakopaný.\n\n\nS pozdravom\n\n\nJakub", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Super, som rad, ze to zafungovalo:)", "cited": []}], "verdict": "gap", "vtitle": "Trials are not offered when the booking form is set to blocks only", "vnote": "One-line cause, high value: the online registration setting 'offer blocks only' hides the trial option. A troubleshooting line under trials would have saved this ticket.", "cat": "trials"}, {"channel": "email", "id": "email-08", "date": "2026-09-29 17:56", "day": "2026-09-29", "human": true, "bucket": "EMAIL", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Neoverený e-mail v zozname registrácií vs. dve fajky v detaile", "turns": [{"role": "customer", "who": "Mikuláš Fedor", "text": "a su dalsie regiustracie, kde mi pise v zozname registracii, ze email neovereny, pricom ked kliknem do registracie, tam uz su 2 fajky, ze overenty, co teda plati? Zaroven mi klientka hlasila problem pri registracii tiez: https://zooza.app/#registrations/543954, napriklad.", "cited": []}, {"role": "customer", "who": "Mikuláš Fedor", "text": "obidva priklady su registracie klienta z minulych rokov uz, kde im to islo. Mam obavu, ze ak sa registruje na novy kruzoik existujuci krient, je tam dajaky bug, pls skontrolovat a dat mi info, ak tak je, ze na ktorych to presne bolo...", "cited": []}, {"role": "customer", "who": "Mikuláš Fedor", "text": "[Image] a uplne odveci je, ze ten isty email na Klientovi svieti ako OK:", "cited": []}, {"role": "customer", "who": "Mikuláš Fedor", "text": "cize sa neprebera spravne info z klienta na registraciu, co je riadny bug", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den pan Fedor,\n\nDakujeme za napisanie. Jedna fajka znamena, ze sa email podarilo zo Zoozy odoslat. Dve fajky znamenaju, ze sme nasledne dostali aj potvrdenie zo strany emailoveho servera.\n\nAk je pri emaile krizik, znamena to, ze sa ho nepodarilo dorucit uz na urovni emailoveho servera.\n\nV tomto pripade vidim, ze ide o Outlook adresu. Je dost pravdepodobne, ze firma ma nastavenu prisnejsiu korporatnu emailovu politiku a ich server niektore spravy alebo odosielacie servery jednoducho odmieta. Na odosielanie pouzivame Mandrill, co je velka standardna emailova infrastruktura pouzivana vo velkom rozsahu, ale aj napriek tomu si ju moze konkretna firma zablokovat podla vlastnych pravidiel.\n\nKlientka ma v tomto pripade dve moznosti , pouzit inu emailovu adresu, alebo poziadat svojho IT administratora vo firme, aby povolil emaily a domeny zooza.app.\n\nCize samotny email klienta je v Zooze evidovany spravne, problem je v tomto pripade pri jeho dorucovani na cielovy server. PS: To, ze toto\n\nDakujem\n\n[Image]", "cited": []}, {"role": "customer", "who": "Mikuláš Fedor", "text": "Preco ale na klientovi mam v roznych screenoch rozne fajky a xka? Vid screenshoty\n\n[Image]", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, Pri údajoch na Klientovi sa kontroluje a zapisuje aj stav overenia emailovej adresy. Pri Registrácii sa zapisuje stav odoslania emailu.\n\nPreto sa môže stať, že na rôznych obrazovkách vidíte rozdielny stav. Priznávame, že to môže aktualne pôsobiť zmätočne najmä preto, že zoznam registrácií sa neaktualizuje pri každom načítaní obrazovky.\n\nJe to zámerne kvôli rýchlosti zobrazovania a filtrovaniu väčšieho množstva registrácií. Tieto údaje sa priebežne prepočítavajú na pozadí, nie pri každom otvorení zoznamu.", "cited": []}, {"role": "customer", "who": "Mikuláš Fedor", "text": "ok, poslu mi ine adresy, hadam to bude ok", "cited": []}], "verdict": "gap", "vtitle": "Čo znamenajú fajky a krížik pri e-maile a prečo klient a registrácia ukazujú iný stav", "vnote": "Vysvetlenie je všeobecne platné a v dokumentácii by malo byť pohromade: 1 fajka = odoslané zo Zoozy, 2 fajky = potvrdenie od cieľového servera, krížik = server doručenie odmietol; na Klientovi sa ukladá stav overenia adresy, na Registrácii stav odoslania; zoznam registrácií sa prepočítava na pozadí, nie pri každom načítaní. Plus rada pre firemné Outlook adresy (iná adresa alebo povoliť zooza.app u IT). Tím sám priznal, že rozdielne stavy pôsobia mätúco – to je zároveň produktový podnet (UX). Prvá ľudská odpoveď končí useknutou vetou ‚PS: To, ze toto‘ – zákazník dostal nedokončenú správu. Úvodná správa tiketu (pred 11:20) a dva screenshoty v e-maile nie sú. Doručovanie e-mailov je téma týždňa: aj Jana Vašková (email-11) a Anna Blackwell (email-16).", "cat": "comms", "from": "Mikuláš Fedor (Young Engineers / Mladí inžinieri)"}, {"channel": "email", "id": "email-07", "date": "2026-09-29 16:36", "day": "2026-09-29", "human": true, "bucket": "EMAIL", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Fwd: Nahradky - klient sa nevie prihlásiť na náhradu", "turns": [{"role": "customer", "who": "Monika Slabejová", "text": "Dobrý deň, preposielam správu od klientky, ja jej neviem odpovedať a neviem s tým ani nič urobiť cez naše admin rozhranie. Skontrolovala som to a s kreditom č. 537892 ju ani ja neviem prihlásiť na termín č. 1423371, neukazuje ho ani mne v možnostiach na náhrady. Spustila som MATKO, podľa neho je všetko v poriadku s daným termínom a kreditom a nenašlo tam žiadnu chybu. Náhrada je nastavena na uplatnenie vo všetkych FA obdobia, všetkych skupinách, podľa vlastného výberu klienta. Prečo to teda klientke nejde? Neukazuje mi dokonca ani možnosť prihlásenia 1.10. na lekciu o 9:45 kde je voľné miesto, je to rovnaká veková kategória, ale v možnostiach ju nemám. Ako ju tam mám prihlásiť týmto konkrétnym kreditom? Lekcia, kde chcú prísť, sa koná vo štvrtok, prosím vás teda obratom o odpoveď.\n\nZačiatok preposlanej správy:\nOd: Dana Sunalova \u003cdana.sunal@gmail.com>\nPredmet: Nahradky\nDátum: 28. septembra 2026, 14:55:54 SELČ\nPre: Aqua baby klub Mobik \u003cmobik@mobik.sk>\n\nDobry den, mam k dispozicii 1 nahradky ako je na obrazku: [Image] Logicky, chcem pozuit nahradku ktorej vyprsi platnost 27.10. Ak vsak na nu kliknem, nevidim lekcoe 2-3 roky ktore su vo stvrtok o 17:00 a ani v nedelu o 9. Ak kliknem na nahradku ktora vyprsi v decembri, vidim napr. stvrtkovu lekciu o 17:00 ze ma stale volne miesto a viem sa tam prihlasit.\n\n[Image] Ako viem dosiahnut aby som sa vedela prihlasit na stvrtkovu lekciu s tou starsou nahradkou?\n\nDakujem,\nSunalova Dana", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den,\n\nklientka je na vacsine tych terminov uz prihlasena v poradovniku. Aj v tých štvrtkových o 17.00. Vyzerá, že už sa prihlasila kam mohla. A čaká sa nauvolnenie miesta.\n\nTak napríklad toho 1. 10. 2026 je prihlasena do poradovníka.\n\nhttps://zooza.app/#settings/matko?credit_id=537892&event_id=1423371\n\n[Image] [Image] https://zooza.app/#calendar/1423371\n\n[Image]\n\nAj vo svojom profile vidí veľa možností.\n\n[Image]", "cited": []}, {"role": "customer", "who": "Monika Slabejová", "text": "Ďakujem za odpoveď, to mi ale neriesi situáciu, ako postupovať, keď sa klientka chce prihlásiť na dany termín s tým konkrétnym kreditom (pretože jej konci platnosť tohto kreditu).\nAko teda postupovať, aby sa tam mohla prihlásiť s touto konkrétnou nahradkou, keďže to nejde ani mne z admin pohľadu?", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den,\n\nAno, tak ako popisujeme. Klientka si vie vybrat nahradnu hodinu z ponukanych moznosti. Tak ako to sama posiela a urobila.\n\nTerminy, ktore ste poslali vy alebo klientka je odpoved, ze uz tam je prihlasena v poradovniku a caka sa na uvelnenie miesta. Dostane notifikaciu.\n\nAk to chce uplatnit nahradku rychlejsie, musi si vo svojom profile vybrat taky nahradny termin, ktory nie je naplneni, aby nebola v poradovniku.\n\nDajte vediet ci pomohlo", "cited": []}, {"role": "customer", "who": "Monika Slabejová", "text": "Dakujem za odpoveď, ale na termine voľné miesto je. Preto som sa pytala, prečo sa tam nevie prihlásiť, prečo jej to v tom zozname neukazuje 🤷‍♀️. Rozumiem, ze sa tam dala v minulosti do poradovnika, no ona sa nevie na tu lekciu teraz prihlasit cez svoj klientsky profil aj ked sa miesto uvolnilo. Neukazuje jej ju - viď jej screenshot a ja ju neviem navigovat, ako ma v tomto pripade postupovat.\nJa to s ňou doriešim individuálne, no v každom pripade tam nastala zrejme nejaká chyba.", "cited": []}], "verdict": "check", "vtitle": "Kredit na náhradu s bližšou expiráciou neponúka termín s voľným miestom, kredit s neskoršou expiráciou ho ponúka", "vnote": "Neuzavreté a s rozporom: tím dvakrát odpovedal, že klientka je na termíne v poradovníku; zákazník trvá na tom, že miesto je voľné a termín sa pri konkrétnom kredite (537892, expirácia 27. 10.) neponúka ani klientke, ani adminovi, zatiaľ čo pri kredite s expiráciou v decembri áno. MATKO podľa zákazníka nenašlo chybu. Posledná správa zákazníka (29. 9. 16:36) je bez odpovede a hovorí o ‚zrejme nejakej chybe‘. Treba pozrieť priamo kredit 537892 a termín 1423371: či ide o pravidlo platnosti kreditu, o to, že klientka už je v poradovníku na tom istom termíne, alebo o chybu. Ak sa potvrdí chyba, preklasifikovať na ‚product‘. Termín sa konal 1. 10.", "cat": "makeups", "from": "Monika Slabejová (Aqua baby klub Mobik)"}, {"channel": "email", "id": "email-06", "date": "2026-09-29 16:08", "day": "2026-09-29", "human": true, "bucket": "EMAIL", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Changing dates", "turns": [{"role": "customer", "who": "Anna Blackwell", "text": "Hello!\n\nI am trying and have failed to be able to change the dates on my sessions. I think it would be useful if Zooza could develop a holiday function rather than just deleting/or not including lessons on some weeks.\n\nBasically I have a half term break scheduled initially from 19-25 th so all classes within that week have no sessions. I cancelled them in various different ways, some I deleted, some i just didnt create them in the first place when setting up the session. The half term dates have now been moved in the UAE so I now need to reschedule all classes for 19-25th and delete all classes during the 12-18th.\n\nHow can I reliably check and contact anyone who has booked a trial class then? What is the cleanest way of doing all this? are you able to do it for me as I am concerned that I will miss something.\n\nThanks,", "cited": []}, {"role": "human", "who": "Martin", "text": "Hi Anna, we do have holiday function it just works the other way around - when you schedule your class. It does not work recursively after the fact you scheduled your sessions. From your message I can see several questions/pain points and I'd really like to break those down:\n1) unable to change dates - When you go to the class details, you can tick any sessions you want to reschedule and via bulk operations reschedule them. You can do the same directly from the calendar or from sessions screen. So was there any specific error message or where did you got stuck? I would truly want to understand the problem as this is one of the basic operations done daily by hundreds of admins and therefore I would like to solve any problems there.\n\n2) Rescheduling sessions at large (not just per class). This is similar as previous topic - you can quite easily filter sessions for a specific date in the Sessions screen and by clicking check all and doing bulk operation - reschedule, cancel or delete them.\n\n3) Which dates are the ones you're trying to reach? is it 19-25th of October or 12-18th of October? Many thanks", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "HI Martin,\n\nThanks for your reply - ok that makes sense, I was trying to do it from sessions but going via Calendar makes more sense. I have bulk changed the week so now 12-18th is no classes but the following week 19-25th the classes look a bit messed up and out of order I think I have done some wrong. Please for this first time could you just check that I have done it correctly - I dont think i have as the calendar for the amended week does not look the same as usual weeks.\n\nThanks and so for any trials from that week yes please what is the best way to contact them as I realise now that I made the change already and probably lost sight of their bookin  "customer", "who": "Mikuláš Fedor", "text": "obidva priklady su registracie klienta z minulych rokov uz, kde im to islo. Mam obavu, ze ak sa registruje na novy kruzoik existujuci krient, je tam dajaky bug, pls skontrolovat a dat mi info, ak tak je, ze na ktorych  to presne bolo...", "cited": []}, {"role": "customer", "who": "Mikuláš Fedor", "text": "a uplne odveci je, ze ten isty email na Klientovi svieti ako OK:", "cited": []}, {"role": "customer", "who": "Mikuláš Fedor", "text": "cize sa neprebera spravne info z klienta na registraciu, co je riadny bug", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den pan Fedor,\n\n\nDakujeme za napisanie. Jedna fajka znamena, ze sa email podarilo zo Zoozy odoslat. Dve fajky znamenaju, ze sme nasledne dostali aj potvrdenie zo strany emailoveho servera.\n\n\nAk je pri emaile krizik, znamena to, ze sa ho nepodarilo dorucit uz na urovni emailoveho servera.\n\n\nV tomto pripade vidim, ze ide o Outlook adresu. Je dost pravdepodobne, ze firma ma nastavenu prisnejsiu korporatnu emailovu politiku a ich server niektore spravy alebo odosielacie servery jednoducho odmieta. Na odosielanie pouzivame Mandrill, co je velka standardna emailova infrastruktura pouzivana vo velkom rozsahu, ale aj napriek tomu si ju moze konkretna firma zablokovat podla vlastnych pravidiel.\n\n\nKlientka ma v tomto pripade dve moznosti , pouzit inu emailovu adresu, alebo poziadat svojho IT administratora vo firme, aby povolil emaily a domeny zooza.app.\n\n\nCize samotny email klienta je v Zooze evidovany spravne, problem je v tomto pripade pri jeho dorucovani na cielovy server.\nPS: To, ze toto \n\n\nDakujem", "cited": []}, {"role": "customer", "who": "Mikuláš Fedor", "text": "Preco ale na klientovi mam v roznych screenoch rozne fajky a xka? Vid screenshoty\n​\n\n\nMikuláš Fedor\n\n\nTrainer & Franchisee\n\n\nwww.mladiinzinieri.sk\nTel:+421 950 446 110\n\n\nEmail:futureengineers@youngengineers.sk\n\n\n\n \n\n\n\n​", "cited": []}, {"role": " s → Subscription → Manage subscription → Details → Invoices\n\n\n- Otvorí sa billingový portál\n\n- Tam nájdete všetky minulé faktúry a môžete si ich stiahnuť (PDF) a poslať na info@cubanoproject.sk\n\n\nTieto sú práve faktúry za vašu Zooza službu.\n\n\n\nSource:\nPayments and Billing FAQ | Zooza Help", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dostali jste odpověď na svou otázku?", "cited": []}, {"role": "customer", "who": "Jakub Harmat", "text": "nie, takúto cestu v ZOOZe nemáme... nevidím tu faktúry za vaše služby", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Jakub, faktúry za vašu Zooza službu sa nachádzajú v externom billingovom portáli.\n\n\nPostup:\n\n\n\n\n- Kliknite na vaše meno/profil v pravom hornom rohu.\n\n- Zvoľte Subscription.\n\n- Posuňte sa nadol a kliknite na Manage subscription.\n\nOtvorí sa billingový portál, kde môžete:\n\n\n\n\n- stiahnuť minulé faktúry (PDF)\n\n- aktualizovať fakturačné údaje\n\n- spravovať platobnú metódu. \n\n\nAk túto cestu v aplikácii nevidíte, môže sa jednať o rozdiel v rozhraní. V takom prípade môže pomôcť screenshot a URL stránky, na ktorej ste.", "cited": ["Subscription and Billing FAQ | Zooza Help", "Billing and invoicing | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Pomohlo vám to?", "cited": []}, {"role": "customer", "who": "Jakub Harmat", "text": "aký je link na externy billingový portál?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Jakub, priamy link na externý billingový portál sa v Zooze nezobrazuje.\n\n\nOtvára sa až cez túto cestu v aplikácii:\n\n\n\n\n- \nyour name/profile → Subscription → Manage subscription \n\n\nTento krok otvorí externý billingový portál, kde môžete:\n\n\n\n\n- stiahnuť minulé faktúry\n\n- aktualizovať fakturačné údaje\n\n- spravovať platobnú metódu.\n\nPriamy URL na tento portál v dokumentácii nie je uvedený.", "cited": ["Subscription and Billing FAQ | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, { us", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Hi Lenka,\n\n\nThanks for reaching out! I'm Zooza Support, Zooza's AI Agent and I'm well trained to answer your query but you can reply and ask for the team at any time.\n\n\nI understand you need clarification on why a payment plan wasn't automatically assigned when your client registered late for a course and selected the two-payment option.\n\n\nI don't have access to account data or audit records for specific registrations, so I'm unable to verify whether the payment plan was set up by your client or see what happened during her late registration process.\n\n\nA human agent from our team can look into this directly and check the registration details and payment plan history for your client. They'll be able to confirm whether payment plans are automatically transferred after late registration confirmations, and investigate why it wasn't set up in this case.\n\n\nWould you like to escalate this to our team, or can you provide the client's name and registration date so a team member can investigate?", "cited": []}, {"role": "customer", "who": "Lenka Pechová", "text": "Please look into this. \n\n\ns pozdravom,\n\n\nMgr. Lenka Pechová\n\n\nKurzy, PR, marketing\n\n\n\n\nTel.0290900497\n\n\nwww.cirkuskus.sk\nFB / IG cirkuskus\n​", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, Lenka, \n\n\ndakujeme za napisanie, pomohlo by keby ste vzdy poslali aj klienta. Ale ak ide napriklad o Minicirkus, ten ma zapnute manualne potvrdenie neskorych registracii. \n\n\nVtedy je nutny zasah admina, lebo cas medzi registraciou a povolenim sa moze vyrazne lisit, preto je potrebne aplikovat platobny plan manualne. V ramci toho procesu aplikovania platobneho plánu vidite ako admin, ktory platobny plan klient perferuje a je predvoleny.", "cited": []}], "verdict": "gap", "vtitle": "Late registration with manual confirmation does not apply the payment plan", "vnote": "General rule worth writing: when a programme requires manual confirmation of late registrations, the payment plan is not applied automatically, because the gap between the registration and the approval can be long. The admin applies it during approval, and can see which plan the client chose -- it comes pre-selected. Explains 'the client says she chose two instalments and has no plan'.", "cat": "bookings"}, {"channel": "intercom", "id": "215476150457518", "date": "2026-09-29 14:08", "day": "2026-09-29", "human": true, "bucket": "HUMAN", "reask": 2, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Holiday settings | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Managing sessions in a class | Zooza Help", "Holiday and Term Management FAQ | Zooza Help"], "q": "Hello!   \n   I am trying and have failed to be able to change the dates on my sessions. I think it would be useful if Zooza could develop a holiday function rather than just deleting/or not including lessons on some weeks.   \n   Basically I have a half term break scheduled initially from 19-25 th so all classes within that week have no sessions. I cancelled them in various different ways, some I deleted, some i just didnt create them in the first place when setting up the session. The half term dates have now been moved in the UAE so I now need to reschedule all classes for 19-25th and delete all classes during the 12-18th.  \n   How can I reliably check and contact anyone who has booked a trial class then? What is the cleanest way of doing all this? are you able to do it for me as I am concerned that I will miss something.   \n   Thanks,   \n           Best Wishes  Anna          Anna Blackwell\n Owner - Turtle Tots Dubai\n    T: 052 748 1060\n E: anna.blackwell@turtletots.com\n                          WHP2-Block-A Commercial, Property Number P2AG-A09, Plot 13-0 | DM Land No: 532-8359 | Saih Shuaib 3 | Dubai | UAE |      \n     This email and any attachments to it may be confidential and are intended solely for the use of the individual to whom it is addressed. Any views or opinions expressed are solely those of the author and do not necessarily represent those of Turtle Tots. If you are not the intended recipient of this email, you must neither take any action based upon its contents, nor copy or show it to anyone. Please contact the sender if you believe you have received this email in error.", "turns": [{"role": "customer", "who": "Anna Blackwell", "text": "Hello!   \n   I am trying and have failed to be able to change the dates on my sessions. I think it would be useful if Zooza could develop a holiday function rather than just deleting/or not including lessons on some weeks.   \n   Basically I have a half term break scheduled initially from 19-25 th so all classes within that week have no sessions. I cancelled them in various different ways, some I deleted, some i just didnt create them in the first place when setting up the session. The half term dates have now been moved in the UAE so I now need to reschedule all classes for 19-25th and delete all classes during the 12-18th.  \n   How can I reliably check and contact anyone who has booked a trial class then? What is the cleanest way of doing all this? are you able to do it for me as I am concerned that I will miss something.   \n   Thanks,   \n           Best Wishes  Anna          Anna Blackwell\n Owner - Turtle Tots Dubai\n    T: 052 748 1060\n E: anna.blackwell@turtletots.com\n                          WHP2-Block-A Commercial, Property Number P2AG-A09, Plot 13-0 | DM Land No: 532-8359 | Saih Shuaib 3 | Dubai | UAE |      \n     This email and any attachments to it may be confidential and are intended solely for the use of the individual to whom it is addressed. Any views or opinions expressed are solely those of the author and do not necessarily represent those of Turtle Tots. If you are not the intended recipient of this email, you must neither take any action based upon its contents, nor copy or show it to anyone. Please contact the sender if you believe you have received this email in error.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thanks for reaching out! I'm Zooza Support, Zooza's AI Agent and I'm well trained to answer your query but you can reply and ask for the team at any time.\n\n\nThe cleanest way to handle this is to edit the sessions in bulk rather than changing them one by one. \n\n\nRecommended workflow\n\n\n\n\n- Go to Sessions and filter by the affected class.\n\n- Select the sessions for 12–18 and delete them (use Delete if they should never have existed).\n\n- Select the sessions for 19–25 and use Bulk Edit → Set new date and time to move them to the correct week.\n\n- After any bulk move, review the class session list and manually remove or cancel any dates that now fall on holidays. \n\n\nImportant: holiday‑skip rules only apply when sessions are first created. If you later move sessions, the system does not automatically re-check holidays, so a manual review is required. \n\n\nAbout contacting trial clients:\n\n\nThe help centre does not describe a specific “trial client notification” workflow for this situation. A human support agent can guide you on the best way to communicate with affected clients if you need that detail.\n\n\nPlease let me know if this helps or if you have any further questions.\n\n\nManaging sessions in a class | Zooza Help\nHoliday and Term Management FAQ | Zooza Help\nProgrammes, Timetables and Sessions FAQ | Zooza Help\nHoliday settings | Zooza Help", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Anna, we do have holiday function it just works the other way around - when you schedule your class. It does not work recursively after the fact you scheduled your sessions. From your message I can see several questions/pain points and I'd really like to break those down:\n\n\n1) unable to change dates - When you go to the class details, you can tick any sessions you want to reschedule and via bulk operations reschedule them. You can do the same directly from the calendar or from sessions screen. So was there any specific error message or where did you got stuck? I would truly want to understand the problem as this is one of the basic operations done daily by hundreds of admins and therefore I would like to solve any problems there.\n\n\n\n\n\n2) Rescheduling sessions at large (not just per class). This is similar as previous topic - you can quite easily filter sessions for a specific date in the Sessions screen and by clicking check all and doing bulk operation - reschedule, cancel or delete them.\n\n\n\n\n\n3) Which dates are the ones you're trying to reach? is it 19-25th of October or 12-18th of October?\nMany thanks", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "HI Martin, \n​\n\n\nThanks for your reply - ok that makes sense, I was trying to do it from sessions but going via Calendar makes more sense. I have bulk changed the week so now 12-18th is no classes but the following week 19-25th the classes look a bit messed up and out of order I think I have done some wrong. Please for this first time could you just check that I have done it correctly - I dont think i have as the calendar for the amended week does not look the same as usual weeks.\n​\n\n\nThanks and so for any trials from that week yes please what is the best way to contact them as I realise now that I made the change already and probably lost sight of their bookings?\n    \n\n\nBest Wishes\n\n\nAnna    Anna Blackwell\nOwner - Turtle Tots Dubai  T: 052 748 1060\nE:anna.blackwell@turtletots.com    \n\n\n\nhttps://www.facebook.com/turtletotsdubai\"/>\nhttps://www.instagram.com/turtletotsdubai/\"/>WHP2-Block-A Commercial, Property Number P2AG-A09, Plot 13-0 | DM Land No: 532-8359 | Saih Shuaib 3 | Dubai | UAE |   \n\n\nThis email and any attachments to it may be confidential and are intended solely for the use of the individual to whom it in error.\n​", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Anna,\n\n\n\n\n- \nFor make-up sessions, yes, you can check it directly in the class detail. If you scroll through the sessions, the first attendance number / “will attend” number will include anyone booked into that session, including make-up bookings.\n\nYou can also use the make-up/replacements report here:\nhttps://asia.zooza.app/#reports/replacements?page=0&used_on_event_from=2026-09-01&used_on_event_to=2026-12-31\n\n\nIf you send me the specific class/group you want to change, we can also check it for you and confirm whether there are any make-up bookings in future sessions.\n\n\n\n2. For the trial booking window, yes, I’ve changed this now. It was previously set to allow trials up to the next 5 sessions. From now on, trial bookings should only be available for the next 2 sessions / roughly 2 weeks ahead. Programme > Programme settings > Trial Settings\n\n\n\n\n\nBoth of these are also exactly the kind of checks that Zooza AI MCP connected with Claude or ChatGPT can do very quickly with one or two prompts.", "cited": []}], "verdict": "gap", "vtitle": "Holidays are set when you schedule a class, not retroactively", "vnote": "Important correction to a wrong assumption: the holiday function exists, but it applies at scheduling time and does not work backwards over sessions that are already generated. To change dates afterwards, tick the sessions and use bulk operations from the class detail, the calendar or the sessions screen. Pairs with 215476148423018 (bulk holiday change, asked twice).", "cat": "programmes"}, {"channel": "intercom", "id": "215476153645071", "date": "2026-09-29 13:46", "day": "2026-09-29", "human": false, "bucket": "D_assumed_with_kb", "reask": 3, "resolution": "confirmed_resolution", "rating": null, "carried": null, "sources": ["Instructors working hours | Zooza Help", "Settings | Zooza Help"], "q": "I accidentally set myself up as absent for a while, how may i fix it?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Alena  Adamove", "text": "I accidentally set myself up as absent for a while, how may i fix it?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Alena, you can remove the incorrect absence from your instructor profile.\n\n\n\n\n- Go to Instructors → your profile → Working hours\n\n\n- Find the absence you added\n\n- Delete it\n\nIf you do not see a delete option, it is usually due to Settings → General → Access → Availability management settings for instructors. In restricted modes, the owner must approve or remove the absence. \n\n\nAfter removing it, you can also reassign any sessions that were affected.", "cited": ["Instructors working hours | Zooza Help", "Settings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help correcting the absence, I’m here to help. Would you like to share more about what you’re seeing?", "cited": []}, {"role": "customer", "who": "Alena  Adamove", "text": "i do not see the settings, does that mean that the owner must first approve the absence? therefore should i contact the owner directly?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Alena, yes — that is very likely the reason.\n\n\nIf you cannot see the option to edit or delete the absence, your account is probably in Restricted administration or Absences only mode. In these modes, instructors can create absences but cannot edit or delete them themselves, and the owner must approve or remove them.  \n\n\nSo the correct next step is to contact the owner and ask them to remove or correct the absence in your instructor profile.", "cited": ["Instructors working hours | Zooza Help", "Settings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cit radnu hodinu.", "cited": []}, {"role": "customer", "who": "Mirka Vícen", "text": "Dobrý deň, \n\n\nasi si úplne nerozumieme - klient je momentálne už prihlásený nastálo v skupine 9:50, ale v dátume 6.10. ho v dochádzke vôbec nemám a ani on vo svojej dochádzke tento dátum ako dátum svojej domáckej skupiny nevidí. \n\n\nPosielam screen shot čo mi poslal klient a tiež screen shoty mojej dochádzky z dátumov 29.9. kde figuruje ako odhlásený a potom 6.10. kde nie je vôbec a následne 13.10. kde už je opäť. \n\n\nMirka Vícenová\n\n\nKoordinátorka a lektorka kurzu\n\n\n \n\n\n\n\n\n \n\n\n+421 902 180 281\n\n\n \n\n\nwww.folklorik.sk\n \n\n\nwww.facebook.com/kurzfolklorik", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, Mirka, dakujeme za doplnenie. \n\n\n\n\n\nTakto to vidí klient v aplikácii v zozname dochádzky v časti \"Náhradne hodiny\" \n\n\ndostať sa tam môže priamo z uvodu zákazníckej zony. \n\n\n\n\n\nOn je zaregistrovaný v skupine o 9.50 a náhradnu hodinu má 6. 10. - 9.00.\n\n\n\n\n\nZároveň vidíme, že je v zozname registrácii v termíne 6. 10.  v časti Náhradné hodiny.\n\n\nhttps://zooza.app/#calendar/1436641\n\n\n\n\n\nPomohla Vam tato odpoved? \n\n\n\n\n\nDakujeme za odpoved.", "cited": []}, {"role": "customer", "who": "Mirka Vícen", "text": "Dobrý deň, \n\n\nnie, odpoveď mi nepomohla. To, čo som Vám poslala, nie je klientova sekcia “Náhradné hodiny”, ale sekcia “Naplánované hodiny” \n\n\nV náhradných má ten termín 9:00, čo si ako náhradku zvolili, ale v naplánovaných vôbec nefiguruje termín 6.10. 9:50, čo by mal. Klient sa nemá šancu odhlásiť v prípade, že ochorie, ani vyčerpať náhradku, lebo tento termín proste absentuje, napriek tomu, že by ho tam mal mať. \n\n\nUž mi rozumiete? \n\n\nMirka Vícenová\n\n\nKoordinátorka a lektorka kurzu\n\n\n \n\n\n\n\n\n \n\n\n+421 902 180 281\n\n\n \n\n\nwww.folklorik.sk\n \n\n\nwww.facebook.com/kurzfolklorik", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den Mirka, dakujeme }, {"role": "human", "who": "Martin Rapavý", "text": "Jasne, ja to chapem. Problem vznikol tam, ze zakaznik si vyberal nahradnu hodinu este v case ked bol v povodnej skupine a tu nahradku si vybral v tej skupine do ktorej ste ho presuvali. Ten termin je ale samozrejme v systeme iba raz a nemoze teda jeden clovek prist na ten isty termin dva krat - raz ako na nahradny a raz ako na standardny.\nco som urobil je nasledovne - vratil som mu naspat oba terminy na 6 oktobra, pricom ten o 9:00 je ako nahradna hodina a ten o 9:50 je standardna hodina. V termine 29. 9. ma uz iba standardny termin o 9:50 - odhlaseny.\n\n\n\n\n\nPotvrdite mi prosim, ci je to takto v poriadku?\nDakujem pekne", "cited": []}, {"role": "customer", "who": "Mirka Vícen", "text": "Super, paráda, ďakujem, je to presne ako potrebujem, tak verím, že aj klientovi sa to bude dobre zobrazovať, idem ešte preveriť aj uňho. \n\n\nĎakujem za trpezlivosť a spoluprácu, príjemný deň\n\n\nMirka Vícenová\n\n\nKoordinátorka a lektorka kurzu\n\n\n \n\n\n\n\n\n \n\n\n+421 902 180 281\n\n\n \n\n\nwww.folklorik.sk\n \n\n\nwww.facebook.com/kurzfolklorik", "cited": []}], "verdict": "gap", "vtitle": "How a client moves through session enrolment, and why they vanish from attendance", "vnote": "The clearest statement of the lifecycle I have seen in an intake: a customer is enrolled on every session in the group on the assumption they will come; the application enrols them for real at midnight the day before; a cancellation and a make-up credit change that state. Also names where to look -- the registration's attendance overview. Same root as 215476015418521 and 215476123288233.", "cat": "makeups"}, {"channel": "intercom", "id": "215476151875038", "date": "2026-09-29 11:37", "day": "2026-09-29", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "routed_to_team", "rating": null, "carried": "2026-09-29", "sources": [], "q": "Hi. I just converted a contact into client and I want to open the newly converted dat zmenu zliav; a druha do nastaveni sablony moznost priznat zlavu na vsetkych splatkach", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Krátko: zatiaľ nie.\n\n\n\n\n- \nHromadná úprava zľavy – v Sessions → Bulk Edit môžete meniť viacero termínov naraz, ale zľava medzi týmito hromadnými úpravami nie je.  \n\n\n- \nZľava na všetkých splátkach v šablóne – v šablónach sa dá priradiť zľava, ale platí iba pre prvú naplánovanú splátku, nie pre všetky. \n\n\nAlternatívne riešenie:\n\n\n\n\n- zľavu môžete nastaviť aj cez Sales & Payments → Discounts (kódy alebo pravidlá).", "cited": ["Managing sessions in a class | Zooza Help", "Charge a monthly membership fee | Zooza Help", "Session payment adjustments | Zooza Help", "Discounts and Sibling Pricing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc s týmito nastaveniami zliav, som vám k dispozícii. Chcete doplniť, čo sa snažíte nastaviť alebo čomu potrebujete lepšie porozumieť?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Vieme pri dochádzke konkrétnej skupiny pridať aj triedu na ZŠ?\nKeď robíme prezenčku, nech vieme z ktorej triedy sú žiaci.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno, dá sa to riešiť cez Additional Fields (ďalšie polia) na úrovni programu.\n\n\n\n\n- V Programmes → váš program → Additional Fields → Edit môžete pridať vlastné pole. \n\n\n- Typ Choice (rozbaľovací zoznam) môžete použiť na triedy na ZŠ (1. trieda, 2. trieda, 3. trieda atď.). \n\n\nTáto informácia sa uloží pri registrácii klienta a môžete ju používať aj na reporting.", "cited": ["Additional fields on the booking form | Zooza Help", "Programme settings | Zooza Help", "Booking form settings overview | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc s evidenciou tried žiakov pri dochádzke, som vám k dispozícii. Chcete doplniť, čo ešte potrebujete nastaviť alebo čomu potrebujete lepšie porozumieť?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Viem poslať hromadnú správu pre celý kurz, nie len skupinu?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno, dá sa. \n\n\nNa Communication → Send message môžete v kroku Target vybrať:\n\n\n\n\n- \nTo all clients – pošle správu všetkým klientom bez ohľadu na skupinu alebo kurz. \n\n\nTýmto spôsobom môžete poslať hromadnú správu pre celý kurz aj pre všetkých klientov naraz.", "cited": ["Send Email | Zooza Help", "Sending email/SMS to clients | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Je to takto v poriadku?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Máme 7 kurzov, chcem to poslať len jednému kurzu", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno, dá sa. Máte dve jednoduché možnosti:\n\n\n\n\n- V Communication → Send Email/SMS v kroku Target vyberte To a specific class a potom vyberte tú triedu (skupinu), ktorá patrí k danému kurzu. \n\n\n- Druhá možnosť:\nNa Classes zfiltrujte triedy podľa programme (kurzu) a potom kliknite Send email. Týmto pošlete správu všetkým klientom v tých triedach. \n\n\nTento druhý spôsob je často najrýchlejší, keď máte viacero kurzov.", "cited": ["Sending email/SMS to clients | Zooza Help", "Send Email | Zooza Help", "Creating a class | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Získal som tým odpoveď, ktorú si potreboval?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc s odoslaním správy iba pre jeden kurz, som vám k dispozícii. Chcete doplniť, čo potrebujete nastaviť alebo čomu potrebujete lepšie porozumieť?", "cited": []}], "verdict": "gap", "vtitle": "Bulk discount changes, and a discount that applies to every instalment", "vnote": "Asked four times. The second half just shipped: API-20260929-001 and APP-20260929-001 add a per-rule application mode, once or recurring, for loyalty discounts on memberships and pay-as-you-go -- recurring is exactly 'the discount on every instalment'. The same spec also fixes a percentage coupon being computed from the whole term price and dumped uncapped on the first payment. Nothing about either is in the KB.", "cat": "pricing"}, {"channel": "intercom", "id": "215476151268675", "date": "2026-09-29 10:30", "day": "2026-09-29", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "routed_to_team", "rating": null, "carried": "2026-09-29", "sources": [], "q": "give me a prompt (for chatgpt) to create the exact sibling discount code i need.", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "give me a prompt (for chatgpt) to create the exact sibling discount code i need.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I'm sorry, but I'm not able to help with creating discount codes under my policy. Would you like me to connect you with a human agent instead? I'm here to assist you with anything else you might need.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "sure", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I will connect you with someone from our team shortly. Meanwhile, could you please share more details about your request so they can assist you more efficiently?", "cited": []}], "verdict": "check", "vtitle": "Client asking for a ChatGPT prompt to build a sibling discount code", "vnote": "Unanswered. Interesting signal: the client would rather describe the discount in natural language than use the discount editor. Worth noting for the MCP/AI connector roadmap.", "cat": "pricing"}, {"channel": "intercom", "id": "215476046238860", "date": "2026-09-29 09:45", "day": "2026-09-29", "human": true, "bucket": "HUMAN", "reask": 45, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Automatic payment reminders | Zooza Help", "Payment Pairing for Bank Transfers & Direct Debit | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Edit payment on booking | Zooza Help", "Payment tile on booking | Zooza Help"], "q": "how do i change the grace period for payments to 0 so that payments must be made at time of booking?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "how do i change the grace period for payments to 0 so that payments must be made at time of booking?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Set the grace period to 0.\n\n\nSteps:\n\n\n\n\n- Go to Settings → Billing & Payments → Payment settings\n\n\n- Find Days before booking is marked unpaid (Slovak: Počet dní pre vystavenie splátky)\n\n- Set it to 0\n\n\nWith 0, there is no grace window. Any booking with an outstanding balance becomes Unpaid immediately when it is created.", "cited": ["Payments and Billing FAQ | Zooza Help", "Automatic payment reminders | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "how can i retrospectively add payments to customers who have been given a grace period?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Sam, Just to make sure the expectations are set correctly - there is no way to enforce the payment. Unpaid bookings are still in the system and if you don't want them to be there you need to cancel those manually.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can add the payment manually on the booking.\n\n\n\n\n- Go to Bookings and open the client’s booking.\n\n- In the booking details, go to Payments.\n\n- Click Add payment.\n\n- Enter the amount, date, and payment method, then save. \n\n\nThis records the payment even if it was received outside the system (bank transfer, cash, etc.).", "cited": ["Payments and Billing FAQ | Zooza Help", "Payment tile on booking | Zooza Help", "Edit payment on booking | Zooza Help", "Payment Pairing for Bank Transfers & Direct Debit | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "On your second question - You want to flag the payments manually?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Meaning that they paid you in cash or via bank transfer?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Or you want to remove the grace period?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "Hi Martin, thanks for this. I would like customers to be charged for payments as soon as they sign up", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "I want to remove the grace period", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ok, so those are two different things. Let me explain", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "When parents create the booking - they do immediately see the stripe screen where they can enter the payment information", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "But as it happens, the card payments are not 100% so the customer may not have their card at hand, or the card may be lacking funds or whatever is the case", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "The booking is still created and in the status - Awaiting for payment - aka the grace period", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "You can remove this by setting the grace period to 0 but that does not mean that users will be billed/charged", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "They can pay at any time for the booking via their parent portal and as I mentioned there is currently no automation which would cancel such bookings automatically", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "We have this in our roadmap though so its not that we did not receive such request, it just did not get the priority as most providers want to talk to these people before cancelling the booking", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "Ok all understood. I dont think it should cancel the booking as providers should be able to reach out but id be curious to see what the parents see on the parent portal?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Now when the grace period is on - you can simply remove that flag when you go on to that booking's payment screen", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Let me capture a screenshot for you from your portal", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "for example this booking, I want their first monthly payment to be made before the first class which is tomorrow. Whats the best way to try and get this payment?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "This is an example of a person who is in the status Awaiting for payment:", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "i want the customer to be charged their first monthly payment on 20th september which is whem signed up", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ok. let's get back to your question", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "As I mentioned the very first payment is different from the rest of the scheduled payments. Try to imagine your self as a customer - you need to create that first payment in order for subscription to take place and start", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Meaning - unless user actually makes that first payment - there are no card details to be stored and thus system can't charge anything against that customer", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "So you don't have any way to automatically charge that customer unless they actually made the first payment", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "They need to go to their parent portal and make the payment", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "What you can do is to remove that grace period to indicate that they should've already paid by now", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "That grace period can be set up globally in settings or per programme", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "Ah i see, so customers are not entering in their card info", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "I can see this on stripe where it says incomplete", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "because they havent entered it", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Yes", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "I used to use stripe subscriptions directly", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "and i had more success with customers entering their info", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "But that is the same scenario - the first payment need to be created", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "but that could have been those specific customers", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Yes, they do really need to make that first payment regardless whether that is stripe subscription or zooza subscription", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "yes i would like to remove the grace period globally", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "https://zooza.app/#settings/payment_settings", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "and for those parents that are showing as incomplete, not entering their payment info, do i send them directly to https://www.elizabethsamuelsdrama.it/parent-portal to make the first payment?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "its on this page - the very first input", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "yes", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "and i set it to 0?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Yes. Now there is also per programme automattion", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Which you should check out whether it is set and activated or not", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "as that might override the global setting", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "how do i find that?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "programme settings?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "In the programme's price and payment setting", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Yes", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "got it", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "here?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Yes. based on what you said you don't want this to be triggered. As basically you want to switch the booking to unpaid immediately. So you'd turn this off", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "yes", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "This is for the situations where you want to let customers have a time to pay and system will notify them", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "which you don't really want", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "You may want to turn on the later one - cancel unpaid bookings - but don't do that as the system would automatically cancel any new booking that did not receive the payment. I think you want to talk to the parent before you do that. That automation makes sense if you have the grace period on", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Great. What I'll do from our end is this - We'll look into how users are interacting with the stripe payment UI whether there is something we can do to enforce the payment.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Or rather - encourage the payment:)", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "yes it would be interesting to compare setting up a stripe subscription directly with stripe and then a zooza subscription. I'm curious if the UI is different and therefore not encouraging card details to be entered?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "one thing Martin, which settings would you recommend I change here?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "I would simply click not activated and thus-deactivate it completely", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "BTW have you set up Apple pay and Google pay on the stripe account?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "https://zooza.app/#integrations/stripe_connect", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "here", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "ah I hadnt!", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "Thank you, just done that", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Also I'venoticed you've created plenty of widgets:) You probably need only the one on your website. You can keep those there but there is no need to create any further ones:)", "cited": []}, {"role": "customer", "who": ents reported it (name or email of at least one), so we can look up their booking and payment records directly\n\n- \nThe exact message or error they saw — a forwarded message or screenshot is ideal\n\n- \nRoughly when it happened, and whether it was a card payment, a payment link, or a recurring/instalment charge\n\nEven one concrete example is enough for us to start , from there we can usually tell whether it's a card issue on the parent's side, a gateway response, or something in the payment plan setup.\n\n\nBest regards,", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "Name: Sara Pitoni\n\n\nEmail: pitoni.sara@ail.com\n\n\nMessage: Buonasera,\nSto cercando di effettuare il pagamento per il corso di lambda del martedì fino alle h 17 per entrambi i miei figli (Elena e Andrea Parello Pitoni) ma non riesco. Ha rimandato più volte alla pagina iniziale. Come posso fare? Grazie", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "English translation: Good evening,\n\n\nI am trying to make the payment for the Tuesday Lambda course (ending at 5:00 PM) for both of my children (Elena and Andrea Parello Pitoni), but I am unable to do so. It keeps redirecting me to the home page. What should I do? Thank you.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Sam,\n\n\ngood news,,, I've found it, and technically everything is working correctly. The payment is pending (ref. 544697, €184.00) and the flow does reach the gateway.\n\n\nThe issue is UX, not a bug. Here's what happens:\n\n\nShe sees \"Please pay\" in her profile → the link takes her to the registration form, which then switches into the payment gateway. So she has to pass through the landing page of registration to get to the payment ,, and that's what feels like being \"sent back to the beginning.\"\n\n\n\n\n\n\n\n\nHow to solve it? What most of our clients do about this:\n\n\nThey set up a separate page for the booking widget ,,, often hidden, not in the main menu ,,, where the registration form is embedded. Parents come back to that page in exactly these situations: to complete a payment, manage their booking, or update details.\n\n\nSomething like:\nhttps://www.elizabethsamuelsdrama.it/booking\n\n\nIt gives the widget a stable home, so any link a parent follows from their profile or from a payment reminder lands somewhere predictable, instead of on a marketing course page.\n\n\n\n\n\nWould you like me to prepare the embed code for you? You can find it here: https://zooza.app/#widgets\n\nIf you can create that page (hidden is fine), I'll send you the exact snippet and where to paste it ,,, just let me know which platform the site runs on.\n\n\n\n\n\nBest regards", "cited": []}, {"role": "human", "who": "Tech Support", "text": "And she is obviously using a different email address: https://zooza.app/#registrations?user=pitoni&order_by=created_desc&page=0&page_size=20&person_id=0&payment_id=0&segment_id=0&schedule_id=0", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "ok, yes please prepare the embed code, i will do this now while I have you to make sure its working", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "?", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Sam,\n\n\nsorry for the delay ,,, yes, it's already available in your app.\n\n\nHere's the embed code for the registration widget:\n\n\n\u003cdiv data-zooza-widget='registration' data-zooza-id='4d06112674'>\u003c/div>\n\u003cscript async src='https://api.zooza.app/widgets/v1/loader.js'>\u003c/script>\n\nYou can find it here in your account: https://zooza.app/#widgets/1391\n\n\nPaste both lines into the page ,,, a hidden /booking page is perfect. The \u003cdiv> goes where you want the form to appear, and the \u003cscript> line can sit right below it.\n\n\nOnce it's live, let me know and I'll set that page as the link inside your widgets, so parents are sent there for payments instead of bouncing back to the course page.\n\n\nThank you.", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "https://www.elizabethsamuelsdrama.it/booking", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "Can you check that's working correctly?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "and thanks for the code", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Sam,\n\n\nchecked, it's working correctly, looks great.\n\n\nI've also updated the setting in your account, so when a parent goes to pay from their parent zone, they'll now land on this clearer page where they can complete the payment directly, instead of being taken back through the course page.\n\n\nYou can point Sara Pitoni there as well , her booking is still pending (€184.00, ref. 544697), so she should be able to finish it without any trouble now.\n\n\nAnd no problem at all about the code  glad it's sorted.\n\n\nBest regards", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "thank you", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "so should I send Sara Pitoni and other parents to the new booking page https://www.elizabethsamuelsdrama.it/booking", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "i've got about 5 payments in stripe which say incomplete so would you recommend sending the parents this link: https://www.elizabethsamuelsdrama.it/booking", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Sam,\n\n\nno, for parents with outstanding payments, always send them to the parent portal, not the booking page:\n\n\nhttps://www.elizabethsamuelsdrama.it/parent-portal\n\n\n\n\n\nThe portal recognises them, shows their existing bookings and guides them straight to what needs paying. The booking page is for new registrations , sending an existing parent there would just start a new booking instead of completing the one they already have.\n\n\nSo for the 5 incomplete Stripe payments, and for Sara Pitoni too, the parent portal link is the right one.\n\n\nBest regards,\nMichael", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "Right okay", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "Can parents still book through www.elizabethsamuelsdrama.it/ris?", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Sam,\n\n\nyes, absolutely, /ris keeps working exactly as before.\n\n\nYou can have as many registration pages as you like. Dedicated pages like /ris are ideal for marketing: each one can be pre-set to a specific course, so parents land straight on the right booking form.\n\n\nThe /booking page is simply the general one, for the scenarios where there's no specific course context,and the parent portal is where existing parents go to manage bookings and complete payments.\n\n\nAll three work alongside each other, so nothing needs changing.\n\n\nBest regards", "cited": []}], "verdict": "verify", "vtitle": "Can payment be forced at the time of booking?", "vnote": "Human answer to Sam: there is no way to enforce payment, unpaid bookings stay in the system and must be cancelled manually. But the answer to Jochelle on 2 October (215476170792120) points at 'Auto-cancel unpaid bookings' at the bottom of the programme payment settings. Both can be true -- you cannot block the booking, but you can have it auto-cancelled. I will not write either claim until you confirm which it is.", "cat": "pricing"}, {"channel": "email", "id": "email-04", "date": "2026-09-29 09:14", "day": "2026-09-29", "human": true, "bucket": "EMAIL", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Halloween camp – cena 0 na webe, záloha 50 %, výber dní", "turns": [{"role": "customer", "who": "Jochelle Laguipo-Strzalkowska", "text": "how to add payment plan in new programme", "cited": []}, {"role": "customer", "who": "Jochelle Laguipo-Strzalkowska", "text": "how apply payment plan to a new programme", "cited": []}, {"role": "customer", "w o worries at all! Give me another moment. I will set it up for you.", "cited": []}, {"role": "human", "who": "Michal", "text": "Hi Jochelle,\nI've set it up a bit differently, so parents can choose their day. I used a feature you may not have come across yet: blocks (segments). Each camp day is its own block, and parents simply tick the day or days they want. The price updates automatically: €50 for one day, €85 for both.\nSo now there's just one link for the whole camp: https://corkcity.youngengineers.ie/registration/?share=b9d507dff1960fa95f8ec892267a17acfa31f2bd73cea7fa0745ec25dfd4639e\nHave a look and try it out as a parent would. If anything looks off, just let me know. I'm also happy to walk you through how blocks work, so you can use them for your next camps.", "cited": []}, {"role": "customer", "who": "Jochelle Laguipo-Strzalkowska", "text": "Waaah that’s amazing!!! I would have never figured that out 🥲 thank you so much for your help. You have no idea how much you made my day!! I just had a baby 3 months ago so my brain is only at 20% most days hahaha\nI will play around with it using the ai assistant first and if I'm super stuck i'll reach out to you\nThank you very much!! Have a great day", "cited": []}, {"role": "human", "who": "Michal", "text": "Hi Jochelle,\nCongratulations on your baby! Wishing you all lots of health, and enjoy these early days. 20% is more than enough, you're doing great! :-D\nOf course, feel free to reach out anytime. We keep an eye on things, and I'm happy to help whenever you need.\nAnd yes, blocks are a bit more advanced, but a camp where parents choose their days is exactly the kind of case they're made for.\nHave a lovely day!", "cited": []}], "verdict": "gap", "vtitle": "Dvojdňový camp s výberom dní a 50 % zálohou: AI bot zákazníčku točil v kruhu, riešením boli bloky", "vnote": "28. 9. zákazníčka položila AI asistentovi 10 krátkych otázok (platobný plán, one-off vs. scheduled, typ programu, cena 0 na webe, billable sessions);
