 I already had? or will it just take a while to restore", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "So if you don't want that session to be canceled then you need to switch its status to scheduled. Try opening this https://asia.zooza.app/#courses/events/4648?edit=settings and change the status to scheduled and hit save", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "you should see that its status is canceled", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "ohh fantastic", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "thank you its there now and I can put it back online", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "It is automatically done", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Now", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "panic over", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "You have an option to see canceled sessions in the calendar", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "If you want. That way you'd simply open the session - hit edit and you'd be where I sent you", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "fab thanks", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Basically, let me just explain what happened - Each session can be Scheduled or Canceled or Deleted. You Delete sessions only if you created them by mistake", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "What you did is you canceled the session - this is to let customers know that: Hey there was supposed to be a session but it is canceled now", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "I started in a clients account and was trying to delete a session they had booked but somehow managed to delete the whole session.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Go here: https://zooza.app/#settings/general please and scroll aaaall the way to the bottom to Calendar Card", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "You can toggle the first toggle there to enable canceled sessions to appear on the calendar", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "I see. Well, sometimes this happens but next time all you have to do is click the Hide button on that customer's attendance tab:)", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "ok thanks again", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "happy to help", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "All the best Samantha", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "and you too, great help and quick solution thanks bye", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "Hi is there a way I can only allow parents to book one trial per programme? I have a reduced price for trial sessions and have noticed some are booking trials weekly so getting classes at a reduced price rather than booking the term", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Sam, unfortunately we don't have this blocker in the system but it is something that cropped up couple times in the past so it should not be a problem to do. The tricky part here is how to distinguish legitimate case where customer has two / three kids which he wants to enroll to same class. We can certainly block trial registration based on email. Would this work for you?\n\n\n1) I book my son to trial - go through the trial\n\n\n2) I will try to book my daughter to trial -\n\n\na) system will block me and tell me to go and register to full class\n\n\nb) system will grant me the trial but at full session price not the reduced price.\n\n\n\n\n\nOr you have some other idea how this could be solved?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "This sounds perfect, yes if we can put a block to stop another trial being booked if email is already registered, obviously after one trial. It's very rare I have parents with multiple children enrolled anyway unless twins due to the age range of my classes. I have found 3 now, which have booked a trial at week one and then gone to trial lost, then booked another trial at week 4. This is not how I want trials to work, people using them as pay as you go. Especially as trials are at a reduced price.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hm, but the situation you describe is a different one. If we put a hard stop for \"already registered\" this would not apply to those who registered and their trial ended as failure. What if I state the rule as following: Zooza will grant only 1 trial session per unique email per programme per billing period.\n\n\nI think that this would be better as that would automatically include all - lost, won, everyone. even a case where parent has two children - they know what they are buying therefore they don need to go through the trial. At the same time, by flagging the billing period we would give parents a chance to try next year", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "that sounds good, however the billing period doesn't really matter. as my terms are set as 4 weeks, 4 weeks autumn term, 4 week winter term. So would parents be able to book 1 trial per term? if we took out billing period from the situation", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "I like parents to have the option to book one trial per term only, so per class? if that possible", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Billing period = Term if you set it like that. Now whether it is per class or per programme - we can do both but I guess that programme should be enough", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Let's do this Sam. We can make this work by the end of the week", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "perfect, thank you", "cited": []}], "verdict": "product", "vtitle": "One trial per email per programme per billing period — agreed and being built", "vnote": "Twenty-five replies ending in a product decision taken with the customer on 8 October: Zooza will grant only one trial per unique email per programme per billing period, covering won, lost and everyone, with the billing period giving families a fresh go next term. Martin said end of the week. THIS CONTRADICTS WHAT WE PUBLISHED ON 3 OCTOBER, where we wrote that repeat trials cannot be blocked. Do not leave that article as it stands.", "cat": "trials"}, {"channel": "intercom", "id": "215476259827375", "date": "2026-10-08 07:16", "day": "2026-10-08", "human": true, "bucket": "HUMAN", "reask": 8, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Sending email/SMS to clients | Zooza Help", "Send Email | Zooza Help", "Email and Communication FAQ | Zooza Help", "Bookings | Zooza Help"], "q": "how best to send out a retrospective booking confirmation to customer who signed up in the last month. I forgot to send to lots of them", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "how best to send out a retrospective booking confirmation to customer who signed up in the last month. I forgot to send to lots of them", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Anna, the easiest way is to resend the confirmation from the booking itself.\n\n\n\n\n- Open the booking detail\n\n\n- Go to the Communication tab\n\n- Click Send email\n\n\n- Choose the Booking confirmation template\n\n- Send\n\nThis works for any booking and can be used anytime a client needs the confirmation again. \n\n\nIf you need to send it to many clients, you can also send a bulk email from Communication → Send Email and select the relevant bookings or clients.", "cited": ["Email and Communication FAQ | Zooza Help", "Send Email | Zooza Help", "Sending email/SMS to clients | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help sending the retrospective booking confirmations, I’m here to assist. Would you like to share more about the bookings or messages you’re trying to send?", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "But is there a way to do it without going to each individual booking and just do a bulk send for bookings made in the past month", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — you can do this in bulk without opening each booking.\n\n\n\n\n- Go to Bookings\n\n\n- Use the filter Created from / Created to and set the date range to the last month\n\n- The list will update to show only those bookings\n\n- Click Send email in the top actions\n\nThis sends one email to all bookings matching that filter. \n\n\nYou can also send from Communication → Send message and choose selected bookings if you prefer selecting them manually.", "cited": ["Bookings | Zooza Help", "Send Email | Zooza Help", "Email and Communication FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Anna, you can filter bookings by date when they were created so that might be the one approach that might've work for this case", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "thanks Martin, will this apply to all bookings i.e. even those ones I created manually", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "or enrolled manually from trial status?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hm", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "I realised that I hadn't sent the booking emails out when doing it manually. I think it goes automatically when people book online right", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Yes, that is how it works", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "I think we can add a filter for the origin to bookings search", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "I think it should as I put the filter of enrolled so it shouldn't matter how they were enrolled?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "So you could clearly target bookings which were copied / moved / created manually", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "yes that would be good. so if I just send to the enrolled ones it might duplicate for some you mean", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ok, so just please hold for an hour or so and we'll add that option", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "ok thank you so much", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Anna, it's live. You'll need to do a hard refresh of the app to see the new filter. Try hitting CTRL+R or CTRL+F5 and you should see it.", "cited": []}], "verdict": "gap", "vtitle": "Sending booking confirmations after the fact, and the new origin filter", "vnote": "Anna forgot to send confirmations for a month of bookings. In the same conversation the team shipped a filter for how a booking was created — copied, moved, manually created — and it was live within the hour. That filter is new functionality nobody has documented, and it is the practical answer to 'which bookings never got a confirmation'.", "cat": "bookings"}, {"channel": "intercom", "id": "215476294593795", "date": "2026-10-08 05:18", "day": "2026-10-08", "human": false, "bucket": "D_assumed_with_kb", "reask": 0, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Getting Help and Support | Zooza Help", "Setup guide | Zooza Help"], "q": "Hi Zooza team,\n\nI hope you're doing well.\n\nMy name is Max Zaharenkov, and I’m a travel creator with over 4+ million followers on Instagram.\n\nI’d love to discuss how we can work together. I can create content to boost your brand's presence.\n\nI have previous experience working with similar companies like yours, so I know the type of content we need to create.\n\nWe can jump on a Zoom call to chat more about this.\n\nYou can check out my Instagram account: @maxzaharenkov\n\nIn the meantime, I can send you my media kit and some Instagram stats.\n\n--\nRegards,Max Zaharenkov", "turns": [{"role": "customer", "who": "Max Zaharenkov", "text": "Hi Zooza team,\n\nI hope you're doing well.\n\nMy name is Max Zaharenkov, and I’m a travel creator with over 4+ million followers on Instagram.\n\nI’d love to discuss how we can work together. I can create content to boost your brand's presence.\n\nI have previous experience working with similar companies like yours, so I know the type of content we need to create.\n\nWe can jump on a Zoom call to chat more about this.\n\nYou can check out my Instagram account: @maxzaharenkov\n\nIn the meantime, I can send you my media kit and some Instagram stats.\n\n--\nRegards,Max Zaharenkov", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Hi Max,\n\n\nThanks for reaching out! I'm Zooza Support, Zooza's AI Agent and I'm well trained to answer your query but you can reply and ask for the team at any time.\n\n\nThank you for your interest in collaborating with us and for sharing a bit about your work as a travel creator.\n\n\nFor partnership or collaboration enquiries, the best way to reach the appropriate team is to submit a request through our support panel:\n\n\n\n\n- Click the ? button in the bottom-left corner of any page in Zooza.\n\n- Select Contact support and then Create a ticket.\n\n- Include deta izabeth Samuels\n\nHi Sam, \n Hope the season's going well. \n Just a quick note about billing on the Elizabeth Samuels account — there's no payment method on it yet, so the subscription hasn't started. It became due back in September, and we'd rather flag it now than let it drift, because accounts without an active subscription do eventually become inactive. \n It takes about two minutes: \n 1. Open Subscription & Billing: https://zooza.app/#subscription \n2. Choose \"Up to 70 active clients + PRO\" — €39 a month. There's also an annual option if you'd rather pay once and forget about it — two months free. \n3. Add your card \n One thing worth knowing: your account has all the PRO features at the Basic price. That's not our standard pricing — it's specific to your account. Unlimited programmes, classes and team members, full reporting, shared sessions, the activity log, the lot. So the plan above gets you considerably more than it looks like on the page. \n If the plan size doesn't feel right for where you are, or anything about the billing is unclear, just reply here and we'll sort it out together. \n All the best, The Zooza Team support@zooza.online", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dear Sam,\n\n\nyour ticket  has been received. Zooza Assistant will try to help you right away — and a member of our team will personally review it too.\n\n\n— Zooza Support", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "Please see error code while trying to make payment for the subscription. \n​\n\n\nMany thanks,  \n\n\nSamuel Davis\n\n\nPrincipal\n\n\nElizabeth Samuels Drama School\n🏆 Winner: Best Achievement in Corporate Social Responsibility – Richmond Business Awards 202507429478447\n\n\nwww.elizabethsamuelsdrama.com", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thank elp you right away — and a member of our team will personally review it too.\n\n\n— Zooza Support", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Barbora, tento typ problemov ma vzdy len jeden zdroj - nemate korektne nastavene linky v ramci Widgetov. Je potrebne skontrolovat v casti Tim a nastavenia -> Publikovat -> linku na registracny formular", "cited": []}, {"role": "customer", "who": "barbora zajacová", "text": "Dobry den, dakujem za rychlu odpoved - overime.  Aj pre prikaz platb sa jedna o registracny formular?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "V principe moze ist bud o registracny formular alebo o profil. Treba len skontrolovat ci nastavenie ktore je v zooze sedi s tym kde je widget realne nasadeny. Napriklad defaultne je linka vyskladana: www.webzakaznika.sk/moj-profil Ak je v profilovom widgete nastavena url /moj-profil a widget je realne nasadeny napriklad na stranke /zakaznicka-zona tak tam je problem", "cited": []}, {"role": "customer", "who": "barbora zajacová", "text": "no asi to budem musiet prehodit na nasho developera, nech sa na to pozrie, ja to tam vacsinou nevidim ze kde presne je problem🙈 dakujem za pomoc, asi vam budem este pisat", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Jasne, ved keby nieco vieme to aj my skontrolovat", "cited": []}, {"role": "customer", "who": "barbora zajacová", "text": "Dobrý deň Martin, pridala som do kópie kolegu developera - prosím skúšali sme to navodiť ale na našej testovacej registrácii a nezobrazi sa tlačítko zaplatiť tak ako to bolo u tej problémovej a nevieme teda prisť na to kde teda je to zle nastavené. Viete nám s tým prosím pomoct a s kolegom sa zľadiť? \n​\n\n\nďakujem za pomoc a trpezlivost,\n\n\nb\n\n\n\n​", "cited": []}, {"role": "customer", "who": "Miroslav Valent", "text": "D čková", "text": "Na pravej strane stále svieti neuhradený dlh\n​", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ten dlh sa prepocitava v nejakych casovych intervaloch. ked rozkliknete tu skupinu tak tam aj uvidite, kedy bol naposledy prepocitany a viete si ho aj manualne nechat prepocitat. Kazdopadne zmena nie je okamzite viditelna na skupine. Pokial ale su vsetky registracie v skupine uhradene, system to automaticky prepocita aj na skupine. Len pre Vase info - tuto informaciu klient nikde nevidi. To co vidi u seba v profile je registracia - nie skupina.", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Skvelé, veľmi pekne ďakujem za navigovanie. Som tu nová, čo ste určite pochopili. Poprosila by som pomoc s ďalším problémom. Popíšem ho nižšie.", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Rodičia sa registrovali na krúžok, ktorý zatiaľ z dôvodu nízkeho počtu detí neotvárame. Je možné že sa otvorí o 2 týždne, alebo o mesiac. Potrebujeme vypnúť upozornenia  rodičom v tejto skupine na potrebu realizácie úhrady. Môže sa stať, že krúžok nebude vôbec otvorený.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Najjednoduchsie co mozete urobit je prepnut registracie do stavu Poradovnik, alebo prepnut typ skupiny do stavu - zber zaujmu. Vtedy aj zakaznikom pride ine potvrdenie o registracii a zaroven vo svojich profiloch neuvidia nic okrem informacie - ze ich budete kontaktovat, ked sa skupina spusti", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Odporucal by som prepnut tu skupinu do stavu Zber zaujmu. Robi sa to v nastaveniach skupiny, tam kde sa meni Meno skupiny", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Ďakujem. Podarilo sa.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Super. Len potom nezabudnite, ked skupinu budete spustat zmenit jej stav naspat.", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Ďalší problém. Rodič poslal jednu platbu bez variabilného symbolu. Platba bola vo výške ročnej platby. V nespárovaných platbách som ju priradila k registrácii dieťaťa, čím sa dlh tohoto dieťaťa vynuloval. Až dodatočne som si všimla, že matka má prihlásené 2 deti. A spôsob úhrady bol polročný. Je možné platbu rozdeliť , tak, aby obe deti mali polročnú platbu uhradenú?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ano. Rovnakou cestou akou ste opravovali omylom pridanu uhradu. Su to dve mozne cesty:\n\n\n1) Omylom ste priradili plabtu na inu registraciu\n\n\n\n\n- vojdete do platieb tak ako naposledy a najdete prijatu uhradu - kliknete na Viac\n\n- v kazdej platbe mate tri moznosti - Refundaciu, Opravu uhrady a Presun platby\n\n- V tomto pripade ide o presun - najdete spravnu registraciu a platbu presuniete.\n\n- Platba sa da presuvat ale iba v celku\n\n2) Rodic spojil dve platby dohromady\n\n\n\n\n- Najjdednoduchsi sposob je najst tu uhradu (v tomto pripade rocnu) a zvolit Opravu uhrady\n\n- Opravite uhradu tak, ze z nej \"odpocitate\" polovicu\n\n- Nasledne na tej druhej registracii pridate tuto polovicu ako manualnu uhradu. Idealne je si vzdy do poznamky napisat, preco ste tieto operacie robili.\n\nToto plati vo vseobecnosti: Ak rodic posiela nespravne uhrady - je dobre ho kontaktovat a upozornit ho na to. Napriklad ak sa mu nechce menit variabilny symbol stale by bolo pre vas jednoduchsie aby to poslal ako dve samostatne platby - hoci aj s jednym variabilnym symbolom - iba by ste platbu presunuli na spravnu registraciu.", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Ďakujem. Skúsim to a potom sa ozvem. Zatiaľ prajem pekný deň!", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dakujem, prajem aj Vam pekny den", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Dobrý deň, poprosím o vysvetlenie a návrh postupu. Opíšem situáciu.", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Mamička registrovala dve deti na krúžok, systém jej ponúkol úhradu cez QR kód, ktorú zrealizovala.", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Platba je pripísaná len synovi. Pri dcére nie je určený žiadny platobný plán.", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Pri synovi je úhrada za krúžok v plnej výške.", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Čo je potrebné urobiť, aby sa dcére vytvoril platobný plán rovnako ako je to pri synovi. Platby majú byť polročné vo výške 150 € / dieťa.", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Ďakujem.", "cited": []}], "verdict": "gap", "vtitle": "Fixing a parent who paid for two children in one transfer", "vnote": "Two clean routes: move the payment whole to the right booking, or correct the payment down and add the remainder manually on the other booking — always with a note saying why. Plus the advice to ask the parent to send two payments rather than one. The same thread explains that a class balance is recalculated periodically rather than live, and that clients never see the class figure, only their own registration.", "cat": "payments"}, {"channel": "intercom", "id": "215476172289777", "date": "2026-10-07 13:41", "day": "2026-10-07", "human": true, "bucket": "HUMAN", "reask": 0, "resolution": "routed_to_team", "rating": null, "carried": "2026-09-30", "sources": [], "q": "Hi Martin,\nWe have now been through the whole registration flow, the parent profile and every email template. Below is everything we need from you, in our order of priority. We are close to opening registration to real parents, so at the end I also ask about booking a call with you.\n\n\n0A) zooza It is calling the SmartBill API every 5 minutes and locking our SmartBill account\nSmartBill's own support has told us that our account is receiving a request roughly every 5 minutes, querying the invoice series, and that this is what is getting our account locked. Their instruction to us was literally: stop the trigger that keeps sending requests to SmartBill.\nWe cannot find any such trigger in Zooza. It is quite possible that we did not set the SmartBill integration up correctly — we never fully understood how it is supposed to work.\n0B) An invoice was issued and emailed on its own (30 September 2026, 11:40)\nAn email went out to stevejr110@gmail.com with the subject \"Factura noua pentru:\", carrying invoice no. 1 for 2,180 RON, made out to \"Steve Test\". Nobody on our side clicked anything.\nThe invoice record (#payments/invoices/69572) says \"INVOICING SYSTEM: smart_bill\", which again points at the integration still being live on your side.\nIt is tied to a test booking from 16 August, in a test class called \"ZZ TEST regula 3 ore\". That class has since been DELETED, and so has the booking. There is no pending scheduled payment left either — all 42 are \"Processed\".\nOn the PDF: Issue date 16.8.2026, but Supply date 30.9.2026. So the document was generated TODAY and back-dated to August.\nWe checked our SmartBill account: there is no document there — not on 16.08, not on 30.09. So the invoice was produced entirely by Zooza, using our own invoice profile numbering.\n\n\n0C) How do we delete this invoice?\nWe cannot delete or cancel it from the app. The \"Edit\" button answers: \"Invoices can only be edited in your invoice management system. To edit, go to the application.\" But there is no document in SmartBill to go to — the invoice exists only inside Zooza.\n\n\n0D) Two defects in the invoice document and email\n- The invoice PDF is entirely in English, with \"ks\" as the unit of measure. For Romanian customers it would need to be in Romanian, with \"buc\".- In the invoice email, the company name is followed by a stray \">\" (\"Scoala de Actorie Metamorfoza>\"), and the last line of the body is just \"9554\", which is the course id.\n\n1) The \"(Offline)\" templates — which one is sent, and how do we edit them?\nWe have pairs of templates: \"New Payment\" and \"New Payment (Offline)\", \"Upcoming Payment\" / \"(Offline)\", \"Missed Payment\" / \"(Offline)\". We collect by bank transfer.\nWe have written good Romanian copy for the ones without \"(Offline)\", but we suspect parents actually receive the \"(Offline)\" ones, which still carry your default text.\nCould you confirm which variant is sent for bank transfer? And what switches between them — the payment method on the course, or the payment collection setup?\nOn top of that, the three \"(Offline)\" templates cannot be edited at all: when we open them, the \"Version\" selector is empty and neither the subject field nor the editor appears. How do we create a version for them?\n\n2) Two templates that are not translated into Romanian\n- \"User Template\" (the manual message): the subject is `email_user_template_subject` and the body is `email_user_template_body` — the keys, not the text. If we send a manual message, is that what the parent receives?- The template list contains one named `email_templates__name__sessions_booked`, also untranslated.\n\n3) The default Romanian translations contain errors\nIn \"New Payment\" and \"Upcoming Payment\" (the default variants):- broken HTML: `\u003c/strong>>` and `\u003cstrong>strong>`; the table is opened once and closed twice- words left in English: \"Payment is due\", \"Sum\"- an invalid colour value: `#efefefef`\n\n4) The \"Payments\" tab in the profile breaks on an unconfirmed booking\nIt does not open. Console: TypeError: Cannot read properties of undefined (reading 'total_debt'), in course_detail_tab_payments.\nOn the same screen, the \"Make-up sessions\" card reads \"you are entitled to undefined make-up sessions\".\n\n5) Date of birth is not pre-filled for an existing child\nIn the registration form, when a parent picks a child they have already registered before, the date of birth is not filled in, even though the field is required. The widget has code for this (DOB_PRESET), but the child data arrives without a date.\n\n6) A template that does not appear in the interface\n\"registration_invitation_confirmation\" — the email we use to invite a parent we have registered ourselves — exists in the data but does not appear in the template list in the app, so we cannot edit it. Its text says \"press the confirmation button\", but there is no button in it; we suspect the confirmation tag is missing. How do we edit it?\n\n7) Notification center does not open\nSettings -> Notification center stays blank. Console: Uncaught Error: Unknown component 'notification_center' (knockout.min.js).\n\n8) Importing our existing clients — about 300 children\nThis is the last big step before we can start using Zooza for real, and we would rather not get it wrong.\n- Does the import send emails to parents (for example \"Booking imported\" or an account-ready message)? We are importing many children at once and we do not want mail going out without knowing.- If it does, can it be switched off for the duration of the import, and then switched on again?- Can you confirm the exact column format you expect, and send us a sample file that is known to work?- Can the import create the booking in a specific class and with a specific payment schedule, or do we set those afterwards?- Is there a way to run a trial import of two or three rows and roll it back if something is wrong?- What happens on a second import if a parent or child already exists — duplicate, or match and update?\n\nWhere we are — what we have already set up\nSo you know what state the account is in before the call, here is what is done on our side.\nOn the website (suntemsam.ro, WordPress):- We built our own plugin around your two widgets, the registration form and the parent profile. - The form: Romanian copy throughout, numbered headings when a parent registers a second child, an age warning when the child does not fit the age range of the class, and the site's own visual design.- The profile: the same design language as the form, a mobile layout for the tabs, copy-to-clipboard buttons for the IBAN and the payment reference, and a few translation fixes.- Both were tested at phone width as well as desktop.\nIn Zooza:- All 14 programmes moved to the Membership price type.- Monthly membership templates active: 545 RON, and 650 RON for the English-language programmes. We also built the annual one, but deliberately left it inactive, since the window for paying the full year has passed.- The previous payment model has been deleted.- Late bookings set to automatic confirmation on all programmes, so the payment schedule is applied without us intervening. We verified this with a real test booking end to end.- Make-up sessions: credits expire 90 days after the entitlement is created; the per-programme limit is left at 0, which your documentation says means \"as many as there are sessions in the class\".- We rewrote 10 email templates in Romanian, keeping your merge tags intact, and added two things that were missing from the parent's point of view: the discount code and the link to the form.- Two invoice profiles exist (a sole trader and a company); the sole trader one is the default.- All test bookings and test classes have been deleted.\nWhat is still open on our side, and which is why we are asking for a call: the three \"(Offline)\" templates we cannot edit, the SmartBill situation above, and the import of roughly 300 children.\n\n9) Could we book a call to finish the setup?I think I have reached the limit of what I can do with Claude, and I need help for the final parts.\n\nWe are at the point where the remaining questions are faster to settle live than by email. Could we book one or two screen-share sessions with someone from your team?\nWhat we would want to go through:- the SmartBill integration- the invoicing question above, until we are sure nothing is issued automatically- which payment templates actually reach parents on bank transfer- a dry run of the client import, together, before we do all 300- a final review of our settings before we open registration: payment schedules, late bookings, make-up sessions, the emails that go out at each step - a walk-through of our zooza setting, plus some form of training, so that we learn to use the system properly.\nPlease let us know what times suit you in the following days, and whether this is included in our plan or something we pay for — either is fine, we just want it done properly.\n\nThank you,Stefan", "turns": [{"role": "customer", "who": "Mădălina Mărcuș", "text": "Hi Martin,\nWe have now been through the whole registration flow, the parent profile and every email template. Below is everything we need from you, in our order of priority. We are close to opening registration to real parents, so at the end I also ask about booking a call with you.\n\n\n0A) zooza It is calling the SmartBill API every 5 minutes and locking our SmartBill account\nSmartBill's own support has told us that our account is receiving a request roughly every 5 minutes, querying the invoice series, and that this is what is getting our account locked. Their instruction to us was literally: stop the trigger that keeps sending requests to SmartBill.\nWe cannot find any such trigger in Zooza. It is quite possible that we did not set the SmartBill integration up correctly — we never fully understood how it is supposed to work.\n0B) An invoice was issued and emailed on its own (30 September 2026, 11:40)\nAn email went out to stevejr110@gmail.com with the subject \"Factura noua pentru:\", carrying invoice no. 1 for 2,180 RON, made out to \"Steve Test\". Nobody on our side clicked anything.\nThe invoice record (#payments/invoices/69572) says \"INVOICING SYSTEM: smart_bill\", which again points at the integration still being live on your side.\nIt is tied to a test booking from 16 August, in a test class called \"ZZ TEST regula 3 ore\". That class has since been DELETED, and so has the booking. There is no pending scheduled payment left either — all 42 are \"Processed\".\nOn the PDF: Issue date 16.8.2026, but Supply date 30.9.2026. So the document was generated TODAY and back-dated to August.\nWe checked our SmartBill account: there is no document there — not on 16.08, not on 30.09. So the invoice was produced entirely by Zooza, using our own invoice profile numbering.\n\n\n0C) How do we delete this invoice?\nWe cannot delete or cancel it from the app. The \"Edit\" button answers: \"Invoices can only be edited in your invoice management system. To edit, go to the application.\" But there is no document in SmartBill to go to — the invoice exists only inside Zooza.\n\n\n0D) Two defects in the invoice document and email\n- The invoice PDF is entirely in English, with \"ks\" as the unit of measure. For Romanian customers it would need to be in Romanian, with \"buc\".- In the invoice email, the company name is followed by a stray \">\" (\"Scoala de Actorie Metamorfoza>\"), and the last line of the body is just \"9554\", which is the course id.\n\n1) The \"(Offline)\" templates — which one is sent, and how do we edit them?\nWe have pairs of templates: \"New Payment\" and \"New Payment (Offline)\", \"Upcoming Payment\" / \"(Offline)\", \"Missed Payment\" / \"(Offline)\". We collect by bank transfer.\nWe have written good Romanian copy for the ones without \"(Offline)\", but we suspect parents actually receive the \"(Offline)\" ones, which still carry your default text.\nCould you confirm which variant is sent for bank transfer? And what switches between them — the payment method on the course, or the payment collection setup?\nOn top of that, the three \"(Offline)\" templates cannot be edited at all: when we open them, the \"Version\" selector is empty and neither the subject field nor the editor appears. How do we create a version for them?\n\n2) Two templates that are not translated into Romanian\n- \"User Template\" (the manual message): the subject is `email_user_template_subject` and the body is `email_user_template_body` — the keys, not the text. If we send a manual message, is that what the parent receives?- The template list contains one named `email_templates__name__sessions_booked`, also untranslated.\n\n3) The default Romanian translations contain errors\nIn \"New Payment\" and \"Upcoming Payment\" (the default variants):- broken HTML: `\u003c/strong>>` and `\u003cstrong>strong>`; the table is opened once and closed twice- words left in English: \"Payment is due\", \"Sum\"- an invalid colour value: `#efefefef`\n\n4) The \"Payments\" tab in the profile breaks on an unconfirmed booking\nIt does not open. Console: TypeError: Cannot read properties of undefined (reading 'total_debt'), in course_detail_tab_payments.\nOn the same screen, the \"Make-up sessions\" card reads \"you are entitled to undefined make-up sessions\".\n\n5) Date of birth is not pre-filled for an existing child\nIn the registration form, when a parent picks a child they have already registered before, the date of birth is not filled in, even though the field is required. The widget has code for this (DOB_PRESET), but the child data arrives without a date.\n\n6) A template that does not appear in the interface\n\"registration_invitation_confirmation\" — the email we use to invite a parent we have registered ourselves — exists in the data but does not appear in the template list in the app, so we cannot edit it. Its text says \"press the confirmation button\", but there is no button in it; we suspect the confirmation tag is missing. How do we edit it?\n\n7) Notification center does not open\nSettings -> Notification center stays blank. Console: Uncaught Error: Unknown component 'notification_center' (knockout.min.js).\n\n8) Importing our existing clients — about 300 children\nThis is the last big step before we can start using Zooza for real, and we would rather not get it wrong.\n- Does the import send emails to parents (for example \"Booking imported\" or an account-ready message)? We are importing many children at once and we do not want mail going out without knowing.- If it does, can it be switched off for the duration of the import, and then switched on again?- Can you confirm the exact column format you expect, and send us a sample file that is known to work?- Can the import create the booking in a specific class and with a specific payment schedule, or do we set those afterwards?- Is there a way to run a trial import of two or three rows and roll it back if something is wrong?- What happens on a second import if a parent or child already exists — duplicate, or match and update?\n\nWhere we are — what we have already set up\nSo you know what state the account is in before the call, here is what is done on our side.\nOn the website (suntemsam.ro, WordPress):- We built our own plugin around your two widgets, the registration form and the parent profile. - The form: Romanian copy throughout, numbered headings when a parent registers a second child, an age warning when the child does not fit the age range of the class, and the site's own visual design.- The profile: the same design language as the form, a mobile layout for the tabs, copy-to-clipboard buttons for the IBAN and the payment reference, and a few translation fixes.- Both were tested at phone width as well as desktop.\nIn Zooza:- All 14 programmes moved to the Membership price type.- Monthly membership templates active: 545 RON, and 650 RON for the English-language programmes. We also built the annual one, but deliberately left it inactive, since the window for paying the full year has passed.- The previous payment model has been deleted.- Late bookings set to automatic confirmation on all programmes, so the payment schedule is applied without us intervening. We verified this with a real test booking end to end.- Make-up sessions: credits expire 90 days after the entitlement is created; the per-programme limit is left at 0, which your documentation says means \"as many as there are sessions in the class\".- We rewrote 10 email templates in Romanian, keeping your merge tags intact, and added two things that were missing from the parent's point of view: the discount code and the link to the form.- Two invoice profiles exist (a sole trader and a company); the sole trader one is the default.- All test bookings and test classes have been deleted.\nWhat is still open on our side, and which is why we are asking for a call: the three \"(Offline)\" templates we cannot edit, the SmartBill situation above, and the import of roughly 300 children.\n\n9) Could we book a call to finish the setup?I think I have reached the limit of what I can do with Claude, and I need help for the final parts.\n\nWe are at the point where the remaining questions are faster to settle live than by email. Could we book one or two screen-share sessions with someone from your team?\nWhat we would want to go through:- the SmartBill integration- the invoicing question above, until we are sure nothing is issued automatically- which payment templates actually reach parents on bank transfer- a dry run of the client import, together, before we do all 300- a final review of our settings before we open registration: payment schedules, late bookings, make-up sessions, the emails that go out at each step - a walk-through of our zooza setting, plus some form of training, so that we learn to use the system properly.\nPlease let us know what times suit you in the following days, and whether this is included in our plan or something we pay for — either is fine, we just want it done properly.\n\nThank you,Stefan", "cited": []}, {"role": "customer", "who": "Martin Rapavy", "text": "hi Stefan, let's arrange a meeting on Friday morning. Please do send an invite to whatever time suits you best. I have no meetings in the morning:)\n\n\nLooking forward meeting you again:)\n\n\nMartin", "cited": []}, {"role": "customer", "who": "Mădălina Mărcuș", "text": "Hello,\n\n\nCould you please help us with the next steps of the Zooza implementation?\n\n\nAt this point, we are a bit stuck and we are not sure how to proceed.\n\n\nWe are currently working on the document with the data required for the import, and it is about 90% complete.\n\n\nCould you please let us know how we should continue with the implementation from here and what the next steps are?\n\n\nThank you!Stefan", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Sam, from our todo list from the last meeting:\n\n\n\n\n- we deleted the invoice which was created for the wrong invoice system\n\n- we've looked into the VAT sync error - the error was due your second billing profile which instead of CIF uses different identifier: J2025096651000 and thus Smartbill rejected the synchronization\n\n- However the synchronization did work and the VAT levels are correctly synced:\n\n\n\n\nThus based on what we said you're ready to go. The only decision on your end is whether you'll be importing those 300 customers or you let them go through the booking process and this is up to you to make.", "cited": []}], "verdict": "product", "vtitle": "Romanian launch blockers — handled", "vnote": "Michal confirms this was dealt with: the wrongly created invoice deleted, the VAT sync traced to a second billing profile using a non-CIF identifier, and the client cleared to go live. Nothing left for the KB beyond the import decision they still have to make.", "cat": "payments"}, {"channel": "intercom", "id": "215476282141696", "date": "2026-10-07 12:51", "day": "2026-10-07", "human": true, "bucket": "HUMAN", "reask": 2, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": [], "q": "Prosím spojiť s ľudským asistentom", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Prosím spojiť s ľudským asistentom", "cited": []}, {"role" azite dosiahnut? Odstranenie dlznej sumy ako take sa v systeme urobit neda - neviete vymazat transakciu. Co viete dosiahnut je vynulovanie dlznej sumy. To ale bude znamenat, ze zakaznik Vam nema co zaplatit. Z kontextu usudzujem, ze zakaznik mal podlznost a tuto podlznost si vyrovnal - to by indikovalo, ze chcete pridat manualne uhradu aby registracia svietila na zeleno, ze 47 eur bolo uhradenych.", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Ano, presne to potrebujeme dosiahnuť.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ospravedlnujem sa - ktore z toho? Aby registracia svietila na zeleno ako uhradena?", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "áno", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobre, takze to co ste poslali ako screenshot je screenshot zo skupiny. Zostatok na skupine je spocitany zo zostatkov na registraciach v danej skupine. Konkretne v tejto skupine mate iba jednu registraciu - vidno to na tej karte Report. Cize kliknite na cislo 1 v bunke Potvrdena registracia. Zobrazi sa Vam obrazovka Registracie - s odfiltrovanou registraciou z tejto skupiny. Kliknite na tlacitko Pridat Uhradu - system Vam predvyplni chybajucu sumu na uhradu. Stlacite OK a registracia sa tymto uhradi", "cited": []}], "verdict": "gap", "vtitle": "Debt cannot be deleted, only settled", "vnote": "You cannot remove a transaction; you add a payment so the registration shows as paid. The route via the class Report card to the filtered registration and Add payment is worth writing down.", "cat": "payments"}, {"channel": "intercom", "id": "215476281526757", "date": "2026-10-07 12:00", "day": "2026-10-07", "human": false, "bucket": "D_assumed_with_kb", "reask": 1, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Programme Automations | Zooza Help", "Payment options | Zooza Help", "Price and payment setup | Zooza Help"], "q": "can people in the payment plan pay via card for the ohter instalmenrts?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Jochelle Laguipo-Strzalkowska", "text": "can people in the payment plan pay via card for the ohter instalmenrts?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes, Jochelle — clients in a payment plan can pay instalments by card.\n\n\nWhen you set up a payment plan, you choose which payment methods to enable. Card payments (via Stripe) can be enabled alongside other methods like bank transfer or direct debit.\n\n\nIf Stripe is enabled, clients can pay each instalment by card through their client profile — they'll receive payment reminders with a link to complete payment.", "cited": ["Payment options | Zooza Help", "Price and payment setup | Zooza Help", "Programme Automations | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215476266874424", "date": "2026-10-07 11:34", "day": "2026-10-07", "human": true, "bucket": "HUMAN", "reask": 7, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": ["Transfer and copy bookings | Zooza Help", "Client Management FAQ | Zooza Help", "Booking FAQ | Zooza Help", "Transfer and Copy FAQ | Zooza Help", "Getting Help and Support | Zooza Help"], "q": "Poprosím o spojenie s ľudským asistentom.", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Poprosím o spojenie s ľudským asistentom.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I'm connecting you with someone from our team now. Meanwhile, could you please share a bit more about your issue so they can assist you more efficiently?", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Zooza \\ Skupiny", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Na stránke Zooza → Skupiny môžete kontaktovať ľudského asistenta takto:\n\n\n\n\n- Kliknite na tlačidlo ? v ľavom spodnom rohu obrazovky.\n\n- Otvorí sa panel podpory.\n\n- Vyberte Contact support a potom Create a ticket.\n\n- Vyplňte formulár a odoslaťe ho. \n\n\nTip: pridajte screenshot a krátko popíšte, čo ste chceli urobiť a čo sa stalo – tým sa rýchlejšie vyrieši váš problém.\n\n\n\nSource:\nGetting Help and Support | Zooza Help", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer help, or do you still need help from someone?", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Dobrý deň, ako mám presunúť registráciu dieťaťa z krúžku Obratníček na Tanečníček. Ďakujem za postup.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Daniela, registráciu dieťaťa sa presúva cez rezerváciu (booking), nie priamo zo zoznamu klientov. \n\n\nPostup:\n\n\n\n\n- Na stránke Clients → Bookings otvorte rezerváciu dieťaťa.\n\n- V časti Class kliknite na Transfer.\n\n- Vyberte cieľovú Skupinu (napr. Tanečníček).\n\n- Potvrďte presun. \n\n\nRezervácia sa presunie do novej Skupiny a klientský profil ostane rovnaký.", "cited": ["Client Management FAQ | Zooza Help", "Booking FAQ | Zooza Help", "Transfer and Copy FAQ | Zooza Help", "Transfer and copy bookings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak potrebujete s presunom registrácie ešte pomôcť, som vám k dispozícii. Chcete doplniť, s ktorým krokom máte ťažkosti?", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Neviem to urobiť podľa návodu. Poprosím spojiť s ľudským asistentom.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumiem, že situácia môže byť frustrujúca. Hneď vás spojím s naším tímom podpory, ktorý vám pomôže s presunom registrácie.", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Zooza \\ Registrácie \\ 540712 - Lucia Chalmovianska (Dorota Chalmovianska)", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry vecer Daniela, s cim presne mate problem? s ktorym krokom?", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Dobré ráno Martin, poprosila by som o postup v krokoch, podľa nášho systému, pokyny v slovenčine.", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Nájdem si dieťa v skupine Obratníček a potrebujem ho presunúť do skupiny Tanečníček tej istej materskej školy. Ďakujem za pokyny a trpezlivosť.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den pani Ruzickova,\n\n\n\n\n\nna detaile registracie mate tlacidlo Presun.\n\nDostanete sa na obrazovku, ktora vam dovoli vybrat si, kam konkretnu registraciu chcete presuvat alebo kopirovat.\nVyberiete teda kurz a skupinu, kam chcete s registraciou ist, vyberiete moznost presun a stlacite Pokracovat.\nNasledne vyberate, do akeho stavu sa ma registracia dostat a aky je zaciatok registracie v novej skupiny, co ovplyvni dochadzku.\nV tejto istej casti volite, co sa ma udiat s cenou. system Vas upozorni, ak je cena ina ako cena povodnej skupiny a da vam moznost vyberu, s akou cenou chcete pracovat, ci dokonca dovoli uplatnit platobny plan.\nZaroven mate moznost odoslat klientovi potvrdzovaci mail priamo z tejto obrazovky. a stlacite Pokracovat.\nSystem nasledne ukaze zhrnutie, skontrolujete a stlacite pokracovat.\nTymto krokom je presun na konci procesu.\nPrezriet si registraciu v novej skupine mozte stlacenim tlacidla Prejst na registraciu.\n\nOdporucam Vam si spravit testovaciu registraciu a tieto procesy, ktore potrebujete s istotou ovladat si skusat prave na tejto testovacej registracii - system Vam pri mnohych ukonoch ukazuje, ako dalej, prave na zaklade toho, co Vam ponuka alebo sa Vas pyta.\nAk si predtym naneci
