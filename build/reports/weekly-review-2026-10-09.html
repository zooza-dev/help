ict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215476323855442", "date": "2026-10-09 18:36", "day": "2026-10-09", "human": true, "bucket": "HUMAN", "reask": 8, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": ["Getting Started with Zooza | Zooza Help", "Billing and invoicing | Zooza Help", "Price and payment setup | Zooza Help", "Onboarding and Launch FAQ | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Invoicing in Zooza — Overview | Zooza Help", "Set up invoice profiles and bank accounts | Zooza Help", "Share a course or class registration link | Zooza Help"], "q": "how can parents register using the qr code?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "how can parents register using the qr code?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Parents register through a booking link. You can place that link on a QR code (for example on a poster or flyer).\n\n\nHow it works:\n\n\n\n\n- You copy the class or programme booking link from the class page.\n\n\n- You turn that link into a QR code.\n\n- Parents scan the QR code, open the booking page, fill in their details and their child’s details, and submit the booking.\n\nThe QR code simply opens the same booking page that you would normally share by email, WhatsApp, or social media.", "cited": ["Getting Started with Zooza | Zooza Help", "Onboarding and Launch FAQ | Zooza Help", "Share a course or class registration link | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "i think you have an option on the zooza app using a qrcode. am i right?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You are right that QR codes exist in Zooza, but they are not used for parent registration.\n\n\n\n\n- Parents register through a booking link you share (for example on a poster or QR code).\n\n\n- QR codes in Zooza are used for payments, such as bank transfer QR codes on invoices.\n\n\nSo the QR code you might see in the app is for paying invoices, not for parents to register.", "cited": ["Getting Started with Zooza | Zooza Help", "Invoicing in Zooza — Overview | Zooza Help", "Onboarding and Launch FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "where are the settings of the qr codes to pay", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rares, the QR payment code settings are in your invoice profile.\n\n\n\n\n- Go to Settings → Billing & Payments → Invoice profiles. \n\n\n- Open the active profile.\n\n- Fill in IBAN and SWIFT code for the bank account.\n\nThe QR code is generated from these bank details and appears on invoices and payment emails.  \n\n\nIf you use per‑programme billing, you can also check the programme’s Payment tile for the same fields.", "cited": ["Payments and Billing FAQ | Zooza Help", "Set up invoice profiles and bank accounts | Zooza Help", "Billing and invoicing | Zooza Help", "Price and payment setup | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was that helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help with the QR payment settings, I’m here to help. Would you like to share more about what you’re trying to configure?", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "can i speak with the team?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Of course — you’ll be passed to someone. Please briefly describe what you’re trying to configure with the QR payment settings so they have the relevant context upfront.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Rares, what do you mean by settings of QR code?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Or rather - what are you trying to solve?", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "the parents tried to pay from the website using the qr code and they say it only shows the IBAN account so they can pay only using Bank Transfer. Is there a possiibility to pay dirrectly when you scan the qr code?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "That is the way how QR payment work. Essentially scanning QR code pre-fills your bank payment order so that you don't have to fill it by hand", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "The code needs to be scanned by the bank's app not by regular phone camera", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "ok, i understand, thank you so much", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "No worries. Rares if there is a payment method that you would like to implement and it would be in our power to implement it, we can do that. So I don't know if your question was targeting some specific payment method that is using QR codes, please do share that with us and we can try to integrate it into the system. If that would be more convenient than the version of QR codes we're using. The QR codes in Zooza are standard QR codes across European Union but if there is a Romanian payment method that we can use, we can give it a shot", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "I don't know a method specifically. I thought that if you scan the code using the regular phone camera it will send you to a payment section (Netopia, for example in Romania) so you can pay directly", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ah I see. I know about Netopia. We can try looking into it but that is essentially just a shortcut to opening a mobile banking app. The qr code is basically the same conceptually. But thanks for the tip. We'll look into it and if possible integrate it", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "Thank you again", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215476320549058", "date": "2026-10-09 16:26", "day": "2026-10-09", "human": true, "bucket": "HUMAN", "reask": 4, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Registration and Booking FAQ | Zooza Help", "Trial Classes FAQ | Zooza Help", "Booking FAQ | Zooza Help", "Capacity vs extra capacity — who can take which seat | Zooza Help"], "q": "I’m very concerned about some of my sessions. Thursday session has multiple duplicates. So now new people can book a trial session? How is it possible for duplicates on the register?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "I’m very concerned about some of my sessions. Thursday session has multiple duplicates. So now new people can book a trial session? How is it possible for duplicates on the register?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Louis, this usually happens when a parent starts a booking, doesn’t finish payment, and then tries again. The system warns them, but they can still confirm and create a second booking. \n\n\nThat’s why you may see duplicates on the register. The system doesn’t fully block repeat bookings because sometimes a parent genuinely needs to register another child. \n\n\nWhat to do:\n\n\n\n\n- Go to Bookings\n\n\n- Find the duplicate that has no completed payment\n\n\n- Delete that unpaid booking\n\n- Check the child’s name and date of birth to confirm it’s the same person.\n\nAbout new people booking trials: yes — if the class still has available capacity, multiple families can book the same trial session. \n\n\nIf you want, I can also explain a couple of ways providers usually reduce duplicate bookings.", "cited": ["Registration and Booking FAQ | Zooza Help", "Booking FAQ | Zooza Help", "Capacity vs extra capacity — who can take which seat | Zooza Help", "Trial Classes FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I’m sorry again for the concern this situation caused, and I’m here if you need further help with the duplicate sessions or trial bookings. Would you like to share more about what you’re trying to resolve?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Louis, what do you mean by duplicates?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "You mean people having more than one booking?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Like this, for example?https://uk.zooza.app/#registrations?user_id=1082&billing_period_id=83&order_by=created_desc&page=0&page_size=20&person_id=0&payment_id=0&segment_id=0&schedule_id=0", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Yes. I think I have removed duplicates from the Thursday session now to clear space. But I’m sure we probably have more.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ok so for example that customer Ethan Healy - has four bookings none of which is duplicate. He did create two trial bookings for his two sons. Both have converted to full bookings making total of four bookings. So none of those is a duplicate and they do not block any further bookings apart from the capacity of 2 that they fill in (each child takes one seat)", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "There is nothing to worry about or there is no need to clean up the trial ended/ trial won / trial lost bookings - they don't count toward the class' capacity. they are there for you and for the reporting such as this: https://uk.zooza.app/#reports/trials deleting trial bookings would tamper that report for example", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "So we had duplicates on the Thursday session. Which wouldn’t allow anyone else to book. I’ve cleared the duplicates so now we have 3 spaces available.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Do you remember which bookings those were? Or rather in general - there is nothing stopping parents from booking multiple bookings - that example of mr. Healy is a good showcase - should we block multiple bookings - he would not be able to book his two sons. So what I'm trying to get at is whether those were genuine duplicates or perhaps abandoned trial registrations or something completely else", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Thanks Louis, I'll look into it. Adam Hussain for sure looks like legitimate duplicate, but mr cohen used three different emails so that was not duplicate but rather he was trying to do something but probably either entered wrong email ramicohenrc@gmail.com vs ramicohenrc@googlemail.com and ultimately ended up booking with email Hayleyjanelyttel@gmail.com", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "But we'll look closely on the first case to see if this could be prevented", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "That’s great thank you. Question is it possible to instead of saying no session available. Saying sold out and join the waiting list so we can collect info from keen families?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "For sure, if you allow waitlist on the programme settings than that is available option. You currently have it explicitly enabled to hide the class if it is full: https://uk.zooza.app/#courses/229/settings?edit=online_registration. It is toggled off by default", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215476324039244", "date": "2026-10-09 16:25", "day": "2026-10-09", "human": false, "bucket": "D_assumed_with_kb", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Dobrý deň pani Dolinkova,\n\n\n \n\n\nĎakujem za vysvetlenie.\n\n\nSamozrejme, uhradím túto platbu. Fakturačné údaje sú rovnaké ako na dúbravku. \n\n\n \n\n\nPekný víkend želám.\n\n\n \n\n\nS pozdravom\n\n\n \n\n\nMgr. Zuzana Ryšavá Daneková | Manager vyučovacieho centra pre deti\n\n\nCabanova 13/a, Bratislava, 841 02| Tel.: +421(0)902 687 423| \n\n\nE-mail: ba4@helendoron.sk| \n\n\n\n\n\nA world of educational excellence, enjoyment, creativity and knowledge\n\n\nKangi Club | Helen Doron Radio | HDE Google Play | HDE App Store |", "turns": [{"role": "customer", "who": "Zuzana Daneková", "text": "Dobrý deň pani Dolinkova,\n\n\n \n\n\nĎakujem za vysvetlenie.\n\n\nSamozrejme, uhradím túto platbu. Fakturačné údaje sú rovnaké ako na dúbravku. \n\n\n \n\n\nPekný víkend želám.\n\n\n \n\n\nS pozdravom\n\n\n \n\n\nMgr. Zuzana Ryšavá Daneková | Manager vyučovacieho centra pre deti\n\n\nCabanova 13/a, Bratislava, 841 02| Tel.: +421(0)902 687 423| \n\n\nE-mail: ba4@helendoron.sk| \n\n\n\n\n\nA world of educational excellence, enjoyment, creativity and knowledge\n\n\nKangi Club | Helen Doron Radio | HDE Google Play | HDE App Store |", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215476322407079", "date": "2026-10-09 14:40", "day": "2026-10-09", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "confirmed_resolution", "rating": null, "carried": null, "sources": ["Classes List | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Where to find things in Zooza — quick reference | Zooza Help"], "q": "Dobrý den, kde prosím najdu archivované skupiny?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": "Lada Šulcová", "text": "Dobrý den, kde prosím najdu archivované skupiny?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Lado, archivované skupiny (Classes) najdete takto:\n\n\n\n\n- Přejděte do Activities → Classes (Skupiny)\n\n\n- V horním filtru nastavte Status na Archived\n\n\nUvidíte všechny archivované skupiny ze všech programů. Jsou skryté z aktivního seznamu, ale jejich lekce, rezervace a historie plateb zůstávají zachovány.", "cited": ["Programmes, Timetables and Sessions FAQ | Zooza Help", "Classes List | Zooza Help", "Where to find things in Zooza — quick reference | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Je to to, co hledáte?", "cited": []}, {"role": "customer", "who": "Lada Šulcová", "text": "Ano, děkuji!", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rád jsem vám pomohl! Pokud budete mít ještě nějaké dotazy, jsem zde pro vás. 😊", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215476045907554", "date": "2026-10-09 14:31", "day": "2026-10-09", "human": true, "bucket": "HUMAN", "reask": 9, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "2 otazky\n\nDobrý deň,\n\nMal by som 2 otázky:\n\n1. klienti krotí sa prihlásia na skušobnú hodinu, potom sa z nej odhlásia, tak sa nevedia naspäť prihlásiť na skušobnú hodinu, stao sa to už viac krát, ako sa to dá prosím upraviť aby to boo možné?\n\n2.Ak sa klient prihlási na čakaciu listinu na náhradnú hodinu , a následne to admin manuálne potvrdí - tak klient ktorý bol nahlásený na čakaciu listinu nedostane žiadnu notifikáciu o tom, že bol nahlásený na náhradný termín. ( potvrdil som z dôvodu, že v danej skupine sú disciplinované deti a bolo ok aj keď bola skupina cez kapacitu). \n\nďakujem pekne za odpoveď\n\nS pozdravom \n\nMichal Kiss", "turns": [{"role": "customer", "who": null, "text": "2 otazky\n\nDobrý deň,\n\nMal by som 2 otázky:\n\n1. klienti krotí sa prihlásia na skušobnú hodinu, potom sa z nej odhlásia, tak sa nevedia naspäť prihlásiť na skušobnú hodinu, stao sa to už viac krát, ako sa to dá prosím upraviť aby to boo možné?\n\n2.Ak sa klient prihlási na čakaciu listinu na náhradnú hodinu , a následne to admin manuálne potvrdí - tak klient ktorý bol nahlásený na čakaciu listinu nedostane žiadnu notifikáciu o tom, že bol nahlásený na náhradný termín. ( potvrdil som z dôvodu, že v danej skupine sú disciplinované deti a bolo ok aj keď bola skupina cez kapacitu). \n\nďakujem pekne za odpoveď\n\nS pozdravom \n\nMichal Kiss", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Vážený Michal,\n\n\nváš tiket byl přijat. Asistent Zooza se vám pokusí ihned pomoci — a člen našeho týmu jej také osobně zkontroluje.\n\n\n— Podpora Zooza", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Michal, V prvom pripade asi by bolo fajn ak viete poslat nejaky priklad zakaznika, ktory sa odhlasil a snazil sa prihlasit na nahradnu hodinu. Uplne idealne aj s nejakym casom, kedy to priblizne skusal (aspon priblizne). Vo vseobecnosti pokial sa zakaznik odhlasi z hodiny system by mu mal priznat nahradnu hodinu rovnako ako beznemu ucastnikovi a tu nahradnu hodinu by si mal byt schopny vybrat. Co sa druhej otazky tyka - ano takato notifikacia neexistuje, mame ju v backlogu, ale momentalne existuje iba notifikacia o prihlaseni na dodatocnu hodinu ale nie na nahradnu.", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "Je to tak, že nikomu kto je prihlásený na skušobnú hodinu z ktorej sa odhlási, sa následne nedá prihlásiť späť na skušobnú. Jede taký prípad čo si pamätám čerstvo zo včera je Nina Kaiserová. Ale ako vravím nikto, kto sa odhási zo skušobnej už následne nejde prihlásiť späť.\nTen druhý prípad ako funguje v prípade že sú na čakacej listine a uvoľní sa miesto? automaticky ich to prihlási na hodinu alebo ?", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobrý deň, pán Kiss,\n\n\n\n\n\npozreli sme sa na registráciu Niny Kaiserovej (skúšobná hodina v skupine Motýle) aj na jej profil.\n\n\n\n\n\nČo sa stalo:\n21.9. o 15:05 sa pani Erika Kaiserová cez svoj profil odhlásila z termínu 22.9. Keďže to stihla v rámci limitu na odhlásenie, systém jej automaticky vytvoril náhradnú hodinu (kredit platný do 5.11.2026). O pár minút neskôr ste Ninu v dochádzke prihlásili cez „Prihlásiť na termín\" na 29.9. Tým vznikla nová, bežná účasť. Náhradná hodina však zostala nevyužitá a klientka ju má stále k dispozícii.\n\n\nVýsledok je, že za jeden odhlásený termín má klientka teraz dva: prihlásenie na 29.9. aj voľnú náhradnú hodinu.\n\n\n\n\n\nAko to riešiť nabudúce:\nKeď sa klient zo skúšobnej hodiny v limite odhlási, termín mu ručne nepridávajte. Nechajte ho, aby si cez svoj profil sám vybral náhradnú hodinu, ktorá mu za odhlásený termín vznikla. Náhrada sa tak naviaže na pôvodný termín a kredit sa spotrebuje.\n​\n\n\nČo s touto registráciou teraz:\nAby mala klientka len jednu hodinu, máte dve možnosti:\n\n\n\n\n- \nNechať prihlásenie na 29.9. a vymazať (deaktivovať) jej nevyužitú náhradnú hodinu, alebo\n\n- \nZrušiť prihlásenie na 29.9. a nechať pani Kaiserovú, aby si sama vybrala termín cez náhradnú hodinu.\n\n\n\n\nS pozdravom,\nZooza tim", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Čo sa týka registrácií, ktoré sú na čakacej listine - v prípade, že sa uvoľní miesto na termíne, na ktorý čaká viač čakateľov, každý z nich obdrží email s informáciou, že v danom termíne sa uvoľnili miesto a ak majú záujem, môžu sa cez priložený link na termín prihlásiť.\n\n\nV tomto prípade platí - kto skôr príde, ten skôr melie.\n\nPrihlasovanie sa nedeje automaticky, kliet to musí spraviť vedome \n\n\n\n\n\npekný deň\n\n\nZooza tím", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "Ide o to, že žiadny z klientov keď sa odhlási zo skušobnej hodiny, nemá vo svojom profile na výber náhradnu hodinu. Raz som sa prihlásil cez klientov profil a videl som že tam reálne ta možnosť nie je. Ako píšem, stalo sa to pri veľa klientoch, alebo to nikto z nich nevie používať vrátane mňa a tým pádom to nie je user friendly . Pamätám si, ako to napísalo, že na výber nie je žiaden z voľných termínov. Aj tak si ale vytvorím skušobnú hodinu testovacím profilom a následne sa skúsim odhlásiť či to dunguje alebo nie. \n\n\nĎakujem", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "Vytvoril som si skusobnu hodinu , oshlasil som sa z nej a následne som dostal možnosť sa prihlásiť iba na tú náhradnú hodinu, z ktorej som bol odhlásený.", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "543347 - Michal Kiss (marcel kiss)", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "novo vytvoreny testovaci profil", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "dobrý deň, mohli by ste sa prosím na to pozriet? dakujem", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Preštudovať, čo chce a ako to riešiť.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, pan Kiss, dakujeme za trpezlivost, bolo potrebne to trochu rozobrat aj s timom.\n\n\n\n\n\n1. Odhlásenie zo skúšobnej hodiny\nKeď sa klient odhlási zo skúšobnej hodiny a na programe máte povolené náhradné hodiny, systém mu automaticky vytvorí kredit na náhradu — vo svojom profile si potom vie vybrať iný termín. Toto je cesta, ktorou sa má na skúšobnú hodinu vrátiť a funguje to.\n\n\nČo zatiaľ nejde: prihlásiť sa znova cez prihlasovací formulár na skúšobnú hodinu v tej istej skupine. Systém takú registráciu odmietne, pretože pôvodná skúšobná registrácia stále beží (odhlásenie z termínu ju neruší) ,preto tá hláška, že skúšobnú hodinu už má rezervovanú. Ak chcete klienta vrátiť cez formulár, treba pôvodnú skúšobnú registráciu najprv zrušiť/uzavrieť v administrácii; inak stačí, aby si klient vybral náhradný termín z kreditu.\n\n\n\n\n\n2. Čakacia listina na náhradnú hodinu\nPotvrdili ste to správne. Momentálne však platí, že keď klienta z čakacej listiny potvrdíte manuálne (napr. nad rámec kapacity), systém mu o tom neposiela žiadnu notifikáciu , informáciu treba zatiaľ poslať ručne. Klient dostane len bežnú pripomienku deň pred hodinou, ak ju máte na programe zapnutú.\n\n\nToto je zaujimavá vec na doriešenie , zapisujeme to ako požiadavku na vývoj, aby mohli dostat klienti potvrdenie o priradeni do terminu automaticky alebo volbou adminom.\n\n\nS pozdravom", "cited": []}, {"role": "human", "who": "Tech Support", "text": "https://zooza.atlassian.net/browse/ZOOZA-4933", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "Dobrý deň,\n\nopäť som sa skúsil prihlásiť na náhradnú hodinu vytvorenú zo skúšobnej hodiny a nešlo mi to . Prikladám vám k tomu screenshoty postupu, otvril som svoj profil-> vsetci clenovia -> Benefity - Náhradky 1 -> Veveričky Dostupná náhradka do 7.11. -> Momentálne nie sú k dispozícii žiadne náhradné hodiny .  Takže ak som postupoval správne, tak to nefunguje tak tko popisujete", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, pan Kiss, to by ale znamenalo, ze system nevidi terminy, ktore moze ponuknut, da sa v systeme skontrolovat preco to tak je. Bud su plne skupiny, alebo je to nastavenim nahradnych hodin. Da sa to skontrolovat cez system MATKO, https://uk.zooza.app/#settings/matko kde zadate cislo kreditu (najdete v detaile klienta a vyberiete termin, ktory si myslite, ze by sa mal ponuknut. Pripadne napiste termin, radi pozrieme za vas.", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "dobrý deň, nepodarilo sa mi cez vami poslany link prihlasit . vypisuje to neznamu chybu, vsimol som si cervenu bublinu v strede dole. Mám ďalší prípad a tým je Zoran Sladkovič ktorý sa odhlásil zo skúšobnej hodiny a potom sa mu nedalo prihlásiť na žiadnu \"náhradnú skušobú\" , tak sito ako ten moj testovací profil. skúste sa aj vy prihlásiť do foxgym na skušobnú hodinu, následne sa odhlásť a skúste pozrieť či sa vám zobrazia nejaké termíny. Mne to proste nefunguje zjavne tak ako má.\n525192 - Zoran Sladkovic (Zoran Sladkovic) - je ID ďalšieho klienta, ktorému to nefungovalo.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Kolega Vam omylom poslal link na verziu zoozy urcenu pre britsky trh:/ spravna adresa je https://zooza.app/#settings/matko. \n\n\nCo sa tyka pana Sladkovica - ten nie je odhlaseny. Nie som si teda isty, ci ste poslali nespravnu registraciu, alebo kde mal klient problem - v systeme pod tymto emailom ma iba jednu registraciu.", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "Dobrý deň,\nDnes som mal mat klienta na skušobnu hodinu, no nestihali to. Postup bol nasledovný- odhlásil som ho zo skusobnej hodiny a chcel prihlásiť na náhradný termín. No žiaĺ ako aj pri iných mi neukazjue náhradný termín. Posielam screenshoty dôkazu, že mi nenašlo žiaden termín.\nSpustil som tu diagnostiku- uakzovalo 1 bod chybný z 19 bodov.\nneviem čo to znamená, ale viem, že prihlásený na náhradný termín vo finále nie je.\nĎakujem", "cited": []}], "verdict": "gap", "vtitle": "Re-booking a trial is refused while the original trial registration is still open", "vnote": "Confirms and sharpens what we shipped on 3 October. Cancelling out of a trial session does not close the trial registration, so the booking form refuses a second trial in the same class — the credit route is the intended way back. Also confirmed: manually confirming someone off the make-up waiting list sends them nothing (ZOOZA-4933 raised). And a warning worth writing: if an admin manually adds the session back after a client cancels in time, the client ends up with both the session and an unused credit.", "cat": "trials"}, {"channel": "intercom", "id": "215476295632706", "date": "2026-10-09 12:53", "day": "2026-10-09", "human": true, "bucket": "HUMAN", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Revenue Reporting & Network Login\n\nHi,\n\nJust a couple of things I wanted to clarify.\n\nFor the previous calendar month, Zooza is reporting total revenue of £828.00.\n\nI’ve attached the actual GoCardless payments received into my bank account, including the September payments and a payment that arrived in October.\n\nCould you help me understand how Zooza arrives at the £828.00 figure?\n\nIs this related to the difference between the scheduled payment date and the date the payment is actually collected/paid out? For example, does Zooza include any payments scheduled and confirmed during September as September revenue, even if the money isn’t actually received until October?\n\nIt would just be useful for me to understand exactly how the reporting works so I can reconcile the Zooza figures against the money actually coming into the business each month.\n\nAlso, regarding the Zooza account/login used for network reporting, would it be possible to set this to info@weekicks.co.uk so the relevant Head Office team can all access the network-level reporting from the same account?\n\nThanks!", "turns": [{"role": "customer", "who": null, "text": "Revenue Reporting & Network Login\n\nHi,\n\nJust a couple of things I wanted to clarify.\n\nFor the previous calendar month, Zooza is reporting total revenue of £828.00.\n\nI’ve attached the actual GoCardless payments received into my bank account, including the September payments and a payment that arrived in October.\n\nCould you help me understand how Zooza arrives at the £828.00 figure?\n\nIs this related to the difference between the scheduled payment date and the date the payment is actually collected/paid out? For example, does Zooza include any payments scheduled and confirmed during September as September revenue, even if the money isn’t actually received until October?\n\nIt would just be useful for me to understand exactly how the stavenie. Len si to teda premyslite, ze ci ide vyslovene o problem typu, ze nechcete aby lektor videl poznamky ineho lektora, respektive poznamky z ineho kurzu, alebo je to len o prehladnosti - ze prioritne by mal vidiet poznamky z aktualneho kurzu ale mal by byt schopny dohladat vsetky poznamky a vieme potom bud upravit to rozhranie v tomto zmysle, alebo pridat nove nastavenie", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215476136244794", "date": "2026-10-09 10:52", "day": "2026-10-09", "human": true, "bucket": "HUMAN", "reask": 7, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": ["API overview | Zooza Developer Docs", "Authentication | Zooza Developer Docs", "Quickstart | Zooza Developer Docs"], "q": "what is the Zooza Company ID for API use", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Wie kann ich helfen?", "cited": []}, {"role": "customer", "who": "API Connect", "text": "what is the Zooza Company ID for API use", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "There isn’t a single fixed Company ID you can look up in advance.\n\n\nYou retrieve it via the API:\n\n\n\n\n- First get a token via POST /v1/login\n\n\n- Then call GET /v1/user\n\n\n- In the response, look at data.user.companies\n\n\n- Use the id of the company you want as the value for the X-ZOOZA-COMPANY header in all requests. \n\n\nExample: if a company in that list has id: 65, you send:\n\n\nX-ZOOZA-COMPANY: 65", "cited": ["Authentication | Zooza Developer Docs", "Quickstart | Zooza Developer Docs", "API overview | Zooza Developer Docs"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "API Connect", "text": "what is our company ID", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I can’t see your account data, so I’m not able to tell you the exact company ID.\n\n\nYou can retrieve it via the API:\n\n\n\n\n- First get a token via POST /v1/login\n\n\n- Then call GET /v1/user\n\n\n- In the response, look at data.user.companies\n\n\n- The id of the company you want is the value for the X-ZOOZA-COMPANY header in your requests. \n\n\nExample: if a company in that list has id: 65, you send X-ZOOZA-COMPANY: 65.", "cited": ["Authentication | Zooza Developer Docs", "Quickstart | Zooza Developer Docs"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help finding your company ID, I’m here to help. Would you like to share more about where you’re getting stuck?", "cited": []}, {"role": "customer", "who": "API Connect", "text": "Please contact the support team to tell me the company ID. Thanks.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I will connect you with someone from our team shortly. Meanwhile, could you please provide any additional details about your request to help them assist you more efficiently?", "cited": []}, {"role": "customer", "who": "API Connect", "text": "I need: X-ZOOZA-COMPANY", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I’m not able to see your account data, so I can’t tell you the exact value for X-ZOOZA-COMPANY. \n\n\nYou can retrieve it via the API:\n\n\n\n\n- First get a token via POST /v1/login\n\n\n- Then call GET /v1/user\n\n\n- In the response, look at data.user.companies\n\n\n- Use the id of the company you want as the value for X-ZOOZA-COMPANY in your requests. \n\n\nExample: if a company in that list has id: 65, you send:\n\n\nX-ZOOZA-COMPANY: 65", "cited": ["Authentication | Zooza Developer Docs", "Quickstart | Zooza Developer Docs", "API overview | Zooza Developer Docs"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer help, or do you still need help from someone?", "cited": []}, {"role": "customer", "who": "API Connect", "text": "I don't want API - I want a person to tell me the number - that should not be that difficult. Thanks.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I understand your preference to speak with a person, and I’m passing your request to our team now. They will be able to assist you further with the company ID.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Martin, you will need to perform successful login to find out the company ID. Actually the AI's answer was correct. After you'll obtain a token, you'll be able to query GET/v1/user which contains list of all companies along with their IDs to which that user has rights. I could tell you the exact number but you'll need to perform successful login anyways so calling the GET/v1/user along with the token is a good hello world excercise.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Your company ID is 548, but as I mentioned without obtaining the user token this will be useless to you:/ and with the token you'll be able to read this information", "cited": []}, {"role": "customer", "who": "API Connect", "text": "ok, we are trying to figure it out. on it at the moment ...", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "🤞", "cited": []}, {"role": "customer", "who": "API Connect", "text": "Hi Martin, quick (hopefully last question 🙈) - fetching the registrations works, but when I export registrations to excel then payment data (IBAN, etc) is included. However via API this data is not there. What API request do we need to pull that data as well?\n\nAnd of course we want to push back Kangi Credentials to Zooza, so that parents can see it in the back office. \n\nin the words from the AI agent:\n​\n\n\nHi Martin, thanks a lot – login, registration list (with advanced_search=1) and single registrations work now. Two last questions: (1) IBAN, account holder and SEPA mandate (reference and date) are not in the registration list – which endpoint returns them? (2) Could you please revoke the API tokens of zooza-api-linz@helendoron.at issued on 5 October? One was visible in a screenshot; our workflow logs in fresh on every run. Thanks!\n\n\n\nBest wishes from Austria, Martin", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Yes, you'll need to fetch direct debit mandates directly via dedicated endpoint. I suggest caching both resources on your end and doing the mapping in database rather than fetching the registrations list and then iterate over each registration's id:\ncurl -X GET \"https://api.zooza.app/v1/direct_debit_mandates?page=0&page_size=100\" \\\n\n\n-H \"X-ZOOZA-API-KEY: \u003cYOUR_API_KEY>\" \\\n\n\n-H \"X-ZOOZA-TOKEN: \u003cYOUR_ACCESS_TOKEN>\" \\\n\n\n-H \"X-ZOOZA-COMPANY: \u003cYOUR_COMPANY_ID>\" \\\n\n\n-H \"Accept: application/json\"\n\n\n\n\n\nNotes for the consumer:\n\n\n- Paging: the list comes back one page at a time, and the first page is page=0. Keep increasing page (0, 1, 2 …) until a page comes back with fewer rows than page_size. If you leave out page_size, each page holds at most 50 rows, so a single call without paging won't return everything.\n\n\n- Optional filters:\n\n\n- search=\u003ctext> searches by payer or customer name.\n\n\n- order_id=\u003cid>&order_type=course limits the list to the mandates of one booking.\n\n\n- offline_collection=collecting|not_collecting and needs_attention=true filter by collection status.\n\n\n- One mandate: GET https://api.zooza.app/v1/direct_debit_mandates/\u003cmandate_id>\n\n\n\n\n\nOrder_id = registrations.id so to fetch a registration's direct debit mandate you'd send order_id=123&order_type=course\n\nNow for the Kangi credentials, if you store them in the public note then the request would look like this:\ncurl -X PUT \"https://api.zooza.app/v1/registrations/\u003cREGISTRATION_ID>\" \\\n\n\n-H \"X-ZOOZA-API-KEY: \u003cYOUR_API_KEY>\" \\\n\n\n-H \"X-ZOOZA-TOKEN: \u003cYOUR_ACCESS_TOKEN>\" \\\n\n\n-H \"X-ZOOZA-COMPANY: \u003cYOUR_COMPANY_ID>\" \\\n\n\n-H erioada pe care o acoperă factura\n\n- \nInvoice date – data facturii\n\n- \nPayment method – metoda de plată\n\n- \nItem description – textul de pe factură\n\nAceste modificări se fac din detalierea înregistrării → Payments → secțiunea de facturi → iconița cu creionul.\n\n\nNotă: editarea facturii schimbă doar documentul, nu suma plătită.", "cited": ["Billing and invoicing | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "A fost de ajutor?", "cited": []}, {"role": "customer", "who": "Dan Teodorescu", "text": "Nu, n-a fost de ajutor.Vreau , de exemplu, daca cursurile incep de pe 09.10.2026 - de atunci sa se factureze, nu de la inceputul programului", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Da — pentru a factura doar de la data reală de start a clientului, trebuie să setați o start date la nivelul rezervării (booking).\n\n\nPe Bookings list → deschideți rezervarea → Set Up Payments:\n\n\n\n\n- Setări Start date la 09.10.2026\n\n\n- Clientul va vedea și plăti doar sesiunile de la această dată\n\n\n- Sesiunile anterioare vor fi ascunse și nu vor fi incluse în preț. \n\n\nAcest lucru permite chiar și înregistrarea înainte, dar plata începe doar de la data pe care clientul începe efectiv.", "cited": ["Bookings | Zooza Help", "Let clients register now and start later | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "A fost util acest răspuns?", "cited": []}, {"role": "customer", "who": "Dan Teodorescu", "text": "da, mai, dar payment planul se calculeaza aiurea", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Da — așa este și comportamentul curent. \n\n\n\n\n- \nPayment plan-ul începe de la data de înregistrare a clientului, nu de la data reală de start a clasei.\n\n- Astfel, chiar dacă clientul începe pe 09.10.2026, planul de plată poate începe mai devreme.\n\nCe puteți face:\n\n\n\n\n- Deschideți Booking → Payment plan\n\n\n- Editați manual due dates la fiecare n\nUn program poate avea sesiuni la zile diferite și la ore diferite.\n\n\nCum se face:\n\n\n\n\n- Deschideți Classes → deschideți clasa → tabul Sessions\n\n\n- Apăsați Add sessions\n\n\n- Folosiți Advanced setup\n\n\n- Introduceți fiecare zi cu ora corespunzătoare (ex. luni 10:00, miercuri 16:00) \n\n\nZooza permite să creați fiecare zi separat și să setați ora și durata pentru fiecare sesiune.\n\n\nAstfel, chiar dacă zilele sunt diferite, ele pot avea și ore diferite în același program.", "cited": ["Managing sessions in a class | Zooza Help", "Getting Started with Zooza | Zooza Help", "Creating a class | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "A fost util acest răspuns?", "cited": []}, {"role": "customer", "who": "Dan Teodorescu", "text": "dar vreau sa le setez de la inceput...nu sa intru pe fiecare zi", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dan, nu — nu există un ecran unde să introduceți mai multe zile cu ore diferite la început.\n\n\nCum funcționează acum:\n\n\n\n\n- Când creați sesiunile, trebuie să faceți o zi la un timp (ex. luni 10:00, apoi miercuri 16:00). \n\n\n- Pentru fiecare zi setați prima sesiune + data de sfârșit sau numărul de sesiuni.\n\nExcepție:\n\n\n\n\n- Dacă folosiți Simple Setup la crearea clasei, puteți selecta mai multe zile (ex. luni și miercuri), dar ora trebuie să fie aceeași pentru toate. \n\n\nAstfel:\n\n\n\n\n- zile diferite → trebuie să le faceți separat\n\n- ore diferite → trebuie să le faceți separat\n\n- nu există un singur pas pentru ambele împreună.", "cited": ["Managing sessions in a class | Zooza Help", "Creating a class | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Asta căutați?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Îmi pare rău din nou pentru frustrarea creată; sunt aici să vă ajut în continuare dacă mai aveți nevoie. Doriți să îmi spuneți ce anume doriți să configurați pentru zilele și orele diferite?", "cited": []}, {"role": "customer", "who": "Dan Teodorescu", "text": "cum pot sterge o clasa?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dan, puteți șterge o clasă așa:\n\n\n\n\n- Deschideți Programme și apoi clasa pe care doriți să o ștergeți.\n\n- Pe pagina clasei, mergeți la settings.\n\n- În partea dreapta, jos, găsiți secțiunea Delete.\n\n- Apăsați Delete. \n\n\nNotă importantă:\n\n\n\n\n- O clasă cu rezervări active nu poate fi ștearsă. Trebuie să mutați rezervările în altă clasă înainte. \n\n\nȘtergerea este soft delete: clasa merge în Settings → Tools → Trash și poate fi restaurată timp de 30 de zile.", "cited": ["Archive or delete a Programme | Zooza Help", "FAQ — Programmes | Zooza Help", "Class Detail | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "A fost de ajutor?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Îmi pare rău din nou pentru frustrarea creată; sunt aici să vă ajut în continuare dacă aveți nevoie de clarificări despre ștergerea clasei. Doriți să îmi spuneți unde întâmpinați dificultăți?", "cited": []}, {"role": "customer", "who": "Dan Teodorescu", "text": "unde sunt termenii si conditiile?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dan, termenii și condițiile se găsesc aici:\n\n\n\n\n- Settings → General → Consents & Agreements\n\nAcolo puteți:\n\n\n\n\n- crea un consent pentru „Termeni și condiții”\n\n- scrie textul complet\n\n- sau adăuga un link către pagina cu termenii de pe site-ul dvs. \n\n\nAcest consent apare apoi în formularul de înregistrare, iar acceptarea clienților este salvată cu data și versiunea.", "cited": ["Consents and agreements (GTC, GDPR) | Zooza Help", "Consents and Agreements FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Asta căutați?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dacă mai aveți nevoie de ajutor cu termenii și condițiile sau cu o altă setare, sunt aici să vă ajut. Doriți să îmi spuneți ce anume încercați să a Support", "text": "Mikuláš, odpovede na emaily z Zooza chodia do Zooza, nie do vášho mailového klienta. Systém ich zhromažďuje vo vašej Zooza schránke. \n\n\nAby ste ich videli aj v emaile:\n\n\n\n\n- Zapnite notifikáciu New email reply from client\n\n\n- Cesta: Settings → Other → Notification center\n\n\n- Pridajte svoj email (napr. futureengineers@youngengineers.sk) \n\n\nTýmto vám Zooza pošle upozornenie na každú odpoveď klienta.\n\n\nZmena odosielateľského emailu na „NOREPLY“ alebo kopírovanie odpovedí do vášho mailu není v štandardnom nastavení podporovaná.", "cited": ["Email and Communication FAQ | Zooza Help", "Settings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Hledali jste tohle?", "cited": []}, {"role": "customer", "who": "Mikuláš Fedor", "text": "je to tale naprd, lebo ked chcem odpovedat, nedrzi to Mail string, cize klientovi nasledne uchadza kontext a aj mne", "cited": []}, {"role": "customer", "who": "Mikuláš Fedor", "text": "nehladal som toto, dajte to na cloveka", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumiem, že chcete prepojiti s človekom. Předám váš požadavek někomu z našeho týmu; prosím stručně doplňte, s čím konkrétně potřebujete pomoci, aby měl všechny potřebné informace.", "cited": []}, {"role": "customer", "who": "Mikuláš Fedor", "text": "ja o ziadnom takom platenom doplnku neviem a nikto mi o nom nepovedal zatia", "cited": []}, {"role": "customer", "who": "Mikuláš Fedor", "text": "nech sa somnou dakto spoji, lebo to, ako to je aktualne a tiez za to platim a nie malo, je to nanic co sa tyka manazmentu mailov", "cited": []}, {"role": "customer", "who": "Mikuláš Fedor", "text": "a to je jedna z hlavnych funkcionalit, preco zoozu mam", "cited": []}, {"role": "customer", "who": "Mikuláš Fedor", "text": "poslite na cloveka, vsetko je napisane hore", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den, nie som si uplne isty ci rozumiem co presne sa pytate. Na otazku, preco system neodosiela emaily z Vasej emailovej adresy sme odpovedali - Zooza posiela emaily z dvoch emailovych adries a to reply@zooza.app alebo no-reply@zooza.app. Nemozeme odosielat emaily z Vasej emailovej adresy, pretoze k nej nemame pristup a takyto pristup by sice teoreticky bolo mozne zriadit, ale museli by ste potom kompletne vsetky emaily presmerovat na Zoozu a to predpokladam nechcete. To, ze odosielame emaily ako system je zaroven pre Vas vyhoda, pretoze za Vas riesime dorucitelnost emailov - napriklad zabezpecujeme to, aby emaily nekoncili v spame a aby boli dorucovane prioritne. Starame sa o emailovu infrastrukturu a ked je to potrebne riesime konkretne scenare, ako napriklad nedavno, ked sluzba Azet odmietala prijimat emaily.\n\n\nSkusite teda opisat, co presne by ste chceli zmenit? Respektive co Vam nevyhovuje?\n\n\nDakujem", "cited": []}, {"role": "customer", "who": "Mikuláš Fedor", "text": "Pisem, ze nemate to z nej odosielat, ale ma byt aspon uvedena ako CC, aby ked odpisu, som nasledne vedel z nej odpisovat a v CC bude pre zmenu Zooza a tak sa cela konverzacia zapise jednak u mna ako aj v Zooze. Je to tak uplne bezne v ticketovacich systemoch-rovnako tom mam vo VUB, kde robim. Mozem si s IT pisat ako v systeme priamo,tak cez bezny mail, ktory tam mam uvedeny. Oni takisto. \n\n\nToto je hadam jasne. \n\n\nDalsi point bol, preco pouzivate okrem NoReply aj tu Reply-lebo nechcem aby odpovedali ani na jednu, kedze im neviem odpovedat spat normalne tak, aby to neodseklo historiu stringu v tom systeme. Prerdstavte sim na ako majitela a usera, ktory vacsinu tych mailov riesi za pochodu na mobile. Nemam cas sa stale preklikavat do appky a potom riesit, ze vlastne neviem o com bola rec po 2 vymenach, lebo historia konverzacie tam neni v poslednom maile….\n\n\nTeda easy fix je data ko CC do kazdeho odoslaneho mailu moju ale aj ICH emailovu adresu, lebo ked mi dojde mail a idem nan odpovedat, tak aktualne ked dam Reply v outlooku, tak odpovedam na zooza.sk a teda nikam.stale musim najst ich email v zooze, skopirovat a poslat tak, je to super neefektivne.\n\n\nMikuláš Fedor\n\n\nTrainer & Franchisee\n\n\nwww.mladiinzinieri.sk\nTel: +421 950 446 110\n\n\nEmail: futureengineers@youngengineers.sk", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Asi sa nerozumieme, nie je mozne odosielat email z emailovej adresy ktora nie je overena DKIM a DMARC zaznamami. A Vasa adresa tieto zaznamy overene nema. Nie je preto mozne aby zooza posielala emaily vo Vasom mene. Zaroven tak ako vravim - ak zacnete z Vasej emailovej adresy posielat desiatky az stovky emailov za tyzden - ranne pripomienky, upomienky - vsetky skoncia v spame. To aby nase spravy nekoncili v spame je jedna z veci, za ktoru si platite. Pravidelne cistime nase adresy z roznych blockerov a spamlistov aby bola dorucitelnost nasich sprav co najvyssia.\n\n\nCize to co pozadujete nie je easy fix. Znamenalo by to vybudovat si uplne novu infrastrukturu len na rozosielanie emailov z emailov nasich klientov a cely tim ludi, ktori budu zabezpecovat ich dorucitelnost. Keby bola Zooza ticketovaci system, mozno by sme do toho sli, ale my sme system na spravu detskych kurzov. Historiu konverzacie v appke nevidite iba v pripade ak odpisujete priamo zo svojho emailu, v pripade ak budete na konverzaciu vyuzivat zoozu, tak tam kompletnu historiu budete mat vzdy.", "cited": []}], "verdict": "gap", "vtitle": "Why Zooza sends from its own address and not from yours", "vnote": "Now there is a complete answer, unlike last week's fragment. Zooza sends from reply@zooza.app or no-reply@zooza.app. It cannot send as you without DKIM and DMARC on your domain, and sending volume from an unwarmed domain would land in spam. Deliverability — keeping the sending addresses off blocklists — is explicitly part of what the subscription buys. Note this does NOT match the internal note about a 40 EUR own-domain add-on; the answer actually given to the client is the one to document.", "cat": "comms"}, {"channel": "intercom", "id": "215476242906885", "date": "2026-10-08 11:33", "day": "2026-10-08", "human": false, "bucket": "D_assumed_with_kb", "reask": 16, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Blocks Configuration and Management | Zooza Help", "Copy a programme or class | Zooza Help", "New programme with existing clients | Zooza Help", "Programme Settings | Zooza Help", "Late bookings (pro-rata management) | Zooza Help", "Transfer and copy bookings | Zooza Help", "Discounts and Sibling Pricing FAQ | Zooza Help", "Payment templates creation | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Outstanding amount — why it does not follow price changes | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Bookings | Zooza Help", "Booking FAQ | Zooza Help", "Transfer and Copy FAQ | Zooza Help", "Customizing the booking tile | Zooza Help", "Registration statuses — what each one means | Zooza Help", "Run a term reset — move all clients to a new term | Zooza Help", "Charge a monthly membership fee | Zooza Help"], "q": "ahoj, prosím ťa potrebujem prehodiť celú skupinu aj s registráciami do iného kurzu, je to možné?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "ahoj, prosím ťa potrebujem prehodiť celú skupinu aj s registráciami do iného kurzu, je to možné?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno, je to možné — ale celú skupinu (všetkých klientov) naraz presunúť nejde. V Zooza sa presúvajú iba rezervácie, nie skupiny alebo klienti priamo. \n\n\nMáte dve možnosti:\n\n\n\n\n- \nPresunúť skupinu do iného kurzu\n• otvorte kurz a kliknite na Copy na skupine\n• aktivujte Copy bookings\n• všetci klienti sa skopírujú do novej skupiny\n• vzniknú nové rezervácie a staré zostanú nezmenené.  \n\n\n- \nPresunúť ich úplne (bez duplikov)\n• otvorte každú rezerváciu\n• kliknite Transfer a vyberte cieľovú skupinu.\n\nTakže: skupinu môžete skopírovať naraz, ale úplný presun všetkých klientov sa robí cez ich rezervácie.", "cited": ["Transfer and copy bookings | Zooza Help", "Transfer and Copy FAQ | Zooza Help", "Copy a programme or class | Zooza Help", "Run a term reset — move all clients to a new term | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak potrebujete s presunom skupiny a registrácií ešte pomôcť, som vám k dispozícii. Chcete doplniť, čo presne potrebujete presunúť alebo čomu v postupe nerozumiete?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Keď zmením celoročný cyklus na kurzovú formu, zmenia sa aj platobné plány. Tie zmením pri presune registrácie?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno — platobný plán sa môže zmeniť, keď presúvate registráciu do iného kurzu. \n\n\nPri presune (Transfer) máte dve možnosti:\n\n\n\n\n- \nDo not change payments – zachová sa pôvodný platobný plán presne tak, ako bol. \n\n\n- Bez tejto možnosti – systém nahraje platobný plán cieľového kurzu (teda nového kurzu). \n\n\nPreto je najbezpečnejšie vždy zaškrtávať Do not change payments, aby ste nezmenili existujúce splátky klientov.\n\n\nDôležité: keď meníte typ programu (napr. celoročný na kurzový), môže sa zmeniť aj konfigurácia platobných plánov na úrovni programu.", "cited": ["Transfer and Copy FAQ | Zooza Help", "Transfer and copy bookings | Zooza Help", "Booking FAQ | Zooza Help", "Programme Settings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Každopádne, či spravím tak alebo tak. Už uhradené platby v profiloch rezervácií ostanú, áno?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno. Pri presune registrácie (Transfer) sa história platieb prenáša spolu s rezerváciou. To znamená, že všetko, čo klient už uhradil, zostane zaznamenané aj v novej rezervácii. \n\n\nZmení sa iba rozpis budúcich splátok (ak nezatrhnete Do not change payments). Už uhradené platby sa však nezmazú ani neprepíšu.\n\n\nDôležité: po presune sa neprenášajú náhradné hodiny – tie treba pridať ručne.", "cited": ["Transfer and copy bookings | Zooza Help", "Booking FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Bolo to pre vás užitočné?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "A teda aj keď zmením platobný plán, tak uhradené platby takisto ostanú v rezervácií.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno. Pri presune registrácie (Transfer) sa história platieb prenáša spolu s rezerváciou. To znamená, že všetko, čo klient už uhradil, zostane zaznamenané aj v novej rezervácii. \n\n\nZmení sa iba rozpis budúcich splátok (ak nezatrhnete Do not change payments). Už uhradené platby sa nezmazú ani neprepíšu.", "cited": ["Transfer and copy bookings | Zooza Help", "Transfer and Copy FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Bolo to pre teba užitočné?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "áno, ďakujem", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Nie je sa za čo, som rád, že vám vi môžem pomôc. Ak by ste v budúcnosti potrebovali ešte nejakkoľvek pomoc, som tu pre vás. 😊", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "a viem len danú skupinu zmeniť z celoročného cyklu na kurzovú formu?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Nie — celoročný cyklus na kurzovú formu sa mení na úrovni programu, nie na úrovni skupiny (skupina = Class).\n\n\n\n\n- Typ programu sa mení v Programme settings → Programme type.\n\n\n- Táto nastavenie sa aplikuje na celý program, teda na všetky skupiny v ňom.\n\n- Na úrovni skupiny sa tento typ nezmení.\n\n\nAk chcete mať jednu skupinu kurzovú a druhú celoročnú, treba ich rozdeliť do dvoch programov a presunúť registrácie medzi nimi.", "cited": ["Programmes, Timetables and Sessions FAQ | Zooza Help", "Charge a monthly membership fee | Zooza Help", "Blocks Configuration and Management | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Je to tak, ako ste to potrebovali?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "a viem celú skupinu presunúť do iného programu?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno — celú skupinu (skupinu) môžete presunúť do iného programu. \n\n\nPostup:\n\n\n\n\n- otvorte detail skupiny\n\n- prejdite do Settings / Edit → Other settings\n\n\n- v rozbaľovacom menu zmeňte Programme na cieľový program\n\n- uložte a osviežte stránku\n\nDôležité: registrácie (rezervácie) klientov sa presunú spolu so skupinou, pretože klienti sú v Zooza viazaní na rezervácie, nie priamo na skupinu.", "cited": ["Transfer and copy bookings | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "New programme with existing clients | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Pomohlo vám to?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "nakoľko v druhom programe kde chcem presunúť skupinu, už typ platby nie je členské ale kurzovné, zmenia sa aj platobné plány, alebo tie musím manuálne zmeniť pri každej registrácií?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Pri presune registrácie do iného programu sa platobný plán môže zmeniť automaticky.\n\n\n\n\n- Pri presune sa môže použiť platobný plán cieľovej skupiny (teda nového programu).\n\n\n- Ak chcete zachovať pôvodný plán, musíte zatrhnúť Do not change payments.\n\n\nPreto:\n\n\n\n\n- bez tejto možnosti → systém nahrá kurzový platobný plán cieľového programu\n\n- s touto možnosťou → ostane pôvodný členský plán\n\nAko teda: nemusíte meniť ručne každú registráciu, stačí použiť túto voľbu pri presune.", "cited": ["Transfer and Copy FAQ | Zooza Help", "Transfer and copy bookings | Zooza Help", "Charge a monthly membership fee | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Pomohlo vám to?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc s presunom skupiny alebo nastavením platobných plánov, som vám k dispozícii. Chcete doplniť, čomu v tomto postupe ešte potrebujete lepšie porozumieť?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "zmenu som vykonal, ale platobné šablóny ostali nezmenené", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "To je očakávané správanie. Pri presune registrácie sa payment template (platobná šablóna) prenáša iba v prípade kopírovania, nie pri presune. \n\n\nPreto:\n\n\n\n\n- po presune do iného programu ostane pôvodná šablóna na rezerváciách\n\n- nový program môže mať inú šablónu, ale nezmení sa automaticky na existujúcich registráciách\n\n\nAk chcete kurzový plán na všetkých klientoch:\n\n\n\n\n- otvorte cieľovú skupinu (skupinu)\n\n- použite Apply payment template na celú skupinu\nalebo\n\n- zmeňte šablónu ručne v každej rezervácii\n\nDôležité: šablóny sa definujú na úrovni programu a na skupine sa iba aktivujú.", "cited": ["Payment templates creation | Zooza Help", "Transfer and Copy FAQ | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Je to takto v poriadku?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc s nastavením platobných šablón po presune skupiny, som vám k dispozícii. Chcete doplniť, s ktorou časťou postupu potrebujete pomôcť?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Ďakujem, podarilo sa. No máme nasledovnú situáciu: prvý tréning z 8 už prebehol, a teraz keď nastavím platné platobné plány, tak mi skresľuje sumu o alik.čiastku. Viem nastaviť na úrovni skupiny, aby mali plnú sumu?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno — dá sa to. Pri aktivnej Aliquot price calculation (alikvotná cena) systém automaticky zníži sumu podľa zostávajúcich termínov (hodín).\n\n\nAk chcete, aby klienti platili plnú sumu aj po prvom tréningu, stačí túto funkciu vypnúť. Potom sa kurzová cena nebude počítať ako „zostávajúce hodiny ÷ celkový počet hodín × plná cena“.\n\n\nTento výpočet sa používa práve v prípadoch, keď klienti vstupujú do kurzu po začiatku.", "cited": ["Payments and Billing FAQ | Zooza Help", "Late bookings (pro-rata management) | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "ale toto nastavenie zapnem na úrovni programu, však?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno — toto nastavenie sa robí na úrovni programu, nie skupiny. \n\n\nPostup:\n\n\n\n\n- \nProgrammes → vyberte program\n\n- \nSettings → Price and Payment → Advanced settings\n\n\n- \nAliquot price calculation → nastavte na Full programme price\n\n\n- uložte\n\nTáto nastavenie sa potom aplikuje na všetky skupiny (skupiny) v danom programe, takže klienti budú platiť plnú sumu aj po prvom termíne.", "cited": ["Late bookings (pro-rata management) | Zooza Help", "Discounts and Sibling Pricing FAQ | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "neviem toto nastavenie zmeniť len na úrovni skupiny?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Nie — Aliquot price calculation sa dá nastaviť iba na úrovni programu, nie na úrovni skupiny (skupina = Class).\n\n\nTáto nastavenie sa potom aplikuje na všetky skupiny v danom programe. Na úrovni skupiny ju nemôžete prepísať.\n\n\nAk potrebujete iné správanie pre konkrétnu skupinu, jediná možnosť je ručne upraviť sumu v každej registrácii.", "cited": ["Late bookings (pro-rata management) | Zooza Help", "Discounts and Sibling Pricing FAQ | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Pomohlo to?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc s nastavením alikvotnej ceny alebo platobných plánov, som vám k dispozícii. Chcete doplniť, čo presne potrebujete v konkrétnej skupine nastaviť?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "aplikoval som nové platobné šablóny, no na 4tej registrácií sa to zastavilo, akonáhle systém mal zmeniť kvartálnu úhradu. Mám to nechať tak a počkať?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Nie, nemusíte čakať. Pri existujúcich registráciách systém neprepočíta platobný plán automaticky. \n\n\n\n\n- Zmena ceny alebo šablóny sa aplikuje iba na nové registrácie\n\n\n- Už existujúce registrácie si zachovávajú pôvodný plán\n\n- Ak chcete nový kvartálny plán aj u nich, musíte ho ručne upraviť v každej registrácii \n\n\nPreto sa to môže „zastaviť“ – systém neaktualizuje už uložené plány sám.", "cited": ["Payment templates creation | Zooza Help", "Outstanding amount — why it does not follow price changes | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Je to pre vás teraz jasné?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc s úpravou platobných plánov pri existujúcich registráciách, som vám k dispozícii. Chcete doplniť, pri ktorej časti nastavenia potrebujete ďalšiu podporu?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "ako nastavím nulový dlh na celé obdobie?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Na úrovni skupiny sa nulový dlh na celé obdobie nastaviť nedá. \n\n\nV Zooza existujú dva spôsoby, ako dosiahnuť „žiadna suma“ krétnu skupinu, dám si rýchle zobrazenie, aby som mal vypísané mená pod sebou, napravo od nich máme otáznik/fajka/hodiny/xko.\n\nje možné aby sa nám trieda zobrazovalo tam?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Nie — v rychlom zobrazení skupiny (zoznam klientov pod sebou s fajkou/otazníkom/hodinami) sa dá zobraziť iba základný stav klienta. \n\n\nExtra pole ako „trieda“ sa dá zobraziť na karte klienta v Bookings list (zoznam registrácií) pomocou widgetu Extra fields, ale v tomto rýchlom zozname skupiny sa neukáže vedľa mena. \n\n\nTakže teraz je to možné iba cez Bookings list, nie priamo v tom rýchlom zozname skupiny.", "cited": ["Booking FAQ | Zooza Help", "Customizing the booking tile | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Pomohlo to?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc so zobrazením triedy pri prezenčke, som vám k dispozícii. Chcete doplniť, ako presne by ste potrebovali triedu pri rýchlom zobrazení používať?", "cited": []}], "verdict": "gap", "vtitle": "Moving an entire class with its registrations to another programme (asked 16 times)", "vnote": "Highest re-ask of the week. The bot cited blocks and copy articles and never answered. Whether a whole class can move programme, and what happens to its bookings, is a basic question with no article.", "cat": "programmes"}, {"channel": "intercom", "id": "215476296743929", "date": "2026-10-08 10:04", "day": "2026-10-08", "human": false, "bucket": "D_assumed_with_kb", "reask": 1, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "ĎAkujem, už som to s kolegom vyriešila.", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "ĎAkujem, už som to s kolegom vyriešila.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I'm glad to hear that you and your colleague were able to resolve the is n\nDôležité:\n\n\n\n\n- počítajú sa len rezervácie so stavom Registered\n\n\n- zľava sa počíta v momente rezervácie a neskôr sa neprepočíta.\n\nTakže: rodič môže zaplatiť hneď kartou a surodenecká zľava sa uplatní aj pri neskornej registrácii.", "cited": ["Price and payment setup | Zooza Help", "Programme Automations | Zooza Help", "Sibling Discount | Zooza Help", "Discounts and Sibling Pricing FAQ | Zooza Help", "Late bookings (pro-rata management) | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Lenka Pechová", "text": "asi ano.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I'm glad to hear that the information was helpful. If you have any more questions or need further assistance, please feel free to ask. I'm here to help! 😊", "cited": []}, {"role": "customer", "who": "Lenka Pechová", "text": "a ked skupina dosiahne naplnenu kapacitu, tak sa stane co. moze sa do nej registrovat a pusti to rodica k platbe alebo nie?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dobrá otázka, Lenka.\n\n\nKeď skupina dosiahne kapacitu, rezervácia sa prepne na čakací zoznam (Waitlist).\n\n\n\n\n- rodič môže ešte odoslať rezerváciu\n\n- systém ho dá na čakací zoznam\n\n- platba sa neočakáva\n\n- rodič čaká, kým sa uvoľní miesto\n\nKeď sa miesto uvoľní, môžete ho z čakacieho zoznamu ručne schváliť a až potom sa stáva registrovaným účastníkom.\n\n\nZdroj:", "cited": ["Types of bookings | Zooza Help", "Waiting List FAQ | Zooza Help", "Getting Started with Zooza | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Lenka Pechová", "text": "a viem povolit ze aj pri neskorej registracii moze clovek automaticky zaplatit oboma sposobmi, aj kartou aj cez banku?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno, je to možné. Pri neskornej registrácii sa pla  "intercom", "id": "215476263354052", "date": "2026-10-08 07:29", "day": "2026-10-08", "human": true, "bucket": "HUMAN", "reask": 35, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": ["Calendar | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Managing sessions in a class | Zooza Help", "Settings | Zooza Help", "Recover deleted items: registrations, classes, sessions, and payments | Zooza Help", "Where to find things in Zooza — quick reference | Zooza Help"], "q": "help I have just delete a session by mistake", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "help I have just delete a session by mistake", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "people were booked on for the term", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Hi Samantha — you may still be able to recover it.\n\n\nDeleted sessions are kept in Trash for 30 days and can be restored. \n\n\nSteps:\n\n\n\n\n- Go to Settings → Tools → Trash\n\n\n- Find the deleted session\n\n- Click Restore\n\n\nAfter restoring, it returns to its original place in the class. \n\n\nIf it has been more than 30 days, the session is permanently removed and cannot be recovered.", "cited": ["Recover deleted items: registrations, classes, sessions, and payments | Zooza Help", "Settings | Zooza Help", "Where to find things in Zooza — quick reference | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "I have restored it but still not showing", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Samantha, this is usually just a browser refresh issue after restoring a session.\n\n\nPlease do a quick refresh of the page:\n\n\n\n\n- Mac: Cmd+R or Cmd+Shift+R\n\n- Windows: Ctrl+R, Ctrl+F5, or F5\n\nZooza sometime
