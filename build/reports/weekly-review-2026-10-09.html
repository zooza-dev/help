"bucket": "D_assumed_with_kb", "reask": 2, "resolution": "confirmed_resolution", "rating": null, "carried": null, "sources": ["Client Management FAQ | Zooza Help", "Documents | Zooza Help", "Send Email | Zooza Help", "Attach Documents to Sessions | Zooza Help"], "q": "ahoj, je mozne pridat prilohu k emailu zo zoozy ?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "barbora zajacová", "text": "ahoj, je mozne pridat prilohu k emailu zo zoozy ?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Nie — v emaile zo Zoozy nelze přidat přílohu. \n\n\nMísto toho můžete soubor sdílet takto:\n\n\n\n\n- Nahrát soubor do Documents a klienti ho uvidí ve svém profilu. \n\n\n- Přiložit soubor přímo k session (Calendar → Notes → Prep material). \n\n\nKlienti pak soubor najdou ve svém profilu.", "cited": ["Send Email | Zooza Help", "Documents | Zooza Help", "Attach Documents to Sessions | Zooza Help", "Client Management FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "barbora zajacová", "text": "ano.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rád jsem vám pomohl! Pokud budete mít ještě nějaké dotazy, jsem tu pro vás. 😊", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215476260459807", "date": "2026-10-06 11:19", "day": "2026-10-06", "human": true, "bucket": "HUMAN", "reask": 10, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": [], "q": "528773 - Claudia Apolloni (Riccardo Riganti)\n\nwhy does this payment show was 5 days overdue? i'd like the payment to be automatically made every month", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "528773 - Claudia Apolloni (Riccardo Riganti)\n\nwhy does this payment show was 5 days overdue? i'd like the payment to be automatically made every month", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I understand your concern about the payment being overdue. I cannot access your account data to confirm the cause, but I can help with general questions or connect you with a human agent. Would you like me to connect you with a human agent? Or if you provide more details, I can continue assisting you.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help understanding the overdue payment or setting up monthly automatic payments, I’m here to assist. Would you like to share more about what you’re trying to resolve?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "human agent", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I understand you would prefer to speak with a human agent. Would you like me to connect you with one now? Or if you wish, you can continue working with me and provide more details about your payment issue.", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "yes", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I will connect you with someone from our team shortly. Meanwhile, could you please share any additional details about your payment issue to help them assist you more efficiently?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "Hi Zooza support,\n\n\nA scheduled monthly payment wasn't collected for one booking, and I can't see why.\n\n\nBooking: 528773, Riccardo Riganti (client: Claudia Apolloni, clapolloni@gmail.com)\nClass: RIS LAMDA Acting Academy, Wednesday (16 Sept 2026 – 23 June 2027), Rome International School\nPlan: Monthly subscription, total charge €167\n\n\nWhat happened:\n\n\n\n\n- The client paid €96 on 1 Sept 2026 by card (Stripe, card ending 1009).\n\n- The remaining €71 should have been collected automatically on 1 October. It wasn't, and the booking now shows €71 outstanding and unpaid.\n\n- Checking Stripe, there is no payment attempt at all for this client after 1 Sept, not even a failed or incomplete one. So the charge doesn't appear to have been tried.\n\n- Other bookings in the same class on the same plan were charged successfully, for example €71 on 24 Sept and €71 on 2 Oct.\n\nQuestions:\n\n\n\n\n- Why wasn't the 1 October payment attempted for this booking?\n\n- Is automatic payment enabled for this booking, and is the client's card still saved against it?\n\n- Can the €71 be collected now, and will the next instalment (17 Oct) be charged automatically?\n\nThanks,\nSam Davis", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "also", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "Hi Zooza support,\n\n\nWe converted a trial client to a monthly subscription and ended up with a messy booking, so I'd like to check the correct process.\n\n\nClient: Francesca Cozzolino (Francesca.cozzolino@pfizer.com), child Mia Maiolino\nClass: RIS Musical Theatre, Thursday (17 Sept 2026 – 24 June 2027)\n\n\nWhat happened:\n\n\n\n\n- Mia booked a paid trial (booking 544476) on 26 Sept and attended on 1 Oct.\n\n- On 3 Oct the client paid €75 by card via Stripe against a monthly subscription plan that we had added to the trial booking.\n\n- On 6 Oct the client got the automatic email \"You haven't registered… your spot has been released\", even though she had paid. The booking page showed the trial follow-up emails (booking link on 1 Oct, follow-ups on 2 and 3 Oct) running to the end.\n\n- I changed the booking to \"Trial won\", but Mia still didn't appear on the register, because only 2 of 15 are counted as enrolled. The status form only offers trial statuses, with no option for Enrolled.\n\n- To fix it, I created a new enrolled booking (548976) by copying the trial booking, and added the €75 monthly plan with the first payment due 8 Nov. The €75 paid on 3 Oct is still on the old trial booking (544476).\n\nQuestions:\n\n\n\n\n- What is the correct way to convert a trial booking to a full enrolment, so the client appears on the register and keeps the payment already made? Should it create a separate enrolled booking, and if so how do we link the trial payment to it?\n\n- How do we stop the automatic \"spot released\" emails once a trial client has paid or converted?\n\n- The new booking 548976 shows \"Automatic payments are possible: No\". How do we get the client's card saved so the 8 Nov payment is taken automatically, or should we send her a payment request?\n\n- Can the €75 from 3 Oct be moved from booking 544476 to 548976, or should we leave it where it is?\n\n- Please check that the two bookings don't cause a duplicate charge or a duplicate place in the class.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Sam, Zooza has fully automated trial process. You can customize how the process works thus parts of it can be different but in a default setting this is how it is supposed to work:\n\n\n1) Customer first creates trial booking (paid or free, based on your settings)\n\n\n2) After they attend the class and teacher marks an attendance as attended - system will send a booking link to that customer. When they do - Zooza will prompt the teacher to confirm whether the child is to book for their full session on the current class or teacher can recommend another class (based on the child's age or other criteria)\n\n\n3) Customer can then click on this booking link and create a regular booking\n\n\n\n\n\nAlternatively - customer does not have to wait for the trial to end and can enroll to the full experience any time from their profile.\n\n\nAdmins can enroll the customer to the full programme at any time from the booking detail by hitting the button Enrol Now.\n\n\n\n\n\nThis means that customer gets two bookings after successful trial - one for the trial and second for the full experience.", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "Hi Martin, \nThanks for explaining the trial process. That's clear, and it's what we ended up with for Mia (trial booking 544476, enrolled booking 548976), though I created the enrolled booking by copying the trial booking instead of using Enrol Now. I'll use Enrol Now from now on. Three things are still open on Mia's booking:\n\n\n\n\n- \nAutomatic payments. Booking 548976 shows \"Automatic payments are possible: No\" and \"Able to charge offline: No\". The first instalment (€75) is due 8 Nov. How can we get the client's card saved so it's taken automatically? Should we send her a payment request, or will Zooza send one itself on the due date?\n\n- \nThe €75 paid on 3 Oct. The client paid €75 by card via Stripe on 3 Oct, and it's still on the trial booking (544476). On another client (booking 543245), the €15 trial payment was deducted from the first payment on the full booking. Can the €75 on 544476 be carried over to 548976, or is there a correct way to do that so she isn't charged twice for October?\n\n- \nThe \"spot released\" email. The client got \"You haven't registered… your spot has been released\" on 6 Oct, after she had already paid. Now that she has an enrolled booking, will that email stop? And is there a way to prevent it for a client who has paid or enrolled?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "1) Automatic payments - when she booked the trial session - at that time we don't store the card as there is no expectation that the customer would be paying every month. We dont want to store customer's payment methods unless they are fully enrolled. But. Whenever a customer has a payment plan attached to a booking and they will make a payment for that booking - at that point we will automatically store the payment details for automatic payments.\n\n\n2) You can transfer a credited amount from booking to booking, but the online transaction record will stay at the original booking. So to do that just locate any credited amount on the booking's payments screen. Hit More button next to the payment and there are three options: Issue a refund, Correct a payment (this is useful for manually entered payments only, when someone mistypes the value) and lastly: Move payment to a different booking.\n\n\n3) The email is sent to those users that have a booking in state: Trial ended and did not enroll. So what you could do is simply to change the status from Trial - to Registered/Enrolled. That would stop that email from being sent.\n\n\n\n\n\nI hope this helps:)", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "thank you martin", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "i also had this question, not sure if you saw it above", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "Hi Zooza support,\n\n\nA scheduled monthly payment wasn't collected for one booking, and I can't see why.\n\n\nBooking: 528773, Riccardo Riganti (client: Claudia Apolloni, clapolloni@gmail.com)\nClass: RIS LAMDA Acting Academy, Wednesday (16 Sept 2026 – 23 June 2027), Rome International School\nPlan: Monthly subscription, total charge €167\n\n\nWhat happened:\n\n\n\n\n- The client paid €96 on 1 Sept 2026 by card (Stripe, card ending 1009).\n\n- The remaining €71 should have been collected automatically on 1 October. It wasn't, and the booking now shows €71 outstanding and unpaid.\n\n- Checking Stripe, there is no payment attempt at all for this client after 1 Sept, not even a failed or incomplete one. So the charge doesn't appear to have been tried.\n\n- Other bookings in the same class on the same plan were charged successfully, for example €71 on 24 Sept and €71 on 2 Oct.\n\nQuestions:\n\n\n\n\n- Why wasn't the 1 October payment attempted for this booking?\n\n- Is automatic payment enabled for this booking, and is the client's card still saved against it?\n\n- Can the €71 be collected now, and will the next instalment (17 Oct) be charged automatically?\n\nThanks,\nSam Davis", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Sam,\n\n\nWe looked into the missed instalment of €71.00 for Claudia Apolloni (clapolloni@gmail.com), due 16 September 2026.\n\n\nZooza attempted the automatic card charge at 01:05 that night, but Stripe rejected it: the saved card we were instructed to charge no longer exists in your Stripe account (Stripe error: \"No such PaymentMethod: 'pm_1UAmFVJXkcpmBfLN94iVyumh'\"). Because no payment was actually attempted on the card, you will not see a failed payment for it under Payments.\n\n\n\n\n\nTo see what happened to the card, in your Stripe Dashboard:\n\n\n1. Customers → search for clapolloni@gmail.com (customer ID cus_VB8V0kAWvozsoI). Under Payment methods, check whether a card is still saved, or whether it was removed or replaced.\n\n\n2. On the same customer page, open Events / activity and look for \"payment method was detached\" or \"customer was deleted\" around or before 16 September. That event tells you when, and from where, the card was removed.\n\n\n3. Optionally, open Developers → Workbench → Logs and search for the request ID req_t6AJFpCjzXcBXi to see the exact failed request and Stripe's response.\n\n\n\n\n\nThe instalment is still unpaid in Zooza and will not be retried automatically, because without a valid card there is nothing to charge. Because there is no payment method stored - the future payments will also fail, unless customer will pay again and store new card.\n\n\n\n\n\nZooza issues a system event in case this happens and the scheduled payment is not collected. You can review those events in the right hand sidebar of the app. There are three such events for your account in total and all three are related to this customer.", "cited": []}], "verdict": "gap", "vtitle": "An automatic card payment that never even reached Stripe", "vnote": "Strong and generalisable: the saved payment method had been detached in Stripe, so the charge was never attempted — which is why nothing shows as a failed payment. Future instalments will fail the same way until the client pays again and a new card is stored. Also: the card is only stored once someone is fully enrolled and pays, never at trial. Plus the three options behind More on a payment — refund, correct, move to another booking.", "cat": "payments"}, {"channel": "intercom", "id": "215476207040387", "date": "2026-10-06 11:11", "day": "2026-10-06", "human": true, "bucket": "HUMAN", "reask": 1, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "BBBA - registracie - filter - parametre - ak je datum oktober - nezobrazuje z iadne vysledky\n\nahojte, prave som zistila ze v registraciiach pri filtrovani ak pracujem s datumom od oktobra 1.a lebo 2. tak nezobrazi ziadne  vysledky\n (datum do sept. je plne funkcny)\ndakujem", "turns": [{"role": "customer", "who": null, "text": "BBBA - registracie - filter - parametre - ak je datum oktober - nezobrazuje z iadne vysledky\n\nahojte, prave som zistila ze v registraciiach pri filtrovani ak pracujem s datumom od oktobra 1.a lebo 2. tak nezobrazi ziadne  vysledky\n (datum do sept. je plne funkcny)\ndakujem", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Vážený Silvia,\n\n\nváš tiket byl přijat. Asistent Zooza se vám pokusí ihned pomoci — a člen našeho týmu jej také osobně zkontroluje.\n\n\n— Podpora Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hm, pozeram to na vasom ucte, a vyzera, ze to ide, skusala si asi aj refresh, hej? Jedine, ze by neboli dobre dotiahnute data. Alebo neboli registracie v takom stave v tom case. Aktualne vidim 2. Skúsiš ešte raz, prosím?\n\n\nhttps://zooza.app/#registrations?billing_period_id=3722&status=registered&created_from=2026-10-01&order_by=created_desc&page=0&page_size=20&person_id=0&payment_id=0&segment_id=0&schedule_id=0", "cited": []}, {"role": "customer", "who": "Baby Balance Bratislava", "text": "už to funguje, super, dikees\n\n\n---\n​\n\n\nĎakujem a prajem pekný deň.\nSilvia\nwww.babybalanceba.sk\nFacebook: Baby Balance\nInstagram: baby.balance\n\n\n\n​\n\n\nDňa 2026-10-06 10:53 Tech from Zooza napísal(a):", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215476248612058", "date": "2026-10-06 09:26", "day": "2026-10-06", "human": true, "bucket": "HUMAN", "reask": 1, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "pripojenie nie je sukromne\n\nDobry den, dnes sa klientke stalo, ze ked klikla v maily zo Zoozy, ze sa chce odhlasit z hodiny, ukazala sa jej tato sprava. Prosim viete mi povedat, kde je problem, ako ho riesit a co mam povedat klientovi? Dakujem.", "turns": [{"role": "customer", "who": null, "text": "pripojenie nie je sukromne\n\nDobry den, dnes sa klientke stalo, ze ked klikla v maily zo Zoozy, ze sa chce odhlasit z hodiny, ukazala sa jej tato sprava. Prosim viete mi povedat, kde je problem, ako ho riesit a co mam povedat klientovi? Dakujem.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Vážený Ivana,\n\n\nváš tiket byl přijat. Asistent Zooza se vám pokusí ihned pomoci — a člen našeho týmu jej také osobně zkontroluje.\n\n\n— Podpora Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Ivana, toto so Zoozou nema v principe nic spolocne. Zakaznicka pristupuje k stranke Helen doron cez protokol HTTP a to sa moze stat dvoma sposobmi: bud vo Vasom ucte v Zooze v casti Tim a nastavenia -> Publikovat -> [Widget] mate linku na web helendoron.sk uvedenu vo formate HTTP a nie HTTPS, alebo je problem s certifikatom na stranke helendoron.sk", "cited": []}, {"role": "customer", "who": "Janos Szollosi - Helen Doron English Slovakia", "text": "Ahoj Ivana,\n\n\nnaša stránka helendoron.sk je dostupná cez HTTPS. S na konci znamená secure.\n\n\nZ odpovede Zoozy nie je jasné, čo presne spôsobilo problém u klientky. Webmastara som kontaktoval, aby skontroloval bezpečnostný certifikát pre istotu. Podľa mňa je to v poriadku, ale pre istotu. \n\n\nToto je pre support@zooza.online : dvomi klikmi sa dá skontrolovať či webová stránka má alebo nemá platný certifikát.\n\n\nIvana, prepošli mi prosím odkaz, čo dostala klientka od Vás aj pre mňa, alebo podobný odkaz cez Zoozu – správcu to prepošlem ja. Ďakujem.\n\n\nPrint screeny sú nižšie o certifikáty.\n\n\nBest regards / S pozdravom \n\n\n \n\n\nJanos Szollosi | Helen Doron English National Franchisor for Slovakia \n\n\nTel.: +421(0)918 455 149| E-mail:janos.szollosi@helendoron.sk\n\n\n\nwww.helendoron.sk| Facebook | Instagram | Linkedin\n\nA world of educational excellence, enjoyment, creativity and knowledge \n\n\nKangi Club\n |  Helen Doron Radio |   HDE Google Play  | HDE App Store|", "cited": []}], "verdict": "gap", "vtitle": "'Connection is not private' when a client clicks unsubscribe", "vnote": "Same cluster, different symptom: the site link in the widget settings is HTTP rather than HTTPS, or the certificate on the client's own site is broken. Nothing to do with Zooza itself, which is exactly why it needs documenting.", "cat": "widgets"}, {"channel": "intercom", "id": "215476082213906", "date": "2026-10-06 08:50", "day": "2026-10-06", "human": true, "bucket": "HUMAN", "reask": 12, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": ["Authentication | Zooza Developer Docs", "Deploying Zooza app on your website | Zooza Help", "Quickstart | Zooza Developer Docs", "Getting Help and Support | Zooza Help"], "q": "@Martin Rapavy - can you please send me a new API Key, I made the mistake to forward it via Whatsapp and the dev team now says we shouldn't use it. Thanks!", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Wie kann ich helfen?", "cited": []}, {"role": "customer", "who": "API Connect", "text": "@Martin Rapavy - can you please send me a new API Key, I made the mistake to forward it via Whatsapp and the dev team now says we shouldn't use it. Thanks!", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "A new REST API key cannot be generated from inside the app. It must be requested from our support team. \n\n\nPlease send a short request to:\n\n\nsupport@zooza.online\n\n\nInclude that the previous key was shared via WhatsApp and needs to be replaced. The team can then issue a new REST API key and client secret for your integration.", "cited": ["Authentication | Zooza Developer Docs", "Deploying Zooza app on your website | Zooza Help", "Quickstart | Zooza Developer Docs", "Getting Help and Support | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "API Connect", "text": "Please forward the message to Martin Rapavy. Thx.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I’m not able to forward messages to specific people.\n\n\nTo request a new REST API key, please email support@zooza.online and explain that the previous key was shared via WhatsApp and needs to be replaced. The team can then issue a new REST API key and client secret. \n\n\nYou can also create a support ticket from the Help & Support screen in the app if you prefer.", "cited": ["Authentication | Zooza Developer Docs", "Getting Help and Support | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "API Connect", "text": "No, connect to the team here, please.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I will connect you with someone from our team shortly. Meanwhile, could you please provide any additional details about your request to help them assist you more efficiently?", "cited": []}, {"role": "customer", "who": "API Connect", "text": "I'm referring to a previous exchange here with Martin, he knows what this is about.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi, no worries, the API key is public information. Only client secret is a private part so unless you compromised that, you're good. All api calls need user token which you obtain only with the combination of API key and Client secret.", "cited": []}, {"role": "customer", "who": "API Connect", "text": "Thanks, Martin. I just checked, I sent both 🙈, please send me a new Client secret ... 😇", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ok, here is the rotated secret: Tv96WsT25prhVgD79AmD76QbIZkMFfdx", "cited": []}, {"role": "customer", "who": "API Connect", "text": "ok, thanks, I'll keep it secret, this time 🙈🤦‍♂️😇", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "We should put this in the app anyways so you can manage that yourself. One day when we have nothing else to do... :)\nHave a great rest of the day. Should you have any questions on the endpoints, feel free to reach out.", "cited": []}, {"role": "customer", "who": "API Connect", "text": "Thanks, Martin - I'll have a meeting with them and we will see if there are any open items that pop up. Appreciate your support! Best wishes from Austria,\n\n\n\n\n\nMartin", "cited": []}, {"role": "customer", "who": "API Connect", "text": "Hi Martin, here is a message from the AI agent that we tried to use for setting up the 8n8 connection to Zooza API: \n\n\nwe are trying to connect Zooza to our administration system via the REST API (n8n, server-to-server) and are following the documentation \"Authentication → Via client secret\".\n\n\nRequest: POST https://api.zooza.app/v1/login\n\n\nHeaders: Content-Type: application/json, Accept: application/json, X-ZOOZA-API-KEY: \u003cour key>, X-ZOOZA-COMPANY: 548\n\n\nBody: {\"login\": \"…\", \"verification_method\": \"client_secret\", \"client_secret\": \"\u003cthe secret you sent us>\"}\n\n\nWe tested with zooza-api-linz@helendoron.at. The response was as in the screenshot attached + a token.\n\n\nCould you please check:\n\n\n\n\n- For which user email address was the client secret issued, and is it active?\n\n- Do our API key and the client secret belong together?\n\n- Is the user zooza-api-linz@helendoron.at fully set up, and does it have a role in company 548? According to /v1/user it shows user_valid: false.\n\n- How long is a token from /v1/login valid?\n\nThank you!\n\n\nBest wishes from Austria, Martin", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Martin. The client secret is not issued against an email but rather that api key we sent you so yes API key and client secret do belong together. The token generated by login is persistent and its expiry is one year although it can be revoked at any time thus you need to have a method for retrieving new token once the old one has been invalidated.\n\n\nThis request with your api key and client secret:\ncurl --location 'https://api.zooza.app/v1/login' \\\n\n\n--header 'Content-Type: application/json' \\\n\n\n--header 'Accept: application/json' \\\n\n\n--header 'X-ZOOZA-API-KEY: \u003cAPI_KEY>' \\\n\n\n--data-raw '{\n\n\n\"login\": \"zooza-api-linz@helendoron.at\",\n\n\n\"verification_method\": \"client_secret\",\n\n\n\"client_secret\": \"\u003cCLIENT_SECRET>\"\n\n\n}'\n\n\n\n\n\nproduced a valid response:\n\n\n{\n\n\n\"login_email_sent\": false,\n\n\n\"message\": \"email_not_sent\",\n\n\n\"token\": \"\u003cTOKEN>\"\n\n\n}\n\n\n\n\n\nFor the login operation you dont have to attach company id although it is harmless if you do so. Please double check you did call the api with correct credentials.", "cited": []}, {"role": "customer", "who": "API Connect", "text": "Hi Martin, \n\nI received the following from the AI team:\n\nHi Martin,\n\n\nthanks a lot, that helps! A few follow-ups so we can build this correctly:\n\n\nFor /v1/login: what exact value goes into verification_method, and is the secret sent as client_secret in the body?\n\n\nDoes a new login invalidate previously issued tokens? Is there a rate limit on /v1/login?\n\n\nWhen a token has been revoked, which HTTP status do we get (401 or 403)?\n\n\nIs X-ZOOZA-COMPANY still required alongside X-ZOOZA-TOKEN?\n\n\nCan we write custom fields on a registration or attendee via the API? We'd like to store each child's Kangi username and password. Which endpoint and method?\n\n\nCan such custom fields be (potentially) hidden from teachers, and can SMS templates in Zooza use them as placeholders - this is not implemented as of now, but just to know?\n\n\nThanks and best regards,\n\n\nMartin", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Martin, feel free to connect us directly to your AI team so that you don't spend your time forwarding messages:) But of course if you want to have this under control, I'm happy to have you here!\n\n\n1) just follow the CURL example I sent you before: \"verification_method\": \"client_secret\"\n\n\n2) yes the client secret is a part of the body\n\n\n3) Not necessarily. The auth engine decides on its own under what conditions it invalidates certain tokens\n\n\n4) We currently do not impose any API rate limits toward your account\n\n\n5) All error messages that Zooza emits are wrapped in 400 header response which always contains machine readable list of errors along with specific error codes\n\n\n6) Yes it is required\n\n\n7) Yes you can using this request:\ncurl 'https://api.zooza.app/v1/extra_fields/{extra_field_id}' \\\n\n\n-X PUT \\\n\n\n-H 'X-ZOOZA-API-KEY: {api_key}' \\\n\n\n-H 'X-ZOOZA-TOKEN: {user_token}' \\\n\n\n-H 'X-ZOOZA-COMPANY: {company_id}' \\\n\n\n-H 'Content-Type: application/json' \\\n\n\n--data-raw '{\"column\":\"identification_number\",\"value\":\"asdf\"}' \n\n\nThe ID of the extra field is available from GET/registrations/{registration_id} in the extra_fields array. The condition is that the extra field row needs to already exist.\n\n\n8) If that extra field you want to use is not toggled on in the course settings you can treat it as hidden - not showing for users. So for example extra_field_15 - if it is unused and not enabled on the course settings - you can still write to this field and read the values back. You can even use it in the email templates as Template tags along the documented merge vars interface, List of all merge vars available to you is printed in the app's template editor or on our help.zooza.online page. However it is not possible to send merge vars via SMS. The engine does not support that. Should you want to send bulk SMS messages via your own API's / sms gateway - you'd need to compose the message yourself. In that case your best path forward is to use advanced_search mechanics to filter out certain registrations for example like this: GET/registrations?billing_period_id=0&status=registered&order_by=created_desc&page=0&page_size=20&person_id=0&payment_id=0&segment_id=0&schedule_id=0\nThe list of available filtering criteria is pretty large but essentially you'd want to be aware of the pagination. The response would contain all extra fields.", "cited": []}, {"role": "customer", "who": "API Connect", "text": "Well, the AI team literally is a team of AI agents of a speaker friend of mine who are building the seatable database + the n8n connectors. So I'll have to play messenger for them 😉\n\nI'll pass it on ... fingers crossed, we might go into testing this week, it's almost all set up.\n\nBut if it works, I'll happily do a zoom session with you to show you what we (they) have built.\n\nAppreciate your support! Best wishes from Austria, \n\n\n\n\n\nMartin", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "That'd be awesome. I always love seeing what our customers have built. I just recently found out that some of our HD franchisors were able to successfully connect to HDC via SalesForce connector and are leveraging the possibility to connect Zooza with HDC this way. So it's always great to see what others are building and pass that along. Talk soon:)\n\n\nAll the Best,\n\n\nMartin", "cited": []}, {"role": "customer", "who": "API Connect", "text": "Hi Martin, thanks, we are making progress - here is a message from the AI team:\n\nlogin works now and GET /v1/registrations/{id} returns the registration correctly (company 548, user is active and Owner). But the list GET /v1/registrations?status=registered&billing_period_id=0&person_id=0&payment_id=0&segment_id=0&schedule_id=0&order_by=created_desc&page=0&page_size=20 returns HTTP 200 with an empty array []. Without filters it is also empty. Which parameters do we need to list all registrations of our company (or e.g. all changed since a date)? Also, could you please revoke all API tokens of zooza-api-linz@helendoron.at issued today? One was exposed in a screenshot – our workflow logs in fresh on every run anyway. Thanks!", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Martin, your request is missing the advanced_search=1 flag which I ommited when I sent it to you previously. Sorry, my bad. Try it now. BTW only the advanced_search=1 flag is required to query the registrations. you can then freely combine schedule_id, registration_status, payment_status and other query vars to further drill down specific registrations. For example if you want to query specific registration ids you can use registration_id={id}|{id}|{id} - e.g. you can concatenate ids with pipe character to get those specific registrations. There are many other ways to query for registrations so if you have a specific approach, feel free to pose a logical query and I'll get back to you with exact shape how it can be achieved", "cited": []}, {"role": "customer", "who": "API Connect", "text": "Thanks, I'll pass it on! 😊", "cited": []}], "verdict": "gap", "vtitle": "API credentials and auth, answered properly", "vn ull, "text": "SMS sending failed with status 'Failed' despite correct phone numbers\n\nCustomer reports SMS sending fails with status 'Failed' for valid +421 numbers; no SMS opt-out found; issue may relate to unverified client blocking SMS sending for registration Mlcuch.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "barbora zajacová", "text": "Dobry den, odoslanie sms zlyhalo. kde moze byt problem? cislo ma spravny tvar", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Barbora, najčastejšími príčinami sú:\n\n\n\n\n- \nČíslo je zahraničné – musí byť v plnom formáte s + (napr. +420 777 123 456).\n\n\n- \nKlient vypol SMS – v rezervácii v Options tabu môže byť vypnuté zasielanie upozornení.\n\nMôžete tiež skontrolovať stav v Communication → Sent messages, kde vidíte doručovací stav SMS.\n\n\nVidíte v tom zozname u tejto SMS stav Failed?", "cited": ["Email and Communication FAQ | Zooza Help", "Communication | Zooza Help", "Sending email/SMS to clients | Zooza Help"]}, {"role": "customer", "who": "barbora zajacová", "text": "ano", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Barbora, ak v Communication → Sent messages vidíte stav Failed, skontrolujte hlavne tieto veci: \n\n\n\n\n- \nKlient vypol SMS – v rezervácii v Options tabu môže byť vypnuté zasielanie upozornení. \n\n\n- \nKlient vypol notifikácie na úrovni profilu – otvorte profil klienta a skontrolujte jeho nastavenia notifikácií.\n\n- \nČíslo je zahraničné – musí byť v plnom formáte s + (napr. +420 777 123 456).\n\nČasto je problém práve v týchto nastaveniach klienta.", "cited": ["Email and Communication FAQ | Zooza Help", "Communication | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "barbora zajacová", "text": "moze byt problem ze je sms dlha 2 smsky ?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Nie. Dĺžka SMS (napr. 2 SMS) není uvádzaná ako príčina zlyhania v našej dokumentácii. \n\n\nZákladné body:\n\n\n\n\n- SMS sa odosielajú z virtuálneho čísla a sú jednosmerné (klienti na ne nemôžu odpovedať). \n\n\n- \nKaždá SMS sa účtuje zvlášť, takže dlhšia správa môže byť rozdelená na viac častí, ale to nie je uvádzaná ako chyba doručenia.\n\nTakže délka 2 SMS sama o sebe pravdepodobne problém nezpôsobuje.", "cited": ["Sending email/SMS to clients | Zooza Help", "Email and Communication FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "barbora zajacová", "text": "cislo je v spravnom tvare +421910834687 a nevidim na detaile klienta ze by si vypol sms", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thank you for the details about the phone number and SMS settings. Would you like me to connect you with a human agent who can assist further? Or if you prefer, you can provide more information and I will do my best to help you directly.", "cited": []}, {"role": "customer", "who": "barbora zajacová", "text": "yes, thank you", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I will connect you with someone from our team shortly. Meanwhile, could you please share any additional details about your issue to help them assist you more efficiently?", "cited": []}, {"role": "customer", "who": "barbora zajacová", "text": "Issues with sending sms to correct phonenumbers, status is failed", "cited": []}, {"role": "customer", "who": "barbora zajacová", "text": "Dobrý deň, posielam viac info - skusala som poslat smsky na klientov \n1. Hlubik -  reg 541668\n2. Strucka - reg. 541682\n3. Čejka - reg. 541681\n\ncisla mame spravne alebo teda aspon v spravnom tvare, dlzka sms bola 2, a status po odoslani sa zobrazil \"failed\". nemali sme nikdy problems odosielanim dlhsich sms, tka neviem ci je to tym,a le nenasla som v profiloch ze by mali vypnute smsky ssage to that group separately\n\n\nTrial bookings are treated as a separate audience, so they must be messaged apart from active enrolments.\n\n\nYou can also view and reply to WhatsApp conversations in Communication → WhatsApp → Conversations.", "cited": ["WhatsApp FAQ | Zooza Help", "Email and Communication FAQ | Zooza Help", "WhatsApp | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help sending a WhatsApp message to a trial client, I’m here to help. Would you like to share what you see when you try to select WhatsApp or the trial client?", "cited": []}, {"role": "customer", "who": "Sabeena Kondogeorgis", "text": "where can i see what data and time a client has booked for a trial?#", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Sabeena, you can see this in the booking detail for that client.\n\n\n\n\n- Go to Clients → Bookings\n\n\n- Open the client’s trial booking\n\n- In the booking detail you will see the trial timeline, which includes the trial session date and when the trial booking was created.  \n\n\nYou can also open the client’s profile and check the Bookings tab to view the class date and time for that trial.", "cited": ["Trial Classes FAQ | Zooza Help", "Bookings | Zooza Help", "Where to find things in Zooza — quick reference | Zooza Help", "Clients | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help finding the trial booking date or time, I’m here to assist. Would you like to share what you see in Zooza when you open the client’s booking?", "cited": []}, {"role": "customer", "who": "Sabeena Kondogeorgis", "text": "where can i change the number of sessions shown for trials on my website?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Sabeena, you can change this i sessions, but cannot access programme‑level configuration.  \n\n\nProgramme Settings are only visible to roles that have programme access. \n\n\nIf you need to change trial settings for the Saturday programme, an admin or assistant role would need to open Programmes → select the programme → Edit Settings and then the Trial tile.", "cited": ["Roles and Permissions FAQ | Zooza Help", "User roles | Zooza Help", "Programme Settings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help accessing the Saturday programme’s settings, I’m here to assist. Would you like to share what you see when you open the Programmes section?", "cited": []}, {"role": "customer", "who": "Sabeena Kondogeorgis", "text": "connect to AI", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Sabeena, you can connect Zooza to AI (Claude or ChatGPT) using the Zooza AI Assistant connector. \n\n\nSteps:\n\n\n\n\n- Open Claude.ai\n\n- Go to Settings → Connectors\n\n\n- Click Add connector\n\n\n- Enter:\n• Name: Zooza\n• URL: https://mcp.zooza.app/mcp\n\n\n- Click Save and sign in with your Zooza account. \n\n\nOnce connected, the AI can access your account data and help with tasks like reports, attendance, messaging clients, or setting up classes.\n\n\nIf you connect Zooza to Claude or ChatGPT (Zooza AI Assistant in the main menu), it can do this directly in your account — see https://help.zooza.online/setup/claude-plugin/.", "cited": ["Connect Zooza to Claude or ChatGPT (Zooza AI) | Zooza Help", "Zooza AI FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help connecting Zooza to an AI assistant, I’m here to help. Would you like to share what you’re trying to do next?", "cited": []}], "verdict": "gap", "vtitle": "Can I message a client from Zooza (asked 8 times)", "vnote": "The bot cited trial articles. Sending a message to one client is about as basic as it gets, which makes this a findability failure rather than a content gap.", "cat": "comms"}, {"channel": "intercom", "id": "215475977694545", "date": "2026-10-05 20:30", "day": "2026-10-05", "human": true, "bucket": "HUMAN", "reask": 4, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Blocks Configuration and Management | Zooza Help", "Blocks (Term Segments) FAQ | Zooza Help", "Managing client attendance — admin | Zooza Help", "Blocks creation | Zooza Help"], "q": "kde sa nastavia bloky?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Michaela Michalovičová", "text": "kde sa nastavia bloky?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Bloky sa nastavujú na úrovni triedy (Class), nie na úrovni kurzu (Programme). \n\n\nPostup je takýto:\n\n\n\n\n- Otvorte danú Class.\n\n- Pri vytváraní sessions si vyberiete, do ktorého bloku sa daná lekcia zaradí.\n\n- Pri každej lekcii môžete vytvoriť nový blok alebo ju priradiť do existujúceho bloku. \n\n\nBloky sú teda časťami jednej triedy, ktoré môžu mať napr. vlastnú cenu alebo registráciu.\n\n\nAk chcete, môžem vám ešte ukázať typický príklad, kedy sa bloky používajú (napr. pondelok vs. streda v jednej triede).", "cited": ["Blocks Configuration and Management | Zooza Help", "Blocks creation | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak potrebujete ďalšiu pomoc s nastavením blokov v triede, som vám k dispozícii. Chcete bližšie opísať, čo sa snažíte nastaviť alebo pochopiť?", "cited": []}, {"role": "customer", "who": "Michaela Michalovičová", "text": "ako zmeniť dochádzku zo skrytej na štandardnú?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Zmena zo Hidden (skrytá) na štandardný stav sa nedá urobiť. \n\n\nKeď sa klient presunie do iného bloku, systém automaticky označí dochádzku z predchádzajúceho bloku ako Hidden. Data sa nevymažu, ale už sa nezobrazujú ako normálny stav (napr. Attended). \n\n\nTento stav sa nedá neskôr prepnúť späť na štandardný.", "cited": ["Blocks Configuration and Management | Zooza Help", "Blocks (Term Segments) FAQ | Zooza Help", "Managing client attendance — admin | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den pani Michalovicova - AIcko Vas trochu zavadza - ak chcete dochadzku znovu zobrazit mozete to urobit", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ide len o to co chcete dosiahnut", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ak chcete zakaznikovi prehodit cely blok - je tam na to samostatna funkcnost", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ak chcete iba jeden termin odokryt, potom na detaile registracie staci v casti dochadzka najst filter - nechat si zobrazit skrytu dochadzku a bude tam tlacitko Reset. Jeho stlacenim sa dochadzka obnovi", "cited": []}, {"role": "customer", "who": "Michaela Michalovičová", "text": "Dobrý večer prajem, stalo sa mi to asi pri kopírovaní registrácií, že sa to dalo do módu skryté, neviem prečo, chcela aby som to zmeniť hromadne na všetkých termínoch dopredu. Jeden viem, len sa mi to nechce vyklikávať 70 krát", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ta dochadzka sa skryje na tych terminoch, ktore su PO datume registracie. Pri kopirovani si viete povedat k akemu datumu ma byt ta regitsracia platna a to pravdepodobne sposobilo ze boli terminy pred tymto datumom skryte. Pripadne to mozno suvisi s blokmi ak su na tej skupine aktivne - lebo neboli vybrate pri kopirovani.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ak su to bloky - potom by to malo byt jednoduchsie lebo staci toho cloveka priradit do daneho bloku a dochadzka sa nastavi", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Je to 70 terminov na registracii, ci 70 registracii?", "cited": []}, {"role": "customer", "who": "Michaela Michalovičová", "text": "Ďakujem 70 termínov na registrácii ale registácii je viac, niekde to je skryté, niekde nie. Môže byť, že to súvisí s tými blokmi", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Tak potom skuste pozriet ci viete tu dochadzku obnovit priradenim cloveka do bloku (robi sa to bud priamo na detaile registracie v karte skupina, alebo na detaile dochadzky). Tam ak priradite cloveka do bloku tak by mu mal kompletne vsetky terminy v tom bloku obnovit", "cited": []}], "verdict": "gap", "vtitle": "Hidden attendance comes back by putting the person into the block", "vnote": "Direct follow-on from what we published last week. Attendance is hidden on sessions AFTER the registration date, which is what a copy with a later valid-from date causes; and where blocks are active, assigning the person to the block restores every session in it. Done from the registration's class card or from the attendance detail. Our new section explains why sessions hide but stops short of this route.", "cat": "makeups"}, {"channel": "intercom", "id": "215476255348326", "date": "2026-10-05 20:18", "day": "2026-10-05", "human": false, "bucket": "D_assumed_with_kb", "reask": 4, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Documents | Zooza Help", "User roles | Zooza Help", "Documents | Zooza Help", "Class Detail | Zooza Help", "Embed videos — Vimeo setup for client access | Zooza Help"], "q": "ako nahram video vizitku lektora", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": "Petronela Ševčíková", "text": "ako nahram video vizitku lektora", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Petronela, video „vizitku“ lektora môžete nahrať prostredníctvom sekcie Documents a potom ju priradiť k programu, skupine alebo termínu.\n\n\nPostup:\n\n\n\n\n- V ľavom menu otvorte Products & Services → Documents. \n\n\n- Kliknite na Add New.\n\n- Zvoľte kategóriu Video.\n\n- Nahráte súbor cez Browse → Upload a uložte. \n\n\nPotom video môžete priradiť:\n\n\n\n\n- k programu – všetci klienti v programe ho uvidia\n\n- k skupine – iba klienti v tejto skupine\n\n- k termínu – iba klienti na tomto termíne \n\n\nKlienti ho potom uvidia vo svojom Client Profile a môžu ho spustiť z náhľadového obrázku.", "cited": ["Documents | Zooza Help", "Documents | Zooza Help", "Embed videos — Vimeo setup for client access | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Hledali jste tohle?", "cited": []}, {"role": "customer", "who": "Petronela Ševčíková", "text": "mam to v slovencine", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Samozrejme — v slovenskej verzii to robíte takto:\n\n\n\n\n- V ľavom menu otvorte Products & Services → Documents. \n\n\n- Kliknite na Add New.\n\n- V kategórii Category vyberte Video.\n\n- Nahráte súbor cez Browse → Upload a uložte. \n\n\nPotom video môžete priradiť k programu, skupine alebo termínu, aby ho klienti videli vo svojom profile.", "cited": ["Documents | Zooza Help", "Documents | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Dostali jste odpověď na svou otázku?", "cited": []}, {"role": "customer", "who": "Petronela Ševčíková", "text": "a ako ho potom nahram k lektorovi", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Petronela, video sa neprirádza priamo k lektorovi.\n\n\nV Zooza sa videá pridávajú na tieto úrovne:\n\n\n\n\n- program\n\n- skupina\n\n- termín (hodina)\n\nKlienti ho potom uvidia vo svojom profile.\n\n\nNajčastejšie to robíte na úrovni skupina:\n\n\n\n\n- otvorte skupinu\n\n- nájdite sekciu Documents\n\n\n- kliknite Add → Video\n\n\n- vyberte video z knižnice a uložte\n\n\nTýmto sa video stane dostupným pre klientov v tejto skupine. Priamo na profil lektora sa video priradiť nedá.", "cited": ["Documents | Zooza Help", "Embed videos — Vimeo setup for client access | Zooza Help", "Class Detail | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Pomohlo vám to?", "cited": []}, {"role": "customer", "who": "Petronela Ševčíková", "text": "a ako viem ze lektor ma nahrate video", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Petronela, jednoducho to skontrolujete v sekcii Documents.\n\n\n\n\n- V ľavom menu otvorte Documents.\n\n- Použite filter Type filter → Video.\n\n- Kliknite na Search.\n\nVidíte zoznam všetkých videí (názov, dátum a typ „video“).\n\n\nPri nahrávaní sa tiež zobrazí potvrdzovacia správa, že video bolo úspešne nahrané.\n\n\nAno — lektor môže videá nahrávať a prirádzať ich k triedam alebo termínom.", "cited": ["Documents | Zooza Help", "Documents | Zooza Help", "User roles | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Pomohlo to?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc s overením nahraného videa, som tu pre vás. Chcete opísať, čo sa snažíte ešte skontrolovať alebo nastaviť?", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215476237573850", "date": "2026-10-05 19:25", "day": "2026-10-05", "human": true, "bucket": "HUMAN", "reask": 0, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": [], "q": "Dobrý den prosím Vás nahradzovala som nový kurz \n\n\n\nFyziokid 6-9 rokov a cenu kurzu som dala 52 € / mesiac ale vypisuje mi tam dlh nejakých 23.11€ neviem to zmeniť ani neviem kde som to nastavila. Pri registrácii klientom ukazuje sumu 23.11 € namiesto 52 ale cena je v nastaveniach kurzu 52 € \n\nOdoslané z iPhonu", "turns": [{"role": "customer", "who": "Michala Pukalovic", "text": "Dobrý den prosím Vás nahradzovala som nový kurz \n\n\n\nFyziokid 6-9 rokov a cenu kurzu som dala 52 € / mesiac ale vypisuje mi tam dlh nejakých 23.11€ neviem to zmeniť ani neviem kde som to nastavila. Pri registrácii klientom ukazuje sumu 23.11 € namiesto 52 ale cena je v nastaveniach kurzu 52 € \n\nOdoslané z iPhonu", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, \n\n\ndakujeme za napisanie. \n\n\nJe to kvoli alikvóte, v skupine do jej konca zostavaju 4 terminy, Suma sa pocita: 52eur delo 9 termínov krát 4 zostávajúce.\n\n\n\nAko by ste chceli to nastaviť? Je možné stále pýtať aj sumu 52 eur. \n\n\nDajte vediet, radi poradime.\n\nNastavuje sa to tu: https://zooza.app/#courses/9884/settings?edit=price", "cited": []}, {"role": "customer", "who": "Michala Pukalovic", "text": "Jedna sa o mesačný kurz, teda iba 4 hodiny. Kurz od 10.-31.10. Preto ma byt suma 52 € / 12 € hodina. Vidím aj že tam máme len 4 termíny nahodene nie 9 termínov \n​\n\n\nOdoslané z iPhonu\nDňa 5. 10. 2026 o 10:33 užívateľ Tech from Zooza \u003csupport@zooza.online> napísal:\n​", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, \n\n\ntak iba napiste ako by ste to chceli, aby to klienti videli a my to pomozeme nastavit. \n\n\n4*12 per hodina je spolu 48 eur. \n\n\n\n\n\nCena moze byť 48 alebo 52 eur mesacne. Bude tato skupina pokracovat aj v novembri? Ked sa niekto prihlasi buduci tyzden, ma platil uz len za zostavajuce terminy napr. 3*12? \n\n\n\n\n\nvidime to trochu inak v detaile tej skupiny, ta skupina zacala 5. 9. 2026 podla tych terminov v detaile skupiny. \n\n\nhttps://zooza.app/#courses/schedules/105142\n\n\n\n\n\nAle pomozeme to nastavit tak ako budete potrebovat.", "cited": []}, {"role": "customer", "who": "Michala Pukalovic", "text": "Pardon 13 €/ lekcia. Dala som tam fakturačné obdobie sep - okt tak asi preto. \n\n\nČiže suma 52 € za kurz 4 hodiny a ano keď sa prihlási neskôr bude mať nižšiu cenu o danú hodinu \n​\n\n\nOdoslané z iPhonu\nDňa 5. 10. 2026 o 12:34 užívateľ Tech from Zooza \u003csupport@zooza.online> napísal:\n​", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobre, super, mate to tak nastavene.", "cited": []}, {"role": "customer", "who": "Michala Pukalovic", "text": "Ďakujem pekne \n​\n\n\nOdoslané z iPhonu\nDňa 5. 10. 2026 o 19:37 užívateľ Tech from Zooza \u003csupport@zooza.online> napísal:\n​", "cited": []}], "verdict": "gap", "vtitle": "A 52 EUR monthly class quoting 23.11 EUR — pro-rata explained", "vnote": "52 divided by 9 sessions times the 4 that remain. Clean worked example of pro-rata for someone joining mid-course, and the team offered to set it either way. We cover late bookings but not this arithmetic in a form an admin can repeat.", "cat": "pricing"}, {"channel": "intercom", "id": "215476245614959", "date": "2026-10-05 18:46", "day": "2026-10-05", "human": true, "bucket": "HUMAN", "reask": 3, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Message Templates | Zooza Help", "Automatic reminders for payment schedule | Zooza Help", "Message templates — automatic and manual emails | Zooza Help"], "q": "Dobrý deň potrebujem upraviť text notifikačného mailu ktorý chodí klientom s informáciami na úhradu ale neviem kde", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": "Barbora Kubíková", "text": "Dobrý deň potrebujem upraviť text notifikačného mailu ktorý chodí klientom s informáciami na úhradu ale neviem kde", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Tento text môžete upraviť v šablónach správ.\n\n\n\n\n- Pôjdite do Communication → Message Templates.\n\n- Hľadajte šablónu Upcoming Payment (upozornenie na nadchádzajúcu úhradu).\n\n- Túto šablónu otvorte a upravte text emailu. \n\n\nTip: pretože je to systémová šablóna, odporúča sa skopírovať ju a upraviť kopiu, aby ste nezničili pôvodnú verziu.", "cited": ["Automatic reminders for payment schedule | Zooza Help", "Message templates — automatic and manual emails | Zooza Help", "Message Templates | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Hledali jste tohle?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Barbora, len upresnim, ze takychto emailov posielame viac druhov. Ak ide o potvrdenie o registracii potom to je ina sablona https://zooza.app/#communication/templates?type=registration_done", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Pripadne ak ide o splatkove kalendare potom to bude tato: https://zooza.app/#communication/templates?type=new_payment_created", "cited": []}, {"role": "customer", "who": "Barbora Kubíková", "text": "potrebujem pridať informáciu že QR code sa nachádza v profile a aj som našla takú šablónu kde sa môže klient priamo prekliknúť do svojho profilu to by som chcela mať vo všetkých šablónach kde príde informácia k platbe len neviem či stačí pridať text a odkaz na link", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "QR kod mozete poslat aj priamo do emailu. v principe na kazdej obrazovke kde mozete upravovat sablony mate v pravej casti zoznam vsetkych dynamickych znaciek spolu aj s ukazkou, ako dana znacka vyzera. Odkaz priamo do profilu je dynamicka znacka WIDGET_PROFILE_URL a QR kod: QR_CODE", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Obe znacky mozete pouzit v kazdom jednom emaily, ktory sa odosiela priamo na registraciu", "cited": []}, {"role": "customer", "who": "Barbora Kubíková", "text": "výborne jednoduchšie bude pridať QR code dakujem", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Nech sa paci, radi sme pomohli:)", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215475995067098", "date": "2026-10-05 14:35", "day": "2026-10-05", "human": true, "bucket": "HUMAN", "reask": 1, "resolution": "assumed_resolution", "rating": nul , "reask": 1, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Discounts and Sibling Pricing FAQ | Zooza Help", "Discount code | Zooza Help", "Discounts | Zooza Help", "Sibling Discount | Zooza Help"], "q": "je už možné v Zooze nahodiť zľavu hromadne pre viacero registrácií?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "je už možné v Zooze nahodiť zľavu hromadne pre viacero registrácií?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Aktuálne hromadné uplatnenie zľavy na viacerých existujúcich registráciách v Zooze nie je podporované.\n\n\nMožnosti, ktoré existujú:\n\n\n\n\n- \nDiscount code – klienti môžu kód použiť pri platbe v Client Profile na existujúcej registrácii.  \n\n\n- \nPayment plan s built‑in discountom – zľava sa aplikuje pri registrácii. \n\n\nZľavy sa spravujú v Sales & Payments → Discounts.", "cited": ["Discounts and Sibling Pricing FAQ | Zooza Help", "Sibling Discount | Zooza Help", "Discount code | Zooza Help", "Discounts | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc so zľavou pre viacero registrácií, rada vám pomôžem. Chcete doplniť, čo presne sa snažíte nastaviť alebo vyriešiť?", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215473449555017", "date": "2026-10-05 11:20", "day": "2026-10-05", "human": false, "bucket": "D_assumed_with_kb", "reask": 9, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Invoices", "API overview | Zooza Developer Docs", "Authentication | Zooza Developer Docs", "Concepts & glossary | Zooza Developer Docs", "Get all customer invoices | Zooza Developer Docs", "Get Download URL for multiple invoices at once | Zooza Developer Docs", "Deploying Zooza app on your website | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Quickstart | Zooza Developer Docs"], "q": "Jak stáhnout všechny faktury ve formátu xml najednou?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Jarmila  Čerenská", "text": "Jak stáhnout všechny faktury ve formátu xml najednou?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ano — hromadné stažení faktur je možné v Prodeje a platby → Faktury přes tlačítko Stáhnout vše. Tím se stáhnou všechny vyfiltrované faktury jako jeden ZIP balíček.\n\n\nV dostupném návodu ale není uvedeno, že by šlo v rozhraní stáhnout všechny faktury najednou přímo jako XML. V přehledu faktur je popsané hromadné stažení a export seznamu, ne hromadný XML export.\n\n\nPokud to chcete řešit přes API, je k dispozici:\n\n\n\n\n- seznam faktur přes GET /v1/customer_invoices\n\n\n- hromadné získání download URL přes GET /v1/customer_invoices/download?invoices=ID1,ID2,...&name=nazev_souboru\n\n\nJestli chcete, můžu hned ukázat i konkrétní API postup pro stažení všech faktur v dávce.", "cited": ["Invoices", "Get all customer invoices | Zooza Developer Docs", "Get Download URL for multiple invoices at once | Zooza Developer Docs"]}, {"role": "bot", "who": "Zooza Support", "text": "Pokud potřebujete další pomoc s hromadným stažením faktur nebo s API, rád vám pomohu. Můžete mi prosím sdělit, co přesně byste chtěl dále vyřešit nebo pochopit?", "cited": []}, {"role": "customer", "who": "Jarmila  Čerenská", "text": "Děkuji, to je vše", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Děkuji za zprávu! Kdybyste potřeboval cokoli dalšího, jsem tu pro vás.", "cited": []}, {"role": "customer", "who": "Jarmila  Čerenská", "text": "a jak pouzijem to api?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Používá se Zooza REST API ve dvou krocích:\n\n\n\n\n- \nZískat seznam faktur\n• Endpoint: GET /v1/customer_invoices\n• Pošlete požadavek s hlavičkou X-ZOOZA-API-KEY (API klíč).\n\n\n- \nStáhnout soubory\n• Endpoint: GET /v1/customer_invoices/download\n• Parametry:\n • invoices – seznam ID faktur oddělených čárkou\n • name – název souboru bez přípony\n• Odpověď vrátí download URL, ze které soubory stáhnete.\n\n\nAPI klíč najdete v Settings → Registration forms.\n\n\nTento přístup se používá pro hromadný export faktur (např. pro účetní systémy).", "cited": ["Payments and Billing FAQ | Zooza Help", "Get all customer invoices | Zooza Developer Docs", "Get Download URL for multiple invoices at once | Zooza Developer Docs", "Quickstart | Zooza Developer Docs"]}, {"role": "bot", "who": "Zooza Support", "text": "Hledali jste tohle?", "cited": []}, {"role": "customer", "who": "Jarmila  Čerenská", "text": "ok, ale ako to mam ty zooze poslat?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Pošlete to jako HTTP požadavek na Zooza API (např. přes cURL, Postman, Python atd.).\n\n\nZákladní tok:\n\n\n\n\n- \nZískat token\nPOST https://api.zooza.app/v1/login\nHeaders:\nContent-Type: application/json\nX-ZOOZA-API-KEY: váš_api_key\n\n\nTělo obsahuje váš login a client_secret. Odpověď vrátí token.\n\n\n- \nZískat seznam faktur\nGET https://api.zooza.app/v1/customer_invoices\nHeaders:\nX-ZOOZA-API-KEY\nX-ZOOZA-TOKEN\nX-ZOOZA-COMPANY\n\n\n\n\n\n- \nStáhnout soubory\nGET https://api.zooza.app/v1/customer_invoices/download?invoices=ID1,ID2&name=faktury\nHeaders:\nX-ZOOZA-API-KEY\nX-ZOOZA-TOKEN\nX-ZOOZA-COMPANY\n\n\nOdpověď vrátí download URL, ze které soubory stáhnete.\n\nKlíč API najdete v Settings → Registration forms.", "cited": ["Quickstart | Zooza Developer Docs", "API overview | Zooza Developer Docs", "Get Download URL for multiple invoices at once | Zooza Developer Docs", "Get all customer invoices | Zooza Developer Docs"]}, {"role": "bot", "who": "Zooza Support", "text": "Dostali jste odpověď na svou otázku?", "cited": []}, {"role": "customer", "who": "Jarmila  Čerenská", "text": "co je cURL?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "cURL je jednoduchý nástroj v příkazové řádce, který slouží k odesílání HTTP požadavků na API.\n\n\nPoužívá se k tomu, abyste z terminálu zavolali Zooza API a získali data (např. token, seznam faktur atd.).\n\n\nPříklad:\n\n\ncurl -X POST https://api.zooza.app/v1/login \\\n-H \"Content-Type: application/json\" \\\n-H \"X-ZOOZA-API-KEY: váš_api_key\" \\\n-d '{\n  \"login\": \"vaše@email.cz\",\n  \"verification_method\": \"client_secret\",\n  \"client_secret\": \"vaše_client_secret\"\n}'\nTímto způsobem pošlete požadavek na API a dostanete odpověď (např. token).\n\n\n\nSource:\nQuickstart | Zooza Developer Docs", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Pomohlo to?", "cited": []}, {"role": "customer", "who": "Jarmila  Čerenská", "text": "tak ako to mam cele udelat cez curl? Napis presny command", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Tady je kompletní příklad přes cURL (Evropa):\n\n\n\n\n- Získat token\n\ncurl -X POST https://api.zooza.app/v1/login \\\n-H \"Content-Type: application/json\" \\\n-H \"Accept: application/json\" \\\n-H \"X-ZOOZA-API-KEY: VÁŠ_API_KEY\" \\\n-d '{\n  \"login\": \"VÁŠ_EMAIL\",\n  \"verification_method\": \"client_secret\",\n  \"client_secret\": \"VÁŠ_CLIENT_SECRET\"\n}'\nOdpověď vrátí token. \n\n\n\n\n- Získat ID společnosti\n\ncurl -X GET https://api.zooza.app/v1/user \\\n-H \"X-ZOOZA-API-KEY: VÁŠ_API_KEY\" \\\n-H \"X-ZOOZA-TOKEN: VÁŠ_TOKEN\"\nZ odpovědi vezměte user.companies[].id. \n\n\n\n\n- Získat seznam faktur\n\ncurl -X GET https://api.zooza.app/v1/customer_invoices \\\n-H \"X-ZOOZA-API-KEY: VÁŠ_API_KEY\" \\\n-H \"X-ZOOZA-TOKEN: VÁŠ_TOKEN\" \\\n-H \"X-ZOOZA-COMPANY: VÁŠ_COMPANY_ID\"\nTento endpoint vrací seznam faktur. \n\n\n\n\n- Stáhnout soubory faktur\n\ncurl -X GET \"https://api.zooza.app/v1/customer_invoices/download?invoices=ID1,ID2&name=faktury\" \\\n-H \"X-ZOOZA-API-KEY: VÁŠ_API_KEY\" \\\n-H \"X  spraviť? Bez ohľadu na termíny, ktorých bude okolo 80 \n\n\n-- \n​\n\n\nS pozdravom\nEva Kleberc\nKid Genius\nŠtúrová 1\n903 01 Senec\n+421 917 091 618\nwww.kidgenius.sk\nFb: KID Genius Senec\n​", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Neviete nechat system vypocitavat platby bez toho aby to nemalo nadvaznost na terminy. Vypocitat jednotkovu sumu nie je problem aj ked je tych terminov 80. Jedina mozna cesta ak chcete ludi nechat platit postupne - v mesacnych platbach alebo v kvartalnych je mat suvis medzi cenou a terminmi. Inak system nebude vediet vypocitat zakaznikovi cenu po zaciatku kurzu.\n\n\nMate tieto tri moznosti\n\n\n\n\n- Nechat ludi platit 990 eur v jednej platbe - vtedy je jedno kolko terminov tam mate, pretoze system bude od vas pozadovat celu cenu za kurz a nie cenu za termin\n\n- Nechat ludi platit 990 eur v splatkach (mesacnych, kvartalnych...) za pouzitia kurzovneho - vtedy musite uvadzat jednotkovu cenu. Pre 80 terminov to bude 12,375 eura za termin. V pripade ak neviete v tejto chvili kolko tych terminov bude, mozete pouzit presne tu funkciu, ktoru sme uz rozoberali - platene terminy. V aplikacii si nahodite tie terminy, o ktorych uz viete ze v skupine budu - povedzme 80 - oznacite ich ako platene a na skupine uvediete ze ma mat 80 platenych terminov. Ak potom pridate do skupiny dalsich 5-6 terminov, tieto uz nebudu mat vplyv na cenu.\n\n- Nechat ludi platit Xeur v mesacnych platbach - cez clenske. Vtedy system tiez nezohladnuje terminy v zmysle celkovej ceny, ale tak ci onak budete potrebovat zadavat cenu za termin, aby system vedel vypocitat alikvotnu ciastku v pripade, ze niekto nastupi po zaciatku kurzu.\n\ns pozdravom\n\n\nMartin", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, \n\n\ndajte vediet, ci posledna sprava pomohla. Alebo mate este otvorene otazky k tejto teme. Dakujeme,", "cited": []}, {"role": "customer", "who": "Eva Kleberc", "text": "Pekný deň,\n\n\nchcela by som sa opýtať, vedeli by sme zrušiť z online prihlášky riadky ako od do, lektor a cena? Alebo mi poslať manuál ako to viem spraviť sama? Tie nešťastne nastavené ceny nám dosť odrádzajú klientov. Ďakujem \n\n\n\n​\n\n\n---\n​\n\n\nS pozdravom\nEva Kleberc\nKid Genius\nŠtúrová 1\n903 01 Senec\n+421 917 091 618\nwww.kidgenius.sk\nFb: KID Genius Senec\n​\n\n\n\n​", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobrý deň, Eva,\n\n\nriadky Od, Do a Lektor sme v online prihláške skryli a cena sa už nezobrazuje. Prosím, skontrolujte si to na stránke.\n\n\nZároveň by sme vám radi pomohli s nastavením cien. Pri niektorých skupinách to vyzerá, že platby nie sú nastavené správne, a aj to môže odrádzať klientov. Ak vám to vyhovuje, rezervujte si prosím stretnutie na túto stredu a spolu si vaše platby prejdeme a nastavíme ich: https://meetings-eu1.hubspot.com/zooza\n​\n\n\nS pozdravom", "cited": []}, {"role": "customer", "who": "Eva Kleberc", "text": "Pekný deň,\n\n\nrezervovala som si termín na stredu \n\n\nĎakujem \n​\n\n\nS pozdravom\nEva Kleberc\nKid Genius\nŠtúrová 1\n903 01 Senec\n+421 917 091 618\nwww.kidgenius.sk\nFb: KID Genius Senec\n​\n\n\n\n​", "cited": []}], "verdict": "gap", "vtitle": "Paid sessions: setting N on the class flips the whole class into opt-in mode", "vnote": "The best general explanation of the week. By default every session counts as paid. The moment you tell a class it has N paid sessions, the app switches into a mode where a session only counts if it is flagged as paid — so N=10 with nothing flagged gives a price of zero. Fix either way: flag ten sessions by bulk change, or set the count back to 0. The same thread also lays out the three pricing shapes (one payment / instalments needing a unit price / membership) and why a unit price is unavoidable once anyone joins mid-course.", "cat": "pricing"}, {"channel": "intercom", "id": "215476244780067", "date": "2026-10-05 10:04", "day": "2026-10-05", "human": false, "bucket": "D_assumed_with_kb", "reask": 3, "resolution": "confirmed_resolution", "rating": null, "carried": null, "sources": ["Managing client attendance — admin | Zooza Help", "Attendance and Catch-up Classes FAQ | Zooza Help", "Bookings | Zooza Help", "Make-up Sessions — Complete Guide | Zooza Help"], "q": "jak mohu dokoncit/odkliknou dochazku (jiz ukoncene lekce)", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": "Beata Dubová", "text": "jak mohu dokoncit/odkliknou dochazku (jiz ukoncene lekce)", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Beata, docházku můžete „odkliknout“ i u již ukončených lekcí – systém to umožňuje kdykoli. \n\n\nNejrychlejší cesta:\n\n\n\n\n- Přejděte do Calendar (Kalendář)\n\n\n- Klikněte na danou lekci (session)\n\n- Otevře se panel docházky\n\n- U každého klienta klikněte na stav: Attended, Cancelled nebo Did not attend \n\n\nTip: v Quick view můžete kliknout na Mark all as attended a pak jen opravit ty, kteří nepřišli.\n\n\nStav můžete měnit i později a kolikrát chcete.", "cited": ["Managing client attendance — admin | Zooza Help", "Attendance and Catch-up Classes FAQ | Zooza Help", "Bookings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Hledali jste tohle?", "cited": []}, {"role": "customer", "who": "Beata Dubová", "text": "ono staci pouze oznacit jestli klient prisel ci ne?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ano, stačí. \n\n\n\n\n- \nAttended – klient přišel\n\n- \nDid not attend – klient nepřišel\n\nTyto dva stavy úplně stačí pro evidenci docházky. \n\n\nDruhý stav Cancelled slouží jen v případě, že klient zrušil účast předem a může mít nárok na náhradní lekci.\n\n\nA pokud nic neoznačíte, systém po skončení lekce automaticky nastaví Did not attend.", "cited": ["Managing client attendance — admin | Zooza Help", "Attendance and Catch-up Classes FAQ | Zooza Help", "Make-up Sessions — Complete Guide | Zooza Help"]}, {"role": "bot" ot be deleted — credit notes instead", "vnote": "Deleting would break the numbering sequence and lose the accounting record, so the standard route is a credit note. A zero-value invoice is the accountant's call. Short, legal-adjacent, and we get asked it repeatedly.", "cat": "payments"}, {"channel": "intercom", "id": "215476065202343", "date": "2026-10-05 08:13", "day": "2026-10-05", "human": true, "bucket": "HUMAN", "reask": 3, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Getting Started with Zooza | Zooza Help", "Common Booking Scenarios | Zooza Help", "Registration and Booking FAQ | Zooza Help", "Roles and Permissions FAQ | Zooza Help", "Role Selection Guide | Zooza Help", "Sending email/SMS to clients | Zooza Help", "Instructor Access and Roles FAQ | Zooza Help", "Bookings | Zooza Help"], "q": "how can I delete cancelled bookings", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Sabeena Kondogeorgis", "text": "how can I delete cancelled bookings", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can remove them by changing the booking status to Deleted.\n\n\nSteps:\n\n\n\n\n- Go to Bookings\n\n\n- Open the booking Detail\n\n\n- Change the status to Deleted\n\n\nThis frees the spot and removes the booking from the active list, but the record is still kept in the CRM under the Deleted bookings filter for reference. \n\n\nNote: Cancelled bookings are kept in the system to preserve history, so they remain visible unless you delete them.", "cited": ["Getting Started with Zooza | Zooza Help", "Registration and Booking FAQ | Zooza Help", "Common Booking Scenarios | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help managing cancelled bookings, I’m here to help. Would you like to share more about what you’re trying to resolve?", "cited": []}, {"role": "customer", "who": "Sabeena Kondogeorgis", "text": "where do I write the message to the client", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You write the message from the booking itself.\n\n\n\n\n- Go to Bookings\n\n\n- Open the client’s booking\n\n- Go to the Communication tab\n\nThere you can:\n\n\n\n\n- Click Send email or Send SMS\n\n\n- Write the message in the editor\n\n- Click Send\n\n\nThe client’s email or phone number fills in automatically.", "cited": ["Bookings | Zooza Help", "Sending email/SMS to clients | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Sabeena Kondogeorgis", "text": "It is greyed out - how to I start to type", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If the message field is greyed out, it usually means your role does not have permission to send emails or SMS. \n\n\nIn that case, an admin needs to change your role or enable messaging for instructors.\n\n\n\n\n- Go to Settings → Team → Access\n\n\n- Select your user\n\n- Change your role to Instructor (or another role with communication access)\n\n- Save\n\nInstructors with the right role can send email and SMS from the Communication tab in the booking. \n\n\nIf you want, you can also check whether messaging is enabled for instructors in Settings → Team → Settings.", "cited": ["Instructor Access and Roles FAQ | Zooza Help", "Bookings | Zooza Help", "Role Selection Guide | Zooza Help", "Roles and Permissions FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Does this clarify things?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help with the greyed-out message field, I’m here to help. Would you like to share more about what you see on the booking screen?", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Sabeena,\n\n\nThis is Michal from the Zooza team. I'm following up on your chat from last night about the message field being greyed out.\n\n\nIs this still happening? If so, could you tell me what you're trying to do? For example: an email to one client, or a message to a whole class. A quick screenshot of the screen would help a lot too.\n\n\nA greyed-out field usually means something isn't fully set up for sending yet, such as the sender details. It's rarely a problem with your account itself, so it's normally a quick fix once we know which one it is.\n\n\nHappy to help!\n\n\nMichal", "cited": []}], "verdict": "check", "vtitle": "Message field greyed out", "vnote": "Michal asked for detail; no reply yet. The suggested cause — sender details not fully set up — would be worth a troubleshooting line if confirmed.", "cat": "comms"}, {"channel": "intercom", "id": "215476243309515", "date": "2026-10-05 07:27", "day": "2026-10-05", "human": false, "bucket": "D_assumed_with_kb", "reask": 1, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Login and Account FAQ | Zooza Help", "Settings | Zooza Help", "Change the language in Zooza | Zooza Help"], "q": "Ako amenities jazyk?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Чим я можу допомогти?", "cited": []}, {"role": "customer", "who": "Yulianna", "text": "Ako amenities jazyk?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "„Amenities“ v Zooze je jazyk komunikácie s klientmi – jazyk, v ktorom systém píše rodičom a registrovaným ľuďom. \n\n\nTento jazyk sa nastavuje v Settings → General → Application Communication Language a používa sa pre:\n\n\n\n\n- oznámenia\n\n- emaily\n\n- WhatsApp správy\n\n- potvrdenia a upomienky \n\n\nJe to spoločné nastavenie pre celú spoločnosť.\n\n\nDôležité: tento jazyk nezmení jazyk vášho admin rozhrania – ten si každý admin alebo instruktor mení samostatne vo svojom profile.", "cited": ["Login and Account FAQ | Zooza Help", "Change the language in Zooza | Zooza Help", "
