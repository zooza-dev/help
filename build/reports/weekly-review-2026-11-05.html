tomatically after they pay.", "cited": ["Client Profile FAQ | Zooza Help", "Client Profile 101 | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Children's Group Activities — Monthly Subscription Model | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was that helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help with parent payments or the failed payment, I’m here to help. Would you like to share more about what you’re trying to resolve?", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Kieran,\n\n\nRegarding the failed payment, I'd first check why it failed in GoCardless.\n\n\nThere could by few scenarios, for example:\n\n\n\n\n- \nInsufficient funds: You can reschedule the payment date in the customer's booking/payment plan so GoCardless can attempt to collect it again.\n\n- \nInvalid or inactive mandate: The parent will need to log into their Parent Profile and set up their Direct Debit details again.\n\nSo I'd start by checking the failure reason before trying to collect the payment again.\n\n\nHope that helps! 😊", "cited": []}], "verdict": "check", "vtitle": "GoCardless payment failed — check the reason first", "vnote": "Insufficient funds means reschedule the payment date so GoCardless retries; an invalid or inactive mandate means the parent re-enters their Direct Debit in the portal. This went into gocardless-faq in May and September. Confirm it reads this way and move on. Note the answer does not address the question that was asked, which was about deleting a session for an unavailable venue.", "cat": "payments"}, {"channel": "intercom", "id": "215476528930998", "date": "2026-11-03 08:52", "day": "2026-11-03", "human": true, "bucket": "HUMAN", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Block pricing with AI\n\nPlease will you allow the AI integration to adjust block pricing?", "turns": [{"role": "customer", "who": null, "text": "Block pricing with AI\n\nPlease will you allow the AI integration to adjust block pricing?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dear Danielle,\n\n\nyour ticket  has been received. Zooza Assistant will try to help you right away — and a member of our team will personally review it too.\n\n\n— Zooza Support", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Sarah,\n\n\nQuick update on this one: we're actively working on it. The tricky part is making block pricing something the AI can adjust reliably and consistently, in a way the model properly understands, so we don't yet have a solution we'd trust to put live. We're on it, and I'll come back to you the moment we have something solid.\n\n\nBest,", "cited": []}], "verdict": "product", "vtitle": "Let the AI adjust block pricing", "vnote": "Actively being worked on, no solution trusted enough to ship. Roadmap, not KB. Do not write 'coming soon' into the help.", "cat": "ai"}, {"channel": "intercom", "id": "215476659128078", "date": "2026-11-03 08:51", "day": "2026-11-03", "human": true, "bucket": "HUMAN", "reask": 16, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": ["Dynamic tags | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Automatic reminders for payment schedule | Zooza Help", "Invoicing in Zooza — Overview | Zooza Help", "Set up invoice profiles and bank accounts | Zooza Help"], "q": "We need to remove the QR code from payment requests but can't see where it is included.", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "We need to remove the QR code from payment requests but can't see where it is included.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Sarah, the QR code comes from  *|QR_CODE|* and the billing profile has IBAN and SWIFT/BIC filled in. If the tag is not in the template, the QR code should not appear in that email.  \n\n\nThe Missed payment reminder is edited in Communication → Message Templates under the template titled Missed payment. \n\n\nOne other possibility: if the client received a Zooza Invoice (beta) instead of the reminder email, invoices include a QR payment code automatically. \n\n\nCould you confirm whether the client received the Missed payment email or a Zooza invoice with the QR code?", "cited": ["Dynamic tags | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Automatic reminders for payment schedule | Zooza Help", "Invoicing in Zooza — Overview | Zooza Help"]}, {"role": "customer", "who": "Sarah Marsh", "text": "Missed payment", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thanks for confirming, Sarah.\n\n\nFor the Missed payment reminder, the QR code can only appear if the template contains the tag *|QR_CODE|*. If that tag is not in the template, the QR code should not be generated in that email.  \n\n\nOne other documented reason: QR codes currently generate only for accounts in SEPA markets (e.g. SK, CZ). If the account is based in another region, the tag may not generate a QR image even if it exists. \n\n\nSo if the client definitely received the Missed payment email and the template has no *|QR_CODE|* tag, the QR code is not coming from that template tag.", "cited": ["Payments and Billing FAQ | Zooza Help", "Dynamic tags | Zooza Help", "Automatic reminders for payment schedule | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was that helpful?", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "No", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I’m sorry this still hasn’t clarified why the QR code was sent. Would you like me to connect you with a human agent, or would you prefer to continue with me and share any additional context about the email?", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "Human", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I’ll pass you to someone. While you’re being connected, please share any details about the email or what happened so they have the relevant context upfront.", "cited": []}, {"role": "human", "who": "Martin", "text": "Hi Sarah, you need to remove the QR Code tag from the email templates?", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "Yes as they don't work.", "cited": []}, {"role": "human", "who": "Martin", "text": "Hm. they should work if bank account is entered in billing profile. Can you send me an example of the QR code that is not working?", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "I also thought that as the payment reminders were disabled for the programmes, chasers would not be sent. I was wrong and all Liverpool parents got missed payment notifications yesterday!", "cited": []}, {"role": "human", "who": "Martin", "text": "Also the qr codes can be removed from any payment related template. Simply navigate to Communication -> Templates and filter out Paymet category", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "That's the thing - QR codes are not in the templates.", "cited": []}, {"role": "human", "who": "Martin", "text": "Ok, lets get down to this. can you send me an example? Who got a qr code?", "cited": []}, {"role": "human", "who": "Martin", "text": "ideally an email address would be great", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "Kelly Godfrey in Liverpool is the person who has messaged to say the QR code did not work. I've not seen one.", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "Kelly.Godfrey@hive-projects.com", "cited": []}, {"role": "human", "who": "Martin", "text": "thank you Sarah, at the same time, did she mention how she tried to scan the qr code? it will not work directly from the camera but it would work if scanned from the banking app", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "No she didn't. I would not think to open my banking app before scanning so I suspect she used her camera. Probably easiest to make sure we are not using QR codes.", "cited": []}, {"role": "human", "who": "Martin", "text": "Hm, but that is the default way how payment QR codes work:)\n\n\nLet me investigate the issue and I'll get back to you", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "Thanks. Maybe it's a UK thing but if we see a QR code we use our camera.", "cited": []}, {"role": "human", "who": "Martin", "text": "I think its just that you're not used to pay by qr code:) nevertheless. I'll get back to you soon", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "ok", "cited": []}, {"role": "human", "who": "Martin", "text": "Here's what I've found - none of the four templates you've already customised has QR_CODE tag. The only two other templates that have this tag by default are order_confirmation and additional_session_payment - none of which are of concern to you at the moment. So my quess is that she tried to scan the qr code from the parent portal. I checked the missed payment notification email and there was no QR code in there. So the only possible path to scanning QR code would be via parent portal.", "cited": []}, {"role": "human", "who": "Martin", "text": "Separate issue is the UX of the qr codes themselves - what we can do is this: add new option for you to toggle the visibility of qr code in the parent portal. However, the QR codes is one of the most commonly used payment method so if the only problem is that people scan them with their cameras, we can add a little nudge below the qr code to explain that payment QR code needs to be scanned with the banking app", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "I would like to be able to toggle the QR codes off, as centres are likely to have parents pay via standing order and a QR code would not work for that.", "cited": []}, {"role": "human", "who": "Martin", "text": "Ok Sarah, we'll implement that. We do have this as a pattern where people do have standing orders and they use qr codes as a backup. However, we'll add that as a new option to profile widget to turn qr codes off.", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "Thanks", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Sarah,\n\n\nGood news - this is now live. You can switch the QR code off yourself in each active account under Team & Settings → Publish → Widgets → Profile, then untick \"Show QR code in payments tab\". That removes it for the centres where parents pay by standing order.\n\n\nIt's set per account, so just do it on the ones that need it, happy to help if you'd like.\n\n\nBest", "cited": []}], "verdict": "gap", "vtitle": "Switch the QR code off in the parent portal", "vnote": "Shipped this week: Team & Settings > Publish > Widgets > Profile, untick 'Show QR code in payments tab'. Set per account. Along the way Martin established which templates carry the QR_CODE tag by default — only order_confirmation and additional_session_payment — and that payment QR codes must be scanned with a banking app, not the phone camera, which was the actual complaint. Matches the profile-widget QR spec from 2 Nov.", "cat": "widgets"}, {"channel": "intercom", "id": "215476677660359", "date": "2026-11-03 08:03", "day": "2026-11-03", "human": false, "bucket": "D_assumed_with_kb", "reask": 3, "resolution": "confirmed_resolution", "rating": null, "carried": null, "sources": ["Sending email/SMS to clients | Zooza Help", "Children's Group Activities — Monthly Subscription Model | Zooza Help"], "q": "kde viem manualne poslat pripomienku ku plate", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Natália Varkondová", "text": "kde viem ladu so systémami Zooza, ActiveNow či eAktywni.  Toto tvrdenie nezodpovedá skutočnosti.\n  Nižšie prikladám aktuálnu snímku obrazovky z Vášho článku, ktorá dokumentuje pretrvávajúcu nesprávnu informáciu:\n  \n   Dovoľujem si opätovne pripomenúť, že ObozyPolkolonie.pl je nielen marketplace, ale aj plnohodnotný systém na komplexnú správu táborov, denných táborov a ďalších podujatí, ktorý zahŕňa registrácie, rezervácie, platby, zmluvy, dokumentáciu účastníkov, komunikáciu, CRM a reporting.  Mimoriadne dôležité je tiež to, že naše softvérové riešenie vyvíjame s ohľadom na poľskú legislatívu a špecifické zákonné povinnosti organizátorov detských pobytov, vrátane podpory TFG a TFP.  Náš systém navyše umožňuje realizovať registrácie a komplexne spravovať rezervácie priamo na vlastnej webovej stránke organizátora, prostredníctvom integrovaných rezervačných formulárov a widgetov. Rodičia tak môžu vykonať registráciu aj platbu bez toho, aby museli prechádzať na marketplace ObozyPolkolonie.pl.  Organizátori zároveň nie sú povinní zverejňovať svoje ponuky na našom marketplace, aby mohli využívať plnú funkcionalitu rezervačného a organizačného systému.  O to viac nás znepokojuje, že takéto nepresné informácie zverejňuje spoločnosť ponúkajúca priamo konkurenčné riešenie, navyše v článku prezentovanom ako „uczciwe porównanie“ (čestné porovnanie).  Dovoľujem si upozorniť, že šírenie nepravdivých alebo zavádzajúcich informácií o službách iného podnikateľa môže za splnenia zákonných podmienok predstavovať nekalosúťažné konanie podľa článku 14 poľského zákona zo 16. apríla 1993 o boji proti nekalej súťaži (ustawa o zwalczaniu nieuczciwej konkurencji).  V tejto súvislosti Vás opätovne vyzývam na odstránenie všetkých nepravdivých a zavádzajúcich informácií o ObozyPolkolonie.pl z predmetného článku, predovšetkým zo sekcie FAQ, a na dôkladné preverenie celého porovnania z hľadiska jeho objektívnosti a správnosti.  Žiadam Vás o vykonanie potrebných opráv a písomné potvrdenie ich zverejnenia do 3 pracovných dní od doručenia tejto správy.  Verím, že túto záležitosť dokážeme vyriešiť korektne a mimosúdnou cestou.  Zároveň Vás však upozorňujem, že v prípade ďalšieho zverejňovania nepravdivých informácií, napriek predchádzajúcemu upozorneniu a Vášmu výslovnému potvrdeniu ich opravy, zvážime podniknutie príslušných právnych krokov na ochranu našich oprávnených obchodných záujmov a dobrej povesti spoločnosti.  Naším cieľom nie je obmedzovať hospodársku súťaž ani právo porovnávať dostupné riešenia. Požadujeme výlučne to, aby takéto porovnania vychádzali z pravdivých, overiteľných a aktuálnych informácií.  \n     \n Serdecznie pozdrawiam,  \n        \n    Kamil Krzywonos\n Founder ObozyPolkolonie.pl\n email: kamil.krzywonos@obozypolkolonie.pl\n  telefon: +48 575 121 630  ​\n  \n   Kliknij i umów się na spotkanie online\n      Treść tej wiadomości e-mail jest poufna i przeznaczona wyłącznie dla odbiorcy wskazanego w wiadomości. Udostępnianie jakiejkolwiek części tej wiadomości osobom trzecim bez pisemnej zgody nadawcy jest surowo zabronione. Jeśli otrzymałeś/aś tę wiadomość przez pomyłkę, prosimy o odpowiedź i jej usunięcie, abyśmy mogli zapobiec podobnym pomyłkom w przyszłości.\n\n  Jeśli ta wiadomość trafiła do niewłaściwej osoby lub nie chcą Państwo otrzymywać takich wiadomości, proszę dać znać – usunę adres z kontaktów.        \n   \n\n   \n    Od: Tech from Zooza \u003csupport@zooza.online>\n Wysłano: Środa, 28 Październik 2026 07:32\n Do: kamil.krzywonos@obozypolkolonie.pl \u003ckamil.krzywonos@obozypolkolonie.pl>\n Temat: Re: Žiadosť o opravu nepresných informácií o ObozyPolkolonie.pl vo vašom článku   \n    \n          Dobrý deň, pán Krzywonos,\n ďakujeme za upozornenie, máte pravdu. Časť FAQ zaraďovala ObozyPolkolonie.pl medzi platformy, ktoré len presmerúvajú rodičov k organizátorovi, a to nezodpovedá skutočnosti. Opravili sme FAQ aj úvodný odsek. V porovnávacej tabuľke teraz uvádzame, že ponúkate marketplace aj systém pre organizátorov (zápisy, plat ck your app settings.", "cited": []}, {"role": "human", "who": "Martin", "text": "Dobry den Barbora, nie celkom. Kral skupiny je funkcia urcena pre niekoho, kto spravuje skupinovu vyucbu. Cize klasicky scenar je - Firemny zakaznik, skupinovy kurz. Asistentka vo firme je urcena ako kral skupiny. Ona vyhodnocuje ci sa skupina uskutocni alebo nie. Ak jej povedzme z piatich kolekov dvaja napisu ze nemozu, ona sa moze nalogovat do profilu, zrusit stretnutie a naplanovat nove. To co potrebujete je nieco ine. V principe viete na to vyuzit dodatocny pristup na registraciu, v tom pripade by dany clovek z HR videl vo svojom profile vsetky registracie, kde ma dodatocny pristup. Akurat tam asi zavisi od toho kolkych ludi sa to tyka, lebo nastavovat to na stovkach registracii je asi overkill. Viete viac priblizit co presne by ta rola mala robit?", "cited": []}, {"role": "customer", "who": "barbora zajacová", "text": "aha jasné, rozumiem. proste je to student ale ma vacsie prava...\n\npreposielam o com sme sa bavili u nás - \"chceme ju nastaviť ako admina pre všetky skupiny JAVYS -  aby mala prístup k dochadzke ale zastaviť jej posielanie mailov notifikacnych aby nebola zaspamovana? ide o to z javys studenti si platia spoluucast a ona chce kontrolovať ich dochadzku pri vystavovani FA pre ich vyplaty,\" .. je to vobec mozne bez toho aby dostala napr pristup do zoozy ako nejaký náš zamestnanec ?", "cited": []}], "verdict": "gap", "vtitle": "Group king is for running the group, not for an HR observer", "vnote": "Clean conceptual answer. Group king = someone who manages group teaching and can cancel or reschedule the meeting from their profile; the classic case is a company assistant deciding whether the session happens. For an HR person who only needs to watch attendance across groups, the tool is additional access to the registration — with the caveat that setting it on hundreds of registrations is overkill. The glossary should carry this distinction; it is exactly the kind of mix- the booking and refund request more quickly.", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "Booking 552154 (Mirta Gentile / Filippo Maria Petacco). I refunded the €115 Stripe payment of 31 Oct 2026 (pi_3UWPn7JXkcpmBfLN1lXb6Evi) directly in Stripe. Zooza now shows “This payment has been fully refunded” and won’t let me record an administrative refund, but Refunds issued still shows €0.00 and the booking shows €255 received. Please record the €115 refund on this payment so Zooza matches Stripe (€140 received).\n\n\nAlso, re-applying the payment plan today created two automatic entries, a €25 “Registration fee correction” and a €230 “Correction payment”, which set the booking’s charges to €0. The correct state is €140 charged (€25 registration fee + €115 November), €140 paid, €0 balance, with the next €115 charge on 4 Dec 2026. Could you check and correct these too?", "cited": []}, {"role": "human", "who": "Martin", "text": "Hi Sam,\n\n\n\n\n\nThanks for the details. I've gone through booking 552154 (Mirta Gentile / Filippo Maria Petacco), and here's what I can see happened on 31 October.\n\n\n\n\n\n1. The €115 Stripe payment\n\n\nEarly on 31 October, Zooza automatically charged the instalment that was due under the payment plan: €115 by card. You then refunded it directly in Stripe.\n\n\n\n\n\nA refund made in the Stripe dashboard isn't passed back to Zooza. Zooza only knows about refunds made from within Zooza. That's why the booking still shows €255 received and \"Refunds issued: €0.00\".\n\n\n\n\n\n2. The manual \"Credit\"\n\n\nYou then added a manual €115 Credit and later cancelled it with a correction of the same amount. These two entries cancel each other out, so they have no effect on the balance. That is also why the Credit shows \"This payment has been fully refunded\": it refers to that entry only, not to the Stripe payment.\n\n\n\n\n\n3. Re-applying the payment plan\n\n\nWhen a payment plan is applied, it replaces everything currently charged on the booking with the new plan. That's why Zooza added the €230 \"Correction payment\" and the €25 \"Registration fee correction\": it took off the existing charges, including the registration fee, and scheduled the new plan instead. That plan is €115 on 4 December and €115 on 4 January.\n\n\n\n\n\nHow to get to the state you want (€140 charged, €140 paid, next €115 on 4 December)\n\n\n\n\n\n1. Record the refund in Zooza. Open the €115 card payment from 31 October and click Refund. Zooza will tell you the refund can't be sent through the payment gateway (because it was already refunded in Stripe). It will then offer you an administrative refund, pre-filled with €115. Confirm it. This records the refund without moving any money. The booking will then show €140 received.\n\n\n2. Add back the charges that the payment plan removed: a €25 registration fee and a €115 course payment for November. The booking will then show €140 charged and a €0 balance.\n\n\n3. Check the plan. It currently has instalments on both 4 December and 4 January. If January shouldn't be charged, remove or adjust that instalment.\n\n\n4. Leave the Credit and its correction as they are. They balance each other out. Entries in the payment history aren't deleted, so that it stays a complete record of what happened.\n\n\n\n\n\nA tip for next time: if you refund from within Zooza (on the payment itself) instead of in Stripe, the money is returned to the customer and the booking updates automatically, all in one step.\n\n\n\n\n\nIf anything still doesn't add up after these steps, let me know and I'll take another look.\n\n\nAlso - is there any reason why you were trying to re-apply the payment plan?\n\n\n\n\n\nOn the data cleanup - unfortunately this is not possible. The payments ledger is a read only data store. It is not possible to alter the payment records in any way once they've been written. This is primarily for your peace of mind as I'm sure you need to trust that no-one can ever change the money information retroactively without leaving any trace.", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "Hi, thanks for the detailed explanation.\n\n\nWe re-applied the payment plan because the original plan started on the booking date (15 October) rather than Filippo’s first lesson (4 November), so November was charged twice. We wanted to restart the plan from the first lesson.\n\n\nA few follow-ups:\n\n\n\n\n- I can’t find the Refund option on the €115 card payment of 31 October. The Refund button on the booking only opens the Payments tab, the payment’s row in the list has no menu, and Transactions → Card shows no actions. Where exactly is it?\n\n- For step 2, how do I add the €115 November charge without changing the scheduled instalments? The Total charge Edit says it adjusts the current schedule.\n\n- Her December instalment (due 4 December) is set to be charged on 19 November. Our “Days before booking is marked unpaid” setting is now 1, and newer plans charge a day before the due date, but plans created earlier still charge about 15 days early. For example, two families were charged on 1 November for payments due 16 November. How can we move the charge dates on existing plans, ideally for the whole account at once?\n\nWe’d like to keep the January instalment: her subscription continues monthly to August.", "cited": []}, {"role": "human", "who": "Martin", "text": "Hi Sam,\n\n\n\n\n\nThanks, that helps. I checked the booking in detail:\n\n\n\n\n\n- A payment plan always starts on the date the booking is made, whether or not the class has begun. For Filippo that was 15 October.\n\n\n- Each instalment is charged 15 days before it's due (as per your settings). So the first instalment was taken at booking (due 30 October), and the second was taken automatically on 31 October (due 15 November).\n\n\n- So November wasn't charged twice. The 31 October charge was simply the plan's second regular instalment, arriving before the first lesson because the booking was made three weeks before the class started.\n\n\n- Re-applying the plan from 4 December is fine if you'd prefer her instalments to follow the lessons. Just be aware that re-applying a plan removes everything already charged on the booking, which is where the €230 and €25 correction entries came from. The new plan runs on the 4th of each month and continues monthly after January as the course goes on.\n\n\n\n\n\nWhere to find the refund\n\n\nIt's not on the payment line in the Payments list. It's on the card payment itself:\n\n\n1. Open the booking and go to the Payments tab.\n\n\n2. Scroll down to the Online payments box and click the €115 payment from 31 October.\n\n\n3. On the right you'll see a Refund box. Click Refund payment.\n\n\n4. Because the money was already returned in Stripe, Zooza will say the gateway refund isn't available and will offer an administrative refund, already filled in with €115. Confirm it.\n\n\n\n\n\nThe booking will then show €140 received.\n\n\n\n\n\n2. Adding the November charge without touching the instalments\n\n\nEditing the total charge is fine here. Despite the warning, it only adds one entry to the booking's payment history and leaves the scheduled instalments (4 December, 4 January and onwards) exactly as they are.\n\n\n1. On the Payments tab, edit the course charge and set it to €115.\n\n\n2. Edit the registration fee and set it to €25.\n\n\n\n\n\nThe booking will then show €140 charged, €140 paid, and a €0 balance, with the next instalment on 4 December.\n\n\n\n\n\n3. Charge dates on existing plans\n\n\nYou're right. The \"days before\" setting is applied when a plan is created, and plans don't pick up a later change. Every plan created from now on will charge one day before the due date. Plans created earlier keep the old 15-day lead.\n\n\n\n\n\nI checked your account: 23 upcoming instalments across 22 bookings still have the old lead, with due dates between 18 November and 4 January. That includes Filippo's 4 December instalment, which is currently set to charge on 19 November.", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "Thanks Martin, that’s really helpful.\n\n\nStep 2 is done: the booking now shows €140 charged, and the instalments are unchanged.\n\n\nStep 1 won’t save, though. On the €115 card payment of 31 October, the Refund payment dialog opens, I tick “Administrative refund only” and enter 115, and it confirms no money will be returned via the gateway. But pressing OK (or Enter) does nothing: no error, and nothing seems to be submitted. Could you record the administrative refund from your side, or check why it’s blocked? It needs to be in place before 19 November so her December instalment is collected normally.\n\n\nOn the 15-day lead: is there a way to move the existing plans to the one-day lead without re-applying each one? Re-applying adds correction entries to every booking. If there isn’t, what would you recommend for those 22 bookings?\n\n\nMany thanks, Sam", "cited": []}], "verdict": "gap", "vtitle": "A refund made in the Stripe dashboard never reaches Zooza", "vnote": "Strong, generalises to everyone on Stripe. Zooza only knows about refunds made inside Zooza, so a Stripe-side refund leaves the booking showing the money as received and 'Refunds issued 0.00'. The fix: open the booking > Payments tab > Online payments box > click the card payment > Refund box > Refund payment; Zooza says the gateway refund is unavailable and offers an administrative refund, pre-filled. Second fact, equally reusable: re-applying a payment plan REPLACES everything already charged, including the registration fee, which is where surprise 'Correction payment' lines come from. Third: a plan starts on the booking date, not the class start, and each instalment is charged N days before it is due.", "cat": "payments"}, {"channel": "intercom", "id": "215476664989514", "date": "2026-11-02 16:41", "day": "2026-11-02", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Late bookings (pro-rata management) | Zooza Help", "Types of bookings | Zooza Help", "Client Management FAQ | Zooza Help", "Payment templates creation | Zooza Help", "User roles | Zooza Help", "Bookings | Zooza Help", "Registration statuses — what each one means | Zooza Help", "Add instructors and manage their access | Zooza Help"], "q": "oare lecturers nu ii vad pe cei care sunt inscrisi ca late registration?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "oare lecturers nu ii vad pe cei care sunt inscrisi ca late registration?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Da. Instructorii pot vedea persoanele care sunt înscrise chiar și dacă sunt marcate ca Late registration. \n\n\nInstructorii au acces la:\n\n\n\n\n- Calendarul claselor lor\n\n- Secțiunea Clients și Bookings (doar pentru clienții lor)\n\n- Înregistrarea prezenței la sesiuni \n\n\nTotuși, instructorii nu au acces la toate secțiunile pe care le vede un admin (de exemplu Programmes, Payments, Reports sau Settings). \n\n\nPe ecranul de prezență, instructorii veduți în principal numele participantului și detalii de bază despre sesiune. Alte informații depind de permisiunile rolului instructorului.", "cited": ["Types of bookings | Zooza Help", "Add instructors and manage their access | Zooza Help", "User roles | Zooza Help", "Client Management FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Este ceea ce căutați?", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "pai si daca cineva se inscrie si apare ca late registration, trebuie sa il inrolez sau il las asa?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Trebuie să îl confirmați. \n\n\nCând cineva se inscrie după începutul programului, Zooza marchează înregistrarea ca Late booking. Aces nAlebo je možný iný postup?\n\n\nMarcela Csillaghyová\n\n\n0910 949398\n\n\nwww.plavacik.sk\n\n\n-------- Pôvodná správa --------\n\n\nOd: Martin from Zooza \u003csupport@zooza.online> \n\n\nDátum: 1. 11. 2026 12:28 (GMT+01:00) \n\n\nKomu: plavacik@yahoo.com \n\n\nPredmet: Váš lístek Tickets č. 151810692", "cited": []}, {"role": "customer", "who": "Marcela Csillaghyová", "text": "Skúsila som registra obnoviť a presunúť do skupiny maj- jul, tak ako som to robila predtym.\n\n\nNo ani teraz to nejde.\n\n\nMarcela Csillaghyová\n\n\n0910 949398\n\n\nwww.plavacik.sk\n\n\n-------- Pôvodná správa --------\n\n\nOd: Martin from Zooza \u003csupport@zooza.online> \n\n\nDátum: 1. 11. 2026 12:28 (GMT+01:00) \n\n\nKomu: plavacik@yahoo.com \n\n\nPredmet: Váš lístek Tickets č. 151810692           \n\n\nDobry den Marcela, dakujem velmi pekne. V tomto pripade ide o to, ze registracia pani Darasovej je zrusena a pre zrusene registracie nahradky system neponuka. Ak by ale aj nebola registracia zrusena, na tento termin, uz je zakaznik prihlaseny, lebo je to termin v ramci jeho skupiny (cize inymi slovami - nahradna hodina sa neda vybrat v termine, kedy ma mat zakaznik standardnu hodinu.)\n\n\nMate este nejaky iny priklad?     #151810692: Nahradny termin ·Odesláno\n\n\n\n\n\nJsme tu, abychom vám pomohli    Odpovězte přímo na tento e-mail nebo prostřednictvím našeho Messengeru", "cited": []}, {"role": "human", "who": "Martin", "text": "Dobry den Marcela, nie nie, urcite ich nepresuvajte. Ako vravim, su to dva problemy:\n\n\n1) Registracia je v nespravnom stave\n\n\n2) Registracia uz na dany termin je prihlasena\n\n\n\n​\n\n\nCize preto Vam to nezabralo. To rusenie registracie je spravny proces. Ked registraciu zrusite, nevie si uz cerpat nahradne hodiny, tak by to aj malo byt, ved po spravnosti ten klient uz ku Vam chodit nechce. Ak mu napriek tomu chcete umoznit este \"docerpat\" nejaku jednu, dve hodiny - viete mu vytvorit termin zadarmo. Teda v ramci jeho registracie ak vojdete do ponuky: Kredity; tam mu viete vytvorit termin zadarmo, ktory si vie vycerpat rovnako ako nahradku.\n\n\n\n​\n\n\nCo sa tyka tohto konkretneho terminu, tak v pripade, ak by to bol termin zadarmo, system by mu ho mal ponuknut v pripade ak bude registracia zrusena.", "cited": []}, {"role": "customer", "who": "Marcela Csillaghyová", "text": "Dobrý deň,\n\n\ntoto sa mi zdá ešte zložitejsie im vytvárať termín zadarmo. Nechám si to prejsť hlavou.\n\n\nNiektorí sa odhlásia len na mesiac a potom sa opat pridávajú spat.\n\n\nM.", "cited": []}, {"role": "human", "who": "Martin", "text": "Viete co mozeme to spravit tak, ze ked rusite tu registraciu tak sa Vas to system opyta, ci to chcete automaticky urobit. Tym padom by ste nemali ziadne klikanie navyse.", "cited": []}], "verdict": "gap", "vtitle": "Two reasons a make-up is not offered, and the free-session way round it", "vnote": "A cancelled registration is never offered make-ups, by design — a client who cancelled is not coming back. And a make-up cannot be taken on a session where the client already has their regular class. If you still want to let someone use up a session or two, create a free session from Credits on their registration, which they draw down like a make-up. Martin also floats asking the question during cancellation so there is no extra clicking. Check attendance-and-catchups-faq first — the 26 Sep run wrote the cancel-make-up-vs-unenrol distinction there.", "cat": "makeups"}, {"channel": "intercom", "id": "215476615763774", "date": "2026-11-02 10:53", "day": "2026-11-02", "human": true, "bucket": "HUMAN", "reask": 3, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": [], "q": "Dobry den, moje lektorka mi zrovns poslala toto, ze ji antivirus varuje pred zoozou😞 co s tim?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": "Ivana Palcútová", "text": "Dobry den, moje lektorka mi zrovns poslala toto, ze ji antivirus varuje pred zoozou😞 co s tim?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumím, že je to znepokojující. Předám Vás někomu z našeho týmu; pokud můžete, doplňte prosím, co přesně se zobrazilo a co jste před tímto varováním dělala.", "cited": []}, {"role": "customer", "who": "Ivana Palcútová", "text": "zobrazilo  se co jsem prilozila v priloze a lektorka nic dale nedelala", "cited": []}, {"role": "customer", "who": "Ivana Palcútová", "text": "dobrý den, jak to prosím vypadá s tímto problémem. Kolegyně neví co má dělat, ale furt ji to nechce pustit do Zoozy", "cited": []}, {"role": "human", "who": "Martin", "text": "Dobry den Ivano, Lektorka is musi povolit zoozu ako vynimku v Bitdefenderi. Vsetky certifikaty mame v poriadku, preto nie uplne rozumiem, preco by nas Bitdefender blokoval. Kazdopadne toto je na strane lektorky, my s tym nemame moc co urobit. Na tej obrazovke, ktoru Vam posielala vidno dve tlacitka: Modre velke a pod nim je textove tlacitko/odkaz - na ten odkaz musi kliknut aby sa dostala do zoozy.", "cited": []}], "verdict": "client", "vtitle": "Bitdefender warns the instructor about Zooza", "vnote": "Certificates are fine; the instructor must allow Zooza as an exception, and on that warning screen the way through is the small text link below the big blue button. Browser-side and client-specific. Mention only if it recurs.", "cat": "account"}, {"channel": "intercom", "id": "215476659130362", "date": "2026-11-02 09:49", "day": "2026-11-02", "human": true, "bucket": "HUMAN", "reask": 3, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Programmes, classes, and sessions explained | Zooza Help", "Programmes List | Zooza Help", "Zooza App Navigation Map | Zooza Help", "Instructor Access and Roles FAQ | Zooza Help", "Where to find things in Zooza — quick reference | Zooza Help"], "q": "Dostala som sa log in ale neviem nájsť ela jazykovka", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám moh ho": "Martin", "text": "Dobry den, vy ste zakaznik Ela Jazykovka? V tom pripade ste zle, potrebujete ist na ich web.", "cited": []}], "verdict": "noise", "vtitle": "Same person, logged in and still looking for the language school", "vnote": "Wrong door. Pairs with 215476659124851.", "cat": "noise"}, {"channel": "intercom", "id": "215476659124851", "date": "2026-11-02 09:47", "day": "2026-11-02", "human": true, "bucket": "HUMAN", "reask": 1, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Login and Account FAQ | Zooza Help", "Client Profile 101 | Zooza Help", "Zooza 101 for Instructors | Zooza Help"], "q": "Ako sa dostanem do ela jazykovka", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": "Martina Blšťáková", "text": "Ako sa dostanem do ela jazykovka", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Martina, do jazykovky sa prihlásite takto:\n\n\n\n\n- otvorte https://zooza.online/access\n\n\n- zadajte svoj email\n\n- príde vám email s prihlasovacím odkazom alebo kódom\n\n\n- otvorte ho a budete v systéme\n\n\nŽiadne heslo nepotrebujete – každé prihlásenie posiela nový kód na váš email.\n\n\nPrihlásenie do klientskej profilovej stránky jazykovky je podobné: otvoríte ich profilovú stránku, zadáte email a kliknete na link z emailu.", "cited": ["Zooza 101 for Instructors | Zooza Help", "Login and Account FAQ | Zooza Help", "Client Profile 101 | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Odpovídá to na vaši otázku?", "cited": []}, {"role": "human", "who": "Martin", "text": "Dobry den Martina, kde ste sa zasekli?", "cited": []}], "verdict": "noise", "vtitle": "End customer looking for a language school", "vnote": "Wrong door — a client's customer in our inbox.", "cat": "noise"}, {"channel": "intercom", "id": "215476657356596", "date": "2026-11-02 09:18", "day": "2026-11-02", "human": true, "bucket": "HUMAN", "reask": 0, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": [], "q": "Hi Michal and Martin,   \n   I am continuing to have issues relating to the refunds - is there any progress with the individual credit reports?  \n   This is my response from my accountant - I am basically going to have to pay them additional to raise these big number of credit notes as I simply do not have time! I cannot even seem to be able to raise a credit note individually in Xero. Please advise!  \n   Refunds – Thank you for the refund report for September. We currently raise 1 credit note for the full refunds per month as Zooza is still configuring the automation of credit notes into Xero. As mentioned previously, for tax purposes each refund needs to be raised as a separate credit note. Now that the refund report is available, this will have to be done retrospectively from April 2026 to September 2026 and going forward every month until the Zooza integration works. Please advise if you will be doing this or you would prefer us to do this. Please note that this is outside the scope of our service and an additional fee will apply for the time spent raising the individual credit notes. In order to estimate the time it will take (and related cost), please send us the refund report for each month, April to August (we have September). Just FYI, September alone has 36 credit notes to be raised. \n\n           Best Wishes         \nAnna Blackwell\n Owner - Turtle Tots Dubai\n   \nT: 052 748 1060\n E: anna.blackwell@turtletots.com\n                                  WHP2-Block-A Commercial, Property Number P2AG-A09, Plot 13-0 | DM Land No: 532-8359 | Saih Shuaib 3 | Dubai | UAE |            This email and any attachments to it may be confidential and are intended solely for the use of the individual to whom it is addressed. Any views or opinions expressed are solely those of the author and do not necessarily represent those of Turtle Tots. If you are not the intended recipient of this email, you must neither take any action based upon its contents, nor copy or show it to anyone. Please contact the sender if you believe you have received this email in error.", "turns": [{"role": "customer", "who": "Anna Blackwell", "text": "Hi Michal and Martin,   \n   I am continuing to have issues relating to the refunds - is there any progress with the individual credit reports?  \n   This is my response from my accountant - I am basically going to have to pay them additional to raise these big number of credit notes as I simply do not have time! I cannot even seem to be able to raise a credit note individually in Xero. Please advise!  \n   Refunds – Thank you for the refund report for September. We currently raise 1 credit note for the full refunds per month as Zooza is still configuring the automation of credit notes into Xero. As mentioned previously, for tax purposes each refund needs to be raised as a separate credit note. Now that the refund report is available, this will have to be done retrospectively from April 2026 to September 2026 and going forward every month until the Zooza integration works. Please advise if you will be doing this or you would prefer us to do this. Please note that this is outside the scope of our service and an additional fee will apply for the time spent raising the individual credit notes. In order to estimate the time it will take (and related cost), please send us the refund report for each month, April to August (we have September). Just FYI, September alone has 36 credit notes to be raised. \n\n           Best Wishes         \nAnna Blackwell\n Owner - Turtle Tots Dubai\n   \nT: 052 748 1060\n E: anna.blackwell@turtletots.com\n                                  WHP2-Block-A Commercial, Property Number P2AG-A09, Plot 13-0 | DM Land No: 532-8359 | Saih Shuaib 3 | Dubai | UAE |            This email and any attachments to it may be confidential and are intended solely for the use of the individual to whom it is addressed. Any views or opinions expressed are solely those of the author and do not necessarily represent those of Turtle Tots. If you are not the intended recipient of this email, you must neither take any action based upon its contents, nor copy or show it to anyone. Please contact the sender if you believe you have received this email in error.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Anna,\n\n\nThanks for forwarding this. I understand the situation, especially with the additional accounting work involved.\n\n\n\n\n\nLet me clarify how Zooza handles refunds and credit notes, as I think there may have been some misunderstanding about what we are planning to automate.\n\n\n\n\n\nZooza provides the infrastructure to process refunds directly through Stripe, so you don't have to handle them manually through your bank or Stripe dashboard. We also provide refund reports showing who received a refund, when and how much. This gives you and your accountant the information needed for reconciliation.\n\n\n\n\n\nWhat Zooza doesn't currently do is automatically generate accounting credit notes in Xero, and this is not something we're planning to automate as part of our standard product.\n\n\n\n\n\nCredit notes are country-specific accounting and tax documents, and the requirements and processes vary between markets and accounting setups. We don't have sufficient expertise in every jurisdiction to automate these reliably. This is why we provide the refund data, while the actual credit notes need to be issued by you or your accountant in Xero. This is how we currently operate across our markets.\n\n\n\n\n\nI realise this may not be the answer you were hoping for, but I want to be transparent rather than promise something we aren't planning to deliver.\n\n\n\n\n\nOne other thought, looking at the 36 refunds in September — perhaps it's also worth reviewing why there are so many refunds and whether some could be avoided. September may have been an unusual month, of course, but we generally see businesses handling only a few refunds per month.\n\n\n\n\n\nWhere appropriate, we often recommend offering credit towards a future term or another service instead of refunding the money. This can simplify administration, improve retention and keep the revenue within your business.\n\n\n\n\n\nOf course, this depends on the reason for the refund and what works for your customers.\n\n\nRegarding the reports from April to August, we can help you get those exports so your accountant has the necessary information.\n\n\n\n\n\nOne more thought, Xero now also has its own MCP connection for AI tools like Claude, and it supports creating credit notes directly.\n\n\n\n\n\nSince you've already connected Claude with Zooza, it might be worth exploring a similar connection with Xero. In theory, you could use the Zooza refund reports and have Claude help prepare individual credit notes in Xero, without entering everything manually.\n\n\n\n\n\nI haven't tested this particular workflow myself yet, but it could be a much more practical solution than building a custom accounting integration. Your accountant could then review and approve the documents before they're finalised.\n\n\n\n\n\nI hope this clarifies the distinction between refund processing/reporting and accounting credit notes.\n\n\nBest", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Anna,\n\n\nThanks for forwarding this. I understand the situation, especially with the additional accounting work involved.\n\n\nLet me clarify our position and suggest a couple of options that might help.\n\n\n1. How Zooza handles refunds and credit notes\n\n\nZooza provides the infrastructure to process refunds directly through Stripe, so you don't have to handle them manually through your bank or Stripe dashboard.\n\n\nWe also provide refund reports showing who received a refund, when and how much. These reports are available in Zooza and can be exported for any period, including April to August.\n\n\nWhat Zooza doesn't currently do is automatically generate accounting credit notes in Xero, and this is not something we're planning to automate as part of our standard product.\n\n\nCredit notes are country-specific accounting and tax documents, and the requirements and processes vary between markets and accounting setups. We don't have sufficient expertise in every jurisdiction to automate these reliably.\n\n\nThis is why we provide the refund data, while the actual credit notes need to be issued by you or your accountant in Xero. This is how we currently operate across our markets.\n\n\nI realise this may not be the answer you were hoping for, but I want to be transparent rather than promise something we aren't planning to deliver.\n​\n\n\n2. There may be a smarter way to automate this with AI\n\n\nXero now also has its own MCP connection for AI tools like Claude, including support for creating credit notes.\n\n\nSince you've already connected Claude with Zooza, it might be worth exploring a similar connection with Xero.\n\n\nIn theory, Claude could use the refund information from Zooza to help prepare individual credit notes directly in Xero, without having to enter everything manually.\n\n\nI haven't tested this particular workflow myself, so it would need to be checked with your accountant first, but I think it's a promising approach. Your accountant could then review and approve the documents rather than having to create each one from scratch.\n\n\nThis is actually the direction we're moving towards with Zooza — allowing different systems to work together through AI rather than building every possible integration ourselves.\n​\n\n\n3. Perhaps it's also worth reviewing the refund process itself\n\n\nOne other thought, looking at the 36 refunds in September — perhaps it's worth taking a closer look at why so many refunds are happening and whether some could be avoided.\n\n\nSeptember may have been an unusual month, of course, but generally we see businesses processing only a few refunds per month.\n\n\nWhere appropriate, we often recommend offering credit towards a future term or another service instead of returning the money. Some businesses also offer alternative sessions or other benefits.\n\n\nThis can reduce administration, help retain customers and keep revenue within the business, while still providing a good customer experience.\n\n\nOf course, this depends on the circumstances and what is appropriate for each customer. But with this volume of refunds, I think a little business analysis could be worthwhile — not just to simplify accounting, but also to see whether the process itself could be improved.\n\n\nI hope this helps clarify our position and gives you a few practical options to explore.\n\n\nBest", "cited": []}], "verdict": "gap", "vtitle": "Zooza will not issue accounting credit notes, and why", "vnote": "A clear product boundary stated twice to a client who keeps asking. Zooza processes refunds through Stripe and provides refund reports that export for any period; it does not generate credit notes in Xero and is not planning to, because credit notes are country-specific tax documents. Put this in the refunds or invoicing article as a plain statement — it will be asked again, and a vague KB is why it keeps coming back.", "cat": "payments"}, {"channel": "intercom", "id": "215476657139767", "date": "2026-11-02 09:05", "day": "2026-11-02", "human": true, "bucket": "HUMAN", "reask": 0, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": [], "q": "Hello!   \n   I have asked Zooza and Claude and there is no clear answer.   \n   For the past week, whenever a customer tries to enrol from the follow up email after their trial,, it Informs there is no space. This does not make sense as the settings are set to allow trial spaces to be reserved for those customers to book themselves in. Around 5 people have said the same thing to me so I am worried something has been changed?  \n   Please can you advise? Claude says all the settings are correct but it has suddenly started happening and was working perfectly before.   \n  Thanks, an example name is Altyn Sincheva.  \n   Anna", "turns": [{"role": "customer", "who": "Turtle Tots Dubai", "text": "Hello!   \n   I have asked Zooza and Claude and there is no clear answer.   \n   For the past week, whenever a customer tries to enrol from the follow up email after their trial,, it Informs there is no space. This does not make sense as the settings are set to allow trial spaces to be reserved for those customers to book themselves in. Around 5 people have said the same thing to me so I am worried something has been changed?  \n   Please can you advise? Claude says all the settings are correct but it has suddenly started happening and was working perfectly before.   \n  Thanks, an example name is Altyn Sincheva.  \n   Anna", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Anna,\n\n\nI've checked this, including Altyn Sincheva's case, and everything seems to be working correctly from what I can see.\n\n\nThere is space available for enrolment, and we tested the process from the customer's perspective, clicking through the links in the follow-up emails.\n\n\n\n​\n\n\nI also checked the most recent completed trial (Rouba https://asia.zooza.app/#registrations/2605) and the follow-up process worked correctly there too.\n\n\n\n​\n\n\nWe'll investigate a little further to see if something specific might have caused the issue earlier, but so far it looks like everything is functioning as expected.\n\n\n\n​\n\n\nI'll let you know if we find anything.", "cited": []}], "verdict": "client", "vtitle": "Post-trial enrolment said no space — tested and working", "vnote": "Five people reported it, we checked the named case and the most recent completed trial and the follow-up flow worked. No KB change. Leave it on the list in case it comes back.", "cat": "trials"}, {"channel": "intercom", "id": "215476658405321", "date": "2026-11-02 08:46", "day": "2026-11-02", "human": false, "bucket": "D_assumed_with_kb", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "(no client message)", "turns": [], "verdict": "noise", "vtitle": "No client message in the conversation", "vnote": "Nothing to read.", "cat": "noise"}, {"channel": "intercom", "id": "215476573914308", "date": "2026-11-02 08:40", "day": "2026-11-02", "human": true, "bucket": "HUMAN", "reask": 8, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Trial Classes FAQ | Zooza Help", "Discounts and Sibling Pricing FAQ | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Booking FAQ | Zooza Help", "Sibling Discount | Zooza Help", "Loyalty Program FAQ | Zooza Help"], "q": "how do I book a single session for someone following a trial", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "how do I book a single session for someone following a trial", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can book a single extra session after the trial by adding a one‑off session to the class and marking the client as attending. \n\n\nSteps:\n\n\n\n\n- Open the Class the client is in.\n\n- Go to Sessions.\n\n- Find the session date (or add a one‑off session).\n\n- Open the session’s attendance view and mark the client as attending.\n\nThis is the simplest way to give a client an extra session without creating a full booking.\n\n\nIf you want them to continue regularly after the trial, you can also open the trial booking and click Enrol to create a full programme booking.", "cited": ["Programmes, Timetables and Sessions FAQ | Zooza Help", "Trial Classes FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any additional help booking a single session after a trial, I’m here to help. Would you like to share more about what you’re trying to arrange?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "im having issues when someone books and doesn't pay, then they book again its recognising it as a sibling and then giving then 50% off", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Samantha, this usually happens when a parent starts a booking, doesn’t pay, and then books again. Zooza allows the second booking, and the system counts it as another child under the same parent email, so the Sibling Discount (e.g. 50% off the 2nd child) is applied automatically.   \n\n\nWhat to do:\n\n\n\n\n- Go to Bookings\n\n\n- Find the unpaid duplicate booking\n\n\n- Delete the unpaid one and keep the correct booking.\n\nAlso note: the sibling discount is triggered by the parent email address, so multiple bookings from the same parent can be treated as siblings.\n\n\nIf you want, I can also show you a couple of ways to reduce this happening in the future.", "cited": ["Booking FAQ | Zooza Help", "Sibling Discount | Zooza Help", "Loyalty Program FAQ | Zooza Help", "Discounts and Sibling Pricing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need further help with duplicate unpaid bookings or the sibling discount being applied, I’m here to help. Would you like to share more about what happens when the second booking is made?", "cited": []}, {"role": "human", "who": "Martin", "text": "Hi Sam, there might be legitimate cases where this might happen, but of course if it is the same child the sibling discount should not be granted. The tricky part is how to identify the booking being the same child. I think we could introduce a rule that for the loyalty discounts to be applied the customer would need to have paid bookings (or in other words - unpaid bookings would be ignored by the loyalty programme calculator). Would that help?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "yes please that would help, as I have had to delete the unpaid booking and amend the amount on the paid booking now to so I debt so they will have to login and pay more again.", "cited": []}, {"role": "human", "who": "Martin", "text": "Ok, we'll change the logic of the programme in this way today. Please follow the changelog on the dashboard for notice when the change will be deployed on production. Thank you for the feedback Sam:)", "cited": []}, {"role": "human", "who": "Martin", "text": "Hi Sam, the loyalty discount will now be counted only for paid bookings. Also if you want you can turn that discount on for logged in users only as a benefit for the existing customers and not offer it to new ones. Having 50% off is quite large discount:)", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "SUBMISSION DATEDETAIL OF CHANGEREQUEST SENT BY\n\n\nWednesday, 28. October 2026, 10:25:19\n\n\n\n\n- \nEmail: Janean.molden@hotmail.co.uk janean.evans@hotmail.co.uk\n\n\nsam@hartbeeps.com", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "I need a date correction completed", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "I completed this 5 hours ago and its still not done", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "Email address changes shouldn't need approving as this results in missed bookings or payments if email address is incorrect", "cited": []}, {"role": "human", "who": "Martin", "text": "Hi Sam, I’ve processed your request.\n\n\nWe treat email address changes with extra care, and here’s why. One of the features parents love most about Zooza is that it doesn’t use passwords at all. Parents never get locked out of the portal because they forgot a password, and you never have to deal with password resets. This has been one of our most consistently praised features.\n\n\nThe trade-off is that the email address becomes the single key to a parent’s account, which makes it the main target for anyone trying to abuse the system. That’s why we review every email change manually, and yes, that can sometimes take a little time.\n\n\nThat said, a pending change never stops anyone from enrolling. Customers can simply book again using the correct email address. As we discussed yesterday, parents already do this, so nobody is blocked in the meantime.\n\n\nI hope this clarifies things a bit", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "Hi Martin \n​\n\n\nCan you please explain this loyalty discount?\n​\n\n\nSo I offer a sibling discount of 50% just off the second child, my class price is 110aed so a mum booking twins would pay 165aed for both, it’s very rare to have twins but can be expensive for a mum and as it’s only 1 adult in the room with them doesn’t effect numbers to much. \n​\n\n\nI don’t want a loyal discount for a person booking a single child in multiple classes as I’ve had people book autumn and winter full programs. Can you please confirm this isn’t the case. \n​\n\n\nI hardly ever have siblings across multiple classes due to the age of my sessions we only go to age 3. \n​\n\n\nIf a 3 year old is in my toddler class and mum has a newborn they come free to the toddler class as have to stay in my arms anyway. \n​\n\n\nHope this helps \n​\n\n\nThanks \n​\n\n\nMagic Sprinkles \n Sam ❤️\n Franchise owner \n Hartbeeps UAE\nsam@hartbeeps.com", "cited": []}, {"role": "human", "who": "Martin", "text": "Hi Sam,\n\n\n1. Twins at 110 AED → 165 AED total. Correct. Children booked together in one booking are numbered in order, so the first twin pays 110 and the second gets the \"2nd child\" rule at 50%, paying 55. With \"All scheduled payments\" selected, the 50% also applies to every membership instalment. There is one caveat to all of this, but more on that later\n\n\n\n​\n\n\n2. One child booked into several classes (autumn plus winter) gets no discount. The discount counts distinct children, not bookings.\n\n\n\n​\n\n\n3. Newborn free in the toddler class. The sibling discount doesn't handle this as the newborn would also get 50% off. Parents have two options: don't register the newborn at all, or you will need to add them manually with a 0 price.\n\n\n\n​\n\n\nNow for the caveat:\n\n\nWhat does system consider to be a sibling is not 100% guaranteed to be true. For example if I were to register my child with name \"Sam\" and then in the next term I would write \"Samantha\", then system may treat those as two distinct persons. We've done some heavy lifting here, trying to recognize cases like these (and typos too for example), but it is not bulletproof. So there might be situations where system would grant that discount even if it is not in fact a second child.\n\n\n\n​\n\n\nBut yes, your setup is done correctly.\n\n\nMartin", "cited": []}], "verdict": "gap", "vtitle": "Sibling discount: paid bookings only, distinct children not bookings, and the matching is not bulletproof", "vnote": "Martin, authoritative and detailed. Changed this week: the loyalty discount now counts ONLY paid bookings (unpaid are ignored by the calculator), and it can be limited to logged-in users as an existing-customer benefit. Rules confirmed: twins in one booking are numbered in order, so the second gets the 2nd-child rule; with 'All scheduled payments' the discount applies to every membership instalment; one child in several classes gets nothing because the discount counts distinct children; a free newborn is not supported — register them manually at price 0. And the caveat worth printing: sibling identity is fuzzy matching on names, so 'Sam' and 'Samantha' can read as two people and the discount can be granted wrongly. Matches the loyalty sibling identity + login gate specs from 27 Oct.", "cat": "pricing"}, {"channel": "intercom", "id": "215476657948196", "date": "2026-11-02 07:50", "day": "2026-11-02", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Payment templates creation | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Bookings | Zooza Help", "Add a one-off scheduled payment | Zooza Help"], "q": "dobry den, po aktualizovani zoozy neviem jako są nastavuje vytvorenie vlastnrej sumy platobneho planu. prosom vieste mi poradit", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Natália Varkondová", "text": "dobry den, po aktualizovani zoozy neviem jako są nastavuje vytvorenie vlastnrej sumy platobneho planu. prosom vieste mi poradit", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Natália, vlastnú sumu v platobnom pláne (platobný plán) môžete nastaviť priamo v registrácii klienta.\n\n\nPostup:\n\n\n\n\n- Otvorte registráciu klienta (rezerváciu).\n\n- Prejdite do sekcie Payment plan.\n\n- Kliknite na New payment plan.\n\n- V poli Amount vyberte Installment amount a zadajte tú sumu, ktorú klient má platiť v každej splátke. \n\n\nTáto suma sa potom použije na generovanie jednotlivých splátok podľa zvolenej frekvencie.\n\n\nChcete nastaviť túto vlastnú sumu pri vytváraní registrácie, alebo až po tom, čo je klient už registrovaný?", "cited": ["Payments and Billing FAQ | Zooza Help", "Bookings | Zooza Help", "Payment templates creation | Zooza Help"]}, {"role": "customer", "who": "Natália Varkondová", "text": "konkretne pri registracii 552133 - Juliana Lejková (Augustín Lejko) by som potrrebovala nastavit stvrtrocne platby po 90 eur", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Natália, pri registrácii klienta môžete nastaviť štvrtročnú splátku 90 € takto:\n\n\n\n\n- Otvorte registráciu klienta.\n\n- Prejdite do Payment plan.\n\n- Kliknite na New payment plan.\n\n- V poli Amount vyberte Installment amount a zadajte 90 €.\n\n- V šablóne vyberte Quarterly (štvrťročné).\n\n- Kliknite na Create payment plan. \n\n\nTáto suma sa potom automaticky rozdeli na štvrtročné splátky pre túto registráciu.", "cited": ["Payments and Billing FAQ | Zooza Help", "Payment templates creation | Zooza Help", "Add a one-off scheduled payment | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak potrebujete s nastavením platobného plánu ešte pomôcť, som vám k dispozícii. Chcete doplniť, čo sa pri registrácii nedarí nastaviť?", "cited": []}], "verdict": "gap", "vtitle": "After the update, cannot find where to set a custom payment plan amount", "vnote": "Re-asked 2x. The screens moved and the KB describes the old ones. Check against the live app before writing — the app map has the current payment screens.", "cat": "payments"}, {"channel": "intercom", "id": "215476657259173", "date": "2026-11-02 06:06", "day": "2026-11-02", "human": false, "bucket": "D_assumed_with_kb", "reask": 1, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Getting Started with Zooza | Zooza Help", "Common Booking Scenarios | Zooza Help", "Registration and Booking FAQ | Zooza Help"], "q": "How can I delete the booking I just made for Burak Ozsoylu?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "How can I delete the booking I just made for Burak Ozsoylu?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Tommy, you can remove it from the booking detail.\n\n\n\n\n- Go to Bookings\n\n\n- Open the booking for Burak Ozsoylu\n\n\n- In the booking detail, change the status to Deleted\n\n\nThis removes the booking (for example if it was created by mistake or is a duplicate). The record is still kept in the system for reference.", "cited": ["Common Booking Scenarios | Zooza Help", "Registration and Booking FAQ | Zooza Help", "Getting Started with Zooza | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any additional help with the booking, I’m here to assist. Would you like to share more about what you’re trying to resolve?", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215476645138781", "date": "2026-11-01 18:25", "day": "2026-11-01", "human": true, "bucket": "HUMAN", "reask": 3, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": [], "q": "ahoj, potrebujem presnuť skupinu ... nejak nedopatrením sa mi dostla pod kurz na viazanosť s 5 mesiaci ... platobna šablóna je nastavená ok na 8 mesiacov ... ako to mám v druhom kurze ale neviem ako ju presnunúť ... vid posledna skupina \"skokani \" je tam duplicitne ... táto posledné kde je 7 registracií tam nemá byť ... nejakým nedopatrením sa tam dostala ... potebujem dať odtialto preč a pod kurz 8 mesačná vziazanosť", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": "Žabulienka", "text": "ahoj, potrebujem presnuť skupinu ... nejak nedopatrením sa mi dostla pod kurz na viazanosť s 5 mesiaci ... platobna šablóna je nastavená ok na 8 mesiacov ... ako to mám v druhom kurze ale neviem ako ju presnunúť ... vid posledna skupina \"skokani \" je tam duplicitne ... táto posledné kde je 7 registracií tam nemá byť ... nejakým nedopatrením sa tam dostala ... potebujem dať odtialto preč a pod kurz 8 mesačná vziazanosť", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumím, že potřebujete předplatné skupiny přesunout a odstranit duplicitní registraci. Předám vás někomu z našeho týmu; můžete prosím doplnit, co přesně potřebujete upravit?", "cited": []}, {"role": "customer", "who": "Žabulienka", "text": "nie registrácie sú jedinečné tie nechcem mazať ani danú skupinu nie ... nechcem ju len presnunúť odtiaľto pod kurz preplavecká 8 mesiacov - tam táto skupina skokcani chýba", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, skupinu môžete presuvať medzi kurzami podľa potreby, stačí ísť do detailu skupiny > nastavenia skupiny > vlastnosti skupiny (na konci je kurz) staci vybrať iny kurz a zmenu uložíte. Presunie sa tak pod nový kurz. Existujúce registrácie majú priradene rovnaké terminy aj platobné šablóny, len ich umiestnenie v kurze sa zmení. Bude to takto postacujúce?", "cited": []}, {"role": "customer", "who": "Žabulienka", "text": "áno už sa mi to podarilo, vďaka.\n​\n\n\nne 1. 11. 2026 o 19:21 Tech from Zooza \u003csupport@zooza.online> napísal(a):", "cited": []}], "verdict": "gap", "vtitle": "Move a class to a different programme without deleting anything", "vnote": "Class detail > class settings > class properties, the programme is the last field; pick another and save. Existing registrations keep their sessions and payment templates, only the placement changes. Short, concrete, and the client's own instinct was to delete the registrations instead.", "cat": "programmes"}, {"channel": "intercom", "id": "215476649708131", "date": "2026-11-01 12:24", "day": "2026-11-01", "human": false, "bucket": "D_assumed_with_kb", "reask": 4, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Classes List | Zooza Help", "User roles | Zooza Help", "Instructor Access and Roles FAQ | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Managing sessions in a class | Zooza Help", "Add instructors and manage their access | Zooza Help", "Where to find things in Zooza — quick reference | Zooza Help"], "q": "Potrebujem pridat nový termín pre skupinu IBD, aby som nebola pozadu. Nie náhradnú hodinu, ale hodinu navyše. Ako s ako robí?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": "Kristina Torkosova", "text": "Potrebujem pridat nový termín pre skupinu IBD, aby som nebola pozadu. Nie náhradnú hodinu, ale hodinu navyše. Ako s ako robí?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Kristina, jednoducho pridáte ďalší termín (hodina) do existujúcej skupiny.\n\n\nPostup:\n\n\n\n\n- Idite do Classes (Skupiny) a otvorte skupinu IBD.\n\n- Prejdite do záložky Sessions.\n\n- Kliknite na Add sessions.\n\n- Zadajte nový dátum a čas a uložte. \n\n\nTýmto pridáte navyše jeden termín do skupiny.", "cited": ["Managing sessions in a class | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Je to to, co hledáte?", "cited": []}, {"role": "customer", "who": "Kristina Torkosova", "text": "Kde nájdem classes?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Kristina, nájdete to v ľavom menu:\n\n\n\n\n- Idite do Activities → Classes\n\n\n- Tam uvidíte zoznam všetkých skupín (Classes).\n\n\nPoznámka: ak máte úlohu instruktora, môže sa stať, že Classes nevidíte a vidíte iba Calendar.", "cited": ["Where to find things in Zooza — quick reference | Zooza Help", "Classes List | Zooza Help", "Instructor Access and Roles FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Odpovídá to na vaši otázku?", "cited": []}, {"role": "customer", "who": "Kristina Torkosova", "text": "Nič také tam nemám!", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Kristina, pravdepodobne máte inštruktorskú rolu. Pri tejto roli sa v ľavom menu nezobrazuje Activities → Classes (Skupiny) – vidíte iba Calendar a vaše termíny.  \n\n\nTento pohľad je úmyselný. Inštruktori nemajú prístup k zoznamu skupín a nemôžu pridávať nové termíny. \n\n\nRiešenie:\n\n\n\n\n- Požiadajte Owner alebo Admin, aby pridali nový termín do skupiny IBD, alebo\n\n- aby vám zmenili rolu na Main instructor v Settings → General → Access.\n\nVidíte v menu iba Calendar a Dashboard?", "cited": ["Instructor Access and Roles FAQ | Zooza Help", "Add instructors and manage their access | Zooza Help", "User roles | Zooza Help"]}, {"role": "customer", "who": "Kristina Torkosova", "text": "Ano, vidím iba calendar", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Kristina, to je normálne. Pri vašej roli videlíte iba Calendar, pretože inštruktorská rola nemá prístup k zoznamu Classes (Skupiny). \n\n\nNový termín (hodina) navyše môže pridať iba:\n\n\n\n\n- Owner\n\n- Assistant\n\n- Main instructor\n\nTíto používatelia môžu ísť do Classes → Sessions → Add sessions a pridať nový dátum. \n\n\nTakže teraz budete musieť požiadať admina alebo hlavného inštruktora, aby pridali ten navyše termín do skupiny IBD.", "cited": ["Instructor Access and Roles FAQ | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Pomohla vám táto odpoveď?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak budete potrebovať ďalšiu pomoc s pridaním termínu, som tu pre vás. Chcete doplniť viac informácií o tom, čo potrebujete vyriešiť?", "cited": []}], "verdict": "gap", "vtitle": "Add an extra session to a class — not a make-up, an additional lesson", "vnote": "Re-asked 4x. The client is explicit that she does not mean a make-up, and the bot answered with class lists and instructor roles. Nothing in the KB distinguishes 'extra session for the whole group' from 'make-up for one client'. Check the session screen work from 14 Oct before writing.", "cat": "classes"}, {"channel": "intercom", "id": "215476648093305", "date": "2026-11-01 08:26", "day": "2026-11-01", "human": false, "bucket": "D_assumed_with_kb", "reask": 7, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Payment templates creation | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Add a one-off scheduled payment | Zooza Help"], "q": "Potrebujem pomocť chcem nahodiť aplikaciu p ed payments\n\n\n- nastaviť 8 splatok\n\nTáto šablóna potom môžeš použiť na registráciu klienta a Zooza rozdeli celú sumu na 8 rovnakých splatok.", "cited": ["Payment templates creation | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Odpovídá to na vaši otázku?", "cited": []}, {"role": "customer", "who": "Žabulienka", "text": "a už ta m potom nebude hádzať v novembri 2 splatky ?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Žabulienka, nebude.\n\n\nKeď použijete Fixed number of scheduled payments a nastavíte 8, Zooza jednoducho rozdeli celú sumu na rovnakých 8 splatok bez ohľadu na kalendár.\n\n\nTo znamená:\n\n\n\n\n- nebude 9 splatok v novembri\n\n- nebude „mesačný“ systém podľa počtu mesiacov\n\n- budú presne 8 rovnakých splatok\n\n\nTento typ šablóny je práve na tento prípad, keď chcete „mesačne“, ale myslíte tým 8 rovnakých splatok, nie 9. \n\n\n\nSource:\nPayment templates creation | Zooza Help", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Bylo to užitečné?", "cited": []}, {"role": "customer", "who": "Žabulienka", "text": "ok tak podme to vytvoriť", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Žabulienka, takto si vytvoríte šablónu na 8 rovnakých splatok:\n\n\n\n\n- Otevriť program.\n\n- Ísť do Settings → Price and payment.\n\n- V sekcii Payment templates pridať novú šablónu.\n\n- Typ vybrať Fixed number of scheduled payments.\n\n- Nastaviť počet na 8 a uložiť. \n\n\nTáto šablóna potom rozdeli celú sumu na 8 rovnakých splatok bez ohľadu na kalendár.", "cited": ["Payment templates creation | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Je to to, co hledáte?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Žabulienka, na obrázku ste na správnej obrazovke Šablóny frekvencie platieb.\n\n\nPostup:\n\n\n\n\n- Kliknite na Pridať (nahoře).\n\n\n- Typ šablóny vyberte Fixed number of scheduled payments.\n\n- Počet splatok nastavte na 8.\n\n- Uložte šablónu.\n\nTáto šablóna potom rozdeli celú sumu na rovnakých 8 splatok bez ohľadu na kalendár.", "cited": ["Payment templates creation | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Odpovídá to na vaši otázku?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak budete potrebovať ďalšiu pomoc s vytvorením šablóny, som vám k dispozícii. Chcete doplniť, čo sa vám teraz zobrazuje alebo čomu potrebujete lepšie porozumieť?", "cited": []}, {"role": "customer", "who": "Žabulienka", "text": "ok mam ako ju teraz uplatnim konkretne na tohto klienta len ?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Žabulienka, teraz ju uplatníte priamo na konkrétnej registrácii klienta.\n\n\nPostup:\n\n\n\n\n- Otevriť Bookings a otvoriť registráciu daného klienta.\n\n- Ísť do sekcie Payments.\n\n- V časti Payment Plan kliknúť na Create (ak tam ešte nič nie je) alebo Change (ak už je plan nastavený).\n\n- Vybrať vašu šablónu s 8 rovnakými splátkami a uložiť. \n\n\nTento plan sa potom aplikuje iba na túto jednu registráciu, ostatní klienti zostanú nezmenení.", "cited": ["Add a one-off scheduled payment | Zooza Help", "Payment templates creation | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Bolo to užitočné?", "cited": []}, {"role": "customer", "who": "Žabulienka", "text": "aleja by so mtam potreboval mať 8 riadkov datumov : prvý riadok 1. november - splatnosť 15. november a tak až do juna", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Žabulienka, áno — dá sa to urobiť.\n\n\nNa obrázku ste na obrazovke Prehľad platieb (záznam klienta → Payment plan).\n\n\nKeď chcete presné dáty ako v príklade (1. nov → 15. nov atď.), stačí ich ručne nastaviť.\n\n\nPostup:\n\n\n\n\n- Na Prehľad platieb kliknite na Zmeniť u danej splátky.\n\n- Zmeňte Dátum splatnosti na požadovaný dátum (napr. 15. november).\n\n- Ul
