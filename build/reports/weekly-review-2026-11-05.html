n- Klikněte na Detail u lekce, abyste ji otevřela.\n\n- Pod tabulkou je sekce Dates with incomplete attendance record – tam se objevují i minulé lekce, kde ještě nemáte zaznamenanou docházku. \n\n\nTakže ano – i dnešní lekci můžete najít tam, i když je už dnes.", "cited": ["Attendance and Catch-up Classes FAQ | Zooza Help", "Dashboard | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Odpovídá to na vaši otázku?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Pokud potřebujete s dnešní lekcí ještě pomoci, ráda vám pomohu. Chcete upřesnit, co se snažíte v Zooze najít nebo nastavit?", "cited": []}], "verdict": "product", "vtitle": "Instructor could not record attendance later — only next week showed", "vnote": "She was going to mark it at home and the session was gone from her view. Pairs with 215476719427069, where the attendance buttons disappeared entirely for an admin. Two reports in one week about attendance going out of reach. This is a product question, not a KB one — do not write around it.", "cat": "classes"}, {"channel": "intercom", "id": "215476608618831", "date": "2026-11-05 20:53", "day": "2026-11-05", "human": true, "bucket": "HUMAN", "reask": 9, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": ["Getting Started with Zooza | Zooza Help", "Discounts and Sibling Pricing FAQ | Zooza Help", "Price and payment setup | Zooza Help", "Discounts | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Loyalty Program | Zooza Help"], "q": "Hi Martin,\n\nI hope you’re doing well!\n\nWe spoke briefly about our Oradea franchise and their different payment plans, which Zooza doesn’t currently support. \n\nYou mentioned we could discuss this further to see how we can accommodate their setup and help them benefit from Zooza’s reports and insights.\n\nI’ve included a summary of their current plans and payment rules below.\n\n1. Course modules for the 2026–2027 school year\n\n\n- Module I: 7 Sep – 1 Nov 2026\n- Module II: 2 Nov – 22 Dec 2026\n- Module III: 11 Jan – 28 Feb 2027\n- Module IV: 1 Mar – 25 Apr 2027\n- Module V: 5 May – 29 Jun 2027 \n\n2. Subscription plans\n\n\n- IDEAL: 2 sessions per week, with the following day combinations: Monday & Wednesday, Tuesday & Thursday, or Wednesday & Friday. Each module includes 16 sessions of 70 minutes each. The price is 1,760 RON per module or 880 RON per month.\n- SINGLE DAY: 1 session per week, on any day from Monday to Friday. Each session lasts 70 minutes. The price is 1,150 RON per module or 575 RON per month.\n- WEEKEND: 1 session per week, on Saturdays. Each session lasts 75 minutes. The price is 1,280 RON per module or 640 RON per month. \n\n3. Discounts\n\n\n- 15% for full-year payment (all 5 modules), for registrations completed by September 30.\n- 10% for paying for two IDEAL modules in full. \n- 5% for siblings, applicable to the second, third child.\n- 5% for students who have passed the Soroban exam at 9 kyu or higher.\n- 7% for students who have achieved 4 kyu and are progressing through the expert levels (3, 2 and 1 kyu).Discounts can be combined, up to a maximum of 30%. They do not apply to course materials or exam fees.\n\n4. Invoicing and payments\n\nInvoices are issued monthly by default, during the last week of each month, unless parents request an invoice for the full two-month module.\n\nParents can pay for the entire school year, selected modules, or monthly. For module payments, payment must be made before the next module starts to keep the child’s place in the same group.\n\n \n\nI’ve cc’d Monica Tătar, the owner of the Oradea franchise.\n\nMonica, could you please check the details above and correct anything that isn’t accurate? \n\nIf everything is correct, just let us know so Martin can work with the right information.\n\nThanks to you both!\n\nBest,\nMara\n\n+40737 372 763", "turns": [{"role": "customer", "who": "Mara Bortea", "text": "Hi Martin,\n\nI hope you’re doing well!\n\nWe spoke briefly about our Oradea franchise and their different payment plans, which Zooza doesn’t currently support. \n\nYou mentioned we could discuss this further to see how we can accommodate their setup and help them benefit from Zooza’s reports and insights.\n\nI’ve included a summary of their current plans and payment rules below.\n\n1. Course modules for the 2026–2027 school year\n\n\n- Module I: 7 Sep – 1 Nov 2026\n- Module II: 2 Nov – 22 Dec 2026\n- Module III: 11 Jan – 28 Feb 2027\n- Module IV: 1 Mar – 25 Apr 2027\n- Module V: 5 May – 29 Jun 2027 \n\n2. Subscription plans\n\n\n- IDEAL: 2 sessions per week, with the following day combinations: Monday & Wednesday, Tuesday & Thursday, or Wednesday & Friday. Each module includes 16 sessions of 70 minutes each. The price is 1,760 RON per module or 880 RON per month.\n- SINGLE DAY: 1 session per week, on any day from Monday to Friday. Each session lasts 70 minutes. The price is 1,150 RON per module or 575 RON per month.\n- WEEKEND: 1 session per week, on Saturdays. Each session lasts 75 minutes. The price is 1,280 RON per module or 640 RON per month. \n\n3. Discounts\n\n\n- 15% for full-year payment (all 5 modules), for registrations completed by September 30.\n- 10% for paying for two IDEAL modules in full. \n- 5% for siblings, applicable to the second, third child.\n- 5% for students who have passed the Soroban exam at 9 kyu or higher.\n- 7% for students who have achieved 4 kyu and are progressing through the expert levels (3, 2 and 1 kyu).Discounts can be combined, up to a maximum of 30%. They do not apply to course materials or exam fees.\n\n4. Invoicing and payments\n\nInvoices are issued monthly by default, during the last week of each month, unless parents request an invoice for the full two-month module.\n\nParents can pay for the entire school year, selected modules, or monthly. For module payments, payment must be made before the next module starts to keep the child’s place in the same group.\n\n \n\nI’ve cc’d Monica Tătar, the owner of the Oradea franchise.\n\nMonica, could you please check the details above and correct anything that isn’t accurate? \n\nIf everything is correct, just let us know so Martin can work with the right information.\n\nThanks to you both!\n\nBest,\nMara\n\n+40737 372 763", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Hi there! Thanks for reaching out! I'm Zooza Support, Zooza's AI Agent and I'm well trained to answer your query but you can reply and ask for the team at any time.\n\n\nYour Oradea setup can be mapped to Zooza using programmes, payment templates, and discount rules.\n\n\n\n\n- Create one programme per module (e.g. Module I–V) and set the module price. \n\n\n- In Settings → Billing & Payments → Payment schedule templates, create templates such as:\n• Monthly instalments\n• One‑off payment\n• Full‑year payment\n• Then enable them in the programme under Settings → Price and payment → Payment Frequency so parents can choose how to pay.  \n\n\nDiscounts can be configured in two ways:\n\n\n\n\n- \nDiscount codes in Sales & Payments → Discounts → Discount codes (e.g. sibling or exam‑level codes).  \n\n\n- \nLoyalty Programme rules in Sales & Payments → Loyalty Programme for percentage discounts like sibling or exam‑level discounts. \n\n\nDiscounts can be applied as one‑off payments or distributed across instalments depending on the payment plan selected at booking.\n\n\nPlease let me know if this helps or if you have any further questions.\n\n\nPayments and Billing FAQ | Zooza Help\nLoyalty Program | Zooza Help\nDiscounts and Sibling Pricing FAQ | Zooza Help\nGetting Started with Zooza | Zooza Help\nPrice and payment setup | Zooza Help\nDiscounts | Zooza Help", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Wait for the team", "cited": []}, {"role": "human", "who": "Martin", "text": "Hi Mara, thank you very much for this. \n\n\nCan you please elaborate little bit more on the subscription plans? It is not clear to me whether as a parent I can for example pick up Single day and Weekend at the same time. Also it would be great to understand how the classes work physically. Regardless of where I sign up my child - do they physically end up in the same venue? In other words do children with one day, multiple days end up in the same room at the same time?\n\n\nOn discounts - have you tried to set up the loyalty programme for sibling discounts? I just want to understand whether that is absolutely not possible to use it for this scenario or it sort of works but has some edge cases that need to be sorted out.\n\n\n\n\n\nYou're right that the offer seems quite complex - even from a parent perspective. However, we will do our best to make this work. In the end that is what we're here for.\n\n\n\n\n\nAll the best,\n\n\nMartin", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Hi Martin! It would be great if we could exchange messages via e-mail so that Monica is included, please!", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Hi Martin,\n\n\nThank you for your quick reply!\n\n\nFrom my point of view, the biggest challenge is setting up monthly or per-module payments, regardless of when a child joins, as the modules have fixed start and end dates.\n\n\nFor Oradea, I have already set up the groups starting in September in Zooza, as best as I could. The Ideal and Single Day groups are set up separately, but they share the same sessions, as children enrolled in the Single Day programme are meant to attend the same classes as those enrolled in the Ideal programme.\n\n\nThe biggest challenge is finding a payment structure that works for all these options, especially as the modules have fixed dates and children may join at different times.\n\n\nMany thanks!\n\n\nMara", "cited": []}, {"role": "human", "who": "Martin", "text": "Thank you for your response. I would still probably need little more information to get the full picture. Let me think about the best way forward. Recently we’ve introduced couple features which might be useful and you might not be aware of them. One of those would be session gluing - a feature that allows multiple classes to share same capacity, or per block membership payments…\n\n\nBut I’ll get back to you with more questions soon;)\n\n\nAll the best\n\n\nMartin", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Hi Martin,\n\n\nThank you so much! Looking forward to hearing from you 😊\n\n\nIn the meantime, here are a few links that might be helpful for getting a better picture of the current setup for Nomin Jyuku Oradea:\n\n\nProgrammes: https://zooza.app/#courses?status=not_archived&sort_by=created_desc&filter=filter&page=0\n\n\nClasses: https://zooza.app/#courses/schedules?bp=3071|3072|3073&sort_by=created_desc&page=0&load_trainer=true\n\n\nSessions & shared sessions: https://zooza.app/#courses/events?filter=filter&page=0&page_size=50&sort_by=upcoming_asc\n\n\nWebsite calendar: https://nominjyuku.ro/alegeti-locatia-dvs/oradea/calendar/\n\n\nMonica’s team is currently using Zooza only to contact leads, as we still need to get the payment plans set up correctly before they can use it for their classes. \n\n\nHopefully, some of the features you mentioned could help us find the right setup for their needs.\n\n\nThanks again!\nMara", "cited": []}, {"role": "human", "who": "Martin", "text": "Mara, I think I found good way how to get the best brief possible from you. I can set up AI agent to perform an interview with you (in romanian) to get gap analysis between what we already have in place. But it will require an account with Claude (Anthropic). Can you send me email adresses of anyone who can take the interview? ideally two or more persons.\n\n\nMany thanks,\n\n\nMartin", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Hi Martin,\n\n\nA few quick questions:\n\n\n\n\n- Does the Claude account need to be a paid subscription or would a free account be sufficient?\n\n- Do the interviewees need to have a good understanding of how Zooza works? The Oradea team is not quite there yet.\n\n- It seems clear to me that one of the interviewees should be someone from Oradea who knows their offering in detail. Would you recommend that I be the second interviewee?\n\nThanks for clarifying!\n\n\nMara", "cited": []}, {"role": "human", "who": "Martin", "text": "It should be available with free subscription and no the interviewer is specifically tasked not to throw zooza jargon at the respondent. Just to give you an idea, this is the first question:\n\n\nAnd yes, it would be best if someone directly from Oradea could provide the answers. To be honest if we can get even five people to to through it it would be great as I'm sure we'd get better insights that way. To be honest I kind of took you for granted:) It would not be proper interview without your responses, you know business from top to bottom.\n\n\n\n​\n\n\nThanks,\n\n\nMartin", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Got it, thank you! I think there’ll probably be three of us: Monica, Andrea, and myself.\n\n\nJust so we have an idea, how long would the interview take? I’ll check with Monica and get back to you.\n\n\nHave a lovely evening!", "cited": []}, {"role": "human", "who": "Martin", "text": "It depends on how good your answers will be:) The agent will followup until it is satisfied with the answers. My test run took about 30 minutes, but I guess it will take longer than that. Please do send me those email adresses or if you'll be together physically you can take turns on the same computer:)\n\n\n\n​\n\n\ncheers,\n\n\nMartin", "cited": []}, {"role": "human", "who": "Martin", "text": "Hi Mara, I just want to check in with you whether you have those test emails for me? Thank you Mara:)", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Hi Martin,\n\n\nThank you for your patience!\n\n\nHere are the e-mail addresses: oradea.expert@gmail.com (Monica), oradea.nominjyuku@gmail.com (Andrea) and contabilitate@nominjyuku.ro (Mara).\n\n\nBest,\n\n\nMara", "cited": []}, {"role": "human", "who": "Martin", "text": "Hi Mara, thank you for those. I sent invites for the claude artifact. It should save the answers to my account but just in case it does not, please instruct Monica and Andrea to download the transcript at the end of the interview, just to be safe:)", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Hi Martin, \n\n\nThank you! We’ve received our invites. \n\n\nHopefully, you’ll have our answers by the end of the week. \n\n\nWe’ll make sure to save the transcripts too.\n\n\nHave a lovely day!\n\n\nMara", "cited": []}, {"role": "human", "who": "Martin", "text": "Great, btw don't worry about the answers too much. You can retake the interview as many times as you want:)\n\n\nMartin", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Hi Martin,\n\n\nJust tried to open the invitation link and got this message:\n\n\nThanks!", "cited": []}, {"role": "human", "who": "Martin", "text": "Hi, all three emails are now editors, did the app offer the transcript download or not even that?", "cited": []}, {"role": "human", "who": "Martin", "text": "I saw Andrea's interview came in successfuly. According to Claude it took 3 hours? OMG!", "cited": []}], "verdict": "product", "vtitle": "Oradea franchise payment plans Zooza does not support yet", "vnote": "A long discovery thread, mostly product work. Two things to carry out of it: session gluing (several classes sharing one capacity) and per-block membership payments exist and franchise owners do not know about them — worth checking the KB covers them findably. The rest is specification, not documentation.", "cat": "pricing"}, {"channel": "intercom", "id": "215476720674241", "date": "2026-11-05 17:56", "day": "2026-11-05", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Roles and Permissions FAQ | Zooza Help", "Role Selection Guide | Zooza Help", "Settings | Zooza Help"], "q": "kde nájdem mapu rolí", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Katarina Klemanová", "text": "kde nájdem mapu rolí", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Mapu rolí nájdete v Settings → Team → Access.\n\n\nNa tejto obrazovke je pod formulárom na pridávanie používateľa tabuľka s porovnaním rolí (role matrix), kde vidíte, čo každá rola môže a nemôže robiť.\n\n\nTu tiež môžete meniť rolu konkrétnemu členovi tímu.", "cited": ["Roles and Permissions FAQ | Zooza Help", "Role Selection Guide | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak potrebujete ďalšiu pomoc s mapou rolí alebo nastavením prístupov, som tu pre vás. Chcete opísať, čo sa ešte snažíte nájsť alebo nastaviť?", "cited": []}, {"role": "customer", "who": "Katarina Klemanová", "text": "stále to neviem nájsť", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Katarina, na tejto obrazovke by ste mali mať mapu rolí:\n\n\n\n\n- Idite do Settings (Nastavenia)\n\n- Potom Team → Access\n\n\nPod formulárom na pridávanie používateľa sa zobrazí tabuľka s porovnaním rolí (role matrix), kde vidíte, čo každá rola môže robiť. \n\n\nNa tejto obrazovke môžete tiež vybrať používateľa a zmeniť mu rolu v rozbaľovacom menu.\n\n\nVidíte na tejto stránke formulár na pridávanie používateľa?", "cited": ["Roles and Permissions FAQ | Zooza Help", "Settings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc s nájdením mapy rolí, rada vás tým prevediem. Môžete opísať, čo sa na obrazovke zobrazuje alebo čo sa snažíte nastaviť?", "cited": []}], "verdict": "gap", "vtitle": "Where do I find the role map", "vnote": "Re-asked 2x against three role articles, none of which says where the map is. Answered by 215476719727857 — collapsible panel at the bottom of Settings > Team > Add. Small fix, clear win.", "cat": "team"}, {"channel": "intercom", "id": "215476663173415", "date": "2026-11-05 16:11", "day": "2026-11-05", "human": true, "bucket": "HUMAN", "reask": 0, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": [], "q": "Zdravím,\n\n\nnastavil som, aby na vybraných kurzoch chodili 40 a 33 dní pred začiatkom skupiny pripomienky ohľadom platby.\n\n\nPrešiel som pár registrácii zo skupiny, kde už je to menej ako 40 dní pred začiatkom a systém neodoslal žiadne notifikácie na platbu. \n\n\n\n\n\n\n\nhttps://zooza.app/#courses/schedules/91487\n\n\nKde mohol nastať problém?\n\n\nS pozdravom\n\n\nJakub_MEDVEDICA", "turns": [{"role": "customer", "who": "Jakub Majoroš", "text": "Zdravím,\n\n\nnastavil som, aby na vybraných kurzoch chodili 40 a 33 dní pred začiatkom skupiny pripomienky ohľadom platby.\n\n\nPrešiel som pár registrácii zo skupiny, kde už je to menej ako 40 dní pred začiatkom a systém neodoslal žiadne notifikácie na platbu. \n\n\n\n\n\n\n\nhttps://zooza.app/#courses/schedules/91487\n\n\nKde mohol nastať problém?\n\n\nS pozdravom\n\n\nJakub_MEDVEDICA", "cited": []}, {"role": "human", "who": "Martin", "text": "Dobry den Jakub, mame tam hardkodovany limit na 35 dni. Nikde ho nehovorime, lebo sme s tym nepocitali, ze by to niekto chcel az takto stretchnut. Vieme to fixnut samozrejme ak to potrebujete. Kedze tam mate takyto delay, skusim sa opytat este na toto: riesime dve suvisiace poziadavky - 1) pridat tretiu pripomienku; 2) moznost zaplatit celu cenu kurzu N dni pred jeho zaciatkom s tym, ze bude mozne kurz zaplatit v splatkach. Mame zakaznika co uz teraz predava nieco podobne ako su Vase zajazdy ale cez letne prazdniny. Predaj chcu spustit v januari s tym, ze zakaznikom chcu nechat moznost kurz splacat od januara do jula (kedy kurz zacina).\n\n\nCize otazka je, ci nemate nejaky komentar k tymto dvom bodom, aby sme pripadne este vedeli upravit specifikaciu.\n\n\nDakujem,", "cited": []}, {"role": "customer", "who": "Jakub Majoroš", "text": "Dobrý deň,\n\n\nvzťahuje sa limit aj na druhú pripomienku? Pretože tá je nastavená na 33 dní pred a neodišla taktiež. \n\n\nAk by to bolo možné, prosím o posunutie limitu. 40 dní máme pri sústredkách ako dobu, keď by mal byť príspevok za ubytovanie plne uhradený.\n\n\n- Viete mi tú 2. možnosť bližšie popísať? Trošku sa v nej strácam.\n\n\nĎakujem\n\n\nMajoroš", "cited": []}, {"role": "human", "who": "Martin", "text": "Jasne, upravime to. Ano vztahuje sa to aj na druhu pripomienku, lebo ten limit je vlastne prva + druha pripomienka, cize ak ma prva pripomienka 40 dni a druha 35 tak v skutocnosti ta druha sa spocita na vyslednych 75 dni. Co sa tyka tych splatok - v principe mame iba dve moznosti ako vyzbierat nejake peniaze pred zaciatkom kurzu: a) cela suma kurzu je uhradena v jednej platbe; b) uhradim cast vo forme zalohy a potom zvysok; K tymto dvom moznostiam chceme pridat tretiu: c). uhradim celu cenu kurzu (alebo jeho cast) pred zaciatkom kurzu v splatkach. Cize napriklad ak je dnes januar a kurz zacina v juli, mam 5 mesiacov, na ktore si viem rozlozit platbu. Kurz stoji 1000 eur takze mesacna platba bude 1000 / 5 mesiacov. Ak by som to iste urobil v aprili, uz mi ostavaju len tri mesiace a teda mesacna platba bude vypocitana vzorcom 1000 / 3. Momentalne sme vo face specifikacie a teda zbierame podnety a informacie k tomu ako by to malo fungovat takze detaily su este otvorene.\n\n\n\n​\n\n\nDakujem,\n\n\nMartin", "cited": []}, {"role": "customer", "who": "Jakub Majoroš", "text": "Zdravím,\n\n\nuž chápem, čiže platba na splátky, ktorá automaticky upravuje splátku podľa obdobia, kedy sa klient prihlásil. To nie je zlý nápad, aj keď pre nás to nie je až taká priorita. Skôr by sme uvítali napr. dynamické ceny, či automatické upozornenie po splatnosti zálohy.\n\n\n- Tiež som si všimol, že filter stav platby, má problém niekedy rozpoznať reálny stav platby na registrácii. Napr. mal som registrácie, ktoré mali zaplatenú zálohu, ale nemali zaplatenú celú sumu, čiže by mali figurovať ako \"finálna platba nezaplatená\". Tieto registrácie však daný filter neodfiltroval, pokým som do nich nevstúpil a ich stav sa zo zeleného znaku eura následne prepol do červeného. Až potom ich filter zobral. Neviem, či uhradená záloha trošku nerobí šarapatu s týmto filtrom. Lebo takéto registrácie sú vedené ako \"zaplatené\", aj keď defacto nie sú. \n\n\n- Môžem sa ešte opýtať, ako to vyzerá s novým prihlasovaním na ubytká? \n\n\nS pozdravom\n\n\nJakub", "cited": []}, {"role": "human", "who": "Martin", "text": "Ked sa Vam take prihodi tak to poslite cislo registracie a cas a preverime to. Zrejme tam je nejaky priestor v materializaciach, ktory nezachyti zmeny na ucte registracie. K tomu ubytovaniu sa dostaneme predpokladam buduci tyzden naplno takze tam ideme zatial podla planu.", "cited": []}, {"role": "human", "who": "Martin", "text": "Jakub upravili sme tie notifikacie aby tam nebol ziadny casovy limit. Po novom by teda uz mali chodit vsetky aj 360 dnove:)", "cited": []}, {"role": "customer", "who": "Jakub Majoroš", "text": "🙏\n\n\nJakub Majoroš reacted via Gmail", "cited": []}, {"role": "customer", "who": "Jakub Majoroš", "text": "Zdravím,\n\n\nešte som si dnes všimol, že pri mazaní spoločných registrácií (za čo ďakujem), je tam voľba vymazať objednávku, no pri vymazaní zostávajú objednané služby na registrácii, čiže sa akoby vymaže len produkt. \n\n\nNeviem, či to tak má fungovať, ale pre istotu to reportujem.\n\n\nS pozdravom\n\n\nJakub", "cited": []}, {"role": "human", "who": "Martin", "text": "Co tym myslite, ze ostavaju objednane sluzby na registracii? Viete dat nejaky priklad? Respektive opisat ten dopad? Nech viem povedat ci je to zamer:)))", "cited": []}, {"role": "customer", "who": "Jakub Majoroš", "text": "Zdravím,\n\  obratte.", "cited": []}, {"role": "customer", "who": "barbora zajacová", "text": "Dobry den, pripajam este Katku od nas, riesili sme interne tie pripomienky.\n\n\nNaozaj by sme chceli tu 3 pripomienku - rozumiem co pisete nizsie aj otvaranie mailov a tak.\n\n\nCo by bolo potreba z nasej strany dodat/doriesit aby sme mohli diskutovat tu 3 pripomienku?\n\n\ndakujem pekne, \n\n\nb\n\n\n\n​", "cited": []}, {"role": "human", "who": "Martin", "text": "Dobry den barbora, vraciam sa k tejto teme. Nejak to zapadlo :/ Plati toto este, mate potrebu tej tretej pripomienky?", "cited": []}, {"role": "customer", "who": "INFO Ela Jazykovka", "text": "pozdravujem, odpoviem za nás, že by to bolo pre nás strašne super keby sa to nastaviť dá - pokojne aj ako whastapp správa ak nie mailov'a. neviem či to je rozdiel...\nĎakujem\n​\n\n\nKatarína \n\n\nDňa 2026-10-28 10:43 Martin from Zooza napísal(a):    \n\n\nDobry den barbora, vraciam sa k tejto teme. Nejak to zapadlo :/ Plati toto este, mate potrebu tej tretej pripomienky?    #132401066: Nastavenie pripomienky k platbe ·Resolved\n\n\n\n\n\nWe're here to help  Reply directly to this email or through our Messenger    \n\n\nMartin\n\n\nZoozahelp.zooza.onlineThis email and any attachments are confidential and intended solely for the recipient. If you are not the intended recipient, please notify the sender and delete this email. Any unauthorised use, disclosure, or distribution is prohibited.  On Mon, Sep 28, 2026 at 07:54 AM, fakturacia@ela-jazykovka.sk wrote:\n​\n\n\nDobry den, pripajam este Katku od nas, riesili sme interne tie pripomienky.\n\n\nNaozaj by sme chceli tu 3 pripomienku - rozumiem co pisete nizsie aj otvaranie mailov a tak.\n\n\nCo by bolo potreba z nasej strany dodat/doriesit aby sme mohli diskutovat tu 3 pripomienku?\n\n\ndakujem pekne,\n\n\nb\n\n\n\n​\n\n\n\n​", "cited": []}, {"role": "human", "who": "Martin", "text": "Dakujem za info. Skusime to zaradit do vyvoja a nejako to vyriesit. Mozno ale ak by ste mali zaujem o ull, "carried": null, "sources": [], "q": "ako mám prijmuť zastupovanie", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": "Adrian Lukáč", "text": "ako mám prijmuť zastupovanie", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumiem, že chcete prijmuť zastupovanie. Chcete, aby som vás prepojil s ľudským agentom, alebo môžete mi ďalej povedať, na ktorej stránke sa vám zobrazuje, a pokúšam vám pomôcť?", "cited": []}, {"role": "customer", "who": "Adrian Lukáč", "text": "som v zooze a neviem kde mám prijať žiadosť o zastupovanie vo firme, keď mi prišiel email", "cited": []}, {"role": "human", "who": "Martin", "text": "Dobry den Adrian, mal by Vam prist email, pokial Vas niekto poziada o zastupovanie", "cited": []}, {"role": "customer", "who": "Adrian Lukáč", "text": "áno, ale je tam napísané: Lektorom bola vytvorená požiadavka na zastupovanie termínu, o ktoré ste boli požiadaný. Vyžaduje sa aby ste požiadavku schválili alebo zamietli.", "cited": []}, {"role": "customer", "who": "Adrian Lukáč", "text": "a neviem kde to schváliť", "cited": []}, {"role": "human", "who": "Martin", "text": "Mal by tam byt priamo odkaz na dany termin, nie je tam?", "cited": []}, {"role": "customer", "who": "Adrian Lukáč", "text": "skúsim", "cited": []}, {"role": "customer", "who": "Adrian Lukáč", "text": "áno našiel som Ďakujem, pekný večer ešte", "cited": []}, {"role": "human", "who": "Martin", "text": "Nemate zac, pekny vecer aj Vam", "cited": []}], "verdict": "check", "vtitle": "How to accept a substitution", "vnote": "An email arrives with a direct link to the session. Small; check the instructor articles mention it.", "cat": "team"}, {"channel": "intercom", "id": "215476699255050", "date": "2026-11-04 17:30", "day": "2026-11-04", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Using Zooza on mobile | Zooza Help", "Role Selection Guide | Zooza Help", "Add instructors and manage their access | Zooza Help"], "q": "Dobrý deň, prosím ako vyriešim ak má tréner účet zooza už v inej spoločnosti?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": "Martina Izakovičová", "text": "Dobrý deň, prosím ako vyriešim ak má tréner účet zooza už v inej spoločnosti?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dobrý deň, Martina. To je úplne v poriadku.\n\n\nTréner môže mať účet v viacerých spoločnostiach súčasne. Stačí, keď ho pridáte ako instruktora aj vo vašom účte. \n\n\nPostup:\n\n\n\n\n- Settings → General → Access\n\n- kliknúť na Add\n\n\n- zadať meno a email trénera\n\n- vybrať rolu a uložiť\n\nTréner potom môže pracovať v oboch účtoch a medzi nimi prepínať bez odhlasovania. \n\n\nDôležité: role sú vždy na účet, takže tréner má samostatný profil v každej spoločnosti.", "cited": ["Role Selection Guide | Zooza Help", "Using Zooza on mobile | Zooza Help", "Add instructors and manage their access | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Je to to, co hledáte?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak potrebujete s týmto nastavením ešte pomôcť, som tu pre vás. Chcete doplniť, čo sa snažíte nastaviť alebo čomu potrebujete lepšie porozumieť?", "cited": []}, {"role": "customer", "who": "Martina Izakovičová", "text": "ako sa vie prekliknuť z jednej firmy do druhej prosím?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Martina, tréner sa môže medzi spoločnosťami prepínať priamo v aplikácii bez odhlasovania. \n\n\nPostup:\n\n\n\n\n- kliknúť na svoj avatar alebo iniciály v pravom hornom rohu\n\n- kliknúť na názov spoločnosti alebo Switch account\n\n\n- vybrať spoločnosť, do ktorej chce prejsť\n\nAk sa možnosť prepínania nezobrazí, znamená to, že účet má prístup iba k jednej spoločnosti.\n\n\n\nSource:\nUsing Zooza on mobile | Zooza Help", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Pomohla vám táto odpoveď?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak budete potrebovať ďalšiu pomoc s prepínaním medzi spoločnosťami, som tu pre vás. Chcete doplniť, čo sa trénerovi zobrazuje alebo čomu potrebuje lepšie porozumieť?", "cited": []}], "verdict": "gap", "vtitle": "The trainer already has a Zooza account in another company", "vnote": "Re-asked 2x. Common in franchise networks and the cited articles are about mobile use and role selection. One person, one email, several companies — document how the invite behaves and how they switch. Note the account switcher is at the BOTTOM of the Dashboard via the Zooza logo, which the owner corrected us on in August; do not repeat the old 'in the profile' wording.", "cat": "team"}, {"channel": "intercom", "id": "215476696160443", "date": "2026-11-04 14:00", "day": "2026-11-04", "human": true, "bucket": "HUMAN", "reask": 33, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": ["Blocks Configuration and Management | Zooza Help", "Blocks (Term Segments) FAQ | Zooza Help", "Payment templates creation | Zooza Help", "Membership prices by number of blocks selected | Zooza Help"], "q": "I'm struggling to apply block pricing correctly. I need help.", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "I'm struggling to apply block pricing correctly. I need help.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Sarah, block pricing is set on the class, not the programme. \n\n\nSteps:\n\n\n\n\n- Open the class → go to Prices tab\n\n- Find the pay‑as‑you‑go frequency (monthly, quarterly, yearly)\n\n- Click Block pricing\n\n\n- Enter the price for 1 block, 2 blocks, 3 blocks…\n\n\n- Leave a row blank to use the full price\n\n- Click Save \n\n\nImportant:\n\n\n\n\n- Each block price must be equal to or lower than the base price for that frequency.\n\n- Clients will see the price update automatically as they select blocks in the booking form.\n\nIf you want, tell me what you’re trying to charge (for example: 1 day vs 2 days), and I can walk through the exact numbers with you.", "cited": ["Membership prices by number of blocks selected | Zooza Help", "Payment templates creation | Zooza Help", "Blocks Configuration and Management | Zooza Help", "Blocks (Term Segments) FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "I have blocks set so 3 blocks is £195 but the client is being charged £210.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I understand how frustrating it is when the client is charged more than expected. Would you like me to connect you with a human agent? If not, please share the relevant booking or pricing details and I’ll continue helping you.", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "Yes", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I’ll pass you to someone who can help. Please share any relevant booking or pricing details, along with what you expected the client to be charged, so they have the full context.", "cited": []}, {"role": "human", "who": "Martin", "text": "Hi Sarah, I can see your message, but I'd need to go and revisit your setup", "cited": []}, {"role": "human", "who": "Martin", "text": "At the same time - can you please tell me what is the pricing you want to have there? is it a one off payment or a monthly subscription?", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "Child is Ashvini and they are enrolled on a Saturday for three blocks. Monthly subscription.", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "It seems all students with three blocks are being charged £210 whereas three blocks is £195.", "cited": []}, {"role": "human", "who": "Martin", "text": "Thank you, I'm going to check that", "cited": []}, {"role": "human", "who": "Martin", "text": "Are you able to send me booking number please?", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "1893", "cited": []}, {"role": "human", "who": "Martin", "text": "Parent is Kopitha Jesudhasan?", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "yes", "cited": []}, {"role": "human", "who": "Martin", "text": "Thank you. I'm looking at it and will get back to you soon", "cited": []}, {"role": "human", "who": "Martin", "text": "Sarah, it appears that the payment plan was created 19th of October when the block settings for three blocks was set to £210. You changed the price later on 23rd of October.", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "Oh - so changing pricing only affects things moving forwards?", "cited": []}, {"role": "human", "who": "Martin", "text": "Yes of course. You would not want to refund or charge everyone at price increase or decrease. That is a fixed contract between you and your customers.", "cited": []}, {"role": "human", "who": "Martin", "text": "If you need to do bulk change of payment plans this is possible from the class detail screen", "cited": []}, {"role": "human", "who": "Martin", "text": "On the payment card you can re-create the payment plans for everyone", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "OK - so I will go into each three block student and manually update - is it best to change their payment plan?", "cited": []}, {"role": "human", "who": "Martin", "text": "depending on how many there are in a class but I'ld suggest going via Class detail -> Apply payment plan -> select bookings which have three blocks and reapply the payment plan", "cited": []}, {"role": "human", "who": "Martin", "text": "There is one other way to do this", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "The Liverpool owner has also told me that she only charges a half month if someone finishes mid month - NOT something we recommend! I'm not sure how to handle that.", "cited": []}, {"role": "human", "who": "Martin", "text": "In Payments -> Scheduled payments -> there is an option to do bulk change on scheduled payment amounts", "cited": []}, {"role": "human", "who": "Martin", "text": "You can always manually adjust any payment that is in scheduled status so it is absolutely possible to change the amount to whatever amount you want. There is also possibility to credit customers when cancelling sessions. So this probably depends on the business needs", "cited": []}, {"role": "human", "who": "Martin", "text": "What I'd do in that case is probably this: I'd schedule a cancellation on that booking so that it finishes mid month and then I'd cancel the payment plan and adjust the debt on the booking manually.", "cited": []}, {"role": "human", "who": "Martin", "text": "If this is something you plan on doing regularly we could add this directly to the booking cancellation process so that it is handled at once", "cited": []}, {"role": "human", "who": "Martin", "text": "But this depends on you. You said it is something you don't endorse as a good practice:)", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "No - we don't endorse that so I'm not inclined to make it part of the process! Thanks. I will work with Kirsty on the students she's already agreed to discount and hopefully persuade her not to do that moving forwards!", "cited": []}, {"role": "human", "who": "Martin", "text": "Ok Sarah. BTW I don't know whether you noticed but the option to hide the QR codes has been added to the parent portal's settings so you can turn it off now", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "Yes - I've just done that - it was my birthday yesterday so I took the day off!", "cited": []}, {"role": "human", "who": "Martin", "text": "Ah, thats awesome. Happy B'day Sarah!!!", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "Can we note somehow for it to be off by default for new centres joining?", "cited": []}, {"role": "human", "who": "Martin", "text": "I'm not sure, but we can look into it from the network perspective as a preset", "cited": []}, {"role": "human", "who": "Martin", "text": "And on the cancellations - we recently added list of cancellation reasons so that you get better overview why people cancel their classes. This list can be customised to your liking so perhaps you can have a look into that if that is of interest to you", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "I've added a note to our setup form.", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "I've not looked at cancellation yet as generally we are in such close contact with parents we don't need a 'system' as such for it.", "cited": []}, {"role": "human", "who": "Martin", "text": "Yeah, I get it. It's there though, should you want to explore that later", "cited": []}, {"role": "human", "who": "Martin", "text": "Is there anything else I can help you with?", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "No - thank you", "cited": []}, {"role": "human", "who": "Martin", "text": "Thank you Sarah. Have a great day:)", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "You too", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "Sorry me again - lots of families make one bank transfer payment to cover all their bookings. We are struggling to work out how to reconcile these.", "cited": []}, {"role": "human", "who": "Martin", "text": "This is larger topic. Typically all payments are reconciled against a reference number. Such reference number allows us to automatically reconcile payments that flow from bank. There are multiple ways how a reference number can appear on a bank statement:\n1) QR code contains it automatically\n2) Parent can enter it into the Note field manually\n\nCurrently parents do type something into the note fields. These are real examples from your payments:\n​\n\n\nWhat we are currently working on is a loose payment reconciliation based on the customer's name, where the system could try to reconcile to latest unpaid booking if the name matches the payer but this is not 100% reliable system as there might be two customers with the same name for example, or as you can see from the screenshot, not everyone states their name correctly.", "cited": []}, {"role": "human", "who": "Martin", "text": "So the whole reconciliation system has these parts: \n1) Sending the payment along with a reference number\n2) Getting payments into zooza\n3) Automated payment reconciliation based on the reference number\n4) Manual payment reconciliation by admin\n\nPoint one is the crucial one. QR codes handle this automatically other than that it is a instructions in the email you send to customers. They should see something like: Please enter your reference number when making a payment into note field. Your reference number is: XXXX (the reference number is the booking number, there is a merge tag for this: *|REGISTRATION_ID|*", "cited": []}, {"role": "human", "who": "Martin", "text": "Point 2 - getting payments into zooza - you already have that", "cited": []}, {"role": "human", "who": "Martin", "text": "Point 3 - Making loose payment reconciliation based on customer's name - this is something we're working on at the moment. But I don't expect that this would be able to reconcile all the payments. Typically with the reconciliation against reference number we get up to 80-99% of success rate. I'd expect somewhere between 50 - 70% with the customer name being the only reference we have available", "cited": []}, {"role": "human", "who": "Martin", "text": "Point 4 - this is something you already do - find unreconciled payments in the App and match them against the booking", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "So I can see what we probably need to do with new parents moving forwards. How do we deal with the existing payments being made?", "cited": []}, {"role": "human", "who": "Martin", "text": "I would simply do the manual reconciliation. What we will do is this - we will add a step in the reconciliation process which will look up the last booking that was assigned to that payer. So if we receive payment from IBAN X and we see that previous payment from that IBAN was paired to booking Y, we'll pair it to that booking. So in theory once you pair the payments to correct bookings, any future payments that will arrive from that same IBAN will be paired to that same booking. Obviously only if the process itself allows it. For example we won't automatically reconcile payments to canceled bookings...", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "Please will you look at, for example, Vicky Willis? It is showing as £135 overpaid for Allegra and £135 outstanding for Alexander. I don't know what Kirsty's done but I'm struggling to help her!", "cited": []}, {"role": "human", "who": "Martin", "text": "do you have booking numbers at hand?", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "1844 and 1831", "cited": []}, {"role": "human", "who": "Martin", "text": "Ok so this is what the ledger shows - Booking #1844 - The current debt is £70. Kirsty paired parent's payment of £205 which gives us remainder of £135 that are an excess - over the required debt on the booking.\n\nThe booking #1831 has currently a debt of £135 with no credit transactions recorded.", "cited": []}, {"role": "human", "who": "Martin", "text": "So the 1844 booking is currently sitting as overpaid and next time when another instalment will be processed this will be subtracted from that amount. If that payment in fact belongs to booking 1831, you'd need to transfer that payment to that booking", "cited": []}, {"role": "human", "who": "Martin", "text": "You can do that by going into the credit transaction detail and choose the transfer transaction option", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "That total payment of £205 is for both bookings, £70 to #1844 and £135 to #1831.", "cited": []}, {"role": "human", "who": "Martin", "text": "I see, so the parent essentially sent single payment to both bookings?", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "Yes and that's common with established centres.", "cited": []}, {"role": "human", "who": "Martin", "text": "Ok. So there are couple ways to solve this. Should the parent do booking via booking form on your website, zooza would automatically merge both bookings together and create combined payment plan for both kids. But since these were created manually it is up to you to decide whether they should or should not be linked together. So there are two major paths you can take:\n1) Reconcile this payment only: I would issue payment correction on booking #1844 for £135 and record payment for that same amount to booking #1831 with the note where it came from (Transfered from booking 1844 for example)\n\n\n2) Solve this for future payments - The ultimate solution is to link booking #1831 to booking #1844. To do that, navigate to booking #1844. at the bottom of the screen you'd see the option for adding new linked registration. Find booking #1831, crucially make booking 1844 PAY for booking 1831. The last step would be to edit the payment plan on booking 1844 and change the future scheduled payments from £70 to £205", "cited": []}, {"role": "human", "who": "Martin", "text": "Again - if parent would do this by themselves via the booking form, this would be handled automatically, but these were created manually and zooza has no way of knowing that parent would want to pay with single payment so it needs to be set up manually", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "Is that right? I can't see an option to make 1844 pay for 1831.", "cited": []}, {"role": "human", "who": "Martin", "text": "I think it is a separate step after the linking. Yes you're on the correct screen", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "OK I managed to tell the system that 1844 pays for 1831.", "cited": []}, {"role": "human", "who": "Martin", "text": "Nice, the last step would be to edit its payment plan and change the amount to pay to £205 on all future installments", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "So it won't pick up the amount from 1831?", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "Is that right?", "cited": []}, {"role": "human", "who": "Martin", "text": "No need to reapply the plan again", "cited": []}, {"role": "human", "who": "Martin", "text": "Just open the existing plan and change the future instalments", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "Sorry I don't know how to do that.", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "Point me to a help file?", "cited": []}, {"role": "human", "who": "Martin", "text": "On the booking detail you have this tile:", "cited": []}, {"role": "human", "who": "Martin", "text": "Just below that is a payment plan tile:\n​", "cited": []}, {"role": "human", "who": "Martin", "text": "Click the payment plan detail button", "cited": []}, {"role": "human", "who": "Martin", "text": "You'll see that there are two scheduled payments for 70 pounds. Just hit edit and change the amount to 205", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "Will that change all payments moving forwards?", "cited": []}, {"role": "human", "who": "Martin", "text": "yes", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "ok - thanks for your help.", "cited": []}, {"role": "human", "who": "Martin", "text": "BTW this is useful for the future", "cited": []}, {"role": "human", "who": "Martin", "text": "For example", "cited": []}, {"role": "human", "who": "Martin", "text": "If you want to change a price for a customer going forward OR you want to reschedule the payment to fall on different date/day, you'd simply change the LAST scheduled payment", "cited": []}, {"role": "human", "who": "Martin", "text": "So if I would want this customer to pay not on 1st of january but on 15th of january, I don't have to reapply the plan. I would simply change the due date on that last payment and from that point going forward all future installments would fall on 15th", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "I've made a note of that - there's so much to remember!", "cited": []}, {"role": "human", "who": "Martin", "text": "Yeah, life brings plenty of variety and that is so fascinating about this industry. It's not flipping burgers:) But don't worry, we're here to help and as always - if you see a place for improvement, let us know. we'll do our best to help with that.", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "Thanks", "cited": []}], "verdict": "gap", "vtitle": "To change a price or a payment date going forward, edit the LAST scheduled payment", "vnote": "51 replies with Sarah on block pricing, and this is the reusable nugget at the end: you do not need to re-apply the plan. Change the due date or amount on the last scheduled payment and every future instalment follows from there. Given that re-applying wipes existing charges (see 215476642624600), this is the safe move and it is nowhere in the KB. Check the 24 Oct block-pricing write-up for overlap before adding.", "cat": "pricing"}, {"channel": "intercom", "id": "215476698433971", "date": "2026-11-04 13:59", "day": "2026-11-04", "human": false, "bucket": "D_assumed_with_kb", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Trenčínak.sk · regionálne spravodajstvo z 8 krajov\n\n\n\nDobrý deň,\n\n\nponúkame Vám získať viac zákazníkov z Vášho okolia za 100 € mesačne. S touto novinkou od januára sa Vám ozýv itle": "A student, not an instructor, wants to log in", "vnote": "Re-asked 2x. Login was written up on 26 Sep (link versus PIN). Likely findability rather than a gap — the asker is an end customer, not an admin, which may be why nothing fits.", "cat": "account"}, {"channel": "intercom", "id": "215476681697741", "date": "2026-11-04 09:27", "day": "2026-11-04", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Additional fields on the booking form | Zooza Help", "Registration and Booking FAQ | Zooza Help", "Client Management FAQ | Zooza Help", "Booking Widget FAQ | Zooza Help", "Booking form settings overview | Zooza Help"], "q": "Kde pridám adresu 2.rodica", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": "Ivana Kubaská", "text": "Kde pridám adresu 2.rodica", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ivana, adresa druhého rodiča sa nepridáva na profil klienta. Pridáva sa na rezervácii.\n\n\nPostup:\n\n\n\n\n- Otvorte rezerváciu (booking).\n\n- V ľavom paneli kliknite na Additional settings.\n\n- Do políčka pre druhý e‑mail zadajte adresu druhého rodiča a uložte. \n\n\nTento e‑mail potom dostáva upozornenia na termíny (session reminders).", "cited": ["Client Management FAQ | Zooza Help", "Registration and Booking FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Je to to, co hledáte?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak potrebujete s pridaním adresy druhého rodiča ešte pomôcť, som vám k dispozícii. Chcete doplniť, s ktorým krokom potrebujete poradiť?", "cited": []}, {"role": "customer", "who": "Ivana Kubaská", "text": "Kde upravím registračný formulár?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ivana, registračný formulár sa upravuje na úrovni programu.\n\n\nPodľa toho, čo chcete zmeniť:\n\n\n\n\n- \nČo formulár es when they choose a make‑up session that is already full.\n\n- Once they select that session, Zooza automatically places them in the queue. \n\n\nIf the waitlist is enabled in Programmes → select programme → Settings → Make-up sessions → Make-up sessions waitlist, the client can join the queue for that session. \n\n\nWhen a spot opens, the system emails them a confirmation link and the first person to click it gets the place.", "cited": ["Make-up Sessions FAQ | Zooza Help", "Waiting List FAQ | Zooza Help", "Make-up Sessions — Complete Guide | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "so if someone cancels what is the flow? Do I manually add them or can my teachers or do them get an email", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You don’t need to add them manually.\n\n\nWhen someone cancels a make‑up session and a spot opens:\n\n\n\n\n- The system automatically emails everyone on the waitlist for that session at the same time.\n\n- The email contains a confirmation link.\n\n- The first person who clicks the link gets the spot.\n\n- Others stay on the waitlist and may receive another email if another place opens. \n\n\nSo the flow is fully automatic — no admin or teacher action is required.", "cited": ["Waiting List FAQ | Zooza Help", "Make-up Sessions FAQ | Zooza Help", "Make-up Sessions — Complete Guide | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "shouldn't it be the first person on the list gets to enrol", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Good question — it’s a bit different from a normal queue.\n\n\nFor make‑up session waitlists, Zooza does not automatically enrol the first person on the list. Instead:\n\n\n\n\n- When a spot opens, everyone on the waitlist is emailed at the same time.\n\n- The email contains a confirmation link.\n\n- \nThe first person who clicks the link gets the spot.\n\n- Everyone else stays on the waitlist and may receive another email if another place opens. \n\n\nSo the order matters, but the final confirmation is done by the parent clicking the link, not by the system assigning it automatically.", "cited": ["Waiting List FAQ | Zooza Help", "Make-up Sessions FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was that helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help understanding the make-up session waitlist flow, I’m happy to clarify it. Would you like to share what part of the process you would like to resolve or understand further?", "cited": []}], "verdict": "check", "vtitle": "Put someone on a waiting list for a catch-up class", "vnote": "Re-asked 3x against the two make-up guides and the waiting-list FAQ. Three relevant articles cited and still three asks, so either waiting lists do not cover make-ups or the articles do not connect. Read both before deciding — likely a cross-link rather than new prose.", "cat": "makeups"}, {"channel": "intercom", "id": "215476627531794", "date": "2026-11-03 19:57", "day": "2026-11-03", "human": true, "bucket": "HUMAN", "reask": 26, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": ["Membership Subscription Setup | Zooza Help", "Link bookings so one payment covers them all | Zooza Help", "Client Management FAQ | Zooza Help", "Payment templates creation | Zooza Help", "Price and payment setup | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Bookings | Zooza Help", "Add a one-off scheduled payment | Zooza Help"], "q": "Zdravím mam otázku, mám v kurze 2 sestry a teraz ma kontaktovala ich mama, že ich registrovala na 8 mesačnú viazanosť ... ale si to rozmyslela a chcela by ich dať na 5 mesačnú čo s tým ? mám jej registrácie vymazať a nech sa znova zaregistruje s tým že text": "Žabulienka, nemusíte ich mazať a registrovať znova.\n\n\nNa registrácii Linda môžete urobiť toto:\n\n\n\n\n- Na registrácii Linda otvorte Payment plan\n\n\n- Kliknite na Zmeniť\n\n\n- Vyberte šablónu „Predplavecká príprava (5 mesačná viazanosť)“\n\n\n- Uložte\n\nStarý 8‑mesačný plán sa presunie do histórie a nový 5‑mesačný sa aplikuje na túto registráciu.\n\n\nNelkina registráciu môžete nechať bez plánu, pretože súrodencovia majú spoločnú platbu.", "cited": ["Add a one-off scheduled payment | Zooza Help", "Payment templates creation | Zooza Help", "Client Management FAQ | Zooza Help", "Bookings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Bolo vám to užitočné?", "cited": []}, {"role": "customer", "who": "Žabulienka", "text": "áno zas ideme dookola už sme tam boli a videli sme že sa to tam prekliknúť nedá", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumiem, že sa to vracia a že to je frustrujúce. Chcete, aby som vás prepojil s ľudským agentom, alebo môžete pokračovať so mnou a doplniť, na ktorej obrazovke sa to zobrazuje?", "cited": []}, {"role": "customer", "who": "Žabulienka", "text": "no skús", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumiem, že to je frustrujúce. Prepojím vás s ľudským agentom; prosím uveďte, na ktorej obrazovke sa to zobrazuje a čo sa po kliknutí na „Prekliknúť“ zobrazí, aby mohol rýchleji pomôcť.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, dakujeme za napisanie, ten AI asistent odpoveda spravne, ale nespomenul, ze môžete kliknut na ten toggle \"Zobraziť vsetky plany\". Tam sa potom zobrazia dalšie, ktoré je možné v tomto kurze použiť. \n\n\nZadate sumu a termin od kedy sa to ma prepocitat a system to prepocita a naplanuje.\n\n\n\n\n\nNie je potrebne mazať registrácie, platobné plany môžete upravovať v podstate kedykoľvek ak je registrácia aktívna. \n\n\n\n\n\nPomohlo vám to?", "cited": []}, {"role": "customer", "who": "Žabulienka", "text": "áno našiel som :) vďaka", "cited": []}, {"role": "customer", "who": "Žabulienka", "text": "opýtal by som sa niečo iné ...", "cited": []}, {"role": "customer", "who": "Žabulienka", "text": "napríklad u tohto klienta ... má takto nastavený platobný plán ...", "cited": []}, {"role": "customer", "who": "Žabulienka", "text": "ono mu tá výzva na úhradu príde automaticky toho 1.11/2026 ? a potom každý ďalší mesiac toho 1. ? či tam musím niečo ja nastaviť aby im to všetkým chodilo ...", "cited": []}, {"role": "customer", "who": "Žabulienka", "text": "(potom splatnosť úhrady majú do 15. dňa v mesiaci)", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Áno, presne tak. Každý mesiac 1. dňa Zooza automaticky vytvorí platbu a klientovi pošle e-mail s výzvou na úhradu so splatnosťou do 15. dňa v mesiaci. Prvá výzva teda odíde 1. 11. 2026, ďalšie 1. 12., 1. 1. atď. až do júna.\n\n\nKlientom nemusíte nič nastavovať. Skontrolujte len, prosím, v Tím a nastavenia → Nastavenia platieb → Notifikácie o naplánovaných platbách, či máte zapnuté „Odosielať notifikácie o naplánovaných platbách\". Ak by bolo vypnuté, e-maily s výzvou by neodchádzali. https://zooza.app/#settings/payment_settings", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, v tejto teme potrebujete este poradit?", "cited": []}, {"role": "customer", "who": "Žabulienka", "text": "zdravím ... no mam tu viacero problemov ktore riši m", "cited": []}, {"role": "customer", "who": "Žabulienka", "text": "*riešim ..", "cited": []}, {"role": "customer", "who": "Žabulienka", "text": "ked budete online určite by som sa opýtal", "cited": []}, {"role": "customer", "who": "Žabulienka", "text": "pôjde o pripravené platobné šablóny, automatické rozbitie cena na mesiace a a jednotlivé dátumy, mi nerobí tak ako by som potreboval a musím do tej každej novej registrácie manuálne vstupovať a upravovať platobná plán ...", "cited": []}, {"role": "human", "who": "Martin", "text": "Dobry den, asi najlepsie bude ak by ste poslali konkretnu registraciu, na ktorej je \"zly\" platobny plan s popisom predstavy, ako by ten platobny plan mal vyzerat aby som vedel poradit.", "cited": []}, {"role": "customer", "who": "Žabulienka", "text": "ok idem nato", "cited": []}, {"role": "customer", "who": "Žabulienka", "text": "potreboval by som aby to bolo presne takto ako je to tu", "cited": []}, {"role": "customer", "who": "Žabulienka", "text": "klienti čo sa mi teraz ešte registrujú ... však takto automaticky nenabehnú pri aplikovaní danej šablóny", "cited": []}, {"role": "customer", "who": "Žabulienka", "text": "vyzerá to presne takto ... miesto 8 platieb je tam platieb 9 ... hneˇ%d na začiatku mi hodí v novembri jednu platbu navyše ... keby sa túto podarilo dať preč a automat by to tak stále bral a nahodil by tie platby len do toho 15. každý mesiac a teda 8 platieb bolo by to super", "cited": []}, {"role": "customer", "who": "Žabulienka", "text": "-  nepomáha ani keď odkliknem tlačídlo \"\"zahrnúť počiatočný dátum ... ani iná kombinácia ...", "cited": []}, {"role": "customer", "who": "Žabulienka", "text": "jediné je dať vlastný dátum a tam hodiť 15.11. potom vypnúť tlačidlo počiatočná platba na \"\"nie\"  a samozrejme musím prepísať celkovú sumu na 390€ a ono ju rozpíše na 48,75€ mesačne (v tomto prípade 13€/lekciu - celkom 30 lekcií za 8 mesiacov) ... následne mi pekne nahodí tých 8 platieb ... má to ale za následok že mi hore počíta miesto 30 pokrytých termínov len 29 lebo tým vlastným dátumom som jeden preskočil ... ale platobný plán už vyzerá ok ... a tie termíny v dochádzke keď prekliknem tak ma má všetky takže snáď to nebude problém ... takže zatiaľ to riešim takto .... samozrejme bolo by super keby to robilo samo a nemusel som to takto meniť ... ale no našiel som spôsob ... aspoň pre teraz", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobrý deň,\n\n\npresne tak, správne ste to vystihli. Vysvetlím, prečo to Zooza robí.\n\n\nVaša šablóna má splátku naviazanú na 15. deň v mesiaci, takže Zooza delí obdobia od 15. do 15. Šablóna je predplatená, čiže každá splátka platí lekcie vopred. Prvá lekcia je 7. 11., teda pred prvým obdobím, ktoré začína 15. 11. Zooza preto na ňu automaticky vytvorí jednu platbu navyše. Keďže je to platený termín. Odtiaľ je 9 platieb namiesto 8.\n\n\nRiešenie, aby to fungovalo automaticky aj pri nových registráciách:\nNastavte šablónu tak, aby sa platba vytvárala k 1. dňu v mesiaci, platila na celý kalendárny mesiac a mala splatnosť 15 dní. Každý kalendárny mesiac bude potom zaplatený vopred samostatne, od prvého dňa. Lekcia zo 7. 11. spadne do novembrovej platby, platba navyše nevznikne a nemusíte nič ručne upravovať.\n\n\nPri registráciách, ktoré ste už upravili ručne (vlastný dátum 15. 11., celková suma 390 €), je všetko v poriadku a môžete ich tak nechať. Údaj 29 pokrytých termínov namiesto 30 znamená len to, že lekcia zo 7. 11. je pred prvou splátkou. V dochádzke má klient všetky termíny a 390 € pokrýva všetkých 30 lekcií. Len prosím pri nich neklikajte na „Obnoviť na 377 €“, pretože to by sumu prepočítalo iba na 29 lekcií.", "cited": []}], "verdict": "gap", "vtitle": "Why a monthly template produces nine instalments instead of eight, and the setup that avoids it", "vnote": "The single most valuable answer of the week. Prepaid template tied to day 15 splits periods 15th-to-15th; the first lesson (7 Nov) falls before the first period, so Zooza adds one extra payment. Fix: set the template to create on day 1, cover the whole calendar month, due in 15 days. Also: 'Show all plans' toggle reveals the other plans usable in that programme — no need to delete registrations, plans are editable any time while the registration is active. Also: do NOT click 'Restore to 377' on hand-adjusted plans, it recalculates to 29 sessions. SIX bot-only conversations hit this same wall: 215476648093305 (7 re-asks), 215476572003909, 215476572513107, 215476557053265, 215476592584921, 215476657948196. Four of them cited nothing from the KB at all.", "cat": "payments"}, {"channel": "intercom", "id": "215476682249638", "date": "2026-11-03 15:19", "day": "2026-11-03", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Membership Subscription Setup | Zooza Help", "Automatic payment reminders | Zooza Help", "Payments and Billing FAQ | Zooza Help"], "q": "parintii au perioada de gratie doar de o zi la planul de plata, am cum sa fac sa fie mai lunga perioada, si sa primeasca toti de plata in aceeasi zi?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "parintii au perioada de gratie doar de o zi la planul de plata, am cum sa fac sa fie mai lunga perioada, si sa primeasca toti de plata in aceeasi zi?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Da, puteți face ambele lucruri.\n\n\n1. Perioada de gratie mai lungă\n\n\nMergeți la Settings → Billing & Payments → Payment settings și schimbați câmpul Days before booking is marked unpaid.\n\n\nExemplu: dacă îl setați la 14, fiecare rezervare rămâne în Awaiting payment timp de 14 zile înainte să devină Unpaid.  \n\n\n2. Toți clienții să plătească aceeași zi\n\n\nÎn șablonul de plată, setați Day of the month when the payment is due la ziua dorită (ex. 15).\n\n\nAstfel, toate plățile lunare sunt datorate aceeași zi a lunii. \n\n\nNotă: această zi nu se schimbă în funcție de data înregistrării; este fixă pe ziua lunii.", "cited": ["Payments and Billing FAQ | Zooza Help", "Automatic payment reminders | Zooza Help", "Membership Subscription Setup | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Este ceea ce căutați?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dacă mai aveți nevoie de ajutor cu perioada de grație sau cu stabilirea aceleiași zile de plată, sunt aici să vă ajut. Doriți să îmi spuneți mai multe despre ce încercați să configurați?", "cited": []}, {"role": "customer", "who": "Rares Istode", "text": "la prima am gasit, ar trebui sa se schimbe la toti cei care s-au inscris pana acum? cea cu perioada de gratie", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Nu. Schimbarea perioadei de gratie din Settings → Billing & Payments → Payment settings (campul Days before booking is marked unpaid) se aplică doar la noi înregistrări create după schimbare. \n\n\nRezervările existente păstrează perioada de gratie pe care au avut-o la momentul înregistrării. \n\n\nDacă doriți, puteți totuși să o schimbați manual pe fiecare rezervare din Payments → deadline-ul Awaiting payment.", "cited": ["Payments and Billing FAQ | Zooza Help", "Automatic payment reminders | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "V-am răspuns la întrebare?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dacă mai aveți nevoie de ajutor pentru ajustarea perioadei de grație, sunt aici să vă ajut. Doriți să îmi spuneți ce anume încercați să modificați pentru rezervările existente?", "cited": []}], "verdict": "check", "vtitle": "Grace period is one day, wants it longer and everyone charged the same day (RO)", "vnote": "Re-asked 2x in Romanian. Grace period was written up on 26 Sep (grace 0 does not force payment). Two separate wants here: a longer grace period, and all parents billed on the same date. The second is the template day-of-month setting — same ground as the instalment write-up. Romanian keywords belong in the dictionary, not the article.", "cat": "payments"}, {"channel": "intercom", "id": "215476678302381", "date": "2026-11-03 09:32", "day": "2026-11-03", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Payments and Billing FAQ | Zooza Help", "Payments | Zooza Help", "Getting Help and Support | Zooza Help"], "q": "How much money did I make in October", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "George Champion", "text": "How much money did I make in October", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can check this in Sales & Payments → Payments. \n\n\n\n\n- Select the Billing period dropdown and choose October.\n\n- The dashboard shows Received payments (the total money you actually received in that period).\n\nIf you want the exact list of payments, go to Sales & Payments → Transactions and filter by Received from and Received before for October.\n\n\nIf you connect Zooza to Claude or ChatGPT (Zooza AI Assistant in the main menu), it can calculate this directly in your account — see https://help.zooza.online/setup/claude-plugin/.", "cited": ["Payments | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "George Champion", "text": "Can you show me on here please", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I can’t show the exact amount from your account here. The chat assistant only has access to help documentation and cannot view your payments or reports. \n\n\nTo see it in Zooza:\n\n\n\n\n- Go to Sales & Payments → Payments\n\n\n- Set the billing period to October\n\n\n- Look at Received payments on the dashboard. \n\n\nIf you connect Zooza to Claude or ChatGPT (Zooza AI Assistant in the main menu), it can calculate this directly in your account — see https://help.zooza.online/setup/claude-plugin/.", "cited": ["Getting Help and Support | Zooza Help", "Payments | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help checking your October payments, I’m here to assist. Would you like to share what you see on the Payments page so we can clarify it?", "cited": []}], "verdict": "check", "vtitle": "How much money did I make in October", "vnote": "Re-asked 2x. A plain revenue question that three cited articles did not answer. Worth checking whether the KB names a single report that answers it.", "cat": "reports"}, {"channel": "intercom", "id": "215476677690456", "date": "2026-11-03 09:11", "day": "2026-11-03", "human": true, "bucket": "HUMAN", "reask": 4, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Payment Pairing for Bank Transfers & Direct Debit | Zooza Help", "Payments | Zooza Help", "Inbound payments — setup and pairing | Zooza Help"], "q": "reconcile payments", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Kirsty Maher", "text": "reconcile payments", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Kirsty, to reconcile payments in Zooza:\n\n\n\n\n- Go to Sales & Payments → Payment reconciliation.\n\n- Filter the queue to Unpaired.\n\n- Click a payment row.\n\n- Select the correct registration or order.\n\n- Confirm the pairing. \n\n\nZooza automatically matches payments using the reference number from the invoice. If it cannot match one, it appears in Unpaired for you to review and pair manually.\n\n\nTip: check this queue regularly (for example once per day) to catch payments that need manual pairing.", "cited": ["Inbound payments — setup and pairing | Zooza Help", "Payment Pairing for Bank Transfers & Direct Debit | Zooza Help", "Payments | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help with reconciling payments, I’m here to assist. Would you like to share more about what you’re trying to resolve?", "cited": []}, {"role": "customer", "who": "Kirsty Maher", "text": "How do I confirm the pairing?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Kirsty, once you open the payment in Sales & Payments → Payment reconciliation and select the correct registration or order, you confirm it by clicking Confirm (or Approve if you see that option).\n\n\nAfter you confirm, the payment is recorded on the booking and the status updates immediately.", "cited": ["Inbound payments — setup and pairing | Zooza Help", "Payment Pairing for Bank Transfers & Direct Debit | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "human", "who": "Martin", "text": "Hi Kirsty, can you please clarify what are you trying to confirm? Perhaps send a screenshot?", "cited": []}, {"role": "customer", "who": "Kirsty Maher", "text": "Hi Sorry Sarah has asked me to go through and reconcile payments so that messages don't get sent to parents who have already paid?", "cited": []}, {"role": "human", "who": "Martin", "text": "I see. And you already got those payments ingested by Zooza?", "cited": []}, {"role": "human", "who": "Martin", "text": "You should see them in Payments -> Payment reconciliation", "cited": []}, {"role": "customer", "who": "Kirsty Maher", "text": "Sorry I just need to take a call. Ill come back to this. Thanks", "cited": []}, {"role": "human", "who": "Martin", "text": "No worries:)", "cited": []}], "verdict": "check", "vtitle": "Reconcile payments — Payments > Payment reconciliation", "vnote": "Settled in four short replies. Check the reconciliation article names that path; if it does, nothing to do.", "cat": "payments"}, {"channel": "intercom", "id": "215476677712021", "date": "2026-11-03 08:55", "day": "2026-11-03", "human": true, "bucket": "HUMAN", "reask": 9, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Pay-as-you-go programme | Zooza Help", "Blocks (Term Segments) FAQ | Zooza Help", "GoCardless Integration FAQ | Zooza Help", "Client Profile 101 | Zooza Help", "Client Profile FAQ | Zooza Help", "Zooza Glossary | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Session payment adjustments | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Managing sessions in a class | Zooza Help", "Children's Group Activities — Monthly Subscription Model | Zooza Help", "Manually push a scheduled payment to offline charge | Zooza Help", "Payment not received in Zooza — troubleshooting | Zooza Help"], "q": "My venue is not available this weekend, shoud I delete this session from the system so people can not book a trial for it?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "My venue is not available this weekend, shoud I delete this session from the system so people can not book a trial for it?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Kieran, you do not need to delete the session.\n\n\nInstead, open the class → Sessions tab → open that session → click Cancel session. \n\n\n\n\n- \nCancel keeps the record but removes it from the client calendar and stops reminders. \n\n\n- \nDelete is only for sessions created by mistake.\n\nIf you want to stop trial bookings for that date, you can also set Offer trial lessons for this block to No.", "cited": ["Managing sessions in a class | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Blocks (Term Segments) FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "If I cancel and then credit those attending will this update their payment plan'?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Kieran, it depends on the payment type.\n\n\n\n\n- \nPay‑as‑you‑go: cancelling the session automatically removes the payment for that session. The client’s next scheduled payment is reduced by the session price. You do not need to credit them manually.  \n\n\n- \nFixed monthly / instalment plan: cancelling the session does not change the payment plan automatically. You need to apply a credit using Adjust session payments from the Calendar bulk edit. \n\n\nThat credit reduces the client’s next scheduled payment (it is an adjustment on the instalment).", "cited": ["Payments and Billing FAQ | Zooza Help", "Session payment adjustments | Zooza Help", "Pay-as-you-go programme | Zooza Help", "Zooza Glossary | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "The credit atendees what does this then do if I tick the box?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Kieran, ticking Credit attendees creates a payment adjustment for everyone who was attending and has a payment plan. \n\n\n\n\n- Their next scheduled payment is reduced by the value of that session.\n\n- No money is moved or refunded.\n\n- The amount simply lowers what they owe in the next instalment.\n\n- If someone has no upcoming payment, nothing happens for them.\n\nSo it’s basically a quick way to apply a credit to all affected clients at once when you cancel a session.", "cited": ["Zooza Glossary | Zooza Help", "Session payment adjustments | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was that helpful?", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "yes so this is the best approach as everyone is on a payment plan in this class so it will reduce their next payment  in their scheudle without me having to do this manually?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes, Kieran — that’s exactly the right approach.\n\n\nIf you tick Credit attendees when cancelling the session, Zooza automatically creates a payment adjustment for everyone on a payment plan. \n\n\n\n\n- Their next scheduled payment is reduced by the value of that session\n\n- No money is moved or refunded\n\n- You don’t need to adjust each client manually\n\nSo it’s the quickest way to handle it when the whole class is on instalments.", "cited": ["Zooza Glossary | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Session payment adjustments | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "yes", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Great, I’m glad that clarified things! Please let me know if you need any further help.", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "how to try and take a failed payment", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Kieran, you can try to collect the failed payment again by pushing it to the offline charge queue.\n\n\nSteps:\n\n\n\n\n- Open the client’s booking\n\n\n- Go to Payment plan\n\n\n- Find the payment and click More\n\n\n- Open the payment detail page\n\n- Click Push to offline charge queue\n\n\nThis adds the payment to the charge queue so the system attempts the Direct Debit again. \n\n\nIf the client’s GoCardless mandate is inactive or expired, they will need to re‑sign it before a new collection can proceed.", "cited": ["Manually push a scheduled payment to offline charge | Zooza Help", "Payment not received in Zooza — troubleshooting | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was that helpful?", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "can i not send try to retake the payument anyhow", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Kieran, there isn’t a separate “retry payment” button. The way to retry a failed Direct Debit is to push the payment to the offline charge queue again. \n\n\nSteps:\n\n\n\n\n- Open the client’s booking\n\n- Go to Payment plan\n\n\n- Click More on the payment\n\n- Click Push to offline charge queue\n\n\nThis adds the
