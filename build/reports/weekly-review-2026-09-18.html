\n\n\n\n\nA new conversation is created when a customer replies to an existing email conversation they're not a participant in or when they remove a recipient.Learn more here", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Hi Nomin,\n\n\nThanks for reaching out! I'm Zooza Support, Zooza's AI Agent and I'm well trained to answer your query but you can reply and ask for the team at any time.\n\n\nYes, API access is available for your account. To use the REST API, your developers will need the following credentials:\n\n\n\n\n- REST API key\n\n- Client secret\n\nThese credentials are not generated inside the app and must be requested through support at support@zooza.online. Widget API keys cannot be used for REST API calls. \n\n\nOnce you have the credentials, the API works as follows:\n\n\n\n\n- Authentication requires three headers: X-ZOOZA-API-KEY, X-ZOOZA-TOKEN, and X-ZOOZA-COMPANY.\n\n- The token is obtained via a login request (POST /v1/login).\n\n- The company ID is retrieved from GET /v1/user and used in the X-ZOOZA-COMPANY header.\n\nThe full technical documentation, including endpoints, authentication flow, base URLs, and error handling, is available here:\n\n\nhttps://docs.zooza.online/api/ \n\n\nYou can also subscribe to webhook events such as registrations, payments, invoices, attendance updates, and schedule changes for real‑time integrations. \n\n\nIf you would like, I can also outline a typical integration flow for syncing bookings or payments into external systems.\n\n\nPlease let me know if this helps or if you have any further questions.\n\n\nQuickstart | Zooza Developer Docs\nAPI Integration for Booking | Zooza\nAuthentication | Zooza Developer Docs\nAPI overview | Zooza Developer Docs", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Nomin, yes for sure we can provide your developers with the API access but I want to point out that in regard with the lead capture via new Contact form - we are providing you with direct integration to Meta which will do bi-directional sync between zooza and meta - Fetching leads from Zooza into Meta and vice versa - pushing contacts from Zooza - to Meta. But yes, lets keep the conversation going and if your dev team finds out that they still require API access to make some things work, we will provide them with any guidance and help they need.\n\n\nAll the best\n\n\nMartin", "cited": []}], "verdict": "product", "vtitle": "Nomin: API access for Meta CAPI; Martin: Meta lead-ads sync coming (bi-directional)", "vnote": "Spec api in_progress 2026-09-16-meta-lead-ads-inbound / ideas 2026-09-14. Development — not KB until shipped.", "cat": "account"}, {"channel": "intercom", "id": "215475928134448", "date": "2026-09-18 15:08", "day": "2026-09-18", "human": true, "bucket": "HUMAN", "reask": 41, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Onboarding and Launch FAQ | Zooza Help", "FAQ — Programmes | Zooza Help", "When to enrol clients yourself vs. send them a booking link | Zooza Help", "Where to find things in Zooza — quick reference | Zooza Help", "Share a course or class registration link | Zooza Help"], "q": "is there a quick way to see if all the people that attended last Tuesdays session have been invited to this weeks session.", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "is there a quick way to see if all the people that attended last Tuesdays session have been invited to this weeks session.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — there is a quick way to check this.\n\n\nIf the invitations were sent through auto‑enrolment, you can see exactly who has been invited and their response status.\n\n\nOption 1 (best for this):\n\n\n\n\n- Go to Programmes → Auto‑enrolment responses\n\n\n- You’ll see every invited client with their status:\n• Accepted\n• Declined\n• Not decided yet\n\nThis page lets you quickly confirm whether everyone who attended last week has been invited and whether they’ve responded. \n\n\nOption 2:\n\n\n\n\n- Go to Bookings\n\n\n- Use the Auto‑enrolment filter to view Accepted / Declined / Not decided yet.\n\nIf you want, I can also show a quick workflow many coaches use to make sure last week’s attendees are always invited to the next session.\n\n\n\nSource:\nFAQ — Programmes | Zooza Help", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Okay please can i have a link for the new session? That way I can just drop everyone a email with the link.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — you can grab a direct booking link for that specific session and send it by email. \n\n\nQuick way:\n\n\n\n\n- Go to Programmes\n\n\n- Open the programme\n\n- Open the class for this week’s session\n\n- Click the Share or copy link icon on the class\n\n- Paste that link into your email to parents\n\nThat link takes them straight to the registration page for that session. \n\n\nYou can also copy the link from the class tile in the programme view if that’s faster. \n\n\nTip: many coaches send this link in a short message like “Book your spot for this week’s session here” so parents can register themselves quickly.", "cited": ["Onboarding and Launch FAQ | Zooza Help", "Share a course or class registration link | Zooza Help", "Where to find things in Zooza — quick reference | Zooza Help", "When to enrol clients yourself vs. send them a booking link | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help checking attendance invitations or sharing the session link, I’m here to help. Would you like to share more about what you’re trying to do?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Louis, no such report is not available anywhere. If you want to nudge users to sign up for this week, the easiest way is to send a bulk email to everyone with an active booking and ask them to book new session inside the customer portal.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "I would not send them booking link as that would mean that they would need to book again and as I understand it the programme you're talking about is of type - pay as you go", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "sorry Martin", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "I have somehow switched chats.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "how do i filter", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "No worries:)", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "On Classes simply choose the Programme filter and tick the tickbox next to it", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "This will filter all classes for that programme", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Then at the top you'll see the email button", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "This is how the customer portal looks like for someone who is in the trial.\n​", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "I don't see email.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "And this is the dashboard of a customer who is enrolled with the Pay As You go programme\n​", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Sorry, you don't want to go to the session level", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "this is where you want to be - Classes", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "At the top - Send email", "cited": []}, {"role": "human", "who": "Martin Rapavý", not sure whether you spelled it correctly", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ah sorry, the right hand toolbar is not on that screen", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "its on the template editing screen", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "My bad", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "is this good to save?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Yes", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Can I also confirm that automations are setup for players that attended free trials on Thursday and Saturday?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Or should i do this for everyone that attended the free trial sessions?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "What programmes are those please?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Saturday Academy both sessions, Younger and older & Barnet PDC both sessionsYounger and older.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ok so on both the trial automations are set up. Just to confirm that this is something else than what we were just doing. Is that correct? These are not pay as you go sessions", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Yes this is not pay as you go. Both Saturday and PDC are free trial - Monthly membership", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ok, then yes you have the automation set up correctly there", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "perfect thank you.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "You are welcome", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "There are couple things I'd like to follow up", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "You mentioned that you were kind of confused about the terminology - 9 enrolled for the class but no one actually attending tomorrow's sessions", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "yes", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "I'm thinking about how to redesign this because those are two different things. The class can actually hold more bookings/enrollments than its capacity, because capacity for this programme is actually gated by the session", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "So by creating enrollment - people are basically getting access to the customer portal from which they can book the session", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "So I'm thinking about how to make it clearer for newcomers like yourself", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Makes sense", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "And also I would like to create this option for you to send the manual notification to those who are enrolled but NOT booked to a particular session", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "enrolments (allowed to book)", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hm, that is good. And I'm thinking of skipping the capacity there at all. I think it just makes things confusing", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "So I had a parent sign up and pay for last week and this weeks Tuesday elite sessions. However I don't see them on the will attend list.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "This is for the pay as you go classes? Can you please give me the booking number?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "yes for the pay as you go class.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Sorry how would i find booking number?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Alistair Naqvi players name", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "It's the big number on the booking when you enter the booking detail:)", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Let me find mr Naqvi", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "he has created 4 bookings, can you please help me narrow this down as for which programme you are looking at?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "tuesday elite session. Pay as you go. Session 2", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "thank you Louis, I can see that he is actually on that session but he's not showing up on register, let me take it to our tech team and I'll get back to you on this", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "great", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Also when i look at the register is there away to organise into alphabetical order?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hm, not really. The register is built in terms of order of attendance so those who booked first are at the top. but for sure this should not be a problem to add", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Yeah would be helpful. I was struggling to find names on my phone.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "are you using the quick view for that matter?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "yes quick view.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "ok, thank you :)", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Louis, this is what is going on", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "The session with ID: 26877 to which Mr Naqvi was booked was deleted on 8th of september", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "So that is the reason why you can't see that session anywhere and why his attendance is also not showing up", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Oh no", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "His booking to that session was therefore \"lost\" silently", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "that session's original date was: 2026-09-15 17:30:00", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "What you can do is to locate that session in the trash: https://uk.zooza.app/#settings/trash?page=0&page_size=25", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Restore it temporarily, then re-book mr Naqvi from that session and add thim manually to tomorrow's session", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Now I'm thinking whether it wouldn't be just easier if we do it from the backend", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "As when you'll cancel the attendance an email will be fired to mr Naqvi which is probably not something we want to do", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "okay. How has the session been deleted?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "It is marked to be deleted by you via bulk operation", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "okay", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "not sure how ive managed that.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "is it possible that there are multiple attendees that might've been cropped up like this?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Looking into the database this seem to be the only booking", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "I've re-booked that attendee to session nr 27608 which is happening tomorrow at the same time as the original - now deleted session", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "perfect thank you. is there a link so they can just go stright to the session select it and pay?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "I believe that it is the one you already sent via email earlier. As long as they are logged into the system then they can book easily from the calendar as well (which is a public link)", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Good morning.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "I want to directly contact the parents that attended trials. But can’t locate the. Is there a simple way to see past sessions players and who hasn’t signed up?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Louis, essentially it's all within the bookings screen. There are all stages of the trial process captured in the booking status. So based on your message you are looking to bookings in stage Trial Ended or Trial Lost. Trial ended means that customer enrolled into trial - attended - but did not convert yet. Trial lost - booking is transitioned to this status according to your automation settings. So for example - customer attended the trial -> switched to status trial ended -> system sends two reminders and after those two reminders if customer still did not convert it will transition that booking into trial lost.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Yes exactly. Ive had a couple of people mention that they didn't receive the sign up emial or it was sent to spam/promotions. Am I able to automatically send a sign up text or whatapp also?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Was just thinking it might increase sign ups", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "For whatsapp you'd need to connect your whatsapp for business account with zooza and then zooza will send these automatically using both - email and whatsapp.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Of course you can send them a nudge manually at any time", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Okay cool. How do i connect whatapp", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "ho", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Hi", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Louis,\n\n\nApologies for the slow reply on this one ,,, and thanks for chasing.\n\n\nWhatsApp is available in your account and there's a step-by-step guide built into the setup page:\n\n\nhttps://uk.zooza.app/#communication/whatsapp/setup\n\n\nGive it a go and shout if you get stuck anywhere.", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "So I use my business whatsapp with another marketing tool. Can it be connected still?", "cited": []}], "verdict": "gap", "vtitle": "PAYG: enrolled vs booked-on-session; remind enrolled clients via Classes → Send email with WIDGET_PROFILE_URL; no report of who was invited; session deleted via bulk op lost bookings silently", "vnote": "Bot invented 'Programmes → Auto-enrolment responses'. WRITTEN: PAYG FAQ (enrolled vs booked, how to remind). Register order = booking order, not alphabetical (feature request).", "cat": "programmes"}, {"channel": "intercom", "id": "215475966017690", "date": "2026-09-18 14:58", "day": "2026-09-18", "human": true, "bucket": "HUMAN", "reask": 34, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": [], "q": "Payments not working", "turns": [{"role": "customer", "who": null, "text": "Payments not working", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dear Sam,\n\n\nyour ticket  has been received. Zooza Assistant will try to help you right away — and a member of our team will personally review it too.\n\n\n— Zooza Support", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Int le ukazuje \"V súčasnosti nie sú k dispozícii žiadne skúšobné hodiny\". \n\n\nOtestoval som to vytvorením novej skupiny a pridaním termínov s nastavením:\n\n\n\n\n\n\n\nVýsledok skupina s už dávnejšie vytvorenými termínami (ktoré však ešte nezačali):\n\n\n\n\n\n\nSkupina, kde som termíny vytváral až po nastavení skúšobných hodín (všimnite si, že dátum termínu je rovnaký)\n\n\n\n\n\n\nSkúšal som aj v samotnom termíne nájsť nejaké nastavenie → Tento termín je aj skúšobný ap., ale nič také tam nevidím.\n\n\nV prípade, že sa tak rozhodnem ponúkať skúšobné hodiny, musím ich vytvárať odznova. Nepovažujem to za správne fungovanie a preto to nahlasujem ako bug.\n\n\nS pozdravom\n\n\nJakub_MEDVEDICA", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Hi Jakub,\n\n\nThanks for reaching out! I'm Zooza Support, Zooza's AI Agent and I'm well trained to answer your query but you can reply and ask for the team at any time.\n\n\nI understand you've discovered that lesson dates created before enabling trial lessons don't automatically convert to trial lessons, even though the setting is turned on.\n\n\nBased on what you've shared, this does appear to be a bug. The trial lesson setting should apply to existing lessons in the selected groups, but it seems the system only recognizes lessons created after the setting is enabled.\n\n\nSince you've already provided clear steps to reproduce the issue (creating lessons before vs. after enabling trial lessons) and screenshots showing the expected vs. actual behavior, a human agent from our team can investigate this directly and work on a fix.\n\n\nWould you like me to connect you with a team member who can look into this further?", "cited": []}, {"role": "customer", "who": "Jakub Majoroš", "text": "Yes, that would be great.", "cited": []}], "verdict": "verify", "vtitle": "Same as 215475993766474 (ticket)", "vnote": "—", "cat": "trials"}, {"channel": "intercom", "id": "215475993766474", "date": "2026-09-18 13:46", "day": "2026-09-18", "human": false, "bucket": "D_assumed_with_kb", "reask": 8, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["10 chytrých způsobů, jak rozvíjet svůj podnik v oblasti aktivit pro děti během léta — Zooza", "Checklist pred spustením nových kurzov: Na čo nezabudnúť, aby sa sezóna nezačala chaosom — Zooza", "Trial sessions | Zooza Help", "Blocks Configuration and Management | Zooza Help", "Trial Classes FAQ | Zooza Help", "Class Detail | Zooza Help", "Proč řešení „neviditelného“ rodičovského problému buduje silnější značku — Zooza"], "q": "Snažím sa vytvoriť prihlásenie na skúšobnú hodinu. Moje nastavenie vyzerá takto. V danej skupine mám zakliknutá možnosť \"Skúšobné hodiny\" a pridané termíny na celý rok. Chcem, aby sa mohli účastníci prihlásiť na prvý termín, ale aby zaňho museli zaplatiť. Napriek nastaveniu, sa mi v registračnom formulári žiadne termíny na skúšobnú hodinu nezobrazujú. Kde je chyba?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": "Jakub  Majoroš", "text": "Snažím sa vytvoriť prihlásenie na skúšobnú hodinu. Moje nastavenie vyzerá takto. V danej skupine mám zakliknutá možnosť \"Skúšobné hodiny\" a pridané termíny na celý rok. Chcem, aby sa mohli účastníci prihlásiť na prvý termín, ale aby zaňho museli zaplatiť. Napriek nastaveniu, sa mi v registračnom formulári žiadne termíny na skúšobnú hodinu nezobrazujú. Kde je chyba?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumiem, že situácia s neviditeľnými termínami skúšobných hodín může být frustrující. Chcete, abych vás přepojil na lidského agenta? Nebo můžete poskytnout další podrobnosti a budeme pokračovat společně.", "cited": []}, {"role": "customer", "who": "Jakub  Majoroš", "text": "čo potrebuješ vedieť?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Díky za screenshoty – pomohly. Nejčastější důvod je, že online rezervace není zapnutá pro daný kurz.\n\n\nZkontrolujte prosím:\n\n\n\n\n- Programme → Settings → Online Booking\n\n- pole Allow online booking musí být nastaveno na Yes\n\n\nPokud je vypnuté, kurz se na webu zobrazí, ale termíny (ani skúšobné) se v formuláři neukazují. \n\n\nDruhá věc, kterou je dobré ověřit:\n\n\n\n\n- v Class Detail → Settings → Allow online booking musí být zapnuté i pro konkrétní timetable. \n\n\nPokud chcete, můžete mi ještě poslat URL stránky s registračním formulářem – podle ní můžu rychleji zjistit, kde přesně je problém.", "cited": ["Trial Classes FAQ | Zooza Help", "Class Detail | Zooza Help", "Trial sessions | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Hledali jste tohle?", "cited": []}, {"role": "customer", "who": "Jakub  Majoroš", "text": "Online prihlasovanie je zapnuté a funguje správne...", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Díky za upřesnění. Pokud je online přihlašování zapnuté, nejčastější příčina je nastavení „Booking Options Shown on Website“.\n\n\nZkontrolujte prosím:\n\n\n\n\n- Programme → Settings → Online Booking → Edit\n\n- pole Booking Options Shown on Website\n\n\nPokud je nastavené na Offer full programme booking only, skúšobné hodiny se na formulári vôbec nezobrazia. Zmeňte na:\n\n\n\n\n- \nDefault – let customer choose, alebo\n\n- \nTrials only (if available). \n\n\nDruhá možnosť: v Block editor môže byť vypnuté Offer trial lessons for this block – vtedy sa termíny na skúšobné hodiny tiež nezobrazia. \n\n\nAk chcete, pošlite ešte URL tej registračnej stránky – podľa nej sa dá rýchlo zistiť, ktorá z týchto možností je najpravdepodobnejšia.", "cited": ["Trial Classes FAQ | Zooza Help", "Trial sessions | Zooza Help", "Blocks Configuration and Management | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Dostali jste odpověď na svou otázku?", "cited": []}, {"role": "customer", "who": "Jakub  Majoroš", "text": "Všetky tieto nastavenia sú zapnuté.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Díky za upřesnění. Pokud jsou zapnuté všechny nastavení, které jste zkontroloval, nejčastější příčina je žádný dostupný termín pro skúšobnú hodinu – např. pokud je kurz plný nebo kapacita pro skúšobné hodiny je obsazená. V takovém případě formulář zobrazí hlášku „nie sú k dispozícii žiadne skúšobné hodiny“. \n\n\nDruhá věc, kterou je dobré zkontrolovat:\n\n\n\n\n- Programme → Settings → Trial → Classes included in trial\n\n- ujistěte se, že je vybraný konkrétní kurz/skupina, kde chcete skúšobné hodiny nabízet. \n\n\nMůžete prosím poslat URL registrační stránky?\n\n\nPodle ní se dá rychleji zjistit, jestli jde o kapacitu nebo o to, že kurz není vybraný v „Classes included in trial“.", "cited": ["Trial Classes FAQ | Zooza Help", "Trial sessions | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Pomohlo to?", "cited": []}, {"role": "customer", "who": "Jakub  Majoroš", "text": "https://www.medvedicatour.sk/registracia?course_id=9760&template=kurz_c", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Díky za link. Bohužel nejsem schopen otevírat URL ani přistupovat k vašim datům v aplikaci. Pro tento typ problému je potřeba zkontrolovat konkrétní nastavení kurzu a kapacity. \n\n\nMůžete prosím poslat ještě:\n\n\n\n\n- \nscreenshot obrazovky „Classes included in trial“ (Programme → Settings → Trial)\n\n- \nočekávaný vs. skutečný výsledek – např. „očekávám, že se zobrazí 1 termín skúšobnej hodiny, ale formulár píše, že nie sú k dispozícii“\n\nNajčastejšia príčina v tejto situácii je, že kurz nie je vybraný v Classes included in trial, alebo že kurz nie je označený ako kurz, ktorý sa má zaradiť do skúšobných hodín.\n\n\nAk chcete, môžem vám ešte ukázať rýchly 3‑krokový check, ktorým to môžete overiť priamo v nastavení.\n\n\n\nSource:\nChecklist pred spustením nových kurzov: Na čo nezabudnúť, aby sa sezóna nezačala chaosom — Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Pomohlo vám to?", "cited": []}, {"role": "customer", "who": "Jakub  Majoroš", "text": "prepoj ma s tímom", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Samozrejme, hneď vás prepojím s niekým z nášho tímu. Skôr ako to urobím, môžete mi prosím poskytnúť ďalšie podrobnosti o vašom probléme? Pomôže to našim kolegom rýchlejšie nájsť riešenie.", "cited": []}, {"role": "customer", "who": "Jakub  Majoroš", "text": "všetky informácie som už poskytol", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumiem. Ak chcete, aby sa na to pozrel niekto z tímu, môžete si rezervovať 15‑minútový live walkthrough tu:\n\n\nhttps://www.zooza.online/book-a-meeting/ \n\n\nPri tejto schôdzi môžete ukázať presne túto situáciu (registračný formulár + nastavenia skúšobnej hodiny) a niekto z tímu sa na to môže pozrieť priamo s vami.\n\n\nAk chcete, môžem vám ešte ukázať jeden rýchly „check“, ktorý sa často robí pri tomto typu problému – niekedy odhalí chybu v pár kliknutiach.\n\n\n\nSource:\nProč řešení „neviditelného“ rodičovského problému buduje silnější značku — Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Pomohla vám tato odpověď, nebo stále potřebujete pomoc?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc s týmto problémom, môžete doplniť ďalšie podrobnosti a budeme pokračovať v riešení. Chcete ešte niečo objasniť alebo pridať k prípadu?", "cited": []}, {"role": "customer", "who": "Jakub  Majoroš", "text": "Posuň to ako ticke", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumím. V tomto chatu bohužel není možné problém „posunout jako ticket“ ani ho předat dál.\n\n\nPokud chcete, aby se na to podíval někdo z našeho týmu, můžete si rezervovat 15‑minutový live walkthrough zde:\n\n\nhttps://www.zooza.online/book-a-meeting/ \n\n\nPri tejto schôdzi môžete ukázať:\n\n\n\n\n- registračnú stránku\n\n- nastavenia skúšobnej hodiny\n\n- čo presne sa zobrazuje na formulári\n\nTím sa dá problém rýchlo prejsť priamo s va  "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "If you look at the URL, this is an account number which I dont own on stripe so I think zooza is creating a brand new stripe account when I try to connect", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I understand your concern about the Stripe account identifier in the URL. Would you like me to connect you with a human agent who can assist you further? Or if you prefer, you can provide more details and I will do my best to help you directly.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I’m checking whether you still need help with the Stripe connection concern, and I’m sorry for the uncertainty this has caused. Would you like me to connect you with a human agent? I’m also happy to assist further if you share what you’re trying to confirm about the Stripe setup.", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "connect to human agent", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Certainly, I will connect you with someone from our team. Meanwhile, could you please share any additional details about your Stripe connection issue to help them assist you more efficiently?", "cited": []}], "verdict": "product", "vtitle": "Stripe disconnected again after Stripe deleted ghost accounts — waterfall revoke fixed", "vnote": "—", "cat": "payments"}, {"channel": "intercom", "id": "215475993251134", "date": "2026-09-18 12:48", "day": "2026-09-18", "human": false, "bucket": "D_assumed_with_kb", "reask": 1, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Stripe Integration FAQ | Zooza Help"], "q": "i'm getting this error message", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "i'm getting this error m ort", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "I want to send a private message to everyone that has atteneded a free trial session but hasnt signed up. When i try to filter i can't find them", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "This happens because trial clients are a separate group from enrolled clients. When you filter bookings or send to “all active clients”, the system only includes people with an active enrolment, so trial attendees won’t appear there. \n\n\nHow to message them:\n\n\n\n\n- Go to Communication → Compose\n\n\n- Choose email or WhatsApp\n\n- In the audience filter, select Trial status (or filter by the specific class and choose trial bookings)\n\n- Send the message to that group separately.\n\nIf the filter still feels limiting, another option is:\n\n\n\n\n- Go to Classes\n\n\n- Filter to the class where the trial happened\n\n- Click Email to message everyone in that filtered class. \n\n\nSo the key is: trial clients must be selected by Trial status, not the normal enrolled-client filters.", "cited": ["Email and Communication FAQ | Zooza Help", "Sending email/SMS to clients | Zooza Help", "Bookings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "I can't see whatapp", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "That’s expected if the WhatsApp integration isn’t enabled yet.\n\n\nIf you don’t see WhatsApp in Communication, it usually means one of these:\n\n\n\n\n- Your plan doesn’t include the WhatsApp integration, or\n\n- The WhatsApp Business Platform connection hasn’t been enabled for your account yet. \n\n\nWhatsApp messaging in our app is a separate integration (currently in beta) and requires connecting a Meta Business account and a phone number before it appears in the Communication screen.\n\n\nSo if it’s missing, you can still message those trial clients using email from Communication → Compose and filter by Trial status. \n\n\nIf you want, I can also show a simple way to export the trial attendees so you can message them in bulk outside the platform.", "cited": ["WhatsApp Integration & Usage (Beta) | Zooza Help", "Zooza 3.7: Back‑to‑School Release That Saves Time and Fills Classes", "Communication | Zooza Help", "Email and Communication FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "how do i set up whatapp", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can set it up directly inside the app:\n\n\n\n\n- Go to Communication → WhatsApp.\n\n- Click Connect to WhatsApp.\n\n- A Meta (Facebook) window opens. Log in with a Facebook Business Admin account.\n\n- Select your Business Account, add a dedicated phone number, and complete the SMS/voice verification.\n\n- Return to Zooza and refresh the page. The status should show Done.\n\n- Create a 6‑digit PIN and save it. \n\n\nYou’ll also need a Meta Business account and a phone number that isn’t used in the WhatsApp mobile app.\n\n\nOnce connected, conversations appear in Messages → WhatsApp → Conversations. \n\n\nIf you want, I can also explain how the 24‑hour reply window works when parents message you.", "cited": ["WhatsApp Integration & Usage (Beta) | Zooza Help", "WhatsApp Messaging for Classes | Reminders, Changes & Payments | Zooza", "WhatsApp | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that clarify how to set it up?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "I dont see whatsapp", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you don’t see “WhatsApp” in Communication, it usually means one of these:\n\n\n\n\n- Your plan doesn’t include the WhatsApp integration, or\n\n- The WhatsApp Business Platform hasn’t been enabled for your account yet. \n\n\nThis feature is currently in beta and only available to a limited number of accounts, so it may not appear in the menu until it’s enabled. \n\n\nSo in this case, the next step is to request access to the WhatsApp integration in this chat if you’d like to use it.\n\n\nIf you want, I can also show a quick workaround to message those trial attendees using email while you wait.", "cited": ["WhatsApp Integration & Usage (Beta) | Zooza Help", "Zooza 3.7: Back‑to‑School Release That Saves Time and Fills Classes"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "Okay I can send sms", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Great — SMS works the same way as email for this.\n\n\nTo message the trial attendees:\n\n\n\n\n- Go to Communication → Send SMS\n\n\n- In the Target group, filter by Trial status (or filter the specific class and select trial bookings)\n\n- Write your message and send it\n\nTrial clients are a separate group from enrolled clients, so they won’t appear in the “all active clients” audience. You need to select the Trial filter to reach them. \n\n\nTip: you can also filter the class in Classes and send SMS directly from there if that’s easier.", "cited": ["Email and Communication FAQ | Zooza Help", "Sending email/SMS to clients | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "I can only target class. Not group", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "That’s normal. The Target group list in the composer is intentionally limited, so some audiences (like trial clients) won’t appear there. \n\n\nThe easiest workaround is to send from Classes instead:\n\n\n\n\n- Go to Classes\n\n\n- Filter to the class where the trial happened\n\n- Click Send SMS in the action bar\n\n- The message will go to everyone in that filtered class\n\nThis method lets you reach the filtered group even when the composer doesn’t have a matching target option.\n\n\nTip: you can also narrow the class further (for example by booking status) before sending if you want to target only a subset.", "cited": ["Sending email/SMS to clients | Zooza Help", "Email and Communication FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help targeting the right trial attendees for your SMS, I’m here to help. Would you like to share more about the group you’re trying to reach?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "So I can target a class but it shows everyone. I only really want to send to parents that attended the trial but didn't sign up.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You’re right — when you send to a class, the system includes everyone in that class, so it can’t automatically separate “trial attended but didn’t sign up.” \n\n\nThe practical workaround is:\n\n\n\n\n- Go to Communication → Send SMS\n\n\n- Choose Selected bookings\n\n\n- Open the recipient list and uncheck the parents who enrolled\n\n\n- Send the message to the remaining trial attendees. \n\n\nThis lets you manually remove the people who signed up before sending.\n\n\nTip: if you run trials often, you can also enable the trial follow‑up automation, which automatically sends a booking link and reminders to trial clients who haven’t registered yet.", "cited": ["Email and Communication FAQ | Zooza Help", "Sending email/SMS to clients | Zooza Help", "Send Email | Zooza Help", "Trial Classes FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Does this clarify things?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help identifying the trial attendees who have not enrolled, I’m here to tejto veci stretnúť? Sme ochotní sa rozprávať aj o spolufinancovaní za dovyvíjanie týchto služieb na mieru pre nás.\nĎakujem a zostávam s pozdravom\nJakub_MEDVEDICA", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Hi Jakub,\n\n\nThanks for reaching out! I'm Zooza Support, Zooza's AI Agent and I'm well trained to answer your query but you can reply and ask for the team at any time.\n\n\nThank you for the thoughtful proposal — this is exactly the kind of collaboration we welcome.\n\n\nYou can arrange a meeting directly here:\n\n\nhttps://www.zooza.online/book-a-meeting/\n\n\nThis allows you to book a short call and discuss your use case, current challenges, and potential improvements in detail. \n\n\nIf you are considering custom development or deeper collaboration, there is also a Zooza Assistant option for on‑demand consulting, training, and technical work on specific requests. \n\n\nFor more technical or custom integrations, you can also discuss possibilities through a tech demo here:\n\n\nhttps://www.zooza.online/book-a-meeting/ \n\n\nAs a next step, preparing a short list of the main administrative pain points you mentioned can help make the meeting very productive.\n\n\nPlease let me know if this helps or if you have any further questions.\n\n\nContact — Zooza\nCustomer Care — Zooza\nZooza Phone Assistant — Dedicated Support for Your Team | Zooza\nBook a Meeting — Zooza\nFor Developers — Zooza", "cited": []}, {"role": "customer", "who": "Jakub Majoroš", "text": "Wait for the team", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Jakub, jasne, mozeme sa stretnut a radi si vypocujeme spatnu vazbu. Navrhnite prosim nejake terminy. Mne by vyhovoval utorok/streda doobeda, ale viem sa prisposobit.", "cited": []}, {"role": "customer", "who": "Jakub Majoroš", "text": "Dobrý deň,\n\n\nprebežne navrhujem utorok 1. 10. o 9.00 hod. Ešte si to budúci týždeň potvrdíme. \n\n\nVedeli by ste sa prísť k nám na Trenčiansku 47? \n\n\nS pozdravom\n\n\nJakub Majoroš", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Jakub, prveho prednasam na jednom meetupe, takze toto urcite nebudem moct absolvovat, ale v stredu v pohode mozem.", "cited": []}, {"role": "customer", "who": "Jakub Majoroš", "text": "Zdravím, \n\n\npomýlil som si mesiace. Mal som namysli utorok 29. 9. Ten by bol za Vás v poriadku?\n\n\nS pozdravom\n\n\nJakub", "cited": []}], "verdict": "client", "vtitle": "Meeting request about profiles/products roadmap", "vnote": "—", "cat": "account"}, {"channel": "intercom", "id": "215475981612633", "date": "2026-09-18 11:38", "day": "2026-09-18", "human": false, "bucket": "D_assumed_with_kb", "reask": 19, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Registration widget | Zooza Developer Docs", "Registration and Booking FAQ | Zooza Help", "Onboarding and Launch FAQ | Zooza Help", "Instructors | Zooza Help", "Customizing widgets | Zooza Help", "Publish (Widgets) | Zooza Help", "Booking Widget FAQ | Zooza Help", "Zooza Glossary | Zooza Help", "Creating a class | Zooza Help", "Booking FAQ | Zooza Help", "FAQ — Programmes | Zooza Help", "Widget Embedding Troubleshooting | Zooza Help", "Children's Group Activities — Block / Term Model | Zooza Help", "Share a course or class registration link | Zooza Help"], "q": "in the widget embed on my website, how do i just get it to show only 1 programme", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "in the widget embed on my website, how do i just get it to show only 1 programme", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can show only one programme in the widget by filtering it in the embed settings.\n\n\nOption 1 – easiest (recommended):\n\n\n\n\n- Go to Publish → Embed code in Zooza.\n\n- Open your widget and click Customize embed code.\n\n- In Choose programmes, select only the one programme you want.\n\n- Click Copy and replace the embed code on your website. \n\n\nOption 2 – URL filter (for a single programme page):\n\n\nAdd this to the widget URL:\n\n\n?course_id=PROGRAMME_ID\n\n\nExample:\n\n\nhttps://yoursite.com/register/?course_id=4941\n\n\nThis displays only that programme.\n\n\nTip: If you want the programme to appear first in the list, set its Priority in Programmes → Online Booking → Edit (higher number = shown first).", "cited": ["Customizing widgets | Zooza Help", "Publish (Widgets) | Zooza Help"]}, {"role": "customer", "who": "Sam Davis", "text": "\u003cscript>\n\n\ndocument.zooza = {\n\n\nfilter_courses : [9607, 9614, 9615],\n\n\nfilter_places : [4061],\n\n\nschedule_list_collapse_on_select : false\n\n\n}\n\n\n\u003c/script>\n\n\n\u003cscript data-version='v1' data-widget-id='zooza' id='4d06112674' type='text/javascript'>\n\n\n( function() {\n\n\nfunction async_load(){\n\n\ndocument.body.setAttribute('data-zooza-api-url', 'https://api.zooza.app');\n\n\nvar s = document.createElement('script'); s.type = 'text/javascript'; s.async = true;\n\n\ns.src = document.body.getAttribute('data-zooza-api-url') +\n\n\n'/widgets/v1/?type=registration&ref=' + encodeURIComponent( window.location.href );\n\n\nvar embedder = document.getElementById( '4d06112674' );\n\n\nembedder.parentNode.insertBefore( s, embedder );\n\n\n}\n\n\nif ( window.attachEvent ) {\n\n\nwindow.attachEvent( 'onload', async_load );\n\n\n} else {\n\n\nwindow.addEventListener( 'load', async_load, false );\n\n\n}\n\n\n} )();\n\n\n\u003c/script>\n\nwhere do i find this code?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can find that code in Zooza → Team & Settings → Publish → Embed code. \n\n\nSteps:\n\n\n\n\n- Open Publish in the admin.\n\n- Choose the widget type (for example Booking Form).\n\n- You will see the Embed Code tab with the \u003cscript> snippet.\n\n- Click Copy and paste it into your website where you want the widget to appear.\n\nTip: If you want to filter programmes, use Customize embed code and select the programmes there. It’s recommended to regenerate the code from that panel rather than editing the script manually. \n\n\nIf you want, I can also show you the easiest way to make the widget show only one programme without editing the script.", "cited": ["Publish (Widgets) | Zooza Help", "Customizing widgets | Zooza Help", "Booking Widget FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "yes", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I'm glad to hear that was what you were looking for! If you have any more questions or need further assistance with your widget, please feel free to ask. I'm here to help! 😊", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "i dont want to show the calendar, i just want to show 1 programme", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You don’t need the calendar widget at all.\n\n\nUse the Booking Form widget instead. It shows the programme booking form without a calendar view. \n\n\nSteps:\n\n\n\n\n- Go to Team & Settings → Publish\n\n\n- Open Embed code\n\n\n- Select Booking Form\n\n\n- Click Customize embed code\n\n\n- In Choose programmes, select only the one programme you want\n\n- Copy the generated code and place it on your website\n\nThis will display just that single programme’s booking form. \n\n\nTip: If you want a cleaner page, you can also create a dedicated page for that programme and filter it with ?course_id=PROGRAMME_ID so only that programme appears.", "cited": ["Customizing widgets | Zooza Help", "Publish (Widgets) | Zooza Help"]}, {"role": "customer", "who": "Sam Davis", "text": "ive done this and it does not work", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thanks for the screenshot — that helps a lot. The code you generated does include the filter (data-zooza-filter-courses='9831'), so the widget is configured correctly. The issue is usually one of these:\n\n\n\n\n- \nOld cached script on the website\nAfter replacing the embed code, do a hard refresh of the page:\n• Windows: Ctrl + F5\n• Mac: Cmd + Shift + R\n• Cached scripts can keep showing the old version. \n\n\n- \nProgramme not eligible for the widget\nCheck the programme → Settings → Online registration and confirm Online registration is enabled. If it is off, the programme will not appear in the booking form widget. \n\n\n- \nNo active upcoming classes\nThe programme must have at least one class with upcoming sessions. If all classes are finished or inactive, it will not appear.\n\nQuick check:\n\n\nCan you confirm the programme has at least one upcoming class and Online registration is turned on?\n\n\nIf you want, you can also share the URL of the page where the widget is embedded, and I can help you check the most common cause.", "cited": ["Publish (Widgets) | Zooza Help", "Widget Embedding Troubleshooting | Zooza Help", "Customizing widgets | Zooza Help"]}, {"role": "customer", "who": "Sam Davis", "text": "ive checked everything and its all turned on and correct/", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "https://www.elizabethsamuelsdrama.it/corsi-sabato-bambini-roma", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thanks for sharing the screenshot — the embed code itself looks correct. The filter data-zooza-filter-courses='9831' means the widget is configured to show only that programme. \n\n\nSince you already checked the programme settings, the most common remaining causes are:\n\n\n\n\n- \nCookie consent blocking the script\nIf your site uses a cookie banner, it may block the Zooza script. The widget area can appear blank until cookies are accepted. Try opening the page in an incognito window and see if the widget loads.\n\n- \nProgramme catalogue settings\nIn Programmes → Edit Settings → Online Booking, confirm both are enabled:\n• Allow online booking\n• Display in catalogue\n• If either is off, the programme will not appear in widgets. \n\n\n- \nNo upcoming sessions\nThe programme must have at least one class with active upcoming sessions. \n\n\nQuick check:\n\n\nWhen you open the page in an incognito window, do you see the booking form or just a blank space where the widget should be?", "cited": ["Publish (Widgets) | Zooza Help", "Widget Embedding Troubleshooting | Zooza Help", "Registration and Booking FAQ | Zooza Help", "Booking Widget FAQ | Zooza Help"]}, {"role": "customer", "who": "Sam Davis", "text": "checked all of that and still doesnt work, when i open in incognito window, it still shows all of the programmes", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thanks for checking all of that — that helps narrow it down.\n\n\nThe most likely cause is duplicate filtering. Your page contains two filters at the same time:\n\n\n\n\n- The generated widget code:\ndata-zooza-filter-courses='9831'\n\n\n- The script above it:\nfilter_courses : [9607, 9614, 9615]\n\n\nWhen both exist, the script filter can override the widget filter, which causes the widget to show all programmes instead of the one you selected. \n\n\nQuick fix: remove the script block completely from your page and keep only the generated widget embed code.\n\n\nIf you want to keep filtering manually, you can use only the script method:\n\n\n\u003cscript>\ndocument.zooza = {\n  filter_courses: [9831]\n}\n\u003c/script>\nBut the safest approach is to use only the generated embed code from Publish → Embed code and avoid editing the script manually. \n\n\nIf you want, I can also show you a clean “single‑programme page” setup that avoids this issue entirely.", "cited": ["Widget Embedding Troubleshooting | Zooza Help", "Customizing widgets | Zooza Help", "Registration widget | Zooza Developer Docs"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "i just entered \u003cscript>\n\n\ndocument.zooza = {\n\n\nfilter_courses: [9831]\n\n\n}\n\n\n\u003c/script> and nothing comes up, its blank", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "The blank result usually means the filter script is running before the widget script loads.\n\n\nYour current order is:\n\n\n\n\n- \u003cscript> document.zooza = { filter_courses: [9831] } \u003c/script>\n\n- \u003cscript src=\"https://api.zooza.app/widgets/v1/loader.js\">\n\nThe widget loader must load before the filter script. Otherwise the widget initialises without the filter and then the filter never applies. \n\n\nFix: move the filter script after the loader script.\n\n\nExample order:\n\n\n\u003cscript data-version='v1' data-widget-id='zooza' id='4d06112674' type='text/javascript'>\n(function(){ ... })();\n\u003c/script>\n\n\u003cscript>\ndocument.zooza = {\n  filter_courses: [9831]\n}\n\u003c/script>\nAlso make sure you do not keep the old filter script that contains [9607, 9614, 9615], because multiple filters can conflict. \n\n\nIf you want, you can also share the page URL where the widget is embedded, and I can help you spot exactly where the script order is going wrong.", "cited": ["Widget Embedding Troubleshooting | Zooza Help", "Registration widget | Zooza Developer Docs"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "i put this and it didnt work \u003cscript data-version='v1' data-widget-id='zooza' id='4d06112674' type='text/javascript'>\n\n\n(function(){ ... })();\n\n\n\u003c/script>\n\n\n\u003cscript>\n\n\ndocument.zooza = {\n\n\nfilter_courses: [9831]\n\n\n}\n\n\n\u003c/script>", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "The blank result is expected with that script. The filter script you added does not include the widget loader, so the registration widget never initialises. That’s why the area stays empty. \n\n\nThe safest approach is to avoid manual script editing and use only the generated embed code from Publish → Embed code → Customize embed code. Manually editing filter parameters often causes the widget to ignore the filter or fail to load. \n\n\nQuick reset that usually fixes this:\n\n\n\n\n- Remove all \u003cscript> blocks from the page.\n\n- Go to Publish → Embed code → Booking Form.\n\n- Click Customize embed code.\n\n- Select only the one programme.\n\n- Click Copy and paste that code alone on the page.\n\nIf you want, I can also show you a very clean “single‑programme page” setup that avoids these script conflicts entirely.", "cited": ["Widget Embedding Troubleshooting | Zooza Help", "Customizing widgets | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this information helpful?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "yes If you want, I can also show you a very clean “single‑programme page” setup that avoids these script conflicts entirely.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "The cleanest way to show only one programme is to avoid script filters completely and use a URL parameter instead.\n\n\nCreate a dedicated page for that programme and use this URL:\n\n\nhttps://yourdomain.com/page/?course_id=9831\n\n\nThe course_id parameter tells the widget to display only that programme. \n\n\nSteps:\n\n\n\n\n- Create a page on your website for that programme.\n\n- Paste the Booking Form embed code from Publish → Embed code.\n\n- Do not edit the filter parameters manually.\n\n- Use the page URL with ?course_id=9831.\n\nThis avoids script conflicts and keeps the setup simple. \n\n\nTip: You can also reuse the same widget on multiple pages by changing the course_id in the URL for each programme.", "cited": ["Customizing widgets | Zooza Help", "Widget Embedding Troubleshooting | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help getting only one programme to display, I’m here to help, and I’m sorry this has been so frustrating. Would you like to share what you currently see on the dedicated page so we can continue troubleshooting?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "how do you change an instructors name to your own customised name not just their full name", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can use a nickname instead of the instructor’s full name.\n\n\nSteps:\n\n\n\n\n- Go to Settings → Instructors\n\n\n- Open the instructor’s profile\n\n- In the Profile section, fill in the Nickname field\n\n- Turn on Show nicknames only\n\n\n- Save\n\nWhen this setting is enabled, clients will see the nickname instead of the instructor’s first and last name in the booking widget. \n\n\nAlso make sure the class itself has the correct instructor selected, because the booking form reads the instructor from the class settings, not the session.", "cited": ["Instructors | Zooza Help", "Creating a class | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help customising the instructor’s displayed name, I’m here to help. Would you like to share more about what name you want clients to see?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "send me the specific url link for lamda acting academy", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I’m not able to generate the exact URL for “lamda acting academy” because the link depends on your account name.\n\n\nYour public booking page is built like this:\n\n\n\n\n- \nzooza.site/your-account-name/register – shows all programmes open for registration. \n\n\nIf you want to send parents directly to one programme, you can also use:\n\n\n\n\n- \nyourbrand.zooza.online/booking/?course_id=X\n(replace X with the programme ID). \n\n\nThe easiest way to get the exact link is:\n\n\n\n\n- Go to Programmes\n\n\n- Open the programme\n\n- Click Share on the class card\n\n- Copy the link from there.\n\nThat copies the correct URL for your account automatically.", "cited": ["Registration and Booking FAQ | Zooza Help", "Share a course or class registration link | Zooza Help"]}, {"role": "customer", "who": "Sam Davis", "text": "what about classes?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "For classes, you have two options.\n\n\n1. General class list\n\n\n\n\n- \nyourbrand.zooza.online/booking/\nThis shows all available classes so parents can choose which one to book. \n\n\n2. Direct link to one specific class\n\n\n\n\n- \nyourbrand.zooza.online/booking/?course_id=X&schedule_id=Y&place_id=Z\nThis opens a single class with the selection already pre‑filled.\n\nThe easiest way to get the exact link is:\n\n\n\n\n- Go to Programmes → open the programme → open the class\n\n\n- Click Share and copy the booking link. \n\n\nTip: sending the class-specific link is usually best because it takes parents straight to that class without choosing from a list.", "cited": ["Registration and Booking FAQ | Zooza Help", "Onboarding and Launch FAQ | Zooza Help", "Share a course or class registration link | Zooza Help", "Customizing widgets | Zooza Help", "Children's Group Activities — Block / Term Model | Zooza Help"]}, {"role": "customer", "who": "Sam Davis", "text": "it says 404 Not Found\n\n\nnginx/1.31.4", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "A 404 Not Found usually means the page URL does not match the page where the widget actually exists on your website. \n\n\nTwo common causes:\n\n\n\n\n- \nWrong base URL in Publish settings\nGo to Settings → Publish and check the URL for the booking widget. It must match the exact page on your website where the widget is embedded. If the domain or page changed, update it there.\n\n- \nIncorrect booking link\nThe correct format is:\nyourbrand.zooza.online/booking/\nor for a specific class:\nyourbrand.zooza.online/booking/?course_id=X&schedule_id=Y&place_id=Z \n\n\nQuick check:\n\n\n\n\n- Does the page on your website actually contain the Zooza booking embed code?\n\n- And does the URL in Settings → Publish match that page exactly?\n\nIf you want, you can also share the page URL you’re using and I can help you spot what might be causing the 404.", "cited": ["Widget Embedding Troubleshooting | Zooza Help", "Registration and Booking FAQ | Zooza Help"]}, {"role": "customer", "who": "Sam Davis", "text": "how do i send a parent a specific class https://zooza.site/elizabeth-samuels/", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "The easiest way is to copy the direct class booking link from the class page.\n\n\nSteps:\n\n\n\n\n- Go to Programmes\n\n\n- Open the programme\n\n- Open the specific class\n\n\n- Click Share in the class detail\n\n- Click Copy link\n\n\nThat URL is the exact link for that class. You can send it to parents by email, WhatsApp, or anywhere you communicate with them. \n\n\nThe link automatically pre‑fills the class, so parents go straight to the booking form without choosing from a list. \n\n\nTip: sending the class-specific link is usually best because it removes confusion and increases completed bookings.", "cited": ["Booking FAQ | Zooza Help", "Onboarding and Launch FAQ | Zooza Help", "Share a course or class registration link | Zooza Help", "Children's Group Activities — Block / Term Model | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "its not working", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thanks for the screenshot — that helps a lot.\n\n\nThe link you copied is the correct format for a specific class. It includes the class ID and schedule ID, which is exactly what is needed to send parents directly to one class. \n\n\nA couple of quick things to check:\n\n\n\n\n- Click Open link in that same Share window. Does the page open correctly there?\n\n- If it still shows 404 Not Found, the most common cause is the base URL in Publish settings not matching the page where the widget actually lives on your website. \n\n\nQuick check:\n\n\n\n\n- Go to Settings → Publish\n\n\n- Open the Booking form widget\n\n- Confirm the URL there matches the exact page on your website where the widget is embedded.\n\nIf you can, please share:\n\n\n\n\n- the URL of the page where the widget is embedded, and\n\n- whether the Open link button in the Share window also shows the 404.\n\nThat will help narrow down whether the issue is the widget URL or the page itself.", "cited": ["Share a course or class registration link | Zooza Help", "Registration and Booking FAQ | Zooza Help", "Widget Embedding Troubleshooting | Zooza Help"]}, {"role": "customer", "who": "Sam Davis", "text": "so it has to open it on our website?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "No — it does not have to open on your website.\n\n\nThe link you copied from Share → Public registration link works on its own. You can send that URL directly to parents by email, WhatsApp, etc., and they can book from that page. \n\n\nThe “open on your website” part is only recommended for the long term. When the booking widget is embedded on your site, parents stay on your domain and the booking happens inside your website. \n\n\nSo in short:\n\n\n\n\n- You can send the link directly to parents.\n\n- Embedding it on your website is optional and mainly for branding and SEO. \n\n\nIf you want, I can also show you the cleanest way to send parents a single class link that avoids confusion.", "cited": ["Share a course or class registration link | Zooza Help", "Zooza Glossary | Zooza Help", "Booking Widget FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Does that address what you needed?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "If you want, I can also show you the cleanest way to send parents a single class link that avoids confusion.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "The cleanest way is to send parents a direct class booking link — not the general booking page.\n\n\nSteps:\n\n\n\n\n- Go to Programmes\n\n\n- Open the programme\n\n- Open the specific class\n\n- Click Share\n\n\n- Click Copy link\n\n\nSend that link to parents by email or WhatsApp. It opens the booking form with that class already selected, so they only need to fill in the form and pay. \n\n\nThis avoids confusion because parents don’t have to choose from a list of classes. \n\n\nTip: you can also send the same link to a whole group (for example a WhatsApp class group) so everyone books the correct session.", "cited": ["Registration and Booking FAQ | Zooza Help", "FAQ — Programmes | Zooza Help", "Onboarding and Launch FAQ | Zooza Help", "Children's Group Activities — Block / Term Model | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help with the class link or booking setup, I’m here to help. Would you like to share more about what happens when you open the link?", "cited": []}], "verdict": "verify", "vtitle": "Show one programme in the widget: filter_courses vs data-zooza-filter-courses; ?course_id=; share link 404; instructor nickname", "vnote": "Long loop; client had two conflicting filters. Widget troubleshooting article may need 'two filters' note — Michal to confirm which mechanism wins.", "cat": "widgets"}, {"channel": "intercom", "id": "215475991179341", "date": "2026-09-18 10:55", "day": "2026-09-18", "human": true, "bucket": "HUMAN", "reask": 2, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Manage trial bookings — reschedule, convert, and close | Zooza Help", "Automatic payment reminders | Zooza Help", "Email and Communication FAQ | Zooza Help", "Automatic reminders for payment schedule | Zooza Help", "Children's Group Activities — Monthly Subscription Model | Zooza Help", "Registration statuses — what each one means | Zooza Help"], "q": "Zdravím,\ntakto začiatkom školského roka sa nám hlási veľa rodičov, že si vybraný kurz chcú prísť s deťmi skúsiť, no nechcú sa zaviazať s platbou na polrok/rok, kým nevedia, či to deti bude baviť ap.\nSnažíme sa týmto rodičom vychádzať v ústrety a umožniť im skúšobnú hodinu, no zároveň ich chceme mať v systéme a teda ich poprosíme o registráciu na daný kurz. Na prípadnej platbe sa dohodneme po prvom tréningu. \nZároveň však chcem mať na kurze nastavené pripomienky k platbám pre rodičov, ktorí už vedia, že budú ich deti chodiť, no zabudli uhradiť ap. Avšak tieto pripomienky potom automaticky chodia aj rodičom, ktorí sú len na skúšku a sú zmätení, či majú alebo nemajú platiť. Tieto emaily im potom zahlcujú stránku a celé to pôsobí neprofesionálne.\nNebolo by možné k stavom \"registrovaný\", \"poradovník\" ap. pridať stav \"na skúšku\", ktorý by ignoroval nastavenia pripomienok k platbám a zároveň odlíšil takéto registrácie od skutočných registrovaných na celý kurz? \nResp. je nejako možné vypnúť pripomienky k platbám vo vybraných registráciách?\nĎakujem\nJakub_MEDVEDICA", "turns": [{"role": "customer", "who": "Jakub Majoroš", "text": "Zdravím,\ntakto začiatkom školského roka sa nám hlási veľa rodičov, že si vybraný kurz chcú prísť s deťmi skúsiť, no nechcú sa zaviazať s platbou na polrok/rok, kým nevedia, či to deti bude baviť ap.\nSnažíme sa týmto rodičom vychádzať v ústrety a umožniť im skúšobnú hodinu, no zároveň ich chceme mať v systéme a teda ich poprosíme o registráciu na daný kurz. Na prípadnej platbe sa dohodneme po prvom tréningu. \nZároveň však chcem mať na kurze nastavené pripomienky k platbám pre rodičov, ktorí už vedia, že budú ich deti chodiť, no zabudli uhradiť ap. Avšak tieto pripomienky potom automaticky chodia aj rodičom, ktorí sú len na skúšku a sú zmätení, či majú alebo nemajú platiť. Tieto emaily im potom zahlcujú stránku a celé to pôsobí neprofesionálne.\nNebolo by možné k stavom \"registrovaný\", \"poradovník\" ap. pridať stav \"na skúšku\", ktorý by ignoroval nastavenia pripomienok k platbám a zároveň odlíšil takéto registrácie od skutočných registrovaných na celý kurz? \nResp. je nejako možné vypnúť pripomienky k platbám vo vybraných registráciách?\nĎakujem\nJakub_MEDVEDICA", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Hi Jakub,\n\n\nThanks for reaching out! I'm Zooza Support, Zooza's AI Agent and I'm well trained to answer your query but you can reply and ask for the team at any time.\n\n\nYes — this situation is already supported in Zooza using the Trial workflow, which is designed exactly for “try before you commit” cases. \n\n\nInstead of using a regular registration, you can create a Trial booking for those parents. This keeps them in the system but separates them from full enrolments.\n\n\nKey benefits for your use case:\n\n\n\n\n- Trial bookings have their own statuses (e.g. Trial started, Trial lost) and are clearly distinguished from normal enrolments. \n\n\n- Trial clients are not included in “all active clients” communications, so they won’t receive general programme emails unless you specifically target them. \n\n\n- You can configure trial-specific emails (confirmation, follow-up, join link) separately from regular programme communication. \n\n\n- If a parent decides not to continue, you can mark the trial as Trial Lost, which stops further trial follow-ups.\n\nRegarding payment reminders:\n\n\n\n\n- These are configured per programme, so you can simply avoid attaching a Payment Reminder to the trial setup. \n\n\n- Alternatively, you can disable all scheduled payment notifications globally in Settings → Billing & Payments → Payment settings → Scheduled-payment notifications. \n\n\nIn practice, many organisations run trials this way: parents book a trial session, attend once, and then convert to a full registration only if they decide to continue.\n\n\nIf you’d like, I can also share a simple workflow many clubs use to smoothly convert trial participants into paying members after the first session. Please let me know if this helps or if you have any further questions.\n\n\nRegistration statuses — what each one means | Zooza Help\nAutomatic payment reminders | Zooza Help\nManage trial bookings — reschedule, convert, and close | Zooza Help\nChildren's Group Activities — Monthly Subscription Model | Zooza Help\nAutomatic reminders for payment schedule | Zooza Help\nEmail and Communication FAQ | Zooza Help", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Jakub, na toto mame uz asi dva roky v aplikacii funkcionalitu skusobnych hodin. Skuste si pozriet k tomu prislusne navody: https://help.zooza.online/programmes/trial-sessions/ Cela skusobna hodina sa da plne automatizovat, akurat je potrebne vyplnat tymto ludom dochadzku.", "cited": []}, {"role": "customer", "who": "Jakub Majoroš", "text": "How do I make a session a trial one that is shows in the registration form? \n\n\nNo session available (I would like to make a first session of the course a trail session as well)\n\n\nMy settings:", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Uplne na spodku tej obrazovky si viete nastavit, ktore skupiny maju byt ponukane na skusobne hodiny. Vidim ze ste si nastavili platene skusobne hodiny - Chcem len upozornit, ze ste si nastavili moznost zobrazovat iba jeden termin. Toto su dve rozdielne nastavenia. Vo vasom pripade ste si vybrali jednu platenu skusobnu hodinu a zaroven ste nastavili ze v registracnom formulari sa da vybrat iba najblizsi termin. Standardne si tam ludia nechavaju ponuknut povedzme tri - pat terminov, aby si zakaznik mohol vybrat. Napriklad v situacii ak je dnes 12:30 a hodina je dnes o 15:00 a ja viem ze ju nestihnem, tak musim pockat do 15:01 aby som si mohol booknut skusobnu hodinu na dalsi den (alebo buduci tyzden)", "cited": []}, {"role": "customer", "who": "Jakub Majoroš", "text": "Zdravím, Martin,\n\n\nale ja by som to mal rád nastavené len na prvom termíne. Tzn., že potom už skušobná hodina nie je možná. Jedná sa o kurzy s vyšším nákladom (doprava, vstup do športoviska), takže zároveň chcem, aby si túto hodinu rodičia zaplatili.\n\n\nEšte k predošlému emailu. Rozumiem, že klubom, ktoré majú jedno športovisko po celý rok, kde deti vozia rodičia, postačí možnosť zvoliť si skúšobné termíny a operovať s tým, ale v našom prípade sa jedná o lezecké kurzy s dopravou zo školy a späť, vstupmi ap. Tzn., že len na samotné spustenie kurzu (rentabilitu) potrebujeme aspoň xy prihlásených. Ak im ja ponúknem pri registrácii možnosť skúšobnej hodiny, obávam sa, že veľa ľudí si vyberie túto možnosť. My však musíme vopred zakontrahovať dopravcu, športovisko atď. Ak sa potom všetci odhlásia, všetky straty sú na naše triko. Je to extrémny príklad, ale šťastie praje pripraveným. \n\n\nPreto chcem možnosť na skúšku ponúkať skôr výnimkám, ako všetkým. Preto sa opýtam inak, ak teda neplánujete pridávať ďalší stav k registráciam. Keď tieto registrácie presuniem do poradovníka, budú im hodiť upozornenia, ak majú vytvorený dlh? To už by som možno zmanažoval, aj keď nastáva zas problém odlišovať registrácie, ktoré sú reálne v poradovníku od tých, ktoré idú len na skúšku.\n\n\nResp. možno viete aj o inom riešení.\n\n\nĎakujem\n\n\nJakub", "cited": []}], "verdict": "check", "vtitle": "'Try before paying' = Zooza Trial; paid trial vs 'show 1 session' are separate settings; wants trials only on first session", "vnote": "Trial docs cover it; WRITTEN: one clarifying note in trial-sessions.md (sessions shown). Open: do waiting-list registrations receive payment reminders? Michal.", "cat": "trials"}, {"channel": "intercom", "id": "215475991566108", "date": "2026-09-18 10:36", "day": "2026-09-18", "human": false, "bucket": "D_assumed_with_kb", "reask": 1, "resolution": "assumed_res Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}], "verdict": "product", "vtitle": "QR code broken in bulk email — ticket", "vnote": "Not KB.", "cat": "comms"}, {"channel": "intercom", "id": "215475989542341", "date": "2026-09-18 05:40", "day": "2026-09-18", "human": false, "bucket": "D_assumed_with_kb", "reask": 6, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Online booking | Zooza Help", "Programme Settings | Zooza Help", "Managing sessions in a class | Zooza Help", "Booking form settings overview | Zooza Help"], "q": "How do I set a cut off for booking before a session?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "How do I set a cut off for booking before a session?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can set a booking cut‑off by hiding the class from the booking form a few hours before it starts.\n\n\nSteps:\n\n\n\n\n- Go to Programmes → your programme → Settings → Online booking\n\n\n- Find Hide from booking form N hours before the programme begins\n\n\n- Enter the number of hours before the session when you want bookings to stop\n\n- Save\n\nExample: if you set 12 hours, the class disappears from the booking form 12 hours before it starts, so clients cannot book after that. \n\n\nTip: this setting also works well if you want to prevent last‑minute bookings while still allowing earlier registrations.", "cited": ["Booking form settings overview | Zooza Help", "Online booking | Zooza Help", "Programme Settings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Hide from booking form N hours before the programme begins - this isn't here", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "That setting is inside the Online Booking section of the programme.\n\n\nTry this path:\n\n\n\n\n- Go to Programmes\n\n\n- Open your programme\n\n- Click Online Booking\n\n\n- Click Edit\n\n\n- Scroll to Other\n\n\n- You should see Hide from booking form N hours before the programme begins there. \n\n\nThis option controls how many hours before the session the class disappears from the booking form. \n\n\nIf you want, you can also tell me which page you’re currently on (for example: Programme → Settings, Programme → Online Booking, etc.), and I can guide you to the exact spot.", "cited": ["Booking form settings overview | Zooza Help", "Programme Settings | Zooza Help", "Online booking | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "No - its not there", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thanks for the screenshot — that helps a lot.\n\n\nYou are currently on Programme → Settings → Online Booking → Edit, and the screen you’re showing is the Other section. The setting you’re looking for should appear in that same section as:\n\n\n\n\n- Hide from booking form N hours before the programme begins\n\nThis option controls how many hours before the session the programme disappears from the booking form. \n\n\nSince it is not visible in your screenshot, one quick check:\n\n\n\n\n- Did you click Edit in the Online Booking tile before opening the Other section?\n\nIf you are already inside Edit and the field still does not appear, let me know and we can look at the next step together.", "cited": ["Programme Settings | Zooza Help", "Booking form settings overview | Zooza Help"]}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "It's not there", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thanks for the screenshot — that helps.\n\n\nYou are on Programme → Settings → Online Booking → Edit → Other, which is the correct place. In that section es → your programme → Settings → Online Booking → Edit → Other\n\n- Field: “Hide from booking form N hours before the programme begins”\n\n\nThis option controls how many hours before the session the programme disappears from the booking form. \n\n\nSince it is completely missing from your screen, the most likely cause is a display issue. Please try:\n\n\n\n\n- Refresh the page (F5 or Ctrl + Shift + R)\n\n- Then reopen Programmes → NLCS FRIDAY CLUB → Settings → Online Booking → Edit\n\n\nSometimes the booking settings panel fails to load fully and a refresh restores the missing fields. \n\n\nIf it still doesn’t appear after a refresh, let me know and we can check the next step together.", "cited": ["Booking form settings overview | Zooza Help", "Programme Settings | Zooza Help", "Online booking | Zooza Help", "Managing sessions in a class | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Not there after refresh", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thanks for the screenshots — that helps a lot.\n\n\nThe field “Hide from booking form N hours before the programme begins” should appear in Programmes → programme → Settings → Online Booking → Edit → Other. It controls how many hours before the session the programme disappears from the booking form. \n\n\nSince it is completely missing from your screen, this likely needs a closer look.\n\n\nCould you share:\n\n\n\n\n- The URL of this page in your browser\n\n- A short screen recording of scrolling through the Other section\n\nThat will help identify why the field is not appearing.", "cited": ["Booking form settings overview | Zooza Help", "Programme Settings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this information helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I'm sorry this setting is still not appearing after the refre
