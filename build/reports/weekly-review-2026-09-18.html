ková", "text": "Dobrý deň Martin, poprosím napísať postupnosť krokov, ako \na) dvojitú registráciu vymažem\nb) druhú platbu spárujem so správnou registráciou.", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Ďakujem.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Vymazanie je jednoduche - vojdete na detail registracie a priamo v prvej karte najdete tlacitko na vymazanie registracie.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Terminologicky Vas opravim - platbu nesparujete s druhou registraciou - ale mozete ju tam preniest. Len aby sme sa rozumeli, lebo aplikacia v tomto procese nepouziva vyraz \"sparovat\". Ten je urceny na prichadzajuce transakcie.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Cize opat - vojdete do registracie -> Platby -> V zozname transakcii najdete prislusnu transakciu a kliknete na tlacitko Viac. Vyberiete volbu Presunut platbu -> Vyhladate registraciu, kam chcete platbu presunut a kliknete na tlacitko Vybrat (pod prislusnou registraciou). Nasledne potvrdite a presun je hotovy. Presunut viete platbu iba ako celok", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Zrušila som dvojitú registráciu obom dcéram.  Nevidím tam registráciu na Calilu, ktorá bola uhradená aj spárovaná.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Nie som si isty ci rozumiem co sa pytate. Ak ste registraciu zrusili, bude stale v zozname registracii dohladatelna pod stavom registracie - Zrusena. Ak ste registraciu vymazali, bude dostupna v kosi (Tim a nastavenia -> Nastroje -> Kos). Ak ste omylom vymazali/zrusili registraciu, mozete ich stav hocikedy zmenit naspat na stav registrovana", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Postupovala som podľa pokynov. Vošla som do registrácie - Platby.\nTeraz mám v zozname transakcií nájsť príslušnú platbu. Mám ísť na lištu v ľavo?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Zoznam transakcii sa nachadza nizsie, cize musite sa posunut dole", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Nevidím tu zoznam transakcií, v ktorom by som našla príslušnú transakciu.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Vidite kartu vypis transakcii. to je to co hladate. Akurat tam ziadna uhrada nie je - je tam iba dlzna suma", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "V postupe ste uviedli: vojsť do registrácie - Platby - v zozname transkcii nájsť príslušnä transakciu a klinúť na tlačitko Viac.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ano ale na to aby ste mohli na prijatu transakciu kliknut tam nejaka musi byt. Cize najskor musite najst registraciu, na ktorej tu prijatu platbu mate", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Predpokladám, že druhá platba s rovnakým VS 535031 zostala v nespárovaných platbách.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Je to mozne, v tom pripade je to jednoduchsie ale postup je viac menej rovnaky, je potrebne tu platbu najst a priradit ku spravnej registracii. Nesparovane platby najdete v Platby - parovanie platieb - Vo filtri vybrat stav Nove / nesparovane", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "https://zooza.app/#payments/inbound/queue?status=new&page=0&sort_by=posting_date_desc&page_size=50", "cited": []}], "verdict": "check", "vtitle": "Duplicate registration + payment to wrong VS: move payment (whole only), delete registration, unpaired queue", "vnote": "Martin's walkthrough; KB edit-payment-on-booking covers Move payment incl. the whole-only rule. No change. Terminology note: 'move' not 'pair' for received payments.", "cat": "payments"}, {"channel": "intercom", "id": "215475926690433", "date": "2026-09-14 14:17", "day": "2026-09-14", "human": true, "bucket": "HUMAN", "reask": 6, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Automatic payment reminders | Zooza Help", "Payment templates creation | Zooza Help", "Price and payment setup | Zooza Help", "Client Profile FAQ | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Payments | Zooza Help", "Children's Group Activities — Monthly Subscription Model | Zooza Help", "Payment not received in Zooza — troubleshooting | Zooza Help"], "q": "How does a parent who signed up and didn't make payment then go and pay in their parent portal? a parent can't a see a way to do thi", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "How does a parent who signed up and didn't make payment then go and pay in their parent portal? a parent can't a see a way to do thi", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "This is expected behaviour. If a parent registers but skips payment, the booking is still created and they can pay later in their Client Profile. \n\n\nThey should:\n\n\n\n\n- Log into their parent portal\n\n- Open the Payments section\n\n- Select the unpaid booking and continue to the payment gateway (or view bank transfer instructions). \n\n\nIf they cannot see any payment option, the most common reason is the class is set to Lead Collection. In that case there are no sessions yet, so no payment option appears. \n\n\nOnce the class has sessions (Fixed Period), the payment option becomes visible.\n\n\nIf you want, I can also show you how to send a payment reminder to parents who haven’t paid yet.", "cited": ["Payments and Billing FAQ | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Client Profile FAQ | Zooza Help", "Children's Group Activities — Monthly Subscription Model | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "show me how to send a parent reminder", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can send payment reminders in two ways: automatic or manual.\n\n\n1. Automatic reminders (recommended)\n\n\nGo to:\n\n\n\n\n- Programme → Settings → Price and Payment → Payment Reminder Settings\n\nThere you can set:\n\n\n\n\n- how many reminders to send\n\n- how many days between reminders\n\n- whether the booking is automatically cancelled if it stays unpaid. \n\n\nImportant: the Awaiting payment status alone does not send emails. You must enable the Payment Reminder action for reminders to go out.\n\n\n2. Manual reminder for one parent\n\n\n\n\n- Go to Bookings\n\n\n- Open the booking\n\n- Click Send email to send a quick nudge. \n\n\nTip: automatic reminders are great for reducing admin and chasing unpaid bookings without manual emails.", "cited": ["Payments and Billing FAQ | Zooza Help", "Children's Group Activities — Monthly Subscription Model | Zooza Help", "Automatic payment reminders | Zooza Help", "Price and payment setup | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help setting up or sending payment reminders, I’m here to assist. Would you like to share more about what you’re trying to manage?", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "My go Cardless payment was only around £95 last time and this was mostly thtough new signs ups. Was expecting mote than this are you able to check this and see my pending payments coming up for the remainder of the month", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I’m not able to check your account or view your payments directly. But you can quickly review what’s coming up in Zooza.\n\n\n1. See upcoming payments\n\n\n\n\n- Go to Sales & Payments → Payments\n\n\n- Open the Scheduled payments overview\n\n\n- Set the Scheduled from / Scheduled to dates to the rest of the month\n\nThis list shows all scheduled charges, including the amount to be paid and the due date. \n\n\n2. Check GoCardless status\n\n\nIn your GoCardless dashboard, look at the payment status:\n\n\n\n\n- Pending submission – not sent to the bank yet\n\n- Submitted – sent, waiting for bank confirmation\n\n- Confirmed – collected, payout pending\n\n- Paid out – funds sent to your account\n\nPayments usually take 2–5 business days to reach “Paid out.” \n\n\nIf you want, I can also show you how to quickly estimate the total expected payout for the month from the scheduled payments list.", "cited": ["Payment not received in Zooza — troubleshooting | Zooza Help", "Payments | Zooza Help", "Payment templates creation | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this information helpful?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Kieran, you should be able to see this in the Payments -> Direct debit mandates", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "There should be an overview of how many mandates are active and when is the next payment", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "Ah perfect thanks Martin thanks for jumping in", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Please have a look there", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "You should see two kinds of information there - whether the booking has a valid payment plan and whether it has allowed offline money collection (which is required for gc to take a payment)", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "Thanks Martin, using this and Go Cardless is this the best way to see what sheculeded payments are due? Just looking for the best way to see this information", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "No, go cardless does not carry the payments that are scheduled in the future.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "if you want to get quick and dirty overview then there are various ways to check that", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "One of them being:  https://uk.zooza.app/#payments/scheduled", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Here you could choose a status=scheduled and select your date range for example for october", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "a global summary for a month can be seen here: https://ukzooza.app/#payments?report=insights", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "Brilliant thanks Martin, I appreciate this.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "No worries. Please let me know if you found out what was the problem with the money collection. Whether it is something we need to take care of or something else", "cited": []}], "verdict": "gap", "vtitle": "GoCardless: where to see upcoming collections — mandates overview, scheduled payments (status=Scheduled), Insights; GC dashboard shows no future instalments", "vnote": "WRITTEN: gocardless-faq.md new Q + extra bullet on mandate overview (offline collection allowed).", "cat": "payments"}, {"channel": "intercom", "id": "215475927866993", "date": "2026-09-14 13:29", "day": "2026-09-14", "human": true, "bucket": "HUMAN", "reask": 13, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Membership Subscription Setup | Zooza Help", "Late bookings (pro-rata management) | Zooza Help", "How to assign Direct Debit mandates to bookings (GoCardless) | Zooza Help", "Payment templates creation | Zooza Help", "Price and payment setup | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Children's Group Activities — Monthly Subscription Model | Zooza Help", "Add a one-off scheduled payment | Zooza Help"], "q": "Ahoj, prosím ťa potrebujem si potvrdiť pár vecí ohľadom platobných šablón.\nMáme program YTA na Vašej škole, 3 platobné šablóny (mesačná, 3-mesačná, ročná).\n\nPri mesačnej úhrade som uviedol deň v mesiaci kedy má byť splátka splatná ,,1\" - to znamená že pri neskoršej registrácií sa vypočíta alikvótna časť.\nPri kvartálnych úhradách som zvolil ,,0\" - to znamená, že alik. čiastka sa nevypočíta a rodič musí hneď uhradiť čl. príspevok M?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Ahoj, prosím ťa potrebujem si potvrdiť pár vecí ohľadom platobných šablón.\nMáme program YTA na Vašej škole, 3 platobné šablóny (mesačná, 3-mesačná, ročná).\n\nPri mesačnej úhrade som uviedol deň v mesiaci kedy má byť splátka splatná ,,1\" - to znamená že pri neskoršej registrácií sa vypočíta alikvótna časť.\nPri kvartálnych úhradách som zvolil ,,0\" - to znamená, že alik. čiastka sa nevypočíta a rodič musí hneď uhradiť čl. príspevok M?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumiem, že chcete si uistiť detaily o platobných šablónach pre program YTA. Chcete, aby som vás spojil s ľudským agentom? Alebo môžete poskytnúť viac informácií a budeme pokračovať spolu.", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Skúsim najskôr s tebou.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno, Vaše porozumenie je v podstate správne.\n\n\n\n\n- \nMesačná šablóna – deň 1:\nPlatby sa generujú vždy 1. dňa mesiaca. Ak sa rodič prihlási v priebehu mesiaca, Zooza vypočíta alikvótnu časť za prvý neúplný mesiac, a od nasledujúceho mesiaca platí už plnú mesačnú splátku. \n\n\n- \nKvartálna šablóna – deň 0:\nPri hodnote 0 sa platba generuje rovnaký deň v mesiaci ako dátum registrácie. Napr. prihlásenie 15. → splátky budú vždy 15. mesač. \n\n\nTeda kvartálna šablóna s 0 nepoužíva alikvótu – rodič uhrádza plnú kvartálnu časť hneď pri registrácii. \n\n\nAk chcete, môžem ešte ukázať, ako sa to správa pri registrácii v priebehu roka, pretože tam je jeden dôležitý detail pri mesačných platbách.", "cited": ["Price and payment setup | Zooza Help", "Payment templates creation | Zooza Help", "Membership Subscription Setup | Zooza Help", "Children's Group Activities — Monthly Subscription Model | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "ukáž", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dobre, ukážem jeden typický príklad pri mesačnej šablóne s dňom 1.\n\n\n\n\n- Mesačný poplatok: 60 €\n\n- Splátky sa generujú vždy 1. dňa mesiaca. \n\n\nPrihlásenie 15. októbra:\n\n\n\n\n- Zooza vypočíta alikvótu za zostávajúce dni v októbri.\n\n- Ak je v mesiaci napr. 30 dní, zostáva 15 dní → približne 30 € za október. \n\n\n- \n1. novembra sa už vygeneruje plná mesačná splátka 60 €. \n\n\nTeda:\n\n\n\n\n- a. platba = alikvótná za neúplný mesiac\n\n- od nasledujúceho mesiaca = plná mesačná suma. \n\n\nAk chcete, môžem ešte ukázať, ako to vyzerá pri kvartálnej šablóne, keď sa rodič prihlási v priebehu roka.", "cited": ["Payments and Billing FAQ | Zooza Help", "Add a one-off scheduled payment | Zooza Help", "Late bookings (pro-rata management) | Zooza Help", "Price and payment setup | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "ukáž", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Pri kvartálnej šablóne s dňom 0 sa platba generuje vždy v ten istý deň v mesiaci, v ktorom sa rodič prihlási. \n\n\nPríklad:\n\n\n\n\n- Prihlásenie 15. októbra\n\n\n- Prvá kvartálna platba sa vygeneruje 15. októbra\n\n\n- Ďalšie kvartálne platby budú 15. januára, 15. apríla, 15. júla atď.\n\nTeda kvartálna šablóna s 0 nepoužíva alikvótu – rodič uhrádza plnú kvartálnu časť hneď pri registrácii a splátky sa vždy držia toho istého dňa v mesiaci. \n\n\nAk chcete, môžem ešte ukázať, ako to vyzerá pri ročnej šablóne, pretože tam je jeden dôležitý rozdiel pri registrácii v priebehu roka.", "cited": ["Payment templates creation | Zooza Help", "Membership Subscription Setup | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Keď teraz zmením v platobnej šablóne, dátum splatnosti, premietne sa toto nastavenie aj v už vykonaných registráciách.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Nie. Zmena dátumu splatnosti v platobnej šablóne sa nepremieňa do už existujúcich registrácií, ktoré už majú vytvorený platobný plán. \n\n\nPlatné je:\n\n\n\n\n- zmena šablóny sa aplikuje na nové registrácie,\n\n- už existujúce registrácie si zachovajú pôvodný platobný plán.\n\nAk chcete, aby nový dátum splatnosti platil aj pre existujúce registrácie, je potrebné:\n\n\n\n\n- na danom prihlásení odstrániť platobný plán a vytvoriť ho znova podľa aktualizovanej šablóny. \n\n\nTip: ak máte veľa registrácií, môže sa to robiť hromadne aplikáciou šablóny na triedu.", "cited": ["Payment templates creation | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Je toto pre vás jasné?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak potrebujete k platobným šablónam ešte s niečím pomôcť, pokojne napíšte. Chcete doplniť, čo presne potrebujete overiť alebo nastaviť?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "A situácie keď je vykonaná registrácia 11.9.2026, v ten istý deň aj zaplatená kvartálna úhrada (11.9.-11.11.), a zmením dátum splatnosti na 1.v mesiaci, zároveň tréningy začínajú až od 1.10.2026. Posunie sa už uhradená platba na 1.10.-1.12.?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Nie. Už uhradená a existujúca platba sa neposunie.\n\n\nPri zmene dátumu splatnosti v šablóne:\n\n\n\n\n- zmena sa aplikuje len na nové registrácie,\n\n- \nexistujúci platobný plán a už vykonané platby zostávajú nezmienené.\n\n\nTeda v Vašom príklade:\n\n\n\n\n- registrácia 11.9.2026\n\n- kvartálna úhrada zaplatená 11.9.2026\n\n- zmena šablóny na splatnosť 1. dňa mesiaca\n\n→ platba zostane 11.9.–11.11., neposunie sa na 1.10.–1.12.\n\n\nAk by ste chceli zmeniť dátumy, je potrebné upraviť platby ručne v platobnom pláne pri danom prihlásení.\n\n\nTip: ak máte veľa takýchto registrácií, môže sa to robiť aj hromadne aplikáciou šablóny na triedu.", "cited": ["Payments and Billing FAQ | Zooza Help", "Payment templates creation | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "a keď teda hromadne aplikujem šablónu na triedu, tak sa im posunie aj uhradená čiastka?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Nie. Hromadné aplikovanie platobnej šablóny na triedu neposunie ani neprepočíta už uhradené platby. \n\n\nPlatné je:\n\n\n\n\n- šablóna sa aplikuje na existujúce prihlásenia v triede,\n\n- ale platobný plán a už vykonané platby zostávajú nezmienené,\n\n- systém ich neprepočíta ani nepresunie.\n\nTeda ak máte prihlásenie z 11.9. s kvartálnou úhradou 11.9.–11.11., aj po hromadnom aplikovaní šablóny s dňom 1. v mesiaci zostane platba presne v týchto dátumoch.\n\n\nAk by ste chceli zmeniť dátumy, je potrebné ich upraviť ručne v platobnom pláne pri danom prihlásení.\n\n\nTip: ak máte veľa takýchto registrácií, môže sa to robiť aj hromadne aplikáciou šablóny na triedu – len si treba pamätať, že už uhradené platby sa týmto krokom neupravujú.", "cited": ["Programmes, Timetables and Sessions FAQ | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak potrebujete ešte s niečím pomôcť pri platobných šablónach alebo existujúcich platbách, som vám k dispozícii. Chcete doplniť, čo presne potrebujete overiť alebo nastaviť?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Prejdime na hromadnú aplikáciu šablóny na triedu. Musím vytvoriť novú platobnú šablónu (kvartálnu) nastaviť dátum splatnosti na 1.? a následne ju aplikovať na už vykonané registrácie?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno, presne takto to máte urobiť.\n\n\nPostup je:\n\n\n\n\n- Vytvorte kvartálnu platobnú šablónu v Settings → Price and Payment → Payment templates a nastavte dátum splatnosti na 1. dňa mesiaca. \n\n\n- Túto šablónu aktivujte na danom programe. \n\n\n- Otvorte triedu → Price & Payments → Apply payment template. \n\n\n- Nastavte správnu sumu a vyberte, na ktoré prihlásenia sa má aplikovať.\n\nTýmto krokom aplikujete túto šablónu hromadne na existujúce registrácie v triede.\n\n\nTip: ak chcete, môžem ešte ukázať, ako sa správne nastaví start date pri hromadnom aplikovaní, aby sa kvartálne platby vygenerovali od správneho dátumu.", "cited": ["Payments and Billing FAQ | Zooza Help", "Payment templates creation | Zooza Help", "How to assign Direct Debit mandates to bookings (GoCardless) | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Bolo to pre vás užitočné?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "a viem túto novo vytvorenú šablónu pridať na konkrétne registrácie, ktoré si vyfiltrujem (YTA na Vašej škole, 3-mesačné úhrady)?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno, je to možné. Túto šablónu môžete použiť aj na vybrané registrácie, nie len na celú triedu. \n\n\nPostup je:\n\n\n\n\n- otvorte konkrétne prihlásenie (registráciu),\n\n- v platobnom pláne pri danom prihlásení priradte túto šablónu ručne.\n\nTeda máte dve možnosti:\n\n\n\n\n- \nhromadne na triedu – Class → Price & Payments → Apply payment template,\n\n- \nna vybrané registrácie – ručne pri každom prihlásení.\n\nAk chcete, môžem ešte ukázať, kedy je lepšie použiť hromadnú aplikáciu a kedy ručné priradenie pri filtrovaných registráciách.", "cited": ["Payment templates creation | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was that helpful?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "aha, takže na vybraté registrácie to neviem urobiť hromadne?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Nie — hromadné aplikovanie platobnej šablóny je možné len na úrovni triedy, nie na vyfiltrovaných registráciách. \n\n\nAk chcete použiť šablónu len na vybrané prihlásenia, máte dve možnosti:\n\n\n\n\n- \nručne pri každom prihlásení – otvorte registráciu → Payments → View Payments → Change a vyberte šablónu.\n\n- \nhromadne na triedu – aplikujete ju na všetky registrácie v triede naraz.\n\nTeda filtrované registrácie (napr. len „YTA na Vašej škole“) sa hromadne šablónou aplikovať nedajú.\n\n\nTip: ak máte veľa takýchto registrácií, často sa vyplatí ich najprv dať do jednej triedy a potom aplikovať šablónu hromadne.", "cited": ["Payment templates creation | Zooza Help", "Add a one-off scheduled payment | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Bolo to pre vás užitočné?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "okej, a keď to urobím, tak ako mám teda posunúť už zaplatené úhrady na nasledujúce obdobie?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Už uhradené platby sa nedajú hromadne posunúť na nasledujúce obdobie. Systém ich neprepočíta ani nepresunie automaticky. \n\n\nMáte dve možnosti:\n\n\n\n\n- \nUpraviť dátumy ručne – otvorte registráciu → Payment plan → kliknite na konkrétnu (budúcu) platbu a zmeňte jej dátum splatnosti.\n\n- \nNahradiť celý platobný plán – v registrácii kliknite Replace plan a aplikujte šabló nt and pause their place until the new venue opens.\n\n\nOption 1: Pause the booking (best if they will return later)\n\n\n\n\n- Go to Calendar and cancel the sessions they will miss.\n\n- Then open Bookings → Detail → Payments → Payment Plan.\n\n- Move the next scheduled payment to a date after the new venue opens.\n\nThis keeps the booking active and prevents new charges during the break. Billing resumes automatically later. \n\n\nOption 2: Hold them in a “holding class”\n\n\n\n\n- Create a class with no sessions.\n\n- Open the booking → Transfer → select the holding class.\n\n- Tick Do not change payments.\n\nWhen the new venue opens, transfer them back into the active class. \n\n\nTip: If you want, I can also show a simple way to manage a waiting list for the new venue so you can fill spots quickly.", "cited": ["Common Booking Scenarios | Zooza Help", "Transfer and Copy FAQ | Zooza Help", "Bookings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "Is there a way to runa. report or pull out marketing inf how most parents heard about us?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — the usual way is to collect this during registration.\n\n\nAdd a custom field to your registration form asking something like:\n\n\n\n\n- “How did you hear about us?”\n\n- “Who recommended us?”\n\nParents select or type the source (Instagram, school, referral, etc.). You can then track and analyse those responses through the Reports Dashboard and export the data if needed. \n\n\nMany businesses also use promo codes for specific channels (e.g. Instagram, school partnerships) to see which source brings the most bookings. \n\n\nIf you want, I can also show a simple way to structure that question so the results are easy to analyse later.", "cited": ["Referrals Are Your Hidden Superpower: How to Turn Parents Into Your Best Promoters (Before Classes Even Start) — Zooza Blog", "10 Smart Ways to Grow Your Children’s Activity Business Over the Summer — Zooza Blog", "Reports | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "Il;ve done this but want to kow the results across my franchise customers is ther e a report or anythig I can run", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — if you’re running a franchise network, HQ can view results across all franchisees in the Network Application. It shows network-wide metrics such as enrolments, payments, revenue, cancellations, and sessions, and you can filter by company, location, product, or time period. \n\n\nFor deeper analysis (like your “how did you hear about us” field), you can also export the bookings data to an XLSX file and analyse the custom field responses in Excel or Google Sheets. \n\n\nTip: if that field is a dropdown, the export may show the option key (e.g. facebook, word_of_mouth) rather than the label, so setting clear keys makes reporting easier. \n\n\nIf you want, I can also show a simple way to structure that field so the franchise-wide results are much easier to analyse.", "cited": ["Franchise and Multi-location Networks | Zooza Help", "Exporting data and reports | Zooza Help", "Booking FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "how to do this \n\nFor deeper analysis (like your “how did you hear about us” field), you can also export the bookings data to an XLSX file and analyse the custom field responses in Excel or Google Sheets.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can export the booking data and then analyse the “how did you hear about us” field in Excel or Google Sheets.\n\n\nSteps:\n\n\n\n\n- Go to Bookings in the main menu.\n\n- Apply any filters you title": "Payments export 'profile column' — IBAN is in the export", "vnote": "Client-specific; export unchanged.", "cat": "reports"}, {"channel": "intercom", "id": "215475924161583", "date": "2026-09-14 07:56", "day": "2026-09-14", "human": false, "bucket": "D_assumed_with_kb", "reask": 7, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Discounts and Sibling Pricing FAQ | Zooza Help", "Discounts | Zooza Help", "Orders and Products FAQ | Zooza Help", "Products | Zooza Help", "Client Profile FAQ | Zooza Help", "Entry pass — client view | Zooza Help", "Bookings | Zooza Help"], "q": "how can I see when someone uses an entry pass to schedule a class and how many entry passes are left in their account?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "how can I see when someone uses an entry pass to schedule a class and how many entry passes are left in their account?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can see both from the client’s profile.\n\n\n1. Check remaining entry passes\n\n\n\n\n- Go to Clients and open the client’s profile.\n\n- In Orders, open the entry pass order.\n\n- The order shows:\n• Entries used (which sessions the pass was used for)\n• Entries remaining\n• Expiration date and payment status. \n\n\n2. See when a pass was used\n\n\n\n\n- In the same order detail, the Entries used section lists the specific sessions where the pass entry was deducted.\n\nYou can also see the remaining entries directly on the client’s profile home page or in the Benefits section. \n\n\nTip: if you want, I can also show you how to quickly review all entry pass usage across multiple clients.", "cited": ["Orders and Products FAQ | Zooza Help", "Entry pass — client view | Zooza Help", "Client Profile FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Tip: if you want, I can also show you how to quickly review all entry pass usage across multiple clients. Yes please", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can review entry pass usage across many clients from the Bookings page.\n\n\nSteps:\n\n\n\n\n- Go to Clients → Bookings.\n\n- Open the Credits and Make‑up Sessions tab.\n\n- Look for the Entry pass section.\n\nThere you’ll see each time an entry pass credit is used, including:\n\n\n\n\n- the class where it was used\n\n- the session date\n\n\n- the date it was redeemed\n\n\n- who redeemed it. \n\n\nFor remaining passes, open the client’s Orders and view the entry pass order. It shows entries remaining, entries used, and the expiration date. \n\n\nTip: you can also use the filters in the Bookings list (client, programme, venue, etc.) to narrow the view when reviewing pass usage across groups of clients.", "cited": ["Entry pass — client view | Zooza Help", "Bookings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Credits and Make‑up Sessions this isn't here?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Good catch — that tab only appears inside a booking, not in the main Bookings list.\n\n\nTry this:\n\n\n\n\n- Go to Clients → Bookings\n\n\n- Click on a specific booking to open the Booking detail\n\n\n- In that screen, select the Credits and make-up sessions tab\n\nInside that tab you’ll see the Entry pass section where credits are listed and tracked. \n\n\nSo the tab is hidden until you open an individual booking.\n\n\nIf you want, I can also show a quicker way to review entry pass usage across many clients without opening each booking one by one.\n\n\n\nSource:\nBookings | Zooza Help", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Does this clarify things?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "If you want, I can also show a quicker way to review entry pass usage across many clients without opening each booking one by one. Please do", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — there is a quicker way.\n\n\nInstead of opening each booking, you can review all entry pass credits in one list:\n\n\n\n\n- Go to Payments → Discounts → Credits\n\n\n- In the Credit types filter, select Entry pass\n\n\nThis view shows every entry pass credit across all clients in one table, including:\n\n\n\n\n- who created the credit\n\n- who redeemed it\n\n- when it was used\n\n- expiration date\n\n- whether it is still active or already used. \n\n\nFor remaining passes, you still open the client’s Orders → entry pass order, where you can see entries remaining and entries used. \n\n\nTip: you can also export the credits list to Excel if you want to review or audit pass usage offline.", "cited": ["Discounts | Zooza Help", "Entry pass — client view | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Are you looking at a different system? There is no Credits tab in Discounts?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You’re right to question that — the Credits tab is not always visible in the Discounts screen.\n\n\nIn Zooza, the Discounts page normally has these sections:\n\n\n\n\n- Discount codes\n\n- Discounts\n\n- Free sessions\n\n- Payment templates with discount \n\n\nThe Credits tab only appears when the system has credit records available. When it is present, you can filter by Credit types → Entry pass to see all entry pass credits in one list. \n\n\nIf you do not see the Credits tab, the reliable place to review passes is still the client record:\n\n\n\n\n- Go to Clients\n\n\n- Open the client profile\n\n- Open the entry pass order\n\n\nThere you can see entries used, entries remaining, and the expiration date. \n\n\nSo in practice:\n\n\n\n\n- No Credits tab → review passes from the client’s order.\n\n- Credits tab visible → you can filter for Entry pass credits there.\n\nIf you want, I can also show a quick way to audit entry pass usage across many clients without opening each order one by one.", "cited": ["Discounts | Zooza Help", "Entry pass — client view | Zooza Help", "Discounts and Sibling Pricing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Yes", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I'm glad to hear that was what you were looking for! If you have any more questions or need further assistance with reviewing entry pass usage or anything else, please feel free to ask. I'm here to help! 😊", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "how to update expiry dates for entry passes?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You cannot edit the expiry date of a purchased entry pass in the admin interface. The expiration field in the order is read‑only, so it can only be viewed, not changed. \n\n\nIf a client needs their pass expiry extended, the change must be requested through support and the order number is required so the expiry can be adjusted on the backend.\n\n\nFor future passes, you can set the validity period in the product configuration (for example 12 months from purchase). That setting applies to all future purchases of that pass.", "cited": ["Orders and Products FAQ | Zooza Help", "Products | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help with entry pass expiry dates, I’m here to assist, and I’m sorry for any confusion earlier. Would you like to share more about whether you need to update an existing pass or set the validity for future passes?", "cited": []}], "verdict": "gap", "vtitle": "Where an admin sees entry-pass usage and remaining entries — bot invented 'Credits and make-up sessions tab' and 'Payments → Discounts → Credits'; expiry not editable", "vnote": "Michal: admin sees passes on the booking detail → Credits. WRITTEN: pay-as-you-go-faq.md.", "cat": "payments"}, {"channel": "intercom", "id": "215475895999013", "date": "2026-09-14 07:38", "day": "2026-09-14", "human": true, "bucket": "HUMAN", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Template Editing\n\nHi!\n\nI would like to edit a template for the email text that gets sent out when you 'share the public link' in the 'send it by email' function. (See screenshot)\n\nI already tried to find it in Communication>Templates, but could not find the template text that is used for this function. \n\nCould you let me know where I can edit the email text that gets sent out with the public registration link for our courses?\n\nThank you!\nEmma (HDE Office in Linz)", "turns": [{"role": "customer", "who": null, "text": "Template Editing\n\nHi!\n\nI would like to edit a template for the email text that gets sent out when you 'share the public link' in the 'send it by email' function. (See screenshot)\n\nI already tried to find it in Communication>Templates, but could not find the template text that is used for this function. \n\nCould you let me know where I can edit the email text that gets sent out with the public registration link for our courses?\n\nThank you!\nEmma (HDE Office in Linz)", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Lieber Emma,\n\n\nIhr Ticket wurde erhalten. Der Zooza-Assistent wird sofort versuchen, Ihnen zu helfen — und ein Mitglied unseres Teams wird es ebenfalls persönlich überprüfen.\n\n\n— Zooza Support", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Diese Nachricht wurde gelöscht", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Diese Nachricht wurde gelöscht", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Emma, this is a system template which is not possible to change per account. Should you want to share such link with your custom wording, you might just copy the url and send it manually to selected recipients.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Emma,\n\n\njust checking in on our previous reply.\n\n\nDid that answer cover it, or is there anything still open on your side? Happy to help further.\n\n\nBest regards,\n​", "cited": []}], "verdict": "check", "vtitle": "Share-link email template is a fixed system template, not editable per company", "vnote": "Already in share-course-link.md. No change.", "cat": "comms"}, {"channel": "intercom", "id": "215475895957390", "date": "2026-09-14 07:35", "day": "2026-09-14", "human": true, "bucket": "HUMAN", "reask": 4, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": [], "q": "Dňa 2026-09-11 08:55 Tech from Zooza napísal(a):\n\n Pekný deň\n\n ceny \n\n \n\n              Ďakujem   \n\n S pozdravom\nEva Kleberc\n\nKid Genius\n\nŠtúrová 1\n903 01 Senec\n+421 917 091 617\nwww.kidgenius.sk\nFb: KID Genius Senec", "turns": [{"role": "customer", "who": "Eva Kleberc", "text": "Dňa 2026-09-11 08:55 Tech from Zooza napísal(a):\n\n Pekný deň\n\n ceny \n\n \n\n              Ďakujem   \n\n S pozdravom\nEva Kleberc\n\nKid Genius\n\nŠtúrová 1\n903 01 Senec\n+421 917 091 617\nwww.kidgenius.sk\nFb: KID Genius Senec", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "This conversation is likely related to an existing email conversation:\n\n\n\n  215475868453448\n\n\n\n\nA new conversation is created when a customer replies to an existing email conversation they're not a participant in or when they remove a recipient.Learn more here", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Eva. Dakujem za screenshoty a otazku. Chyba je v nastaveni. Na skupine ste urcili, ze ma mat 10 platenych terminov, ale ani jeden termin v skupine nie je oznaceny ako plateny. V principe ide o toto - System standardne povazuje za plateny kazdy termin. V momente, kedy mu ale na urovni skupiny predpisete, ze ma mat N platenych terminov, aplikacia sa \"prepne\" do rezimu, kedy ocakava, ze termin je oznaceny ako plateny. Termin sa da oznacit ako plateny pri jeho vytvarani (je tam taky checkbox na to) - Po jeho vytvoreni je potom vidno taku ikonku penazi, ktora indikuje ze tento termin je plateny. Staci aby ste teda urobili jednu z dvoch veci - bud oznacite 10 terminov v skupine a hromadnou zmenou im pridate priznak - plateny termin, alebo vojdete do nastaveni ceny skupiny a zrusite nastavenie 10 terminov na 0 platenych terminov.\n\n\nToto nastavenie sa v praxi pouziva v situacii, kedy potrebujete mat v skupine terminy, ktore nepodliehaju platbe.", "cited": []}, {"role": "customer", "who": "Eva Kleberc", "text": "Dňa 2026-09-11 11:40 Martin from Zooza napísal(a):", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Eva. Neprisla k screenshotom pribalena ziadna sprava. Aka je prosim otazka?\nDakujem,\n\n\nMartin", "cited": []}, {"role": "customer", "who": "Eva Kleberc", "text": "Dňa 2026-09-11 13:00 Martin from Zooza napísal(a):\n\n\nPekný deň, \n\n\n\n​\n\n\nvymazala som tých 10 termínov ako ste mi odporučili a tez pri registrácii mám cenu 83 160,- € prečo? Čo mám spraviť aby som pri registrácii mala cenu 990??? tak ako to je uvedné pri kurze\n\n\n\n​\n\n\nďakujem\n\n\n\n​\n\n\n-- \n​\n\n\nS pozdravom\nEva Kleberc\nKid Genius\nŠtúrová 1\n903 01 Senec\n+421 917 091 618\nwww.kidgenius.sk\nFb: KID Genius Senec\n​", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Aha uz rozumiem. Na screenshote je to vlastne vidno - Mate nastavenu cenu 990 za termin. Tym padom aplikacia pocita tuto cenu pre kazdy termin. Inymi slovami - do jednotkovej ceny ste dali celkovu cenu za kurz. Ak ma kurz mat 10 terminov a celkovo stat 990, potom v jednotkovej cene by malo byt cislo: 99 eur za termin", "cited": []}, {"role": "customer", "who": "Eva Kleberc", "text": "Dňa 2026-09-11 13:44 Martin from Zooza napísal(a):", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ospravedlnujem sa ale email prisiel prazdny, skusite prosim napisat este raz?", "cited": []}, {"role": "customer", "who": "Eva Kleberc", "text": "Dňa 2026-09-11 14:12 Martin from Zooza napísal(a):\n\n\nhm....ale ja to tak nechcem. Chcem aby cena za kurz bola 990 € ako to mám spraviť? Bez ohľadu na termíny, ktorých bude okolo 80 \n\n\n-- \n​\n\n\nS pozdravom\nEva Kleberc\nKid Genius\nŠtúrová 1\n903 01 Senec\n+421 917 091 618\nwww.kidgenius.sk\nFb: KID Genius Senec\n​", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Neviete nechat system vypocitavat platby bez toho aby to nemalo nadvaznost na terminy. Vypocitat jednotkovu sumu nie je problem aj ked je tych terminov 80. Jedina mozna cesta ak chcete ludi nechat platit postupne - v mesacnych platbach alebo v kvartalnych je mat suvis medzi cenou a terminmi. Inak system nebude vediet vypocitat zakaznikovi cenu po zaciatku kurzu.\n\n\nMate tieto tri moznosti\n\n\n\n\n- Nechat ludi platit 990 eur v jednej platbe - vtedy je jedno kolko terminov tam mate, pretoze system bude od vas pozadovat celu cenu za kurz a nie cenu za termin\n\n- Nechat ludi platit 990 eur v splatkach (mesacnych, kvartalnych...) za pouzitia kurzovneho - vtedy musite uvadzat jednotkovu cenu. Pre 80 terminov to bude 12,375 eura za termin. V pripade ak neviete v tejto chvili kolko tych terminov bude, mozete pouzit presne tu funkciu, ktoru sme uz rozoberali - platene terminy. V aplikacii si nahodite tie terminy, o ktorych uz viete ze v skupine budu - povedzme 80 - oznacite ich ako platene a na skupine uvediete ze ma mat 80 platenych terminov. Ak potom pridate do skupiny dalsich 5-6 terminov, tieto uz nebudu mat vplyv na cenu.\n\n- Nechat ludi platit Xeur v mesacnych platbach - cez clenske. Vtedy system tiez nezohladnuje terminy v zmysle celkovej ceny, ale tak ci onak budete potrebovat zadavat cenu za termin, aby system vedel vypocitat alikvotnu ciastku v pripade, ze niekto nastupi po zaciatku kurzu.\n\ns pozdravom\n\n\nMartin", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, \n\n\ndajte vediet, ci posledna sprava pomohla. Alebo mate este otvorene otazky k tejto teme. Dakujeme,", "cited": []}], "verdict": "check", "vtitle": "Billable sessions set to 10 but no session marked → price 0; then unit price 990 → 83,160 total", "vnote": "Martin's full explanation. Already covered: billable-sessions.md ('I set the number but nothing happened') and price-and-payment-setup.md (unit price vs total). No change.", "cat": "pricing"}, {"channel": "intercom", "id": "215475839703443", "date": "2026-09-14 06:56", "day": "2026-09-14", "human": false, "bucket": "D_assumed_with_kb", "reask": 4, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": ["Programme Settings | Zooza Help", "Booking FAQ | Zooza Help", "Booking form settings overview | Zooza Help", "Attendee selection on the booking form | Zooza Help"], "q": "nesprávne údaje pri viacerých registráciách z jedného zariadenia\n\nAhoj, zasa máme situáciu s prepísaním údajov: https://zooza.app/#registrations/535005 https://zooza.app/#registrations/535015 \n \n ​ \n \n Obe majú iný mail aj iného účastníka, ale opäť sa prepísali polia podľa druhej registrácie aj predchádzajúcej. Potrebujeme to nejak vyriešiť, lebo budeme mať takýchto registrácií asi veľa a každú potom upravujeme manuálne. Dá sa to nejak rýchlo fixnúť? Ďakujem ​", "turns": [{"role": "customer", "who": null, "text": "nesprávne údaje pri viacerých registráciách z jedného zariadenia\n\nAhoj, zasa máme situáciu s prepísaním údajov: https://zooza.app/#registrations/535005 https://zooza.app/#registrations/535015 \n \n ​ \n \n Obe majú iný mail aj iného účastníka, ale opäť sa prepísali polia podľa druhej registrácie aj predchádzajúcej. Potrebujeme to nejak vyriešiť, lebo budeme mať takýchto registrácií asi veľa a každú potom upravujeme manuálne. Dá sa to nejak rýchlo fixnúť? Ďakujem ​", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dear Michal,\n\n\nyour ticket  has been received. Zooza Assistant will try to help you right away — and a member of our team will personally review it too.\n\n\n— Zooza Support", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "mato vyriesi", "cited": []}, {"role": "customer", "who": "Michal Šiška", "text": "Ahoj, prosím dá sa s tým niečo robiť? A ako sa dá odstrániť z formuláru možnosť prihlásiť niekoho iného? Je to celé mätúce neviem ako by človek mal pochopiť, že ak registruje niekoho nového tak sa prepíšu staré údaje - nedáva to zmysel ani z pohľadu zákazníka. Mal by podľa mňa ostať vždy ten pôvodný ako klient a ten nový by sa pod neho mal zapísať ako účastník, ale toto je čistý zmätok čo nám to robí. Ďakujem moc", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno – túto časť formulára je možné zmeniť, ale nie je možné úplne odstrániť možnosť „prihlásiť niekoho iného“. Je to súčasť fungovania formulára. \n\n\nMáte však dve možnosti, ako to zjednodušiť:\n\n\n\n\n- \nVypnúť prihlásenie viacerých osôb naraz\nV programe: Programmes → Online Booking → Edit a vypnúť Allow multiple bookings for the programme.\nTým sa odstráni tlačidlo Add another person, takže klient môže registrovať len jednu osobu. \n\n\n- \nNechávať zapnuté, ale zjednodušiť formulár\nV Programmes → Additional Fields môžete nastaviť, že sa údaje zoberú len od registranta, nie od každého účastníka. \n\n\nTým sa zníži zmätok, pretože klient nevyplňuje údaje viacerých ľudí naraz.\n\n\nAk chcete, môžem vám ešte ukázať jeden trik, ako nastaviť formulár tak, aby bol pre klientov čo najviac jasný a aby sa vyhli tomuto „prepísaniu údajov“.", "cited": ["Attendee selection on the booking form | Zooza Help", "Booking FAQ | Zooza Help", "Booking form settings overview | Zooza Help", "Programme Settings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Chcem sa len uistiť, či ešte potrebujete pomoc s nastavením registračného formulára. Chcete, aby som vás spojil s ľudským agentom? Ak nie, rád pomôžem ďalej, keď upresníte, čo má formulár zobrazovať alebo ako má registrácia fungovať.", "cited": []}, {"role": "customer", "who": "Michal Šiška", "text": "podľa všetkého mám vypnuté povolenie viacerých regisrácií do kurzu", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I understand this situation is confusing, especially since multiple registrations are already disabled. Would you like me to connect you with a human agent? Or if you prefer, you can provide more details and I’ll do my best to assist you further.", "cited": []}, {"role": "customer", "who": "Michal Šiška", "text": "áno", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I will connect you with someone from our team shortly. Meanwhile, could you please share any additional details about the issue? This will help them assist you more efficiently.", "cited": []}, {"role": "customer", "who": "Michal Šiška", "text": "všetko už som napísal vyššie", "cited": []}], "verdict": "product", "vtitle": "Registration data overwritten across two registrations from one device — 'mato vyriesi'", "vnote": "Bug. Not KB.", "cat": "bookings"}, {"channel": "intercom", "id": "215475916316292", "date": "2026-09-14 02:39", "day": "2026-09-14", "human": false, "bucket": "D_assumed_with_kb", "reask": 8, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Blocks (Term Segments) FAQ | Zooza Help", "Make-up Sessions FAQ | Zooza Help", "Billing and invoicing | Zooza Help", "Attendance and Catch-up Classes FAQ | Zooza Help", "Customizing widgets | Zooza Help", "Booking Widget FAQ | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Capacity vs extra capacity — who can take which seat | Zooza Help"], "q": "Explain the number on here", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "Explain the number on here", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Those numbers show how many children are booked vs the class capacity.\n\n\nExample from your screenshot: 7 | 20\n\n\n\n\n- \n7 – how many children are currently enrolled in that class.\n\n- \n20 – the maximum capacity of the class.\n\nSo it means 7 children are booked out of 20 possible places. \n\n\nThe other numbers on the tile show additional counts for that specific session (for example how many are booked into that exact session, waiting list, etc.). You can hover over the numbers in the calendar to see a more detailed breakdown.\n\n\nIf you want, I can also explain what the other numbers in that row represent.\n\n\n\nSource:\nAttendance and Catch-up Classes FAQ | Zooza Help", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "so what is the 13", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "The 13 is the number of children booked into that specific session (including trials). \n\n\nSo in your example:\n\n\n\n\n- \n7 | 20 → 7 children enrolled in the whole class out of 20 capacity\n\n- \n13 → 13 children booked into that exact session on that date\n\nThe session number can be higher than the class-enrolled number because it counts everyone attending that single session, including trial bookings.\n\n\nIf you hover over the numbers in the calendar, you can see a more detailed breakdown of those counts.\n\n\n\nSource:\nAttendance and Catch-up Classes FAQ | Zooza Help", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help understanding the calendar numbers, I’m here to help. Would you like to share which other number you’d like explained?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "so what about the baby bells 16/20/10", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "For Baby Bells: 16 | 20 | 10\n\n\n\n\n- \n16 – number of children enrolled in the whole class.\n\n- \n20 – the class capacity (maximum places).\n\n- \n10 – how many children are booked into that specific session on that date (including trials). \n\n\nSo in this example, 16 children are enrolled in the class overall, but only 10 are attending this particular session on that day.\n\n\nIf you hover over the numbers in the calendar, you can also see a more detailed breakdown of those counts.\n\n\n\nSource:\nAttendance and Catch-up Classes FAQ | Zooza Help", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "so how is there 16 enrolled for whole class but only 10 on the session", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Good question — this happens because class enrolment and session attendance are counted differently.\n\n\n\n\n- \n16 = children enrolled in the whole class. They hold a place in the class overall.\n\n- \n20 = the class capacity.\n\n- \n10 = how many are actually booked into this specific session on that date. \n\n\nSo the other 6 children are still enrolled in the class, but they are not attending this particular session (for example they may be absent, cancelled that session, or attending a different date). \n\n\nWhen someone cancels or misses a single session, they still remain enrolled in the class, so the class enrolment number stays the same. \n\n\nIf you want, I can also explain how this affects waiting lists and free spots on a session.", "cited": ["Attendance and Catch-up Classes FAQ | Zooza Help", "Customizing widgets | Zooza Help", "Make-up Sessions FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Does this clarify things?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "ok so will it allow the enrolled number to go above 20 or not as some people may be booked for trials in the future", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Short answer: no — the enrolled number cannot go above the class capacity.\n\n\n\n\n- \nClass capacity (20) is the maximum number of participants allowed in the class. The booking form only checks this number, so it prevents the class from being oversold. \n\n\n- \nTrial bookings still count toward that capacity while they are active. They hold a spot in the class until they are converted or removed. \n\n\n- Because of that, the enrolled count can never exceed 20, even if some of those bookings are trials for future sessions. \n\n\nSo in your example:\n\n\n\n\n- 16 enrolled → still under the 20 limit\n\n- 10 attending this session → the others are enrolled but not attending this specific date\n\nIf you want, I can also explain how to reserve seats specifically for trials so they don’t take paying spots.", "cited": ["Capacity vs extra capacity — who can take which seat | Zooza Help", "Booking Widget FAQ | Zooza Help", "Blocks (Term Segments) FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "ok", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I'm glad I could assist you! If you have any more questions or need further clarification, please feel free to ask. I'm here to help! 😊", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "moved someone for waiting list to trial", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "how do I create invoice", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can create an invoice directly from the booking.\n\n\nSteps:\n\n\n\n\n- Open the booking detail.\n\n- Find the Payments tile.\n\n- Click Show payments.\n\n- In the Invoices section, choose the invoice profile.\n\n- Click Generate invoice.\n\nThe invoice is created immediately and emailed to the client. \n\n\nTip: avoid clicking Generate invoice twice, because it will create a duplicate invoice (even a €0 one if there is no balance).", "cited": ["Payments and Billing FAQ | Zooza Help", "Billing and invoicing | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help creating the invoice or managing the trial booking, I’m here to help. Would you like to share what you’re trying to resolve or understand next?", "cited": []}], "verdict": "verify", "vtitle": "Calendar tile numbers 16 | 20 | 10 — bot guessed", "vnote": "No KB text explains the calendar tile figures; bot invented 'hover for breakdown' and 'trials count toward capacity'. Michal: what are the three numbers? Good gap once confirmed.", "cat": "programmes"}, {"channel": "intercom", "id": "215475919387841", "date": "2026-09-13 15:56", "day": "2026-09-13", "human": true, "bucket": "HUMAN", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "(no client message)", "turns": [{"role": "human", "who": "Tech Support", "text": "Hi Anna,\n\n\n\n\n\nFor Emma Kehdi,,,, I checked the booking and from what I can see it currently looks like a normal enrolled booking with an outstanding balance. I’m not fully sure what you want the final result to be there. https://asia.zooza.app/#registrations/1625\n\n\n\n\n\nShould the trial payment be moved across to this Autumn booking, or should the customer still pay the Autumn amount separately?\n\n\n\n\n\nFor Suzanne Burnside — this one currently looks balanced onour side. It shows as paid with a zero balance. https://asia.zooza.app/#registrations/711 \n\n\n\n\n\nSo before we change anything, can you please tell me what looks wrong to you or what you expected to see differently?\n\n\n\n\n\nFor both of these, I need to understand the expected final outcome first, otherwise I risk changing something that is already technically correct or balanced.\n\n\n\n\n\nOriginal messages:\n\n\nEmma Kedhi - she was enrolled as trial but then paid and I coundlt transfer the booking or the amount so now its all mixed up and I cannot correct it\n\n\nSuzanne Burnside - same issue. If you could just explain a step by step on how to make these payment balance - I am stumped !", "cited": []}], "verdict": "client", "vtitle": "Turtle Tots payment corrections (Kehdi, Burnside)", "vnote": "Client-specific.", "cat": "payments"}, {"channel": "intercom", "id": "215475919358919", "date": "2026-09-13 15:53", "day": "2026-09-13", "human": true, "bucket": "HUMAN", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "(no client message)", "turns": [{"role": "human", "who": "Tech Support", "text": "Hi Anna,\n\n\nWe received the forwarded message with the cases you mentioned, so I’ll reply to them one by one.\n\n\nPlease feel free to reply to this email if you have any questions or if anything is still unclear.\n\n\nFor Dia Mary Hadley,,, I checked this one. The cancelled class refund and the discount have been mixed together. https://asia.zooza.app/#registrations/727/payments\n\n\n\n\n\nThe clean setup should be:\n\n\nOriginal Autumn amount: 1,617.00 AED\nMinus cancelled class: 115.50 AED\nSo the total charge should be: 1,501.50 AED\n\n\nThen the discount code should remain as: 161.70 AED.\n\n\n\n\n\nThe Stripe payment and the refund are already there, so please do not add any extra correction payment.\n\n\nTo fix it, please set:\n\n\nTotal charge: 1,501.50 AED\nDiscount: 161.70 AED\n\n\nAfter that, it should balance.\n\n\n\n\n\nOriginal message:\n\n\nDia Marie Hadley - the payments dont make sense again - same as the one we checked today. I cant make it add up no matter what I try!", "cited": []}], "verdict": "client", "vtitle": "Turtle Tots payment corrections (Dia Hadley)", "vnote": "Client-specific.", "cat": "payments"}, {"channel": "intercom", "id": "215475918415923", "date": "2026-09-13 14:56", "day": "2026-09-13", "human": false, "bucket": "D_assumed_with_kb", "reask": 1, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Types of bookings | Zooza Help", "Bookings | Zooza Help", "Registration statuses — what each one means | Zooza Help"], "q": "What is difference between paid and no debt?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "What is difference between paid and no debt?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Good question — they sound similar but mean different things.\n\n\n\n\n- \nPaid → the client has fully paid the amount owed for that booking. The balance is €0 after payment. \n\n\n- \nNo debt → the booking is completely free. Nothing was ever owed and nothing will ever be owed. The payments section is hidden because there is nothing to pay. \n\n\nSo in short:\n\n\n\n\n- \nPaid = it had a price, and it’s now fully paid.\n\n- \nNo debt = it never had a price at all.\n\nIf you want, I can also explain when you would typically use No debt in practice (for example trials or free sessions).", "cited": ["Bookings | Zooza Help", "Registration statuses — what each one means | Zooza Help", "Types of bookings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I hope this clarified the difference between “Paid” and “No debt”; I’m here if you need any further help. Would you like to share more about what you’re trying to understand?", "cited": []}], "verdict": "check", "vtitle": "Paid vs No debt", "vnote": "Spec widgets 2026-05-18; registration status FAQ covers. Fine.", "cat": "bookings"}, {"channel": "intercom", "id": "215475892308124", "date": "2026-09-13 12:05", "day": "2026-09-13", "human": true, "bucket": "HUMAN", "reask": 7, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": ["Trial sessions | Zooza Help", "Manage trial bookings — reschedule, convert, and close | Zooza Help", "Programme Automations | Zooza Help", "Programme Settings | Zooza Help", "Trial Classes FAQ | Zooza Help", "Automated notifications overview | Zooza Help"], "q": "Does the system automatically remove trials when lost", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "Does the system automatically remove trials when lost", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes. The system can automatically mark a trial as “Trial Lost.”\n\n\n\n\n- If no action is taken after the trial session (no conversion, no attendance mark, no reschedule), the system waits the configured number of days.\n\n- After that timeout, it automatically changes the status to Trial Lost.\n\n- This setting is controlled in Programme → Settings → Trial → Auto‑lost after X days. \n\n\nWhen a trial becomes Lost, the reserved seat is released and automated follow‑up messages stop. The booking remains in the history.\n\n\nIf you want, I can also explain how to adjust the number of days before a trial is marked lost.", "cited": ["Manage trial bookings — reschedule, convert, and close | Zooza Help", "Programme Settings | Zooza Help", "Trial Classes FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "Yes that’s all", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I'm glad I could assist you! If you have any more questions or need further help, please feel free to ask. I'm here for you! 😊", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "why haven't the trials booked from last week been removed, they are still holding a place", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Most likely the auto‑lost timeout hasn’t passed yet.\n\n\nZooza only automatically changes a trial to Trial Lost after the number of days set in Programme → Settings → Trial → Auto‑lost after X days. Until that timeout passes, the trial stays active and continues holding the seat. \n\n\nAnother common reason is the “Reserve seat for trial attendee” setting. When this is enabled, the seat stays held after the session until the client enrols or the trial is manually marked Trial Lost. \n\n\nSo if the trials are from last week, it usually means:\n\n\n\n\n- the auto‑lost days haven’t expired yet, or\n\n- the seats are being held by the trial setting.\n\nIf you want, I can also show you where to check both settings quickly.", "cited": ["Manage trial bookings — reschedule, convert, and close | Zooza Help", "Trial sessions | Zooza Help", "Programme Settings | Zooza Help", "Trial Classes FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "how do I check the automations", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can check the trial automations inside the programme settings.\n\n\nSteps:\n\n\n\n\n- Go to Programmes\n\n\n- Open the programme you’re using\n\n- Click Automations\n\n\n- Select Trials\n\n\nThere you’ll see the trial workflow and can review or edit things like:\n\n\n\n\n- enrolment link sent after the trial\n\n- first and second follow‑up emails\n\n- automatic change to Trial Lost after a set number of days\n\n- notification when a trial is marked lost. \n\n\nYou can also check the automation status in Programme → Settings → Trial → Automation Settings to confirm it’s activated. \n\n\nIf you want, I can also show you where to see the exact timeline for a specific trial booking.", "cited": ["Trial Classes FAQ | Zooza Help", "Programme Automations | Zooza Help", "Automated notifications overview | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "I think I need to speak to someone", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Certainly, I will connect you with someone from our team. Meanwhile, could you please share any additional details about your issue to help them assist you more efficiently?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "I cant seem to see why the automations aren't working", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "I have a load of trials booked last week and need them removing from the system", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Samantha, the system will clear up those trials for you based on the settings. Can you please point me to a specific booking that you think should already be cleaned up so that I can have a look why it was not?", "cited": []}], "verdict": "check", "vtitle": "Trials not auto-cleared — Martin asks for a specific booking", "vnote": "Bot answer from KB (auto-lost after N days, reserve seat) is consistent with trials FAQ. Needs a specific case; nothing to write.", "cat": "trials"}, {"channel": "intercom", "id": "215475916868809", "date": "2026-09-13 11:33", "day": "2026-09-13", "human": false, "bucket": "D_assumed_with_kb", "reask": 3, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Introduction to widgets | Zooza Developer Docs", "Payment templates creation | Zooza Help", "Price and payment setup | Zooza Help", "Customizing widgets | Zooza Help", "Booking Widget FAQ | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Booking form settings overview | Zooza Help"], "q": "Ak chcem vytvorit platobnu sablonu kde v kurze je 36 terminov a chcem kvartalne platby mat so sumou 126 eur bezohladu na základnu cenu a hlavu ako to vytvorim", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Natália Varkondová", "text": "Ak chcem vytvorit platobnu sablonu kde v kurze je 36 terminov a chcem kvartalne platby mat so sumou 126 eur bezohladu na základnu cenu a hlavu ako to vytvorim", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Toto je dosť jednoduché – platobná šablóna neobsahuje sumu. Určuje len kedy a ako často sa platí. \n\n\nPostup:\n\n\n\n\n- Vytvorte šablónu v Settings → Billing & Payments → Payment schedule templates.\n\n- Vyberte Periodic prepaid payment.\n\n- Ako frekvenciu nastavte Quarterly (kvartálne). \n\n\nCena kurzov (napr. 126 €) sa nastaví priamo v kurze v Settings → Price and Payment.\n\n\nZooza potom túto sumu automaticky rozdeli podľa frekvencie šablóny (napr. kvartálne platby). \n\n\n💡 Tip: ak chcete, môžem vám ukázať aj ako nastaviť kurz s 36 lekciami tak, aby sa kvartálne platby zobrazovali správne aj pre rodičov pri rezervácii.", "cited": ["Payment templates creation | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Price and payment setup | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak potrebujete s nastavením kurzu alebo kvartálnych platieb ešte pomôcť, som vám k dispozícii. Chcete doplniť, čo presne potrebujete nastaviť alebo objasniť?", "cited": []}, {"role": "customer", "who": "Natália Varkondová", "text": "je mozne aby v prihlasovacich fomularoch na stranke neukazovalo kolko % je zlava?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno, je to možné.\n\n\nV samotnom nastavení formulára nie je prepínač, ktorý by skryl zobrazenie percenta zľavy. Ak chcete túto časť skryť, musí sa to urobiť pomocou custom CSS na vašej webovej stránke. Widgety sa dajú prispôsobiť tak, že pomocou CSS skryjete konkrétne elementy, ktoré nechcete zobraziť. \n\n\nTento postup sa používa aj na skrytie iných častí formulára, ktoré nie sú priamo nastaviteľné v aplikácii. \n\n\n💡 Ak chcete, môžem vám ukázať aj typický CSS prístup na skrytie elementov v Zooza widgetoch.", "cited": ["Introduction to widgets | Zooza Developer Docs", "Booking Widget FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Natália Varkondová", "text": "prosim napis postup", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno – tento element sa nedá skryť priamo v aplikácii. Používa sa custom CSS na vašej webovej stránke. \n\n\nPostup:\n\n\n\n\n- Na vašej webovej stránke otvorte CSS súbor (alebo miesto, kde pridávate custom CSS).\n\n- Pripojte CSS pravidlo, ktoré skryje daný element.\n\n- CSS selektor musí začínať triedou .zooza, pretože widget má tento wrapper. \n\n\nPríklad:\n\n\n.zooza .discount-percentage {\n  display: none;\n}\nTento kód skryje element s triedou discount-percentage (napr. zobrazenie percenta zľavy).\n\n\nDôležité:\n\n\n\n\n- CSS sa nepridáva v Zooza admin, ale priamo na webe, kde je widget vložený. \n\n\n- Widget sa dá takto prispôsobiť – napr. skryť elementy, zmeniť farby, layout atď.\n\n💡 Ak chcete, môžem vám ukázať aj ako nájsť správny CSS selektor pre konkrétny element vo formulári (je to rýchly postup).", "cited": ["Introduction to widgets | Zooza Developer Docs", "Booking Widget FAQ | Zooza Help", "Customizing widgets | Zooza Help", "Booking form settings overview | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Bolo to užitočné?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak potrebujete s nastavením CSS alebo skrytím percenta zľavy ešte pomôcť, som vám k dispozícii. Chcete doplniť, na ktorej stránke máte widget vložený alebo čo presne potrebujete upraviť?", "cited": []}], "verdict": "verify", "vtitle": "Fixed €126 quarterly regardless of unit price → membership-type template? Hide discount % via CSS '.zooza .discount-percentage'", "vnote": "Bot's CSS selector is invented. Not written.", "cat": "pricing"}, {"channel": "intercom", "id": "215475915611580", "date": "2026-09-13 05:24", "day": "2026-09-13", "human": false, "bucket": "D_assumed_with_kb", "reask": 4, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Manage trial bookings — reschedule, convert, and close | Zooza Help", "Managing client attendance — admin | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Bookings | Zooza Help", "A client wants to move to a later date | Zooza Help"], "q": "how can I change the date of a trial booking", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "how can I change the date of a trial booking", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can’t directly change the date of a trial booking. Instead, you reschedule it by hiding the old session and adding a new one.\n\n\nSteps:\n\n\n\n\n- Open the trial booking.\n\n- Go to Attendance.\n\n- Click Hide on the original session (this removes it from reports and the client’s view).\n\n- Click Book a session and select the new date.\n\nThe booking stays as Trial started, and the client is notified of the new date. This keeps the trial automation working correctly.", "cited": ["A client wants to move to a later date | Zooza Help", "Manage trial bookings — reschedule, convert, and close | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "both dates are showing in attendance and no option to cancel or hide the session that has past. Does this work if the trial date has already past?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — it still works even if the trial date has already passed.\n\n\nThe process is the same:\n\n\n\n\n- Open the booking → Attendance\n\n\n- \nHide the original session\n\n- Click Book a session and select the new date\n\nHiding simply removes that attendance record from reports and the client’s view. It does not cancel the booking, and the trial status stays Trial started. \n\n\nAlso, attendance can be changed for past sessions at any time, so the date being in the past does not block the reschedule. \n\n\nIf you’re seeing both dates, it usually means the new session was added but the old one hasn’t been hidden yet.", "cited": ["Manage trial bookings — reschedule, convert, and close | Zooza Help", "A client wants to move to a later date | Zooza Help", "Managing client attendance — admin | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "There is no hide option showing", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "The Hide option should appear in the Attendance section of the booking. It’s the button used to remove the original session from reports and the client’s view when rescheduling a trial. \n\n\nIn the Attendance tab, each session row normally shows action buttons like Will attend, Attended, Cancelled, Did not attend, and Hide. \n\n\nIf you’re on the booking’s Attendance tab and still don’t see Hide, it may be a display issue. Could you share:\n\n\n\n\n- a screenshot of the Attendance section\n\n- the page URL if you’re on the booking detail\n\nThat will help narrow down why the button isn’t appearing.", "cited": ["Manage trial bookings — reschedule, convert, and close | Zooza Help", "Bookings | Zooza Help", "Managing client attendance — admin | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "I hid the old session and left the new one but still the date has not changed on the bookings view", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "This is usually just a display delay.\n\n\nAfter you hide the old session and add the new one, the booking list may still show the old date until the page refreshes. Zooza uses browser caching, so the view doesn’t always update instantly. \n\n\nTry a quick refresh:\n\n\n\n\n- Mac: Cmd + R\n\n- Windows: Ctrl + R\n\nThen reopen the booking list and check again.\n\n\nThe reschedule itself is correct once you’ve hidden the original session and booked the new date. \n\n\nIf it still shows the old date after a refresh, let me know and we can check the next step.", "cited": ["Manage trial bookings — reschedule, convert, and close | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help with the trial booking date display, I’m here to assist. Would you like to share more about what you see after refreshing the bookings view?", "cited": []}], "verdict": "verify", "vtitle": "Reschedule a trial: Hide on old session + Book a session — client saw no Hide option for a past session", "vnote": "KB manage-trial-bookings says Hide; client could not see it for a past date. Michal: is Hide available on
