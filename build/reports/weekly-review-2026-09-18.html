urces": [], "q": "Hi both,\n\n\nApologies - I've hit another snag that neither I nor Claude can solve.\n\n\nWe received 2 bookings for Friday Club before the programme was set up correctly. Its was for siblings Bettina and Beanie Barnett from Misty Barnett.\n\n\nI've tried following the ai support and Claude's instructions but the passes I've tried to add to the booking is just creating more balance as I can't check them as paid.\n\n\nI need to assign x12 entry passes to both childrens bookings whilst ensuring the booking balance is AED0 as she has already paid.\n\n\nAny ideas how I can manage this one before I create even more mess?\n\n\nThanks\n\n\n\nTommy Wingrove\nFounder | Get Set Go Kids\n\n\nEarly years sports & movement programmes for children aged 1-6yrs \n\nHelping children build confidence through movement \nConfidence • Fundamentals • Fun \n\n\n\n\ntommy@getsetgokids.com\nwww.getsetgokids.com\n\n\n\nInstagram | Facebook", "turns": [{"role": "customer", "who": "TOMMY WINGROVE", "text": "Hi both,\n\n\nApologies - I've hit another snag that neither I nor Claude can solve.\n\n\nWe received 2 bookings for Friday Club before the programme was set up correctly. Its was for siblings Bettina and Beanie Barnett from Misty Barnett.\n\n\nI've tried following the ai support and Claude's instructions but the passes I've tried to add to the booking is just creating more balance as I can't check them as paid.\n\n\nI need to assign x12 entry passes to both childrens bookings whilst ensuring the booking balance is AED0 as she has already paid.\n\n\nAny ideas how I can manage this one before I create even more mess?\n\n\nThanks\n\n\n\nTommy Wingrove\nFounder | Get Set Go Kids\n\n\nEarly years sports & movement programmes for children aged 1-6yrs \n\nHelping children build confidence through movement \nConfidence • Fundamentals • Fun \n\n\n\n\ntommy@getsetgokids.com\nwww.getsetgokids.com\n\n\n\nInstagram | Facebook", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Sorry,\n\n\nQuestions are coming thick and fast...\n\n\nRegarding automated Templates...\n\n\nFollowing our call yesterday, we decided a Session Notification was automatically delivered to all those registered for the session the next day.\n\n\nThe Session Reminder was shared with those that hadn't booked in that programme?\n\n\nI've created a new copy / variation of the session notification but am unable to do the same for the session reminder? It seems this template is not specific to any programme in particular?\n\n\nI was looking at sending an email to all those enroilled in the Friday Club but who hadn't booked / bought an entry pass for that week? Is this even possible?\n\n\nOr will the Session Notification be sent to all those enrolled in the programme regardless as to whether they have booked a specific session that week?\n\n\nI'm trying to work out the best way to automate a weekly message either encouraging them to book, or cancel if they are no longer attending.\n\n\nThanks\n\n\nTommy Wingrove\n\n\nFounder | Get Set Go Kids\n\n\nEarly years sports & movement programmes for children aged 1-6yrs \nHelping children build confidence through movement \nConfidence • Fundamentals • Fun \n​\n\n\n\ntommy@getsetgokids.comwww.getsetgokids.com Instagram | Facebook", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Tommy,\n\n\n\n\n- No there is currently only one single version of the Session reminder. That email can be customised just per company not per programme.\n\n- 13 Session reminders were sent in total so far. 6 for yesterday. You can get a quick glance on whether emails were sent on reports' dashboard at the very bottom.\n\n- Session notification is sent to everyone with the list of sessions that are available to book for them - in other words if I booked for friday session but there is no more upcomming sessions that I could book I should not get it.\n\nThere might be adjustments you may want in regard of the session notifications and the mechanics how and to whom it is sent so if you have some comments regarding this, please let me know:)", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Hi both,\n\n\nJust following up on this - is there a way I can resolve the booking manually? I need to add entry passes to a booking so they can schedule sessions.\n\n\nFor some reason any issues we are encountering is with the Pay-As-You-Go Friday Club bookings.\n\n\nWe've had a missed sibling discount, missing entry passes and issues booking their sessions. I've never actually been able to complete the booking process on my own device without a wrong price being displayed?\n\n\nI'm not sure if there is an easier way to manage this programme? The entry pass logic is great for what I'd like to achieve but if the parents can't or won't use it for whatever reason maybe we can look at a different solution?\n\n\nI'm not sure if there is an option to prevent any booking being made without payment also? I'm not sure how or why parents are booking but then missing the payment stage?!\n\n\nLets discuss this tomorrow anyway.\n\n\nThanks!\n\n\nTommy Wingrove\n\n\nFounder | Get Set Go Kids\n\n\nEarly years sports & movement programmes for children aged 1-6yrs \nHelping children build confidence through movement \nConfidence • Fundamentals • Fun \n​\n\n\n\ntommy@getsetgokids.comwww.getsetgokids.com Instagram | Facebook", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Tommy,\n\n\nif you need to add new entry passes to an existing booking there are two ways to do that:\n\n\n1) parents can purchase them directly from the customer portal\n\n\n2) you can add that manually - Just navigate to the booking and on the right hand side - you will see a products card from which you can create new order for that booking. Since you collect money via card payments - parent would still need to navigate to customer portal and pay right there.\n\n\n\n\n\nAs for the sibling discount - not sure whether this is for the friday club but I don't think that sibling discount is available for this type of class.\n\n\n\n\n\nPrice being wrong on your device - Lets discuss this tomorrow. I will need to see your screen. And lastly - the booking itself can happen without the payment purely because the payment follows the booking creation. In other words - in order to be able to pay for a booking that booking needs to exist. This is same as when you're shopping on amazon - you create a booking and then you get send to a payment and if your payment fails for any reason that booking exists in their system so that you have an option to change a card or pay in a different way without re-ordering the same items again. So the very existence of a booking without payment is not a problem but we need to see whether this is systemic - e.g. we need to take action - or just life. You've had issues on your website with the https certificate - which is one of the reason why the payment could not be completed - but that is already sorted I believe.\n\n\n\n\n\nI'm confident that we'll resolve this. But on your point of having an alternative solution - there are really only two options:\n\n\n\n\n- Parents opt in - the current pay as you go model\n\n- Parents opt out - the regular full registration courses\n\nOpt in obviously requires more maintenance from the parent perspective, while opt out model means that the money aspect is harder to manage on your end and probably classes can't be paid in advance if you want to charge only for attended sessions. So I still believe that the opt in is better solution going ahead.\n\n\n\n\n\nLooking forward talking to you tomorrow. \n\n\nMartin", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Hi Martin,\n\n\nThanks for getting back to me.\n\n\nWe can take a look at this tomorrow also.\n\n\nThe passes in question were paid for before the system was set up properly (my fault) as I bumbled my way through. Payment has been made and received - I just need to add passes at zero fees to her account if at all possible?\n\n\nFor the sibling discount, I set this up for all programmes and it has been applied on other Friday Club bookings. Otherwise I'd like to understand how customers can use discount codes so I can share manually.\n\n\nUnderstood about the payment system - I wasn't sure whether there was a way to navigate around receiving a booking confirmation requesting payment when paymentisn't made? We also had an instance that payment wasn't made or successful this morning but a payment confirmation was sent?\n\n\nI'm also confident this can all be resolved, however, as it isn't working on my screen I'm always dubious whether it is user or system error when people are telling me it's not working.\n\n\nI'll try and put a list of our current points together before we catch up tomorrow to speed the process along a little.\n\n\nSpeak then and thanks for your patience as always.\n\n\nCheers\n\n\nTommy Wingrove\n\n\nFounder | Get Set Go Kids\n\n\nEarly years sports & movement programmes for children aged 1-6yrs \nHelping children build confidence through movement \nConfidence • Fundamentals • Fun \n​\n\n\n\ntommy@getsetgokids.comwww.getsetgokids.com Instagram | Facebook", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "I see. So this process is little bit cumbersome although we're currently working on improving it but that update is not ready yet.\n\n\n1) navigate to booking and hit the buy button here:\n\n\n2) You need to tick the payment method option and OK. This will create an order for you\n\n\n3) Based on the product configuration this should add all mandatory items to the order and link the order to that booking.\n\n\nTwo things may happen at this point:\n\n\na) Either you created an order for a product where the entrance vouchers have been mandatory - system will automatically add those to the order\n\n\nb) You created an order for a product where in the booking form Parent would choose between the options - you as admin won't choose. You have to go to the order and add the entrance pass to that order. This is for example your order:\n\n\nYou would hit the Add item to order button - and proceed through the wizard.\n\n\n\n\n\n4) Last thing would be to clear that order - You can simply go to the booking and hit the Add Payment to mark that the customer already paid. All entry passes will be generated at this point and released for parent to be used.\n\n\n\n\n\nCan you please send over that booking or email? I can check what happened there but I really can't see a way how a payment confirmation would be sent without a payment.\n\n\n\n\n\nTo be honest, I think it is always a mix of things - You learning new tool - still not fully trusting it because you are just learning it and at the same time parents are navigating this for the first time. Combined with the fact that you opted for one of the most complicated models available - I think it is pretty natural that you experience difficulties. But I believe that once we get the ball rolling it will get better.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Tommy, here's the spreadsheet real quick: https://docs.google.com/spreadsheets/d/1FJauJlre8pC758sY07oz3VfU8DUGMWCruMtOr57KI9M/edit?usp=sharing\n\n\n\n\n\nPlease let me know when you're finished:)\n\n\nAll the best\n\n\nMartin", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Thanks Martin,\n\n\nThat was really helpful today - appreciate the lesson!\n\n\nI've attached the sheet here as the Google Doc was view only and wouldn't let me request access.\n\n\nYou'll see I've removed any promo offers as from what I've learnt this week, parents will book anyway - the 5 session and 2 session options will suffice - I will then use Discount Codes for any special cases or special offers / fire sales moving forward.\n\n\nI'm sure the figures I've included are easy enough - if everything makes sense then please go ahead and set this up whenever you have time.\n\n\nThanks! \n​\n\n\nTommy Wingrove\n\n\nFounder | Get Set Go Kids\n\n\nEarly years sports & movement programmes for children aged 1-6yrs \nHelping children build confidence through movement \nConfidence • Fundamentals • Fun \n​\n\n\n\ntommy@getsetgokids.comwww.getsetgokids.com Instagram | Facebook", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Thank you tommy, for some reason the attachment did not came through, can you please fwd it to martin@zooza.online directly? Thank you very much. \n\n\nAll the best,\n\n\nMartin", "cited": []}], "verdict": "gap", "vtitle": "PAYG: adding entry passes to an existing booking; session reminder is per-company; booking exists before payment", "vnote": "Michal: session reminder CAN be per programme (KB automated-notifications.md is right). Entry-pass steps written into PAYG FAQ.", "cat": "programmes"}, {"channel": "intercom", "id": "215475895972723", "date": "2026-09-11 13:26", "day": "2026-09-11", "human": false, "bucket": "D_assumed_with_kb", "reask": 4, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Manage trial bookings — reschedule, convert, and close | Zooza Help", "Trial Classes FAQ | Zooza Help", "Importing bank payments via CSV | Zooza Help", "Payment Pairing for Bank Transfers & Direct Debit | Zooza Help", "Transfer and Copy FAQ | Zooza Help", "Inbound payments — setup and pairing | Zooza Help", "Inbound payments — technical reference | Zooza Help", "A client wants to move to a later date | Zooza Help"], "q": "mam nastavene automaticke parovanie platieb s fio bankou, ale z nejakeho dovodu to na nahodu niektore platby nesparovalo, ako to viem dodatocne riesit? popis mi moznosti detailne, tak aby nedoslo k duplicitnemu nacitaniu platieb", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Jana Gerekova", "text": "mam nastavene automaticke parovanie platieb s fio bankou, ale z nejakeho dovodu to na nahodu niektore platby nesparovalo, ako to viem dodatocne riesit? popis mi moznosti detailne, tak aby nedoslo k duplicitnemu nacitaniu platieb", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak sa platba z Fio banky nesparovala automaticky, môžete ju dodatočne spárovať ručne bez rizika duplicitného načítania.\n\n\n1. Nájdite nepárované platby\n\n\n\n\n- Prejdite do Platby → Vyrovnanie platieb.\n\n- Filtrujte stav Nepárované (Unpaired).\nTieto platby prišli, ale systém ich nedokázal automaticky spárovať. \n\n\n2. Spárujte ich ručne\n\n\n\n\n- Otvorte konkrétnu platbu.\n\n- Vyberte správnu registráciu / objednávku.\n\n- Potvrďte spárovanie.\nPlatba sa zapíše na rezerváciu a stav sa zmení na Spárované (Paired).\n\n3. Prečo sa nepárovala automaticky\n\n\nV detaili platby nájdete sekciu Pairing process summary, ktorá ukáže presný dôvod, napr.:\n\n\n\n\n- nesprávny variabilný symbol,\n\n- rezervácia bola zrušená,\n\n- suma je väčšia ako zostatok,\n\n- systém mal nízku istotu pri párovaní. \n\n\n4. Ak je to duplikát\n\n\n\n\n- jednoducho zvolte Ignorovať (Ignore).\nDuplikát sa tak nezaeviduje ako platba.\n\nDôležité pre predchádzanie duplicitám\n\n\n\n\n- nepárované platby neimportujte znovu z banky, ak už sú v zozname,\n\n- importujte ich iba raz (napr. CSV), pretože opakovaný import ich zapíše dvakrát. \n\n\n✅ Praktický tip: pravidelne kontrolujte aj filtr Ignorované, pretože AI občas označí skutočnú platbu za duplikát a tú je možné dodatočne spárovať.\n\n\nAk chcete, môžem vám tiež ukázať najčastejší dôvod, prečo Fio platby zostávajú nepárované a ako ich do budúcna minimalizovať.", "cited": ["Inbound payments — setup and pairing | Zooza Help", "Payment Pairing for Bank Transfers & Direct Debit | Zooza Help", "Inbound payments — technical reference | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Jana Gerekova", "text": "platby do fio prisli ale v zooze nie su medzi sparovanymi - toto je problem, riesenie vyssie je jednoduche to poznam;)", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumiem — ak platby do Fio prišli, ale v Zooze nie sú vôbec (ani medzi Sparované ani Nepárované), problém je najčastejšie v tom, že sa neodoslali do Zooze. \n\n\nSkontrolujte tieto veci:\n\n\n\n\n- \nEmailové notifikácie z Fio – Zooza ich musí vedieť prečítať. Ak Fio zmenilo šablónu emailu, platba sa nemusí zobraziť vôbec.\n\n- \nNastavený IBAN – Zooza musí vedieť, na ktorý účet platba prišla. \n\n\n- \nDuplikát – ak je platba už v systéme, niekedy sa nachádza v filtre Ignorované.\n\nAk platba naozaj nie je v systéme, môžete ju dodatočne pridať:\n\n\n\n\n- \nPlatby → Import → CSV z bankového výpisu a následne ju ručne spárovať.\n\nTip: kontrolujte Platby → Vyrovnanie platieb pravidelne (filtr Nepárované), pretože systém neposiela upozornenie, keď platba prichádza.", "cited": ["Payment Pairing for Bank Transfers & Direct Debit | Zooza Help", "Inbound payments — setup and pairing | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Jana Gerekova", "text": "notifikacie prisli, iban je v poariadku,    ako funguje ten csv z bankoveho vypisu - sparuje mi to len nesparovane?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno — CSV import nepáruje len nesparované platby. Pri importe sa každý riadok z bankového výpisu skontroluje a systém sa pokúsi ho automaticky spárovať s rezerváciou podľa variabilného symbolu. \n\n\nVýsledok je dvakrát:\n\n\n\n\n- \nMatched (Sparované) – systém našiel správnu rezerváciu a platba sa importuje už ako spárovaná.\n\n- \nUnmatched (Nesparované) – rezervácia sa nenašla (napr. chybný VS). Tú môžete dodatočne ručne spárovať v zozname.\n\nDôležité:\n\n\n\n\n- importujte CSV iba raz, inak sa platby môžu zapísať dvakrát. \n\n\n- systém kontroluje aj duplikáty a podezrelé riadky označí na ručnú kontrolu. \n\n\nAk chcete, môžem vám tiež ukázať, ako si CSV z Fio pripraviť tak, aby sa čo najviac platieb spárovalo automaticky.", "cited": ["Payment Pairing for Bank Transfers & Direct Debit | Zooza Help", "Importing bank payments via CSV | Zooza Help", "Inbound payments — setup and pairing | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc s dodatočným importom platieb z Fio bez duplicitného načítania, môžete mi opísať, čo chcete ešte overiť. Chcete pokračovať a objasniť konkrétny krok alebo situáciu?", "cited": []}, {"role": "customer", "who": "Jana Gerekova", "text": "ako viem klientke zmenit termin skusobnej hodiny\u003c", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Termín skúšobnej hodiny sa zmení cez Attendance v rezervácii klientky.\n\n\nPostup:\n\n\n\n\n- Otvorte rezerváciu klientky.\n\n- Prejdite do sekcie Attendance.\n\n- U pôvodného termínu kliknite Hide (tento termín sa skryje zo správ a z profilu klientky).\n\n- Potom kliknite Book a session a vyberte nový termín. \n\n\nRezervácia zostane v stave Trial started a klientka dostane notifikáciu s novým termínom.\n\n\nTip: ak chcete klientke dať viac flexibility, môže si nový termín aj zmeniť sama cez svoj profil.", "cited": ["Manage trial bookings — reschedule, convert, and close | Zooza Help", "A client wants to move to a later date | Zooza Help", "Trial Classes FAQ | Zooza Help", "Transfer and Copy FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak ešte potrebujete pomoc so zmenou termínu skúšobnej hodiny, rada objasním ďalšie možnosti. Chcete opísať, ktorú časť postupu potrebujete ešte overiť?", "cited": []}], "verdict": "check", "vtitle": "Fio payments not arriving — bot generic; then reschedule a trial", "vnote": "Human handled the import question elsewhere (215475929760351).", "cat": "payments"}, {"channel": "intercom", "id": "215475897184380", "date": "2026-09-11 13:09", "day": "2026-09-11", "human": false, "bucket": "D_assumed_with_kb", "reask": 4, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Getting Started with Zooza | Zooza Help", "Programme Automations | Zooza Help", "Types of bookings | Zooza Help", "Trial Classes FAQ | Zooza Help", "Payment Pairing for Bank Transfers & Direct Debit | Zooza Help", "Price and payment setup | Zooza Help", "Clients | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Waiting List FAQ | Zooza Help", "Payment tile on booking | Zooza Help", "Add a one-off scheduled payment | Zooza Help"], "q": "HOW TO INVITE FROM A WAITING LIST?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "HOW TO INVITE FROM A WAITING LIST?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You invite someone from the waiting list by approving their booking manually.\n\n\nSteps:\n\n\n\n\n- Go to Bookings.\n\n- Filter by Status = Waitlist.\n\n- Open the booking you want to invite.\n\n- Click Change status.\n\n- Select Enrolled (this confirms the booking).\n\n- Optionally tick Send confirmation email to notify the parent. \n\n\nNothing moves from the waiting list automatically. You decide when a spot opens and approve the booking yourself.\n\n\nTip: you can also contact the parent first to confirm they still want the spot before enrolling them.", "cited": ["Getting Started with Zooza | Zooza Help", "Waiting List FAQ | Zooza Help", "Programme Automations | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "How or when do they now make payment?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Good question — this is the key difference.\n\n\n\n\n- \nWhile on the waiting list: they do not pay yet. Waiting list bookings are not expected to pay until you confirm a spot. \n\n\n- \nAfter you approve them (change status to Enrolled):\n• You set the amount they owe in the booking.\n• Send the confirmation email.\n• The parent then goes to their Client Profile → Payments and completes payment there.  \n\n\nPayment can be:\n\n\n\n\n- card / direct debit (instant), or\n\n- bank transfer using instructions in their profile. \n\n\nTip: you can also resend the confirmation email if they need the payment link again.", "cited": ["Programme Automations | Zooza Help", "Waiting List FAQ | Zooza Help", "Types of bookings | Zooza Help", "Trial Classes FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Is this Add Payment?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — Add payment is the button you use to record the payment on that booking. \n\n\nTypical flow after you move someone from the waiting list to Enrolled:\n\n\n\n\n- Open the booking.\n\n- Go to the Payments section.\n\n- Click Add payment and enter the amount, date, and payment method. \n\n\nThis is also used if the parent paid you outside the system (bank transfer, cash, etc.), so you can mark the booking as paid. \n\n\nTip: you can also set the amount owed first, then send the confirmation email so the parent knows what to pay.", "cited": ["Waiting List FAQ | Zooza Help", "Payment Pairing for Bank Transfers & Direct Debit | Zooza Help", "Payment tile on booking | Zooza Help", "Clients | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Does this clarify things?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "So which payment method should I select if they have not yet paid? I'd like to add the balance to their account to pay online?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Good catch — this is the key distinction.\n\n\n\n\n- \nAdd payment = you are recording money you already received (cash, bank transfer, etc.). It marks the booking as paid. \n\n\n- If the client has not paid yet and will pay online, do not use Add payment.\n\nInstead:\n\n\n\n\n- Go to the booking → Payment plan\n\n\n- Click Add scheduled payment to create the amount they owe. \n\n\nThen the parent can log in and pay it themselves from their Client Profile.\n\n\nSo in your case: don’t select any payment method yet — just leave it unpaid and let them pay online.", "cited": ["Payments and Billing FAQ | Zooza Help", "Add a one-off scheduled payment | Zooza Help", "Price and payment setup | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help setting up the unpaid balance for online payment, I’m here to help. Would you like to share what you’re seeing on the booking’s Payment plan?", "cited": []}], "verdict": "check", "vtitle": "Invite from waiting list: change status to Enrolled; Add payment vs Add scheduled payment", "vnote": "Consistent with waiting-list FAQ. Fine.", "cat": "bookings"}, {"channel": "intercom", "id": "215475896291959", "date": "2026-09-11 12:07", "day": "2026-09-11", "human": true, "bucket": "HUMAN", "reask": 1, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Nový fakturační profil\n\nDobrý den, \n\nzakládali jsme nový fakturační profil s názvem \"Taneční soubory Pop Balet, A23, z. s. 26/27\", který potřebujeme přiřadit ke kurzu \"Soubory Pop Balet Junior\". \n\nV samotném nastavení nového fakturačního profilu se nám nedaří přidat číslo IBAN atd. v sekci Bankovní účty, viz obrázek. Pokaždé nám systém zobrazí červenou hlášku, že IBAN je již používán u jiného fakt  prebrali a odsúhlasili: pri presune dieťaťa v rámci siete a jeho prijatí na cieľovej pobočke potrebujeme, aby pôvodná registrácia bola označená ako vymazaná, nie zrušená. Dôvodom je, že medzi zrušenými registráciami chceme mať výhradne tie, ktoré reálne odzrkadľujú, že dieťa výučbu predčasne ukončilo alebo vôbec nenastúpilo – teda skutočné odhlásenia. Ak by sa medzi zrušené premiešali aj registrácie, ktoré vznikli len administratívnym presunom v rámci siete, štatistiky zrušených registrácií by boli skreslené a nevedeli by sme z nich vyčítať reálny odchod detí. Chápeme, že platba sa presúva spolu s registráciou – potrebujeme len, aby stav pôvodnej (už presunutej a prijatej) registrácie bol „vymazaná“, a nie „zrušená“.\n\n K druhej téme, chybovej hláške pri prijímaní presunutých detí: áno, potvrdzujeme, že pobočka Online má úplne inú registračnú kartu, keďže pri online pobočke potrebujeme iné extra polia ako pri kamenných pobočkách. Je nám jasné, že nastavenia kurzov je potrebné zosúladiť, no vzhľadom na to, že extra polia sa medzi online a ostatnými pobočkami budú vždy líšiť, potrebujeme nájsť riešenie, ktoré s týmto rozdielom počíta (napr. že appka pri nezhode polí upozorní vopred, ako spomínate, alebo umožní presun bez nutnosti mať úplne identické polia).\n\n K tomu manažérka pobočky Online eviduje ešte tieto dva konkrétne body, poprosíme o vyjadrenie/riešenie ku každému z nich:\n\n  \n- Po presune v sieti a následnom prijatí na druhej pobočke potrebujeme, aby bola pôvodná registrácia vymazaná, nie zrušená (viď vyššie). Zároveň sa nedajú nájsť presunuté deti, ktoré čakajú na prijatie – poprosíme, kde/ako ich vieme dohľadať. \n- Pri pokuse prijať dieťa presunuté v rámci siete vyskakujú chybové odkazy (napr. https://zooza.app/#registrations/transfer/change?course_id=8909&schedule_id=87182&action=transfer_accept&transfer_id=60) – screenshot prikladáme v prílohe.  Poslednou vecou je, že v detailoch presunu potrebujeme vidieť aj ROČNÍK dieťaťa – momentálne tam nie je v <script id="app">
const el = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MARKETING = /— Zooza$|Zooza PRO|Cen[íi]k|Cennik/;
const CATLBL = Object.fromEntries(META.categories);
const DECS = META.decisions.map(d => d[0]);
const SHORT = {ok:'Fine', kb:'KB', dig:'Dig', product:'Product'};

let filter='todo', catf='', q='', open=null, cursor=0, readOnly=false;

const S = c => (c && c.id ? (STATE[c.id] ||= {d:'', cat:c.cat, note:'', sug:''})
                          : {d:'', cat:'', note:'', sug:''});
const byId = id => DATA.find(c => c.id === id);

const FILTERS = [
  ['todo',   'To decide', '',        c => !S(c).d],
  ['all',    'All',       '',        c => true],
  ['kb',     'KB',        'k-kb',    c => S(c).d === 'kb'],
  ['dig',    'Dig',       'k-dig',   c => S(c).d === 'dig'],
  ['ok',     'Fine',      'k-ok',    c => S(c).d === 'ok'],
  ['waiting','Still waiting','k-wait',c => !!c.carried],
  ['noted',  'My notes',  '',        c => !!S(c).note],
  ['human',  'Human',     '',        c => c.human && c.channel === 'intercom'],
  ['bot',    'AI only',   '',        c => !c.human],
];

/* ── saving ───────────────────────────────────────────── */
let timer=null, artifact=null, dirty=false;
const mirror = () => { try{ localStorage.setItem('zb-'+META.end, JSON.stringify(STATE)); }catch(e){} };
const setSave = (t,c) => { const s=el('#save'); s.textContent=t; s.className='save '+(c||''); };
function touch(){ dirty=true; mirror(); setSave('Unsaved…'); clearTimeout(timer); timer=setTimeout(commit,2500); }

function buildDoc(){
  const css=document.getElementById('sheet').textContent;
  const skel=document.getElementById('skeleton').innerHTML;
  const app=document.getElementById('app').textContent;
  const enc=o=>JSON.stringify(o).replace(/</g,'\\u003c')
    .replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  const S_='<'+'script', E_='<'+'/script>';
  return '<!doctype html><html lang="en"><head><meta charset="utf-8">'
    +'<meta name="viewport" content="width=device-width,initial-scale=1">'
    +'<title>'+esc(document.title)+'</title><style id="sheet">'+css+'</style></head><body>'
    +skel+'<template id="skeleton">'+skel+'</template>'
    +S_+' id="data">const DATA='+enc(DATA)+';const META='+enc(META)+';'+E_
    +S_+' id="state">const STATE='+enc(STATE)+';'+E_
    +S_+' id="app">'+app+E_+'</body></html>';
}
async function commit(){
  if(!dirty||readOnly) return;
  if(!artifact){ setSave('Saved on this device'); dirty=false; return; }
  setSave('Saving…');
  try{
    sessionStorage.setItem('zb-open', open||''); sessionStorage.setItem('zb-filter', filter);
    await artifact.publish(buildDoc()); dirty=false; setSave('Saved','on');
  }catch(e){
    const c=e&&e.code;
    if(c==='conflict') return;
    if(c==='rate_limited'){ timer=setTimeout(commit,8000); setSave('Queued…'); return; }
    if(['not_writer','not_granted','not_declared','capability_disabled','capability_removed'].includes(c)){
      readOnly=true; setSave('Read-only view','err'); return; }
    setSave('Saved on this device only','err');
  }
}

/* ── rendering ────────────────────────────────────────── */
function matches(c){
  if(!FILTERS.find(f=>f[0]===filter)[3](c)) return false;
  if(catf && S(c).cat!==catf) return false;
  if(!q) return true;
  return (c.q+' '+c.vtitle+' '+c.vnote+' '+c.id+' '+S(c).note+' '+
          c.turns.map(t=>t.text).join(' ')).toLowerCase().includes(q);
}
const visible = () => DATA.filter(matches);

function renderBar(){
  const n=DATA.length, by={ok:0,kb:0,dig:0,product:0};
  DATA.forEach(c=>{ const d=S(c).d; if(d) by[d]=(by[d]||0)+1; });
  const done=by.ok+by.kb+by.dig+by.product;
  el('#seg').innerHTML=DECS.map(k=>by[k]?'<i class="'+k+'" style="width:'+(by[k]/n*100)+'%" title="'+SHORT[k]+' '+by[k]+'"></i>':'').join('');
  el('#done').innerHTML='<b>'+done+'</b> / '+n+' decided';
  el('#chips').innerHTML=FILTERS.map(([k,label,cls,fn])=>
    '<button class="chip '+cls+'" data-f="'+k+'" aria-pressed="'+(filter===k)+'">'+
    label+' <b>'+DATA.filter(fn).length+'</b></button>').join('');
}

function rowHTML(c){
  const s=S(c), out=[];
  out.push('<span class="pill cat">'+esc(CATLBL[s.cat]||s.cat)+'</span>');
  if(c.carried) out.push('<span class="pill wait">waiting since '+c.carried+'</span>');
  if(c.reask>=4) out.push('<span class="pill re">'+c.reask+'× re-asked</span>');
  if(s.note) out.push('<span class="pill note">note</span>');
  if(!s.d&&s.sug) out.push('<span class="pill sug">'+SHORT[s.sug]+'?</span>');
  return '<div class="line">'
    +'<span class="dot '+(c.human?'h':'b')+'" title="'+(c.human?'A human replied':'AI only')+'"></span>'
    +'<span class="tm mono">'+c.date.slice(11)+'</span>'
    +'<span class="ttl">'+esc(c.vtitle||c.q)+'</span>'
    +'<span class="meta">'+out.join('')+'</span>'
    +'<span class="acts">'+DECS.map(k=>
        '<button class="act a-'+k+'" data-d="'+k+'" data-id="'+c.id+'" aria-pressed="'+(s.d===k)+'"'
        +' title="'+SHORT[k]+'">'+SHORT[k]+'</button>').join('')+'</span>'
    +'</div>';
}

function panelHTML(c){
  const s=S(c);
  let h='<div class="panel">';
  if(c.verdict) h+='<div class="read"><div class="k">Claude reads this as: '+esc(c.verdict)+'</div><p>'+esc(c.vnote)+'</p></div>';
  h+='<div class="frm">'
    +'<button class="idc mono" data-copy="'+c.id+'">'+c.id+'</button>'
    +'<select class="sel" data-cat="'+c.id+'">'+META.categories.map(([k,l])=>
        '<option value="'+k+'"'+(s.cat===k?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select>'
    +'<textarea class="note" data-note="'+c.id+'" placeholder="What you want done with this one. Screenshots go in the chat — quote the id.">'+esc(s.note)+'</textarea>'
    +'</div><div class="thread">';
  for(const t of c.turns){
    if(!t.text&&!t.cited.length) continue;
    const r=t.role==='customer'?'customer':(t.role==='human'?'human':'bot');
    const w=r==='customer'?esc(t.who||'Client'):r==='human'?esc(t.who||'Zooza'):'AI';
    h+='<div class="turn t-'+r+'"><div class="who">'+w+'</div><div class="bub">'+esc(t.text);
    if(t.cited.length) h+='<div class="cited"><b>Cited</b>'+t.cited.map(x=>
      '<div class="'+(MARKETING.test(x)?'m':'')+'">'+esc(x)+'</div>').join('')+'</div>';
    h+='</div></div>';
  }
  return h+'</div></div>';
}

function renderList(){
  const rows=visible();
  if(cursor>=rows.length) cursor=Math.max(0,rows.length-1);
  if(!rows.length){ el('#list').innerHTML='<p class="empty">Nothing matches that.</p>'; return; }
  let h='', day='';
  rows.forEach((c,i)=>{
    if(c.day!==day){ day=c.day;
      h+='<div class="day">'+new Date(day+'T12:00:00').toLocaleDateString('en-GB',
         {weekday:'long',day:'numeric',month:'long'})+'</div>'; }
    const s=S(c), isOpen=open===c.id;
    h+='<div class="row'+(s.d?' decided d-'+s.d:'')+(isOpen?' open':'')+(i===cursor?' cursor':'')
      +'" data-id="'+c.id+'" data-i="'+i+'">'+rowHTML(c)+(isOpen?panelHTML(c):'')+'</div>';
  });
  el('#list').innerHTML=h;
}

function renderRoll(){
  const keys=META.categories.map(x=>x[0]), agg={};
  keys.forEach(k=>agg[k]={n:0,kb:0,dig:0,ok:0,product:0,todo:0});
  DATA.forEach(c=>{ const s=S(c), a=agg[s.cat]||(agg[s.cat]={n:0,kb:0,dig:0,ok:0,product:0,todo:0});
    a.n++; if(s.d) a[s.d]++; else a.todo++; });
  const rows=keys.filter(k=>agg[k].n).sort((a,b)=>agg[b].n-agg[a].n);
  const cell=v=>v?String(v):'<span class="z">·</span>';
  let h='<table class="rt"><thead><tr><th>Category</th><th>All</th><th>KB</th><th>Dig</th><th>Fine</th><th>Left</th></tr></thead><tbody>';
  rows.forEach(k=>{const a=agg[k];
    h+='<tr><td><button data-cat-filter="'+k+'">'+esc(CATLBL[k]||k)+'</button></td><td>'+a.n+'</td><td>'
      +cell(a.kb)+'</td><td>'+cell(a.dig)+'</td><td>'+cell(a.ok)+'</td><td>'+cell(a.todo)+'</td></tr>';});
  el('#roll').innerHTML=h+'</tbody></table>';
}

const render=()=>{ renderBar(); renderList(); renderRoll(); };

function scrollCursor(){
  const r=el('.row.cursor'); if(!r) return;
  const top=r.getBoundingClientRect().top, h=el('.bar').offsetHeight;
  if(top<h+8||top>window.innerHeight-60) r.scrollIntoView({block:'center'});
}

/* ── acting ───────────────────────────────────────────── */
function decide(id,d){
  const s=S(byId(id)); s.d = s.d===d ? '' : d; touch(); render();
}
function toggle(id){ open = open===id ? null : id; renderList();
  if(open){ const r=el('.row.open'); if(r) r.scrollIntoView({block:'nearest'}); } }

el('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip'); if(!b) return;
  filter=b.dataset.f; cursor=0; render(); window.scrollTo({top:0});});
el('#catf').addEventListener('change',e=>{catf=e.target.value; cursor=0; render();});
el('#q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase(); cursor=0; render();});
el('#roll').addEventListener('click',e=>{const b=e.target.closest('[data-cat-filter]'); if(!b) return;
  catf=b.dataset.catFilter; el('#catf').value=catf; filter='all'; render(); window.scrollTo({top:0});});

el('#list').addEventListener('click',e=>{
  const a=e.target.closest('.act'); if(a){ e.stopPropagation(); decide(a.dataset.id,a.dataset.d); return; }
  const cp=e.target.closest('[data-copy]'); if(cp){ e.stopPropagation();
    navigator.clipboard?.writeText(cp.dataset.copy);
    const t=cp.textContent; cp.textContent='copied'; setTimeout(()=>{cp.textContent=t;},900); return; }
  if(e.target.closest('.note')||e.target.closest('.sel')) return;
  const r=e.target.closest('.row'); if(!r) return;
  cursor=+r.dataset.i; toggle(r.dataset.id);
});
el('#list').addEventListener('input',e=>{
  const n=e.target.closest('[data-note]'); if(n){ S(byId(n.dataset.note)).note=n.value; touch(); }});
el('#list').addEventListener('change',e=>{
  const c=e.target.closest('[data-cat]'); if(c){ S(byId(c.dataset.cat)).cat=c.value; touch(); renderBar(); renderRoll(); }
  const n=e.target.closest('[data-note]'); if(n) renderList();});

function nextUndecided(){
  const rows=visible();
  for(let i=1;i<=rows.length;i++){ const j=(cursor+i)%rows.length;
    if(!S(rows[j]).d){ cursor=j; open=rows[j].id; renderList(); scrollCursor(); return; } }
  setSave('All decided','on');
}
el('#next').addEventListener('click',nextUndecided);

document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const t=e.target.tagName;
  if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT'){ if(e.key==='Escape') e.target.blur(); return; }
  const rows=visible(); if(!rows.length) return;
  if(e.key==='j'||e.key==='ArrowDown'){ e.preventDefault(); cursor=Math.min(cursor+1,rows.length-1); renderList(); scrollCursor(); }
  else if(e.key==='k'||e.key==='ArrowUp'){ e.preventDefault(); cursor=Math.max(cursor-1,0); renderList(); scrollCursor(); }
  else if(e.key==='Enter'){ e.preventDefault(); toggle(rows[cursor].id); }
  else if(e.key==='Escape'&&open){ open=null; renderList(); }
  else if(e.key==='n'){ e.preventDefault(); nextUndecided(); }
  else if(e.key==='/'){ e.preventDefault(); el('#q').focus(); }
  else if('1234'.includes(e.key)){ e.preventDefault(); decide(rows[cursor].id,DECS[+e.key-1]); scrollCursor(); }
});

/* ── handoff ──────────────────────────────────────────── */
el('#hand').addEventListener('click',()=>{
  const head={kb:'Into the KB',dig:'Dig into it first',product:'Product, not KB',ok:'Fine as answered'};
  let out='# Weekly review — '+META.start+' to '+META.end+'\n';
  const left=DATA.filter(c=>!S(c).d).length;
  out+='\n'+(DATA.length-left)+' of '+DATA.length+' decided'+(left?', '+left+' still open':'')+'.\n';
  ['kb','dig','product','ok'].forEach(d=>{
    const rows=DATA.filter(c=>S(c).d===d); if(!rows.length) return;
    out+='\n## '+head[d]+' ('+rows.length+')\n\n';
    rows.forEach(c=>{ const s=S(c);
      if(d==='ok'&&!s.note){ out+='- '+c.id+' — '+(c.vtitle||c.q.slice(0,70))+'\n'; return; }
      out+='- **'+c.id+'** ['+(CATLBL[s.cat]||s.cat)+'] '+(c.vtitle||c.q.slice(0,90))+'\n';
      if(c.carried) out+='  - unanswered since '+c.carried+'\n';
      if(s.note) out+='  - Michal: '+s.note.replace(/\n+/g,' ')+'\n'; });
  });
  const un=DATA.filter(c=>!S(c).d);
  if(un.length){ out+='\n## Not decided yet ('+un.length+')\n\n';
    un.forEach(c=>{ out+='- '+c.id+' — '+(c.vtitle||c.q.slice(0,70))+'\n'; }); }
  el('#hout').value=out; el('#hdlg').showModal();
});
el('#hclose').addEventListener('click',()=>el('#hdlg').close());
el('#hcopy').addEventListener('click',async()=>{
  const t=el('#hout'); t.select();
  try{ await navigator.clipboard.writeText(t.value); }catch(e){ document.execCommand('copy'); }
  el('#hcopy').textContent='Copied'; setTimeout(()=>{el('#hcopy').textContent='Copy';},1200);
});
window.addEventListener('beforeunload',e=>{ if(dirty){ commit(); e.preventDefault(); e.returnValue=''; }});

/* ── boot ─────────────────────────────────────────────── */
el('#wkrange').textContent=META.start+' – '+META.end+' · '+META.counts.total+' conversations';
el('#catf').innerHTML='<option value="">Every category</option>'+
  META.categories.map(([k,l])=>'<option value="'+k+'">'+esc(l)+'</option>').join('');
open=sessionStorage.getItem('zb-open')||null;
filter=sessionStorage.getItem('zb-filter')||'todo';
sessionStorage.removeItem('zb-open'); sessionStorage.removeItem('zb-filter');
setSave('');
render();
if(typeof claude!=='undefined'&&claude&&typeof claude.use==='function'){
  claude.use('artifact').then(a=>{ artifact=a;
    setSave(a?'Saving is on':'Saved on this device', a?'on':''); })
    .catch(()=>setSave('Saved on this device'));
} else setSave('Saved on this device');
</script>
