ole": "customer", "who": "Kristína Bírová", "text": "A to mi neukáže aj tých čo sú v poradovníku ?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Nie – v Reports → Bookings sa v hlavnom čísle Bookings zobrazujú len aktívne rezervácie. Tí v poradovníku sú v grafe oddelené ako Waiting list, ale nie sú započítané do hlavného počtu. \n\n\nAk chcete vidieť len poradovník:\n\n\n\n\n- prejdite do Bookings\n\n\n- otvorte Filters → Status\n\n\n- vyberte Waiting list \n\n\nTíto klienti sú v poradovníku, pretože kurz je plný a čakajú na uvoľnené miesto. \n\n\nTip: môžete si aj exportovať tento zoznam z Bookings → Export, ak chcete mať ich kontakty na jednej mieste.", "cited": ["Reports | Zooza Help", "Waiting List FAQ | Zooza Help", "Bookings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Kristína Bírová", "text": "Práveže ten nechcem", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno – v Reports → Bookings sa v hlavnom čísle Bookings zobrazujú len aktívne rezervácie. Tí v poradovníku sú v grafe oddelené, ale nie sú započítané do hlavného počtu. \n\n\nPoradovník má stav Waiting list, čo znamená, že kurz je plný a klient čaká na uvoľnené miesto. \n\n\nAk chcete vidieť len aktívne deti (ktoré chodia na tréning), použite v Bookings → Filters → Status hodnotu Enrolled. \n\n\nTip: ak chcete mať presný zoznam týchto detí, môžete ich aj exportovať z Bookings → Export.", "cited": ["Bookings | Zooza Help", "Reports | Zooza Help", "Registration statuses — what each one means | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak ešte potrebujete pomoc s vyfiltrovaním aktívnych a uhradených registrácií bez poradovníka, som vám k dispozícii. Chcete doplniť, čo presne potrebujete vo výslednom počte alebo zozname overiť?", "cited": []}], "verdict": "check", "vtitle": "How many children attend — active paid registrations excluding waiting list", "vnote": "Bookings filters. Fine.", "cat": "reports"}, {"channel": "intercom", "id": "215475981413632", "date": "2026-09-17 15:39", "day": "2026-09-17", "human": false, "bucket": "D_assumed_with_kb", "reask": 8, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Trial Classes FAQ | Zooza Help", "Payment templates creation | Zooza Help", "Price and payment setup | Zooza Help", "Managing client attendance — admin | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Billable sessions | Zooza Help", "FAQ — Programmes | Zooza Help", "Create a programme | Zooza Help", "Children's Group Activities — Block / Term Model | Zooza Help", "Children's Group Activities — Monthly Subscription Model | Zooza Help", "Individual Lessons — 1-to-1 Model | Zooza Help", "Sell extra sessions on top of a booking | Zooza Help"], "q": "I have a class for children and their subscription includes 4 sessions. I also want to offer the first session for free, without including it in the subscription. How can I set this up?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "I have a class for children and their subscription includes 4 sessions. I also want to offer the first session for free, without including it in the subscription. How can I set this up?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Mara, the cleanest way is to use a free trial session before the subscription starts. \n\n\nHow to set it up:\n\n\n\n\n- Go to Programmes → your programme → Settings → Trial\n\n\n- Enable Trial\n\n\n- Set Trial price = 0\n\n\n- Set Trial length = 1 session\n\n\nClients will first book the free trial session and pay nothing. After that session, they can register for the programme and start the 4‑session subscription. \n\n\nThis keeps the trial completely separate from the paid subscription.\n\n\nIf you want, I can also show you how to automatically send parents a follow‑up message after the trial inviting them to join the full programme.", "cited": ["Billable sessions | Zooza Help", "Trial Classes FAQ | Zooza Help", "Individual Lessons — 1-to-1 Model | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "I don't want them to book twice - one for the trial, one to enroll. Is there a way to do this?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Short answer: no — in Zooza this always requires two bookings.\n\n\nThe trial feature is designed as a separate registration. A client books the free trial first, attends it, and only then enrolls in the paid programme. This is how the system tracks trial status and triggers the follow‑up flow.\n\n\nThe only way to avoid two bookings is to include the free session inside the subscription, for example:\n\n\n\n\n- “5 sessions, pay for 4” (using a discount or adjusted session count)\n\nThis keeps everything in one booking, but the first session is no longer a separate trial step.\n\n\nIf you want, I can also show you a simple way to structure the “4 sessions, first one free” setup so it feels natural for parents.", "cited": ["Individual Lessons — 1-to-1 Model | Zooza Help", "Billable sessions | Zooza Help", "FAQ — Programmes | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "yes please If you want, I can also show you a simple way to structure the “4 sessions, first one free” setup so it feels natural for parents.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Great question, Mara — this is a common setup for children’s classes.\n\n\nThe cleanest way to make it feel like “4 sessions, first one free” in a single booking is:\n\n\n\n\n- Create a programme with 5 sessions total\n\n\n- Set the price so parents pay for 4 sessions only (for example using a discount or adjusted session count)\n\nThis way:\n\n\n\n\n- Parents book once\n\n\n- They attend 5 sessions\n\n\n- They only pay for 4\n\n\nThis works because the free session is included inside the package rather than as a separate trial step. \n\n\nIf you want, I can also show you a simple way to label this on your website so parents clearly understand “4 sessions, first one free.”", "cited": ["Individual Lessons — 1-to-1 Model | Zooza Help", "Billable sessions | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "No really because the class starts in October and ends in June. Students pay in insatllments", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Mara, in this situation there isn’t a way to have one booking + instalments + a free first session in Zooza. The system only supports the free first session through the Trial feature, and that always creates a separate registration. \n\n\nSo the two supported shapes are:\n\n\n\n\n- \nTrial model\n• 1 free trial session (separate booking)\n• Then enrol in the programme with instalments\n• Requires two bookings.\n\n- \nSingle booking model\n• One booking for the whole programme\n• Instalments via a payment template\n• But the first session cannot be free.  \n\n\nFor long courses like October–June with instalments, the single booking + instalments setup is usually the cleanest for parents. \n\n\nIf you want, I can also show a simple way to label this on your website so parents clearly understand the “first session free” idea even though it’s handled as a trial step.", "cited": ["Billable sessions | Zooza Help", "Children's Group Activities — Block / Term Model | Zooza Help", "Create a programme | Zooza Help", "Payment templates creation | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "please do If you want, I can also show a simple way to label this on your website so parents clearly understand the “first session free” idea even though it’s handled as a trial step.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Mara, a simple way to explain this to parents is to keep the wording very clear on the booking page.\n\n\nExample text you can place above the booking form:\n\n\n\n\n- “First session is free.”\n\n- Parents book a free trial lesson to try the class.\n\n- After the trial, they can enrol in the full programme and pay in instalments.\n\nThis works because the trial is a separate registration in Zooza, and after the session the system automatically sends an invitation to join the full programme. \n\n\nTip: you can also add a short line like “No payment required for the trial session” to avoid confusion.", "cited": ["Individual Lessons — 1-to-1 Model | Zooza Help", "Children's Group Activities — Block / Term Model | Zooza Help", "Children's Group Activities — Monthly Subscription Model | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "what happens when I book a session from Attendance? is that session included in the already set installments or is it an additional free session?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Good question, Mara.\n\n\nWhen you mark a session as attended from Attendance, it is not an extra payment. It simply records that the client was present for a session that is already part of their booking. \n\n\nSo in your case (instalments for the programme):\n\n\n\n\n- The instalment schedule stays the same\n\n- The client is not charged again\n\n\n- The session is just counted as attended\n\n\nThe only time a session becomes free in terms of pricing is when it is marked as non‑billable in the class setup. In that case, it is excluded from the amount clients pay. \n\n\nSo in short:\n\n\nAttendance = record attendance, no extra charge.\n\n\nNon‑billable session = free session from a pricing perspective.", "cited": ["Price and payment setup | Zooza Help", "Sell extra sessions on top of a booking | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help understanding how Attendance affects the booking and instalments, I’m here to help. Would you like to share more about the setup you’re trying to achieve?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Not really. So I have an enrolled client who pays in installments, his subscription including 4 sessions. He's already enrolled, his payment plan already set. What happens when I use Book a session option from Attendance. Is that session free?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Good question, Mara.\n\n\nWhen you use Book a session from the Attendance tab, you are simply adding that session to the client’s attendance record. It does not create a new payment or change the instalment plan. \n\n\nSo in your case:\n\n\n\n\n- The client is already enrolled and paying in instalments.\n\n- You add a session via Book a session.\n\n- The client attends that session.\n\nResult:\n\n\n\n\n- The instalment schedule stays the same.\n\n- The client is not charged again.\n\n- The session is just recorded as attended. \n\n\nIn short: it’s an extra attended session, not a paid one and not a free one in terms of pricing — it’s just attendance management.", "cited": ["Managing client attendance — admin | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "kinda", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I understand that this can be a bit confusing. Could you please share more details about the client's subscription or the specific setup you are using? I’m here to help clarify this for you. 😊", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I’m here to provide further help with understanding how booking a session from Attendance affects the client’s subscription and instalments. Would you like to share what you want that additional session to represent?", "cited": []}], "verdict": "check", "vtitle": "Free first session + instalments in one booking — bot: impossible without two bookings", "vnote": "billable-sessions.md already has the exact section ('first session free, other 36 paid') explaining why trial is the tool. No change.", "cat": "pricing"}, {"channel": "intercom", "id": "215475981423819", "date": "2026-09-17 15:28", "day": "2026-09-17", "human": false, "bucket": "D_assumed_with_kb", "reask": 4, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Blocks Configuration and Management | Zooza Help", "Pay-as-you-go programme | Zooza Help", "Programmes List | Zooza Help", "Blocks (Term Segments) FAQ | Zooza Help", "Booking Widget FAQ | Zooza Help", "Blocks creation | Zooza Help", "Create a programme | Zooza Help", "Open Classes and Drop-in — Pay-as-you-go and Entry Passes | Zooza Help"], "q": "Can I create a programme where the clients select the dates they will attend?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Can I create a programme where the clients select the dates they will attend?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — you have two ways to do this in Zooza. \n\n\nOption 1: Pay‑as‑you‑go programme (most flexible)\n\n\n\n\n- Clients enrol once.\n\n- From their profile they choose the individual dates/sessions they want to attend.\n\n- A payment obligation is created for each session they book.  \n\n\nOption 2: Blocks inside a programme\n\n\n\n\n- You split the programme into blocks (for example: Week 1, Week 2, or specific dates).\n\n- Clients select the block(s) they want during booking.  \n\n\nIf you want, I can also show you when to use Pay‑as‑you‑go vs Blocks depending on how you want clients to book.", "cited": ["Pay-as-you-go programme | Zooza Help", "Create a programme | Zooza Help", "Open Classes and Drop-in — Pay-as-you-go and Entry Passes | Zooza Help", "Blocks (Term Segments) FAQ | Zooza Help", "Blocks Configuration and Management | Zooza Help", "Blocks creation | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Option 2: Blocks inside a programme - show me this please", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Great — here’s how Option 2 (Blocks inside a programme) works in practice.\n\n\n1. Create the class and sessions\n\n\n\n\n- Add all sessions for the programme as usual.\n\n- When creating each session, assign it to a block (for example: “Week 1”, “Week 2”, or “Monday” / “Wednesday”).\n\n- You can also edit an existing session later and move it into a different block. \n\n\n2. Make the blocks selectable for clients\n\n\n\n\n- Open the class → go to Price and Payment.\n\n- Click the block you want clients to choose.\n\n- Enable Enable online registration.\n\n- Save.\n\n3. What clients see\n\n\n\n\n- When booking, they can choose which block(s) they want to attend instead of enrolling for the whole programme. \n\n\nExample\n\n\n\n\n- Block A: Monday sessions\n\n- Block B: Wednesday sessions\n\nClients can pick one day or both.\n\n\nIf you want, I can also show a simple real example (like a 6‑week programme with weekly blocks) so you can see exactly how it looks to parents when booking.", "cited": ["Blocks Configuration and Management | Zooza Help", "Blocks creation | Zooza Help", "Blocks (Term Segments) FAQ | Zooza Help", "Booking Widget FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "I want a 10 week programme with 1 session per week but able to select the number of weeks they'd like to attend", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — you can do this with blocks inside the programme.\n\n\nHow to set it up for a 10‑week programme:\n\n\n\n\n- Create the programme and class as usual.\n\n- When generating the sessions, set the schedule to weekly for 10 weeks. Zooza will automatically create all 10 sessions. \n\n\n- Assign the sessions to blocks, for example:\n• Block 1: Weeks 1–5\n• Block 2: Weeks 6–10\n\n- Enable online registration on each block and set the price per block. \n\n\nClients will then choose which block(s) they want to attend during booking instead of committing to the full programme. \n\n\nIf you want, I can also show a simple way to structure the blocks so parents can pick any number of weeks (for example 1, 2, 3, etc.).", "cited": ["Blocks (Term Segments) FAQ | Zooza Help", "Programmes List | Zooza Help", "Blocks creation | Zooza Help", "Pay-as-you-go programme | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "f you want, I can also show a simple way to structure the blocks so parents can pick any number of weeks (for example 1, 2, 3, etc.). yes please", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — the simplest way is to make each week its own block. Then parents can choose any number of weeks they want. \n\n\nHow to structure it for a 10‑week programme:\n\n\n\n\n- Create the class and generate the 10 weekly sessions.\n\n- Assign each session to its own block:\n• Week 1\n• Week 2\n• Week 3\n• …\n• Week 10\n\n- In Price and Payment, enable online registration for each block and set the price per week. \n\n\nWhat parents see when booking:\n\n\n\n\n- They can select any combination of weeks (for example: Week 1, 3, 5, 7, 9).\n\n- They only pay for the blocks they choose. \n\n\nTip: keep block names very clear (e.g. “Week 1”, “Week 2”) so parents easily understand what they are selecting.\n\n\nIf you want, I can also show a very common setup clubs use for 10‑week programmes that makes booking and payment much easier for parents.", "cited": ["Blocks Configuration and Management | Zooza Help", "Blocks creation | Zooza Help", "Blocks (Term Segments) FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any additional help setting up the weekly blocks or payment options, I’m here to help. Would you like to share more about how you want parents to choose and pay for the weeks?", "cited": []}], "verdict": "check", "vtitle": "Programme where clients pick dates → PAYG or blocks", "vnote": "KB-sourced. Fine.", "cat": "programmes"}, {"channel": "intercom", "id": "215475979875400", "date": "2026-09-17 13:41", "day": "2026-09-17", "human": false, "bucket": "D_assumed_with_kb", "reask": 6, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Zooza App Navigation Map | Zooza Help", "Zooza Sites | Zooza Help", "Customizing widgets | Zooza Help", "Booking Widget FAQ | Zooza Help", "Beautiful Websites with a Simple Click - Zooza", "Settings | Zooza Help"], "q": "my zooza site shows the text as white which is hard to read, how do i change text colour", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "my zooza site shows the text as white which is hard to read, how do i change text colour", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Short answer: you can’t change the text colour directly in the Zooza admin.\n\n\nZooza Sites use fixed templates with a predefined colour palette, and there’s no custom colour picker for text or other elements. You can only choose a template whose palette already fits your design. \n\n\nIf the text appears white and hard to read, the usual options are:\n\n\n\n\n- Switch to a different template with a darker text colour.\n\n- If you’re using embedded widgets (booking form, calendar, etc.), colour changes require custom CSS on your website, handled by your web developer.  \n\n\nSo this isn’t something you can adjust inside the Zooza settings panel itself.\n\n\nIf you want, I can also show you how to pick a template that usually gives better readability.", "cited": ["Zooza Sites | Zooza Help", "Customizing widgets | Zooza Help", "Booking Widget FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "how do i find general settings", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can find it in the main settings area.\n\n\n\n\n- Go to Team & Settings in the left menu\n\n- Click Settings\n\n\n- Then select General\n\n\nThis opens the General settings page where you can manage things like account details, programme settings, session settings, and calendar settings. \n\n\nIf you’re working with a Zooza Site, some page settings (like web page settings) are also located inside this General section.", "cited": ["Settings | Zooza Help", "Zooza Sites | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "its not there", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Got it — thanks for checking.\n\n\nNormally, General settings are here:\n\n\n\n\n- Go to Team & Settings → Settings\n\n\n- Then click General in the settings tiles\n\n\nIf you’re working with a Zooza Site, there’s also a separate area:\n\n\n\n\n- Go to Settings → Zooza Sites\n\n\n- Then open Web page → General settings\n\n\nQuick question so I can guide you exactly:\n\n\nWhich page are you on right now in the admin (for example: Settings, Zooza Sites, Programmes, etc.)?", "cited": ["Settings | Zooza Help", "Zooza Sites | Zooza Help"]}, {"role": "customer", "who": "Sam Davis", "text": "theres no setting to change colour here", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You’re in the right place — and your screenshots confirm it. There is no text colour setting in that General settings page. \n\n\nThat’s expected behaviour. In Zooza Sites, the colour palette is fixed per template, and there’s no colour picker for text or other elements. \n\n\nSo what you’re seeing (white text on a light background) is coming from the template itself, not a setting you can change.\n\n\nYour options are:\n\n\n\n\n- Switch to a different template with darker text\n\n- Or use custom CSS on your website (developer-level change) \n\n\nIf you want, I can help you pick a template that’s easier to read.", "cited": ["Zooza Sites | Zooza Help", "Customizing widgets | Zooza Help", "Booking Widget FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "how do i switch template", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can switch the template from the Zooza Site settings area.\n\n\nSteps:\n\n\n\n\n- Go to Settings\n\n\n- Click Zooza Site\n\n\n- Open Theme\n\n\n- Choose one of the available templates/themes and save\n\nEach template comes with a fixed colour palette, so you can’t manually pick text colours. You simply select the template whose palette fits your design best. \n\n\nIf you want, I can also explain which templates usually give the best readability for text.", "cited": ["Zooza Sites | Zooza Help", "Beautiful Websites with a Simple Click - Zooza"]}, {"role": "bot", "who": "Zooza Support", "text": "Was that helpful?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "- Go to Settings where is this???", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You’ll find Settings in the left‑hand menu of the Zooza admin.\n\n\nSteps:\n\n\n\n\n- Look at the left sidebar in your Zooza dashboard.\n\n- Click Team & Settings.\n\n- Then click Settings.\n\nThis opens the Settings hub with tiles like General, Payments, Locations, and Zooza Sites.\n\n\nOnce inside Settings, you can open Zooza Sites → Templates to choose a different template.\n\n\nIf you want, I can also show you exactly where the Templates button appears once you’re inside Zooza Sites.", "cited": ["Settings | Zooza Help", "Zooza App Navigation Map | Zooza Help", "Zooza Sites | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You’re very close — the template option is just one level deeper.\n\n\nFrom your screenshot, you’re already in Team & Settings → General.\n\n\nNow do this:\n\n\n\n\n- Go back one step to Team & Settings\n\n\n- Click Zooza Sites (under the “Other” section)\n\n- Open Web page\n\n\n- Then go to Templates\n\n\nThat’s where you can choose a different template. Each one has a fixed colour palette, so you can’t manually change text colours — you just pick the template whose colours work best. \n\n\nIf you want, I can also show you which templates usually give the best readability for text.", "cited": ["Zooza Sites | Zooza Help", "Beautiful Websites with a Simple Click - Zooza"]}, {"role": "bot", "who": "Zooza Support", "text": "Does this clarify things?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You’re on the correct Zooza Sites → General settings page. The template selector is just one step deeper. \n\n\nFrom this screen:\n\n\n\n\n- Click Edit on the General settings card\n\n- This opens the page settings overview\n\n- In that view you’ll see tabs/sections like:\n• General settings\n• Domain\n• Templates\n• Contact settings\n\nOpen Templates to choose one of the available templates. Each template has a fixed colour palette, so you select the template rather than changing colours manually.\n\n\nIf you want, I can also explain how to preview the templates before choosing one.", "cited": ["Zooza Sites | Zooza Help", "Beautiful Websites with a Simple Click - Zooza"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You’re on the correct Settings → Zooza Sites page. The template selector is just one step deeper. \n\n\nFrom this screen:\n\n\n\n\n- Click Edit on the General settings card\n\n- This opens the site settings editor\n\n- In that editor you’ll see sections like:\n• General settings\n• Domain\n• Templates\n• Contact settings\n\nOpen Templates to choose one of the available templates. Each template has a fixed colour palette, so you select the template rather than changing colours manually. \n\n\nIf you want, I can also explain how to preview the templates before choosing one.", "cited": ["Zooza Sites | Zooza Help", "Beautiful Websites with a Simple Click - Zooza"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help finding the template options, I’m here to help. Would you like to share what appears after clicking Edit on the General settings card?", "cited": []}], "verdict": "verify", "vtitle": "Zooza Sites text colour — bot: no colour setting, switch template; navigation loop", "vnote": "Michal: is there a colour/theme setting on Zooza Sites? Not written.", "cat": "widgets"}, {"channel": "intercom", "id": "215475927843773", "date": "2026-09-17 13:38", "day": "2026-09-17", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Stripe Integration FAQ | Zooza Help", "Clients | Zooza Help", "Products | Zooza Help", "Bookings | Zooza Help", "Integrations | Zooza Help", "Set up how Zooza collects money from clients | Zooza Help"], "q": "which session time is liv eltinay attending on a monday", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Sarah Bell-Woods", "text": "which session time is liv eltinay attending on a monday", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I can’t see individual client bookings, but you can check this quickly in the client record.\n\n\n\n\n- Go to Clients and open Liv Eltinay’s profile.\n\n- Open the Bookings tab.\n\n- In the booking card, look at Programme / Class — it shows the day and time of the class they’re enrolled in. \n\n\nIf you want to see the exact Monday session time, open the booking and go to the Attendance tab. Each session row shows the date and time (for example “Monday, 18:00”). \n\n\nIf you want, I can also show you the fastest way to find all Monday sessions in one place.", "cited": ["Clients | Zooza Help", "Bookings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help finding Liv Eltinay’s Monday session time, I’m here to help. Would you like to share more about what you’re trying to find?", "cited": []}, {"role": "customer", "who": "Sarah Bell-Woods", "text": "what is stripe connect", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Stripe Connect lets you connect your own Stripe account to Zooza so you can accept online card payments from clients. \n\n\nKey points:\n\n\n\n\n- Clients pay by card directly through Stripe.\n\n- The money goes directly to your Stripe account, not through Zooza. \n\n\n- You manage payouts, refunds, and reporting in your Stripe dashboard. \n\n\n- Zooza does not add extra commission - you only pay Stripe’s normal processing fees.\n\nIn short: it gives you full control of your card payments and payouts through your own Stripe account.", "cited": ["Products | Zooza Help", "Integrations | Zooza Help", "Stripe Integration FAQ | Zooza Help", "Set up how Zooza collects money from clients | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help understanding Stripe Connect or how it relates to your Zooza setup, I’m here to help. Would you like to share more about what you’re trying to understand?", "cited": []}], "verdict": "noise", "vtitle": "Which session a client attends", "vnote": "—", "cat": "clients"}, {"channel": "intercom", "id": "215475929175542", "date": "2026-09-17 13:29", "day": "2026-09-17", "human": true, "bucket": "HUMAN", "reask": 3, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Getting Started with Zooza | Zooza Help", "Client Profile FAQ | Zooza Help", "Bookings | Zooza Help"], "q": "chcem zrusit zastupovanie, ako to urobit", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "online tím MBA", "text": "chcem zrusit zastupovanie, ako to urobit", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak chcete zrušiť zastupovanie (rezerváciu), urobíte to priamo v rezervácii:\n\n\n\n\n- Otvorte Bookings\n\n\n- Vyberte danú rezerváciu\n\n- V detailu kliknite Cancel booking\n\n\n- Vyberte, či chcete zrušiť ihneď alebo naplánovať zrušenie na budúci dátum \n\n\nPo zrušení sa miesto uvoľní pre iného klienta a história aj platby zostanú v systéme uložené. \n\n\nDôležité: klient si túto rezerváciu nemôže zrušiť sám – to môže urobiť len administrátor. \n\n\nAk chcete, môžem vám tiež ukázať, ako zrušenie naplánovať na budúci dátum (napr. keď klient dá výpoveď).", "cited": ["Getting Started with Zooza | Zooza Help", "Client Profile FAQ | Zooza Help", "Bookings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den, zrusit zastupovanie sa da priamo na detaile terminu, kde spravujete dochadzku", "cited": []}, {"role": "customer", "who": "online tím MBA", "text": "napis mi vsetky mozne terminy pre 5, rocnik ZS na tento skolsky rok v pobocke online kde je lektor prideleny a skupina nie je plna (treba pozerat aj poznamky na skupinach lebo su tam plus deti co nemaju registracie.", "cited": []}, {"role": "customer", "who": "online tím MBA", "text": "Ignoruj odkaz", "cited": []}], "verdict": "gap", "vtitle": "Cancel an instructor substitution — on the session detail where attendance is managed", "vnote": "Bot treated 'zastupovanie' as a booking. WRITTEN: instructor-substitution.md line + dictionary keyword.", "cat": "team"}, {"channel": "intercom", "id": "215475930519953", "date": "2026-09-17 13:23", "day": "2026-09-17", "human": true, "bucket": "HUMAN", "reask": 5, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Developer Docs | Zooza Developer Docs", "API overview | Zooza Developer Docs", "Authentication | Zooza Developer Docs", "Features — Zooza", "API Integration for Booking | Zooza", "Pricing — Zooza", "For Developers — Zooza", "Quickstart | Zooza Developer Docs"], "q": "Do we have API access?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Wie kann ich helfen?", "cited": []}, {"role": "customer", "who": "Helen Doron", "text": "Do we have API access?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — we provide API access.\n\n\n\n\n- We offer a REST API that gives programmatic access to Zooza data such as registrations, classes, payments, attendance, and clients. \n\n\n- It’s designed for custom integrations, admin tools, automation, or syncing data with external systems. \n\n\n- The API is documented and versioned, with endpoints and examples available in our developer docs. \n\n\nTo use the REST API, you’ll need a REST API key and client secret, which are requested separately from widget API keys. \n\n\nYou can also use embeddable widgets if you just want to add booking forms or calendars to your website without coding.", "cited": ["Quickstart | Zooza Developer Docs", "For Developers — Zooza", "Developer Docs | Zooza Developer Docs", "API Integration for Booking | Zooza", "Authentication | Zooza Developer Docs", "API overview | Zooza Developer Docs"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Helen Doron", "text": "is it included in our plan?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — API access is included in all plans.\n\n\nThe open REST API is part of the core feature set, so it is available regardless of which package you are on. The main difference between plans is the number of active clients and monthly email allowance, not access to the API itself. \n\n\nYou can use the API to build custom integrations, automate workflows, or sync data with external systems. \n\n\nIf you want, I can also show you where to request the REST API key and client secret needed to start using it.", "cited": ["Pricing — Zooza", "Features — Zooza"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi, API Access is available for everyone regardless of the plan. However it is not automatically enabled.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "If you want to use API access, we can enable it for you", "cited": []}, {"role": "customer", "who": "Helen Doron", "text": "Hi Martin, yes, we are building an automatisation with Seatable, where we would draw data from Zooza - a friend of mine is building the architecture with her AI \"Team\", so that we don't have to continue semi-manually update 4 different places.", "cited": []}, {"role": "customer", "who": "Helen Doron", "text": "Furthermore there seems to be a dev problem - in the screenshot we see 3 registrations for Philipp Teufel, however the boy is only 3 - and the lower two were registrations for his sister Helene, but her name is gone and only his shows, even though the mom only registered him fresh yesterday. Please check. Thanks!!", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi, that is great use case. Your api key is: inieP2j1mWgxu and client secret: u7wyjajOzHBa5M2ZMgW7YntLV9r9AmKi\n\n\nYou can find documentation here: https://docs.zooza.online/api/ To make successful calls you would also need to select a user account. The API accesses resources on behalf of existing user. So for example if you would write an attendance record - it would write an audit log for whatever email is logged in via API. To distinguish operations made via API we recommend that you create a \"technical\" user in the app. Simply add new owner with a generic email such as api@helendoron.at and use this email when making requests via API. It will make things much clearer when something will need to be investigated (why something happened, who changed what etc.)\nAlso two crucial things:\n\n\n1) Zooza has much more apis than documented so feel free to ask if you get stuck on the business case you're solving, we can provide guidance. The documented API's are the most commonly used.\n\n\n2) The vocabulary that we use is highly specific to our business domain. Many developers can't distinguish between parameters such as capacity, duration, registration_cap or other terms that are virtually unknown to them as they typically work on software such as payment gateways or other commonly used integrations. I'm trying to convey here that there might be a point where certain knowledge on how Zooza works and how children activities work will be necessary so again - we're here to assist so feel free to connect your dev guys directly to us.\n\n\n\n\n\nWe do also have an MCP connector for AI's so if you are looking for perhaps low code/no code integration this might be easier route than creating full fledged integration via APIs.\n\nLastly - for your question about the kids - this is actually quite possible to do from the parent's perspective. When they create new booking they have the option of selecting their existing child or creating the booking for someone else. From time to time some parents will do this: From the list of children they'd pick up Martin, but then subsequently change his name to Anna. This will obviously change all associated bookings from Martin to Anna. To correct this, simply navigate to the booking, in the Attendee card click change button and either create new attendee or change it for the correct one.\n\n\nAll the best and looking forward to see what you'll build.", "cited": []}, {"role": "customer", "who": "Helen Doron", "text": "Fantastic - thanks so much, Martin. I'll pass this on. We have based the Zooza datastructure on the registration export that I do to Excel regularly. Further data needed will be the attendance protocols that teachers do, so that we have that info in Seatable as well.\n\nusing a user like zooza-api-linz@helendoron.at is a very good idea to sort out who does what. Thanks for that also.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Great. don't hesitate to reach out or pass our contact to your dev guys. We'll be more than happy to help. The attendance data can be fetched either by registration or by session. like this:\n# Attendance for one registration (all sessions of that booking)\n\n\ncurl 'https://api.zooza.app/v1/registrations/{REGISTRATION_ID}/attendance' \\\n\n\n-H 'Accept: application/json' \\\n\n\n-H 'X-ZOOZA-API-KEY: {YOUR_API_KEY}' \\\n\n\n-H 'X-ZOOZA-TOKEN: {YOUR_USER_TOKEN}' \\\n\n\n-H 'X-ZOOZA-COMPANY: {YOUR_COMPANY_ID}'\n\n\n\n\n\n# Attendance for one session (all participants of that event)\n\n\ncurl 'https://api.zooza.app/v1/attendance?event_id={EVENT_ID}' \\\n\n\n-H 'Accept: application/json' \\\n\n\n-H 'X-ZOOZA-API-KEY: {YOUR_API_KEY}' \\\n\n\n-H 'X-ZOOZA-TOKEN: {YOUR_USER_TOKEN}' \\\n\n\n-H 'X-ZOOZA-COMPANY: {YOUR_COMPANY_ID}'", "cited": []}], "verdict": "gap", "vtitle": "REST API available on all plans but not enabled by default; request via support; use a technical user", "vnote": "Bot omitted 'must be enabled'. WRITTEN: deploying-zooza-on-website.md.", "cat": "account"}, {"channel": "intercom", "id": "215475946500168", "date": "2026-09-17 13:23", "day": "2026-09-17", "human": true, "bucket": "HUMAN", "reask": 17, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": ["Manage trial bookings — reschedule, convert, and close | Zooza Help", "Programme Automations | Zooza Help", "Registration and Booking FAQ | Zooza Help", "Trial Classes FAQ | Zooza Help", "When to enrol clients yourself vs. send them a booking link | Zooza Help"], "q": "I'm trying to choose a trial date for a demo session for a lead, but I can't do it because the step where the available dates appear is no longer there. Please help", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "I'm trying to choose a trial date for a demo session for a lead, but I can't do it because the step where the available dates appear is no longer there. Please help", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "This usually happens when no trial dates are available or when the trial is not configured in the programme. \n\n\nPlease check this first:\n\n\n\n\n- Go to Programme → Settings → Trial → Edit\n\n\n- Make sure the trial is enabled\n\n\n- Confirm that classes are included in the trial\n\n- Check that those classes still have free capacity\n\n\nIf all included classes are full, the booking form will not show any trial dates.\n\n\nAlso note: trial dates are normally selected by the client on the booking form. Admins cannot manually choose the trial date when creating the booking. \n\n\nQuick question so I can guide you better: which page are you on right now when you try to book the trial for the lead?", "cited": ["Trial Classes FAQ | Zooza Help", "Programme Automations | Zooza Help", "When to enrol clients yourself vs. send them a booking link | Zooza Help"]}, {"role": "customer", "who": "Mara Bortea", "text": "the one where I choose the group", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "What you’re seeing is expected. On the group selection screen, trial dates do not appear. Trial dates are only shown on the booking form, where the client chooses the session. \n\n\nAlso, admins cannot manually pick a trial date when creating a booking. Trials must be submitted by the client through the booking form. \n\n\nWhat you can do instead:\n\n\n\n\n- Send the client the booking link so they can choose their trial date.\n\n- Or create a regular booking for them and later convert it to a trial from the booking detail. \n\n\nIf you want, I can also show you the quickest way to convert a regular booking into a trial after creating it.", "cited": ["Trial Classes FAQ | Zooza Help", "When to enrol clients yourself vs. send them a booking link | Zooza Help", "Manage trial bookings — reschedule, convert, and close | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "what?!!!", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I know this feels confusing — what you’re seeing is actually how trials are designed to work.\n\n\n\n\n- \nTrial dates only appear on the booking form, not on the group selection screen.\n\n- \nAdmins cannot manually choose a trial date when creating a booking.\n\n- Trials must be submitted by the client through the booking form.\n\n\nSo the step you expected (picking a trial date as an admin) doesn’t exist in the system.\n\n\nWhat you can do instead:\n\n\n\n\n- Send the client the booking link so they choose their trial date, or\n\n- Create a regular booking and later convert it to a trial.\n\n\nIf you want, I can also show you the quickest way to convert a regular booking into a trial after creating it.", "cited": ["Trial Classes FAQ | Zooza Help", "When to enrol clients yourself vs. send them a booking link | Zooza Help", "Manage trial bookings — reschedule, convert, and close | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "since when?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Good question — this isn’t a recent change.\n\n\nIn Zooza, trial bookings have always been client-initiated. That means:\n\n\n\n\n- Trial dates are only shown on the booking form\n\n\n- The client selects the date themselves\n\n\n- Admins cannot manually create or choose a trial booking\n\n\nThis is by design. The only bookings admins can create directly are standard enrolments, not trials.\n\n\nSo the step you expected (picking a trial date as an admin) has never existed in the system — it’s just that the workflow may feel different depending on how you’re used to handling trials.", "cited": ["Trial Classes FAQ | Zooza Help", "Manage trial bookings — reschedule, convert, and close | Zooza Help", "When to enrol clients yourself vs. send them a booking link | Zooza Help", "Registration and Booking FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Does this clarify things?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "come on", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I understand this might be frustrating. Would you like me to connect you with a human agent? Or if you prefer, you can share more details and I’ll do my best to assist you further.", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "yes please", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I will connect you with someone from our team shortly. Meanwhile, could you please share any additional details about your issue? This will help them assist you more efficiently.", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "there are no additional details. we are trying to ook a demo session just like we used to", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "*book", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Mara, can you please guide me where are you having issues? I'm not exactly sure which step/screen are you stuck on", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Hi Martin! For booking a demo session, the previous steps were: Trial not started/Choose trial date/Choose class/Choose date/Trial started.\n\n\nNow, after choosing a class, we need to complete the process and book a session from Attendance afterwards.\n\n\nCan we please go back to: Choose class/Choose date/Trial started?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "(choose life, choose a career, choose a family :))", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "haha:)", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "I'm not aware of any changes to this to be honest", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "So it is either some kind of a bug or something else entirely", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Are you able to make a screenshot? or somehow navigate me what is missing?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ok, so you have a registration in the st d": []}, {"role": "customer", "who": "Mara Bortea", "text": "You guys are on fire! Thanks so much!", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "No. We thank you for your work Mara and everything you do for the next generation", "cited": []}], "verdict": "product", "vtitle": "Trial-session picker missing on the booking Change screen — fault, fixed; bot insisted admins cannot pick trial dates", "vnote": "Admin path confirmed by Michal (screenshot): booking → Change status → Convert to trial. trials-faq + booking-faq rewritten to match the UI.", "cat": "trials"}, {"channel": "intercom", "id": "215475975655506", "date": "2026-09-17 13:13", "day": "2026-09-17", "human": true, "bucket": "HUMAN", "reask": 4, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Payment Correction vs Refund Guide | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Bookings | Zooza Help", "Edit payment on booking | Zooza Help", "Payment tile on booking | Zooza Help"], "q": "Dobrý den ak p Ferodcak 531553 chce urobil uhradu za svoje 2 dievčata cez jeden učet v a chce to teraz rozdeliť na obidva učty dievčať napoly ako to mam urobiť", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": "Dušan Frimer", "text": "Dobrý den ak p Ferodcak 531553 chce urobil uhradu za svoje 2 dievčata cez jeden učet v a chce to teraz rozdeliť na obidva učty dievčať napoly ako to mam urobiť", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Tento případ vyřešíte přesunutím platby z jedné rezervace na druhou.\n\n\nPostup:\n\n\n\n\n- Otevřete Bookings a najděte rezervaci, kde je platba nyní.\n\n- V sekci Payments najděte danou transakci.\n\n- Klikněte na More (⋯) vedle platby.\n\n- Vyberte Move payment.\n\n- Vyberte rezervaci druhého dítěte a potvrďte přesun. \n\n\nPokud chcete platbu rozdělit napůl, upravte nejdříve amount owed na obou rezervacích (např. každá polovina), a poté přesuňte část platby na druhou rezervaci. \n\n\nTip: pro budoucí sourozence můžete také použít linked bookings, aby se platby spravovaly přehledněji.", "cited": ["Payment Correction vs Refund Guide | Zooza Help", "Edit payment on booking | Zooza Help", "Bookings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Hledali jste tohle?", "cited": []}, {"role": "customer", "who": "Dušan Frimer", "text": "ano toto ako ju mam rozdeliť na poly pis po slovensky", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak chcete platbu rozdeliť napôl, musíte najprv upraviť dlžné částky na oboch rezerváciách a potom presunúť časť platby.\n\n\nPostup:\n\n\n\n\n- Otvorte rezerváciu, kde je platba teraz.\n\n- V časti Payments upravte Amount owed na polovinu (napr. z 100 € na 50 €).\n\n- Otvorte rezerváciu druhého dieťaťa a tiež nastavte Amount owed na 50 €.\n\n- V prvej rezervácii kliknite na More (⋯) u platby a vyberte Move payment.\n\n- Vyberte rezerváciu druhého dieťaťa a presuňte časť platby. \n\n\nTýmto sa platba rozdeli medzi obe rezervácie.\n\n\nTip: ak máte viac súrodených, môžete ich tiež linkovať, aby ste mali ich rezervácie a platby prehľadnejšie.", "cited": ["Payment tile on booking | Zooza Help", "Edit payment on booking | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Dostali jste odpověď na svou otázku?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak budete potrebovať ďalšiu pomoc s rozdelením platby medzi rezervácie, som tu pre vás. Chcete doplniť, s ktorým krokom máte problém?", "cited": []}, {"role": "customer", "who": "Dušan Frimer", "text": "ANO NIE UROBIL SOM TO PODLA POKYNOV A NEIDE TO", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumím – pokud jste postupoval podle kroků a Move payment nefunguje, většinou je to jedním z těchto důvodů:\n\n\n\n\n- \nPlatba už má úpravu nebo refund – v tom případě ji nelze přesunout. \n\n\n- \nCílová rezervace nemá vlastní platby (dědí je z jiné rezervace) – pak je potřeba přesunout platbu přímo na tu rezervaci, která platby spravuje.\n\n- \nDluh (Amount owed) na obou rezervacích musí být nastavený správně před přesunem. \n\n\nMůžete prosím napsat, co přesně se stane, když kliknete na More → Move payment? (např. tlačítko je šedé, nebo se objeví chyba). Podle toho půjde přesněji poradit.", "cited": ["Bookings | Zooza Help", "Payment Correction vs Refund Guide | Zooza Help", "Edit payment on booking | Zooza Help"]}, {"role": "customer", "who": "Dušan Frimer", "text": "PLATBA bola uz uhradené cez hlavný učet jedného dieťaťa a na druhý ju nemozno presunuť.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumím. V tomto případě je problém pravděpodobně v tom, že druhá rezervace nevede vlastní platby (dědí je z jiné rezervace). Pak systém platbu na ni přesunout nedovolí. \n\n\nŘešení je použít úpravu dluhu (debt correction) místo přesunu platby:\n\n\n\n\n- Na rezervaci, kde je platba nyní, snížte Amount owed na polovinu.\n\n- Na rezervaci druhého dítěte nastavte Amount owed také na polovinu.\n\n- Tím rozdělíte dluh mezi dvě rezervace, aniž by se skutečně přesouvaly peníze. \n\n\nTento postup je doporučený, když chcete platbu přiřadit jinému účtu. \n\n\nPokud chcete, můžete mi ještě napsat:\n\n\n\n\n- zda je u druhého dítěte zapnuté sdílení plateb z jiné rezervace\n\n\n- nebo poslat screenshot z Payments na obou rezervacích\n\nPodle toho půjde přesněji určit, kde je problém.", "cited": ["Bookings | Zooza Help", "Payment Correction vs Refund Guide | Zooza Help", "Edit payment on booking | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Pomohlo vám to?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc s rozdelením už uhradenej platby, pokojne pokračujte v konverzácii. Chcete opísať, čo sa zobrazí pri pokuse upraviť sumu alebo presunúť platbu?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "tex n- považuje mesiac za obdobie 1.–31.\n\n\n- ak klient vstupuje počas mesiaca, vypočíta len časť mesačnej ceny\n\n\n- od ďalšieho mesiaca už ide plná suma \n\n\nPreto sa môže stať, že:\n\n\n\n\n- kvartálna suma je 85 €\n\n\n- ale prvý mesiac je pomerný\n\n\n- výsledná kvartálna suma sa zníži (napr. o ~7,47 €)\n\nTento efekt sa dá zabrániť nastavením Aliquot price calculation → Full programme price, keď chcete, aby každá úhrada bola rovnaká bez ohľadu na dátum registrácie.\n\n\nAk chcete, môžeme spolu skontrolovať ešte jedno: či v šablóne je Aliquot ON alebo OFF, pretože práve toto rozhoduje, či sa prvá úhrada pomerne zníži.", "cited": ["Payments and Billing FAQ | Zooza Help", "Late bookings (pro-rata management) | Zooza Help", "Add a one-off scheduled payment | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Bolo to užitočné?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "skontroluj", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Peter, bohužiaľ nemôžem skontrolovať vaše nastavenie priamo. Ale môžete si to rýchlo overiť v programe.\n\n\nIdite do:\n\n\nProgramme → Price and Payment → Advanced settings\n\n\nTam hľadajte pole Aliquot price calculation.\n\n\n\n\n- \nAliquot ON → systém vypočítáva prvú úhradu pomerne podľa zostávajúcich tréningov v mesiaci.\n\n- \nAliquot OFF → každá úhrada je rovnaká, bez ohľadu na dátum registrácie.\n\nPri Aliquot ON sa práve stáva, že prvá úhrada je nižšia (ako vám systém vypočítal o ~7,47 € menej).\n\n\nAk chcete, môžeme spolu pozrieť ešte jedno: či v programe je Aliquot ON alebo OFF – to je najčastejšia príčina rozdielu v prvom kvartáli.", "cited": ["Payments and Billing FAQ | Zooza Help", "FAQ — Programmes | Zooza Help", "Programme Settings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Bolo to užitočné?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc s overením nastavenia alebo výpočtu ceny, som vám k dispozícii. for you! 😊", "cited": []}, {"role": "customer", "who": "barbora zajacova", "text": "one more thing", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Of course! Please feel free to ask your question, and I will do my best to assist you further.", "cited": []}, {"role": "customer", "who": "barbora zajacova", "text": "are there any conditions under which the absence will not be able to be deleted ?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Nie – absence sa v podstate vždy dá vymazať. Nie sú žiadne špeciálne podmienky, ktoré by jej vymazanie blokovali. \n\n\nJediné obmedzenie sa týka romadného vymazania:\n\n\n\n\n- viac absencií môžete vymazať naraz len v rámci jedného mesiaca\n\n\n- ak prejdete do ďalšieho mesiaca, výber sa zruší.\n\nDôležité je ešte vedieť, že vymazanie absence nepresunie ani neodstráni už existujúce lekcie v kalendári – tie ostanú naplánované a je potrebné ich prípadne ručne priradiť inému instruktorovi.\n\n\nAk chcete, môžem vám ukázať aj rýchly spôsob, ako po vymazaní absence skontrolovať a prepísať už naplánované lekcie.\n\n\n\nSource:\nInstructors working hours | Zooza Help", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "barbora zajacova", "text": "no thanks.", "cited": []}, {"role": "customer", "who": "barbora zajacova", "text": "yes :-)", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I understand. Please feel free to reach out whenever you have more questions or need further assistance. I'm here to help! 😊", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I'm glad to hear that! If you have any more questions or need further assistance, please feel free to ask. I'm here to help! 😊", "cited": []}], "verdict": "gap", "vtitle": "Delete an absence; 'conditions under which it cannot be deleted' → the availability-management mode", "vnote": "Covered by the working-hours write-up.", "cat": "t
