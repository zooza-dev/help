bucket": "D_assumed_with_kb", "reask": 1, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["VAT management | Zooza Help", "Xero Integration | Zooza Help"], "q": "Why is VAT not showing on the invoice?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Why is VAT not showing on the invoice?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "VAT usually doesn’t appear on invoices because it isn’t enabled in the Invoice Profile yet. \n\n\nPlease check this:\n\n\n\n\n- Go to Settings → Invoice Profiles\n\n\n- Open the invoice profile you’re using\n\n- Enable VAT payer\n\n\n- Select the correct VAT rate\n\n\n- Tick Display VAT payment on invoice\n\n\nIf that option isn’t ticked, VAT won’t show on the invoice even if a VAT rate exists.\n\n\nAlso make sure a VAT level is created in Settings → Invoicing → VAT, otherwise there’s nothing to apply to invoices.\n\n\nIf you want, I can also show you a quick way to double‑check that the VAT rate is actually applied to the booking when the invoice is generated.", "cited": ["VAT management | Zooza Help", "Xero Integration | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help with VAT settings or invoice display, I’m here to assist. Would you like to share more about what you’re trying to check?", "cited": []}], "verdict": "check", "vtitle": "VAT not on invoice → invoice profile VAT payer + display toggle", "vnote": "KB-sourced. Fine.", "cat": "payments"}, {"channel": "email", "id": "email-1a0a047ad5cbf18c", "date": "2026-09-16T04:43:00", "day": "2026-09-16", "human": true, "bucket": "EMAIL", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Zooza_New_Centre_Setup_Form_Woodford.xlsx", "turns": [{"role": "customer", "who": "Sarah Marsh", "text": "Another centre for set-up (Woodford).", "cited": []}, {"role": "human", "who": "Michal Dodok", "text": "Woodford set up from the form.", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "The request to set trials as Extra Capacity was missed. Don't we have one widget for the website?", "cited": []}, {"role": "human", "who": "Michal Dodok", "text": "Trials as Extra Capacity — on us, added to the setup script. The shared piece is the Parent Zone.", "cited": []}], "verdict": "client", "vtitle": "", "vnote": "", "cat": "programmes", "from": "Sarah Marsh (MagiKats)"}, {"channel": "intercom", "id": "215475930064441", "date": "2026-09-16 20:51", "day": "2026-09-16", "human": true, "bucket": "HUMAN", "reask": 20, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Registration statuses — what each one means | Zooza Help"], "q": "Why has lorenzo599@gmail.com not been charged?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "Why has lorenzo599@gmail.com not been charged?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I can’t check or explain the situation for a specific client or booking (like lorenzo599@gmail.com) because I don’t have access to customer data.\n\n\nIn general, when a booking exists but no charge appears, it usually means the parent has not finished the payment step yet. The booking is created first, and the payment happens afterwards, so an unpaid booking is very common and not a system error.\n\n\nIf you want, you can open the booking and check the Payments tab to see whether a payment attempt exists or if the status shows something like Awaiting payment. \n\n\n\nSource:\nRegistration statuses — what each one means | Zooza Help", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help with this payment issue, I’m here to assist, and I’m sorry I can’t review the specific booking details. Would you like to share more about what you’re trying to understand?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Sam, we'll need to look at this. It does not seem that the payment request was created properly. Perhaps it will have something to do with the Stripe account not cooperating across regions. I can see that you have only one booking that is paid and that was at september 1st. Let me get back to you.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Sam, the reason why this customer was not billed is because the payment gateway is not connected. Can you please look up the Team and Settings -> Integrations -> Stripe tab and check out the status of the connection? the last connection you have was created 28th August and was revoked 5th of September", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "The revoking can happen from the Stripe's end as a result of user request (an account admin)", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "once you reconnect the payment gateway parents will be able to pay for the bookings from their customer portal", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "Thanks for looking into this Martin", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "Let me follow your instructions and get back to you", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "No worries Sam, please let us know if anything is needed from our end.", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "it says status on stripe connect NO", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "and it shows country of stripe account ITALIA", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "So i should change that country to UK?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "My stripe/zooza account is UK registered", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Yes as I mentioned the access has been revoked. There is no reason mentioned there for revoking so I can't tell you why it was revoked", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Then simply select the UK as a country", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "And proceed to onboarding", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "If your Stripe account is approved and ready this should be fairly simple and quick", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "But it would be good to find out why the access was revoked in the first place", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "Hi Martin, trying to reconnect the stripe and it won't allow me to select EUR, I checked with stripe's ai chatbot and it said to speak to Zooza", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "the bank account is setup in EUR and accepts EUR as this is the one we've always used in italy", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Sam, I don't want to transfer you back to stripe as a hot potato, but effectively your stripe account dictates the currency based on the region. I think that because we started the onboarding with the UK as a region - that is the reason why it does not allow you to access euro as a currency. Let me investigate with our tech team whether there is something else we can do to affect the onboarding process and perhaps pre-select EUR as a currency. But we'll need to research this against stripe. Do you remember back in August what currency did that account use? because we did not change the integration since then", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "Hi Martin, it's showing that stripe is connected. I was going to call stripe but I might hold off for now as it seems to be working. For those customers who's payments failed, how do I get the system to retry the payment?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Sam, but even though if it is connected - you should check out the currency on your stripe dashboard. Zooza will set the currency to EUR because that is the region you're operating on but that won't stop Stripe charging in pounds. So just please double check that. As for the payment link - just send them to parent portal. They'll see unpaid bookings and are able to make a payment directly from the dashboard", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "If you want you can email them a link with this merge var: *|WIDGET_PROFILE_URL|* that will generate unique link for every parent to their customer portal without the need to log in.", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "I checked the currency on stripe and its definitely EUR", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "How do I send them to the parent portal? is there a specific link?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "That is great - re EUR. And yes the link is rendered via merge var: WIDGET_PROFILE_URL", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "The easiest way to do this is to create a User template. In the template body - insert a link something like: You can access your customer portal on our website to pay.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "You would highlight the words customer portal, hit the URL button in the editor's toolbar", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "And enter: *|WIDGET_PROFILE_URL|*", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "Thank you, I've sent those out to the affected parents", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "Hi Martin", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "I tried to do the parent portal and a parent is getting this screen", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "also", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Sam, The URL which Zooza will send to parents needs to match the actual physical location of the widget. So for example your widget is published on : https://www.elizabethsamuelsdrama.it/parent-portal", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Then your settings need to reflect that. So please navigate to Team and settings -> Publish -> [Select widget] -> Profile and check what url is there", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "the url would need to be /parent-portal. Obviously this is just an example - so you need to match the URL with the one where the widget is actually hosted", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "Ok i've figured that out and fixed it thanks", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "Quick question about a registration that seems off - Riccardo Riganti, on LAMDA Acting Academy Wednesday's (registration_id 528773, schedule_id 101253).\n\n\nThat class has always been set up as a flat €71/month membership (nothing's been changed on the pricing), with the first month at €96 to cover the €25 annual registration fee. But Riccardo's registration is showing as awaiting payment with a debt of -167, which doesn't match either of those numbers. Any idea why the system's calculating something different for him?\n\n\nAlso, side note - his mum Claudia told me she already paid €96 on 1 September, but the booking still shows awaiting_payment, and a report I ran separately said everything was paid?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "this is what a parent just sent me when trying to pay", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Sam,\n\n\nNothing is wrong with the pricing. It's down to how membership payments are created.\n\n\nEach month's payment is created 15 days before its due date (this is the default). October's €71 is due on 1 October, so it was created on 16 September and added to Riccardo's balance:\n\n\n\n\n- €96: September (€71 plus the €25 registration fee)\n\n- €71: October\n\n- = €167\n\nhttps://zooza.app/#registrations/528773/payment_plan\n\n\n\n\n\nYou can change this in Settings → Payment settings (https://zooza.app/#settings/payment_settings). When the value is 0, the 15-day default applies.\n​\n\n\nBest regards,\nMichal", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "Thank you for clarifying this. I have a separate issue with payments in general which ive been chatting with Martin about, I have reopened my ticket regarding this", "cited": []}], "verdict": "gap", "vtitle": "Stripe revoked → no charges; reconnect; region decides currency; profile widget URL must match hosting page; membership instalment created 15 days before due (Michal)", "vnote": "WRITTEN: payments FAQ 'more debt than this month's fee' (Michal's own answer); Stripe FAQ. Profile-widget URL mismatch → 404: not written, check publish article covers it.", "cat": "payments"}, {"channel": "intercom", "id": "215475964030831", "date": "2026-09-16 18:04", "day": "2026-09-16", "human": true, "bucket": "HUMAN", "reask": 8, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": ["Login and Account FAQ | Zooza Help", "Client Profile 101 | Zooza Help", "Email Delivery Troubleshooting | Zooza Help"], "q": "Dobrý den", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Sona Ostrihonova", "text": "Dobrý den", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dobrý deň! Ako vám môžem dnes pomôcť? 😊", "cited": []}, {"role": "customer", "who": "Sona Ostrihonova", "text": "Pisem\nz firmy Charlie Academy", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dobrý deň, Charlie Academy! Ako vám môžem dnes pomôcť? 😊", "cited": []}, {"role": "customer", "who": "Sona Ostrihonova", "text": "Keď sa klient prihlási a príde mu kód, zada ho ale\ndo systému ho nepisti znova pýta mail\na zase kod a dokola\nrobi to viacerým ale nie všetkým teraz konkrétne napriklad\nemail \nuhrinovalenka@gmail.com \nskusala som\naj na svojom\npc a nefunguje nepustí má do systému", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumiem, že tato situácia s kódy a přihlašováním může být frustrující. Chcete, abych vás spojil s lidským agentem? Nebo můžete poskytnout více informací a budeme pokračovat společně.", "cited": []}, {"role": "customer", "who": "Sona Ostrihonova", "text": "Áno spoj", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumím, spojím vás s někým z našeho týmu. Mezitím mi prosím popište podrobněji, co přesně se děje, aby mohl agent rychleji pomoci.", "cited": []}, {"role": "customer", "who": "Sona Ostrihonova", "text": "Nepustí do systému klienta", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Tento problém sa často stáva, keď klient žiada nový kód viackrát. Pri každej novej žiadosti sa predchádzajúci kód okamžite zneplatní a platný je vždy len ten najnovší email. \n\n\nSkúste túto rýchlu kontrolu:\n\n\n\n\n- klient otvorí len posledný email s kódom\n\n- staršie emaily ignoruje\n\n- ak kód nefunguje, nech si pošle nový a použije ho okamžite\n\nĎalej skontrolujte:\n\n\n\n\n- spam / junk priečinok\n\n- či sa email naozaj doručil (niektorí poskytovatelia ho blokujú) \n\n\nAk chcete, môžeme sa pozrieť na jeden konkrétny príklad.\n\n\nMôžete mi poslať screenshot alebo krátke video, čo sa presne stane po zadání kódu?", "cited": ["Login and Account FAQ | Zooza Help", "Email Delivery Troubleshooting | Zooza Help", "Client Profile 101 | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Pomohla vám tato odpověď, nebo stále potřebujete pomoc?", "cited": []}, {"role": "customer", "who": "Sona Ostrihonova", "text": "Skúšal aj tak a nefungujee", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumiem vašej frustraci a hned vás spojím s naším týmem, který vám pomůže vyřešit tento problém.", "cited": []}, {"role": "customer", "who": "Sona Ostrihonova", "text": "Ok", "cited": []}, {"role": "customer", "who": "Sona Ostrihonova", "text": "Moje tel číslo je 0919293071", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, Sona, dakujeme za napisanie. Potvrdzujeme, to, co pisal Agent vyssie. Klientka sa pokusala v priebehu niekolkych minut odoslat ziadost o vygenerovanie PIN kodu. Zakazdym sa prechadzajuci kod novym zneplatni. Tu je priklad odoslaneho emailu po sebe.\n​\n\n\n\nJe na to jednoducha pomoc. V tom emaile je okrem PIN kodu aj link, ktory klienta prihlasi a jeho platnost sa nezneaktivni tak rychlo a pretrvava. \n\n\n\n\n\nNech klienta pouzije ten.", "cited": []}], "verdict": "check", "vtitle": "Login PIN loop: each new request invalidates the previous code; use the login link instead", "vnote": "KB login FAQ already had the invalidation; WRITTEN: added 'click the link, not the code' tip.", "cat": "account"}, {"channel": "intercom", "id": "215475967447133", "date": "2026-09-16 17:18", "day": "2026-09-16", "human": false, "bucket": "D_assumed_with_kb", "reask": 6, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Blocks Configuration and Management | Zooza Help", "Payment templates creation | Zooza Help", "Price and payment setup | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Blocks creation | Zooza Help"], "q": "I have a class with 2 sessions per week or one sessions per week: students can enroll for Tuesday and Thursday sessions, for Tuesday sessions or for Thursday sessions. I created corresponding blocks. Students enrolling for 2 sessions per week must pay by 8 sessions, students enrolling for 1 sessions per week must pay by 4 sessions. How do I set the payments for the blocks?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "I have a class with 2 sessions per week or one sessions per week: students can enroll for Tuesday and Thursday sessions, for Tuesday sessions or for Thursday sessions. I created corresponding blocks. Students enrolling for 2 sessions per week must pay by 8 sessions, students enrolling for 1 sessions per week must pay by 4 sessions. How do I set the payments for the blocks?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You do not need separate classes. The key is to set the price per block and attach the same payment template to both blocks.\n\n\n1. Create the blocks\n\n\n\n\n- Block A: Tuesday sessions\n\n- Block B: Thursday sessions\nEnable online registration on both. \n\n\n2. Set the price inside each block\n\n\n\n\n- Tuesday block → price for 4 sessions\n\n\n- Thursday block → price for 4 sessions\n\n\nIf a student selects both blocks, they will pay for 8 sessions total automatically.\n\n\n3. Payment template\n\n\n\n\n- Create a template at the programme level (Programme → Settings → Price and Payment → Payment templates). \n\n\n- Use Periodic Prepayment → By Block so a payment is generated before each block starts. \n\n\nResult\n\n\n\n\n- 1 block → 4 sessions\n\n- 2 blocks → 8 sessions\n\nNo extra pricing logic is needed.", "cited": ["Blocks Configuration and Management | Zooza Help", "Payment templates creation | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "think so", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I'm glad to hear that might be what you need! If you have any more questions or need further clarification, please feel free to ask. I'm here to help! 😊", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "how do I set the price inside each block?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You set the price directly inside each block.\n\n\nSteps:\n\n\n\n\n- Open the class in your programme.\n\n- Go to the Price and Payment tile.\n\n- Open the specific block (for example: Tuesday block).\n\n- Choose one of the two options:\n• Unit price → price per session (Zooza calculates the total automatically based on the number of sessions in that block).\n• Fixed price → enter the total price for the whole block.\n\n- Save the block. \n\n\nEach block can have its own price, so your Tuesday block can be 4 sessions and the Thursday block 4 sessions.\n\n\nTip: you can also add a discount per block if you want to offer a reduced price for one specific block.", "cited": ["Blocks creation | Zooza Help", "Blocks Configuration and Management | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "there are 28 Tuesday sessions and 29 Thursday session. students pay by 4 sessions if they attend only Tuesday sessions or only Thursday sessions. how do I set that?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You do not need to enter the total number of sessions (28 or 29) in the block price.\n\n\nInstead, set the price per 4 sessions on each block.\n\n\nSteps:\n\n\n\n\n- Open the class → Price and Payment tile.\n\n- Open the Tuesday block.\n\n- Choose Unit price and enter the price for 1 session.\n\n- Save.\n\nDo the same for the Thursday block.\n\n\nHow it works:\n\n\n\n\n- A student choosing Tuesday only → Zooza counts the sessions in that block and charges the unit price × number of sessions.\n\n- A student choosing both blocks → they pay for both blocks automatically. \n\n\nEach block can have its own pricing configuration, so the Tuesday and Thursday blocks can be configured independently. \n\n\nTip: if you want, I can also show a simple way to structure the payment template so parents are billed in 4‑session instalments instead of paying the whole year at once.", "cited": ["Blocks Configuration and Management | Zooza Help", "Blocks creation | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "yes, please, in 4-sessions instalments", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can bill every 4 sessions using a payment template with After N sessions.\n\n\nSteps:\n\n\n\n\n- Go to Programme → Settings → Price and Payment → Payment templates.\n\n- Create a new template.\n\n- Choose Periodic prepaid payment.\n\n- Select After N sessions and set N = 4.\n\n- Save the template.\n\n- Enable this template in the class under Price and Payment. \n\n\nHow it works:\n\n\n\n\n- A payment request is created automatically after every 4 sessions the student attends.\n\n- You do not need to calculate the total number of sessions in the block.\n\nTip: if you want, I can also show a simple way to structure the blocks so parents clearly see they are paying in 4‑session instalments on the booking page.", "cited": ["Payment templates creation | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "this please Tip: if you want, I can also show a simple way to structure the blocks so parents clearly see they are paying in 4‑session instalments on the booking page.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "A simple way is to name the blocks clearly and keep the payment template visible to clients.\n\n\n1. Name the blocks descriptively\n\n\nExample:\n\n\n\n\n- Tuesday block → “Tuesday class (pay every 4 sessions)”\n\n- Thursday block → “Thursday class (pay every 4 sessions)”\n\nClear names help parents understand the billing structure when they choose a block. \n\n\n2. Enable the payment template for clients\n\n\n\n\n- Go to Settings → Payments\n\n\n- Open your After N sessions (N=4) template\n\n- Turn on Visible to clients \n\n\n3. Activate it in the programme\n\n\n\n\n- Programme → Settings → Price and Payment\n\n\n- Set Payment collection to scheduled payments\n\n- Activate the template so it appears on the booking form. \n\n\nResult: parents see the instalment option during booking and can also view the payment schedule in their client profile.\n\n\nTip: you can also add a short note in the class description like “Payments are created every 4 sessions” to make it even clearer for parents.", "cited": ["Payment templates creation | Zooza Help", "Price and payment setup | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Blocks Configuration and Management | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that clarify things?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help configuring the 4-session instalments or displaying them clearly during booking, I’m here to help. Would you like to share what you’re seeing in the payment settings so we can continue?", "cited": []}], "verdict": "verify", "vtitle": "Blocks with 4-session instalments: bot claims 'Periodic prepayment → By block', 'After N sessions' template, 'Visible to clients' toggle", "vnote": "Template option names unverified — Michal. Not written.", "cat": "pricing"}, {"channel": "intercom", "id": "215475965403576", "date": "2026-09-16 15:00", "day": "2026-09-16", "human": false, "bucket": "D_assumed_with_kb", "reask": 7, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Stripe Integration FAQ | Zooza Help", "Booking Widget FAQ | Zooza Help", "Integrations | Zooza Help"], "q": "customers payment won't go through", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "customers payment won't go through", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thanks for the screenshot, Sam — that error message is very helpful.\n\n\nIt means the Stripe account connected to your Zooza payments is currently disabled, so it cannot process live card charges. When this happens, the checkout page will show exactly the message you shared and the payment will not go through. \n\n\nThe next step is to check the Stripe connection in Zooza:\n\n\n\n\n- Go to Settings → Integrations → Stripe Connect\n\n\n- Look at the connection status\n\n- If it shows expired or disconnected, click Connect and complete the Stripe onboarding again\n\nOnce the Stripe account is active again, try the payment again.\n\n\nQuick question: when you open Settings → Integrations → Stripe Connect, what status do you see there (connected, expired, or something else)?\n\n\n\nSource:\nStripe Integration FAQ | Zooza Help", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "its status says YES GREEN", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thanks for checking that, Sam. If Stripe Connect shows “YES (green)”, the connection itself is active in Zooza. The error in your screenshot actually comes from Stripe, not Zooza. It means the Stripe account cannot currently make live charges. \n\n\nThe next step is to check the account directly in Stripe:\n\n\n\n\n- Log in to your Stripe dashboard: https://dashboard.stripe.com\n\n\n- Look for any account verification, identity, or requirements alerts\n\n- Complete any requested information (business details, verification, etc.)\n\nStripe blocks live payments until those requirements are satisfied.\n\n\nIf you want, I can also show you where in Stripe to find the “requirements_disabled_reason” message that explains exactly why charges are disabled.", "cited": ["Stripe Integration FAQ | Zooza Help", "Booking Widget FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "stripe said: Your verification requirements show as met, but you're a connected account which means your platform controls whether you can process live payments. The error message your customer is seeing indicates that charges are currently disabled on your account.\n\n\nSince you're operating as a connected account, your platform (the company that connected your Stripe account to theirs) needs to enable live charges for you. This isn't something you can change directly from your Dashboard.\n\n\nNext steps:\n\n\n\n\n- \nContact your platform provider — reach out to the company whose platform you're using to process payments. They need to enable live payment processing for your connected account.\n\n- \nWhat to tell them — let them know you're seeing the error \"This Connect account cannot currently make live charges\" and that customers cannot complete transactions.\n\nThe platform will need to check the requirements.disabled_reason on your account from their side and resolve any issues preventing live charges.\n\n\nIs there a specific platform you're working with, or would you like me to help you understand more about your account setup?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thanks for sharing Stripe’s message, Sam — that helps clarify what’s happening.\n\n\nIn Zooza, Stripe is connected through Stripe Connect, which means your Stripe account is a connected account. The Stripe dashboard itself is managed directly at https://dashboard.stripe.com, and you control the account there. \n\n\nSince Stripe says verification is complete but live charges are disabled, the next step is to check inside your Stripe dashboard for any remaining alerts or requirements (for example identity verification, business details, or payout setup). Even if verification shows “met”, Stripe can still block live charges until everything is fully approved.\n\n\nIf you want, I can also show you the exact place in Stripe where the “requirements_disabled_reason” message usually appears so you can confirm what Stripe is blocking.", "cited": ["Stripe Integration FAQ | Zooza Help", "Integrations | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "If you want, I can also show you the exact place in Stripe where the “requirements_disabled_reason” message usually appears so you can confirm what Stripe is blocking.\n\n\nyes show me", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Great, Sam — you’re very close to the root cause.\n\n\nTo find the exact reason Stripe is blocking live charges, you’ll need to open your Stripe dashboard and check the account requirements section.\n\n\nSteps:\n\n\n\n\n- Go to https://dashboard.stripe.com and log in\n\n- In the left sidebar, open Settings\n\n\n- Click Account requirements\n\n\nThere you should see a section showing any remaining requirements or restrictions. If live charges are disabled, Stripe will display a message explaining the reason (often related to verification, payout setup, or account status).\n\n\nIf you want, I can also explain what the most common “disabled reason” messages mean and how to fix them.\n\n\n\nSource:\nStripe Integration FAQ | Zooza Help", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "where is account requirements?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thanks for the screenshot, Sam — that helps a lot.\n\n\nIn the Stripe dashboard you’re currently on, “Account requirements” is not shown in the Settings menu anymore, which is why you cannot see it there. The Stripe interface has changed, so that page may appear in a different place or only when Stripe detects a restriction on the account. \n\n\nWhat you can do next:\n\n\n\n\n- Log in to https://dashboard.stripe.com\n\n\n- Look for any alert banner at the top of the dashboard asking for verification or additional information\n\n- If Stripe has blocked live charges, it usually shows a message there explaining the restriction\n\nIf you want, I can also show you one quick way to confirm whether Stripe is blocking live charges directly from the dashboard home screen.\n\n\n\nSource:\nStripe Integration FAQ | Zooza Help", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Does this clarify things?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "yes If you want, I can also show you one quick way to confirm whether Stripe is blocking live charges directly from the dashboard home screen.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Good question, Sam. The quickest way is from the Stripe dashboard home screen.\n\n\n\n\n- Log in to https://dashboard.stripe.com\n\n\n- Look at the top of the dashboard page (above the main menu)\n\nIf Stripe has blocked live charges, you will usually see a banner or alert message there explaining that the account cannot process live payments or that additional information is required. \n\n\nIf you see a banner like that, it normally contains the exact reason Stripe is disabling charges.\n\n\nIf you want, I can also show you one more place in Stripe where this restriction sometimes appears.\n\n\n\nSource:\nStripe Integration FAQ | Zooza Help", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Sam Davis", "text": "there is nothing in stripe saying this", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thanks for checking that, Sam. If Stripe shows no banner and no requirements, the restriction is likely coming from the Stripe Connect connection itself, not from a visible alert in the dashboard. \n\n\nIn Zooza, Stripe is connected through Stri Zooza Help", "Settings | Zooza Help", "Capacity vs extra capacity — who can take which seat | Zooza Help"], "q": "Please tell me about the extra capacity settings for trials", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "Please tell me about the extra capacity settings for trials", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Extra capacity for trials controls where trial bookings can sit in a class. You choose this in Programme → Settings → Trial → Session capacity. \n\n\nThere are two options:\n\n\n\n\n- \nCurrent available capacity\n• Trials can book into both the main class capacity and extra capacity.\n• If a paying client cancels, that seat becomes available to a trial. \n\n\n- \nExtra capacity\n• Trials can only use the extra seats.\n• The main class capacity stays reserved for paying enrolments, even if someone cancels.\n\nThe number of extra seats itself is set in Extra capacity settings (globally or per class), and that pool is shared with make-up bookings.", "cited": ["Trial sessions | Zooza Help", "Capacity vs extra capacity — who can take which seat | Zooza Help", "Trial Classes FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "Where do I find the extra capacity settings", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You’ll find Extra capacity settings in two places:\n\n\n\n\n- \nGlobally:\nGo to Programme → Settings → Extra capacity settings.\nThis sets the default number of extra seats for all classes in that programme. \n\n\n- \nPer class:\nGo to Programmes → open the programme → open the class → Extra capacity settings.\nHere you can either add to the global number or replace it with a class‑specific value.\n\nImportant: the number of extra seats is not inside the Trial settings. The Trial page only decides whether trials can use those extra seats.", "cited": ["Capacity vs extra capacity — who can take which seat | Zooza Help", "Trial sessions | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any additional help locating or understanding the extra capacity settings, I’m here to help. Would you like to share more about what you’re trying to configure?", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "Where do I find the booking cut-off time?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can find the booking cut‑off time (cancellation deadline) here:\n\n\n\n\n- Go to Settings → Programmes\n\n\n- Enable Set a limit for cancelling a scheduled session\n\n\n- Choose the Limit type:\n• Fixed time – a specific hour on the day before the session\n• Relative time – a number of hours before the session starts (e.g., 12 hours)\n\nThis setting is global, so it applies to all programmes in your account.", "cited": ["Make-up Sessions FAQ | Zooza Help", "Cancellation limit settings | Zooza Help", "Settings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "Not for cancelling - for booking", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Got it — you mean the booking deadline, not cancellation.\n\n\nThere isn’t a single “booking cut‑off time” setting. Instead, it’s controlled in the booking form settings:\n\n\n\n\n- Go to Programmes → your programme → Settings → Online booking\n\n\n- In the Other section, set:\n• Hide from booking form N hours before the programme begins\n\n\nThis is the closest thing to a booking cut‑off.\n\n\nExample: if you set it to 24 hours, clients won’t be able to book within 24 hours of the programme starting. \n\n\nYou can also hide full classes from the booking form if you want to stop bookings once capacity is reached.\n\n\nIf you want, I can also show you how to allow last‑minute bookings (for trials or drop-ins).", "cited": ["Booking form settings overview | Zooza Help", "Online booking | Zooza Help", "Programme Settings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "Cut-off before the class begins", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You’re looking for the booking cut‑off before the class starts. That’s controlled by this setting:\n\n\n\n\n- Go to Programmes → your programme → Settings → Online booking\n\n\n- In the Other section, find:\nHide from booking form N hours before the programme begins\n\n\nThis is the closest thing to a booking cut‑off.\n\n\nExample: if you set it to 2 hours, clients won’t be able to book within 2 hours of the class start time. \n\n\nNote: when this is enabled, the class disappears from the booking form before the start time, which also disables late booking options.", "cited": ["Programme Settings | Zooza Help", "Booking form settings overview | Zooza Help", "Online booking | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this information helpful?", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "No - the programme is ongoing - it's specific bookings for classes", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Got it — you mean per class, not per programme.\n\n\nThere isn’t a specific “booking cut‑off before the class starts” setting for individual sessions.\n\n\nWhat you can do instead is control when the class is visible for booking:\n\n\n\n\n- Go to Classes → open the class → Settings → Edit\n\n\n- Toggle Allow online booking\n\n\nWhen this is off, the class stays in the system but is hidden from the booking form, so clients can’t book it. \n\n\nYou can also hide a class automatically once it reaches capacity in the programme’s online booking settings. \n\n\nSo in practice, the “cut‑off” is managed by turning off online booking for that class when you want to stop new bookings.", "cited": ["Class Detail | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Online booking | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "no", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I understand this is still not quite what you were looking for. Would you like me to connect you with a human agent? Or if you prefer, you can provide more details and I’ll do my best to assist you further.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I’m sorry we haven’t identified the right setting yet, and I’m here to help clarify it. Would you like to describe how you want the booking cut-off to work for individual classes?", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "Where do I find payment notifications which get sent to customers", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can find and control the payment notifications sent to customers in two places:\n\n\n\n\n- \nGlobal payment notifications\nGo to Settings → Billing & Payments → Payment settings → Scheduled‑payment notifications.\nHere you can enable or disable reminders such as:\n• upcoming payment notifications\n• payment created notifications\n• overdue payment notifications\n\n\n- \nPer‑programme payment reminders\nGo to Programmes → your programme → Settings → Price and Payment → Payment Reminders to configure reminder timing for that specific programme.\n\n\nIf you want to edit the wording of the emails, you can do that in Communication → Message Templates.", "cited": ["Automatic reminders for payment schedule | Zooza Help", "Automated notifications overview | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Message templates — automatic and manual emails | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help locating or configuring payment notifications, I’m here to help. Would you like to share more about which notification or setting you’re trying to change?", "cited": []}], "verdict": "gap", "vtitle": "Sarah: extra capacity for trials (fine); booking cut-off per class for an ongoing programme — bot never found 'hide before'", "vnote": "Resolved by the hide-before write-up (booking-form-settings.md, trials FAQ).", "cat": "trials"}, {"channel": "intercom", "id": "215475962476482", "date": "2026-09-16 11:11", "day": "2026-09-16", "human": true, "bucket": "HUMAN", "reask": 4, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": ["Registration and Booking FAQ | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Archive or delete a Programme | Zooza Help"], "q": "Ahojte, prosím vas nejakym super sposobom sa mi podarilo nahodit termín na volne santenie, Registrácia - Pokladňa - Baby Balance tento. Neviem ho nikde najst aby som ho zmazala a neukazovalo to na stranke. Pomožete mi prosim?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Baby Balance", "text": "Ahojte, prosím vas nejakym super sposobom sa mi podarilo nahodit termín na volne santenie, Registrácia - Pokladňa - Baby Balance tento. Neviem ho nikde najst aby som ho zmazala a neukazovalo to na stranke. Pomožete mi prosim?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Tento termín sa nachádza v Programme → Class (kurz). Ak ho chcete zmeniť, aby sa neukazoval na stránke, máte dve jednoduché možnosti:\n\n\n1. Skryť len tento kurz z webu\n\n\n\n\n- Otvorte Programme → Class\n\n\n- Settings → Edit\n\n- Vypnite Allow online booking (a \n\n\nyour ticket  has been received. Zooza Assistant will try to help you right away — and a member of our team will personally review it too.\n\n\n— Zooza Support", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Veronika, viete prosim poslat priklad aspon jednej platby, ktora prisla na ucet a v systeme nie je? Idealne keby ste mohli poslat screenshot priamo z banky. Platba by mala prist po tom ako ste ucet sparovali. Dakujem,", "cited": []}, {"role": "customer", "who": "Veronika Chyláková", "text": "Dobrý deň, \n\n\nposielam príklad platby ktorá neprešla do systému.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dakujem pekne, ozvem sa akonahle budem vediet viac.", "cited": []}], "verdict": "product", "vtitle": "GoCardless bank feed not pairing after invoice-profile change — investigating", "vnote": "Spec api in_progress 2026-09-16-gocardless-feed-waste. Not KB yet.", "cat": "payments"}, {"channel": "intercom", "id": "215475961522210", "date": "2026-09-16 09:07", "day": "2026-09-16", "human": true, "bucket": "HUMAN", "reask": 1, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Zooza PRO - Zooza", "Clients | Zooza Help", "Communication | Zooza Help", "Sending email/SMS to clients | Zooza Help"], "q": "---------- Forwarded message ---------", "turns": [{"role": "customer", "who": "Katarína Babiaková", "text": "---------- Forwarded message ---------", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dobrý den Kataríno,\n\n\nDěkujeme za váš dotaz.\n\n\n„Historie zpráv“ v Zooza slouží k tomu, abyste mohli sledovat veškerou komunikaci s klienty na jednom místě.\n\n\nMůžete ji zobrazit dvěma způsoby:\n\n\n\n\n- \nGlobální přehled:\nPřejděte do Communication → Messages Overview. Zde uvidíte všechny odeslané a přijaté e‑maily a SMS a můžete je filtrovat podle e‑mailu, typu zprávy, šablony a stavu. \n\n\n- \nU konkrétního klienta:\nOtevřete klienta v Clients → Clients a v jeho detailu přejděte do sekce History → Client Records. Zde najdete kompletní historii komunikace s tímto klientem. \n\n\nV obou případech můžete číst obsah zpráv, filtrovat je a sledovat, kdy byly odeslány.\n\n\nProsím, dejte mi vědět, zda to odpovídá vašemu dotazu, nebo pokud byste chtěli podrobnější návod.\n\n\nSending email/SMS to clients | Zooza Help\nClients | Zooza Help\nCommunication | Zooza Help", "cited": []}, {"role": "customer", "who": null, "text": "Dobrý den,\n\n\ndotaz byl na něco úplně jiného.... nespletli jste se v adresátovi? Tato odpověď nám k ničemu není.\n\n\nS pozdravemMilena Purkertová\nJazyková škola AQAP, kancelář\nalej Svobody 56\n323 00 Plzeň\nTel. 608 963 029\nwww.aqap-skola.cz\n​\n\n\nst 16. 9. 2026 v 10:53 odesílatel Zooza Support from Zooza \u003csupport@zooza.online> napsal:\n    \n\n\nDobrý den Kataríno,\n\n\nDěkujeme za váš dotaz.\n\n\n„Historie zpráv“ v Zooza slouží k tomu, abyste mohli sledovat veškerou komunikaci s klienty na jednom místě.\n\n\nMůžete ji zobrazit dvěma způsoby:\n\n\n\n\n- \nGlobální přehled:Přejděte do Communication → Messages Overview. Zde uvidíte všechny odeslané a přijaté e‑maily a SMS a můžete je filtrovat podle e‑mailu, typu zprávy, šablony a stavu. [1]\n\n\n- \nU konkrétního klienta:Otevřete klienta v Clients → Clients a v jeho detailu přejděte do sekce History → Client Records. Zde najdete kompletní historii komunikace s tímto klientem. [2]\n\n\nV obou případech můžete číst obsah zpráv, filtrovat je a sledovat, kdy byly odeslány.\n\n\nProsím, dejte mi vědět, zda to odpovídá vašemu dotazu, nebo pokud byste chtěli podrobnější návod.      Let us know if that helped or reply to this email ✍🏼      That answered my question    Wait for the team     \n\n\nZooza Support\n\n\nZoozahelp.zooza.onlineThis email and any attachments are confidential and intended solely for the recipi i jste tohle?", "cited": []}, {"role": "customer", "who": "Jana Vašková", "text": "následne nám klienti volaju, píšu, že sme im zrušili registráciu. Je im vysvetlené, že to bola registrácia neuhradená a hlavne na kurz nechodili. Pri vymazaní registrácie som neodškrtla políčko zaslať klientovi, no napriek tomu kliento dostane info, že sme ho zrušili. Dá sa nejako predísť takýmto správam, aby táto info neprišla na email klienta? nejaké nadstavenie?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno, to je dávané tým, že v Zoozě existujú automatické notifikácie o zmenách. Ak sa v kurze niečo zmení (napr. zrušenie registrácie), systém môže klientovi automaticky poslať e‑mail s informáciou o tejto zmene. \n\n\nTieto správy sú súčasťou komunikačných automatizácií, ktoré informujú rodičov o zmenách v kurze. \n\n\nPreto sa ich nedá úplne potlačiť len tým, že pri vymazaní nezaškrtnete „poslať klientovi“ – táto správa môže ísť aj ako automatická notifikácia o zmene.\n\n\nTip: ak chcete, môžem vám ukázať, kde sa tieto automatické notifikácie v systéme nastavujú a ako ich kontrolovať.", "cited": ["Žebřík důvěry rodičů: 3 standardy pro dětské aktivity, které zvyšují retenci — Zooza", "Jak automatizovat vaše podnikání v oblasti dětských aktivit (aniž byste ztratili osobní kontakt) — Zooza"]}, {"role": "bot", "who": "Zooza Support", "text": "Dostali jste odpověď na svou otázku?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc s nastavením týchto e-mailových upozornení, som tu pre vás. Chcete doplniť, čo presne sa po vymazaní registrácie klientovi zobrazí alebo odošle?", "cited": []}, {"role": "customer", "who": "Jana Vašková", "text": "áno, chcem ukázať kde sa automaticke notifikácie nadstavujú", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Automatické notifikácie sa nastavujú v časti Komunikácia → Automatické notifikácie.\n\n\nPostup je približne takýto:\n\n\n\n\n- v administrácii otvorte Komunikácia\n istentom? Máte pracovný deň?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Vieš ma spojiť s ľudským asistentom? Máte pracovný deň?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Sure — I’ll pass this to the team. Before I do, please share the link/URL and a screenshot of the issue you are facing. This will help someone assist you more efficiently.", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Dobrý deň, neviem dohľadať platbu a pridať ju k registrácii. Poprosím o pomoc, ako paltbu:\na) vyhľadám\nb) priradím k registrácii.\nRegistrácia je na manželku, Janu Ferenčíkovú. Platbu realizoval manžel Martin Ferenčík s VS: 533391. \nPri importe platieb sa ukázala platba ako nespárovaná.  Neviem ju nájsť v systéme, aby som ju priradila k registrácii. Ďakujem za postup.\n​", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Daniela. Zo screenshotu je vidno, ze platba je v ignorovanych zaznamoch. To znamena, ze nebola naimportovana do systemu.", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Dobrý deň Martin, teším sa, že dnes pracujete. Už sa trápim s touto registráciou dlho. Rodičia sú nespokojní, potrebujú vygenerovať faktúru a chcú si dať preplatiť peniaze - športová činnosť dieťaťa.", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Ako mám naimportovať platbu do systému? Môžete mi poradiť?", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Dala som importovanie platieb v deň úhrady. V systéme je vidieť Klient: Jana Ferenčíková - registrácia zrušená. A v časti ignorované platby už nie je evidovaná platba manžela.", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "V systéme však registrácia matky existuje s dlhom 200 €.", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Poprosím o postu t a trial booked for this afternoon. \n Reasoning: Centres rely on this setting to avoid same-day bookings they can't staff.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dear Sarah,\n\n\nyour ticket  has been received. Zooza Assistant will try to help you right away — and a member of our team will personally review it too.\n\n\n— Zooza Support", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "https://zooza.atlassian.net/browse/ZOOZA-4924", "cited": []}], "verdict": "gap", "vtitle": "Hide-before cut-off did not apply to trials — ZOOZA-4924, shipped API-20260916-002", "vnote": "WRITTEN: booking-form-settings.md (cut-off section), trial-sessions.md, trials-faq.md. Also Michal's email to Sarah: field locked while Late bookings enabled — written with the workaround.", "cat": "trials"}, {"channel": "intercom", "id": "215475944012825", "date": "2026-09-15 07:48", "day": "2026-09-15", "human": false, "bucket": "D_assumed_with_kb", "reask": 1, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Attendance and Catch-up Classes FAQ | Zooza Help", "Sending email/SMS to clients | Zooza Help", "Bulk email send tracking | Zooza Help"], "q": "Dobrý deň,\n\n\nak posielame rodičom detí, ktoré chodia na kurz (napríklad 50 ľudí), SMS správu s podpisom, že ju som poslal ja, tak:\n\n\n\n\n- Z ktorého čísla budú vidieť tú SMS?\n\n- Koľko stojí jedna SMS?\n\n- Na ktoré číslo a akým spôsobom budú môcť na tú SMS odpovedať?\n\nPodobná otázka je aj pre emaily:\n\n\n\n\n- Z ktorej e‑mailovej adresy budú emaily prichádzať?\n\n- Čo budú vidieť ako odosielateľa?\n\n- Na ktorý e‑mail budú môcť odpovedať?“", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Kako mogu da vam pomognem?", "cited": []}, {"role": "customer", "who": "Janko Grnja", "text": "Dobrý deň,\n\n\nak posielame rodičom detí, ktoré chodia na kurz (napríklad 50 ľudí), SMS správu s podpisom, že ju som poslal ja, tak:\n\n\n\n\n- Z ktorého čísla budú vidieť tú SMS?\n\n- Koľko stojí jedna SMS?\n\n- Na ktoré číslo a akým spôsobom budú môcť na tú SMS odpovedať?\n\nPodobná otázka je aj pre emaily:\n\n\n\n\n- Z ktorej e‑mailovej adresy budú emaily prichádzať?\n\n- Čo budú vidieť ako odosielateľa?\n\n- Na ktorý e‑mail budú môcť odpovedať?“", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dobrý deň, Janko — rád to vysvetlím.\n\n\nSMS\n\n\n\n\n- Na telefóne rodičov sa zobrazí meno odosielateľa, ktoré si nastavíte v Settings → General settings. \n\n\n- Túto SMS môžu rodičom poslať napr. instruktor priamo z lekcie (Full view → Send text message to N recipients) alebo z Communication → Send SMS. \n\n\n- Posielanie beží na pozadí a môžete sledovať postup aj históriu správ v Communication → Messages Overview.\n\n- Pri väčších rozosielkach (100+ príjemcov) sa odoslanie vyžaduje schválenie. \n\n\nEmail\n\n\n\n\n- Posiela sa tiež z Communication → Send Email alebo priamo z lekcie.\n\n- História odoslaných a prijatých správ je dostupná v Communication → Messages Overview, kde vidíte obsah a čas komunikácie.\n\nAk chcete, môžem vám tiež ukázať, ako nastaviť šablóny správ, aby ste rodičom posielali rýchlejšie a jednotne.", "cited": ["Sending email/SMS to clients | Zooza Help", "Attendance and Catch-up Classes FAQ | Zooza Help", "Bulk email send tracking | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Da li je to ono što ste tražili?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ako vam je potrebno još pomoći u vezi sa SMS ili email komunikacijom, slobodno mi pišite. Želite li da navedete šta biste još želeli da razjasnimo?", "cited": []}], "verdict": "noise", "vtitle": "Duplicate of 215475944043183", "vnote": "Handled there.", "cat": "comms"}, {"channel": "intercom", "id": "215475943813616", "date": "2026-09-15 07:26", "day": "2026-09-15", "human": false, "bucket": "D_assumed_with_kb", "reask": 6, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Dynamic tags | Zooza Help", "Sending email/SMS to clients | Zooza Help", "Email and Communication FAQ | Zooza Help", "Contact — Zooza", "Settings | Zooza Help"], "q": "Dakle, немој да ми нудиш помоћ, већ кажи: изволите.", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Kako mogu da vam pomognem?", "cited": []}, {"role": "customer", "who": "Janko Grnja", "text": "Dakle, немој да ми нудиш помоћ, већ кажи: изволите.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Izvolite, kako mogu da vam pomognem?", "cited": []}, {"role": "customer", "who": "Janko Grnja", "text": "Тако, немој да ми нудиш помоћ. Тако, немој да кажеш како могу да вам помогнем. Не треба ми помоћ, ја нисам инвалид. Каже се изволите, без како могу да вам помогнем. То како могу да вам помогнем се говори у енглеској, Америци, у Србији и Словачкој се не говори како могу да вам помогнем. Али се говори, нека се пачи на словачком или изволите на српском.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Izvolite, kako mogu da vam pomognem?", "cited": []}, {"role": "customer", "who": "Janko Grnja", "text": "Да ли си ти глуп? Пробај да кажеш реченицу без \"изволите, како могу да вам помогнем\". Реци неку другу реченицу.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Razumem vašu želju za drugačijim načinom komunikacije. Želite li da vas povežem sa ljudskim agentom? Ako želite, možemo nastaviti razgovor i možete mi reći više o tome šta vam je potrebno.", "cited": []}, {"role": "customer", "who": "Janko Grnja", "text": "Не желим да ме повезеш са људским анкетом. Желим да ми одговориш на питање. Ако преко Зузе пошаљемо родитељима деце која иду на курс, а њих 50, СМС поруку са потписом моје, да сам ја то послао, с ког броја ће они видети да су добили ту СМС поруку? Колико кошта та СМС порука? На који број и на који начин ће они одговорити на ту СМС поруку? Слично питање је и за ако им пошаљемо мејлове.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Izvolite. Odgovor na vaša pitanja:\n\n\nSMS poruke\n\n\n\n\n- \nKoji broj će videti klijenti: neće videti vaš mobilni broj. Videti će ime pošiljaoca koje ste postavili. \n\n\n- \nKako postaviti ime: idite u Settings → General settings → Sender’s name in the SMS message. Maksimalno 10 znakova. \n\n\n- \nCena SMS poruke: u našim dokumentacijama nije navedena tačna cena.\n\n- \nNa koji broj će odgovoriti: u dokumentaciji nije naveden način za odgovor na SMS kroz sistem.\n\nEmail poruke\n\n\n\n\n- Poruke se šalju iz sekcije Communication → Send Email.\n\n- Klijenti primaju email na svoju email adresu i mogu vam odgovoriti na taj email.\n\n- Sve poslane i primljene poruke možete pogledati u Communication → Messages Overview.\n\nAko želite, mogu vam i objasniti kako da šaljete jednu poruku svim 50 roditeljima u nekoliko klikova.", "cited": ["Sending email/SMS to clients | Zooza Help", "Settings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Da li je to ono što ste tražili?", "cited": []}, {"role": "customer", "who": "Janko Grnja", "text": "Ne, nije to što sam tražio, zato što mi ništa nisi odgovorio. S kog maila će dobiti mail? Šta će videti, ko im je poslao, s koje e-mail adrese? To možeš da odgovoriš, zar ne?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Izvolite.\n\n\nKoja e‑mail adresa se koristi za slanje poruka roditeljima:\n\n\n\n\n- Većina email poruka koje šaljete iz Zooze odlazi iz vaše e‑mail adrese koja je postavljena u Settings → General → Email address.  \n\n\n- Roditelji vide da je poruka poslana sa te adrese.\n\n- Ako roditelj odgovori na taj email, odgovor ne ide u vaš privatni inbox, već direktno u Zooza u sekciji poruka (Messages). \n\n\nIzuzetak:\n\n\n\n\n- Nekoliko šablona automatskih poruka može ići sa adrese no-reply@zooza.app, a oni nisu namenjeni za odgovor.\n\nKako je  "Payments and Billing FAQ | Zooza Help", "Bookings | Zooza Help", "A client wants to move to a later date | Zooza Help"], "q": "how do I move a trail from this week to next", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "how do I move a trail from this week to next", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You don’t move a trial using Transfer. Instead, you reschedule it. \n\n\nSteps:\n\n\n\n\n- Open the trial booking\n\n\n- Go to Attendance\n\n\n- Click Hide on the session from this week\n\n- Click Book a session\n\n\n- Select the session from next week\n\nThis keeps the booking as Trial started, and the client will be notified of the new date. The trial automation will continue from the new session.", "cited": ["A client wants to move to a later date | Zooza Help", "Manage trial bookings — reschedule, convert, and close | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help rescheduling the trial, I’m here to assist. Would you like to share more about what you’re trying to change?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "sending someone an invoice for outstanding payment", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can send an invoice for an outstanding payment directly from the booking.\n\n\nSteps:\n\n\n\n\n- Open the client’s booking\n\n\n- In the Payments tile, click Show payments\n\n\n- In the Invoices section, click Generate invoice\n\n\n- Choose the invoice profile and confirm\n\nThe invoice is created immediately and emailed to the client automatically as a PDF. \n\n\nIf the invoice already exists but wasn’t sent, open it (pencil icon), tick Send invoice to client via email, and save.\n\n\nTip: you can also view all invoices anytime under Payments → Invoices in the left menu.", "cited": ["Billing and invoicing | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Bookings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help sending the invoice or understanding the outstanding payment process, I’m here to help. Would you like to share more about what you’re trying to resolve?", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Sam, just to check, are you sure you want to send an invoice?\n\n\nAn invoice is an accounting document. If what you mean is that you want to ask a customer to pay an outstanding booking/payment, you can send them a payment reminder using the relevant template instead.\n\n\nLet me know exactly what you’re trying to send and I’ll point you in the right direction.", "cited": []}], "verdict": "check", "vtitle": "'Send an invoice' vs payment reminder — invoice is an accounting document", "vnote": "Covered by commit c7b0bdb (payments FAQ). No change.", "cat": "payments"}, {"channel": "intercom", "id": "215475933346882", "date": "2026-09-15 02:16", "day": "2026-09-15", "human": true, "bucket": "HUMAN", "reask": 2, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Auto-enrollment | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help"], "q": "Doby vecer \n\n chcela by som sa poradiť ohľadom nastavenia automatického pokračovania v Zooze.\n\n Pri kurze More Jump with Joey by som chcela nastaviť automatické pokračovanie pre deti do nového kurzu AlphaBoat, ktorý už mám uz nastavený na ďalší školský rok.\n\n Keď sa však snažím nastaviť automatické pokračovanie, systém mi dole ponúka iba skupiny v kurze More Jump with Joey, v ktorom sú deti zaradené tento školský rok. Neviem preto vybrať AlphaBoat ako nový kurz, ktorý sa má rodičom ponúknuť.\n\n Alpha Boat je pritom v mojom prípade pokračovaním kurz  "Platba je hneď ako prvá. Poprosím ďalší postup, ako ju priradiť k správnej registrácii.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumiem, že chcete priradiť platbu k správnej registrácii. Chcete, aby som vás spojil s ľudským agentom? Alebo môžete pokračovať vo spolupráci so mnou a poskytnúť viac informácií, aby som vám mohol lepšie pomôcť.", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "áno, poprosím spojiť s Martinom", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Sure — I’ll pass this to the team. Before I do, please share the link/URL and a screenshot.", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "https://zooza.app/#payments/inbound/queue?status=new&page=0&sort_by=posting_date_desc&page_size=50", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Postup je ten isty ako som opisoval pri presuvani - vojdete do detailu platby a uvidite moznost priradit platbu bud ku Registracii - alebo ku Objednavke", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "V tomto pripade ide o registraciu, preto do vyhladavacieho policka zadate meno klienta", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Vyberiete prislusnu registraciu a kliknete na Vybrat", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Ďakujem. Podarilo sa.", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Poprosila by som o radu ohľadom ďalšej reklamácie rodičov.", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Emilián Kozma, uhradil krúžok, napriek tomu mu prišla výzva na zaplatenie krúžku. Pozerala som prehľad v časti Platby. Evidujeme tam cca 420 nepriradených platieb. Ako je to možné?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Platby sa paruju na zaklade variabilneho symbolu, cize ak je s tymto symbolom nieco v neporiadku, platbu system nema ako inak doparovat automaticky. Viete mi prosim poslat cislo jeho registracie?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Podla vsetkeho ste robili import registracii z banky. V pripade ak robite import manualne, vsetky platby rovnako prechadzaju parovacim algoritmom, ktory odmietne doparovat platbu, ktora je zhodna s tou co uz system pozna. Inymi slovami ak sa snazite doimportovat platbu ktora ma zhodny variabilny symbol, datum a sumu, system ju vyhodnoti ako nesparovanu. Pravdepodobne preto tam mate tych nesparovanych platieb tak vela", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Podla komunikacie na registracii mu informacia o neuhradeni odisla 12 septembra a import ste robili 14 septembra", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Manuálny import platieb nám doporučil a osobne mi ho cez videocall ukázal pán Michal Dodok. Postupovala som podľa jeho inštrukcií. Import robím cca každé dva dni.", "cited": []}, {"role": "customer", "who": "Daniela Ružičková", "text": "Ako mám teda postupovať, aby nevzdnikali takéto situácie?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "V pripade ak planujete platby riesit importovanim, potom je dobre robit importy casto. Priblizne dva dni su pomerne casta frekvencia ale zaroven je dobre potom naozaj importovat iba platby, ktore vznikli za tie dva dni, teda neexportovat si napriklad cely mesiac z banky. Zaroven neviem ci mate nastavene automaticke parovanie platieb ale ak ho nastavene mate, potom nema zmysel robit obe - aj automaticke parovanie platieb a aj manualny import. Ak Vam to pan Dodok odporucil, zrejme preto, lebo to v danej chvili davalo zmysel.", "cited": []}], "verdict": "gap", "vtitle": "Assign an unpaired payment; manual import runs the same dedup so re-imported rows land unpaired (420 of them); import often, only new days, don't mix with auto-pairing", "vnote": "WRITTEN: csv-payment-import.md duplicate section rewritten (old text said re-import doubles balances — contradicted by dedup specs and the reference page).", "cat": "payments"}, {"channel": "intercom", "id": "215475929102759", "date": "2026-09-14 14:57", "day": "2026-09-14", "human": true, "bucket": "HUMAN", "reask": 25, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Creating a booking manually | Zooza Help", "Billing and invoicing | Zooza Help", "Bookings | Zooza Help", "When to enrol clients yourself vs. send them a booking link | Zooza Help"], "q": "How do I make a manual booking for FRIDAY CLUB? Then share the payment request to the client?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "How do I make a manual booking for FRIDAY CLUB? Then share the payment request to the client?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can do this in two quick steps: create the booking, then send the payment request.\n\n\n1. Create the manual booking\n\n\n\n\n- Go to Bookings → Create booking (or open the class and click Add booking).\n\n- Enter the client’s name, email, and select the FRIDAY CLUB class.\n\n- Confirm the booking.\nNote: no confirmation email is sent automatically when you create it manually.  \n\n\n2. Send the payment request\n\n\n\n\n- Open the booking.\n\n- In the Payments tile, click Show payments.\n\n- In the Invoices section, choose the invoice profile and click Generate invoice.\n\n- Edit the invoice and enable Send invoice to client via email, then save.\n\nThe invoice (payment request) is emailed to the client immediately. \n\n\nTip: you can also send a confirmation email from the booking detail if you want the client to receive both the booking confirmation and the payment request.", "cited": ["Creating a booking manually | Zooza Help", "Bookings | Zooza Help", "When to enrol clients yourself vs. send them a booking link | Zooza Help", "Billing and invoicing | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Tommy, the AI's answer is partially corrrect", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Is this actually the class that uses the entry passes?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Hey Martin - I'm just working out how to clean up the existing bookings for Friday Club (the passes). One of the parents gave up as it wasn't working previously - he has 2 children - I wanted to find out how to create this booking for him and then share the payment request if possible?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "So he does not have the booking yet? or he managed to create one?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "It's Patel Viral - I think he made a couple of bookings but couldn't;t get any further - it also didn't create a sibling discount which is when he gave up", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ah, ok, so if you just hold on for a second as I'm on a meeting, but I'll write you a step by step instructions. Basically you don't have to go via path of creating a booking - you may simply copy the existing booking to the same class and afterwards changing the attendee to his daughter", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Sounds good - no rush!", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Mr. Patel actually has three bookings and one for each kid. I would simply delete this one: https://asia.zooza.app/#registrations/1792", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "So the way I would continue then is this: On the booking detail locate this card:", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Select Online payment by card as a payment method", "cited": []}, {"role": "human", "who": "Martin Rapav
