How can I help?", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "if you have a registration fee, is this charged per child or per family?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "The registration (booking) fee is a one‑time charge set on the programme and is collected at the moment of registration. It is separate from the programme price. \n\n\nIn practice, it is charged per booking, not per family. If a parent registers multiple children in the same transaction, each child creates a separate booking, so the fee applies to each registration. \n\n\nExample:\n\n\n\n\n- 1 child → 1 registration fee\n\n- 2 children in one form → 2 registration fees\n\nIf you want, I can also explain how many schools structure this when siblings enrol together.", "cited": ["Programmes, Timetables and Sessions FAQ | Zooza Help", "Registration and Booking FAQ | Zooza Help", "Create a programme | Zooza Help", "Children's Group Activities — Block / Term Model | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "yes: If you want, I can also explain how many schools structure this when siblings enrol together.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Many schools keep the registration fee per child, since each child creates a separate booking. When a parent adds another child in the form, the system simply creates another registration and the total price increases accordingly. \n\n\nTo make sibling enrolments more attractive, a common approach is to add a sibling discount:\n\n\n\n\n- 1st child: full price\n\n- 2nd child: ~10% off\n\n- 3rd child: ~15% off\n\n- 4th+ child: ~20% off\n\nZooza can apply this automatically when the same parent email registers multiple children. \n\n\nParents can also add multiple children in one checkout using Add another person, which keeps the process simple for families. \n\n\nIf you want, I can also show a simple way to structure pricing so siblings feel like a better value without complicating your setup.", "cited": ["Booking FAQ | Zooza Help", "Sibling Discount | Zooza Help", "Attendee selection on the booking form | Zooza Help", "Discounts and Sibling Pricing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help with structuring sibling enrolments or registration fees, I’m here to help. Would you like to share more about what you’re trying to set up?", "cited": []}], "verdict": "gap", "vtitle": "Is the registration fee per child or per family", "vnote": "Pairs with 215475782192470. Answer both once the behaviour is confirmed.", "cat": "pricing"}, {"channel": "intercom", "id": "215475717855970", "date": "2026-08-31 13:53", "day": "2026-08-31", "human": false, "bucket": "D_assumed_with_kb", "reask": 20, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Transfer and copy bookings | Zooza Help", "Discounts and Sibling Pricing FAQ | Zooza Help", "Client Management FAQ | Zooza Help", "Discount code | Zooza Help", "Discount types | Zooza Help", "Payment Correction vs Refund Guide | Zooza Help", "Payment templates creation | Zooza Help", "Discounts | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Session payment adjustments | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Bookings | Zooza Help", "Edit payment on booking | Zooza Help", "Loyalty Program | Zooza Help", "Sibling Discount | Zooza Help", "Transfer and Copy FAQ | Zooza Help", "Loyalty Program FAQ | Zooza Help"], "q": "Ahoj, rodič nechtiac zaregistroval svoje dieťa duplicitne do jednej skupiny.\nDlh mu tým pádom ukazuje dvojnásobný, jednu registráciu som vymazal, no dlh ostal rovnaký. Navedieš ma ako mu upraviť správny dlh akoby za jedného športovca?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Ahoj, rodič nechtiac zaregistroval svoje dieťa duplicitne do jednej skupiny.\nDlh mu tým pádom ukazuje dvojnásobný, jednu registráciu som vymazal, no dlh ostal rovnaký. Navedieš ma ako mu upraviť správny dlh akoby za jedného športovca?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Tento stav vznikne, keď je dlh (alebo platba) zadaný dvakrát. V takom prípade sa dlh neopraví vymazaním registrácie, ale úpravou platby.\n\n\nPostup:\n\n\n\n\n- Otvorte Bookings a danú rezerváciu.\n\n- Prejdite do záložky Payments.\n\n- U nájdenej platby kliknite na More (⋯).\n\n- Vyberte Edit payment.\n\n- Zmeňte sumu na správnu hodnotu (napr. na polovicu) a uložte. \n\n\nTáto úprava len opravi záznam v systéme – nie je to vrátenie peňazí a klient v profile uvidí už len správnu sumu. \n\n\nAk máte plán s viacerými platbami, môžete tiež upraviť konkrétnu naplánovanú platbu v Payment plan → Adjustments a zmeniť jej sumu. \n\n\nTip: ak chcete, môžem vám ukázať aj spôsob, ako nastaviť platby tak, aby sa podobné duplicitné dlhy v budúcnosti neobjavovali.", "cited": ["Payment Correction vs Refund Guide | Zooza Help", "Session payment adjustments | Zooza Help", "Edit payment on booking | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak ešte potrebujete pomoc s úpravou správneho dlhu, som vám k dispozícii. Chcete doplniť, čo presne potrebujete v nastavení platieb objasniť?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Teraz by som sa chcel venovať zľavám. Chcem nastaviť zľavy nasledovne:\n1. registrácia (plná suma)\n2.registrácia (zľava 3,20€)\n3.registrácia (zľava 8,20€)\n4.registrácia (zľava 15€)\n\nSamozrejme jedná sa len o registrácie z jedného e-mailu.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Tento p ľavu priamo v šablóne platieb (napr. väčšia zľava pri ročnej platbe).", "cited": ["Loyalty Program | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Discount types | Zooza Help", "Payment templates creation | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Je to tak, ako ste to potrebovali?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "skús", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumiem, že chcete vyskúšať nastavenie zliav pri rôznych frekvenciách platieb. Môžem vám pomôcť s detailnejším vysvetlením alebo nastavením, ak si prajete. Čo by ste chceli najprv presne vysvetliť alebo nastaviť?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "s detailnejším vysvetlením", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dobre – tu je detailnejšie vysvetlenie, ako to funguje.\n\n\n1. Zľava (napr. súrodenecká)\n\n\nNastavíte ju v Sales & Payments → Loyalty Program → Sibling Discount.\n\n\nSystém pri registrácii spočíta, koľko detí má jeden e‑mail a aplikuje príslušné pravidlo (napr. 2., 3., 4. dieťa). Zľava sa aplikuje priamo pri rezervácii. \n\n\n2. Frekvencia platby (mesačná, kvartálna, ročná)\n\n\nTá je definovaná v payment template – len určuje, kedy a v koľkých častiach sa platí. \n\n\n3. Ako sa zľava aplikuje pri rôznych frekvenciách\n\n\n\n\n- \nJednorazová platba – zľava sa odpočíta naraz.\n\n- \nSplátky – zľava sa úmerným spôsobom rozdelí medzi všetky splátky.\n\n- \nČlenstvo (mesačné / kvartálne / ročné) – zľava sa aplikuje pri každom obnovení platby. \n\n\nTeda: zľava je jedna, ale systém ju automaticky rozloží podľa zvolenej frekvencie platieb.\n\n\nAk chcete, môžem vám ukázať aj spôsob, ako nastaviť väčšiu zľavu pri ročnej platbe (napr. motivačnú pre rodičov).", "cited": ["Sibling Discount | Zooza Help", "Loyalty Program | Zooza Help", "Payment templates creation | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "-  ak dobre rozumiem, dajme tomu že rodič prihlási 3 deti, každé dieťa má úhradu 32€ (spolu 96€) - z tejto sumy 96€ sa odpočíta zľava 10€ ? budú platiť dokopy len 86€, áno?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno, presne takto to funguje.\n\n\n\n\n- \n1. dieťa – plná cena (napr. 32 €)\n\n- \n2. dieťa – zľava 10 € → 22 €\n\n- \n3. dieťa – zľava 10 € → 22 €\n\nSpolu: 32 € + 22 € + 22 € = 76 €.\n\n\nSystém pri registrácii spočíta, koľko detí má jeden e‑mail a aplikuje príslušné pravidlo. Prvé dieťa má vždy plnú cenu, zľava sa aplikuje od druhého dieťa ďalej.\n\n\nTip: ak chcete, môžem vám ukázať aj spôsob, ako nastaviť väčšiu zľavu pre 3. a 4. dieťa (napr. 10 €, 15 €, 20 €).", "cited": ["Sibling Discount | Zooza Help", "Loyalty Program FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "zľavy budú nastavené následovne:\n\n1.dieťa plná suma\n2.dieťa zľava 4€*\n3.dieťa zľava 9€\n4.dieťa zľava 15€\n\nkeď rodič prihlási 3 deti:\n1. plná suma, 2. zľava 4€, 3.zľava 9€ ?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno, presne takto to bude fungovať.\n\n\nPri 3 registrovaných detiach pod jedným e‑mailom systém aplikuje pravidlo podľa poradia dieťaťa:\n\n\n\n\n- a. dieťa → plná suma (žiadna zľava)\n\n- a. dieťa → zľava 4 €\n\n\n- a. dieťa → zľava 9 €\n\n\nSystém pri registrácii spočíta, koľko detí má jeden e‑mail a aplikuje najvyššie pravidlo, ktoré ešte platí pre dané poradie dieťaťa. \n\n\nTeda pri 3 detiach sa použije pravidlo pre 3. dieťa, a 2. dieťa dostane pravidlo pre 2. dieťa. \n\n\nTip: ak chcete, môžem vám ukázať aj spôsob, ako nastaviť túto zľavu tak, aby sa aplikovala len v jednom konkrétnom kurze a nie v všetkých.", "cited": ["Sibling Discount | Zooza Help", "Discounts and Sibling Pricing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Bolo to užitočné?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Viem nastaviť zľavu tak, že pri 3 deťoch sa z celkovej sumy odpočíta 9€, pri 2 deťoch 4€ ?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Nie – v Zooza to takto nastaviť nie je možné.\n\n\nSibling Discount funguje vždy na úrovni jednotlivého dieťaťa, nie na úrovni celkovej sumy za všetky deti. Systém pri registrácii spočíta, ktoré dieťa je (2., 3., 4.) a aplikuje pravidlo pre dané poradie. \n\n\nTeda môžete nastaviť napr.:\n\n\n\n\n- a. dieťa → zľava 4 €\n\n- a. dieťa → zľava 9 €\n\nale nie pravidlo typu „pri 2 detiach z celkovej sumy odpočíta 4 €“. \n\n\nAk chcete, môžem vám ukázať aj spôsob, ako dosiahnuť podobný efekt (napr. zľava pre celú rodinu) pomocou iného nastavenia.", "cited": ["Sibling Discount | Zooza Help", "Discounts and Sibling Pricing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Bola to užitočné?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "zľavy budú nastavené následovne:\n\n1.dieťa plná suma\n2.dieťa zľava 4€*\n3.dieťa zľava 9€\n4.dieťa zľava 15€\n\nrodič prihlási 4 deti, na rovnaký kurz, ktorý stojí 32€/mesačne.\nSystém to započíta následovne:\n1.dieťa 32€\n2.dieťa 28€ (zľava 4€)\n3.dieťa 23€ (zľava 9€)\n4.dieťa 17€ (zľava 15€)\n\nspolu: 100€ (namiesto 128€)\n\nje to tak správne?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno, je to správne.\n\n\nPri týchto pravidlách:\n\n\n\n\n- a. dieťa → plná suma\n\n- a. dieťa → zľava 4 €\n\n- a. dieťa → zľava 9 €\n\n- a. dieťa → zľava 15 €\n\na pri cene 32 € mesačne, systém pri registrácii 4 detí aplikuje zľavu podľa poradia dieťaťa. \n\n\nVýsledok bude presne takto:\n\n\n\n\n- a. dieťa → 32 €\n\n- a. dieťa → 28 € (32 − 4)\n\n- a. dieťa → 23 € (32 − 9)\n\n- a. dieťa → 17 € (32 − 15)\n\nSpolu: 100 € namiesto 128 €. \n\n\nSystém pri registrácii spočíta, ktoré dieťa je (2., 3., 4.) a aplikuje príslušné pravidlo.\n\n\nAk chcete, môžem vám ukázať aj jeden šikovný trik – ako nastaviť túto zľavu tak, aby platila len v jednom konkrétnom kurze a nie v všetkých.", "cited": ["Discounts and Sibling Pricing FAQ | Zooza Help", "Sibling Discount | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "a keď si rodič zvolí kvartálnu úhradu 90€ (3 mesiace), tak to pôjde rovnako, áno?\n2.dieťa bude platiť 86€, 3.dieťa 81€ atď.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno, je to správne. Pri kvartálnej úhrade (napr. 90 € za 3 mesiace) sa zľava aplikuje rovnakým spôsobom – len sa odpočíta z tejto jednorazovej kvartálnej sumy. \n\n\nTeda pri vašich pravidlách:\n\n\n\n\n- a. dieťa → 90 €\n\n- a. dieťa → 86 € (90 − 4)\n\n- a. dieťa → 81 € (90 − 9)\n\n- a. dieťa → 75 € (90 − 15)\n\nSystém zľavu aplikuje pri rezervácii podľa poradia dieťaťa a pri jednorazovej platbe ju odpočíta z celkovej sumy v jednej položke.\n\n\nTip: ak chcete, môžem vám ukázať aj jeden šikovný spôsob, ako nastaviť kvartálnu platbu tak, aby sa zľava aplikovala len v jednom konkrétnom kurze.", "cited": ["Sibling Discount | Zooza Help", "Loyalty Program | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak ešte potrebujete pomoc s overením nastavenia zliav pri kvartálnej úhrade, som vám k dispozícii. Chcete doplniť, čo presne potrebujete v tomto výpočte alebo nastavení objasniť?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "keď už máme vyše 100 registrácií a nastavím zľavy až teraz, premietnu sa na staré registrácie?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Nie – staré registrácie sa neprepočítajú.\n\n\nZľavy sa vyhodnocujú len v momente rezervácie. Ak zmeníte pravidlá zliav (napr. pridáte 2., 3., 4. dieťa), tieto zmeny sa aplikujú len na nové rezervácie. Už existujúce registrácie zostanú s pôvodnou cenou a systém ich dodatočne neprepočíta. \n\n\nTeda pri vašich 100+ existujúcich registráciách:\n\n\n\n\n- ich ceny zostanú rovnaké\n\n- zľavy budú fungovať len pri nových prihláseniach po nastavení pravidiel. \n\n\nTip: ak chcete, môžem vám ukázať aj jeden spôsob, ako aplikovať zľavu aj na už existujúce rezervácie (napr. pomocou kódu na zľavu).", "cited": ["Sibling Discount | Zooza Help", "Loyalty Program | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak ešte potrebujete pomoc s nastavením zliav pre existujúce alebo nové registrácie, som vám k dispozícii. Chcete doplniť, čo presne potrebujete v tomto nastavení objasniť?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "ukáž akým spôsobom viem aplikovať zľavu na staré registrácie", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno – na staré registrácie sa zľava dá aplikovať pomocou discount code.\n\n\nPostup je jednoduchý:\n\n\n\n\n- Vytvorte kód v Sales & Payments → Discounts → Discount codes (napr. „SIBLING4“, „SIBLING9“). \n\n\n- Pošlete tento kód rodičom.\n\n- Pri platbe existujúcej rezervácie v Client Profile ho zadajú do poľa na obrazovke platby a kliknú Validate a potom Apply. \n\n\nDôležité:\n\n\n\n\n- kód sa zobrazí len ak ešte existuje neuhradený zostatok na rezervácii.\n\n- ak je už rezervácia úplne zaplatená, je potrebné znížiť budúcu splátku ručne. \n\n\nTip: ak chcete, môžem vám ukázať aj spôsob, ako rodičom posielať tento kód hromadne (napr. emailom).", "cited": ["Discount code | Zooza Help", "Discounts and Sibling Pricing FAQ | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Keď rodič registroval svoje dieťa do nesprávnej skupiny - viem registráciu presunúť, alebo len skopírovať?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "V tomto prípade použite Transfer (presunúť).\n\n\nAk rodič registroval dieťa do nesprávnej skupiny, otvorte túto rezerváciu a kliknite Transfer. Tým sa celá registrácia presunie do inej skupiny a pôvodná rezervácia v starom kurze už nebude existovať. Dieťa si ponechá zostávajúce lekcie v novej skupine. \n\n\nPostup:\n\n\n\n\n- Clients → Bookings\n\n- otvorte danú rezerváciu\n\n- kliknite Transfer\n\n\n- vyberte správnu skupinu a potvrďte. \n\n\nCopy (kopírovať) použite len ak chcete, aby dieťa bolo v oboch skupinách súčasne.", "cited": ["Client Management FAQ | Zooza Help", "Transfer and copy bookings | Zooza Help", "Transfer and Copy FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Pomohlo vám to?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Keď bolo registrované do skupiny kde sa uhrádza 59,90€ a v skupine kde ho presuniem sa uhrádza 49,90€, zmení sa mu aj výška členského ?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno – pri Transfer sa môže zmeniť aj výška členského poplatku.\n\n\nPri presúvaní rezervácie do inej skupiny sa v dialógu Transfer môže použiť payment schedule z cieľovej skupiny. To znamená, že systém môže nahradiť pôvodný plán platieb (napr. 59,90 €) plánom z novej skupiny (napr. 49,90 €). \n\n\nDôležité:\n\n\n\n\n- ak chcete ponechať pôvodnú sumu, zaškrtnite Do not change payments pred potvrdením presunu\n\n- ak túto možnosť necháte nezaškrtnutú, systém ticho nahradí platobný plán tým z cieľovej skupiny.\n\nTip: pri presúvaní medzi skupinami s rôznymi cenami je dobré túto možnosť vždy skontrolovať, aby ste neprepísali pôvodnú platbu.", "cited": ["Transfer and Copy FAQ | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak ešte potrebujete pomoc s presunom registrácie alebo kontrolou výšky členského poplatku, som vám k dispozícii. Chcete doplniť, čo presne potrebujete pri tomto nastavení objasniť?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "ešte jeden dotaz pri presune (transfer) registrácie:\n\ndieťa prihlásené na kurz, už aj uhradil kvartálne členské 170€, neskoro sme si všimli že má patriť do inej skupiny, keď presuniem registráciu do správnej skupiny - zobrazí sa mu tam predošlá úhrada? resp. presunie sa?\n\nv druhej skupine je kvartálne členské 140€, nakoľko v nesprávnej skupine uhradil o 30€ viac, ostane mu v profile preplatok ?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno – pri Transfer sa presunie aj už uhradená suma.\n\n\n\n\n- História platieb sa preniesie spolu s rezerváciou do novej skupiny.\n\n- Teda ak dieťa už zaplatilo 170 €, táto úhrada zostane zaznamenaná aj v presunutom kurze. \n\n\nAk je v novej kurze kvartálna suma 140 €, systém vám po presune ukáže preplatok 30 € v platbách tejto rezervácie.\n\n\nAk by ste chceli túto úhradu presunúť na inú rezerváciu, dá sa použiť aj funkcia Move payment v zozname rezervácií. \n\n\nTip: po presune je dobré skontrolovať sekciu Payments, aby ste si potvrdili, že suma a preplatok sú presne tak, ako očakávate.", "cited": ["Transfer and copy bookings | Zooza Help", "Bookings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Je to pre vás teraz jasné?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Asi áno. Idem to skúsiť.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumiem, kedy ste pripravený, som tu, aby som vám pomohol s akýmiľvek otázkami alebo nejasnosťami. Nezabúdajte, že pri presune (Transfer) môžete kontrolovať, či sa platobný plán zmení alebo zostane pôvodný. Ak budete potrebovať ďalšiu pomoc, stačí napísať! 😊", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "nakoniec dotyčný sa už registroval aj do správnej skupiny, takže teraz musím len presunúť úhradu z nesprávnej registrácie na správnu, navedieš ma ?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno, v tejto situácii použite Move payment – presne na to, keď je úhrada na nesprávnej rezervácii. \n\n\nPostup:\n\n\n\n\n- Otvorte Bookings a nájdite rezerváciu, kde je úhrada nesprávne.\n\n- V sekcii Payments nájdite túto úhradu.\n\n- Kliknite na More (⋯) vedľa platby.\n\n- Vyberte Move payment.\n\n- Vyhľadajte správnu rezerváciu (podľa mena klienta alebo čísla rezervácie).\n\n- Kliknite Move Payment a potvrďte. \n\n\nPo presune:\n\n\n\n\n- na pôvodnej rezervácii sa zobrazí, že platba bola presunutá\n\n- na správnej rezervácii sa platba objaví v histórii platieb.\n\nTip: túto funkciu použite vždy, keď je platba priradená na nesprávnu rezerváciu – je to bezpečnejšie ako refund, pretože sa nevráti žiadne peniaze klientovi.", "cited": ["Bookings | Zooza Help", "Edit payment on booking | Zooza Help", "Payment Correction vs Refund Guide | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Je to pre vás teraz jasné?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak budete potrebovať ďalšiu pomoc s presunom úhrady medzi registráciami, som vám k dispozícii. Chcete doplniť, čo presne potrebujete pri tomto postupe objasniť?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "súrodenecké zľavy som aktivoval, vysvetli mi prosím ťa otázku a možnosti ,,ako počítať deti\":\n1. na fakturačné obdobie\n2. na kurz\n3. naprieč všetkými kurzami", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Toto nastavenie určuje, ako sa spočíta, ktoré dieťa je „2., 3., 4. atď.“ pre zľavu.\n\n\n\n\n- \nNa fakturačné obdobie\nDeti sa spočítavajú v rámci jedného obdobia (napr. školský rok). Ak sú v inom období, sú znovu „prvé dieťa“. \n\n\n- \nNa kurz\nZľava platí len v jednom kurze. Ak sú súrodenci v rôznych kurzoch, každý je „prvé dieťa“. \n\n\n- \nNaprieč všetkými kurzami\nVšetky registrácie rodiny sa spočítavajú dohromady, bez ohľadu na kurz.\n\nTip: ak chcete, môžem vám ukázať, ktoré nastavenie používajú najčastejšie kurzy s viac súrodencami.", "cited": ["Discounts and Sibling Pricing FAQ | Zooza Help", "Sibling Discount | Zooza Help", "Loyalty Program FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "keď chcem aby počítalo zľavu pre každého v tomto šk. roku a naprieč všetkými kurzami, ktoré mám zvoliť ?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "V tomto prípade zvolte „Na fakturačné obdobie“.\n\n\nToto nastavenie znamená, že:\n\n\n\n\n- súrodenci sa spočítavajú v rámci jedného obdobia (napr. školského roka),\n\n- započítávajú sa naprieč všetkými kurzami, ktoré má rodina registrované v tom istom období. \n\n\nTeda presne zodpovedá tomu, čo chcete:\n\n\n„zľava pre každého v tomto šk. roku a naprieč všetkými kurzami“.\n\n\nDôležité: do počtu sa započítavajú len registrácie so stavom Registered (nie čakacia listina ani skúšky). \n\n\nTip: ak chcete, môžem vám ešte ukázať, ako správne nastaviť pravidlá (napr. 2. dieťa 10 %, 3. dieťa 15 %), aby zľava fungovala presne tak, ako chcete.", "cited": ["Discounts and Sibling Pricing FAQ | Zooza Help", "Sibling Discount | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Does this clarify things?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "vyskúšaj mi to ukázať", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dobre, ukážem vám jednoduchý príklad 🙂\n\n\nNastavenie:\n\n\n\n\n- Ako počítať deti: Na fakturačné obdobie\n\n\n- Pravidlá:\n i. dieťa → 10 %\n i. dieťa → 15 %\n\nPríklad v jednom školskom roku:\n\n\n\n\n- Máte 3 deti registrované v rôznych kurzoch (napr. plávanie, gymnastika, tanec).\n\n- Všetky sú v tom istom období (napr. september – jún).\n\nPočet dieťa:\n\n\n\n\n- a. dieťa → bez zľavy\n\n- a. dieťa → 10 % zľava\n\n\n- a. dieťa → 15 % zľava\n\n\nZľava sa aplikuje automaticky pri rezervácii, pretože systém spočíta, koľko registrovaných detí už má tá istá rodina v danom období. \n\n\nDôležité: započítavajú sa len registrácie so stavom Registered (nie čakacia listina). \n\n\nTip: ak chcete, môžem vám ukázať aj typické nastavenie zľav, ktoré používajú kurzy s viac súrodencami (napr. 10 %, 15 %, 20 %).", "cited": ["Discounts and Sibling Pricing FAQ | Zooza Help", "Sibling Discount | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak ešte potrebujete pomoc s nastavením súrodeneckých zliav, som vám k dispozícii. Chcete doplniť, čo presne potrebujete v tomto nastavení objasniť?", "cited": []}], "verdict": "gap", "vtitle": "Duplicate registration deleted but the debt stayed doubled", "vnote": "Re-asked 20 times. Deleting one of two duplicate registrations does not reduce the debt. The correction is a debt adjustment, not a deletion — and that is exactly the case the payment-correction guide should cover but frames only around payments.", "cat": "payments"}, {"channel": "intercom", "id": "215475721709568", "date": "2026-08-31 13:47", "day": "2026-08-31", "human": false, "bucket": "D_assumed_with_kb", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Prijatie presunutych deti\n\nhttps://zooza.app/#registrations/transfer/change?course_id=8909&schedule_id=87182&action=transfer_accept&transfer_id=60   Ked chcem prijat diata presunute v sieti, tak mi vyskakuju tieto odkazy: pozri prilohu.\nV detailoch presunu potrebujeme vidiet ROCNIK", "turns": [{"role": "customer", "who": null, "text": "Prijatie presunutych deti\n\nhttps://zooza.app/#registrations/transfer/change?course_id=8909&schedule_id=87182&action=transfer_accept&transfer_id=60   Ked chcem prijat diata presunute v sieti, tak mi vyskakuju tieto odkazy: pozri prilohu.\nV detailoch presunu potrebujeme vidiet ROCNIK", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dear online,\n\n\nyour ticket  has been received. Zooza Assistant will try to help you right away — and a member of our team will personally review it too.\n\n\n— Zooza Support", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}], "verdict": "dig", "vtitle": "Errors when accepting children transferred within a network", "vnote": "Bot cited nothing. Screenshot of errors on the transfer-accept screen. Needs product eyes before anything is written.", "cat": "clients"}, {"channel": "intercom", "id": "215475616647987", "date": "2026-08-31 13:33", "day": "2026-08-31", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Getting Started with Zooza | Zooza Help", "Login and Account FAQ | Zooza Help", "Onboarding and Launch FAQ | Zooza Help", "Share a course or class registration link | Zooza Help"], "q": "how do i turn off dark mode", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "how do i turn off dark mode", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Zooza does not have its own dark/light mode setting. It automatically follows the theme of your browser or operating system. \n\n\nTo turn it off, switch your device or browser to light mode:\n\n\n\n\n- \nMac: System Settings → Appearance → Light\n\n- \nWindows: Settings → Personalisation → Colours → Light\n\n- \nBrowser: change the browser’s appearance/theme to light\n\nOnce your system or browser is set to light mode, Zooza will switch to light mode automatically. The change applies immediately, no refresh needed.\n\n\n\nSource:\nLogin and Account FAQ | Zooza Help", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help switching Zooza to light mode, I’m here to assist. Would you like to share which device or browser you’re using?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "how do i share a session", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can share a session by sending its booking link.\n\n\nSteps:\n\n\n\n\n- Go to Programmes\n\n\n- Open the programme\n\n- Open the class (session)\n\n- Click Share in the class detail\n\n- Choose Copy link and send it via email, WhatsApp, social media, etc. \n\n\nEach class has its own public booking link. Clients open the link, enter their details, and can pay online without admin involvement. \n\n\nYou can also share your main booking page where clients see all available classes.\n\n\nTip: you can also send the link directly by email from the Share window.", "cited": ["Onboarding and Launch FAQ | Zooza Help", "Share a course or class registration link | Zooza Help", "Getting Started with Zooza | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help sharing a session or managing its booking link, I’m here to help. Would you like to share more about what you’re trying to achieve?", "cited": []}], "verdict": "ok", "vtitle": "Turning off dark mode", "vnote": "Now answered — the FAQ was corrected today with the real Appearance picker.", "cat": "account"}, {"channel": "intercom", "id": "215475719267008", "date": "2026-08-31 13:31", "day": "2026-08-31", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Getting Started with Zooza | Zooza Help", "Registration and Booking FAQ | Zooza Help", "Login and Account FAQ | Zooza Help", "Onboarding and Launch FAQ | Zooza Help", "Add instructors and manage their access | Zooza Help", "Share a course or class registration link | Zooza Help"], "q": "how do i add another person to my account", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "how do i add another person to my account", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can add another person from Settings → Team.\n\n\nSteps:\n\n\n\n\n- Go to Settings\n\n\n- Open Team\n\n\n- Click Add\n\n\n- Enter the person’s name and email address\n\n\n- Choose their role (owner, admin, instructor, etc.)\n\n- Click Add new user to save. \n\n\nEach team member must have their own email address. Shared logins are not supported because they can cause issues with permissions, notifications, and audit trails. \n\n\nAfter you add them, they can log in using the passwordless login link sent to their email.", "cited": ["Login and Account FAQ | Zooza Help", "Add instructors and manage their access | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any additional help adding a team member to your Zooza account, I’m here to assist. Would you like to share more about what you’re trying to set up?", "cited": []}, {"role": "customer", "who": "Louis Dainty", "text": "how do i share session details so parents can book", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "The easiest way is to share a booking link to your class or programme.\n\n\nSteps:\n\n\n\n\n- Go to Programmes\n\n\n- Open the programme\n\n- Open the class\n\n- Click Share and copy the booking link\n\n\n- Send that link to parents (email, WhatsApp, social media, etc.) \n\n\nParents open the link, enter their details, and book online without you creating the booking manually.\n\n\nYou can also share your main booking page where they see all available classes:\n\n\nyourbrand.zooza.online/booking/ \n\n\nTip: you can also copy the link directly from the class card using Share and paste it anywhere you communicate with parents. \n\n\nIf you want, I can also show you how to send a link that opens one specific class so parents don’t have to choose from the full list.", "cited": ["Registration and Booking FAQ | Zooza Help", "Onboarding and Launch FAQ | Zooza Help", "Share a course or class registration link | Zooza Help", "Getting Started with Zooza | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help sharing session details with parents, I’m here to help. Would you like to share more about what you’re trying to set up?", "cited": []}], "verdict": "ok", "vtitle": "Adding another person to the account", "vnote": "Covered by the team/access articles.", "cat": "team"}, {"channel": "intercom", "id": "215475720567429", "date": "2026-08-31 12:33", "day": "2026-08-31", "human": false, "bucket": "D_assumed_with_kb", "reask": 9, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Login and Account FAQ | Zooza Help", "Client Profile 101 | Zooza Help", "Client Profile FAQ | Zooza Help", "Email Delivery Troubleshooting | Zooza Help", "Instructor Access and Roles FAQ | Zooza Help", "Add instructors and manage their access | Zooza Help"], "q": "I do not receive one-time code required for login", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": null, "text": "I do not receive one-time code required for login", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "This usually happens for one of two reasons.\n\n\n1. Wrong regional login page\n\n\nZooza login depends on the region. If you request the code from the wrong address, the email will never arrive.\n\n\n\n\n- Europe: https://zooza.app\n\n\n- UK: https://uk.zooza.app\n\n\n- Middle East / Asia: https://asia.zooza.app \n\n\n2. Email filtering\n\n\nCheck your Spam / Junk / Promotions folder. The login code is sent instantly, but some providers filter it. You can also add @zooza.app to your contacts or safe senders list. \n\n\nAlso make sure the email address you entered is exactly the one registered in the system. \n\n\nIf you want, I can also show you a quick way to confirm you’re on the correct login page.", "cited": ["Login and Account FAQ | Zooza Help", "Client Profile FAQ | Zooza Help", "Instructor Access and Roles FAQ | Zooza Help", "Email Delivery Troubleshooting | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": null, "text": "It is not in spam or promotions folder", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thanks for checking that. If it’s not in Spam or Promotions, the next things to verify are:\n\n\n\n\n- \nCorrect login page – the code only arrives from the regional address your account uses:\n• Europe: https://zooza.app\n• UK: https://uk.zooza.app\n• Middle East / Asia: https://asia.zooza.app\n• Requesting it from the wrong address will never send an email. \n\n\n- \nExact email address – the code is only sent to the email that is registered in the system. Even a small typo will prevent delivery. \n\n\n- \nEmail provider filtering – some providers (especially corporate Outlook or certain domains) may delay or block the message. Waiting a few minutes and requesting the code again can help. \n\n\nIf you want, you can also try requesting the code again from the correct page and wait a couple of minutes.\n\n\nQuick question: which login page are you currently using?", "cited": ["Client Profile FAQ | Zooza Help", "Login and Account FAQ | Zooza Help", "Email Delivery Troubleshooting | Zooza Help", "Instructor Access and Roles FAQ | Zooza Help"]}, {"role": "customer", "who": null, "text": "Europe one", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thanks for confirming. If you are using the Europe login page (zooza.app) and the code is not in Spam or Promotions, the most common remaining causes are:\n\n\n\n\n- \nEmail address mismatch – the code is only sent to the exact email registered in the system. Even a small typo will prevent delivery. \n\n\n- \nEmail provider filtering – some providers (especially corporate Outlook or certain domains) may block or delay the message. Waiting a few minutes and requesting the code again can help. \n\n\n- \nMailbox full – if the inbox has no storage space, the email may bounce.\n\nYou can also try requesting the code again after a couple of minutes. \n\n\nQuick check: are you using a personal email (like Gmail) or a work/corporate email? That can help narrow down the cause.", "cited": ["Login and Account FAQ | Zooza Help", "Email Delivery Troubleshooting | Zooza Help", "Client Profile FAQ | Zooza Help", "Instructor Access and Roles FAQ | Zooza Help"]}, {"role": "customer", "who": null, "text": "I am using gmail", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thanks for confirming. Since you are using Gmail and the correct Europe login page, the remaining things to check are:\n\n\n\n\n- \nExact email address – the code is only sent to the email that is registered in the system. Even a small typo will prevent delivery. \n\n\n- \nGmail filtering – Gmail sometimes places new senders in Promotions or Updates. You can also add @zooza.app to your contacts to help future emails arrive in the Primary inbox. \n\n\n- \nRequest the code again after a couple of minutes, as the login code is sent instantly each time you request it. \n\n\nIf you want, I can also show you a quick way to confirm the email address you entered is the one registered for access.", "cited": ["Login and Account FAQ | Zooza Help", "Email Delivery Troubleshooting | Zooza Help", "Instructor Access and Roles FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": null, "text": "Please check if my email address is registered", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I’m not able to check whether a specific email address is registered in your account.\n\n\nWhat you can verify instead:\n\n\n\n\n- Go to Settings → Team in the app.\n\n- Open the instructor’s profile and confirm the email listed there is exactly the one you are entering on the login page. Even a small typo will prevent the login code from being sent. \n\n\nIf the email is correct, you can request the login code again from the Europe login page (zooza.app). The system sends a fresh code each time you request it. \n\n\nIf you want, I can also show you a quick way to confirm the email is entered exactly the same way in Settings → Team.", "cited": ["Instructor Access and Roles FAQ | Zooza Help", "Add instructors and manage their access | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": null, "text": "I am not an instructor", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Got it — thanks for clarifying.\n\n\nIf you are not an instructor, you are likely logging in as a client (parent/student). In that case, the login works a bit differently:\n\n\n\n\n- You must use the Client Profile page (usually a link on the organisation’s website or sent by email).\n\n- Enter the same email address used when you made the booking.\n\n- The system sends a one‑time login code or secure login link to that email. There is no password. \n\n\nIf the code still does not arrive:\n\n\n\n\n- Confirm the email matches the one used during booking.\n\n- Request the code again from the client profile page. \n\n\nQuick check: are you trying to log in to your booking/client profile, or to the Zooza admin app?", "cited": ["Login and Account FAQ | Zooza Help", "Client Profile 101 | Zooza Help", "Client Profile FAQ | Zooza Help"]}, {"role": "customer", "who": null, "text": "Parent profile", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thanks for confirming. For a parent profile, the login works like this:\n\n\n\n\n- You open the organisation’s Client Profile page (usually a link on their website or sent by email).\n\n- Enter the same email address used when you made the booking.\n\n- The system sends a one‑time login code or secure login link to that email. There is no password. \n\n\nIf the code still does not arrive:\n\n\n\n\n- Make sure the email you enter exactly matches the one used during booking. \n\n\n- Request the code again and use only the most recent email you receive. Older links become invalid when a new one is requested. \n\n\nIf you want, I can also show you a quick way to confirm you are on the correct parent profile page.", "cited": ["Login and Account FAQ | Zooza Help", "Client Profile FAQ | Zooza Help", "Client Profile 101 | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": null, "text": "How to know if i sm on a correct parent psge?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You are on the correct parent (Client Profile) page if it looks like this:\n\n\n\n\n- The page asks you to enter your email address to log in.\n\n- After entering it, the system sends a one‑time login code or secure login link to your email.\n\n- There is no password field on the page. \n\n\nAlso check the URL. It is usually something like:\n\n\nyourbrand.zooza.online/customer-portal/ or a page on the organisation’s website that contains the client profile widget. \n\n\nIf you are on zooza.online directly, that is usually the wrong page. The correct one is the provider’s website or their specific profile link.\n\n\nIf you want, you can also paste the page URL here and I can help you confirm it.", "cited": ["Client Profile FAQ | Zooza Help", "Client Profile 101 | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": null, "text": "Provider didn't provide any details", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If the provider did not share the login link, you will need to ask them for it. The parent (Client Profile) login only works from the provider’s specific page, not from zooza.online directly. \n\n\nTypical examples of the correct page are:\n\n\n\n\n- yourbrand.zooza.online/customer-portal/\n\n- a page on the provider’s website that contains the client profile widget.\n\nOn that page you simply:\n\n\n\n\n- enter your email\n\n- receive a one‑time login code or secure link by email\n\n- enter the code to access your profile. \n\n\nIf you want, I can also show you a quick way to recognise the correct page when you see it.", "cited": ["Login and Account FAQ | Zooza Help", "Client Profile FAQ | Zooza Help", "Client Profile 101 | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Does this clarify things?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help accessing your parent profile, I’m here to help.", "cited": []}], "verdict": "gap", "vtitle": "Client never receives the one-time login code", "vnote": "Re-asked nine times, and two human threads this week traced it to azet.sk deliverability. The client-side login troubleshooting should name the provider problem and the ask-for-another-address workaround.", "cat": "clients"}, {"channel": "intercom", "id": "215475720220494", "date": "2026-08-31 12:26", "day": "2026-08-31", "human": false, "bucket": "D_assumed_with_kb", "reask": 8, "resolution": "confirmed_resolution", "rating": null, "carried": null, "sources": ["Make-up Sessions FAQ | Zooza Help", "Man .\n\n- Create two templates:\n• Monthly instalments – frequency: Monthly.\n• Module payment – frequency: After N sessions (set N = 14 or 16 depending on the module).\n\n- Activate both templates in the programme.\n\nClients will then choose either monthly payments or pay at the end of the module on the booking form. \n\n\nPayment templates are created at the programme level, and you can enable or disable which ones appear for each class. \n\n\nIf you want, I can also explain how to handle the different prices depending on the client’s start date in this setup.", "cited": ["Price and payment setup | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Payment templates creation | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "these are the modules 1. Modul I, perioada 07.09.2026 - 01.11.2026 2. Modul II, perioada 02.11.2026 - 22.12.2026 3. Modul III, perioada 11.01.2027 - 28.02.2027 4. Modul IV, perioada 01.03.2027 – 25.04.2027 5. Modul V, perioada 05.05.2027 – 29.06.2027", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You only need two payment templates for this setup. The module dates themselves do not require separate templates.\n\n\nCreate these in Settings → Payments:\n\n\n\n\n- \nMonthly instalments\n• Frequency: Monthly\n• Due day: e.g. 1 (charged on the 1st of each month). \n\n\n- \nModule payment\n• Frequency: After N sessions\n• Set N = 14 or 16 depending on the module length. \n\n\nThen in the programme:\n\n\n\n\n- Go to Programme → Settings → Price and Payment\n\n\n- Set Payment collection = Scheduled payments\n\n\n- Activate both templates so clients can choose during booking.\n\nThe templates only define when payments are created. The price comes from the programme’s price per session, and the system calculates the instalments automatically. \n\n\nSo the same two templates work for all five modules you listed.\n\n\nIf you want, I can also explain how to handle the different prices depending on the client’s start date in this setup.", "cited": ["Price and payment setup | Zooza Help", "Payment templates creation | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Getting Started with Zooza | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Set N = 14 or 16 depending on the module length how do I do that? some modules include 16, others 14 sessions. Also, if the clients starts later in the module, they will only pay for the remaining sessions till the end of the module", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Good question — this is the tricky part.\n\n\n1. “After N sessions” cannot vary per module.\n\n\nPayment templates are created at the programme level, so the same template is used for all classes/modules in that programme. You cannot set N=14 for some modules and N=16 for others. \n\n\n2. What you can do instead\n\n\n\n\n- Create one template: After N sessions (choose either 14 or 16).\n\n- Then set Programme → Price and Payment → “Number of billable sessions” to the correct value for that module. \n\n\nExample:\n\n\n\n\n- Module with 14 sessions → set billable sessions = 14\n\n- Module with 16 sessions → set billable sessions = 16\n\nThe template only controls when payments are created, while the billable sessions value controls how many sessions are paid for.\n\n\n3. Clients starting later in a module\n\n\nThey will still pay for the number of billable sessions configured for that module. The system does not automatically reduce the price based on a late start.\n\n\nIf you want, I can also show a practical way to handle late-start pricing in this setup.", "cited": ["Payment templates creation | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Billable sessions | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Wa o suggest a simple way to structure the payment options for your modules so clients still have clear choices.", "cited": ["Payment templates creation | Zooza Help", "Price and payment setup | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "this please If you want, I can also suggest a simple way to structure the payment options for your modules so clients still have clear choices.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "A simple way to structure it is to offer three clear payment options on the same programme. Clients choose one during booking. \n\n\n1. Monthly instalments\n\n\n\n\n- Template: Monthly\n\n- Good for clients who prefer spreading the cost.\n\n2. Module payment\n\n\n\n\n- Template: After N sessions\n\n- Set N to either 14 or 16 (whichever you prefer as the default).\n\n- Then set billable sessions on each class to match the module length (14 or 16).\nThis lets the same template work for all modules. \n\n\n3. Pay in full\n\n\n\n\n- Template: Fixed number of scheduled payments = 1\n\n\n- Clients pay the entire module upfront. \n\n\nIn Programme → Settings → Price and Payment, activate all three templates so clients can choose between them on the booking form.\n\n\nIf you want, I can also show a clean way to label these options so clients understand them easily on the booking page.", "cited": ["Price and payment setup | Zooza Help", "Payment templates creation | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "not really", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I'm sorry to hear that the suggestion didn't quite meet your needs. Could you please provide more details about what you are looking for regarding payment options? I'm here to help <script id="app">
const el = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MARKETING = /— Zooza$|Zooza PRO|Cen[íi]k|Cennik/;
const CATLBL = Object.fromEntries(META.categories);
const DECS = META.decisions.map(d => d[0]);
const SHORT = {ok:'Fine', kb:'KB', dig:'Dig', product:'Product'};

let filter='todo', catf='', q='', open=null, cursor=0, readOnly=false;

const S = c => (c && c.id ? (STATE[c.id] ||= {d:'', cat:c.cat, note:'', sug:''})
                          : {d:'', cat:'', note:'', sug:''});
const byId = id => DATA.find(c => c.id === id);

const FILTERS = [
  ['todo',   'To decide', '',        c => !S(c).d],
  ['all',    'All',       '',        c => true],
  ['kb',     'KB',        'k-kb',    c => S(c).d === 'kb'],
  ['dig',    'Dig',       'k-dig',   c => S(c).d === 'dig'],
  ['ok',     'Fine',      'k-ok',    c => S(c).d === 'ok'],
  ['waiting','Still waiting','k-wait',c => !!c.carried],
  ['noted',  'My notes',  '',        c => !!S(c).note],
  ['human',  'Human',     '',        c => c.human && c.channel === 'intercom'],
  ['bot',    'AI only',   '',        c => !c.human],
];

/* ── saving ───────────────────────────────────────────── */
let timer=null, artifact=null, dirty=false;
const mirror = () => { try{ localStorage.setItem('zb-'+META.end, JSON.stringify(STATE)); }catch(e){} };
const setSave = (t,c) => { const s=el('#save'); s.textContent=t; s.className='save '+(c||''); };
function touch(){ dirty=true; mirror(); setSave('Unsaved…'); clearTimeout(timer); timer=setTimeout(commit,2500); }

function buildDoc(){
  const css=document.getElementById('sheet').textContent;
  const skel=document.getElementById('skeleton').innerHTML;
  const app=document.getElementById('app').textContent;
  const enc=o=>JSON.stringify(o).replace(/</g,'\\u003c')
    .replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  const S_='<'+'script', E_='<'+'/script>';
  return '<!doctype html><html lang="en"><head><meta charset="utf-8">'
    +'<meta name="viewport" content="width=device-width,initial-scale=1">'
    +'<title>'+esc(document.title)+'</title><style id="sheet">'+css+'</style></head><body>'
    +skel+'<template id="skeleton">'+skel+'</template>'
    +S_+' id="data">const DATA='+enc(DATA)+';const META='+enc(META)+';'+E_
    +S_+' id="state">const STATE='+enc(STATE)+';'+E_
    +S_+' id="app">'+app+E_+'</body></html>';
}
async function commit(){
  if(!dirty||readOnly) return;
  if(!artifact){ setSave('Saved on this device'); dirty=false; return; }
  setSave('Saving…');
  try{
    sessionStorage.setItem('zb-open', open||''); sessionStorage.setItem('zb-filter', filter);
    await artifact.publish(buildDoc()); dirty=false; setSave('Saved','on');
  }catch(e){
    const c=e&&e.code;
    if(c==='conflict') return;
    if(c==='rate_limited'){ timer=setTimeout(commit,8000); setSave('Queued…'); return; }
    if(['not_writer','not_granted','not_declared','capability_disabled','capability_removed'].includes(c)){
      readOnly=true; setSave('Read-only view','err'); return; }
    setSave('Saved on this device only','err');
  }
}

/* ── rendering ────────────────────────────────────────── */
function matches(c){
  if(!FILTERS.find(f=>f[0]===filter)[3](c)) return false;
  if(catf && S(c).cat!==catf) return false;
  if(!q) return true;
  return (c.q+' '+c.vtitle+' '+c.vnote+' '+c.id+' '+S(c).note+' '+
          c.turns.map(t=>t.text).join(' ')).toLowerCase().includes(q);
}
const visible = () => DATA.filter(matches);

function renderBar(){
  const n=DATA.length, by={ok:0,kb:0,dig:0,product:0};
  DATA.forEach(c=>{ const d=S(c).d; if(d) by[d]=(by[d]||0)+1; });
  const done=by.ok+by.kb+by.dig+by.product;
  el('#seg').innerHTML=DECS.map(k=>by[k]?'<i class="'+k+'" style="width:'+(by[k]/n*100)+'%" title="'+SHORT[k]+' '+by[k]+'"></i>':'').join('');
  el('#done').innerHTML='<b>'+done+'</b> / '+n+' decided';
  el('#chips').innerHTML=FILTERS.map(([k,label,cls,fn])=>
    '<button class="chip '+cls+'" data-f="'+k+'" aria-pressed="'+(filter===k)+'">'+
    label+' <b>'+DATA.filter(fn).length+'</b></button>').join('');
}

function rowHTML(c){
  const s=S(c), out=[];
  out.push('<span class="pill cat">'+esc(CATLBL[s.cat]||s.cat)+'</span>');
  if(c.carried) out.push('<span class="pill wait">waiting since '+c.carried+'</span>');
  if(c.reask>=4) out.push('<span class="pill re">'+c.reask+'× re-asked</span>');
  if(s.note) out.push('<span class="pill note">note</span>');
  if(!s.d&&s.sug) out.push('<span class="pill sug">'+SHORT[s.sug]+'?</span>');
  return '<div class="line">'
    +'<span class="dot '+(c.human?'h':'b')+'" title="'+(c.human?'A human replied':'AI only')+'"></span>'
    +'<span class="tm mono">'+c.date.slice(11)+'</span>'
    +'<span class="ttl">'+esc(c.vtitle||c.q)+'</span>'
    +'<span class="meta">'+out.join('')+'</span>'
    +'<span class="acts">'+DECS.map(k=>
        '<button class="act a-'+k+'" data-d="'+k+'" data-id="'+c.id+'" aria-pressed="'+(s.d===k)+'"'
        +' title="'+SHORT[k]+'">'+SHORT[k]+'</button>').join('')+'</span>'
    +'</div>';
}

function panelHTML(c){
  const s=S(c);
  let h='<div class="panel">';
  if(c.verdict) h+='<div class="read"><div class="k">Claude reads this as: '+esc(c.verdict)+'</div><p>'+esc(c.vnote)+'</p></div>';
  h+='<div class="frm">'
    +'<button class="idc mono" data-copy="'+c.id+'">'+c.id+'</button>'
    +'<select class="sel" data-cat="'+c.id+'">'+META.categories.map(([k,l])=>
        '<option value="'+k+'"'+(s.cat===k?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select>'
    +'<textarea class="note" data-note="'+c.id+'" placeholder="What you want done with this one. Screenshots go in the chat — quote the id.">'+esc(s.note)+'</textarea>'
    +'</div><div class="thread">';
  for(const t of c.turns){
    if(!t.text&&!t.cited.length) continue;
    const r=t.role==='customer'?'customer':(t.role==='human'?'human':'bot');
    const w=r==='customer'?esc(t.who||'Client'):r==='human'?esc(t.who||'Zooza'):'AI';
    h+='<div class="turn t-'+r+'"><div class="who">'+w+'</div><div class="bub">'+esc(t.text);
    if(t.cited.length) h+='<div class="cited"><b>Cited</b>'+t.cited.map(x=>
      '<div class="'+(MARKETING.test(x)?'m':'')+'">'+esc(x)+'</div>').join('')+'</div>';
    h+='</div></div>';
  }
  return h+'</div></div>';
}

function renderList(){
  const rows=visible();
  if(cursor>=rows.length) cursor=Math.max(0,rows.length-1);
  if(!rows.length){ el('#list').innerHTML='<p class="empty">Nothing matches that.</p>'; return; }
  let h='', day='';
  rows.forEach((c,i)=>{
    if(c.day!==day){ day=c.day;
      h+='<div class="day">'+new Date(day+'T12:00:00').toLocaleDateString('en-GB',
         {weekday:'long',day:'numeric',month:'long'})+'</div>'; }
    const s=S(c), isOpen=open===c.id;
    h+='<div class="row'+(s.d?' decided d-'+s.d:'')+(isOpen?' open':'')+(i===cursor?' cursor':'')
      +'" data-id="'+c.id+'" data-i="'+i+'">'+rowHTML(c)+(isOpen?panelHTML(c):'')+'</div>';
  });
  el('#list').innerHTML=h;
}

function renderRoll(){
  const keys=META.categories.map(x=>x[0]), agg={};
  keys.forEach(k=>agg[k]={n:0,kb:0,dig:0,ok:0,product:0,todo:0});
  DATA.forEach(c=>{ const s=S(c), a=agg[s.cat]||(agg[s.cat]={n:0,kb:0,dig:0,ok:0,product:0,todo:0});
    a.n++; if(s.d) a[s.d]++; else a.todo++; });
  const rows=keys.filter(k=>agg[k].n).sort((a,b)=>agg[b].n-agg[a].n);
  const cell=v=>v?String(v):'<span class="z">·</span>';
  let h='<table class="rt"><thead><tr><th>Category</th><th>All</th><th>KB</th><th>Dig</th><th>Fine</th><th>Left</th></tr></thead><tbody>';
  rows.forEach(k=>{const a=agg[k];
    h+='<tr><td><button data-cat-filter="'+k+'">'+esc(CATLBL[k]||k)+'</button></td><td>'+a.n+'</td><td>'
      +cell(a.kb)+'</td><td>'+cell(a.dig)+'</td><td>'+cell(a.ok)+'</td><td>'+cell(a.todo)+'</td></tr>';});
  el('#roll').innerHTML=h+'</tbody></table>';
}

const render=()=>{ renderBar(); renderList(); renderRoll(); };

function scrollCursor(){
  const r=el('.row.cursor'); if(!r) return;
  const top=r.getBoundingClientRect().top, h=el('.bar').offsetHeight;
  if(top<h+8||top>window.innerHeight-60) r.scrollIntoView({block:'center'});
}

/* ── acting ───────────────────────────────────────────── */
function decide(id,d){
  const s=S(byId(id)); s.d = s.d===d ? '' : d; touch(); render();
}
function toggle(id){ open = open===id ? null : id; renderList();
  if(open){ const r=el('.row.open'); if(r) r.scrollIntoView({block:'nearest'}); } }

el('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip'); if(!b) return;
  filter=b.dataset.f; cursor=0; render(); window.scrollTo({top:0});});
el('#catf').addEventListener('change',e=>{catf=e.target.value; cursor=0; render();});
el('#q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase(); cursor=0; render();});
el('#roll').addEventListener('click',e=>{const b=e.target.closest('[data-cat-filter]'); if(!b) return;
  catf=b.dataset.catFilter; el('#catf').value=catf; filter='all'; render(); window.scrollTo({top:0});});

el('#list').addEventListener('click',e=>{
  const a=e.target.closest('.act'); if(a){ e.stopPropagation(); decide(a.dataset.id,a.dataset.d); return; }
  const cp=e.target.closest('[data-copy]'); if(cp){ e.stopPropagation();
    navigator.clipboard?.writeText(cp.dataset.copy);
    const t=cp.textContent; cp.textContent='copied'; setTimeout(()=>{cp.textContent=t;},900); return; }
  if(e.target.closest('.note')||e.target.closest('.sel')) return;
  const r=e.target.closest('.row'); if(!r) return;
  cursor=+r.dataset.i; toggle(r.dataset.id);
});
el('#list').addEventListener('input',e=>{
  const n=e.target.closest('[data-note]'); if(n){ S(byId(n.dataset.note)).note=n.value; touch(); }});
el('#list').addEventListener('change',e=>{
  const c=e.target.closest('[data-cat]'); if(c){ S(byId(c.dataset.cat)).cat=c.value; touch(); renderBar(); renderRoll(); }
  const n=e.target.closest('[data-note]'); if(n) renderList();});

function nextUndecided(){
  const rows=visible();
  for(let i=1;i<=rows.length;i++){ const j=(cursor+i)%rows.length;
    if(!S(rows[j]).d){ cursor=j; open=rows[j].id; renderList(); scrollCursor(); return; } }
  setSave('All decided','on');
}
el('#next').addEventListener('click',nextUndecided);

document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const t=e.target.tagName;
  if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT'){ if(e.key==='Escape') e.target.blur(); return; }
  const rows=visible(); if(!rows.length) return;
  if(e.key==='j'||e.key==='ArrowDown'){ e.preventDefault(); cursor=Math.min(cursor+1,rows.length-1); renderList(); scrollCursor(); }
  else if(e.key==='k'||e.key==='ArrowUp'){ e.preventDefault(); cursor=Math.max(cursor-1,0); renderList(); scrollCursor(); }
  else if(e.key==='Enter'){ e.preventDefault(); toggle(rows[cursor].id); }
  else if(e.key==='Escape'&&open){ open=null; renderList(); }
  else if(e.key==='n'){ e.preventDefault(); nextUndecided(); }
  else if(e.key==='/'){ e.preventDefault(); el('#q').focus(); }
  else if('1234'.includes(e.key)){ e.preventDefault(); decide(rows[cursor].id,DECS[+e.key-1]); scrollCursor(); }
});

/* ── handoff ──────────────────────────────────────────── */
el('#hand').addEventListener('click',()=>{
  const head={kb:'Into the KB',dig:'Dig into it first',product:'Product, not KB',ok:'Fine as answered'};
  let out='# Weekly review — '+META.start+' to '+META.end+'\n';
  const left=DATA.filter(c=>!S(c).d).length;
  out+='\n'+(DATA.length-left)+' of '+DATA.length+' decided'+(left?', '+left+' still open':'')+'.\n';
  ['kb','dig','product','ok'].forEach(d=>{
    const rows=DATA.filter(c=>S(c).d===d); if(!rows.length) return;
    out+='\n## '+head[d]+' ('+rows.length+')\n\n';
    rows.forEach(c=>{ const s=S(c);
      if(d==='ok'&&!s.note){ out+='- '+c.id+' — '+(c.vtitle||c.q.slice(0,70))+'\n'; return; }
      out+='- **'+c.id+'** ['+(CATLBL[s.cat]||s.cat)+'] '+(c.vtitle||c.q.slice(0,90))+'\n';
      if(c.carried) out+='  - unanswered since '+c.carried+'\n';
      if(s.note) out+='  - Michal: '+s.note.replace(/\n+/g,' ')+'\n'; });
  });
  const un=DATA.filter(c=>!S(c).d);
  if(un.length){ out+='\n## Not decided yet ('+un.length+')\n\n';
    un.forEach(c=>{ out+='- '+c.id+' — '+(c.vtitle||c.q.slice(0,70))+'\n'; }); }
  el('#hout').value=out; el('#hdlg').showModal();
});
el('#hclose').addEventListener('click',()=>el('#hdlg').close());
el('#hcopy').addEventListener('click',async()=>{
  const t=el('#hout'); t.select();
  try{ await navigator.clipboard.writeText(t.value); }catch(e){ document.execCommand('copy'); }
  el('#hcopy').textContent='Copied'; setTimeout(()=>{el('#hcopy').textContent='Copy';},1200);
});
window.addEventListener('beforeunload',e=>{ if(dirty){ commit(); e.preventDefault(); e.returnValue=''; }});

/* ── boot ─────────────────────────────────────────────── */
el('#wkrange').textContent=META.start+' – '+META.end+' · '+META.counts.total+' conversations';
el('#catf').innerHTML='<option value="">Every category</option>'+
  META.categories.map(([k,l])=>'<option value="'+k+'">'+esc(l)+'</option>').join('');
open=sessionStorage.getItem('zb-open')||null;
filter=sessionStorage.getItem('zb-filter')||'todo';
sessionStorage.removeItem('zb-open'); sessionStorage.removeItem('zb-filter');
setSave('');
render();
if(typeof claude!=='undefined'&&claude&&typeof claude.use==='function'){
  claude.use('artifact').then(a=>{ artifact=a;
    setSave(a?'Saving is on':'Saved on this device', a?'on':''); })
    .catch(()=>setSave('Saved on this device'));
} else setSave('Saved on this device');
</script>
