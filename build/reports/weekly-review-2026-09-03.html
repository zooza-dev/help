*{box-sizing:border-box}

/* ══ command bar ══ */
.bar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1240px;margin:0 auto;padding:9px 20px;display:flex;flex-direction:column;gap:8px}
.bar-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

.wk span{font-size:11px;color:var(--muted)}
.done{font-size:12px;color:var(--muted);white-space:nowrap}
.done b{color:var(--ink-deep);font-size:14px}
.seg{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--surface-2);
     border:1px solid var(--line);flex:1;min-width:120px;max-width:300px}
.seg i{display:block;height:100%}
.seg i.ok{background:var(--ok)} .seg i.kb{background:var(--kb)}
.seg i.dig{background:var(--dig)} .seg i.product{background:var(--prod)}
.btn{font-size:12px;padding:5px 11px;border-radius:6px;border:1px solid var(--line);background:var(--raise)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dark);border-color:var(--brand-dark)}
.save{font-size:11px;color:var(--muted);white-space:nowrap}
.save.on{color:var(--teal)} .save.err{color:var(--critical)}

.bar-bot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);

.chip:hover{border-color:var(--muted)}
.chip b{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink-deep);border-color:var(--ink-deep);color:var(--ground)}
.chip[aria-pressed="true"] b{color:var(--ground);opacity:.75}
.chip.k-ok[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.k-kb[aria-pressed="true"]{background:var(--kb);border-color:var(--kb);color:#fff}
.chip.k-dig[aria-pressed="true"]{background:var(--dig);border-color:var(--dig);color:#fff}
.chip.k-wait[aria-pressed="true"]{background:var(--critical);border-color:var(--critical);color:#fff}
.srch{margin-left:auto;font:inherit;font-size:12px;padding:4px 9px;border:1px solid var(--line);
      border-radius:6px;background:var(--raise);color:var(--ink);width:190px}
.srch::placeholder{color:var(--faint)}
.sel{font:inherit;font-size:12px;padding:4px 7px;border:1px solid var(--line);border-radius:6px;
     background:var(--raise);color:var(--ink)}

/* ══ list ══ */
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 60px}
.day{display:flex;align-items:center;gap:9px;padding:14px 2px 5px;font-size:10.5px;
     letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600}
.day::after{content:"";flex:1;height:1px;background:var(--line-soft)}

.row{display:block;width:100%;text-align:left;background:var(--raise);border:0;
     border-bottom:1px solid var(--line-soft);border-left:3px solid transparent;padding:0}
.row:hover{background:var(--surface)}
.row.cursor{background:var(--surface-2)}
.row.d-ok{border-left-color:var(--ok)} .row.d-kb{border-left-color:var(--kb)}
.row.d-dig{border-left-color:var(--dig)} .row.d-product{border-left-color:var(--prod)}
.row.decided .ttl{color:var(--muted)}
.line{display:grid;grid-template-columns:auto 46px 1fr auto auto;align-items:center;
      gap:10px;padding:7px 10px;min-height:38px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.h{background:var(--teal)} .dot.b{border:1.5px solid var(--faint)}
.tm{font-size:11px;color:var(--faint);text-align:right}
.ttl{color:var(--ink-deep);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.meta{display:flex;gap:5px;align-items:center;flex-wrap:nowrap}
.pill{font-size:10px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);
      color:var(--muted);white-space:nowrap}
.pill.cat{background:var(--surface-2)}
.pill.wait{color:var(--critical);border-color:var(--critical);background:var(--critical-soft);font-weight:600}
.pill.re{color:var(--dig);border-color:var(--dig);background:var(--dig-soft)}
.pill.note{color:#fff;background:var(--brand);border-color:var(--brand)}
.pill.sug{border-style:dashed;color:var(--faint)}

.acts{display:flex;gap:3px}
.act{font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:3px 8px;border-radius:5px;
     border:1px solid var(--line);background:var(--raise);color:var(--muted);line-height:1.5}
.act:hover{border-color:var(--muted);color:var(--ink-deep)}
.act[aria-pressed="true"]{color:#fff;border-color:transparent}

.act.a-dig[aria-pressed="true"]{background:var(--dig)}
.act.a-product[aria-pressed="true"]{background:var(--prod)}

.open{border-left-width:3px;background:var(--surface)}
.panel{padding:2px 10px 16px 30px;display:flex;flex-direction:column;gap:12px}

ot follow price changes | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Ale za to, jeho brat Filip Ondruška - obaja sú prihlásení do rovnakej skupiny, má vyčíslený dlh dvojnásobne (ja som manuálne registrácie neprepájal, je možné že rodič si to nejak upravil?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Nie som schopný pozrieť konkrétne registrácie ani ich históriu, takže nemôžem povedať presný dôvod pre túto situáciu.\n\n\nV Zooze však existuje bežné vysvetlenie pre tento rozdiel:\n\n\n\n\n- Ak je zapnuté nastavenie payments managed by registrant, všetky dlhy detí sa zložia do jednej rezervácie (zvyčajne tej prvej).\n\n- V takom prípade môže jedna rezervácia mať 0 dlhu, zatiaľ čo druhá má celkový dlh za obidva deti.\n\n\nDôležité je aj to, že dlh sa na rezervácii uloží v momente vytvorenia a neskôr sa už automaticky neprepočítava.\n\n\nAj niektoré platby a rodinné údaje sú naviazané na účet rodiča, nie na konkrétne dieťa.\n\n\nAk chcete, môžem vám ukázať, kde v nastavení kurzov túto možnosť nájdete a ako ju skontrolovať.", "cited": ["Payments and Billing FAQ | Zooza Help", "Outstanding amount — why it does not follow price changes | Zooza Help", "Price and payment setup | Zooza Help", "Client Profile FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Pomohlo to pochopiť rozdiel?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc s pochopením rozdielu v dlhu medzi týmito registráciami, som vám k dispozícii. Chcete doplniť viac informácií o tom, čo potrebujete skontrolovať?", "cited": []}], "verdict": "gap", "vtitle": "Client injured and out until December — what to do with the payment plan", "vnote": "Re-asked eight times. A long absence is a common case with no article: pause, re-plan, or credit. Worth writing once properly.", "cat": "pricing"}, {"channel": "interc ": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Where do I find Require valid Entry pass to enroll for a session.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You’ll find it in the Attendance settings of a Pay‑as‑you‑go programme.\n\n\nSteps:\n\n\n\n\n- Go to Programmes\n\n\n- Open the programme you want to edit\n\n- Go to Programme Settings\n\n\n- Open the Attendance section\n\n- Look for Require a valid entry pass\n\n\nWhen this option is enabled, clients must have a valid (non‑expired and with remaining entries) entry pass before they can book a session. Without a valid pass, the system blocks the booking.", "cited": ["Pay-as-you-go programme | Zooza Help", "Pay-as-you-go FAQ | Zooza Help", "Programme settings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any additional help locating or understanding this setting, I’m here to help. Would you like to share more about what you’re trying to configure?", "cited": []}], "verdict": "", "vtitle": "", "vnote": "", "cat": "account"}, {"channel": "intercom", "id": "215475768998327", "date": "2026-09-03 04:56", "day": "2026-09-03", "human": false, "bucket": "D_assumed_with_kb", "reask": 4, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Discounts and Sibling Pricing FAQ | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Managing sessions in a class | Zooza Help", "FAQ — Programmes | Zooza Help", "Create a programme | Zooza Help"], "q": "How can I set a programme payment setting to charge full term (including first session) even if it is past?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "How can I set a programme payment setting to charge full term (including first session) even if it is past?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Set the programme to ignore pro‑rata pricing.\n\n\nSteps:\n\n\n\n\n- Go to Programmes → select the programme\n\n\n- Open Settings → Price and Payment\n\n\n- Expand Advanced settings\n\n\n- Set Alias price calculation to Full programme price\n\n\n- Save\n\nWith this setting, every booking (even if the first session has already passed) is charged the full term price, not a reduced pro‑rata amount. \n\n\nThis works because the system stops reducing the first payment based on remaining sessions.", "cited": ["Discounts and Sibling Pricing FAQ | Zooza Help", "FAQ — Programmes | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Can this be done on a class level or just program?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "It’s programme-level only.\n\n\nPayment settings (including payment templates and pricing logic) are created and managed at the programme, and all classes in that programme share the same templates. \n\n\nAt the class level, you can only:\n\n\n\n\n- Enable or disable which of the programme’s payment templates are available for that class.\n\n- Optionally override the total price for that specific class. \n\n\nSo you cannot define a different payment rule (like charging the full term even if the first session passed) per class — it must be set on the programme.\n\n\nIf you want, I can also show a common setup for term programmes where late joiners still pay the full term price.", "cited": ["Payments and Billing FAQ | Zooza Help", "Create a programme | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "How do I cancel a class - I'd like to cancel the first date for the NLCS Friday Club", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can cancel just that first session from the class.\n\n\nSteps:\n\n\n\n\n- Go to Classes and open the NLCS Friday Club class.\n\n- Open the Sessions tab.\n\n- Find the first session date.\n\n- Click the session to open its detail.\n\n- Click Cancel session.\n\n- Choose whether to notify the registered clients. \n\n\nThe session will be marked as Cancelled, removed from the client calendar, and it will no longer count toward attendance.\n\n\nTip: if the session was created by mistake and should never have existed, you can delete it instead of cancelling.", "cited": ["Programmes, Timetables and Sessions FAQ | Zooza Help", "Managing sessions in a class | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that helpful for cancelling the session?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "How do I delete?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can delete the session from the Sessions tab of the class.\n\n\nSteps:\n\n\n\n\n- Go to Classes and open the class (e.g., NLCS Friday Club).\n\n- Open the Sessions tab.\n\n- Find the first session date.\n\n- Select that session.\n\n- Use Bulk edit → Delete to remove it permanently. \n\n\nDelete is best when the session was created by mistake and should never have existed. It removes the date completely from the schedule and the session count. \n\n\nTip: if the session was planned but simply didn’t happen, keep it as Cancelled so your attendance history stays accurate.", "cited": ["Programmes, Timetables and Sessions FAQ | Zooza Help", "Managing sessions in a class | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help deleting the session or deciding between deleting and cancelling it, I’m here to help. Would you like to share more about what you’re trying to change?", "cited": []}], "verdict": "gap", "vtitle": "Charging the full term including a session already past", "vnote": "Re-asked four times. Related to the 'Include the whole start date' checkbox a human explained this week — pair them.", "cat": "pricing"}, {"channel": "intercom", "id": "215475713691305", "date": "2026-09-02 19:24", "day": "2026-09-02", "human": false, "bucket": "D_assumed_with_kb", "reask": 21, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Jak automatizovat vaše podnikání v oblasti dětských aktivit (aniž byste ztratili osobní kontakt) — Zooza", "Checklist pred spustením nových kurzov: Na čo nezabudnúť, aby sa sezóna nezačala chaosom — Zooza", "Zooza PRO - Zooza", "Ceník — Zooza", "Registrační stránka pro dětské kroužky: 5sekundový návod — Zooza", "Žebřík důvěry rodičů: 3 standardy pro dětské aktivity, které zvyšují retenci — Zooza", "Change the language in Zooza | Zooza Help"], "q": "ako mam vytvoeit skupinu", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": "Petronela Ševčíková", "text": "ako mam vytvoeit skupinu", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Skupinu si v našem systému připravte jako součást kurzu, aby ji rodiče mohli při registraci vybrat.  Důležité je, aby byl kurz jasně popsán a registrační formulář působil důvěryhodně, protože rodiče pak při přihlašování vybírají právě skupinu.\n\n\nNa jaké stránce v administraci jste právě teď, když chcete skupinu vytvořit?\n\n\n\nSource:\nChecklist pred spustením nových kurzov: Na čo nezabudnúť, aby sa sezóna nezačala chaosom — Zooza", "cited": []}, {"role": "customer", "who": "Petronela Ševčíková", "text": "vybrala som si miesto a fakturacne obdobie", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dobré, to je správný krok. Skupina se vytváří uvnitř kurzu, který jste právě začala zakládat. Rodiče ji pak při registraci vyberou. \n\n\nNa další obrazovce byste měla mít kurz (po výběru místa a fakturačního období). V něm přidáte skupinu – nastavíte např. věk, kapacitu, termín a cenu.\n\n\nNa jaké stránce jste teď přesně?\n\n\nNapř. Programy, Kurzy, Skupiny nebo něco jiného? Podle toho vám ukážu přesný další krok.\n\n\n\nSource:\nChecklist pred spustením nových kurzov: Na čo nezabudnúť, aby sa sezóna nezačala chaosom — Zooza", "cited": []}, {"role": "customer", "who": "Petronela Ševčíková", "text": "skupiny", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dobře, pokud jste na stránce Skupiny, jste na správném místě.\n\n\nTeď stačí přidat novou skupinu a vyplnit její údaje, např.:\n\n\n\n\n- název skupiny\n\n- věk dětí\n\n- kapacita\n\n- termín konání\n\n- cena\n\nSkupiny jsou právě ty varianty kurzu, které si rodiče při registraci vyberou. Je dobré, aby byly jasně popsané (věk, termín, cena), aby rodič věděl, co si vybírá. \n\n\nPokud chcete, můžu vám ukázat i typický příklad, jak skupinu správně pojmenovat a nastavit.\n\n\n\nSource:\nChecklist pred spustením nových kurzov: Na čo nezabudnúť, aby sa sezóna nezačala chaosom — Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Hledali jste tohle?", "cited": []}, {"role": "customer", "who": "Petronela Ševčíková", "text": "ano", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Skvělé, že jste na správné stránce! Pokud potřebujete pomoci s nastavením nebo máte jakékoli dotazy k vytváření skupin, jsem tu pro vás. Co byste ráda probrala jako první?", "cited": []}, {"role": "customer", "who": "Petronela Ševčíková", "text": "co mam robit chcem nastavit cas den a pridat lektora", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dobře – pokud jste na stránce Skupiny, otevřete konkrétní skupinu a nastavte její termín.\n\n\nPostup je obvykle tento:\n\n\n\n\n- otevřete danou skupinu\n\n- přejděte do sekce termín / kalendář\n\n\n- nastavte den a čas konání lekce\n\n- uložte\n\nLektor se přidává do jeho profilu – v jeho rozvrhu pak uvidí naplánované lekce a případné změny. \n\n\nTip: když máte termín a lektora nastavený, můžete také přidat kapacitu skupiny, aby rodiče věděli, kolik míst je volných.", "cited": ["Jak automatizovat vaše podnikání v oblasti dětských aktivit (aniž byste ztratili osobní kontakt) — Zooza", "Zooza PRO - Zooza"]}, {"role": "bot", "who": "Zooza Support", "text": "Dostali jste odpověď na svou otázku?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc s nastavením dňa, času alebo lektora, rada vám pomôžem. Chcete opísať, pri ktorom kroku ste sa zasekli?", "cited": []}, {"role": "customer", "who": "Petronela Ševčíková", "text": "potrebujem vymazat terminy", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Termíny se spravují v kalendáři a plánování, kde máte lekce přehledně a synchronizovaně. Lektor pak vidí svůj rozvrh a případné změny přímo ve svém profilu. Konkrétní postup, kde přesně kliknout na „vymazat termín“, ale závisí na tom, na jaké obrazovce v administraci jste.\n\n\nNa jaké stránce v administraci jste teď, když chcete termíny vymazat?", "cited": ["Zooza PRO - Zooza", "Jak automatizovat vaše podnikání v oblasti dětských aktivit (aniž byste ztratili osobní kontakt) — Zooza"]}, {"role": "bot", "who": "Zooza Support", "text": "Pomohlo vám to?", "cited": []}, {"role": "customer", "who": "Petronela Ševčíková", "text": "som na skupinach v terminoch", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Termíny se spravují v kalendáři a plánování, kde máte lekce přehledně a synchronizovaně. V našem systému je to právě oblast kalendáře a plánování, kde se lekce upravují a přesouvají.\n\n\nMůžete prosím popsat, co přesně na obrazovce „Skupiny → Termíny“ vidíte u každého termínu, tedy jestli máte u něj tlačítko „Smazat“, „Odstranit“, nebo jen možnost „Upravit“?\n\n\n\nSource:\nZooza PRO - Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Bylo to užitečné?", "cited": []}, {"role": "customer", "who": "Petronela Ševčíková", "text": "nemam tam ani zmazat ani odstarnit", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "V našem systému se termíny spravují v kalendáři a plánování, kde se lekce upravují a přesouvají. Pokud na obrazovce Skupiny → Termíny nevidíte žádné tlačítko pro smazání, je možné, že jste v pohledu, kde se termíny jen zobrazují, a ne v místě, kde se mažou.\n\n\nMůžete prosím popsat, co přesně na obrazovce Skupiny → Termíny vidíte u jednoho termínu, tedy jaké tlačítka nebo menu máte k dispozici?", "cited": ["Zooza PRO - Zooza", "Ceník — Zooza", "Žebřík důvěry rodičů: 3 standardy pro dětské aktivity, které zvyšují retenci — Zooza"]}, {"role": "customer", "who": "Petronela Ševčíková", "text": "skupiny  klikla som do konkretnej skupiny a otvorili sa mi pridat termin a ten chcem zmenit", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumím – jste v Skupiny → konkrétní skupina → Termíny a chcete změnit termín, který jste právě přidala.\n\n\nV našem systému se lekce a jejich čas spravují v kalendáři a plánování, kde se termíny upravují a přesouvají. \n\n\nPokud vidíte jen „Přidat termín“, je možné, že jste v pohledu pro přidávání a ne v místě, kde se termín upravuje.\n\n\nMůžete prosím popsat, co přesně vidíte na obrazovce po kliknutí na ten přidaný termín?\n\n\nNapř. jestli se otevře okno s časem a dnem, nebo jen seznam termínů. Podle toho vám ukážu přesný další krok.\n\n\n\nSource:\nZooza PRO - Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Bylo to užitečné?", "cited": []}, {"role": "customer", "who": "Petronela Ševčíková", "text": "seznam terminu", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "V našem systému se termíny upravují v kalendáři a plánování, kde se lekce upravují a přesouvají. Pokud jste v Skupiny → konkrétní skupina → Termíny a vidíte jen seznam termínů, jste v pohledu pro zobrazení, ne v místě, kde se termín upravuje.\n\n\nMůžete prosím popsat, co přesně se stane, když na jeden termín v tom seznamu kliknete, a jestli se otevře nějaké okno nebo stránka?", "cited": ["Zooza PRO - Zooza", "Žebřík důvěry rodičů: 3 standardy pro dětské aktivity, které zvyšují retenci — Zooza", "Registrační stránka pro dětské kroužky: 5sekundový návod — Zooza"]}, {"role": "customer", "who": "Petronela Ševčíková", "text": "tak mi daj info kde mam ten termin zmenit", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumím – jste v Skupiny → konkrétní skupina → Termíny a vidíte jen seznam termínů.\n\n\nV našem systému se lekce a jejich čas spravují v kalendáři a plánování, kde se termíny upravují a přesouvají. \n\n\nPostup je obvykle tento:\n\n\n\n\n- přejděte do Kalendář / Plánování\n\n\n- najděte danou lekci\n\n- otevřete ji a změňte den nebo čas\n\n\n- uložte\n\nKalendář je místo, kde se lekce upravují a synchronizují.\n\n\nChcete jen změnit čas stávající lekce, nebo chcete úplně smazat ten přidaný termín?\n\n\n\nSource:\nZooza PRO - Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc so zmenou termínu, som vám k dispozícii. Chcete opísať, čo sa zobrazí po kliknutí na konkrétny termín v zozname?", "cited": []}, {"role": "customer", "who": "Petronela Ševčíková", "text": "ako si zmenim jazyk z anglictiny na slovencinu", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "V našem systému můžete používat vícejazyčné rozhraní a jazyk si přepínat.  Konkrétní kroky, kde přesně kliknout pro přepnutí z angličtiny na slovenštinu, ale závisí na tom, na jaké obrazovce v administraci jste.\n\n\nNa jaké stránce v administraci jste právě teď, když chcete jazyk změnit?\n\n\n\nSource:\nZooza PRO - Zooza", "cited": []}, {"role": "customer", "who": "Petronela Ševčíková", "text": "na hlavnej", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Na hlavnej obrazovke v administrácii môžete jazyk prepnúť na slovenčinu, pretože naše ro sh (Widgets) | Zooza Help", "API Integration for Booking | Zooza", "Quickstart | Zooza Developer Docs", "Share a course or class registration link | Zooza Help"], "q": "I am setting up our Meta Pixel. I have already set up the Pixel base code inside Squarespace, and now I am setting up the scheduled event when a lead schedules. I'm guessing that is done inside Zuzar as opposed to inside Squarespace. If it's in Zuzar, tell me exactly where to paste the Meta Pixel code inside here, or do we use a certain custom event that you can give us and add a custom event in the Events Manager in Facebook?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Magnus Kaizik", "text": "I am setting up our Meta Pixel. I have already set up the Pixel base code inside Squarespace, and now I am setting up the scheduled event when a lead schedules. I'm guessing that is done inside Zuzar as opposed to inside Squarespace. If it's in Zuzar, tell me exactly where to paste the Meta Pixel code inside here, or do we use a certain custom event that you can give us and add a custom event in the Events Manager in Facebook?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You’re right — the booking event happens inside the Zooza widget, not inside Squarespace. So the tracking setup is done on the page where the widget is embedded.\n\n\nWhere to place the code\n\n\n\n\n- Paste the Zooza widget embed script directly inside the \u003cbody> of the page where you want the booking form to appear. \n\n\n- The script loads the Zooza booking form (registration, calendar, etc.) on that page. \n\n\nWhere to get the embed code\n\n\n\n\n- In Zooza go to Publish → Widgets.\n\n- Choose the widget type (Booking Form, Calendar, etc.).\n\n- Copy the embed script and place it on your website page. \n\n\nMeta Pixel\n\n\n\n\n- The documentation for the widget only covers placing the Zooza embed script on the page.\n\n- It does not provide a specific custom event or Meta Pixel snippet to paste inside Zooza.\n\nSo in practice:\n\n\n\n\n- Squarespace page → contains the Zooza widget embed script\n\n\n- Meta Pixel → configured on the website page that loads the widget\n\n\nIf you want, I can also explain a common way to track “lead scheduled” conversions when using the Zooza widget on your site.", "cited": ["Registration widget | Zooza Developer Docs", "Quickstart | Zooza Developer Docs", "Publish (Widgets) | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Magnus Kaizik", "text": "I am trying to send a scheduled event back to Facebook's Meta Pixel, and so are you saying that that can't be done inside ZOOZA? Or do you have pieces like a custom conversion code such as zooza_event_form_submit_thank_you or not?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Short answer: Zooza does not provide a built‑in Meta Pixel custom event or conversion code (like zooza_event_form_submit_thank_you) that you can paste into the platform.\n\n\nWhat Zooza does provide instead:\n\n\n\n\n- \nWebhooks for key lifecycle events such as registrations, payments, invoices, attendance updates, and schedule changes.\n\n- \nAnalytics‑ready data layer events that can be consumed by tools like Google Tag Manager and then sent to analytics platforms. \n\n\nSo the typical setup is:\n\n\n\n\n- Zooza widget loads on your website\n\n- Your site (or GTM) fires the Meta Pixel event when the booking step completes\n\n- Zooza webhooks can also send registration data to your systems if needed\n\nIn other words, the Pixel event itself is triggered on your website, not inside Zooza.\n\n\nIf you want, I can also explain a common pattern teams use to track “lead scheduled” conversions with the Zooza widget and GTM.\n\n\n\nSource:\nAPI Integration for Booking | Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Did c informácií o tom, ako chcete skúšobné registrácie organizovať?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Peter, vo vseobecnosti mozete. V ramci nastavenia vekoveho limitu (Nastavenia kurzu -> Extra polia) je mozne zakliknut aj moznost povolit registraciu ludom, ktori vekovy limit nesplnaju a pripadne im pridelit aj znacku. Takito ludia skoncia v poradovniku a je potrebne ich manualne zaradit", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Ďakujem Vám za odpoveď. Perfektná správa pre nás, len mám v tom jeden dotaz, keď chcem pridať značku tak mi nezobrazí žiadne možnosti na výber.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ano to je taka drobna UXova chyba - neda sa v tom procese vytvorit nova znacka. Staci ak na hocijaku registraciu pridate zelanu znacku a odstranite ju. Nasledne ju uvidite aj v tom rozbalovacom menu. Ale znacim si, ze to upravime:)", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Ďakujem, zároveň by som sa chcel opýtať, značku som nazval ,,nedodržané vekové obmedzenie\", keď teda povolím prekročenie vekového limitu a prihlási sa športovec ktorý nespĺňa kritéria tak ma Zooza upozorní že sa niekto taký prihlásil?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Ďakujeme", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "samostatna notifikacia specialne pre tento pripad v systeme nie je ale v Nastaveniach -> Notifikacne centrum, si viete zapnut zasielanie notifikacii ak vznikne nova registracia v poradovniku a tym padom by ste dostali notifikaciu o vsetkych poradovnikoch. Ale v principe si viem predstavit, ze by sme vedeli urobit aj notifikaciu ak registracia dostane nejaky konkretny label/znacku.", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Ďakujem. Premyslím si to ešte, či to bude potrebné, nakoľko obdobných prípadov veľa nebude.\n\nEšte by som potreboval radu, máme športovca, ktorý trénuje v rovnakom kurze ale v dvoch skupinách. Máme interné pravidlo, kto trénuje v spomínanom programe 2x/týždeň (dve skupiny) tak má jednotnú taxu 54,90€ (namiesto plnej ceny 32€/skupina, 64€/2skupiny).\nAko najideálnejšie nastavím zľavu? nakoľko si rodič vybral frekvenciu úhrady mesačnú - tak každý mesiac mu musím vytvoriť zľavový kód?\n\nVernostný program máme nastavený, pravidlo 2./3./4.dieťaťa - funguje ako má. Tento program je skôr platný pre rodičov ktorý napríklad ku nám dajú dve deti a ešte oni sami trénujú v dospelej skupine.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Je mozne uplatnit niekolko postupov. Jeden z nich by bol, ze dane registracie prepojite a nechate zakaznika platit iba jednu z nich (pri prepajani registracii je moznost preniest platby z jednej registracie na druhu). Na tej registracii nasledne vytvorite novy platobny plan so sumou 54.90 a tym padom je hotovo, zakaznik plati za obe registracie jednym variabilnym symbolom v zelanej vyske splatky.\nDalsou moznostou by bolo len mu upravit naplanovane splatky na zelanu sumu.\nAutomaticky sa toto neda vyriesit inak ako pomocou loyalitneho programu - vracajuci sa zakaznik.\n\n\nZlavovy kod by bol fajn ak by ste sa so zakaznikom dohodli ze mu poskytnete tu zlavu jednorazovo a vytvorite jeden zlavovy kod na cele obdobie, ktore bude chodit (alebo povedzme na rok vopred) ak viete ze tolko bude chodit, ale toto by som vnimal ako krajne riesenie.\nLoyalitny program je v sucasnosti v beta verzii a to mimo ine znamena, ze prijimame aj spatnu vazbu na jeho fungovanie, takze ak mate predstavu o niecom, co by sme donho mali doplnit aby povedzme fungoval aj na Vas pripad, tak urcite ju prosim vyzdielajte. Pripravujeme este stvrty loyalitny program, ktory bude zalozeny na kreditoch. Teda system prizna zakaznikovi kredity, ktore si potom moze uplatnit ako zlavu alebo na nakup novych kurzov. Teoreticky aj toto by sa dalo potom na vas scenar pouzit.", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Ďakujem za odpoveď, prepojenie registrácie sa mi momentálne zdá byť najlepšia cesta.\n\nMomentálne nastavujem platobný plán, prosím Vás nie som si istý, či to robím správne:\n- nový platobný plán\n- vybral som výšku splátky 54,90€ (nezvolil som členské)\n\nJe to tak správne?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Zároveň keď zmením na konkrétnej registrácií platobný plán, zmení sa to len na úrovni registrácií, nie v celom kurze ?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "V principe vzdy ked uplatnujete novy platobny plan na registracii tak mate dve zakladne moznosti - bud system nechate vypocitat cenu (a to na zaklade aktualnej ceny za skupinu, alebo inych moznosti, ktore tam vzdy vidite), alebo si poviete vlastnu vysku splatky. V tomto pripade si myslim ze je to ta spravna moznost, teda vzdy zvolte vlastna vyska splatky - urcite tu vysku manualne a zadajte zelanu sumu. A ano tymto menite platobny plan iba na konkretnej registracii.", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Ďakujem za vysvetlenie.\n\nKeď nastavím v registrácii kredit (napríklad 10€ zľavu), ako ju rodič pri úhrade aplikuje?\nSkúšam to na svojom prihlásení, pri úhrade mám znázornenú zľavu, ale neviem ako ju zadať aby mi stiahlo € z výslednej sumy.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Myslite, ako ju aplikuje pri vytvoreni registracie?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "nie, registrácia už je vytvorená až následne som vytvoril kredit", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "V tom pripade su dve moznosti - bud sa ten kredit uplatni pri nakupe novej registracie alebo potom v ramci existujucej registracie, ked je tato neuhradena tak je mozne v casti zlavy kod uplatnit.", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Prepáčte, asi som prepracovaný, neviem to nájsť. Keď pri konkrétnej vytvorenej registrácií vytvorím v sekcii kredit, zľavový kupón (na konci správy prepošlem odkaz), vie si ho rodič pri prvej platbe uplatniť?\n\nZooza \\ Registrácie \\ 527523 - Efča Long (Efča Long) \\ Kredity a náhradné termíny \\ Nový kredit", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ano. Samotny zlavovy kod mu nemusite posielat. Vsetky zlavove kody, ktore vytvorite priamo k registracii su viditelne v profile a odtial si ich moze zakaznik aj uplatnit.", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "Som na svojom profile registrácie, keď zadám úhradu, vidím že pod úhradou mám v benefitoch zľavu no keď prejdem na samotnú platbu - neviem ako aktivovať danú zľavu.\n\nIde o to, že už máme prihlásených športovcov a majú mať jednorazovú extra zľavu po vzájomnej dohode - no keď im ju nastavím, chcem mať rovno odpoveď ako ju môžu aplikovať.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Takto, ta zlava sa aplikuje priamo v profile v zalozky platby:\n\n\nStaci kliknut na button zlavovy kod a vlozit ho do policka.", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "môže byť že nám to nefunguje, ak sme prihlásený v profile cez našu stránku a nie cez Zoozu?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Nie, to by nemalo hrat ziadny rozdiel. Kludne poslite screenshot, co vidite vo vasom profile", "cited": []}], "verdict": "gap", "vtitle": "Letting an under-age child register anyway", "vnote": "Human answer: in Programme -> Settings -> Extra fields you can allow registration by people who fail the age limit, and optionally tag them with a label. They land in the waiting list and you enrol them by hand. Pairs with 215475737999518, where a client asked whether Zooza approves or rejects them outright.", "cat": "bookings"}, {"channel": "intercom", "id": "215475753046919", "date": "2026-09-02 13:12", "day": "2026-09-02", "human": false, "bucket": "D_assumed_with_kb", "r va na obrazovke platby v Client Profile.\n\n\nKroky:\n\n\n\n\n- Otvorte danú registráciu a prejdite do sekcie Payments.\n\n- Otvorte platbu, ktorá má zostávajúci zostatok.\n\n- Na obrazovke platby nájdete pole Coupon code.\n\n- Zadajte zľavový kód a kliknite Validate – systém ukáže novú sumu.\n\n- Kliknite Apply, aby sa zľava potvrdila.\n\n- Nakoniec vyberte spôsob platby a zaplaťte zníženú sumu. \n\n\nPole sa zobrazí len ak registrácia ešte nie je úplne zaplatená.\n\n\nAk chcete, môžem vám ukázať aj spôsob, ako použiť zľavu pri ručne vytvorenej registrácii.", "cited": ["Discount code | Zooza Help", "Discounts and Sibling Pricing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "kde nájdem coupon code ?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Pole Coupon code nájdete na obrazovke platby pri úhrade existujúcej registrácie.\n\n\nPostup:\n\n\n\n\n- Otvorte danú registráciu.\n\n- Prejdite do sekcie Payments.\n\n- Otvorte platbu, ktorá má zostávajúci zostatok.\n\n- Na obrazovke platby (payment-options screen) sa zobrazí pole Coupon code, kde klient kód zadá. \n\n\nPole sa zobrazí len ak registrácia ešte nie je úplne zaplatená. \n\n\nAk chcete, môžem vám ukázať aj, kde v Zoozu nájdete zoznam všetkých zľavových kódov.", "cited": ["Discount code | Zooza Help", "Discounts and Sibling Pricing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak potrebujete s uplatnením zľavového kódu ďalšiu pomoc, som vám k dispozícii. Chcete opísať, na ktorej obrazovke sa pole Coupon code nezobrazuje?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "kde nájdem nastavenie firemnej zimnej odstávky?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Firemnú zimnú odstávku nastavíte ako Custom holiday.\n\n\nKroky:\ pport", "text": "Vážený Michal,\n\n\nváš tiket byl přijat. Asistent Zooza se vám pokusí ihned pomoci — a člen našeho týmu jej také osobně zkontroluje.\n\n\n— Podpora Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Michal. Ano Fio banka v priebehu augusta menila email z ktoreho sa posielali notifikacie o uhradach a zaroven menili aj sablonu tohto emailu cize zhruba tyzden/tyzden a pol bol vypadok v parovani platieb z tejto banky, kym sa nam podarilo dohladat dovod. Malo by to ale byt opravene takze ak Vam platby nepresli tento/minuly tyzden, poslite prosim nejaky priklad platby (idealne screenshot rovno z banky) a preverime, ci tam zasa nieco nepomenili.", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "dakujem za odpoved, naposledy sparovalo pred 6 dnami a ani vcerajsie platby neboli sparovane", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "tento mail som nasiel vo fio banke na odosielani pohyboch na ucte", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Skor by som potreboval priklad transakcie ako emailu, ten email vyzera byt v poriadku.", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "posielam vám pohyby ny ucte a červene X znamena že som tie transakcie dnes manualne dohladaval a paroval", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dakujem, ideme to preverit", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Je to tak, prebehol tam opat update tej emailovej sablony. V priebehu par hodin bude na produkcii fix ale teda ostatne platby si budete musiet spatne doparovat rucne. V pripade ak by sa nejake platby v priebehu dnesneho dna neukazali v zooze dajte nam prosim vediet.", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "takze nemusim nic menit v nastaveni int HUMAN", "reask": 3, "resolution": "routed_to_team", "rating": null, "carried": null, "sources": [], "q": "Dobry den,\n\n\nna kurz Minicirkus, ktory je pre rodica spolu s dietatom, sa nam prihlasili dve klientky na skusobnu lekciu tak, ze vytvorili samostatne registracie pre seba a aj pre dieta. mame v systeme nastavenu automaticku zlavu pre surodenca, co sposobilo, ze na skusobnu lekciu jej tam automaticky bol pripisany preplatok. Posielam screenshot.\nVymazala som dvojitu registraciu, ale kedze chceme mat informacie o veku dietata, tak som nechala tie registracie, v ktorych vek dietata bol uvedeny.\nChcela by som vas poziadat o nasledovne?\n1. automaticka zlava pre rodinu/surodencov nezmizne, ked jednu zo surodeneckych registracii zrusime? ano alebo nie? musim sumu upravovat nasledne manualne? toto ma zaujima aj v kontexte dalsich podobnych pripadov, ktore mozu nastat.\n2. viem niekde nastavit to, aby sa automaticka zlava nadala aplikovat na skusobne lekcie?\n\n\ndakujem\n\n\n\n\ns pozdravom,\n\nMgr. Lenka Pechová\n\n\n\n\n\nKurzy, PR, marketing\n\n\n\nTel. 0290900497\n\nwww.cirkuskus.sk\nFB / IG cirkuskus", "turns": [{"role": "customer", "who": "Lenka Pechová", "text": "Dobry den,\n\n\nna kurz Minicirkus, ktory je pre rodica spolu s dietatom, sa nam prihlasili dve klientky na skusobnu lekciu tak, ze vytvorili samostatne registracie pre seba a aj pre dieta. mame v systeme nastavenu automaticku zlavu pre surodenca, co sposobilo, ze na skusobnu lekciu jej tam automaticky bol pripisany preplatok. Posielam screenshot.\nVymazala som dvojitu registraciu, ale kedze chceme mat informacie o veku dietata, tak som nechala tie registracie, v ktorych vek dietata bol uvedeny.\nChcela by som vas poziadat o nasledovne?\n1. automaticka zlava pre rodinu/surodencov nezmizne, ked jednu zo surodeneckych registracii zrusime? ano alebo nie? musim sumu upravovat nasledne manualne? toto ma zaujima aj v kontexte dalsich podobnych pripadov, ktore mozu nastat.\n2. viem niekde nastavit to, aby sa automaticka zlava nadala aplikovat na skusobne lekcie?\n\n\ndakujem\n\n\n\n\ns pozdravom,\n\nMgr. Lenka Pechová\n\n\n\n\n\nKurzy, PR, marketing\n\n\n\nTel. 0290900497\n\nwww.cirkuskus.sk\nFB / IG cirkuskus", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Hi Lenka,\n\n\nThanks for reaching out! I'm Zooza Support, Zooza's AI Agent and I'm well trained to answer your query but you can reply and ask for the team at any time.\n\n\nI understand you're dealing with duplicate registrations and automatic family discounts being applied to trial lessons. You'd like to know how the family discount behaves when you delete duplicate registrations, and whether you can prevent it from applying to trial lessons.\n\n\nI can see this involves specific account data and discount configuration questions that require access to your setup and the details of how your family discount is currently configured. Since you're asking about:\n\n\n\n\n- How family discounts persist or change when deleting duplicate registrations\n\n- How to configure family discounts to exclude trial lessons\n\nThese are questions best handled by our team, as they'll need to review your specific discount rules and registration structure to give you accurate guidance.\n\n\nWould you like me to connect you with a human agent who can look into your account setup and help you configure this correctly?", "cited": []}, {"role": "customer", "who": "Lenka Pechová", "text": "Yes, that would be great, thank you. \n\n\ns pozdravom,\n\n\nMgr. Lenka Pechová\n\n\nKurzy, PR, marketing\n\n\n\n\nTel.0290900497\n\n\nwww.cirkuskus.sk\nFB / IG cirkuskus\n​", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, Lenka,\n\n\n\n\n- Automaticka zlava nezmizne po vymazani registracie. Ziadna taka uprava sa sama nespusti\n\n- Do počtu detí sa zarátavajú len prihlášky so stavom Registrovaný. Prihlášky na čakacej listine a skúšobné prihlášky sa nezarátavajú.", "cited": []}, {"role": "customer", "who": "Lenka Pechová", "text": "Dobry den,\n\n\npridavam screenshot, ano surodenecka zlava sa aktivovala pri prihlaseni na skusobnu lekciu.\n\n\ns pozdravom,\n\n\nMgr. Lenka Pechová\n\n\nKurzy, PR, marketing\n\n\n\n\nTel.0290900497\n\n\nwww.cirkuskus.sk\nFB / IG cirkuskus\n​", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Lenka, dakujem za screenshot. Dame Vam vediet, ked to bude upravene. Pekny den este.", "cited": []}, {"role": "customer", "who": "Lenka Pechová", "text": "zdravim, vdaka Martin. ja som ho mala pripraveny uz vcera, len som ho zabudla prilozit ;)\n\n\ns pozdravom,\n\n\nMgr. Lenka Pechová\n\n\nKurzy, PR, marketing\n\n\n\n\nTel.0290900497\n\n\nwww.cirkuskus.sk\nFB / IG cirkuskus\n​", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Je to vyvinute v priebehu dnesneho dna to pojde na produkciu takze od zajtrajska uz sa skusobne hodiny nebudu pocitat do lojalitneho programu. Prajem este pekny den:)", "cited": []}], "verdict": "gap", "vtitle": "Sibling discount counted a trial and left an overpayment", "vnote": "Two rules from the human answer, neither documented: an automatic discount is NOT recalculated when you delete a registration, and only registrations with status Registered count towards the sibling count — waiting-list and trial registrations do not. The client had created separate registrations for parent and child on a parent-and-child course and got a spurious sibling discount.", "cat": "pricing"}, {"channel": "intercom", "id": "215475484934773", "date": "2026-09-01 14:53", "day": "2026-09-01", "human": true, "bucket": "HUMAN", "reask": 23, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Login proccess\n\nHi Martin! We would like to avoid using the “Pentru a continua, introduceți e-mailul sau numărul de telefon.” step. It complicates things for our clients and the code isn’t always sent promptly. Please let me know how we can do this.\nThanks so much!", "turns": [{"role": "customer", "who": null, "text": "Login proccess\n\nHi Martin! We would like to avoid using the “Pentru a continua, introduceți e-mailul sau numărul de telefon.” step. It complicates things for our clients and the code isn’t always sent promptly. Please let me know how we can do this.\nThanks so much!", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dear Mara,\n\n\nyour ticket  has been received. Zooza Assistant will try to help you right away — and a member of our team will personally review it too.\n\n\n— Zooza Support", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Mara, I understand this is bigger change but it is easily skippable - there is a button to skip the login process if users don't want to log in. We've recently introduced plenty of features that rely on users being logged into the system - loyalty program with sibling discounts, priority booking for existing customers, auto enrollment etc, so this change is not so self imposed as it may seem. I would suggest waiting little bit to gather more feedback as this is fairly new and as with any change - it usually brings complaints. When dust settles we would make adjustments - either make the Continue as Guest option more visible or we'll figure out something else. One way to speed up the process would be to connect whatsapp number with Zooza. This would then mean that the CODE will arrive to their Whatsapp instantly.\n\n\nOn a happier note, as part of yesterday's release we've implemented the change to make up sessions we've discussed. Now you can toggle new option on course's settings - which will block parents from setting up the make up session. When they cancel the session they will be prompted with a dialog where they can choose from these options:\n\n\n\n\n- I want the make up session as soon as possible\n\n- I don't mind - choose any date\n\n- Custom - they can fill any comment here.\n\nYou as admin will then see this when setting the make up session.", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "I'm afraid I can't find the button for skipping the login process?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "For existing clients, the email step might be helpful, but for new clients it just adds another step to the enrollment process. As for the demo form, I’m not sure it adds much value as these clients are simply looking to sign up for a session.", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Please, please, please, is there any way we could skip it or make it optional?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Previously, clients had to enter a code after submitting the form and some of them, together with our franchisees, got worried because the code didn’t arrive on time. It was manageable then because their data was already in our system, with or without the code.\nI’m afraid this could be worse now and we might lose clients because of it. Could we please skip or make the code optional? Many thanks!", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "The screenshot you sent is not the login form itself. It simply checks whether your email or phone number is registered within the system. For new customers it will simply pre-fill the email/phone field - they dont need to log in as - naturally they do not have any account. If you in fact do have an account. If you do there is a clear option to skip the login. This is well documented scenario for any eshop. Whenever you go to checkout you are always prompted to log in or continue as guest. So this is nothing new or something people don't have to do anywhere else. I understand that it is a change and as with any change it will need some time to accomodate. Immediately as we'll see in our tracking that this is the step where we loose people we'll adjust and do necessary changes. But based on your feedback we put the skip button on that first step as well.", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Much better! Really appreciate it, Martin! \nFor the calendar form, the authentication option doesn’t seem to appear. Could you please check?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "or does it need to appear?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "I mean, when you enter your phone number or email, isn’t that a form of authentication?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "On the website, for the demo form we have this and I think that Aveți deja un cont? Autentificare is redundant \n​", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "and for the calendar form we have this", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "the last one is better in my opinion because you kinda login when you send your email/phone number if there's an associated account", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "If you want to change the wording, please do send it over how would you prefer it to be. Your Romanian is better than ours:)", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "It's not about the wording.", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "this is what I'm trying to say", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "the left part of the image is from here https://nominjyuku.ro/alegeti-locatia-dvs/bucuresti-icoanei/inscrieri/, the right part is from here https://nominjyuku.ro/alegeti-locatia-dvs/bucuresti-icoanei/calendar/?place_id=1619_0 and then here https://nominjyuku.ro/inscrierea-facuta/?course_id=5580&place_id=1619_0&schedule_id=99863", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Mara, we've removed the redundant prompt to log in when the form is pre-selected. Thank you for pointing that out.", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Thank you so much!", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Hi Martin! Thank you so much for the make-up session update. We really like it!\n\n\nDo you think the option the parent chooses when cancelling a session could also be included in the New Cancellation e-mail we receive? It would make it much easier for us to see the request and take it into account.\n\n\n \n\n\nRegarding the client profile, please see the attached screenshot. Do you think we could have the “Rest de plată“ shown as a positive value? For example, 830 RON instead of -830 RON? A few rows down, the total amount is already shown as a positive value, so I think it would be easier to read this way too.\n\n\nAlso regarding the “Valoarea totală a comenzii după reduceri”, would it be possible to either hide it or move it below the payment schedule? It feels a bit overwhelming to see the full amount as the first thing on the profile, especially when it’s quite a large amount. It might be a little off-putting for the client. Thank you!", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Mara, yes we can do all three I believe. Just to confirm the first one - when people cancel using the link provided in the notification email - you want them to see the same options as when they cancel manually from the profile?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "The first one is about the option the clients choose from the three options shown when they cancel the session: as soon as possible, at a later date or a specific message (or something like that).\n\n\nWe would like to receive their option in the New cancellation email we receive every time a cancellation is made.", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Hope it make sense :)", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "the New cancelation e-mail", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "the client s option", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "It would be great to have the client s option in the New cancellation e-mail. Thank you!", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ah I see, I thought you are talking about the end user experience. For sure this should not be a problem to add. We'll update you once all three items are in production:)", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Many, many thanks!", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Mara, all three are done and will be rolled out later today. To hide the total sums in the profile - there is a new setting in the Team & Settings -> Publish -> Widget -> Profile -> Hide totals. Just a heads up - it is not there yet as the changes have not been rolled out, but please check it out tomorrow and let me know if there is anything else to change.", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Thank you, Martin! Have a lovely day!", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Is there an option for the enrolment form not to show any payment options at all, not even zero lei? For Oradea, we would only like to enroll the children in the classes without showing them any amount to pay, because the payment plans are completely different and I don’t think they are covered by Zooza. Thank you!", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Two options there Mara - we would be able to hide the pricing information globally but that would mean hiding it also for situations where it needs to be displayed. Apart from hiding it there are also questions about payment method and such which need to be resolved in order for the registration to be able to write into the system. So While this is theoretically possible I think we need to find a different way. Which bri , {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Michal. Dobra sprava je, ze vsetky funkcionality Zoozy su kompletne spristupnene cez Api. V ramci verejnej dokumentacie poskytujeme podklady iba k bezne konzumovanym endpointom. V teorii je teda mozne urobit to, co potrebujete. Horsia sprava je, ze ste si vybrali use case, ktory si toho vyzaduje ovela viac ako len zakladanie klienta. Nahradne hodiny su zo svojej podstaty naviazane na skupiny a terminy. Museli by ste teda viest paralelny kalendar vo svojom systeme a zaroven v Zooze. Opat. Je to mozne vdaka Api, akurat si nie som isty, ci by to pre Vas bola taka pridana hodnota, pretoze toto vsetko preintegrovat, to by ste si rovno mohli naprogramovat nahradne hodiny do Vasho systemu. Neviem co vsetko Vas system zabezpecuje, ale ak okrem klientov a platieb strazi aj rozvrh a teda je predpoklad, ze by ste mali dva systemy, ktore s nim pracuju (Vas a Zoozu), myslim, ze integracia iba kvoli nahradnym hodinam by sa Vam neoplatila.\n\n\nZaroven vidim este jednu problematicku oblast - Nahradne hodiny ako funkcionalita ma pomerne komplexny frontend - vyber nahradnych hodin, poradovniky, emailove notifikacie, atd. A toto je momentalne zabundlovane v zakaznickom portali. Vedeli by ste do tohto portalu sice vytvorit session a nalogovat tam pouzivatela pomocou SSO, ale museli by ste ho vyrazne orezat aby zakaznik nevidel zoznam registracii, platby, pripadne zakaznicke benefity atd atd, cize lepsia cesta by opat bola vytvorit si k tomu vlastny frontend a to je opat development, ktory by bol lepsie straveny investiciou do rozvoja Vasho vlastneho systemu.\n\n\n\n\n\nChcem tym povedat, ze odpoved na Vasu otazku je - Ano, da sa urobit to, co opisujete. Zaroven, robit takuto integraciu iba kvoli nahradnym hodinam je neekonomicke.\n\n\n\nAk by ste potencialne chceli prejst s celou agendou do Zoozy a Vas system by zabezpecoval iba frontend, pripadne iba kolektovanie novych registracii/klientov, to by uz davalo vacsi zmysel. cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Aha, uz rozumiem - ano nesparovane platby su Nove. Doplnime tam text aby to bolo zjavne:)", "cited": []}, {"role": "customer", "who": "Tomáš Vávra", "text": "skvělé děkuju :-)", "cited": []}], "verdict": "gap", "vtitle": "Menu changed — can I still filter unpaired payments?", "vnote": "Second client on the same change. The human used the answer to explain the three conditions a bank email must pass before a payment shows at all: Zooza must match the sender email to the account, must be able to read the body, and it must not be a duplicate. Then it appears as paired or unpaired, and ignored ones are still findable under the Ignored filter. That explanation is worth having written down — it is the thing people actually need when a payment is missing.", "cat": "payments"}, {"channel": "intercom", "id": "215475721963435", "date": "2026-09-01 08:37", "day": "2026-09-01", "human": true, "bucket": "HUMAN", "reask": 5, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Programme Settings | Zooza Help", "Booking Widget FAQ | Zooza Help", "Contact — Zooza", "Getting Help and Support | Zooza Help", "Share a course or class registration link | Zooza Help"], "q": "i want to send the specific booking link for a programma to individual parents, how do i change the bit where it says my name samuel-davis, i want it to say elizabeth samueks", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "i want to send the specific booking link for a programma to individual parents, how do i change the bit where it says my name samuel-davis, i want it to say elizabeth samueks", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "*elizabeth samuels", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "That part of the link (samuel-davis) comes from your account name used for the public without changing the main booking form.", "cited": ["Additional fields on the booking form | Zooza Help", "Booking form settings overview | Zooza Help", "Collect information with a Google Form | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "How can I export the information entered in a booking form eg The Dubai British Foundation class in ECA's and After School Clubs", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can export the information entered in the booking form from the Bookings list.\n\n\nSteps:\n\n\n\n\n- Go to Bookings.\n\n- Apply filters if needed (for example by programme or class such as Dubai British Foundation).\n\n- Click Export.\n\n- Zooza prepares an XLSX spreadsheet with one row per booking. \n\n\nThe export includes the booking data and any additional fields you added to the booking form (e.g. date of birth, allergies, custom questions). These fields are stored on each booking and can be exported to a spreadsheet. \n\n\nYou can also view and re-download previous exports in Settings → Tools → Exports. \n\n\nTip: If you want the export to contain only one class, filter the bookings by that class before clicking Export.", "cited": ["Exporting data and reports | Zooza Help", "Reports | Zooza Help", "Camps — Day Camps, Week Camps, Holiday Programmes | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help exporting or understanding the booking-form information, I’m here to assist. Would you like to share more about what you’re trying to include in the export?", "cited": []}], "verdict": "ok", "vtitle": "Date of birth and age on the registration form", "vnote": "Additional fields cover it; the bot cited the right articles.", "cat": "bookings"}, {"channel": "intercom", "id": "215475278399746", "d k ji zapnout v aplikaci, záleží na tom, kde právě jste.\n\n\nNa jaké stránce v Zoozě se nacházíte – u kurzu, skupiny nebo rezervace?\n\n\n\nSource:\nProč řešení „neviditelného“ rodičovského problému buduje silnější značku — Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Na stránce Kurzy, kterou máte na screenshotu, se čekací listina zapínat nedá. Tato stránka slouží jen pro přehled kurzů a jejich správu. \n\n\nČekací listina funguje na úrovni skupiny (třídy). Když je skupina plně obsazená, mohou se zájemci zapsat na čekací listinu. Pokud se později uvolní místo, systém může jejich přihlášku přesunout z čekací listiny do hlavní skupiny.\n\n\nCo udělat:\n\n\n\n\n- Na kartě kurzu klikněte na Skupiny.\n\n- Otevřete konkrétní skupinu.\n\n- Tam nastavujete kapacitu a chování při naplnění (čekací listina).\n\nPokud chcete, můžu vám ukázat přesně, kde to najít v detailu skupiny.\n\n\n\nSource:\nProč řešení „neviditelného“ rodičovského problému buduje silnější značku — Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Hledali jste tohle?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Pokud potřebujete s nastavením čekací listiny ještě pomoci, jsem tu pro vás. Chcete popsat, co přesně v detailu skupiny potřebujete najít nebo nastavit?", "cited": []}, {"role": "customer", "who": "Ondřej Fisenko", "text": "Potřeboval bych změnit tlačítko obsazeno na \n\n\n\n\n- \nObsazenost: Obsazeno – čekací listina otevřena\n\n- \nTlačítko: Přidat se na čekací listinu", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Děkuji za screenshot – krásně to ilustruje situaci.\n\n\nTento text bohužel v Zoozě změnit nejde.\n\n\nPopisky jako „Obsazeno“ a tlačítko „Vybrat“ jsou pevná součást registračního rozhraní a aplikace je neumožňuje upravit ani přepsat. \n\n\nTo znamená, že:\n\n\n\n\n- text „Obsazeno“ nelze změnit na „Obsazeno – čekací listina otevřena“\n\n- tlačítko „Vybrat“ nelze přejmenovat na „Přidat se na čekací listinu“\n\nČekací listina funguje automaticky, jakmile je skupina plná, ale její wording v rozhraní není konfigurovatelný.\n\n\n💡 Co můžete udělat: přidat vysvětlující text do popisu skupiny (např. „Pokud je skupina obsazená, můžete se přihlásit na čekací listinu“). To rodičům pomůže proces lépe pochopit.\n\n\n\nSource:\nProč řešení „neviditelného“ rodičovského problému buduje silnější značku — Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dostali jste odpověď na svou otázku?", "cited": []}, {"role": "customer", "who": "Ondřej Fisenko", "text": "Propoj mě s lidskou podporou a předej jim můj požadavek prosím", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Samozřejmě, hned vás přepojím někomu z našeho týmu. Předtím, než to udělám, můžete mi prosím sdílet více podrobností o vašem požadavku? Pomůže to našim kolegům rychleji a přesněji vám pomoci.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, pan Fisenko,\n\n\n\n\n\ntexty vo formulari si mozete upravovat. Da sa to vsak len na urovni Vasej stranky. \n\n\nPouzivame na to upravu cez script. Tu je k tomu dokumentacia, je potrebne najst na to kluc a k tomu zmenu textu. \n\n\nhttps://docs.zooza.online/widgets/profile-widget/#translations\n\n\n\n\n\nTakto by vyzeral script pre zmenu toho pojmu \"Obsadzeno\". Tých kľúčov tam môžete mať pod sebou viacero. Tlačidlo je pre všetky stavy rovnaké. \n\n\n\n\n\n\u003cscript type=\"text/javascript\">\n\n\nwindow.ZOOZA = {\n\n\nprint_debug: true,\n\n\ntranslations: {\n\n\n'global.region' : 'Area',\n\n\n'registration.capacity_full' : '🟠 Obsazeno – čekací listina',\n\n\n}\n\n\n}\n\n\n\u003c/script> \n\n\n\n\n\nDajte vediet, ci pomohlo. Radi pomozeme aj s pripadnym nastavenim. \n\n\nScript sa umiestnuje bud priamo na stranke alebo v nejakom footeri ci plugine na publikovanie scriptov na webe.", "cited": []}], "verdict": "gap", "vtitle": "Changing the wording in the booking widget", "vnote": "Human answer with a working example: widget texts are overridden from your own page with a window.ZOOZA translations script, e.g. 'registration.capacity_full' to relabel Obsadené as 'Obsadené – čekací listina'. Keys are in the developer docs. This is asked often enough to deserve a place in the KB rather than only in docs.zooza.online.", "cat": "widgets"}, {"channel": "intercom", "id": "215475728999106", "date": "2026-08-31 20:35", "day": "2026-08-31", "human": false, "bucket": "D_assumed_with_kb", "reask": 6, "resolution": "routed_to_team", "rating": null, "carried": "2026-08-31", "sources": ["Price and payment setup | Zooza Help", "FAQ — Programmes | Zooza Help", "Getting Help and Support | Zooza Help"], "q": "ahoj, prečo ked som si dala termíny tak mi zmyzla cena pri registrácií? dakujem", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Eva Kleberc", "text": "ahoj, prečo ked som si dala termíny tak mi zmyzla cena pri registrácií? dakujem", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumiem, že zmiznutie ceny pri registrácii môže byť frustrujúce. Chcete, aby som vás spojil s ľudským agentom? Alebo môžete poskytnúť viac informácií a budem vám rád pomáhať ďalej.", "cited": []}, {"role": "customer", "who": "Eva Kleberc", "text": "čo k tomu potrebujeľ aby si mi pomohol?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dobrá otázka. Aby som vám mohol pomôcť, stačí niekoľko základných informácií:\n\n\n\n\n- kde presne vidíte 0,00 – na registračnej stránke, v košíku, alebo pri konkrétnom kurze?\n\n- máte nastavenú cenu v Programme → Settings → Price and Payment?\n\n- má kurz aj cenu na úrovni class (termín)?\n\nNajčastejším dôvodom je, že sa cena nenastavila na jednej z týchto úrovní, takže systém zobrazí 0,00. \n\n\nAk chcete, môžete aj poslať screenshot – to často pomôže rýchlo nájsť príčinu.", "cited": ["Price and payment setup | Zooza Help", "Getting Help and Support | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Thank you for sharing the screenshot. I can see the price issue you mentioned. Would you like me to connect you with a human agent who can assist you further? Or if you prefer, you can provide more details and I will continue helping you.", "cited": []}, {"role": "customer", "who": "Eva Kleberc", "text": "po slovensky", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Na screenshotu je viditeľné, že cena je 0,00 €, pretože pre túto triedu (termín) nie je nastavená žiadna cena. Pri registrácii sa vždy zobrazí cena toho, čo si klient práve kupuje. \n\n\nSkúste skontrolovať:\n\n\n\n\n- \nProgramme → Settings → Price and Payment – má kurz nastavenú cenu?\n\n- Otvorte konkrétnu Class (termín) – má aj ona nastavenú cenu?\n\nAk trieda má cenu 0, systém ju berie ako „nenastavenú“ a použije cenu z programu. \n\n\nNajčastejší problém je, že kurz má cenu, ale termíny (class) ostali na 0.\n\n\nAk chcete, môžem vám ukázať presne, kde to zmeniť v administrácii.", "cited": ["Price and payment setup | Zooza Help", "FAQ — Programmes | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "I will connect you with someone from our team who can assist you further. Meanwhile, could you please share any additional details about the issue to help them understand your situation better?", "cited": []}, {"role": "customer", "who": "Eva Kleberc", "text": "po slovensky", "cited": []}, {"role": "customer", "who": "Eva Kleberc", "text": "?", "cited": []}, {"role": "customer", "who": "Eva Kleberc", "text": "kde mám nastaviť tu cenu?", "cited": []}], "verdict": "gap", "vtitle": "Price disappeared from the registration form after adding sessions", "vnote": "Carried since 31 August, re-asked six times, routed to the team and never answered. Adding sessions changed the price to nothing on the form. Likely the same family as the unit-price recalculation cases, but nobody has confirmed it — this is the one that has been waiting longest.", "cat": "pricing"}, {"channel": "intercom", "id": "215475721574632", "date": "2026-08-31 17:09", "day": "2026-08-31", "human": true, "bucket": "HUMAN", "reask": 0, "resolution": "—", "rating": null, "carried": null, "sources": [], "q": "Presuny v sieti\n\nDobry den, po presunuti v sieti a naswlednom prijati na druhu pobocku potrebujeme aby registracia bola vymkazana nie zrusena. Dalej neviem najst presunute deti ktore cakaju na prijatie.", "turns": [{"role": "customer", "who": null, "text": "Presuny v sieti\n\nDobry den, po presunuti v sieti a naswlednom prijati na druhu pobocku potrebujeme aby registracia bola vymkazana nie zrusena. Dalej neviem najst presunute deti ktore cakaju na prijatie.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dear online,\n\n\nyour ticket  has been received. Zooza Assistant will try to help you right away — and a member of our team will personally review it too.\n\n\n— Zooza Support", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den, registracie skutocne nechcete vymazavat. Hlavne ak na nich su prijate platby, sposobi Vam to problemy v reportingu ale nie len to. Vymazavat by ste mali iba registracie, ktore vznikli omylom, alebo su duplicitne, ale take zasa nie je dovod nikam presuvat. Sucasny proces presunu v ramci sieti sme navrhovali po vzajomnej dohode. Prijate ziadosti je vidno na dashboarde priamo na hlavnej obrazovke v ucte spolocnosti, do ktorej bolo dieta presunute.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den, hlavnym dovodom chybovej hlasky je, ze kurz z povodnej registracie nie je nakonfigurovany rovnako ako ten z cielovej registracie. Konkretne kurz, do ktoreho sa snazite registraciu zaradit nema zadefinovane vsetky potrebne extra polia rovnako ako ten povodny kurz. Aplikacia by Vas na to mohla upozornit vopred a to aj do nej dorobime, nech je to zrejme. Nastavenia kurzov je ale potrebne zosuladit tak ci onak.", "cited": []}], "verdict": "gap", "vtitle": "Network transfers — do not delete the registration, and where accepted children appear", "vnote": "Human answer: never delete a transferred registration, especially with payments on it — it breaks reporting. Accepted transfer requests appear on the dashboard of the company the child moved to. The client could not find children waiting to be accepted.", "cat": "clients"}, {"channel": "intercom", "id": "215475720167520", "date": "2026-08-31 16:35", "day": "2026-08-31", "human": true, "bucket": "HUMAN", "reask": 1, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Cancellation limit settings | Zooza Help", "Make-up Sessions FAQ | Zooza Help", "Settings | Zooza Help"], "q": "Je možnosť nastaviť v zooze to, aby sa klient mohol odhlásiť z hodiny iba 1krát za mesiac?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Patrícia Bencze", "text": "Je možnosť nastaviť v zooze to, aby sa klient mohol odhlásiť z hodiny iba 1krát za mesiac?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Nie, v Zooze nie je možné nastaviť limit „1 odhlásenie za mesiac“ pre klienta.\n\n\nSystém podporuje iba časový limit na odhlásenie (napr. 24 hodín pred hodinou). Túto pravidlo nastavíte v:\n\n\n\n\n- \nSettings → Programmes → Set a limit for cancelling a scheduled session. \n\n\nMožnosti sú:\n\n\n\n\n- klient môže odhlásiť iba do zvoleného času pred hodinou\n\n- po uplynutí limitu už odhlásenie nie je možné (alebo môže zostať len stav „Did not attend“). \n\n\nTento limit je globálny pre všetky programy, nie na klienta ani na mesiac.\n\n\nAk chcete, môžem vám ukázať aj spôsob, ako nastaviť pravidlo pre make‑upy „1 za mesiac“, ktoré sa často používa ako alternatíva.", "cited": ["Settings | Zooza Help", "Cancellation limit settings | Zooza Help", "Make-up Sessions FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak potrebujete s nastavením odhlasovania alebo make-upov ďalšiu pomoc, som vám k dispozícii. Chcete doplniť viac informácií o pravidle, ktoré sa snažíte nastaviť?", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, Patrícia, \n\n\nAI systém odpísal nespravne. Neda sa nastaviť každý mesiac. Dá sa však nastaviť, že každý 4 termíny si môže nahradiť len jeden z nich. \n\nVyzeralo by to takto. Kurz > Nastavenia > Nahradne hodiny\n\n\nPovolene nahradne hodiny 1\n\n\nFlexibilný limit termínov 4 \n\n\n\n\n\nDajte vedieť, či pomohlo", "cited": []}], "verdict": "gap", "vtitle": "Limiting how often a client may cancel", "vnote": "The bot answered wrongly and a human corrected it: you cannot set 'once a month'. You CAN set a ratio — Programme -> Settings -> Make-up sessions, Allowed make-ups 1, Flexible session limit 4, meaning one make-up per four sessions. Concrete and reusable.", "cat": "makeups"}, {"channel": "intercom", "id": "215475722822504", "date": "2026-08-31 15:15", "day": "2026-08-31", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "assumed_resolution", "rating": null, "carried": null, "sources": ["Ceník — Zooza", "Registrační stránka pro dětské kroužky: 5sekundový návod — Zooza"], "q": "Kde sa dá zmeniť ceny kurzu?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": "Ivana Csutorova", "text": "Kde sa dá zmeniť ceny kurzu?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Cena kurzu se zobrazuje na stránce programu, kde rodiče vidí „kolik to stojí“. V našem ceníku ale najdete jen ceny tarifů a poplatků za služby, ne postup, kde v aplikaci upravit cenu konkrétního kurzu.\n\n\nNa jaké stránce v aplikaci jste právě teď, když chcete
