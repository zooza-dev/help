m your active lists and calendar but keeps all bookings and history. \n\n\nIf the class has active bookings, it cannot be deleted — archiving is the recommended option. \n\n\nIf you meant removing an instructor from a specific class rather than archiving the whole class, let me know and I can guide you.", "cited": ["Archive or delete a Programme | Zooza Help", "FAQ — Programmes | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "I want to remoe the instuctor as they havebnow left the company", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If the instructor has left, the best option is to deactivate their account, not delete it.\n\n\nSteps:\n\n\n\n\n- Go to Settings → Team → Access\n\n\n- Open the instructor’s profile\n\n- Change their role to Inactive instructor\n\n\n- Click Save \n\n\nThis removes their login access but keeps all their history (attendance, sessions, payouts) intact. Deleting the account can break those links and may make the history harder to recover. \n\n\nTip: If they might return later (seasonal coach, cover), keeping them as Inactive instructor makes it easy to reactivate them.", "cited": ["Role Selection Guide | Zooza Help", "Instructor Access and Roles FAQ | Zooza Help", "Roles and Permissions FAQ | Zooza Help", "Add instructors and manage their access | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help deactivating the instructor’s access, I’m here to assist. Would you like to share more about what you’re trying to update?", "cited": []}, {"role": "customer", "who": "Kieran Townsend", "text": "how to change the class a child attends they are moving up", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Since the child is moving up to a higher class, you’ll want to Transfer their booking.\n\n\nSteps:\n\n\n\n\n- Go to Clients → Bookings\n\n\n- Open the child’s booking\n\n- In the Class card, click Transfer\n\n\n- Select the new class they’re moving into\n\n- Confirm the transfer\n\nThis moves the booking to the new class, and the child keeps their remaining sessions there. The original booking in the old class is removed. \n\n\nTip: Use Transfer when switching classes (like moving up a level). Use Copy only if you want them to attend both classes at the same time.", "cited": ["Client Management FAQ | Zooza Help", "Transfer and Copy FAQ | Zooza Help", "Transfer and copy bookings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help transferring the child’s booking to the new class, I’m here to assist. Would you like to share more about what you’re trying to update?", "cited": []}], "verdict": "gap", "vtitle": "Removing an instructor (bot-only, 3 re-asks)", "vnote": "Same gap.", "cat": "team"}, {"channel": "intercom", "id": "215475666655561", "date": "2026-08-27 09:46", "day": "2026-08-27", "human": true, "bucket": "HUMAN", "reask": 1, "resolution": "—", "rating": null, "sources": [], "q": "Z toho moc múdrejší nie som Rozhodnutie o vytvorení kreditu\nVytvoriť kredit: Nie Dôvod: is_replacement", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Dear Michal,\n\n\nyour ticket  has been received. Zooza Assistant will try to help you right away — and a member of our team will personally review it too.\n\n\n— Zooza Support", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ahoj Miso, a sumarizacia v logoch hovori co? Pri kazdom odhlaseni mate v appke log, kde je napisane preco nahradna hodina nebola priznana.", "cited": []}, {"role": "customer", "who": "Michal Šiška", "text": "Z toho moc múdrejší nie som Rozhodnutie o vytvorení kreditu\nVytvoriť kredit: Nie Dôvod: is_replacement", "cited": []}, {"role": "human", "who": "Tech Support", "text": "https://zooza.atlassian.net/browse/ZOOZA-4826", "cited": []}], "verdict": "gap", "vtitle": "Why a make-up credit was not granted — read the log", "vnote": "Client got a bare reason string (is_replacement) and could not act on it. Every cancellation writes a log entry explaining why a make-up was or was not granted; the reason codes need documenting.", "cat": "makeups"}, {"channel": "intercom", "id": "215475667224354", "date": "2026-08-27 08:59", "day": "2026-08-27", "human": false, "bucket": "D_assumed_with_kb", "reask": 3, "resolution": "assumed_resolution", "rating": null, "sources": ["Make-up Sessions FAQ | Zooza Help", "Managing client attendance — admin | Zooza Help", "Bookings | Zooza Help"], "q": "can I choose a make-up session and book it on behalf of a client", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "can I choose a make-up session and book it on behalf of a client", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes, you can do both.\n\n\n\n\n- \nChoose a make‑up session: Open the client’s booking → go to the Attendance tab → in the make‑up table click Choose next to the session you want to assign. \n\n\n- \nBook it on behalf of the client: You can also use Book a session in the Attendance tab to manually add any upcoming session to the client’s attendance record (for example a make‑up or extra session). \n\n\nTip: if you want parents to request make‑ups instead of you assigning them, you can enable administrator‑assigned make‑ups in the programme settings.", "cited": ["Managing client attendance — admin | Zooza Help", "Make-up Sessions FAQ | Zooza Help", "Bookings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "when I click choose make up session on their attendance tab it just takes me to this", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You’re actually on the correct screen. That page is the filter/availability screen for make‑up sessions. It shows the rules (programme, venues, etc.) and lets you choose how the system should search for sessions. \n\n\nAfter this screen, the system should show a list of upcoming compatible sessions, where you click Log in to assign the make‑up.\n\n\nIf the list never appears, the most common reasons are:\n\n\n\n\n- The original session is not marked as “Cancelled” (only cancelled sessions generate a make‑up credit). \n\n\n- There are no compatible sessions with capacity within the allowed time window.\n\nQuick check: is the missed session currently marked Cancelled in the attendance view?\n\n\nIf you want, I can also show you a quick workaround using Book a session in the Attendance tab when the make‑up picker doesn’t show options.", "cited": ["Managing client attendance — admin | Zooza Help", "Make-up Sessions FAQ | Zooza Help"]}, {"role": "customer", "who": "Anna Blackwell", "text": "yes please", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can use the Book a session option in the Attendance tab as a quick workaround.\n\n\nSteps:\n\n\n\n\n- Open the client’s Booking.\n\n- Go to the Attendance tab.\n\n- Click Book a session at the top.\n\n- Select the upcoming session you want to use as the make‑up.\n\nThis manually adds that session to the client’s attendance record, which is useful when you want to assign a specific make‑up without using the make‑up picker. \n\n\nTip: if you often assign make‑ups manually, you can also filter the session list in the Attendance tab to quickly find the right class date.", "cited": ["Managing client attendance — admin | Zooza Help", "Bookings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any additional help assigning the make-up session, I’m here to help. Would you like to share what happens when you try the “Book a session” option?", "cited": []}], "verdict": "gap", "vtitle": "Booking a make-up on behalf of a client", "vnote": "A human answered this same question for another client this week (215475668735536). Write it once, from the human answer.", "cat": "makeups"}, {"channel": "intercom", "id": "215475667137947", "date": "2026-08-27 08:47", "day": "2026-08-27", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "assumed_resolution", "rating": null, "sources": ["Lista de verificare pentru lansarea noilor cursuri: Ce uită majoritatea înainte de sezon — Zooza"], "q": "Vreai sa vorbesc ci tine pe wgatsapp", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Cu ce vă pot ajuta?", "cited": []}, {"role": "customer", "who": null, "text": "Buna", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Bună ziua! Cu ce vă pot ajuta astăzi? 😊", "cited": []}, {"role": "customer", "who": null, "text": "Vreai sa vorbesc ci tine pe wgatsapp", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "În acest moment nu există suport direct prin WhatsApp. Ajutorul este disponibil aici în chat, unde vă pot ghida pas cu pas în utilizarea aplicației. \n\n\nDacă doriți, vă pot explica și cum să folosiți WhatsApp pentru comunicarea cu părinții (ex. mesaje, promoții sau reminderi) în afacerea dvs. de activități pentru copii.\n\n\n\nSource:\nLista de verificare pentru lansarea noilor cursuri: Ce uită majoritatea înainte de sezon — Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Asta căutați?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dacă mai aveți nevoie de ajutor, sunt aici să vă sprijin în chat. Doriți să îmi spuneți mai multe despre ce încercați să rezolvați?", "cited": []}], "verdict": "noise", "vtitle": "Greeting only", "vnote": "No question asked.", "cat": "noise"}, {"channel": "intercom", "id": "215475608571605", "date": "2026-08-27 08:44", "day": "2026-08-27", "human": true, "bucket": "HUMAN", "reask": 4, "resolution": "—", "rating": null, "sources": [], "q": "Dakujem. Reagujem na navrhy Claudu. Uvidime, ako AI pomoze pri planovani rozvrhu", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Dear Martina,\n\n\nyour ticket  has been received. Zooza Assistant will try to help you right away — and a member of our team will personally review it too.\n\n\n— Zooza Support", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Martina. Terminy sa archivovanim skupin nemazu. Terminy mozete hromadne zmazat aj sama priamo v aplikacii ak chcete ale vzhladom na to, ze ste archivovali skupiny, tak toto nie je potrebne a v ramci aplikacie Vam v nijakom smere nezavadzaju a ani nezaberaju miesto.", "cited": []}, {"role": "customer", "who": "Martina Kmecová Kalafová", "text": "Dakujem. Reagujem na navrhy Claudu. Uvidime, ako AI pomoze pri planovani rozvrhu", "cited": []}, {"role": "customer", "who": "Martina Kmecová Kalafová", "text": "Opätovný problém s AI a návrh textu so žiadosťou o zmenu: Dobrý deň, potrebujem nahlásiť chybu v API funkcii na presun/zmenu dátumu a času existujúcich\nnaplánovaných hodín (sessions) v našej firme (company_id 110). Pri pokuse o zmenu dňa/času\nktorejkoľvek existujúcej aktívnej hodiny (event), aj keď je jej event_id práve predtým overené\nako existujúce a naplánované, funkcia vracia chybu “Session(s) … not found in company 110”.\nTestovali sme to na cca 220 hodinách naprieč 12 rôznymi skupinami kurzu “ANGLICKÝ JAZYK -\nzberný kôš 2026/2027” (course_id 9127, schedule_id 101577–101588 a 101590) a chyba sa\nzopakovala pri každom pokuse. Iné úpravy (napr. zmena lektora na úrovni skupiny) fungujú\nnormálne – problém je špecificky pri funkcii na presun/zmenu jednotlivých naplánovaných hodín.\nPotrebujeme túto funkciu opraviť, aby sme mohli dokončiť reorganizáciu rozvrhu lektorky\nMartiny Kmecovej Kalafovej. Ďakujem.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Martina, viete prosim poslat priblizny cas, kedy ste k tejto chybe prisli? Chyba urcite nie je v API, to by ste nevedeli presuvat hodiny ani rucne v aplikacii, pravdepodobne ide o nejaky problem na strane claude, ale tam by sme mali byt schopni ho nainstruovat, co presne ma robit. Dakujem,", "cited": []}, {"role": "customer", "who": "Martina Kmecová Kalafová", "text": "Dobrý deň, včera podvečer/večer som sa s tým skúšala trochu hrať.", "cited": []}, {"role": "customer", "who": "Martina Kmecová Kalafová", "text": "Ešte sa chcem opýtať - včera som do kurzu KIDS STARTER priradila registrácie. Tým pádom sa mi však vytvorila duplicitná registrácia s neuhradeným registračným poplatkom. Ten som vymazala, je tam dlžná suma 0, ktorú opravím na cenu za kurz a vytvorím novú faktúru. Bude to však časovo náročné. Existuje jednoduchší spôsob ako sa s týmto problémom vysporiadať? Tí, ktorí majú uhradený registračný poplatok, už majú na registrácii 1 faktúru.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den, bohuzial hromadne upravy nad registraciami zatial nie su v takom pokrocilom stadiu ako je tomu pri skupinach alebo terminoch, takze toto sa zatial urobit hromadne neda. Zaroven sa zmeny na registraciach zatial nedaju robit ani cez AI. Preto momentalne neexistuje jednoduchsi sposob ako ist jednu registraciu po druhej. Kazdopadne pracujeme na oboch tychto veciach aj aby sa zmeny dali robit v appke a zaroven aby sa dali robit aj cez AI.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Martina. Upravili sme funkcionalitu AI konektora a v tejto chvili by mal uz vediet korektne preplanovat termin pripadne aj doplnit nove terminy. Na to, aby ste pracovali s aktualnou verziou konektora je potrebne urobit dve veci: V nastaveniach vyhladate nas konektor a vpravo hore kliknete na menu a potom na Refresh Tools List:\n​\n\n\ntymto sa znovu nacita cela integracia a budete pouzivat jej najnovsiu verziu. Zaroven je potrebne spustit novy chat. V existujucej konverzacii bude Claude pouzivat staru verziu konektora.\nA napokon - v ramci poslednych uprav pribudli aj nove funkcie ako moznost upravovat kurzy alebo pridavat ulohy na registracie atd.", "cited": []}], "verdict": "gap", "vtitle": "Archiving a class does not delete its sessions", "vnote": "Human answer: sessions are not removed when you archive; they do not get in the way and do not need deleting. You can bulk-delete them if you want to.", "cat": "programmes"}, {"channel": "intercom", "id": "215475666472663", "date": "2026-08-27 08:23", "day": "2026-08-27", "human": true, "bucket": "HUMAN", "reask": 1, "resolution": "—", "rating": null, "sources": [], "q": "Pozdravujem, áno už to potom išlo:)", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Dear Katarina,\n\n\nyour ticket  has been received. Zooza Assistant will try to help you right away — and a member of our team will personally review it too.\n\n\n— Zooza Support", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den pani Katka,\n\npozeram, ze interna poznamka sa k ucastnikovi zapisala, aj ked vyhodilo chybovu hlasku.\nPozrieme sa na to, preco sa hlaska objavila, kazdopadne, interna poznamka zaznacena je.\n\n\n\n\n\nvdaka\n\n\nKatarina\n\n​", "cited": []}, {"role": "customer", "who": "Katarina Klemanová", "text": "Pozdravujem, áno už to potom išlo:)", "cited": []}], "verdict": "product", "vtitle": "Internal note saved but showed an error", "vnote": "Passed to the technical team.", "cat": "clients"}, {"channel": "intercom", "id": "215475666803414", "date": "2026-08-27 08:17", "day": "2026-08-27", "human": false, "bucket": "D_assumed_with_kb", "reask": 8, "resolution": "assumed_resolution", "rating": null, "sources": ["Registration widget | Zooza Developer Docs", "Additional fields on the booking form | Zooza Help", "Programme Automations | Zooza Help", "Consents and agreements (GTC, GDPR) | Zooza Help", "Consents and Agreements FAQ | Zooza Help", "Attendance and Catch-up Classes FAQ | Zooza Help", "Customizing widgets | Zooza Help", "Booking Widget FAQ | Zooza Help", "Terms of Personal Data Processing - Zooza", "Change the language in Zooza | Zooza Help"], "q": "are the additional fields here automatically translated into italian which i've set the system to for customers?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "are the additional fields here automatically translated into italian which i've set the system to for customers?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "No — additional field names are not automatically translated.\n\n\nThe text you enter in Custom name (like “A full list of authorised adult names…”) is used exactly as you write it on the booking form. If you want it in Italian, you need to write the Italian version yourself in that field. \n\n\nThe Application Communication Language setting only controls system texts (emails, client portal, etc.), not the custom labels you create. \n\n\nIf you want more advanced translations, you can also override widget texts using custom translations in the widget configuration.", "cited": ["Booking Widget FAQ | Zooza Help", "Change the language in Zooza | Zooza Help", "Additional fields on the booking form | Zooza Help", "Customizing widgets | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "If you want more advanced translations, you can also override widget texts using custom translations in the widget configuration. \n\n\nwould this automatically translate additional fields?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "No — custom translations in the widget do not automatically translate your additional field names.\n\n\nThe translations option only replaces the default widget texts (buttons, labels, messages) that come from the system. You provide your own Italian version for those specific translation keys. \n\n\nYour Additional Fields are different:\n\n\n\n\n- You manually enter the field name in Programmes → Programme → Additional Fields.\n\n- That text is used exactly as written on the booking form. \n\n\nSo if you want them in Italian, you still need to write the Italian version yourself in the field name. The widget translation feature does not auto-translate those custom fields. \n\n\nIf you want, I can also show a simple way to keep both English and Italian versions organized when you have many additional fields.", "cited": ["Booking Widget FAQ | Zooza Help", "Registration widget | Zooza Developer Docs", "Customizing widgets | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "yes", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I'm glad I could assist you! If you have any more questions or need further help with your additional fields or translations, please feel free to ask. I'm here to support you! 😊", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "If you want, I can also show a simple way to keep both English and Italian versions organized when you have many additional fields.\n\n\nye", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "A simple way is to keep both languages in the same field name, separated by a slash or dash. This keeps everything organized in one place.\n\n\nExample:\n\n\n\n\n- Authorised adult names / Nomi degli adulti autorizzati\n\n- Does your child have additional needs? / Ha bisogni particolari?\n\nThe text you enter in the Custom name field is shown exactly as written on the booking form, so this approach lets you display both languages without creating separate fields. \n\n\nTip: if you reuse the same fields across multiple programmes, you can also copy the programme to reuse the configured additional fields.", "cited": ["Additional fields on the booking form | Zooza Help", "Customizing widgets | Zooza Help"]}, {"role": "customer", "who": "Samuel Davis", "text": "does zooza automatically ask parents about photo permission?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "No — Zooza does not automatically ask parents for photo permission. \n\n\nYou can add it yourself as a consent in the booking form. During registration, parents confirm any consents you configure before submitting the booking. \n\n\nTypical setup:\n\n\n\n\n- Go to Settings → Consents & Agreements\n\n\n- Create a consent like “Photo permission”\n\n- Choose a checkbox or Yes/No option\n\n- Set it to apply to specific programmes (for example, in‑person classes) \n\n\nInstructors can later see which parents gave photo consent in the session’s Consents section. \n\n\nTip: you can also make the consent mandatory for certain programmes so it always appears during booking.", "cited": ["Programme Automations | Zooza Help", "Consents and agreements (GTC, GDPR) | Zooza Help", "Consents and Agreements FAQ | Zooza Help", "Terms of Personal Data Processing - Zooza", "Attendance and Catch-up Classes FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "what would i type here: \u003ca href=\"*|AGREEMENT_URL|*\">More\u003c/a>", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You type the clickable label that parents will see on the booking form.\n\n\nExample:\n\n\n\u003ca href=\"*|AGREEMENT_URL|*\">More\u003c/a>\n\n\n- \n*|AGREEMENT_URL|* is a dynamic tag that Zooza automatically replaces with the link to the full consent text.\n\n- The text between the tags (like More) is what parents click to read the full agreement. \n\n\nYou can change that label to anything you want, for example:\n\n\n\u003ca href=\"*|AGREEMENT_URL|*\">Read full policy\u003c/a>\nor\n\n\n\u003ca href=\"*|AGREEMENT_URL|*\">Health declaration\u003c/a>\nThat text becomes the clickable link on the registration form.", "cited": ["Consents and agreements (GTC, GDPR) | Zooza Help", "Consents and Agreements FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "have i formatted this correctly?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — your formatting is correct.\n\n\nThe field Name of the consent in the booking form is exactly where you place the clickable link using the *|AGREEMENT_URL|* tag. Your example:\n\n\n\u003ca href=\"*|AGREEMENT_URL|*\">fotografare/filmare\u003c/a>\nmatches the supported format. When parents register, they will see “fotografare/filmare” as a clickable link that opens the full consent text. \n\n\nOne small thing to remember: if you use this link, the Consent text field should contain the full policy that parents will read after clicking the link.\n\n\nTip: you can change the clickable label to something clearer for parents, for example:\n\n\nLeggi l’informativa completa sulla foto/video.", "cited": ["Consents and agreements (GTC, GDPR) | Zooza Help", "Consents and Agreements FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Does that clarify things?", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "which box would i put this in: Leggi l’informativa completa sulla foto/video.\n​", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You would put “Leggi l’informativa completa sulla foto/video.” in the field “Name of the consent in the booking form.”\n\n\nThat field controls the clickable text parents see on the booking form. You can replace the default “More” with any label you want, for example:\n\n\n\u003ca href=\"*|AGREEMENT_URL|*\">Leggi l’informativa completa sulla foto/video.\u003c/a>\nWhen parents click that text, it opens the full consent text from the Consent text field. \n\n\nSo in short:\n\n\n\n\n- \nName of the consent in the booking form → the clickable label (your Italian text)\n\n- \nConsent text → the full policy they read after clicking the link.", "cited": ["Consents and Agreements FAQ | Zooza Help", "Consents and agreements (GTC, GDPR) | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help setting up the photo consent or its Italian wording, I’m here to assist. Would you like to share what you’re trying to adjust or clarify next?", "cited": []}], "verdict": "gap", "vtitle": "Are extra fields translated automatically", "vnote": "Re-asked 8 times. Confirm whether extra field labels follow the customer language setting before answering.", "cat": "widgets"}, {"channel": "intercom", "id": "215475640262398", "date": "2026-08-27 08:11", "day": "2026-08-27", "human": true, "bucket": "HUMAN", "reask": 3, "resolution": "—", "rating": null, "sources": [], "q": "Hi Martin, \n\n\nThanks for the speedy fix, however I’m getting the following error message when I click the new reset button. \n​\n\n\nMany thanks,  \n\n\nSamuel Davis\n\n\nPrincipal\n\n\nElizabeth Samuels Drama School\n🏆 Winner: Best Achievement in Corporate Social Responsibility – Richmond Business Awards 202507429478447\n\n\nwww.elizabethsamuelsdrama.com", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Dear Samuel,\n\n\nyour ticket  has been received. Zooza Assistant will try to help you right away — and a member of our team will personally review it too.\n\n\n— Zooza Support", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Sam, we'll implement the option to the app so that it is possible to start onboarding with different region. I'll let you know once its done. Thank you for your patience.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Sam, we've implemented the possibility to change region before starting the onboarding process with Stripe. Please refresh the app and try again. If you don't see the option straight away it might be a caching issue, in which case you might want to clear it or wait until tomorrow when the cache refreshes automatically. All the best. Martin", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "Hi Martin, \n\n\nThanks for the speedy fix, however I’m getting the following error message when I click the new reset button. \n​\n\n\nMany thanks,  \n\n\nSamuel Davis\n\n\nPrincipal\n\n\nElizabeth Samuels Drama School\n🏆 Winner: Best Achievement in Corporate Social Responsibility – Richmond Business Awards 202507429478447\n\n\nwww.elizabethsamuelsdrama.com", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Thanks, we'll check the reason what is preventing the stripe onboarding not to re-set", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Can you please try again Sam?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ok, please hold. I'm getting reports from the dev team that there is still a persisting issue on stripe's side.", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "Still getting the same error message, I tried clicking start anyway after the error message but still shows country as Italy. \n​\n\n\nMany thanks,  \n\n\nSamuel Davis\n\n\nPrincipal\n\n\nElizabeth Samuels Drama School\n🏆 Winner: Best Achievement in Corporate Social Responsibility – Richmond Business Awards 202507429478447\n\n\nwww.elizabethsamuelsdrama.com", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Yes, as I wrote just before you tried it there was still reported issue. This time it should be fixed. Hopefully it will work. If not we'll have to raise a ticket with Stripe to reset your onboarding.", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "Hi Martin, \n\n\nIt worked! Thanks for your help in getting this fixed. \n\n\nMany thanks,  \n\n\nSamuel Davis\n\n\nPrincipal\n\n\nElizabeth Samuels Drama School\n🏆 Winner: Best Achievement in Corporate Social Responsibility – Richmond Business Awards 202507429478447\n\n\nwww.elizabethsamuelsdrama.com", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "That is awesome. Thanks for letting us know:) Have a great rest of the day:)", "cited": []}], "verdict": "product", "vtitle": "Onboarding in a different region", "vnote": "Shipped as API-20260826-001 cross-region Stripe Connect onboarding. Candidate for the changelog.", "cat": "account"}, {"channel": "intercom", "id": "215475656316312", "date": "2026-08-27 05:20", "day": "2026-08-27", "human": false, "bucket": "D_assumed_with_kb", "reask": 3, "resolution": "assumed_resolution", "rating": null, "sources": ["Getting Started with Zooza | Zooza Help", "Online booking | Zooza Help", "Programme Settings | Zooza Help", "Message Templates | Zooza Help", "Email and Communication FAQ | Zooza Help", "Settings | Zooza Help", "Automatic notification of an upcoming session | Zooza Help"], "q": "How to receive emails when booking received?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "How to receive emails when booking received?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can receive an email whenever a new booking is created by setting up an admin notification.\n\n\nSteps:\n\n\n\n\n- Go to Settings → Notifications\n\n\n- Click Add new notification\n\n\n- Choose the notification type for new booking\n\n\n- Enter the email address that should receive the alert\n\n- Click Create Notification \n\n\nOnce configured, you will automatically receive an email each time a new booking (including trials) is created. \n\n\nNote: each notification entry supports one email address, so if multiple people need the alert, create a separate notification for each email.", "cited": ["Settings | Zooza Help", "Email and Communication FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help with booking notification emails, I’m here to assist. Would you like to share more about what you’re trying to set up or clarify?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Which template is sent prior to classes starting as a reminder?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "The reminder sent before a class starts is the Automatic session reminder template. \n\n\n\n\n- It is sent the day before the session to all enrolled clients.\n\n- It includes the session time and location and helps clients remember to attend or cancel if needed. \n\n\n- You can edit this template in Communication → Templates → Notifications → Automatic session reminder.\n\nYou can also choose which reminder template a specific programme uses in the programme’s Communication settings. \n\n\nIf you want, I can also show you how to customise the reminder text for different programmes (for example, different messages for children vs adult classes).", "cited": ["Message Templates | Zooza Help", "Automatic notification of an upcoming session | Zooza Help", "Programme Settings | Zooza Help", "Online booking | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "How to customize for different programmes?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can assign a different session reminder template to each programme.\n\n\n1. Create the custom reminder template\n\n\n\n\n- Go to Communication → Templates\n\n\n- Scroll to Notifications\n\n\n- Under Automatic session reminder, click Add new template\n\n\n- Write the subject and message you want for that programme\n\n- Save it. \n\n\n2. Assign it to a programme\n\n\n\n\n- Open the Programme\n\n\n- Go to Settings → Online registration\n\n\n- In the Communication section, choose your custom template in Session reminders\n\n\n- Click Save. \n\n\nAfter that, that programme will send your custom reminder instead of the default one. \n\n\nTip: you can create several reminder templates (e.g. one for children’s classes and another for adult classes) and assign them to the appropriate programmes.", "cited": ["Automatic notification of an upcoming session | Zooza Help", "Programme Settings | Zooza Help", "Getting Started with Zooza | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help customizing reminders for your programmes, I’m here to assist. Would you like to share more about what you’re trying to set up?", "cited": []}], "verdict": "gap", "vtitle": "Getting an email when a booking comes in", "vnote": "Admin-side notification of a new booking. Not covered.", "cat": "comms"}, {"channel": "intercom", "id": "215475660077742", "date": "2026-08-26 21:38", "day": "2026-08-26", "human": false, "bucket": "D_assumed_with_kb", "reask": 7, "resolution": "assumed_resolution", "rating": null, "sources": ["Roles and Permissions FAQ | Zooza Help", "Role Selection Guide | Zooza Help", "Zooza 101 for Instructors | Zooza Help", "User roles | Zooza Help", "Instructors | Zooza Help", "Instructor Access and Roles FAQ | Zooza Help", "Remove a Client or User from Your Account | Zooza Help", "Settings | Zooza Help", "Add instructors and manage their access | Zooza Help", "Where to find things in Zooza — quick reference | Zooza Help"], "q": "How can I remove the teacher?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Anna Minarovič", "text": "How can I remove the teacher?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can remove a teacher from Settings → Team.\n\n\nSteps:\n\n\n\n\n- Go to Settings → Team\n\n\n- Find the instructor in the users list\n\n- Open their profile\n\n- Click Remove from company\n\n\n- Confirm the action\n\nThis disables their login and removes them from your account. The user record still exists in the platform, but it will no longer appear in your company. \n\n\nTip: if the instructor may return later, it’s safer to change their role to Inactive instructor instead. This blocks login but keeps all attendance, session history, and reports intact.", "cited": ["Remove a Client or User from Your Account | Zooza Help", "Add instructors and manage their access | Zooza Help", "Role Selection Guide | Zooza Help", "Roles and Permissions FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Anna Minarovič", "text": "I opened the profile but there is no option to deactivate the teacher", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "That usually happens when the profile is opened from the Instructors page. That screen only shows the instructor profile and does not include the role change option. \n\n\nTo deactivate the teacher:\n\n\n\n\n- Go to Settings → Team → Access\n\n\n- Find the instructor in the users list\n\n- Open their profile\n\n- Change the Role to Inactive instructor\n\n\n- Click Save \n\n\nThis blocks their login but keeps all attendance, session history, and reports intact. \n\n\nIf you want, I can also explain when it’s better to deactivate vs remove a teacher.", "cited": ["Instructor Access and Roles FAQ | Zooza Help", "Role Selection Guide | Zooza Help", "Remove a Client or User from Your Account | Zooza Help", "Roles and Permissions FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Anna Minarovič", "text": "Where can I find settings", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can find Settings in the main menu.\n\n\nSteps:\n\n\n\n\n- Go to Team & Settings in the left menu\n\n- Click Settings\n\n\nThis opens the Settings hub where you can access things like Access (user roles), Locations, Billing, and other account configuration options. \n\n\nIf you are looking for instructor access specifically, you will later go to Settings → Team → Access to change a teacher’s role.", "cited": ["Settings | Zooza Help", "Where to find things in Zooza — quick reference | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc s nájdením nastavení alebo deaktiváciou učiteľa, som vám k dispozícii. Chcete opísať, na ktorej obrazovke sa teraz nachádzate, aby som vás mohol ďalej usmerniť?", "cited": []}, {"role": "customer", "who": "Anna Minarovič", "text": "Ja tu stranku neviem najsť", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Nájdete Settings v hlavnom menu.\n\n\nPostup:\n\n\n\n\n- V ľavom menu kliknite na Team & Settings\n\n\n- Potom kliknite na Settings\n\n\nTáto obrazovka je hlavné centrum nastavení a obsahuje sekcie ako Access, Billing, Locations a ďalšie. \n\n\nDôležité: nie je to na stránke Instructors – tá slúži len na profil instruktorov a nemá tam možnosti na zmenu role. \n\n\nAk chcete, môžete mi povedať, na ktorej stránke ste teraz (napr. Programmes, Classes, Instructors). Podľa toho Vám ukážem presne, kde kliknúť.", "cited": ["Settings | Zooza Help", "Instructors | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Anna Minarovič", "text": "Ako najdem hlavne menu?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Hlavné menu nájdete v dolnej lište aplikácie.\n\n\n\n\n- Dole na obrazovke je Menu (v dolnej navigácii).\n\n- Kliknite na Menu – otvorí sa úplné menu aplikácie.\n\n- Tam nájdete sekcie ako Programmes, Classes, Sessions, Clients, Bookings, Payments a Settings. \n\n\nPotom postupujte:\n\n\n\n\n- \nTeam & Settings → Settings. \n\n\nAk chcete, môžete mi povedať, či používate Zooza na telefóne alebo na počítači – podľa toho Vám ukážem presne, kde to vidieť.", "cited": ["Zooza 101 for Instructors | Zooza Help", "Settings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Anna Minarovič", "text": "dole su len jazyky", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "To je normálne. Ak dole vidíte len jazyk, pravdepodobne ste prihlásený ako instruktor. Instruktori vidia len obmedzené menu a Settings sa im vôbec nezobrazuje. \n\n\nTáto časť aplikácie je dostupná len pre role Owner alebo Assistant. \n\n\nAk potrebujete nájsť Settings, musí sa prihlásiť používateľ s jednou z týchto rolí a ísť na:\n\n\n\n\n- \nTeam & Settings → Settings \n\n\nAk chcete, môžete mi povedať, akú rolu máte (Owner, Assistant, Instructor)? Podľa toho Vám ukážem, čo presne vidieť.", "cited": ["Add instructors and manage their access | Zooza Help", "User roles | Zooza Help", "Settings | Zooza Help"]}, {"role": "customer", "who": "Anna Minarovič", "text": "I am the owner but ther is no settings here", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak ste Owner, máte prístup ku všetkým funkciám a aj k Settings.\n\n\nNormálne nájdete Settings takto:\n\n\n\n\n- v ľavom menu kliknite na Team & Settings\n\n\n- potom Settings (je to hlavné centrum nastavení).\n\n\nAk dole vidíte len jazyk a Settings vôbec nie je v menu, pravdepodobne ste na inej obrazovke.\n\n\nMôžete mi povedať, na ktorej stránke ste teraz? (napr. Dashboard, Calendar, Sessions, Instructors).\n\n\nPodľa toho Vám ukážem presne, kde kliknúť.", "cited": ["User roles | Zooza Help", "Settings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc s nájdením nastavení, som vám k dispozícii. Chcete opísať, na ktorej stránke sa teraz nachádzate?", "cited": []}], "verdict": "gap", "vtitle": "Removing an instructor (bot-only, 7 re-asks)", "vnote": "Same question a human answered in 215475642840001. Two clients, ten re-asks between them, three role articles cited and none of them answered it.", "cat": "team"}, {"channel": "intercom", "id": "215475659744450", "date": "2026-08-26 20:59", "day": "2026-08-26", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "assumed_resolution", "rating": null, "sources": ["Payments and Billing FAQ | Zooza Help", "Payments | Zooza Help", "Exporting data and reports | Zooza Help"], "q": "Where is the export option im in payments and I want to see a breakdown from when we opened to today", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Kate Markham", "text": "Where is the export option im in payments and I want to see a breakdown from when we opened to today", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You’re currently on Sales & Payments → Payments, which is the dashboard. The export button is not there.\n\n\nTo export the data:\n\n\n\n\n- Go to Sales & Payments → Payments received\n\n\n- Set the date filter from when you opened until today\n\n- Click Export at the top of the list\n\nThe export will download an Excel file with the payments that are currently visible in the list, so the date filter is important before exporting. \n\n\nTip: the file downloads immediately for smaller exports, or it may prepare in the background if it’s large.", "cited": ["Payments and Billing FAQ | Zooza Help", "Payments | Zooza Help", "Exporting data and reports | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Kate Markham", "text": "I cant see payments received option", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thanks for the screenshot — that helps.\n\n\nYou are currently on Sales & Payments → Payments, which is the dashboard. The Export button is not on this page. The export is available only on the Payments received list. \n\n\nTry this:\n\n\n\n\n- In the left sidebar under Sales & Payments, click Payments received (not Payments).\n\n- Set the date filters:\n• Received from → when you opened\n• Received before → today\n\n- Click Export at the top of the list. \n\n\nThe export downloads an Excel file with the payments currently visible in the list, so the date filter is important before exporting.\n\n\nIf you want, I can also show you a quick way to turn that export into a programme income breakdown in Excel.", "cited": ["Payments and Billing FAQ | Zooza Help", "Payments | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help finding the payments export, I’m here to assist. Would you like to share what options you see under Sales &amp; Payments so we can continue?", "cited": []}], "verdict": "gap", "vtitle": "Where the payments export is", "vnote": "Pairs with 215475659649340.", "cat": "reports"}, {"channel": "intercom", "id": "215475659649340", "date": "2026-08-26 20:54", "day": "2026-08-26", "human": false, "bucket": "D_assumed_with_kb", "reask": 3, "resolution": "assumed_resolution", "rating": null, "sources": ["Reports | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Payments | Zooza Help"], "q": "How can I create a report that shows payments by programme since we opened", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Kate Markham", "text": "How can I create a report that shows payments by programme since we opened", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can get this from the Payments by programme report.\n\n\nSteps:\n\n\n\n\n- Go to Sales & Payments → Payments\n\n\n- Open Reports\n\n\n- Select Payments by programme\n\n\nThis report shows a table with:\n\n\n\n\n- Programme name\n\n- Income received\n\n- Discounts\n\n- Refunds\n\n- Amounts due\n\nIt gives a clear income breakdown per programme for the selected period. \n\n\nTip: you can also use the Payments dashboard → Reports → Payments by programme for quick access to the same report. \n\n\nIf you want, I can also show you how to export payment data to Excel for deeper analysis.", "cited": ["Payments | Zooza Help", "Reports | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Kate Markham", "text": "Yeah but from when we opened this account I can see it does month by month I need for a whole period from when we opened to today", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Good question — the Payments by programme report is designed to compare one current month with one historical month, so it cannot show a single “all time” total in one view. \n\n\nTo get a full period from when you opened until today, use the Payments Received filters instead:\n\n\n\n\n- Go to Sales & Payments → Payments\n\n\n- In the filters, set:\n• Received from = your account start date\n• Received before = today\n\n- This shows all payments received across that entire date range.\n\nReports in Zooza are always scoped to the selected period, so changing the date range changes the totals you see. \n\n\nIf you want, I can also show a simple way to export that filtered payment list into Excel for a full “all-time” income summary.", "cited": ["Payments | Zooza Help", "Reports | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Kate Markham", "text": "Okay Ive got that but how can i break that down in to programmes", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Good — you’re on the right track.\n\n\nSince you’re on Sales & Payments → Payments → Payments Received, the easiest way to break it down by programme is to export the filtered list.\n\n\nSteps:\n\n\n\n\n- Keep your Received from and Received before filters (your full period).\n\n- Click Export.\n\n- Download the Excel file.\n\nThe export includes a Programme/Product column, so you can group or pivot the data in Excel to see totals per programme. \n\n\nTip: In Excel, create a pivot table with Programme/Product as rows and Amount as values to get a clean “all-time income by programme” summary.", "cited": ["Payments | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any additional help breaking down the full-period payments by programme, I’m here to help. Would you like to share more about what you’re trying to analyse or export?", "cited": []}], "verdict": "gap", "vtitle": "Payments by programme since we opened", "vnote": "Reporting question. With 215475659744450 (where is the export) that is two clients this week asking for the same report.", "cat": "reports"}, {"channel": "intercom", "id": "215475634930075", "date": "2026-08-26 19:05", "day": "2026-08-26", "human": true, "bucket": "HUMAN", "reask": 12, "resolution": "routed_to_team", "rating": null, "sources": ["Getting Started with Zooza | Zooza Help", "Payment Correction vs Refund Guide | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Refund a Stripe payment — step by step | Zooza Help"], "q": "Ako môžeme túto platbu klientovi vrátiť sami?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Dear Anastasiia,\n\n\nyour ticket  has been received. Zooza Assistant will try to help you right away — and a member of our team will personally review it too.\n\n\n— Zooza Support", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "customer", "who": "Anastasiia Poliakova", "text": "human", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Would you like me to connect you with a human agent? Or if you prefer, you can continue working with me and provide more details about your request.", "cited": []}, {"role": "customer", "who": "Anastasiia Poliakova", "text": "Ako môžeme túto platbu klientovi vrátiť sami?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno, platbu môžete vrátiť priamo v Zooza.\n\n\nPostup:\n\n\n\n\n- Otvorte Bookings a vyberte danú rezerváciu.\n\n- Prejdite do sekcie Payments.\n\n- Kliknite na danú transakciu.\n\n- Vyberte Refund.\n\n- Zadajte celú alebo čiastočnú sumu a potvrďte. \n\n\nAk platba bola kartou cez Stripe, peniaze sa automaticky pošnú späť na kartu klienta. Zvyčajne sa objavia do 5–10 pracovných dní. \n\n\nAk platba bola bankovým prevodom, v Zooza sa len zaznamená refund a peniaze je potrebné vrátiť ručne z vášho účtu.\n\n\nAk chcete, môžem vám tiež ukázať, kedy použiť administrative refund (napr. keď vracate peniaze mimo Zooza).", "cited": ["Payments and Billing FAQ | Zooza Help", "Payment Correction vs Refund Guide | Zooza Help", "Refund a Stripe payment — step by step | Zooza Help", "Getting Started with Zooza | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Anastasiia Poliakova", "text": "no", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I'm sorry to hear that the information wasn't what you expected. Could you please provide more details about your request so I can assist you better? I'm here to help! 😊", "cited": []}, {"role": "customer", "who": "Anastasiia Poliakova", "text": "human", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I understand you would prefer to speak with a human agent. Would you like me to connect you with one? Or if you want, you can share more details here and I’ll do my best to assist you further.", "cited": []}, {"role": "customer", "who": "Anastasiia Poliakova", "text": "human", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I see you would like to speak with a human agent. Would you like me to connect you with one now? Or if you prefer, you can continue working with me and provide more details about your request.", "cited": []}, {"role": "customer", "who": "Anastasiia Poliakova", "text": "human", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I understand you prefer to speak with a human agent. Would you like me to connect you with one? Or if you want, you can share more details here and I’ll do my best to assist you further.", "cited": []}, {"role": "customer", "who": "Anastasiia Poliakova", "text": "yes", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I will connect you with someone from our team shortly. Meanwhile, could you please share any additional details about your issue to help them assist you more efficiently?", "cited": []}, {"role": "customer", "who": "Anastasiia Poliakova", "text": "Dobry den", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den. Platby su poskytovane cez nas. V tomto pripade neviete platbu refundovat napriamo ale iba tak, ze ju poslete priamo zo svojho uctu zakaznikovi.", "cited": []}, {"role": "customer", "who": "Anastasiia Poliakova", "text": "Dobrý deň. Ak túto platbu nemôžeme vrátiť sami, mohli by sme vás poprosiť, aby ste ju vrátili vy? Zároveň vás prosíme o zaslanie potvrdenia o vrátení platby, aby sme ho mohli preposlať klientke.\n​", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ako som spominal, na tomto ucte sa online refundacie robit nedaju. Mate dve moznosti ako postupovat a v oboch je rovnaky tento krok: poslete zakaznicke peniaze priamo z Vasho podnikatelskeho uctu.\nTo co sa moze variovat je nacasovanie: Bud jej poslete peniaze okamzite a pockate kym Vam zo Zoozy pridu peniaze na ucet. Spolu s peniazmi od nas odstanete aj vypips vsetkych transakcii aby ste vedeli potom uctovnikovi predlozit dovod refundacie.\nDruha moznost je pockat kym, Vam peniaze pridu od nas a refundaciu urobit az potom.", "cited": []}, {"role": "customer", "who": "Anastasiia Poliakova", "text": "Refund je základná funkcia Stripe, ktorú je možné vykonať prakticky jedným kliknutím. Možnosť refundácie je zároveň štandardom pri každej službe na prijímanie platieb kartou.\n\n\nV praxi nemôže fungovať platobný systém bez možnosti vrátenia platby, pretože zákazník môže požiadať svoju banku o spätné vrátenie kartovej platby. V takom prípade je následne potrebné vysvetľovať Stripe, čo sa stalo, a opakované chargebacky môžu negatívne ovplyvniť reputáciu obchodníka v Stripe.\n\n\nOkrem toho, ak platba nebude refundovaná, budeme musieť túto prijatú platbu riešiť aj z daňového hľadiska ako príjem, hoci sme peniaze zákazníčke vrátili. Toto je ešte problematickejšie v prípade, ak jej peniaze pošleme skôr, než nám bude príslušná platba vyplatená z vašej strany.\n\n\nPreto vás prosíme, aby ste našli spôsob, ako otázku refundácií systémovo vyriešiť. Možnosť vrátenia kartovej platby považujeme za základnú a nevyhnutnú funkciu platobného systému.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Vy ale nepouzivate Stripe. Vy pouzivate ako platobnu branu Zoozu, ktora na spracovanie platieb pouziva rozne platobne brany (nielen Stripe). Refundacie sa bohuzial tymto sposobom robit nedaju, ak by to bolo mozne, bola by tato funkcia spristupnena pre zakaznikov tak ako ked priamo sami pouzivaju sluzbu Stripe Connect. Mrzi ma, ze doslo k nedorozumeniu a nespravnemu ocakavaniu od tejto sluzby. V pripade ak chcete mat plnu kontrolu nad platbami, je potrebne pouzit priamo sluzbu Stripe Connect.", "cited": []}, {"role": "customer", "who": "Anastasiia Poliakova", "text": "Môj spôsob platby je jasne uvedený ako **Stripe (via Zooza)**. Žiadne iné platobné metódy okrem **Stripe via Zooza** nemáme aktivované. A klientka teda očividne uskutočnila platbu prostredníctvom Stripe.\n​", "cited": []}, {"role": "customer", "who": "Anastasiia Poliakova", "text": "V čom je problém kliknúť v Stripe na tlačidlo **Refund**? Čo vám v tom bráni?\n​", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Premyslam ako inak to este vysvetlit. Nepouzivate stripe. Nemate so stripeom ziadny vztah. To ze tato konkretna platba bola realizovana prostrednictvom stripeu ako platobnej brany na tom nic nemeni. Tuto sluzbu poskytujeme klientom, ktori nechcu prechadzat procesom overovania obchodnika, ktory Stripe ale aj ine platobne brany vyzaduju a riziko zneuzitia takejto platobnej brany znasa Zooza ako firma. V ramci tejto sluzby mame zadefinovane podmienky a pravidla, ktore urcuju akym sposobom moze byt platobna brana pouzivana. V ramci nasej predoslej diskusie ste sa pytali na sposob vyplacania penazi a k refundom sme sa nedostali. Sluzbu v tejto podobe prevadzkujeme stvrty rok a vsetky procesy ohladom reportingu a vyplacania penazi zakaznikom mame nastavene tak, ze refundy si poskytuju a vyplacaju sami zakaznici. Nieje to teda otazka toho ci sa niekde nejake tlacitko kliknut da ale otazka pravidiel a ich dodrziavania. Ak by sme Vam v tejto chvili refund urobili, nevyplatili by sme Vam korektne peniaze a rovnako by sme Vam ich nekorektne odreportovali, nevraviac o tom, ze by sme tym prebrali zodpovednost za vztah medzi Vami ako poskytovatelom sluzby a Vasim zakaznikom, ktory si sluzbu u Vas objednal.\nVerim, ze taketo vysvetlenie je dostatocne.", "cited": []}], "verdict": "verify", "vtitle": "Refunding a payment taken through Zooza", "vnote": "Human answer: you cannot refund it in the app, you send the money from your own account. There is a shipped administrative-refund spec, so confirm which case this applies to before documenting.", "cat": "payments"}, {"channel": "email", "id": "email-magikats-day-of-week", "date": "2026-08-26 15:31", "day": "2026-08-26", "human": true, "bucket": "EMAIL", "reask": 0, "resolution": "—", "rating": null, "sources": [], "q": "Feature request — day of the week in the trial booking flow", "turns": [{"role": "customer", "who": "Sarah Marsh", "text": "It would be really good if the day of the week could be added to the trial booking process. At the moment it shows as below, which does not specify a day. If a centre is operating on several days, parents cannot tell which one they are booking.", "cited": []}, {"role": "human", "who": "Michal", "text": "Two things. Day of the week on session dates: the script below is a quick fix you can add yourself right now — paste it into the Squarespace footer (Settings -> Advanced -> Code Injection).", "cited": []}, {"role": "customer", "who": "Sarah Marsh", "text": "Thank you — I will try adding the code later. You are right, I was trying to anticipate questions. The main centre I was considering is Edinburgh where he has three locations and multiple days.", "cited": []}, {"role": "human", "who": "Michal", "text": "That makes sense — multiple locations for one franchisee is quite common. There is already a location dropdown built into the widget, so when a parent selects a location the available sessions filter to that location.", "cited": []}], "verdict": "gap", "vtitle": "The trial booking flow shows dates without the day of the week", "vnote": "A franchisor running centres on several days of the week says parents cannot tell which day a trial falls on, because the picker shows only the date. Answered with a snippet for the host site rather than a product change. Two things for the KB: how a franchisee with several locations is handled (the widget already has a location dropdown that filters the sessions shown), and the fact that date formatting in the widget follows the host page. The second one is the same root cause as the Romanian calendar-language conversation in Intercom this week.", "cat": "account", "from": "Sarah Marsh, MagiKats"}, {"channel": "intercom", "id": "215475652310711", "date": "2026-08-26 13:51", "day": "2026-08-26", "human": true, "bucket": "HUMAN", "reask": 5, "resolution": "—", "rating": null, "sources": [], "q": "Dobrý deň,\n\n\nchceli by sme Vás poprosiť o preverenie a zohľadnenie situácie, ktorá nastala pri odosielaní SMS klientom z jarného fakturačného obdobia.\n\n\nLulu sa pokúšala odoslať SMS, pričom jej systém dvakrát zobrazil chybové hlásenie, že správa nebola odoslaná. Keďže sme predpokladali, že SMS naozaj neodišla, skúsila som ju odoslať aj ja, no opäť sa zobrazila chyba.\n\n\nCelkovo sme teda SMS skúšali odoslať trikrát. Následne sme však zistili, že napriek chybovým hláseniam bola správa odoslaná všetky tri razy, takže klientom prišla opakovane.\n\n\nMomentálne navyše nevieme overiť, či bola SMS doručená úplne všetkým klientom, keďže pri odosielaní nebolo k dispozícii záverečné vyhodnotenie ani potvrdenie o úspešnom odoslaní.\n\n\nKeďže sme nemali žiadnu možnosť vedieť, že SMS boli napriek zobrazenému erroru skutočne odoslané, chceli by sme Vás poprosiť o preverenie tejto situácie, opravu vzniknutej chyby
