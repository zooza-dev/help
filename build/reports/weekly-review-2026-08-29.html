 "Booking form settings overview | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Payment templates creation | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Igor Švarc", "text": "ano", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Great! I'm glad that helped. If you would like, I can guide you through the steps to set up the exact prices of 100 € and 200 € based on the payment method. Just let me know how you want to proceed!", "cited": []}, {"role": "customer", "who": "Igor Švarc", "text": "tano prosim", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Najjednoduchší spôsob je použiť rovnakú šablónu, ale upraviť zaokruhlenie, aby suma bola presne 100 € a 200 €.\n\n\nPostup:\n\n\n\n\n- Pôjdite do Team & Settings → Billing → Payments.\n\n- Otvorte šablónu platby, ktorú používate.\n\n- V nastavení Rounding nastavte zaokruhlenie na none (žiadne zaokruhlenie).\n\n- Uložte. \n\n\nPotom v programe:\n\n\n\n\n- Programmes → vyberte krúžok → Settings → Price and Payment → Edit\n\n- Nastavte Total price = 100 € (alebo 200 €). \n\n\nAk chcete, aby klienti platili naraz, zvolte One-off – systém vezme celú sumu v jednej platbe a nechce ju deliť na splátky. \n\n\nTip: ak chcete ponúkať aj 100 € aj 200 € v rovnom krúžku, môžete použiť Booking fee alebo oddelené šablóny, aby si klienti pri rezervácii vybrali variantu.", "cited": ["Price and payment setup | Zooza Help", "Create a programme | Zooza Help", "Booking form settings overview | Zooza Help", "Discounts and Sibling Pricing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak potrebujete s nastavením cien ešte pomôcť, som vám k dispozícii. Chcete doplniť, čo presne sa pri nastavení 100 € a 200 € nedarí?", "cited": []}], "verdict": "gap", "vtitle": "Price comes out as 100,01", "vnote": "Rounding when a price is split into instalments. Needs verification of how the remainder is distributed.", "cat": "pricing"}, {"channel": "intercom", "id": "215475615365653", "date": "2026-08-24 09:46", "day": "2026-08-24", "human": false, "bucket": "D_assumed_with_kb", "reask": 1, "resolution": "assumed_resolution", "rating": null, "sources": ["Shared sessions — two classes in one room | Zooza Help"], "q": "How does sharing a room between two groups work", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "How does sharing a room between two groups work", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "When two groups use the same room at the same time, you can use Shared sessions so the room’s real capacity is respected. \n\n\nNormally, each class has its own capacity. If two classes both allow 10 people, the system could allow 20 bookings in a room that only fits 10. Shared sessions prevent that.\n\n\nHow it works:\n\n\n\n\n- You create a shared-sessions set in Team & Settings → General → Shared sessions.\n\n- Add all classes that run in that room at the same time.\n\n- Zooza then combines those sessions and uses the room’s capacity as the limit.\n\nA few important details:\n\n\n\n\n- Sessions are combined only if they are in the same room, same date, and overlapping time.\n\n- The attendance register shows everyone in the room together, but each person still belongs to their own class for reporting and payments.\n\n- The number of available places is shown in Free places by date, not the class capacity.\n\nExample:\n\n\nRoom capacity = 10.\n\n\n6 students are enrolled for the whole term.\n\n\nOnly 4 places remain for drop‑ins on each date.\n\n\n\nSource:\nShared sessions — two classes in one room | Zooza Help", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any additional help understanding shared sessions or room capacity, I’m here to help. Would you like to share more about what you’re trying to set up?", "cited": []}], "verdict": "check", "vtitle": "How sharing a room between two classes works", "vnote": "Shared sessions have their own guide. Read it before deciding whether this is a gap or a retrieval problem.", "cat": "programmes"}, {"channel": "intercom", "id": "215475614913517", "date": "2026-08-24 09:10", "day": "2026-08-24", "human": false, "bucket": "D_assumed_with_kb", "reask": 3, "resolution": "assumed_resolution", "rating": null, "sources": ["Getting Started with Zooza | Zooza Help", "Types of bookings | Zooza Help", "Waiting List FAQ | Zooza Help", "Settings | Zooza Help"], "q": "ma Zooza taku finkciu ze ked je naplnena skupina tak vedia sa na cakacku dat?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Natália Varkondová", "text": "ma Zooza taku finkciu ze ked je naplnena skupina tak vedia sa na cakacku dat?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Áno, táto funkcia v Zooza existuje.\n\n\nKeď je skupina (kurz) naplnená, rodičovia sa môžu prihlásiť na poradovník (waiting list). Prihláska sa uloží ako čakateľ a nie ako bežná rezervácia. \n\n\n\n\n- systém automaticky zobrazí „kurz je plný – môžete sa pridať na poradovník“\n\n- rodič môže stále odoslať formulár a zostať v poradovníku\n\n- vy dostanete upozornenie a môžete ich ručne schváliť, ak sa uvoľní miesto\n\nPoradovník sa aktivuje automaticky, keď kurz dosiahne kapacitu – nič sa nemusí nastavovať.", "cited": ["Waiting List FAQ | Zooza Help", "Getting Started with Zooza | Zooza Help", "Types of bookings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Natália Varkondová", "text": "a kde sa to nastavuje?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Túto funkciu nemusíte vôbec nastavovať.\n\n\nKeď kurz dosiahne kapacitu, Zooza automaticky zobrazí možnosť pridať sa na poradovník (waiting list). Nové prihlásky sa uložia ako čakateľi a môžete ich neskôr ručne schváliť, ak sa uvoľní miesto. \n\n\nTento poradovník je aktivovaný automaticky, keď je skupina plná – nie je potrebné nič zapínať ani konfigurovať. \n\n\nNastavovanie existuje len pri náhradných hodinách (make‑up sessions), nie pri bežných kurzoch.", "cited": ["Waiting List FAQ | Zooza Help", "Getting Started with Zooza | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Natália Varkondová", "text": "a kde sa ale nastavuje ze na aky mail pride tanto informacia", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Tento e‑mail sa nastavuje v Settings → Notifications.\n\n\nPostup:\n\n\n\n\n- otvorte Settings\n\n\n- kliknite na Notifications\n\n\n- Add new notification\n\n- vyberte typ notifikácie\n\n- zadajte e‑mail, na ktorý má prichádzať upozornenie\n\n- kliknite Create Notification \n\n\nTento e‑mail dostanete, keď niekto sa prihlási na poradovník (waiting list), takže môžete ich neskôr ručne schváliť, ak sa uvoľní miesto. \n\n\nPoznámka: jeden notifikačný záznam môže mať len jeden e‑mail. Ak chcete posielať na viac adres, musíte vytvoriť viac notifikácií.", "cited": ["Settings | Zooza Help", "Waiting List FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Bol to pre vás užitočné?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak potrebujete s nastavením e-mailových upozornení ešte pomôcť, som vám k dispozícii. Chcete doplniť, čo presne potrebujete v nastavení notifikácie objasniť?", "cited": []}], "verdict": "check", "vtitle": "Waiting list when a class is full", "vnote": "Waiting List FAQ was cited and the client still re-asked 3 times. Compare against the human answer in 215475616977444.", "cat": "bookings"}, {"channel": "intercom", "id": "215475490031349", "date": "2026-08-24 08:53", "day": "2026-08-24", "human": true, "bucket": "HUMAN", "reask": 6, "resolution": "assumed_resolution", "rating": null, "sources": ["Checklist pred spustením nových kurzov: Na čo nezabudnúť, aby sa sezóna nezačala chaosom — Zooza", "Zooza PRO - Zooza", "Registrační stránka pro dětské kroužky: 5sekundový návod — Zooza", "Žebřík důvěry rodičů: 3 standardy pro dětské aktivity, které zvyšují retenci — Zooza", "Nemůžete škálovat, co nemá logiku: CEO playbook pro vzdělávací a dětské značky — Zooza"], "q": "No môj zlatý, neviem nastaviť šablóny platobné v zoze. Neviem to tam vôbec nastaviť pre skupiny napríklad K4, kde chcem, aby mesačne platili 35 eur. Má vytvorenú šablónu, pozri sa na to, jak to mám vytvoriť, lebo ma už z toho drbne.", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": "Dušan Frimer", "text": "No môj zlatý, neviem nastaviť šablóny platobné v zoze. Neviem to tam vôbec nastaviť pre skupiny napríklad K4, kde chcem, aby mesačne platili 35 eur. Má vytvorenú šablónu, pozri sa na to, jak to mám vytvoriť, lebo ma už z toho drbne.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "V našem systému existují „šablony“ hlavně jako opakovaně použitelné zprávy pro komunikaci s rodiči, ne jako šablony pro nastavení plateb za skupiny. Pro platby máme funkce jako online platby, splátkové kalendáře a připomínky, ale konkrétní postup, kde nastavit měsíční poplatek 35 € pro skupinu K4, tu popsán není.\n\n\nNa jaké stránce v aplikaci jste teď, když chcete nastavit ten poplatek 35 € za K4?", "cited": ["Žebřík důvěry rodičů: 3 standardy pro dětské aktivity, které zvyšují retenci — Zooza", "Zooza PRO - Zooza"]}, {"role": "bot", "who": "Zooza Support", "text": "Hledali jste tohle?", "cited": []}, {"role": "customer", "who": "Dušan Frimer", "text": "Ty mi povedz, kde mám nájsť, ako sa na rzy“, alebo sa nachádzate na inej stránke?", "cited": []}], "verdict": "gap", "vtitle": "Setting up a trial session (2)", "vnote": "Same gap as 215475682935515.", "cat": "trials"}, {"channel": "intercom", "id": "215475600949978", "date": "2026-08-22 20:04", "day": "2026-08-22", "human": false, "bucket": "D_assumed_with_kb", "reask": 8, "resolution": "assumed_resolution", "rating": null, "sources": ["Cum să automatizați afacerea dvs. de activități pentru copii (fără a pierde atingerea personală) — Zooza", "Zooza PRO - Zooza", "De ce rezolvarea „problemei invizibile” a părinților construiește un brand mai puternic — Zooza"], "q": "Vreau să știu dacă cursul meu începe pe 7 septembrie. Dacă un om se înscrie pe 20 septembrie cat are de plătit pe lună septemebrie dacă cursul este setat pe plata lunară", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Cu ce vă pot ajuta?", "cited": []}, {"role": "customer", "who": null, "text": "Vreau să știu dacă cursul meu începe pe 7 septembrie. Dacă un om se înscrie pe 20 septembrie cat are de plătit pe lună septemebrie dacă cursul este setat pe plata lunară", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "În sistemul nostru, plata lunară este gestionată prin facturare și programarea plăților, inclusiv facturi automate și reminder-uri.  Totuși, pentru a calcula exact suma pentru septembrie, am nevoie de regulă ta de facturare, deoarece documentația disponibilă nu specifică dacă plata lunară se ratează pe zilele din lună sau se facturează complet pentru luna în care cursul a început.\n\n\nCe regulă de facturare folosiți pentru curs, adică facturați suma lunară completă pentru luna începerea sau ratează pe numărul de zile din lună?", "cited": ["Cum să automatizați afacerea dvs. de activități pentru copii (fără a pierde atingerea personală) — Zooza", "Zooza PRO - Zooza"]}, {"role": "customer", "who": null, "text": "Vreau să calculăm pe zilele rămase din luna, se poate face o astfel de setare?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Pe scurt: nu există o setare în Zooza pentru a calcula automat plata lunară pe numărul de zile rămase din lună.\n\n\nPlata lunară este gestionată prin facturare și programarea plăților (facturi automate, reminder‑uri, abonamente), dar documentația nu menționează o regulă de calcul pe zilele din lună. \n\n\nÎn practică, dacă un elev se înscrie în mijlocul lunii, suma pentru acea lună trebuie calculată manual și creată ca factură corespunzătoare.\n\n\nDacă doriți, vă pot arăta și un mod simplu de a gestiona astfel de înscrieri în mijlocul lunii pentru a evita confuzia la facturare.\n\n\n\nSource:\nCum să automatizați afacerea dvs. de activități pentru copii (fără a pierde atingerea personală) — Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Asta căutați?", "cited": []}, {"role": "customer", "who": null, "text": "Da, asta caut. Sau o variantă asemănătoare.\n\n\nDacă cursul meu durează din 7 septembrie  2026 până în 17 iunie 2027 și vreau să setez plata lunară, se poate? \n\n\nDe exemplu cine se înscrie pe 7 septembrie plătește luna întreaga dar cine se înscrie pe 20 septmebrie să i se recalculeze cat are de plată. \n\n\nDe asemenea, în luna iunie vreau să plătească doar jumătate de lună. \n\n\n\n​", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Da, cursul poate dura de la 7 septembrie 2026 până la 17 iunie 2027 și poți folosi plata lunară. În Zooza, plățile lunare sunt gestionate prin facturare și programarea plăților (facturi automate, reminder‑uri, abonamente). \n\n\nTotuși, sistemul nu recalculează automat suma pe zilele rămase din lună. Dacă un elev se înscrie în mijlocul lunii (ex. 20 septembrie), suma pentru acea lună trebuie calculată manual și creată ca factură corespunzătoare.\n\n\nLa finalul cursului ( iunie 2027 ) poți face același lucru: creezi o factură cu jumătate din suma lunară pentru acea lună.\n\n\nPasul următor: poți folosi abonamente sau facturi automate pentru lunile normale și doar ajusta manual primele și ultimele luni.", "cited": ["Cum să automatizați afacerea dvs. de activități pentru copii (fără a pierde atingerea personală) — Zooza", "Zooza PRO - Zooza"]}, {"role": "bot", "who": "Zooza Support", "text": "Ați primit răspuns la întrebarea dvs.?", "cited": []}, {"role": "customer", "who": null, "text": "Ce altă variantă de plată a cursului am astfel încât să nu trebuiască să fac manual facturile pentru luna iunie. Sunt peste 400 de copii înscriși pentru care ar trebui să facem factura manuală. Este prea mult.\n\n\nCum putem face? \n\n\nPoate să plătim la număr de ședințe? \nSau la două luni tranșă egală?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "În Zooza, plățile automate funcționează prin facturi generate cu data de scadență și reminder‑uri, dar sistemul nu are o regulă integrată pentru a recalcula automat suma pe zilele din lună sau pentru jumătate de lună. \n\n\nDe aceea, pentru cazuri precum:\n\n\n\n\n- prima lună (septembrie)\n\n- ultima lună ( iunie jumătate)\n\nfactura trebuie creată manual.\n\n\nVariante mai simple pentru a reduce lucrul manual:\n\n\n\n\n- folosiți abonamente / facturi automate pentru lunile normale (septembrie – mai)\n\n- ajustați manual doar primele și ultimele luni\n\nUn alt lucru care ajută: programarea plăților cu reminder‑uri automate, astfel încât facturile să trimiță notificări și să urmeze plata fără lucru manual.\n\n\nDacă doriți, vă pot arăta și un model de structură de plată pentru cursuri de 9 luni care minimizează mult lucrul administrativ.", "cited": ["Cum să automatizați afacerea dvs. de activități pentru copii (fără a pierde atingerea personală) — Zooza", "Zooza PRO - Zooza"]}, {"role": "bot", "who": "Zooza Support", "text": "A fost de ajutor?", "cited": []}, {"role": "customer", "who": null, "text": "Un alt lucru care ajută: programarea plăților cu reminder‑uri automate, astfel încât facturile să trimiță notificări și să urmeze plata fără lucru manual.\n\n\nCum arată?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "În Zooza, reminder‑urile de plată funcționează astfel:\n\n\n\n\n- Crezi o factură pentru elev și setezi o dată de scadență.\n\n- Sistemul trimite automat memento‑uri de plată înainte sau după scadență.\n\n- Părinții primesc notificări automate despre plată, astfel încât nu trebuie să le urmărești manual. \n\n\nÎn practică, fluxul arată așa:\n\n\n\n\n- elevul este înscris\n\n- factura este generată\n\n- reminder‑urile trimite mesaje automat\n\n- părintele vede și plătește online. \n\n\nAcest lucru reduce mult lucrul administrativ și face procesul mai previzibil pentru părinți. \n\n\nDacă doriți, vă pot arăta și un model simplu de structură de plată pentru cursuri de 9 luni care minimizează mult lucrul manual.", "cited": ["Cum să automatizați afacerea dvs. de activități pentru copii (fără a pierde atingerea personală) — Zooza", "Zooza PRO - Zooza", "De ce rezolvarea „problemei invizibile” a părinților construiește un brand mai puternic — Zooza"]}, {"role": "bot", "who": "Zooza Support", "text": "Asta căutați?", "cited": []}, {"role": "customer", "who": null, "text": "Hai să văd ca nu prea înțeleg .\nDe unde știe părintele cat trebuie să plătească pentru iunie de exemplu?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Părintele vede suma pe factura pe care o primește după înscriere. În fluxul normal:\n\n\n\n\n- părintele înscrie copilul\n\n- sistemul generează o factură cu suma exactă\n\n- factura are o dată de scadență\n\n\n- părintele primește reminder‑uri automate înainte sau după scadență și poate plăti online. \n\n\nDeci pentru iunie, părintele nu calculează singur suma. El vede direct pe factură suma setată de tine (ex. jumătate din lună) și plată pe acea valoare.\n\n\nAcest lucru face procesul mai previzibil pentru părinți și reduce mesajele despre „cât trebuie să plătesc”. \n\n\nDacă doriți, vă pot arăta și un model simplu de structură de plată pentru cursuri de 9 luni care minimizează mult lucrul administrativ.", "cited": ["Cum să automatizați afacerea dvs. de activități pentru copii (fără a pierde atingerea personală) — Zooza", "De ce rezolvarea „problemei invizibile” a părinților construiește un brand mai puternic — Zooza"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": null, "text": "Asta înseamnă ca trebuie să calculez manual diferența de plată ?\n\n\nEl vede direct pe factură suma setată de tine (ex. jumătate din lună) și plată pe acea valoare.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Da, exact. Părintele vede suma pe factură, dar acea sumă trebuie setată de tine înainte. \n\n\nFluxul arată așa:\n\n\n\n\n- tu creezi factura și setezi suma (ex. jumătate din lună pentru iunie)\n\n- factura are o dată de scadență\n\n- părintele primește factura și reminder‑uri automate\n\n- el plătește suma afișată pe factură\n\nDeci sistemul nu calculează automat jumătatea lunii sau diferența — el doar trimite factura și reminder‑urile. Calculul pentru cazuri speciale (prima lună, ultima lună) trebuie făcut manual.\n\n\nPasul următor: poți folosi facturi automate pentru lunile normale (septembrie – mai) și ajusta manual doar primele și ultimele luni pentru a reduce mult lucrul administrativ.\n\n\n\nSource:\nCum să automatizați afacerea dvs. de activități pentru copii (fără a pierde atingerea personală) — Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "A fost de ajutor?", "cited": []}, {"role": "customer", "who": null, "text": "Se poate seta plata la ședință pe întreg cursul? Sau cum să facem să excludem recalcularea la fiecare elev . Dacă sunt aprox 1000 de elevi este foarte consumator de timp", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Pe scurt: nu există o setare în Zooza pentru plată pe ședință sau pentru recalculare automată pe zilele din lună. Sistemul gestionează plata prin facturi generate cu o sumă fixă și reminder‑uri automate. \n\n\nDeci pentru cazuri precum:\n\n\n\n\n- prima lună (septembrie)\n\n- ultima lună ( iunie jumătate)\n\nsuma trebuie setată manual pe factură. Sistemul doar trimite factura și reminder‑urile, dar nu calculează automat jumătatea lunii sau diferența.\n\n\nVarianta care reduce cel mai mult lucrul administrativ:\n\n\n\n\n- folosiți facturi automate pentru lunile normale (septembrie – mai)\n\n- ajustați manual doar primele și ultimele luni\n\nPasul următor: poți folosi și prezența digitală pentru curs, astfel încât instructorii să marcheze prezența direct în sistem și să ai o vedere clară pe clase.\n\n\n\nSource:\nCum să automatizați afacerea dvs. de activități pentru copii (fără a pierde atingerea personală) — Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Asta căutați?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dacă mai aveți nevoie de ajutor pentru a găsi o structură de plată potrivită pentru curs, sunt aici să clarificăm opțiunile. Doriți să îmi spuneți ce variantă de tarifare luați în calcul pentru a continua?", "cited": []}], "verdict": "gap", "vtitle": "What a client pays when joining mid-month", "vnote": "Pro-rata for monthly payment. Aliquot segment pricing shipped in July 2026. Bot cited only marketing pages, in Romanian.", "cat": "pricing"}, {"channel": "intercom", "id": "215475587179939", "date": "2026-08-22 15:42", "day": "2026-08-22", "human": true, "bucket": "HUMAN", "reask": 2, "resolution": "routed_to_team", "rating": null, "sources": ["Ceník — Zooza"], "q": "Dobrý den, máme na kurzy handstandů vyvinutý vlastní systém, ale chybí nám správa omluvenek a náhrad. Koukal jsem, že tohle máte vyřešené, ale na to abychom mohli tyto dva systémy propojit, bych potřeboval mít přes API možnost klientům vytvořit za ně uživatelské účty (které potvrdí) a přihlásit je na všechny lekce kurzu, ze kterých se pak odhlašují a nahrazují na jiné, v API dokumentaci jsem toto nedohledal, lze to?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": null, "text": "Dobrý den, máme na kurzy handstandů vyvinutý vlastní systém, ale chybí nám správa omluvenek a náhrad. Koukal jsem, že tohle máte vyřešené, ale na to abychom mohli tyto dva systémy propojit, bych potřeboval mít přes API možnost klientům vytvořit za ně uživatelské účty (které potvrdí) a přihlásit je na všechny lekce kurzu, ze kterých se pak odhlašují a nahrazují na jiné, v API dokumentaci jsem toto nedohledal, lze to?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ano — otevřené API máme k dispozici a je určené právě pro vlastní integrace a propojení s externími systémy. Můžete si tak postavit vlastní vrstvu nad naším systémem a řešit věci jako registrace klientů, přihlašování na lekce nebo další procesy přes API. \n\n\nV dostupné dokumentaci ale nejsou popsané konkrétní endpointy pro:\n\n\n\n\n- vytvoření uživatelského účtu klienta\n\n- přihlášení klienta na lekce kurzu\n\nTo znamená, že přesně tyto funkce v dokumentaci nejsou popsané.\n\n\nPokud chcete, můžu vám také ukázat, jak se v Zooze řeší náhrady a přesuny mezi lekcemi přímo v systému, protože to je jedna z hlavních funkcí kalendáře a docházky.\n\n\n\nSource:\nCeník — Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Hledali jste tohle?", "cited": []}, {"role": "customer", "who": null, "text": "chci se zeptat člověka na tuto funkcionalitu, co jsem popsal", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Samozřejmě, přepojím vás na našeho kolegu, který vám s touto funkcionalitou pomůže. Předtím, prosím, sdílejte jakékoli další detaily, které by mohly usnadnit řešení vašeho dotazu.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Tým se na vás ohledně toho obrátí. Zooza bude zpět v pondělí.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Poskytněte Zooza Support a týmu své kontaktní údaje", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Michal. Dobra sprava je, ze vsetky funkcionality Zoozy su kompletne spristupnene cez Api. V ramci verejnej dokumentacie poskytujeme podklady iba k bezne konzumovanym endpointom. V teorii je teda mozne urobit to, co potrebujete. Horsia sprava je, ze ste si vybrali use case, ktory si toho vyzaduje ovela viac ako len zakladanie klienta. Nahradne hodiny su zo svojej podstaty naviazane na skupiny a terminy. Museli by ste teda viest paralelny kalendar vo svojom systeme a zaroven v Zooze. Opat. Je to mozne vdaka Api, akurat si nie som isty, ci by to pre Vas bola taka pridana hodnota, pretoze toto vsetko preintegrovat, to by ste si rovno mohli naprogramovat nahradne hodiny do Vasho systemu. Neviem co vsetko Vas system zabezpecuje, ale ak okrem klientov a platieb strazi aj rozvrh a teda je predpoklad, ze by ste mali dva systemy, ktore s nim pracuju (Vas a Zoozu), myslim, ze integracia iba kvoli nahradnym hodinam by sa Vam neoplatila.\n\n\nZaroven vidim este jednu problematicku oblast - Nahradne hodiny ako funkcionalita ma pomerne komplexny frontend - vyber nahradnych hodin, poradovniky, emailove notifikacie, atd. A toto je momentalne zabundlovane v zakaznickom portali. Vedeli by ste do tohto portalu sice vytvorit session a nalogovat tam pouzivatela pomocou SSO, ale museli by ste ho vyrazne orezat aby zakaznik nevidel zoznam registracii, platby, pripadne zakaznicke benefity atd atd, cize lepsia cesta by opat bola vytvorit si k tomu vlastny frontend a to je opat development, ktory by bol lepsie straveny investiciou do rozvoja Vasho vlastneho systemu.\n\n\n\n\n\nChcem tym povedat, ze odpoved na Vasu otazku je - Ano, da sa urobit to, co opisujete. Zaroven, robit takuto integraciu iba kvoli nahradnym hodinam je neekonomicke.\n\n\n\nAk by ste potencialne chceli prejst s celou agendou do Zoozy a Vas system by zabezpecoval iba frontend, pripadne iba kolektovanie novych registracii/klientov, to by uz davalo vacsi zmysel. Tym padom by ste Zoozu nepouzivali na vytvaranie registracii, ale vsetky ostatne body agendy - dochadzka, sprava lektorov, platby... by ste mali v Zooze. Ak by ste si k tomu naprogramovali vlastny frontend, ci uz v mobilnej appke alebo na webe, davalo by to vacsi zmysel.\n\ns pozdravom\n\n\nMartin Rapavy", "cited": []}], "verdict": "gap", "vtitle": "Running make-ups from your own system over the API", "vnote": "Human answer: everything is available over the API, but make-ups are tied to classes and sessions, so you would have to maintain a parallel calendar in both systems. Worth an honest FAQ entry rather than letting people discover it late.", "cat": "ai"}, {"channel": "intercom", "id": "215475595995279", "date": "2026-08-22 10:05", "day": "2026-08-22", "human": false, "bucket": "D_assumed_with_kb", "reask": 4, "resolution": "assumed_resolution", "rating": null, "sources": ["Online booking | Zooza Help", "Programme Settings | Zooza Help", "Edit automatic notifications of an upcoming session | Zooza Help", "Message Templates | Zooza Help", "Email and Communication FAQ | Zooza Help", "Automated notifications overview | Zooza Help", "Booking form settings overview | Zooza Help", "Message templates — automatic and manual emails | Zooza Help", "Automatic notification of an upcoming session | Zooza Help"], "q": "is there a communication template which is send before the class starts", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "is there a communication template which is send before the class starts", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes. There is an automatic session reminder email that is sent before the class starts.\n\n\n\n\n- It is sent the day before the session to all enrolled clients.\n\n- You can find and customise the template in Communication → Templates → Automatic session reminder.\n\n- You can also enable it per programme in Programme settings → Communication → Send automatic email reminders the day before the session. \n\n\nIf you want to send a message for a specific class, you can also add a “Send email before” notification directly on that session and choose the timing (for example, 1 hour before the class). \n\n\nTip: you can customise the reminder text to include instructions like what to bring or where to meet.", "cited": ["Message templates — automatic and manual emails | Zooza Help", "Message Templates | Zooza Help", "Programme Settings | Zooza Help", "Automated notifications overview | Zooza Help", "Email and Communication FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "I cant see automatic reminder", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you cannot see Automatic session reminder, it is usually because of your user role.\n\n\nIn Communication → Templates, scroll down to the Notifications section. The template is listed there as Automatic session reminder.\n\n\nIf the Templates menu or the Add template option is missing, your role may be Instructor. Instructors cannot view or edit templates. Only Owner or Admin roles can access them.\n\n\nYou can check this in Settings → Users and confirm your role. If needed, the account owner can change it to Admin.\n\n\nIf you want, I can also show you where to enable the reminder so it actually sends before the class.", "cited": ["Automatic notification of an upcoming session | Zooza Help", "Message templates — automatic and manual emails | Zooza Help", "Edit automatic notifications of an upcoming session | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "yes", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I'm glad I could assist you! If you have any more questions or need further help, please feel free to ask. I'm here to support you! 😊", "cited": []}, {"role": "customer", "who": "Samantha Skelton", "text": "show me where to enable the reminder so it sends before class", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can enable it in the Programme settings.\n\n\nSteps:\n\n\n\n\n- Go to Programmes\n\n\n- Open the programme you want\n\n- Go to Online Booking\n\n\n- Click Edit\n\n\n- Turn on Send automatic email reminders the day before the session\n\n\n- Save\n\nWhen this is enabled, the system sends a reminder email to all enrolled clients at 09:00 the day before the session. \n\n\nYou can also adjust the exact send time in Communication → Templates → Automatic session reminder (between 0–24 hours before the class). \n\n\nTip: if you want a different message for a specific class, you can add a Send email before notification directly on that session.", "cited": ["Automated notifications overview | Zooza Help", "Booking form settings overview | Zooza Help", "Online booking | Zooza Help", "Programme Settings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need additional help enabling the reminder before class, I’m here to assist. Would you like to share which part of the setup you’d like to clarify?", "cited": []}], "verdict": "check", "vtitle": "Template sent before a class starts", "vnote": "The upcoming-session notification article was cited and still did not land.", "cat": "comms"}, {"channel": "intercom", "id": "215475583376831", "date": "2026-08-22 09:17", "day": "2026-08-22", "human": true, "bucket": "HUMAN", "reask": 7, "resolution": "routed_to_team", "rating": null, "sources": ["Common Booking Scenarios | Zooza Help", "Client Management FAQ | Zooza Help", "Payments and Billing FAQ | Zooza Help"], "q": "I have a client record that says undefined and does not allow me to delete it but shows an unpaid booking", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "I have a client record that says undefined and does not allow me to delete it but shows an unpaid booking", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I understand this situation with the client record and unpaid booking is frustrating. Would you like me to connect you with a human agent? Or if you prefer, you can provide more details and I will do my best to assist you further.", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "whatever solves the problem please", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I will connect you with someone from our team who can assist you further. Meanwhile, could you please share any additional details about the issue to help them understand your situation better?", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "no further info required", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "What you’re seeing is expected behaviour.\n\n\n\n\n- \nClient records cannot be deleted from the Clients page. There is no delete button there. The client profile only stores contact information. \n\n\n- The unpaid booking is normal. A booking is created even if payment is skipped or fails, so the lead is still captured. It will appear as Unpaid until payment is completed. \n\n\nIf you want to remove the entry from your active lists:\n\n\n\n\n- Go to Clients → Bookings\n\n\n- Open the unpaid booking\n\n- Change the status to Deleted\n\n\nThis removes it from normal views while keeping the record in the CRM. \n\n\nIf you want, I can also explain how to automatically remove unpaid bookings after reminders so they don’t accumulate.", "cited": ["Client Management FAQ | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Common Booking Scenarios | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer help, or do you still need help from someone?", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "no it didnt show a delete option even going through client - bookings. the client is not booked to an actual class or venue", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I understand your frustration, and I will connect you with a human agent who can assist you further with this issue.", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "ok thank you", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hello Anna,\n\nCan you please send me some printscreen or give me a client ID number, so i can check what happened?\n\nThank you\nKatarina", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "hi its Ritika Suri", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "Thank you", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Anna, thank you.\n\n\nYes, it looks like Ritika Suri’s registration was deleted when the group was deleted during the Autumn Term setup, most probably because there were some duplicate groups at that stage.\n\n\nWe’ll check it properly and restore/fix the registration from our side.\n\n\nThe client should not see this booking in her profile now, and she should not receive any further messages related to it while it is deleted.", "cited": []}], "verdict": "product", "vtitle": "Client record shows undefined and cannot be deleted", "vnote": "Under investigation; no KB action.", "cat": "clients"}, {"channel": "intercom", "id": "215475595371422", "date": "2026-08-22 07:51", "day": "2026-08-22", "human": false, "bucket": "D_assumed_with_kb", "reask": 1, "resolution": "assumed_resolution", "rating": null, "sources": ["Checklist pred spustením nových kurzov: Na čo nezabudnúť, aby sa sezóna nezačala chaosom — Zooza", "Registrační stránka pro dětské kroužky: 5sekundový návod — Zooza"], "q": "ako vytvorit novu skupinu", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Martina Oberhauserová", "text": "ako vytvorit novu skupinu", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "V našem systému se „skupina“ často řeší jako výběr skupiny v rámci registrace do kurzu, takže rodič může kurz najít, kliknout, vyplnit údaje a vybrat skupinu. Na registrační stránce je dobré mít jasně viditelné informace jako kdy, kde, kolik to stojí a jak se přihlásit.\n\n\nNa jaké stránce v aplikaci právě jste, když chcete novou skupinu vytvořit?", "cited": ["Registrační stránka pro dětské kroužky: 5sekundový návod — Zooza", "Checklist pred spustením nových kurzov: Na čo nezabudnúť, aby sa sezóna nezačala chaosom — Zooza"]}, {"role": "bot", "who": "Zooza Support", "text": "Hledali jste tohle?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc s vytvorením novej skupiny, rád vám pomôžem. Chcete doplniť, na ktorej stránke v Zooze sa práve nachádzate?", "cited": []}], "verdict": "check", "vtitle": "Creating a new class", "vnote": "Creating a class has a guide. Check why the bot did not land it.", "cat": "programmes"}, {"channel": "intercom", "id": "215475595358124", "date": "2026-08-22 07:48", "day": "2026-08-22", "human": false, "bucket": "D_assumed_with_kb", "reask": 1, "resolution": "assumed_resolution", "rating": null, "sources": ["Change the language in Zooza | Zooza Help"], "q": "potrebujem prepojim menu z anglictiny do slovenciny", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": "Petronela Ševčíková", "text": "potrebujem prepojim menu z anglictiny do slovenciny", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Menu (admin rozhranie) môžete prepnúť zo slovenčiny na angličtinu takto:\n\n\n\n\n- Kliknite na logo Zooza v ľavom hornom <script id="app">
const el = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MARKETING = /— Zooza$|Zooza PRO|Cen[íi]k|Cennik/;
const CATLBL = Object.fromEntries(META.categories);
const DECLBL = Object.fromEntries(META.decisions.map(d => [d[0], d[1]]));

let filter = 'todo', catf = '', q = '', current = null, readOnly = false;

const FILTERS = [
  ['todo',    'To decide',   c => !S(c).d],
  ['all',     'All',         c => true],
  ['kb',      'Into the KB', c => S(c).d === 'kb'],
  ['dig',     'Dig into it', c => S(c).d === 'dig'],
  ['ok',      'Fine',        c => S(c).d === 'ok'],
  ['product', 'Product',     c => S(c).d === 'product'],
  ['noted',   'Has my note', c => !!S(c).note],
  ['human',   'Human',       c => c.human && c.channel === 'intercom'],
  ['bot',     'AI only',     c => !c.human],
  ['email',   'Email',       c => c.channel === 'email'],
];

const S = c => (STATE[c.id] ||= {d:'', cat:c.cat, note:'', sug:''});
const byId = id => DATA.find(c => c.id === id);

/* ---------- persistence ---------- */
let saveTimer = null, artifact = null, dirty = false;

function mirror(){ try{ localStorage.setItem('zooza-board-' + META.end, JSON.stringify(STATE)); }catch(e){} }

function setSave(text, cls){ const s = el('#save'); s.textContent = text; s.className = 'save ' + (cls||''); }

function touch(){
  dirty = true; mirror(); setSave('Unsaved…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(commit, 2500);
}

function buildDoc(){
  const css  = document.getElementById('sheet').textContent;
  const skel = document.getElementById('skeleton').innerHTML;
  const app  = document.getElementById('app').textContent;
  const enc  = o => JSON.stringify(o).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  const S_ = '<' + 'script';
  const E_ = '<' + '/script>';
  return '<!doctype html><html lang="en"><head><meta charset="utf-8">'
    + '<meta name="viewport" content="width=device-width,initial-scale=1">'
    + '<title>' + esc(document.title) + '</title>'
    + '<style id="sheet">' + css + '</style></head><body>'
    + skel
    + '<template id="skeleton">' + skel + '</template>'
    + S_ + ' id="data">const DATA=' + enc(DATA) + ';const META=' + enc(META) + ';' + E_
    + S_ + ' id="state">const STATE=' + enc(STATE) + ';' + E_
    + S_ + ' id="app">' + app + E_
    + '</body></html>';
}

async function commit(){
  if (!dirty || readOnly) return;
  if (!artifact){ setSave('Saved on this device', ''); dirty = false; return; }
  setSave('Saving…');
  try {
    sessionStorage.setItem('zooza-board-sel', current || '');
    sessionStorage.setItem('zooza-board-filter', filter);
    await artifact.publish(buildDoc());
    dirty = false; setSave('Saved', 'on');
  } catch (e) {
    if (e && (e.code === 'not_writer' || e.code === 'not_granted' || e.code === 'not_declared'
              || e.code === 'capability_disabled' || e.code === 'capability_removed')) {
      readOnly = true; setSave('Read-only view', 'err'); return;
    }
    if (e && e.code === 'conflict') return;               // the view is reloading to the winner
    if (e && e.code === 'rate_limited'){ saveTimer = setTimeout(commit, 8000); setSave('Queued…'); return; }
    setSave('Saved on this device only', 'err');
  }
}

/* ---------- rendering ---------- */
function matches(c){
  if (!FILTERS.find(x => x[0] === filter)[2](c)) return false;
  if (catf && S(c).cat !== catf) return false;
  if (!q) return true;
  const hay = (c.q + ' ' + c.vtitle + ' ' + c.vnote + ' ' + c.id + ' ' + S(c).note + ' ' +
               c.turns.map(t => t.text).join(' ')).toLowerCase();
  return hay.includes(q);
}

function tags(c){
  const s = S(c), out = [];
  if (s.d) out.push('<span class="tag dec ' + s.d + '">' + DECLBL[s.d] + '</span>');
  else if (s.sug) out.push('<span class="tag sug">suggests ' + DECLBL[s.sug] + '</span>');
  out.push('<span class="tag cat">' + esc(CATLBL[s.cat] || s.cat) + '</span>');
  if (s.note) out.push('<span class="tag hasnote">note</span>');
  if (c.bucket === 'A_hard_signal') out.push('<span class="tag crit">hard signal</span>');
  if (c.reask >= 4) out.push('<span class="tag">re-asked ' + c.reask + '&times;</span>');
  return out.join('');
}

function renderChips(){
  el('#chips').innerHTML = FILTERS.map(([k, label, fn]) =>
    '<button class="chip" data-f="' + k + '" aria-pressed="' + (filter === k) + '">' +
    label + ' <span class="c">' + DATA.filter(fn).length + '</span></button>').join('');
}

function renderProgress(){
  const done = DATA.filter(c => S(c).d).length, total = DATA.length;
  el('#barfill').style.width = (total ? (done / total * 100) : 0) + '%';
  el('#proglbl').innerHTML = '<b>' + done + '</b> of ' + total + ' decided';
}

function renderList(){
  const rows = DATA.filter(matches);
  if (!rows.length){ el('#list').innerHTML = '<p class="empty">Nothing matches that.</p>'; return; }
  let out = '', day = '';
  for (const c of rows){
    if (c.day !== day){
      day = c.day;
      out += '<div class="daygroup">' +
        new Date(day + 'T12:00:00').toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'}) +
        '</div>';
    }
    const s = S(c);
    out += '<button class="row' + (s.d ? ' d-' + s.d : '') + '" data-id="' + c.id + '"' +
             ' aria-current="' + (current === c.id) + '">' +
             '<span class="row-top">' +
               '<span class="who ' + (c.human ? 'h' : 'b') + '"><span class="dot"></span><span class="t">' +
                 (c.channel === 'email' ? esc(c.from || 'Email') : c.human ? 'Human' : 'AI only') +
               '</span></span>' +
               '<span class="time mono">' + c.date.slice(11) + '</span>' +
             '</span>' +
             '<span class="row-q">' + esc(c.vtitle || c.q) + '</span>' +
             '<span class="row-tags">' + tags(c) + '</span>' +
           '</button>';
  }
  el('#list').innerHTML = out;
}

function renderRollup(){
  const keys = META.categories.map(x => x[0]);
  const agg = {};
  for (const k of keys) agg[k] = {n:0, kb:0, dig:0, ok:0, product:0, todo:0};
  for (const c of DATA){
    const s = S(c), a = agg[s.cat] || (agg[s.cat] = {n:0, kb:0, dig:0, ok:0, product:0, todo:0});
    a.n++; if (s.d) a[s.d]++; else a.todo++;
  }
  const rows = keys.filter(k => agg[k].n).sort((a, b) => agg[b].n - agg[a].n);
  const cell = v => v ? String(v) : '<span class="z">·</span>';
  let h = '<table class="rt"><thead><tr><th>Category</th><th>All</th><th>KB</th><th>Dig</th><th>Fine</th><th>Left</th></tr></thead><tbody>';
  for (const k of rows){
    const a = agg[k];
    h += '<tr><td><button data-cat="' + k + '">' + esc(CATLBL[k] || k) + '</button></td>' +
         '<td>' + a.n + '</td><td>' + cell(a.kb) + '</td><td>' + cell(a.dig) + '</td>' +
         '<td>' + cell(a.ok) + '</td><td>' + cell(a.todo) + '</td></tr>';
  }
  const t = rows.reduce((o, k) => { const a = agg[k];
    return {n:o.n+a.n, kb:o.kb+a.kb, dig:o.dig+a.dig, ok:o.ok+a.ok, todo:o.todo+a.todo}; },
    {n:0, kb:0, dig:0, ok:0, todo:0});
  h += '<tr class="tot"><td>All</td><td>' + t.n + '</td><td>' + t.kb + '</td><td>' + t.dig +
       '</td><td>' + t.ok + '</td><td>' + t.todo + '</td></tr></tbody></table>';
  el('#rollup').innerHTML = h;
}

const VKEY = {gap:'Claude reads this as a KB gap', verify:'Claude cannot confirm this',
              check:'Claude wants to read the article first', product:'Claude reads this as a product issue',
              client:'Claude reads this as one client only', noise:'Claude reads this as noise'};

function renderDetail(){
  const c = byId(current);
  if (!c){
    el('#detail').innerHTML = '<div class="placeholder"><p class="big">Pick a conversation, or hit “Next undecided”.</p>' +
      '<p>' + DATA.length + ' this week. Decide each one, add a note where you want Claude to act, ' +
      'then hand the lot back with the button in the header.</p></div>';
    return;
  }
  const s = S(c);
  let h = '<div class="dhead"><h2>' + esc(c.vtitle || c.q.slice(0, 140)) + '</h2><div class="meta">' +
    '<button class="idcopy mono" id="idcopy" title="Copy the conversation id">' + c.id + '</button>' +
    '<span class="mono">' + c.date + '</span>' +
    (c.channel === 'email'
      ? '<span>Email from <b>' + esc(c.from) + '</b></span>'
      : '<span>Answered by <b>' + (c.human ? 'a human' : 'the AI alone') + '</b></span>' +
        '<span>Resolution <b>' + esc(c.resolution) + '</b></span>') +
    (c.reask ? '<span>Client wrote back <b>' + c.reask + '&times;</b> after the AI</span>' : '') +
    (c.rating != null ? '<span>Rated <b>' + c.rating + '</b></span>' : '') +
    '</div></div>';

  h += '<div class="triage"><div>' +
       '<div class="tlabel">Decision</div><div class="decs">' +
       META.decisions.map(([k, label, hint]) =>
         '<button class="dec-btn" data-d="' + k + '" aria-pressed="' + (s.d === k) + '">' +
         label + '<small>' + esc(hint) + '</small></button>').join('') +
       '</div></div>' +
       '<div class="trow"><div><div class="tlabel">Category</div>' +
       '<select class="sel" id="catset">' + META.categories.map(([k, label]) =>
         '<option value="' + k + '"' + (s.cat === k ? ' selected' : '') + '>' + esc(label) + '</option>').join('') +
       '</select></div></div>' +
       '<div><div class="tlabel">Note to Claude</div>' +
       '<textarea class="note" id="noteset" placeholder="What you want done with this one. Screenshots go in the chat — quote the id above.">' +
       esc(s.note) + '</textarea></div></div>';

  if (c.verdict){
    h += '<div class="claudread v-' + c.verdict + '"><div class="vk">' + (VKEY[c.verdict] || c.verdict) + '</div>' +
         (c.vtitle ? '<div class="vt">' + esc(c.vtitle) + '</div>' : '') +
         '<p>' + esc(c.vnote) + '</p></div>';
  }

  h += '<div class="thread">';
  for (const t of c.turns){
    if (!t.text && !t.cited.length) continue;
    const role = t.role === 'customer' ? 'customer' : (t.role === 'human' ? 'human' : 'bot');
    const lbl = role === 'customer' ? esc(t.who || 'Client')
              : role === 'human' ? esc(t.who || 'Zooza') : 'AI';
    h += '<div class="turn t-' + role + '"><div class="lbl">' + lbl + '</div><div class="bubble">' + esc(t.text);
    if (t.cited.length){
      h += '<div class="cited"><b>Cited</b>' + t.cited.map(x =>
             '<div class="' + (MARKETING.test(x) ? 'm' : '') + '">' + esc(x) + '</div>').join('') + '</div>';
    }
    h += '</div></div>';
  }
  el('#detail').innerHTML = h + '</div>';
}

function renderAll(){ renderChips(); renderProgress(); renderList(); renderRollup(); renderDetail(); }

/* ---------- handoff ---------- */
function handoff(){
  const order = ['kb', 'dig', 'product', 'ok'];
  const head = {kb:'Into the KB', dig:'Dig into it first', product:'Product, not KB', ok:'Fine as answered'};
  let out = '# Weekly review — ' + META.start + ' to ' + META.end + '\n';
  const left = DATA.filter(c => !S(c).d).length;
  out += '\n' + (DATA.length - left) + ' of ' + DATA.length + ' decided' +
         (left ? ', ' + left + ' still open' : '') + '.\n';
  for (const d of order){
    const rows = DATA.filter(c => S(c).d === d);
    if (!rows.length) continue;
    out += '\n## ' + head[d] + ' (' + rows.length + ')\n\n';
    for (const c of rows){
      const s = S(c);
      if (d === 'ok' && !s.note){ out += '- ' + c.id + ' — ' + (c.vtitle || c.q.slice(0, 70)) + '\n'; continue; }
      out += '- **' + c.id + '** [' + (CATLBL[s.cat] || s.cat) + '] ' + (c.vtitle || c.q.slice(0, 90)) + '\n';
      if (s.note) out += '  - Michal: ' + s.note.replace(/\n+/g, ' ') + '\n';
    }
  }
  const undec = DATA.filter(c => !S(c).d);
  if (undec.length){
    out += '\n## Not decided yet (' + undec.length + ')\n\n';
    for (const c of undec) out += '- ' + c.id + ' — ' + (c.vtitle || c.q.slice(0, 70)) + '\n';
  }
  el('#hout').value = out;
  el('#hdlg').showModal();
}

/* ---------- events ---------- */
el('#chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  filter = b.dataset.f; renderChips(); renderList();
});
el('#catfilter').addEventListener('change', e => { catf = e.target.value; renderList(); });
el('#q').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); renderList(); });
el('#list').addEventListener('click', e => {
  const b = e.target.closest('.row'); if (!b) return;
  current = b.dataset.id; renderList(); renderDetail();
  el('#detail').scrollIntoView({block:'nearest'});
});
el('#rollup').addEventListener('click', e => {
  const b = e.target.closest('button[data-cat]'); if (!b) return;
  catf = b.dataset.cat; el('#catfilter').value = catf; filter = 'all'; renderChips(); renderList();
});
el('#detail').addEventListener('click', e => {
  const d = e.target.closest('.dec-btn');
  if (d){
    const c = byId(current), s = S(c);
    s.d = (s.d === d.dataset.d) ? '' : d.dataset.d;
    touch(); renderProgress(); renderList(); renderRollup(); renderDetail(); return;
  }
  if (e.target.closest('#idcopy')){
    navigator.clipboard?.writeText(current);
    const b = e.target.closest('#idcopy'); const t = b.textContent;
    b.textContent = 'copied'; setTimeout(() => { b.textContent = t; }, 900);
  }
});
el('#detail').addEventListener('change', e => {
  if (e.target.id === 'catset'){ S(byId(current)).cat = e.target.value; touch(); renderList(); renderRollup(); }
  if (e.target.id === 'noteset'){ renderList(); }
});
el('#detail').addEventListener('input', e => {
  if (e.target.id === 'noteset'){ S(byId(current)).note = e.target.value; touch(); }
});
el('#undecided').addEventListener('click', () => {
  const start = DATA.findIndex(c => c.id === current);
  for (let i = 1; i <= DATA.length; i++){
    const c = DATA[(start + i + DATA.length) % DATA.length];
    if (!S(c).d){ current = c.id; filter = 'todo'; renderAll(); el('#detail').scrollIntoView({block:'nearest'}); return; }
  }
  setSave('All decided', 'on');
});
el('#handoff').addEventListener('click', handoff);
el('#hclose').addEventListener('click', () => el('#hdlg').close());
el('#hcopy').addEventListener('click', async () => {
  const t = el('#hout'); t.select();
  try { await navigator.clipboard.writeText(t.value); el('#hcopy').textContent = 'Copied'; }
  catch(e) { document.execCommand('copy'); el('#hcopy').textContent = 'Copied'; }
  setTimeout(() => { el('#hcopy').textContent = 'Copy'; }, 1200);
});
window.addEventListener('beforeunload', e => { if (dirty){ commit(); e.preventDefault(); e.returnValue = ''; } });

/* ---------- boot ---------- */
el('#rng').textContent = META.start + ' – ' + META.end;
el('#catfilter').innerHTML = '<option value="">Every category</option>' +
  META.categories.map(([k, l]) => '<option value="' + k + '">' + esc(l) + '</option>').join('');
el('#cites').innerHTML = META.topCited.map(([s, n]) =>
  '<li><span class="n mono">' + n + '</span><span class="' + (MARKETING.test(s) ? 'm' : '') + '">' +
