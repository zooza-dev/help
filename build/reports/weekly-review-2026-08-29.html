 []}, {"role": "customer", "who": "Michal Kiss", "text": "v minulosti ked som vypol v online registracii blok, tak mi nezorazoalo ani v rozvrhu ani v prihlas formualri", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ako vravim, su to dve odlisne veci. Online registracia na urovni bloku zapne alebo vypne ten dany blok pre online registraciu ale iba v pripade ak sa clovek registruje do blokov. V pripade ak sa registruje do celej skupiny tak sa na bloky nehladi. V pripade skusobnych hodin ide o iny prepinac, ktory s blokmi nepracuje. Cize ak chcete kombinovat v jednej skupine bloky, ktore maju online registraciu povolenu a zaroven bloky, ktore ju povolenu nemaju, museli by sme podporu pre takyto setup dorobit. Teda aby sa skusobne hodiny ponukali iba v blokoch, ktore su povolene na online registraciu. Zaroven ale treba povedat, ze jeden termin moze byt aj v dvoch blokoch, kde moze nastat konflikt ze ten isty termin bude zaroven v bloku, kde su povolene online registracie a zaroven v bloku, kde nebudu povolene online registracie", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Ak chcete, mozeme aplikaciu takto upravit, respektive dorobili by sme prepinac na skusobne hodiny aj do blokov.", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "Dobrý deň,\nno ak by sa to dalo doprogramovat tak by to bolo super , zatial som to yvriesil tak že som musel tie bloky zmazať a nasledne ich budem musiet vytvorit nanovo", "cited": []}, {"role": "customer", "who": "Michal Kiss", "text": "aby to bolo tak ze ked je online registracia vypnuta. tak je vypnuta pre vsetko a nezobrazuje sa v rovrhu ani v ponuke", "cited": []}, {"role": "human", "who": "Tech Support", "text": "https://zooza.atlassian.net/browse/ZOOZA-4908", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Michal, dorobili sme do aplikacie moznost zapnut/vypnut skusobne hodiny per blok. Nastavuje sa to na tom istom mieste ako online registracia. Vyskusajte prosim ci to vyriesilo povodny problem a pripadne dajte vediet. Dakujem.", "cited": []}], "verdict": "gap", "vtitle": "Blocks do not control trial availability", "vnote": "Human answer: blocks only affect registration into blocks. If a class is offered for trials, every session in it is offered for trials. To stop trials for one class, remove that class from the trial offering. Both statements can be true at once.", "cat": "trials"}, {"channel": "intercom", "id": "215475648622343", "date": "2026-08-26 07:37", "day": "2026-08-26", "human": true, "bucket": "HUMAN", "reask": 0, "resolution": "—", "rating": null, "sources": [], "q": "(no client message)", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Vážený Michal,\n\n\nváš tiket byl přijat. Asistent Zooza se vám pokusí ihned pomoci — a člen našeho týmu jej také osobně zkontroluje.\n\n\n— Podpora Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Michal, nie je potrebne faktury mazat a popravde ani na to nemame v appke proces. Staci ak vojdete do nastavenia fakturacneho profilu a tam si viete nastavit poradove cislo alebo ciselny rad faktury. Zaroven si tam viete prednastavit aj dalsie uzitocne veci ako napriklad preddefinovat text na fakture pouzitim dynamickych znaciek ako pri emailoch.", "cited": []}], "verdict": "gap", "vtitle": "Invoice numbering — set the series, do not delete invoices", "vnote": "Human answer: there is no delete-invoice process and none is needed. Set the next number / number series in the invoice profile, where you can also predefine invoice text using dynamic tags.", "cat": "payments"}, {"channel": "intercom", "id": "215475648070238", "date": "2026-08-26 05:03", "day": "2026-08-26", "human": false, "bucket": "D_assumed_with_kb", "reask": 4, "resolution": "assumed_resolution", "rating": null, "sources": ["Pay-as-you-go FAQ | Zooza Help", "Common Booking Scenarios | Zooza Help", "Registration and Booking FAQ | Zooza Help", "Automatic payment reminders | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Booking FAQ | Zooza Help", "Automatically cancel unpaid registrations | Zooza Help"], "q": "can I prevent a booking being made without payment?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "can I prevent a booking being made without payment?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "No — a booking cannot be blocked if payment is not made. The system always creates the booking even if the client skips payment, so the lead is still captured. \n\n\nInstead, the usual approach is:\n\n\n\n\n- Set a grace period for payment.\n\n- Send payment reminders during that time.\n\n- Enable auto‑cancel unpaid registrations, so bookings that remain unpaid are automatically removed after the configured number of days. \n\n\nThis way you still capture the parent, but unpaid bookings do not stay in the system.\n\n\nIf you want, I can also show you how to configure the auto‑cancel and reminder settings.", "cited": ["Payments and Billing FAQ | Zooza Help", "Automatically cancel unpaid registrations | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "can I prevent a child being registered more than once in the same class / programme?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — for the same session, the system blocks duplicate registrations automatically. A child can only be registered once for that specific session. \n\n\nHowever, this protection does not apply to the whole class or programme. A parent can still create another booking for the same class if they start a new registration. The system will show a warning that a booking already exists, but the parent can still continue and create a second one. \n\n\nSo in short:\n\n\n\n\n- Same session → blocked automatically\n\n- Same class/programme → not fully preventable\n\nIf you want, I can also share a couple of practical ways to reduce duplicate registrations in practice.", "cited": ["Pay-as-you-go FAQ | Zooza Help", "Booking FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "In our Friday Club programme we have 4 bookings from the same siblings, 1 paid, 1 unpaid - how can I prevent this or quickly delete the booking that reminds unpaid?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can’t prevent this completely. When a parent starts a booking but skips payment, the system still creates the booking so the lead is captured. They can then start another registration and confirm the duplicate. \n\n\nQuick way to remove the unpaid one:\n\n\n\n\n- Go to Bookings\n\n\n- Open the unpaid duplicate\n\n- Change the booking status to Deleted\nThis fully removes it (you can still see it later under the Deleted bookings filter). \n\n\nTip: always check the child’s name and date of birth to confirm it’s a duplicate before deleting. \n\n\nIf you want fewer manual cleanups, you can also enable auto‑cancel unpaid registrations in the programme’s payment reminder settings so unpaid bookings are removed automatically after the grace period.", "cited": ["Registration and Booking FAQ | Zooza Help", "Booking FAQ | Zooza Help", "Common Booking Scenarios | Zooza Help", "Automatic payment reminders | Zooza Help", "Automatically cancel unpaid registrations | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "If you want fewer manual cleanups, you can also enable auto‑cancel unpaid registrations in the programme’s payment reminder settings so unpaid bookings are removed automatically after the grace period. \nHow to do this?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can enable this in the programme’s payment settings.\n\n\nSteps:\n\n\n\n\n- Open the Friday Club programme\n\n\n- Go to Settings\n\n\n- In the Price and Payment tile, click Edit\n\n\n- Scroll to Payment Reminder Settings and click Change\n\n\n- Set:\n• Cancel after N days unpaid (how long a booking can stay unpaid)\n• Cancellation lead time (days) (when the client is notified before cancellation)\n\n- Save. \n\n\nAfter that, any new unpaid registrations will be scheduled for automatic cancellation if payment is not received.\n\n\nTip: this only applies to registrations created after you enable it, so existing unpaid bookings will still need manual cleanup.", "cited": ["Automatically cancel unpaid registrations | Zooza Help", "Payments and Billing FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help configuring automatic cancellation for unpaid registrations, I’m here to assist. Would you like to share what you see in the programme’s payment settings so we can continue?", "cited": []}], "verdict": "gap", "vtitle": "Preventing a booking without payment", "vnote": "Auto-cancel of unpaid bookings and awaiting-payment grace shipped in May 2026. Confirm the current controls before writing.", "cat": "bookings"}, {"channel": "intercom", "id": "215475642840001", "date": "2026-08-25 19:59", "day": "2026-08-25", "human": true, "bucket": "HUMAN", "reask": 4, "resolution": "assumed_resolution", "rating": null, "sources": ["Jak automatizovat vaše podnikání v oblasti dětských aktivit (aniž byste ztratili osobní kontakt) — Zooza", "Zooza PRO - Zooza"], "q": "Potrebujem poradiť jeden lektor u nás skončil a ja ho chcem vymazať ale neviem ako", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": "Barbora Kubíková", "text": "Potrebujem poradiť jeden lektor u nás skončil a ja ho chcem vymazať ale neviem ako", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "V našem systému máte nástroje pro správu týmu a lektorů, včetně jejich profilů a přístupů. Lektoři také vidí svůj rozvrh přímo ve svém profilu, takže jejich profil je místo, kde se jejich údaje spravují. Konkrétní postup „vymazání“ lektora ale v těchto podkladech popsán není.\n\n\nNa jaké stránce v aplikaci jste, když se snažíte lektora odstranit?", "cited": ["Zooza PRO - Zooza", "Jak automatizovat vaše podnikání v oblasti dětských aktivit (aniž byste ztratili osobní kontakt) — Zooza"]}, {"role": "bot", "who": "Zooza Support", "text": "Hledali jste tohle?", "cited": []}, {"role": "customer", "who": "Barbora Kubíková", "text": "Na lektori profil tohto lektora", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "V našem systému máme nástroje pro správu týmu a lektorů, včetně jejich profilů a přístupů.  Lektoři také vidí svůj rozvrh přímo ve svém profilu, takže profil je místo, kde se jejich údaje spravují.  Konkrétní postup „vymazání“ lektora ale v těchto podkladech popsán není.\n\n\nMůžete prosím popsat, co přesně na stránce lektorského profilu vidíte, když ho chcete odstranit, a jestli tam máte nějaké tlačítko nebo volbu pro smazání nebo odebrání přístupu?", "cited": ["Zooza PRO - Zooza", "Jak automatizovat vaše podnikání v oblasti dětských aktivit (aniž byste ztratili osobní kontakt) — Zooza"]}, {"role": "bot", "who": "Zooza Support", "text": "Dostali jste odpověď na svou otázku?", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, vymazat alebo zmenit pristup mozete v Nastaveniach > Vseobecne > Pristupy https://zooza.app/#settings/team\n\n\nMôžete mu zmeniť rolu, alebo ho jednoducho odstrániť. Prípadne mu zmeniť email, čim mu zamedzite prístup. Podľa toho, ako s jeho dátami chcete pracovať nadalej.", "cited": []}, {"role": "customer", "who": "Barbora Kubíková", "text": "Nechcem aby sa vedela dostať k údajom o deťoch ani ku svojím starým kurzom a nevedela sa prihlásiť do Zooza", "cited": []}, {"role": "customer", "who": "Barbora Kubíková", "text": "už som našla ďakujem", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Super, dakujem za potvrdenie. Pekný večer", "cited": []}], "verdict": "check", "vtitle": "Removing an instructor", "vnote": "Human answer: Settings -> General -> Access, then change the role, remove them, or change their email. Two bot-only clients asked the same thing and re-asked 7x and 3x, so whatever the KB says today is not landing. Read User roles before writing.", "cat": "team"}, {"channel": "intercom", "id": "215475631423691", "date": "2026-08-25 19:43", "day": "2026-08-25", "human": true, "bucket": "HUMAN", "reask": 2, "resolution": "assumed_resolution", "rating": null, "sources": ["Zooza 101 for Instructors | Zooza Help", "Client Profile FAQ | Zooza Help", "Email Delivery Troubleshooting | Zooza Help", "Instructor Access and Roles FAQ | Zooza Help", "Add instructors and manage their access | Zooza Help"], "q": "Help logging in teachers, they are not receiving their email", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "Help logging in teachers, they are not receiving their email", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "This usually happens for a few simple reasons. Try these first:\n\n\n\n\n- \nCheck the email address in Settings → Team to make sure it’s spelled correctly. \n\n\n- Ask the teacher to check their spam/junk folder.\n\n- They can also request a login link themselves: go to your Zooza app URL, enter their email, and a login link will be sent. No invitation is required. \n\n\nInstructors don’t use passwords — they just enter their email and click the login link sent to them. \n\n\nIf you want, I can also show you a quick way to resend the login link from the instructor settings.", "cited": ["Add instructors and manage their access | Zooza Help", "Instructor Access and Roles FAQ | Zooza Help", "Zooza 101 for Instructors | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "we have tried that", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Got it — thanks for confirming you already tried the basics.\n\n\nA couple of things are still worth checking:\n\n\n\n\n- If the teachers use corporate or Outlook emails, their provider may delay or block the login email. Ask them to check spam/junk and whitelist @zooza.app. \n\n\n- They can also go directly to your Zooza app URL and enter their email on the login page to request a new login link — no invitation is required. \n\n\nIf it still doesn’t arrive, the next useful check is whether the email provider is filtering or blocking it. \n\n\nQuick question: are the teachers using work/corporate email addresses (like company Outlook or Exchange)?", "cited": ["Instructor Access and Roles FAQ | Zooza Help", "Add instructors and manage their access | Zooza Help", "Client Profile FAQ | Zooza Help", "Email Delivery Troubleshooting | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help with the teachers’ login emails, I’m here to continue troubleshooting. Would you like to share whether they use corporate email addresses or provide more details about what happens?", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Anna, I saw you mentioned that some teachers are not receiving the login email.\n\n\nCan you please check that they are trying to log in with the same email address that is listed for them in the access/settings section, and that they are using this link: https://asia.zooza.app\n\n\nIf it still does not work, please send me the teacher names and the email addresses they are trying to use, and we’ll check the logs from our side.\n\n\nThank you.", "cited": []}], "verdict": "gap", "vtitle": "Instructors not receiving the login email — check the email and the regional URL", "vnote": "Human answer: the email must match the one in Access settings, and the instructor must use their region's login URL (asia.zooza.app in this case). Regional login URLs are not documented anywhere.", "cat": "team"}, {"channel": "intercom", "id": "215475635200525", "date": "2026-08-25 16:58", "day": "2026-08-25", "human": false, "bucket": "D_assumed_with_kb", "reask": 21, "resolution": "assumed_resolution", "rating": null, "sources": ["Error handling | Zooza Developer Docs", "Registration and Booking FAQ | Zooza Help", "Stripe Integration FAQ | Zooza Help", "Login and Account FAQ | Zooza Help", "Onboarding and Launch FAQ | Zooza Help", "Role Selection Guide | Zooza Help", "Products | Zooza Help", "Zooza Sites | Zooza Help", "Booking Widget FAQ | Zooza Help", "Booking FAQ | Zooza Help", "Widget Embedding Troubleshooting | Zooza Help", "Integrations | Zooza Help", "Settings | Zooza Help", "Set up how Zooza collects money from clients | Zooza Help", "Change the language in Zooza | Zooza Help", "Add instructors and manage their access | Zooza Help", "Setup guide | Zooza Help"], "q": "is there a zooza link that has all of our programmes on?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "is there a zooza link that has all of our programmes on?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes. You can share one link that shows all of your programmes and classes.\n\n\nUse this page:\n\n\n\n\n- yourbrand.zooza.online/booking/\n\nClients who open this link will see the full list of available classes and can choose which one to book. You can send it by email, WhatsApp, or place it on your website. \n\n\nYou can also create links for a single programme or even a specific class if you want to guide people to a particular option.\n\n\nIf you want, I can also show you how to add this booking page to your Squarespace site so parents can book directly from your website.", "cited": ["Registration and Booking FAQ | Zooza Help", "Onboarding and Launch FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "thats not working", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Got it — let’s narrow it down.\n\n\nThe correct link format is:\n\n\nyourbrand.zooza.online/booking/\n\n\nThis page shows the full list of available classes for clients to book. \n\n\nIf it’s not working, the most common reason is that the programmes are not visible yet. A programme only appears if both of these are enabled:\n\n\n\n\n- Allow online booking\n\n- Display in catalogue\n\nYou can check this in Programmes → open the programme → Edit Settings → Online Booking.\n\n\nQuick question so I can guide you better:\n\n\nWhat exactly happens when you open the link — blank page, error message, or no programmes showing?", "cited": ["Registration and Booking FAQ | Zooza Help", "Booking FAQ | Zooza Help"]}, {"role": "customer", "who": "Samuel Davis", "text": "am i called elizabethsamuels?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "No — I’m not able to see your account details, so I can’t confirm what name you’re registered under.\n\n\nIf you want to check it yourself, you can look in Settings → Team and open your profile. The email shown there is the one used to log in. \n\n\nIf you meant something different (for example the name shown to clients on the booking page), let me know and I can guide you to the right place.\n\n\n\nSource:\nLogin and Account FAQ | Zooza Help", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "yourbrand.zooza.online/booking/\n\n\n\nwould ours be elizabethsamuels.zooza.online/booking?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — that’s exactly right.\n\n\nIf your brand name is elizabethsamuels, your full booking page would be:\n\n\n\n\n- elizabethsamuels.zooza.online/booking/\n\nThis page shows the full list of available classes so clients can choose and book. You can share it by email, WhatsApp, or on your website. \n\n\nIf you want, I can also show you how to add this booking page directly to your Squarespace site so parents can book from your website.", "cited": ["Registration and Booking FAQ | Zooza Help", "Onboarding and Launch FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "it says Not Found\nThe requested URL was not found on this server.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "That error usually means the base URL is wrong.\n\n\nThe correct main page is:\n\n\n\n\n- elizabethsamuels.zooza.online\n\nThe full list of classes is then:\n\n\n\n\n- \nelizabethsamuels.zooza.online/booking/ \n\n\nSo the key difference is:\n\n\n\n\n- \nzooza.online → correct\n\n- \nzooza.online → will return “Not Found”\n\n\nQuick check: open elizabethsamuels.zooza.online first. If that loads, then add /booking/ at the end. \n\n\nIf you want, I can also show you a quick way to test the link in an incognito window to rule out browser cache issues.", "cited": ["Registration and Booking FAQ | Zooza Help", "Booking FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "still not working", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thanks for checking that. The correct public booking page is:\n\n\n\n\n- elizabethsamuels.zooza.online\n\n- Full class list: elizabethsamuels.zooza.online/booking/ \n\n\nIf you’re still seeing “Not Found”, the quickest way to narrow it down is to check a couple of things.\n\n\nCould you share:\n\n\n\n\n- a screenshot of the error page\n\n- whether the base page elizabethsamuels.zooza.online loads or also shows “Not Found”\n\nOne quick check you can do now: open the link in an incognito/private browser window to rule out cached pages. \n\n\nOnce I know whether the base page loads or not, I can guide you to the most likely cause.", "cited": ["Registration and Booking FAQ | Zooza Help", "Booking FAQ | Zooza Help", "Widget Embedding Troubleshooting | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "what does it mean zooza.site under widgets?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Good question — this is a different option from the /booking/ page.\n\n\nzooza.site is a hosted mini‑website we provide if you don’t want to build your own site.\n\n\n\n\n- You can have a full site like: yourcompany.zooza.site\n\n\n- It includes pages for your programmes, booking forms, and client areas\n\n- Everything is managed inside Zooza, so you don’t need to add code or embed widgets\n\nIt’s basically a ready-made website “under our roof” where your programmes are already connected. \n\n\nSo in short:\n\n\n\n\n- \n/booking/ → a simple booking page you can link to\n\n- \nzooza.site → a full hosted website for your business\n\nIf you want, I can also explain when it’s better to use the /booking/ page vs a zooza.site.", "cited": ["Zooza Sites | Zooza Help", "Setup guide | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "i already have it embedded on our website but i also just want 1 link which shows all programmes?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — you can use one single link that shows all programmes.\n\n\nThe link is:\n\n\n\n\n- elizabethsamuels.zooza.online/booking/\n\nThis page displays the full list of available classes, and clients can choose which programme they want to book. You can share it by email, WhatsApp, or on your website. \n\n\nSo even if you already have the booking widget embedded on your Squarespace site, you can still send this one link to parents whenever you want them to see everything in one place. \n\n\nIf you want, I can also show you a simple way to add a “Book a class” button on your Squarespace site that points to this same link.", "cited": ["Registration and Booking FAQ | Zooza Help", "Booking FAQ | Zooza Help", "Onboarding and Launch FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thanks for the screenshot — that helps a lot.\n\n\nThe 404 Not Found error means the page at that URL does not exist on the server. In other words, the browser reached the domain, but the specific page requested cannot be found. \n\n\nFor the full programme list, the correct link is:\n\n\n\n\n- elizabethsamuels.zooza.online/booking/\n\n- \nImportant: it must include the trailing slash / at the end. \n\n\nYour screenshot shows:\n\n\nelizabethsamuels.zooza.online/booking\n\n\n(without the final /)\n\n\nQuick check:\n\n\nPlease try opening this exact link:\n\n\nelizabethsamuels.zooza.online/booking/\n\n\nIf it still shows 404, the next helpful step would be to confirm whether the base page elizabethsamuels.zooza.online loads correctly. That will help narrow down what’s happening.", "cited": ["Booking FAQ | Zooza Help", "Error handling | Zooza Developer Docs"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that resolve it?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thanks for the screenshots — they’re very helpful.\n\n\nA 404 Not Found means the page requested does not exist on the server. The browser reached the domain, but the specific page cannot be found. \n\n\nNormally, the full programme list is available at:\n\n\n\n\n- \nyourbrand.zooza.online/booking/ \n\n\nSince both the base page and the /booking/ page return 404, this usually means the public booking page for that brand URL is not currently available.\n\n\nOne quick check that will help narrow it down:\n\n\n\n\n- When you open elizabethsamuels.zooza.online in your browser, do you see the same 404 page as in your screenshot?\n\nThat will confirm whether the base page itself is missing or only the /booking/ path is failing.", "cited": ["Booking FAQ | Zooza Help", "Error handling | Zooza Developer Docs"]}, {"role": "customer", "who": "Samuel Davis", "text": "yes", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thanks for confirming and for the screenshots — that helps a lot.\n\n\nIf both elizabethsamuels.zooza.online and elizabethsamuels.zooza.online/booking/ return 404 Not Found, it usually means the public page for that brand URL is not currently available on the server. A 404 means the browser reached the domain, but the requested page does not exist. \n\n\nSince you are already using the booking widget on your Squarespace site, the good news is that the widget can still work even if the public /booking/ page is not accessible.\n\n\nOne quick check that may help narrow it down:\n\n\n\n\n- When you open the page where the booking widget is embedded on your Squarespace site, does the booking form load correctly?\n\nIf you can, please share the URL of the Squarespace page where the widget is embedded. That will help determine whether the issue is only with the public /booking/ page or with the widget itself.\n\n\n\nSource:\nWidget Embedding Troubleshooting | Zooza Help", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "https://www.elizabethsamuelsdrama.it/ris", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thanks for sharing the screenshots — they’re very helpful.\n\n\nA 404 Not Found means the browser reached the domain, but the requested page does not exist on the server. \n\n\nSince both:\n\n\n\n\n- elizabethsamuels.zooza.online\n\n- elizabethsamuels.zooza.online/booking/\n\nreturn 404, it usually means the public page for that brand URL is not currently available.\n\n\nThe good news: your booking widget on your Squarespace site can still work independently from that public page. The widget loads directly from the embed code on your website. \n\n\nOne quick check that will help narrow it down:\n\n\n\n\n- When you open the Squarespace page where the widget is embedded, does the booking form load correctly?\n\n\nIf you can, please also share the URL of the Squarespace page where the widget is embedded. That will help determine whether the issue is only with the public /booking/ page or with the widget itself.", "cited": ["Widget Embedding Troubleshooting | Zooza Help", "Error handling | Zooza Developer Docs"]}, {"role": "customer", "who": "Samuel Davis", "text": "this is the squarespace website page where the zooza widget is embedded: https://www.elizabethsamuelsdrama.it/ris", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Thanks for sharing the screenshots — they’re very helpful.\n\n\nThe key point is this: the 404 on elizabethsamuels.zooza.online does not affect your Squarespace widget. The widget loads directly from the embed code on your website, not from that public page. \n\n\nSo the important check is the Squarespace page where the widget is embedded.\n\n\nOne quick thing to verify:\n\n\n\n\n- When you open that Squarespace page, does the booking form appear, or is the area blank?\n\nIf it’s blank, the most common cause is a cookie consent banner blocking the Zooza script. In that case, the widget scripts ne role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help comparing Stripe via Zooza and Stripe Connect, I’m here to assist. Would you like to share more about your payment setup or what you’re trying to decide?", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "I've changed the account to italian so its default italian for our italian customers but i'd like the backend zooza.app which we use to be in english, is this possible?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — this is possible. Zooza has two separate language settings, and they work independently. \n\n\n\n\n- \nAdmin panel language → the language you see in the backend (menus, buttons, labels).\n\n- \nApplication Communication Language → the language your clients see (booking widget, emails, client portal).\n\nSo you can keep:\n\n\n\n\n- \nAdmin panel: English\n\n- \nClient communication: Italian\n\nTo change the admin language:\n\n\n\n\n- Click your profile icon in the top‑right of the admin panel\n\n- Open Account settings\n\n\n- Set Language to English and save. \n\n\nThis only affects your view. Your Italian customers will still receive Italian emails and see the Italian booking interface.\n\n\nIf you want, I can also show a simple way to support both English and Italian clients without changing your admin language.", "cited": ["Change the language in Zooza | Zooza Help", "Login and Account FAQ | Zooza Help", "Settings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "Application Communication Language: should be english just for me?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "No — Application Communication Language is not for you. It controls the language your clients see. \n\n\nThat setting affects:\n\n\n\n\n- Booking confirmation emails\n\n- Payment reminders\n\n- Client portal texts\n\n- System messages sent to clients \n\n\nSo if you want your Italian customers to receive Italian emails and messages, you should leave it set to Italian.\n\n\nYour own admin interface language is separate and can stay in English. The two settings work independently.\n\n\nOne small note: if your booking widget is embedded on your Squarespace site, the widget language usually follows the language of the website page it sits on.", "cited": ["Settings | Zooza Help", "Change the language in Zooza | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Does this clarify things?", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "how do i change it to italian just for customers?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You just need to change the Application Communication Language setting.\n\n\nSteps:\n\n\n\n\n- Go to Settings\n\n\n- Open Company information (or General settings)\n\n- Find Application Communication Language\n\n\n- Select Italian\n\n\n- Save\n\nThis setting controls the language your clients see, including:\n\n\n\n\n- booking confirmation emails\n\n- payment reminders\n\n- client portal texts\n\n- system messages sent to customers. \n\n\nYour admin panel can stay in English — the two settings are completely separate.\n\n\nOne small note: if your booking widget is embedded on your Squarespace site, the widget language usually follows the language of the website page it sits on.", "cited": ["Settings | Zooza Help", "Change the language in Zooza | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "and i'll still be able to see english?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — you will still see the admin panel in English.\n\n\nThe Application Communication Language only controls what your clients see (emails, booking widget, client portal). It does not change your admin interface. \n\n\nYour own view is controlled separately by the admin panel language, which you can set to English in your account settings. Each admin can choose their own language independently. \n\n\nSo in your case:\n\n\n\n\n- Customers → Italian emails and client texts\n\n- You (admin) → English interface\n\nPerfect setup 👍", "cited": ["Change the language in Zooza | Zooza Help", "Login and Account FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — your setup in the screenshots is correct.\n\n\n\n\n- \nSettings → General → Application Communication Language = Italiano\n→ This controls what your clients see (emails, booking widget, client portal). \n\n\n- \nMy profile → Language = English\n→ This controls what you see in the admin interface. \n\n\nSo the result is exactly what you want:\n\n\n\n\n- Customers → Italian emails and client texts\n\n- You (admin) → English backend\n\nThe two settings are completely independent, so changing one does not affect the other.\n\n\nOne small note: if your booking widget is embedded on your Squarespace site, the widget language usually follows the language of the website page it sits on.", "cited": ["Settings | Zooza Help", "Change the language in Zooza | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help with your language settings, I’m here to assist. Would you like to share more about anything you’re still trying to configure?", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "when connecting my own stripe account, it wont let me change the country to the UK", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "What you’re seeing is expected. The Business location field is part of the Stripe onboarding flow, not a setting inside our app. When you connect Stripe, you are redirected to Stripe’s own setup page where you create and manage your Stripe account. \n\n\nBecause of that, the country is controlled by Stripe during onboarding. If the page is locked to Italy, it means the Stripe account you are creating is being registered under an Italian entity, so the country cannot be changed on that screen.\n\n\nIf you want a UK Stripe account, you would need to start the Stripe onboarding with a UK business location instead.\n\n\nOnce connected, you manage the account directly in your Stripe dashboard at https://dashboard.stripe.com.\n\n\nIf you want, I can also explain the easiest way to reconnect Stripe and start the onboarding again from the Settings → Integrations → Stripe Connect page.", "cited": ["Stripe Integration FAQ | Zooza Help", "Integrations | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "how do i change my email address which i use to login to zooza with?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can change it in Settings → Team.\n\n\nSteps:\n\n\n\n\n- Go to Settings\n\n\n- Open Team\n\n\n- Click your profile\n\n- Replace the email address\n\n- Click Save\n\n\nAfter that, you will log in using the new email address. On the login page, enter the new email and request the login link or code that is sent to that inbox. There is no password to change. \n\n\nTip: you can also keep the old email and add a second login instead, so both work while you transition to the new address.\n\n\n\nSource:\nLogin and Account FAQ | Zooza Help", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Samuel Davis", "text": "it says", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "That message is expected. It mean á", "text": "neviem najst kde nastavim oatzyk do resgitračného formulára", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Otázku do registračního formuláře přidáte jako vlastní pole.\n\n\n\n\n- V našem systému můžete do formulářů přidat až 10 vlastních polí (doplňková pole). \n\n\n- Do nich můžete napsat libovolnou otázku, např. „Kdo vás doporučil?“ nebo „Máte zájem nejdřív o zkušební lekci?“ \n\n\nTato pole se pak zobrazí přímo v registračním formuláři na stránce programu, kde rodiče vyplňují přihlášku. \n\n\nPokud chcete, můžu vám také ukázat typický postup, jak nastavit otázku pro zkušební lekci v tomto formuláři.", "cited": ["Doporučení jako nejsilnější marketing: Jak zapojit rodiče ještě před začátkem kurzů — Zooza", "Ceník — Zooza", "Registrační stránka pro dětské kroužky: 5sekundový návod — Zooza"]}, {"role": "customer", "who": "Jana Kováčová", "text": "rodicia pisali ze v jednom kurze bola otázka povinna a ja ju tam nechcem, ako to zmnim?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Tohle se změní přímo v vlastním poli (doplňkovém poli) v registračním formuláři. Pokud je otázka povinná, je to nastavení toho pole – stačí ho upravit a odebrat povinnost. \n\n\nDoporučení je držet formulář co nejjednodušší a nepovinná pole přidávat jen tam, kde je opravdu potřebujete. \n\n\nAbych vám dal přesné kroky:\n\n\nNa jaké stránce jste teď – v nastavení programu, nebo v editoru registračního formuláře?", "cited": ["Registrační stránka pro dětské kroužky: 5sekundový návod — Zooza", "Ceník — Zooza"]}, {"role": "customer", "who": "Jana Kováčová", "text": "povedz mi kde to mam v zooza najst", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Toto nastavení je v registračním formuláři u programu.\n\n\nPostup je tento:\n\n\n\n\n- Otevřete Program (Programme).\n\n- V detailu programu najděte registrační formulář, který je přímo na stránce programu.\n\n- V tomto formuláři uvidíte jednotlivá pole (např. jméno, e‑mail, věk dítěte apod.).\n\n- Klikněte na pole, které je nastavené jako povinné, a odeberte nastavení povinného pole.\n\nDo formulářů můžete přidávat i vlastní pole (doplňková pole), která slouží právě pro otázky pro rodiče. \n\n\nFormulář je umístěný přímo na stránce programu, kde rodiče vyplňují přihlášku. \n\n\nAk chcete, môžem vám ešte povedať, ktoré pole je najčastejšie nastavené ako povinné a ktoré nie, aby ste to mali rýchlo pod kontrolou.", "cited": ["Ceník — Zooza", "Registrační stránka pro dětské kroužky: 5sekundový návod — Zooza"]}, {"role": "bot", "who": "Zooza Support", "text": "Dostali jste odpověď na svou otázku?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Jana. Kurz -> Nastavenia -> Extra polia", "cited": []}], "verdict": "verify", "vtitle": "Where trial sessions are configured", "vnote": "The human answered 'Programme -> Settings -> Extra fields', which does not match how trials are set up anywhere else in the KB. Confirm before writing — three other conversations this week ask the same question.", "cat": "trials"}, {"channel": "intercom", "id": "215475634380908", "date": "2026-08-25 14:48", "day": "2026-08-25", "human": true, "bucket": "HUMAN", "reask": 2, "resolution": "—", "rating": null, "sources": [], "q": "Dobrý den Martine, nasdílela jsem Vám tabulku na Váš e-mail. Snad je to pro Vás takto vyhovující.", "turns": [{"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Vážený Lada,\n\n\nváš tiket byl přijat. Asistent Zooza se vám pokusí ihned pomoci — a člen našeho týmu jej také osobně zkontroluje.\n\n\n— Podpora Zooza", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Lado, evidujeme podobny problem u viacerych zakaznikov. Viete prosim poslat priklad transakcie, ktora prisla do banky ale zaroven nie je v Zooze. Fio banka ma v poslednej dobe problem s dorucovanim emailovych notifikacii a predpokladam, ze pojde o rovnaky problem.", "cited": []}, {"role": "customer", "who": "Lada Šulcová", "text": "Dobrý den Martine, nasdílela jsem Vám tabulku na Váš e-mail. Snad je to pro Vás takto vyhovující.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dakujem Lado, pomohlo to. Fio zmenilo sablonu emailu a tym padom emaily sice pridu ale system ich nevie precitat. Robime opravu a od zajtra uz platby budu opat chodit. CHybajuce platby si ale budete musiet do systemu naimportovat.", "cited": []}, {"role": "customer", "who": "Lada Šulcová", "text": "Martine, moc Vám děkuji za rychlé vyřešení.", "cited": []}], "verdict": "product", "vtitle": "Fio bank payments not arriving (3)", "vnote": "Same root cause as 215475632384335.", "cat": "payments"}, {"channel": "intercom", "id": "215475632384335", "date": "2026-08-25 14:47", "day": "2026-08-25", "human": true, "bucket": "HUMAN", "reask": 1, "resolution": "routed_to_team", "rating": null, "sources": [], "q": "Dobrý den,\n\n\nve čtvrtek 20.8. bylo poslední flow plateb do systému. Od té doby se žádná z plateb nepropsala do systému a dnes jsem kontroloval, že na BÚ nám některé platby přišly. Můžete nám prosím poradit, kde je problém? \n\n\nDěkujeme, hezký den.\n\n\nTomáš\n\n\n-- \nIng. Tomáš Vávra\nTaneční studio NO LIMIT, z.s.\nLidická 1272/240 370 07 České Budějovice www.tsnolimit.cz, www.nolimitproduction.cz", "turns": [{"role": "customer", "who": "Tomáš Vávra", "text": "Dobrý den,\n\n\nve čtvrtek 20.8. bylo poslední flow plateb do systému. Od té doby se žádná z plateb nepropsala do systému a dnes jsem kontroloval, že na BÚ nám některé platby přišly. Můžete nám prosím poradit, kde je problém? \n\n\nDěkujeme, hezký den.\n\n\nTomáš\n\n\n-- \nIng. Tomáš Vávra\nTaneční studio NO LIMIT, z.s.\nLidická 1272/240 370 07 České Budějovice www.tsnolimit.cz, www.nolimitproduction.cz", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dobrý den Tomáši,\n\n\nDěkujeme, že jste nás kontaktovali. Jsem Zooza Support, AI Agent aplikace Zooza a&nbsp;jsem vyškolený, abych odpověděl na váš dotaz. Kdykoli ale můžete odpovědět a&nbsp;požádat o&nbsp;přepojení na tým.\n\n\nTato situace vyžaduje prověření vašeho konkrétního účtu a nastavení importu plateb. Lidský agent z našeho týmu bude moci zkontrolovat, co se stalo s vašimi platbami od čtvrtka 20.8., a pomoci vám situaci vyřešit.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Tomasi, v pripade Fio banky evidujeme uz dlhsiu dobu problem v tom, ze banka neposiela notifikacie o vsetkych transakciach. V systeme mame prijate platby (u inych klientov) z Fio banky aj dnes, teda samotne parovanie urcite funguje korektne. Viete prosim poslat priklad platby (idealne screenshot z internet bankingu), ktora prisla od 20. 8. a teda nedorazila do Zoozy? Skusime sa na to pozriet.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Este raz dobry den. Uz sme prisli na to v com je problem: Fio zmenilo sablonu emailu a tym padom emaily sice pridu ale system ich nevie precitat. Robime opravu a od zajtra uz platby budu opat chodit. Chybajuce platby si ale budete musiet do systemu naimportovat. Zaujimave je, ze zmenili sablonu iba pre niektorych zakaznikov. Aj dnes nam do systemu pritiekli platby este v starej sablone.", "cited": []}, {"role": "customer", "who": "Tomáš Vávra", "text": "Dobrý den, Martine,\n\n\nskvělé. Děkuji za update šablony, aby se platby zase propisovaly do systému. Platby od čtvrtka jsme zpětně prošli a přidali manuálně. \n\n\nHezký zbytek dne. \n\n\nTomáš", "cited": []}], "verdict": "product", "vtitle": "Fio bank payments not arriving", "vnote": "Three conversations this week. The bank was not sending all notification emails. API-20260825-001 says matching works again after Fio changed its emails — worth a changelog line rather than a KB article.", "cat": "payments"}, {"channel": "intercom", "id": "215475633072504", "date": "2026-08-25 14:32", "day": "2026-08-25", "human": true, "bucket": "HUMAN", "reask": 0, "resolution": "—", "rating": null, "sources": [], "q": "(no client message)", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Dear Anička,\n\n\nyour ticket  has been received. Zooza Assistant will try to help you right away — and a member of our team will personally review it too.\n\n\n— Zooza Support", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den, Uz dlhsiu dobu evidujeme problem s Fio bankou. Banka neposiela uplne vsetky notifikacie o platbach a tie tym padom nekoncia v Zooze. Skusite prosim poslat detaily o nejakej platbe, ktora v banke je ale v zooze nie je? Idealne screenshot z internet bankingu. Pozrieme sa na to, ale predpokladam, ze chyba bude na strane banky.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Preverovali sme to a vyzera to na este iny problem. V cesku Fio zmenilo emailovu sablonu a je pravdepodobne ze ju zmenili aj pre slovensky trh. Tym padom aj ked email pride, system z neho nevie vytiahnut data. Pracujeme na oprave ale chybajuce platby si budete musiet doimportovat manualne z bankingu do zoozy.", "cited": []}], "verdict": "product", "vtitle": "Fio bank payments not arriving (2)", "vnote": "Same root cause as 215475632384335.", "cat": "payments"}, {"channel": "intercom", "id": "215475634373902", "date": "2026-08-25 13:04", "day": "2026-08-25", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "assumed_resolution", "rating": null, "sources": ["Dynamic tags | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Set up invoice profiles and bank accounts | Zooza Help"], "q": "keď mám otvorený svoj profil registrácie, a rozkliknem si platbu, nezobrazuje sa mi tam QR kód a číslo účtu na ktorý má byť splátka poslaná", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "keď mám otvorený svoj profil registrácie, a rozkliknem si platbu, nezobrazuje sa mi tam QR kód a číslo účtu na ktorý má byť splátka poslaná", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumiem, že situácia s platobnými údajmi môže byť frustrujúca. Chcete, aby som vás spojil s ľudským agentom? Alebo môžete poskytnúť viac informácií a budeme pokračovať spolu.", "cited": []}, {"role": "customer", "who": "Peter Longauer", "text": "aké info ešte potrebuješ?ň", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dobré – stačí ešte niekoľko detailov, aby sa dalo zistiť, kde je problém.\n\n\nNajčastejšie sa QR kód a číslo účtu nezobrazia, keď:\n\n\n\n\n- v Settings → Billing Profiles nie je vyplnený IBAN a SWIFT/BIC,\n\n- alebo v šablóne platobného emailu chýba tag *|QR_CODE|*. \n\n\nMôžete mi povedať:\n\n\n\n\n- máte v Billing Profiles vyplnený IBAN a SWIFT/BIC?\n\nPodľa toho môžeme rýchlo zistiť, kde je problém.", "cited": ["Payments and Billing FAQ | Zooza Help", "Dynamic tags | Zooza Help", "Set up invoice profiles and bank accounts | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc so zobrazením QR kódu a čísla účtu, rád vám pomôžem. Chcete doplniť, či máte v Billing Profiles vyplnený IBAN a SWIFT/BIC?", "cited": []}], "verdict": "gap", "vtitle": "No QR code or bank account on the payment in the client profile", "vnote": "API-20260824-002 added the QR code to the order confirmation email. Confirm what the profile shows.", "cat": "payments"}, {"channel": "intercom", "id": "215475633825549", "date": "2026-08-25 12:40", "day": "2026-08-25", "human": false, "bucket": "D_assumed_with_kb", "reask": 1, "resolution": "assumed_resolution", "rating": null, "sources": ["API overview | Zooza Developer Docs", "Authentication | Zooza Developer Docs", "Quickstart | Zooza Developer Docs"], "q": "Dobrý den, potrebujem REST API key + client secret pre integraciu zoozy do nasho webu ak je to mozne. Dakujem.\nS pozdravom\nOravec", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Štefan Oravec", "text": "Dobrý den, potrebujem REST API key + client secret pre integraciu zoozy do nasho webu ak je to mozne. Dakujem.\nS pozdravom\nOravec", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dobrý den, pane Orave.\n\n\nPre REST API integrácie je potrebné mať dve údaje:\n\n\n\n\n- REST API key\n\n- client secret\n\nTieto údaje sa nevygenerujú priamo v účte. Musia sa požiadať u podpory na e‑mail: support@zooza.online. \n\n\nDôležité:\n\n\n\n\n- REST API key je ine ako widget API key a widget key sa nedá použiť pre REST API volania. \n\n\n- Po ich získaní ich použijete pri autentifikácii (POST /v1/login) na získanie tokenu pre ďalšie API requesty.\n\nAk chcete, môžem vám aj ukázať ukážku autentifikácie v Node.js alebo cURL pre túto integraciu.", "cited": ["Quickstart | Zooza Developer Docs", "Authentication | Zooza Developer Docs", "API overview | Zooza Developer Docs"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak potrebujete s REST API integráciou ešte pomôcť, som vám k dispozícii. Chcete doplniť viac informácií o tom, čo sa snažíte integrovať alebo čomu potrebujete porozumieť?", "cited": []}], "verdict": "gap", "vtitle": "Asking for a REST API key to embed Zooza (2)", "vnote": "Same as 215475633790423.", "cat": "ai"}, {"channel": "intercom", "id": "215475633790423", "date": "2026-08-25 12:38", "day": "2026-08-25", "human": false, "bucket": "D_assumed_with_kb", "reask": 1, "resolution": "assumed_resolution", "rating": null, "sources": ["API overview | Zooza Developer Docs", "Authentication | Zooza Developer Docs", "Quickstart | Zooza Developer Docs"], "q": "potrebujem REST API key + client secret", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Štefan Oravec", "text": "potrebujem REST API key + client secret", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "REST API API key a client secret sa nedajú priamo v aplikácii. Ich je potrebné požiadať u podpory. \n\n\n\n\n- Pošlite e‑mail na: support@zooza.online\n\n\n- Požiadajte o REST API key a client secret pre váš účet.\n\nDôležité:\n\n\n\n\n- REST API používa iný API key ako widgety. Widget key sa nedá použiť pre REST volania.\n\n- Po ich získaní ich použijete pri prihlásení na endpoint /v1/login, kde získa token pre ďalšie API requesty. \n\n\nKaždý REST request potom vyžaduje hlavičky:\n\n\n\n\n- X-ZOOZA-API-KEY\n\n- X-ZOOZA-TOKEN\n\n- \nX-ZOOZA-COMPANY", "cited": ["Quickstart | Zooza Developer Docs", "Authentication | Zooza Developer Docs", "API overview | Zooza Developer Docs"]}, {"role": "bot", "who": "Zooza Support", "text": "Ali je to tisto, kar ste iskali?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Če še vedno potrebujete pomoč pri pridobivanju REST API ključa in skrivnosti odjemalca, sem vam na voljo. Želite pojasniti, za kaj ju nameravate uporabiti, da vam lahko pomagam z dodatnimi informacijami?", "cited": []}], "verdict": "gap", "vtitle": "Asking for a REST API key to embed Zooza", "vnote": "Two clients this week asked for an API key and client secret to put Zooza on their site. A human told a third (215475633903706) that widgets need no API key at all — the widget keys live in Team and settings, Publish, Widget. Write it once so the bot stops sending people to developer docs.", "cat": "ai"}, {"channel": "intercom", "id": "215475524647655", "date": "2026-08-25 11:28", "day": "2026-08-25", "human": false, "bucket": "D_assumed_with_kb", "reask": 3, "resolution": "assumed_resolution", "rating": null, "sources": ["Discounts and Sibling Pricing FAQ | Zooza Help", "User roles | Zooza Help", "Attendance management for instructors | Zooza Help", "Calendar | Zooza Help", "Attendance and Catch-up Classes FAQ | Zooza Help", "Instructor Access and Roles FAQ | Zooza Help", "Billable sessions | Zooza Help", "Managing sessions in a class | Zooza Help", "Loyalty Program | Zooza Help", "Sibling Discount | Zooza Help"], "q": "how to change number of classes in a term", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "how to change number of classes in a term", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You change the number of classes in a term by editing the sessions in that class.\n\n\nOption 1 – Add or remove sessions\n\n\n\n\n- Go to Classes and open the class.\n\n- Open the Sessions tab.\n\n- Click Add sessions to add more dates, or delete sessions that were added by mistake. \n\n\nOption 2 – Change the number for many classes at once\n\n\n\n\n- Go to Classes.\n\n- Tick the classes you want.\n\n- Click Bulk edit → set Number of billable sessions. \n\n\nThis is useful if the whole term becomes shorter or longer.", "cited": ["Billable sessions | Zooza Help", "Managing sessions in a class | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further assistance with changing the number of classes in a term, I’m here to help. Would you like to provide more details about what you’re trying to achieve or any specific challenges you’re facing?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Where can our instructors access and take attendance registers?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Instructors access the attendance register through the Calendar in their Zooza account. \n\n\n\n\n- After logging in, they open the Calendar and select the session they are teaching.\n\n- Inside the session, they open the attendance panel and mark each child as Attended, Cancelled, or Did not attend.\n\n- They can switch between Quick view (fast roll call) and Full view (more detailed attendance options). \n\n\nThey can also see their upcoming classes on the dashboard and open the session directly from there to take attendance. \n\n\nInstructors only see the classes they are assigned to in the calendar.", "cited": ["Attendance and Catch-up Classes FAQ | Zooza Help", "User roles | Zooza Help", "Attendance management for instructors | Zooza Help", "Instructor Access and Roles FAQ | Zooza Help", "Calendar | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further assistance with instructor attendance registers, I’m here to help. Would you like to share more about what you’re trying to access or understand?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "HOW DO I OFFER SIBLING DISCOUNT?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can offer a sibling discount through the Loyalty settings.\n\n\nSteps:\n\n\n\n\n- Go to Sales & Payments → Loyalty Program → Sibling Discount.\n\n- Click + Add Rule to create a tier (for example: 2nd child, 3rd child, etc.).\n\n- Choose:\n• From child – which child number the rule starts at\n• Discount type – percentage or fixed amount\n• Discount value – the amount to deduct\n\n- Save the rule, then switch the Enabled toggle on and save settings. \n\n\nAfter that, the discount is applied automatically when a parent books another child under the same email.\n\n\nTip: You can create multiple tiers (e.g., 10% for the 2nd child, 20% for the 4th).", "cited": ["Sibling Discount | Zooza Help", "Discounts and Sibling Pricing FAQ | Zooza Help", "Loyalty Program | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "bot", "who": r your query but you can reply and ask for the team at any time.\n\n\nI understand you've found a discrepancy where the payment form displays the rounded amount (529,00 €) but the registration and confirmation emails show the unrounded amount (529,20 €). This does sound like a bug that needs investigation.\n\n\nSince this is a reported bug with mismatched amounts, I'd like to gather a bit more detail so our team can investigate it properly. Could you please provide:\n\n\n\n\n- \nThe URL or link to the payment template or page where you've set up the rounding rule\n\n- \nA screenshot of the registration confirmation email showing the 529,20 € amount\n\n- \nExpected vs. actual result: You expect the rounded amount (529,00 €) to appear everywhere — in the form, profile, and confirmation email\n\nOnce I have these details, I can escalate this to our team for investigation, as this will likely require a deeper look at how the rounding rule is being applied across the system.", "cited": []}, {"role": "customer", "who": "Jakub Majoroš", "text": "I have made a mistake. The problem occurred during transfer of the registration to a new group. \n\n\nCancel the ticket pls.\n\n\nJ.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Hello Jakub,\n\n\nThank you for the clarification. Since the issue occurred during a transfer and you would like to remove the booking, you can delete the registration from the booking record.\n\n\nSteps:\n\n\n\n\n- Go to Bookings and open the relevant booking.\n\n- In the booking detail, change the status to Deleted.\n\nDeleting a booking completely removes it from the active records, which is appropriate for accidental or test entries. The booking will still remain available in the “Deleted bookings” filter for reference if needed. \n\n\nPlease note that enrolment actions such as cancelling or deleting are always performed on the booking, not on the client profile. \n\n\nPlease let me know if this helps or if you have any further questions.\n\n\nRegistration and Booking FAQ | Zooza Help\nClient Management FAQ | Zooza Help", "cited": []}], "verdict": "verify", "vtitle": "Rounding set on a payment template shows up in the booking form", "vnote": "Client set rounding on their payment templates and reports it surfacing in the registration form. Pairs with the 100,01 rounding conversation. Confirm how rounding is applied and displayed before writing either up.", "cat": "pricing"}, {"channel": "intercom", "id": "215475632567576", "date": "2026-08-25 10:44", "day": "2026-08-25", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "assumed_resolution", "rating": null, "sources": ["Classes List | Zooza Help", "Message Templates | Zooza Help", "Class Detail | Zooza Help", "Automated notifications overview | Zooza Help", "Message templates — automatic and manual emails | Zooza Help", "Automatic notification of an upcoming session | Zooza Help", "Where to find things in Zooza — quick reference | Zooza Help"], "q": "Can you edit automated email templates for each programme or class?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "TOMMY WINGROVE", "text": "Can you edit automated email templates for each programme or class?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — you can use different automated email templates for each programme.\n\n\nHow it works:\n\n\n\n\n- Go to Communication → Templates.\n\n- Create a variant of the template you want (for example, booking confirmation or session reminder).\n\n- Edit the text for that variant.\n\n- Then open the Programme → Settings → Online registration and select that variant in the email field. \n\n\nEach programme can use a different template variant, while others continue using the default system template.\n\n\nTip: You can also send a one‑off email for a specific session if you need a message for just one class date.", "cited": ["Automated notif , {"role": "customer", "who": "Anastasiia Poliakova", "text": "Dobrý deň. Odkazy už fungujú. Na zooza.site sa mi však nedarí nastaviť platby cez profil.\n​", "cited": []}, {"role": "human", "who": "Tech Support", "text": "dakujeme za potvrdenie, ze linky uz funguju.\n\nCo sa platieb tyka, odpovedala som Vam v tickete, kde ste nam k tomu poskytli viac info.\nTento teda zatvaram, komunikaciu k platbam si budeme drzat v tickete k tomu vytvorenom.\n\n\n\n\n\npekny den\n\n\nKatarina", "cited": []}, {"role": "customer", "who": "Anastasiia Poliakova", "text": "Dobrý deň. Ešte to upresním: ide o **dva rôzne problémy**.\n\n\n1. Platby cez **Profile**\n2. Platby cez **Checkout**\n\n\nOhľadom platieb cez Checkout som vám už napísal workaround a vy ste mi odpovedali.\n\n\nK platbám cez Profile však zatiaľ nemám riešenie ani z mojej strany, ani odpoveď od vás.\n​", "cited": []}, {"role": "human", "who": "Tech Support", "text": "rozumiem, dakujem za upozornenie.\n\nPozrieme sa samozrejme aj na platby z profilu.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den Anastasiia\n\nodkontrolovane uz aj platby z Profilu, nezrovnalost odstranena, klienti teda mozu zaplatit uz aj z tohto priestoru.\n\n\n\n\n\ndakujem za trpezlivost\nKatarina\n​\n​", "cited": []}], "verdict": "client", "vtitle": "Account verification and onboarding call", "vnote": "Sales conversation.", "cat": "account"}, {"channel": "intercom", "id": "215475517414908", "date": "2026-08-24 15:58", "day": "2026-08-24", "human": true, "bucket": "HUMAN", "reask": 5, "resolution": "routed_to_team", "rating": null, "sources": [], "q": "connect", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Dear Anastasiia,\n\n\nyour ticket  has been received. Zooza Assistant will try to help you right away — and a member of our team will personally review it too.\n\n\n— Zooza Support", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "customer", "who": "Anastasiia Poliakova", "text": "Dobry den.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Good day! How may I assist you today? 😊", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I just wanted to check if you still need assistance with your issue. Would you like me to connect you with one of our human agents? Otherwise, I’m here and happy to help if you share more details about what you’re trying to resolve.", "cited": []}, {"role": "customer", "who": "Anastasiia Poliakova", "text": "human", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Would you like me to connect you with a human agent? Or if you prefer, you can continue working with me and provide more details about your issue so I can assist you further.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I see you prefer to speak with a human agent, and I apologize if my assistance was not sufficient. Would you like me to connect you with one of our human team members now? Alternatively, I’m here to help if you decide to share more about your issue.", "cited": []}, {"role": "customer", "who": "Anastasiia Poliakova", "text": "human", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I understand you would like to speak with a human agent. Would you like me to connect you with one of our human team members now? Or if you prefer, you can continue working with me and provide more details about your issue so I can assist you further.", "cited": []}, {"role": "customer", "who": "Anastasiia Poliakova", "text": "connect", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Sure — I’ll pass this to the team. Before I do, please share the link/URL and a screenshot of your issue to help them assist you more efficiently.", "cited": []}, {"role": "customer", "who": "Anastasiia Poliakova", "text": "Dobrý deň,\npoužívame checkout widget v2, widget ID 9d43b41441, s platobnou nts);\n\n\nif (name !== 'AMNT' || value !== null) {\n              return value;\n            }\n\n\nvar fallbackArguments =\n              Array.prototype.slice.call(arguments);\n\n\nfallbackArguments[0] = 'AMT';\n\n\nreturn original.apply(\n              this,\n              fallbackArguments\n            );\n          }\n\n\ngetParameterByName.__amtFallbackInstalled = true;\n\n\nprivateJQuery.get_parameter_by_name =\n            getParameterByName;\n        }\n\n\nwindow.clearInterval(timer);\n      } else if (attempts >= 400) {\n        window.clearInterval(timer);\n      }\n    }, 25);\n  }\n\n\nfunction captureZoozaJQuery(candidate) {\n    if (\n      !candidate ||\n      typeof candidate.noConflict !== 'function' ||\n      candidate.noConflict.__zoozaCaptureInstalled\n    ) {\n      return;\n    }\n\n\nvar originalNoConflict = candidate.noConflict;\n\n\nfunction noConflict() {\n      var privateJQuery =\n        originalNoConflict.apply(this, arguments);\n\n\nrestoreJQuery();\n      installFallback(privateJQuery);\n\n\nreturn privateJQuery;\n    }\n\n\nnoConflict.__zoozaCaptureInstalled = true;\n    candidate.noConflict = noConflict;\n  }\n\n\nObject.defineProperty(window, 'jQuery', {\n    configurable: true,\n    enumerable: originalDescriptor\n      ? originalDescriptor.enumerable\n      : true,\n\n\nget: function () {\n      return currentJQuery;\n    },\n\n\nset: function (value) {\n      currentJQuery = value;\n      captureZoozaJQuery(value);\n    }\n  });\n}());\n\u003c/script>\nPo aplikovaní workaroundu:\nobjednávka prejde do platobného kroku;\nzobrazí sa tlačidlo Zaplatiť;\nsprávne sa zobrazí suma 69,00 €;\nURL obsahuje r=\u003cpayment_request_id>;\nchyba s volaním .replace() nad null sa už nevyskytuje.\nWorkaround nemení cenu, API payload, payment URL, tokeny ani nastavenia Stripe/Zooza. Ide iba o fallback pri čítaní parametra sumy.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den Anastasiia,\n\n\n\n\n\ndakujem za vsetky dostupne informacie, ktore ste poslali, aj za nahlasenie nezrovnalosti ktoru riesite.\n\nVsetky potrebne informacie od Vas, ako aj moje zistenia zo systemu posielam nasmu technickemu oddeleniu, aby sa na to pozreli a zabezpecili, aby predaj produktu nezlyhaval.\n\n​\n\n\nak by ste mali akekolvek otazky co sa vytvarania skupin a prepajania produktov tyka, alebo samozrejme, akekolvek ine temy, nevahajte sa na nas obratit formou ticketu.\n\npekny den\n\n\nKatarina", "cited": []}, {"role": "human", "who": "Tech Support", "text": "https://zooza.atlassian.net/browse/ZOOZA-4895", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den Anastasiia,\n\nV pripade, ze klient neprichadza cez registracny formular, ale cez predajny formular, Checkout, je mozne sa bez problemov prihlasit a na konci objednavky urobit aj platbu kartou. Odskusala som to na zivych datach, akurat platbu som nevykonala.\nTento scenar teda mame vyrieseny.\n\nV objednavkach este mate moznost vidiet jednu moju skusobnu objednavku, prosim zatial ju tam ponechajte, riesime totiz este zaplatenie z profilu - nasledne ju vymazem, aby Vam to tam nerobilo neporiadok.\n\nDakujem\nKatarina", "cited": []}], "verdict": "client", "vtitle": "Escalation to the technical team", "vnote": "No general answer in the thread.", "cat": "account"}, {"channel": "intercom", "id": "215475604351116", "date": "2026-08-24 15:58", "day": "2026-08-24", "human": true, "bucket": "HUMAN", "reask": 2, "resolution": "assumed_resolution", "rating": null, "sources": ["Jak automatizovat vaše podnikání v oblasti dětských aktivit (aniž byste ztratili osobní kontakt) — Zooza", "Zooza PRO - Zooza"], "q": "celkovy stav účtu za trénea", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Jak vám mohu pomoci?", "cited": []}, {"role": "customer", "who": "Zuzana  Matúšková Jurčová", "text": "celkovy stav účtu za trénea", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Celkový stav účtu za tréninky najdete v Reports Dashboard.\n\n\nNa této stránce vidíte přehledy jako:\n\n\n\n\n- příjmy (revenue)\n\n- platby\n\n- docházku\n\n- otevřené faktury\n\nTyto přehledy fungují jako živý dashboard, takže máte aktuální přehled o financích a aktivitách přímo v aplikaci. \n\n\nPokud chcete, můžu vám také ukázat, kde přesně tento dashboard v aplikaci najít.\n\n\n\nSource:\nJak automatizovat vaše podnikání v oblasti dětských aktivit (aniž byste ztratili osobní kontakt) — Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Hledali jste tohle?", "cited": []}, {"role": "customer", "who": "Zuzana  Matúšková Jurčová", "text": "ok ale chceme aj taky prehlad kde si tam konkretneho trenera a jeho stav", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumím – chcete přehled podle konkrétního trenéra, ne jen celkový stav.\n\n\nV Zooza bohužel Reports Dashboard neukazuje finance nebo stav účtu podle jednotlivých instruktorů. Dashboard slouží hlavně pro celkové přehledy jako příjmy, platby, docházku a otevřené faktury. \n\n\nCo ale můžete vidět:\n\n\n\n\n- \nRozvrh instruktora – každý trenér má svůj rozvrh přímo ve svém profilu, kde vidí své lekce a případné změny.\n\n- Docházku, platby a kapacitu kurzů v reálném čase v systému. \n\n\nTakže: celkový stav účtu je v reportu, ale podrobný přehled „trenér + jeho stav“ v jednom reportu není.\n\n\nPokud chcete, můžu vám ukázat jeden praktický způsob, jak sledovat výkon nebo vytížení jednotlivých trenérů v Zooza.", "cited": ["Jak automatizovat vaše podnikání v oblasti dětských aktivit (aniž byste ztratili osobní kontakt) — Zooza", "Zooza PRO - Zooza"]}, {"role": "bot", "who": "Zooza Support", "text": "Dostali jste odpověď na svou otázku?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc s prehľadom konkrétneho trénera, môžem vám pomôcť pokračovať. Chcete upresniť, či hľadáte jeho odmenu, počet lekcií alebo vyťaženosť?", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dobry den, Zuzka, toto všetko viete vytiahnut použitím prepojenia Zoozy s Vašim ChatGPT alebo Claudom. Ten vie tieto dáta vytiahnuť. \nTento chat, čo je v aplikácii odpoveda len na základe návodov v aplikácii. Skúste pozriet tu, https://www.zooza.online/sk/mcp/ Najlepšie prepojiť a používať. Je to super :)", "cited": []}], "verdict": "gap", "vtitle": "What the in-app assistant can and cannot do", "vnote": "Two clients this week expected the in-app chat to pull their data or perform actions. Human answer: the in-app chat answers only from the help centre; for data questions and actions connect Zooza to your own AI via MCP. Also 215475632318555.", "cat": "ai"}, {"channel": "intercom", "id": "215475348814074", "date": "2026-08-24 15:00", "day": "2026-08-24", "human": true, "bucket": "HUMAN", "reask": 3, "resolution": "assumed_resolution", "rating": null, "sources": ["Enums reference | Zooza Developer Docs", "Change the language in Zooza | Zooza Help"], "q": "How do I change the language the calendar appears in on the website? It's currently in English and I'd like it to be in Romanian. For example, I'd like it to display Luni, Marți, Miercuri... instead of Monday, Tuesday, Wednesday... and Grupa va începe... instead of The class will start...", "turns": [{"role": "customer", "who": "Mara Bortea", "text": "How do I change the language the calendar appears in on the website? It's currently in English and I'd like it to be in Romanian. For example, I'd like it to display Luni, Marți, Miercuri... instead of Monday, Tuesday, Wednesday... and Grupa va începe... instead of The class will start...", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You just need to change the client-facing language in your account settings.\n\n\nSteps:\n\n\n\n\n- Go to Settings → Company information\n\n\n- Find Application Communication Language\n\n\n- Select Romanian\n\n\n- Save\n\nThis controls the language your clients see on the website, including the booking widget, calendar texts, confirmation emails, and the client portal. \n\n\nRomanian is supported for widgets, so texts like days of the week and messages such as “The class will start…” will appear in Romanian after the change. \n\n\nTip: if you ever want to adjust specific wording (for example custom labels on the booking form), you can also edit some texts directly in the programme’s booking form settings.", "cited": ["Change the language in Zooza | Zooza Help", "Enums reference | Zooza Developer Docs"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Mara, the suggestion by the AI is not correct - the language is determined by your website's language - so you'll need to make sure that the language the website is written in is Romanian", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Hi Martin! Thanks! It's Romanian and it worked", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Awesome", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Hi Martin! I noticed something regarding the consents in the calendar view. The date shown for the consent seems to be the same for all participants and is in the distant past. However, I know for sure that some of these are new participants who submitted their consent just a few days ago. Could you please check this? For example, https://zooza.app/#calendar/1371406, the ACORD CU PRIVIRE LA FOLOSIREA IMAGINII COPIILOR DIN TIMPUL ORELOR DE CURS shows the date December 2, 2024. Thanks!", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Mara, you are correct, the date is in fact wrong - that date you see is the date the consent was created not when it was given by customer. We already fixed it and the fix will be live on production tonight. All the best. Martin", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Hi Martin! Many thanks!", "cited": []}], "verdict": "gap", "vtitle": "Widget language follows the host website's language", "vnote": "The AI told the client to change a Zooza setting. A human corrected it: the calendar/widget language is taken from the language of the page the widget is embedded in. Highest-value item of the week — a wrong KB answer caused a wrong bot answer.", "cat": "widgets"}, {"channel": "intercom", "id": "215475377368510", "date": "2026-08-24 14:36", "day": "2026-08-24", "human": true, "bucket": "HUMAN", "reask": 0, "resolution": "—", "rating": null, "sources": [], "q": "(no client message)", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Vážený Ivana,\n\n\nváš tiket byl přijat. Asistent Zooza se vám pokusí ihned pomoci — a člen našeho týmu jej také osobně zkontroluje.\n\n\n— Podpora Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den, je to zvlastne pretoze momentalne bezia registracie v plnom prude a toto by bol velmi velky problem. Pravdepodobe pojde o kombinaciu jej prehliadaca a nejakeho vizualneho problemu. Skusime sa pozriet na to co sa s tym da robit.  Kazdopadne aj zo screenshotu je vidno, ze nie co nie je v poriadku na strane zakaznicky, pretoze sa pozera na desktopovu verziu formulara a nie na mobilnu. Ozveme sa.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Ivana. Po dlhsej dobe sa ozyvam spat. Neprisli sme na ziadny problem s prihlaskou, vzhladom na screenshot to vyzera naozaj na problem na strane klientky. Zaznamenali ste nejakych inych klientov, ktori by sa nevedeli registrovat? Dakujem, Martin", "cited": []}], "verdict": "client", "vtitle": "Registration form rendering on one customer's browser", "vnote": "Desktop form shown on a mobile device; one customer's environment.", "cat": "widgets"}, {"channel": "intercom", "id": "215475618106994", "date": "2026-08-24 1 \n\nTo turn it off, switch your device or browser to light mode:\n\n\n\n\n- \nMac: System Settings → Appearance → Light\n\n- \nWindows: Settings → Personalisation → Colours → Light\n\n- \nBrowser: change the browser’s appearance/theme to light\n\nOnce your system or browser is set to light mode, Zooza will switch to light mode automatically. The change applies immediately, no refresh needed.\n\n\n\nSource:\nLogin and Account FAQ | Zooza Help", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further help switching Zooza to light mode, I’m here to assist. Would you like to share which device or browser you’re using?", "cited": []}], "verdict": "check", "vtitle": "Turning off dark mode", "vnote": "Check whether the KB says anything about the theme switch.", "cat": "account"}, {"channel": "intercom", "id": "215475473494431", "date": "2026-08-24 11:43", "day": "2026-08-24", "human": true, "bucket": "HUMAN", "reask": 3, "resolution": "—", "rating": null, "sources": [], "q": "Pre registrácie, ktorým vznikol prenesený náhradný termín vo fakturačnom období Jar 2026", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Vážený Martina,\n\n\nváš tiket byl přijat. Asistent Zooza se vám pokusí ihned pomoci — a člen našeho týmu jej také osobně zkontroluje.\n\n\n— Podpora Zooza", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Martina, pre ktory ucet chcete zmenit expiraciu? Nitra/Topolcany alebo Prievidza/Partizanske?", "cited": []}, {"role": "customer", "who": "Martina Dat", "text": "Pre registrácie, ktorým vznikol prenesený náhradný termín vo fakturačnom období Jar 2026", "cited": []}, {"role": "customer", "who": "Martina Dat", "text": "Nitra/Topoľčany aj Prievidza/Partizán
