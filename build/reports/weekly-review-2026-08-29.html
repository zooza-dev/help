<title>Help desk triage — 2026-08-22 to 2026-08-29</title>
<style id="sheet">
:root{
  --ground:#ffffff; --surface:#f7f8f2; --surface-2:#eef2f5; --raise:#ffffff;
  --line:#dfe4e2; --line-soft:#ebefed;
  --ink:#414141; --ink-deep:#1a222b; --muted:#6f7d7b;
  --teal:#0e7972; --teal-soft:#e2efee;
  --brand:#fa6900; --brand-dark:#e35f00;
  --critical:#a20000; --critical-soft:#f7e6e6;
  --warn:#8a5200; --warn-soft:#fff2df;
  --ok:#3f6212; --ok-soft:#eef4e4;
  --shadow:0 1px 2px rgba(26,34,43,.06), 0 8px 24px -16px rgba(26,34,43,.28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#12171a; --surface:#181f22; --surface-2:#1f282c; --raise:#1b2327;
    --line:#2c383d; --line-soft:#232d31;
    --ink:#ccd5d3; --ink-deep:#f2f6f4; --muted:#8b9997;
    --teal:#4fb6ae; --teal-soft:#12302e;
    --brand:#ff8434; --brand-dark:#ff9a56;
    --critical:#ff7b72; --critical-soft:#33201f;
    --warn:#e3ac63; --warn-soft:#2e2417;
    --ok:#a3c266; --ok-soft:#1e2718;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#12171a; --surface:#181f22; --surface-2:#1f282c; --raise:#1b2327;
  --line:#2c383d; --line-soft:#232d31;
  --ink:#ccd5d3; --ink-deep:#f2f6f4; --muted:#8b9997;
  --teal:#4fb6ae; --teal-soft:#12302e;
  --brand:#ff8434; --brand-dark:#ff9a56;
  --critical:#ff7b72; --critical-soft:#33201f;
  --warn:#e3ac63; --warn-soft:#2e2417;
  --ok:#a3c266; --ok-soft:#1e2718;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- masthead ---------- */
.mast{border-bottom:1px solid var(--line); background:var(--surface);position:sticky;top:0;z-index:20}
.mast-in{max-width:1640px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.brandblock{display:flex;flex-direction:column;gap:1px;margin-right:auto}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:600}
.mast h1{margin:0;font-size:17px;line-height:1.2;color:var(--ink-deep);font-weight:700}
.mast h1 .rng{color:var(--muted);font-weight:400;font-size:14px}
.prog{display:flex;align-items:center;gap:10px;min-width:230px}
.bar{flex:1;height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar span{display:block;height:100%;background:var(--teal);transition:width .25s}
.prog .lbl{font-size:12px;color:var(--muted);white-space:nowrap}
.prog .lbl b{color:var(--ink-deep)}
.act{display:flex;gap:8px;align-items:center}
.btn{font-size:12.5px;padding:6px 12px;border-radius:7px;border:1px solid var(--line);background:var(--raise);color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dark);border-color:var(--brand-dark)}
.save{font-size:11.5px;color:var(--muted);min-width:96px;text-align:right}
.save.on{color:var(--teal)}
.save.err{color:var(--critical)}

/* ---------- shell ---------- */
.shell{max-width:1640px;margin:0 auto;padding:18px 24px 40px;display:grid;grid-template-columns:minmax(320px,380px) 1fr;gap:18px;align-items:start}
.pane{background:var(--raise);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}

/* ---------- filters ---------- */
.filters{padding:11px 12px;border-bottom:1px solid var(--line-soft)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);display:inline-flex;gap:5px;align-items:center}
.chip:hover{border-color:var(--muted)}
.chip .c{color:var(--muted);font-size:10.5px}
.chip[aria-pressed="true"]{background:var(--ink-deep);border-color:var(--ink-deep);color:var(--ground)}
.chip[aria-pressed="true"] .c{color:var(--muted)}
.frow{display:flex;gap:6px;margin-top:8px}
.search,.sel{font:inherit;font-size:12.5px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink)}
.search{flex:1;min-width:0}
.search::placeholder{color:var(--muted)}

/* ---------- list ---------- */
.list{max-height:calc(100vh - 260px);overflow-y:auto}
.daygroup{padding:8px 13px 4px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--surface);border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);position:sticky;top:0;z-index:1}
.row{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line-soft);border-left:3px solid transparent;padding:9px 13px 10px;color:inherit}
.row:hover{background:var(--surface)}
.row[aria-current="true"]{background:var(--teal-soft);border-left-color:var(--teal)}
.row.d-ok{border-left-color:var(--ok)}
.row.d-kb{border-left-color:var(--teal)}
.row.d-dig{border-left-color:var(--warn)}
.row.d-product{border-left-color:var(--muted)}
.row-top{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.who{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;display:inline-flex;align-items:center;gap:5px;min-width:0}
.who span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.who.h{color:var(--teal)}
.who.b{color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.who.h .dot{background:var(--teal)}
.who.b .dot{border:1.5px solid var(--muted)}
.time{margin-left:auto;font-size:10.5px;color:var(--muted);flex:none}
.row-q{font-size:13.5px;color:var(--ink-deep);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;align-items:center}
.tag{font-size:10px;letter-spacing:.04em;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase;font-weight:600}
.tag.crit{color:var(--critical);border-color:var(--critical);background:var(--critical-soft)}
.tag.cat{text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink);background:var(--surface-2)}
.tag.dec{color:#fff;border:0;font-weight:600}
.tag.dec.ok{background:var(--ok)} .tag.dec.kb{background:var(--teal)}
.tag.dec.dig{background:var(--warn)} .tag.dec.product{background:var(--muted)}
.tag.sug{border-style:dashed}
.tag.hasnote{background:var(--brand);border-color:var(--brand);color:#fff}
.empty{padding:26px 16px;color:var(--muted);font-size:13px;text-align:center}

/* ---------- rollup ---------- */
.rollup{padding:12px 13px;border-top:1px solid var(--line-soft)}
.rollup h3{margin:0 0 8px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
table.rt{width:100%;border-collapse:collapse;font-size:12px}
table.rt th{text-align:right;font-weight:600;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:0 0 4px}
table.rt th:first-child{text-align:left}
table.rt td{padding:2px 0;border-top:1px solid var(--line-soft);text-align:right;font-variant-numeric:tabular-nums}
table.rt td:first-child{text-align:left;color:var(--ink-deep)}
table.rt td.z{color:var(--line)}
table.rt tr.tot td{font-weight:700;color:var(--ink-deep);border-top:1px solid var(--line)}
.rt button{background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left}
.rt button:hover{color:var(--brand);text-decoration:underline}

.cites{padding:12px 13px;border-top:1px solid var(--line-soft)}
.cites h3{margin:0 0 7px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cites ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.cites li{display:flex;gap:8px;font-size:11.5px;align-items:baseline}
.cites .n{color:var(--teal);font-weight:700;min-width:14px}
.cites .m{color:var(--critical)}

/* ---------- detail ---------- */
.detail{min-height:70vh}
.dhead{padding:16px 20px 14px;border-bottom:1px solid var(--line-soft)}
.dhead h2{margin:0 0 8px;font-size:18px;line-height:1.35;color:var(--ink-deep);font-weight:600;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:5px 14px;font-size:12px;color:var(--muted);align-items:center}
.meta b{color:var(--ink-deep);font-weight:600}
.idcopy{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 8px;font-size:11.5px;color:var(--ink-deep)}
.idcopy:hover{border-color:var(--brand);color:var(--brand)}

.triage{padding:14px 20px;border-bottom:1px solid var(--line-soft);background:var(--surface);display:flex;flex-direction:column;gap:12px}
.tlabel{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:5px}
.decs{display:flex;flex-wrap:wrap;gap:7px}
.dec-btn{border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:7px 12px;font-size:13px;color:var(--ink);display:flex;flex-direction:column;gap:1px;align-items:flex-start;min-width:150px}
.dec-btn small{font-size:10.5px;color:var(--muted);font-weight:400}
.dec-btn:hover{border-color:var(--muted)}
.dec-btn[aria-pressed="true"]{color:#fff;border-color:transparent}
.dec-btn[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.dec-btn[aria-pressed="true"][data-d="ok"]{background:var(--ok)}
.dec-btn[aria-pressed="true"][data-d="kb"]{background:var(--teal)}
.dec-btn[aria-pressed="true"][data-d="dig"]{background:var(--warn)}
.dec-btn[aria-pressed="true"][data-d="product"]{background:var(--muted)}
.trow{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.note{width:100%;font:inherit;font-size:13.5px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--raise);color:var(--ink);resize:vertical;min-height:62px}
.note::placeholder{color:var(--muted)}
.claudread{margin:14px 20px 0;border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:0 8px 8px 0;background:var(--surface);padding:11px 15px}
.claudread.v-verify,.claudread.v-check{border-left-color:var(--warn)}
.claudread.v-product,.claudread.v-client,.claudread.v-noise{border-left-color:var(--muted)}
.claudread .vk{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:3px}
.claudread .vt{color:var(--ink-deep);font-weight:600;margin-bottom:3px}
.claudread p{margin:0;font-size:13.5px}

.thread{padding:16px 20px 26px;display:flex;flex-direction:column;gap:13px}
.turn{display:grid;grid-template-columns:92px 1fr;gap:13px;align-items:start}
.turn .lbl{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;color:var(--muted);padding-top:4px;text-align:right;overflow-wrap:anywhere}
.turn.t-customer .lbl{color:var(--ink-deep)}
.turn.t-human .lbl{color:var(--teal)}
.bubble{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-size:14.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;padding:10px 14px;border-radius:8px;border:1px solid var(--line-soft);background:var(--surface)}
.turn.t-customer .bubble{background:var(--surface-2);border-color:var(--line)}
.turn.t-human .bubble{background:var(--teal-soft);border-color:var(--teal)}
.turn.t-bot .bubble{background:transparent}
.cited{margin-top:8px;font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.cited b{display:block;letter-spacing:.08em;text-transform:uppercase;font-size:10px;margin-bottom:3px;font-weight:600}
.cited .m{color:var(--critical)}
.placeholder{padding:60px 24px;text-align:center;color:var(--muted)}
.placeholder .big{font-size:15px;color:var(--ink-deep);margin-bottom:6px}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--raise);color:var(--ink);padding:0;max-width:min(780px,92vw);width:100%;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(26,34,43,.45)}
.dlg{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font-size:17px;color:var(--ink-deep)}
.dlg p{margin:0;font-size:13px;color:var(--muted)}
.dlg textarea{width:100%;height:340px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.5;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;border:0;padding:0}

@media (max-width:1080px){
  .shell{grid-template-columns:1fr}
  .list{max-height:none}
  .turn{grid-template-columns:1fr;gap:4px}
  .turn .lbl{text-align:left}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

ooza Help", "Transfer and copy bookings | Zooza Help", "Registration and Booking FAQ | Zooza Help", "Trial Classes FAQ | Zooza Help", "Client Management FAQ | Zooza Help", "Automatic payment reminders | Zooza Help", "Price and payment setup | Zooza Help", "Clients | Zooza Help", "Sending email/SMS to clients | Zooza Help", "Email and Communication FAQ | Zooza Help", "Programmes, Timetables and Sessions FAQ | Zooza Help", "Outstanding amount — why it does not follow price changes | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Bookings | Zooza Help", "Automatic reminders for payment schedule | Zooza Help", "Booking FAQ | Zooza Help", "Class Detail | Zooza Help", "Automated notifications overview | Zooza Help", "Transfer and Copy FAQ | Zooza Help", "Parent Messaging for Classes | Zooza", "Automatic notification of an upcoming session | Zooza Help", "When to enrol clients yourself vs. send them a booking link | Zooza Help"], "q": "Can I add clients without them getting emails?", "turns": [{"role": "customer", "who": "Katherine Crafer", "text": "Can I add clients without them getting emails?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes. You can add clients without them receiving emails.\n\n\nWhen you create a booking manually, no confirmation email is sent automatically. The client record is created, but the email must be sent manually if you want them to receive it. \n\n\nTypical approach:\n\n\n\n\n- Go to Bookings → Create booking\n\n\n- Add the client details\n\n- Complete the booking\n\nNo email is triggered at that moment. You can send one later from the booking’s Communication tab if needed.\n\n\nYou can also import clients in bulk via Clients → Import, which creates client profiles without sending emails.", "cited": ["Client Management FAQ | Zooza Help", "Bookings | Zooza Help", "Email and Communication FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any more help with adding clients or managing email notifications, please let me know. Would you like to share more about what you're trying to achieve or any specific concerns you have?", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "How do I turn off session reminders temporarily", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — you can temporarily turn off session reminders in two ways.\n\n\nOption 1: Turn them off for a whole programme\n\n\n\n\n- Go to Programmes → open the programme\n\n\n- In Online Booking, click Change\n\n\n- Scroll to the Communication section\n\n- Turn off the Send event notifications toggle\n\n- Click Save\n\n\nThis stops automatic session reminders for that programme. \n\n\nOption 2: Turn them off for one booking\n\n\n\n\n- Open the booking\n\n\n- Go to the Options tab\n\n- Turn off Send reminders of the upcoming sessions. \n\n\nTip: If you only need a short pause, turning it off per booking is usually the quickest approach.", "cited": ["Automatic notification of an upcoming session | Zooza Help", "Automated notifications overview | Zooza Help", "Bookings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "Can I turn off all parent/client communicatin", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Yes — you can turn off most automated client/parent communication, but not all of it.\n\n\nYou can disable many notifications in Programmes → programme → Automations, where each step (booking confirmations, trials, waitlist, etc.) can be toggled on or off. \n\n\nYou can also stop payment reminder emails globally in Settings → Billing → Payments by turning off Send scheduled payment notifications. \n\n\nHowever, some transactional emails (for example payment confirmation emails) are always sent and cannot be disabled.\n\n\nPromotional emails can be turned off per client in Clients → client → Notes and preferences → Send promotional emails. \n\n\nSo in practice: you can disable most automated messages, but a few system emails will still be sent.\n\n\nIf you want, I can also show you the quickest way to temporarily pause most notifications for a short period.", "cited": ["Automated notifications overview | Zooza Help", "Parent Messaging for Classes | Zooza", "Automatic reminders for payment schedule | Zooza Help", "Sending email/SMS to clients | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this information helpful?", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "Which communication is sent if I manually enter a client", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you manually enter a client by creating a booking, no automatic communication is sent at all. \n\n\n\n\n- The client record is created.\n\n- The booking is created.\n\n- No confirmation email or reminder is triggered automatically.\n\nYou can still send messages later if you want:\n\n\n\n\n- Open the booking\n\n- Go to the Communication tab\n\n- Send an email or SMS manually. \n\n\nSo in short: creating a client manually = zero automatic emails unless you send them yourself.\n\n\nIf you want, I can also show you a quick way to add many clients at once without sending any emails.", "cited": ["Email and Communication FAQ | Zooza Help", "Bookings | Zooza Help", "Client Management FAQ | Zooza Help", "Sending email/SMS to clients | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any further assistance with managing client communications or have more questions, I’m here to help. Would you like to provide more details about what you’re trying to achieve or any specific concerns you have?", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "How do you change a booking for a client", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can change a client’s booking directly from the booking detail.\n\n\nSteps:\n\n\n\n\n- Go to Clients → Bookings and open the booking.\n\n- In the booking detail, click Change Client.\n\n- In the Client field, type the new client’s name or email.\n\n- Click Search, then Select to confirm. \n\n\nThis reassigns that single booking to a different client. It does not change the client’s details across all their other bookings.\n\n\nTip: The booking’s communication history stays linked to the booking number, even after you change the client.", "cited": ["Client Management FAQ | Zooza Help", "Bookings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "How do I change a client's booking to a different sessin", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You change a client’s session by transferring the booking to another class/session.\n\n\nSteps:\n\n\n\n\n- Go to Clients → Bookings\n\n\n- Open the client’s booking\n\n- In the Class card, click Transfer\n\n\n- Choose the new class/session\n\n- Confirm the transfer\n\nThis moves the booking to the new session while keeping the same client profile. The client will then have the remaining sessions in the new class. \n\n\nTip: If you want the client to stay in the original class and just attend another session as well, use Copy booking instead.", "cited": ["Client Management FAQ | Zooza Help", "Booking FAQ | Zooza Help", "Transfer and copy bookings | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need any help with changing bookings or managing sessions, I’m here to assist you. Would you like to provide more details about what you’re trying to do or any specific issues you’re facing?", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "How do I change the booking to a different block?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You cannot use Transfer to move a client to a different block within the same class. Instead, you change the block directly in the attendance view. \n\n\nSteps:\n\n\n\n\n- Go to Clients → Bookings and open the booking.\n\n- Open the Attendance tab.\n\n- Change the client’s block assignment there.\n\nImportant: when you switch blocks, the previous attendance records become Hidden in the system. The data is not deleted, but it will no longer appear in the booking, client profile, or exports. \n\n\nTip: if you need a record of past attendance, export it before changing the block.", "cited": ["Blocks Configuration and Management | Zooza Help", "Transfer and Copy FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "That worked", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I'm glad to hear that it worked! If you have any more questions or need further assistance, please feel free to ask. I'm here to help! 😊", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "Why is it showing that the client owes £3,000", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "That usually means the outstanding amount on the booking is £3,000.\n\n\nWhen a booking is created, the system automatically sets an amount owed based on the programme price. This number tracks how much the client still needs to pay. If nothing has been paid yet, the full amount will appear as the balance. \n\n\nYou can see this in the client’s booking under Amount to pay (negative values mean money is still owed). \n\n\nSo the £3,000 is simply the amount the system expects the client to pay for that booking.\n\n\nIf you want, I can also explain how to adjust that amount or mark it as paid.", "cited": ["Payments and Billing FAQ | Zooza Help", "Outstanding amount | Zooza Help", "Clients | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "But they only need to pay £80/month", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "That’s expected. The £3,000 is the total amount owed for the booking, not the monthly payment. \n\n\nWhen a booking is created, the system calculates the full programme price and stores it as the outstanding amount. It then splits that total into scheduled payments (for example £80 per month). \n\n\nSo in your case:\n\n\n\n\n- Total owed: £3,000\n\n\n- Monthly payment: £80\n\n\n- The system simply tracks the remaining balance until all instalments are paid. \n\n\nTip: If you want, I can also explain how to adjust the payment schedule or monthly amount if it ever needs changing.", "cited": ["Payments and Billing FAQ | Zooza Help", "Outstanding amount | Zooza Help", "Price and payment setup | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you need any more help understanding or adjusting the payment details, I’m here to assist you. Would you like to share more about what you’re trying to resolve or any specific concerns you have?", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "How do I turn of all automatic communication with a client", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can stop most automatic messages, but some transactional emails cannot be fully disabled (for example booking confirmations). They can only be turned off at the programme level. \n\n\nTo reduce automatic communication for a specific client:\n\n\n\n\n- Go to Clients → open the client → Notes and preferences\n\n\n- Untick Send promotional emails to stop marketing messages. \n\n\nTo stop payment reminder emails globally:\n\n\n\n\n- Go to Settings → Billing → Payments\n\n\n- Turn off Send scheduled payment notifications. \n\n\nYou can also disable session reminders in Programmes → programme → Online Booking → Communication toggle. \n\n\nTip: If you want, I can also show you how to turn off reminders for just one booking instead of the whole programme.", "cited": ["Automated notifications overview | Zooza Help", "Automatic notification of an upcoming session | Zooza Help", "Sending email/SMS to clients | Zooza Help", "Automatic reminders for payment schedule | Zooza Help", "Clients | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was this helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help with managing automatic communications or have any other questions, I’m here to assist you. Would you like to provide more details about what you’re trying to achieve or any specific issues you’re encountering?", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "So that setting is off, but you still emailed 4 clients telling them that they hadn't paid", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "This usually happens because payment reminder emails are controlled in two places, not just the global toggle.\n\n\nEven if Settings → Billing → Payments → Send scheduled payment notifications is off, reminders can still be sent if a Payment Reminder action is configured on the programme. These are set per programme and can send emails when a payment is due or overdue. \n\n\nYou can check it here:\n\n\n\n\n- Go to Programmes → select the programme\n\n\n- Open Settings → Price and Payment\n\n\n- Look for Payment Reminder Settings and see if reminders are configured. \n\n\nAlso note:\n\n\n\n\n- Reminder emails are sent in a nightly batch, so they can arrive anytime between midnight and ~6 AM. \n\n\n- Payment confirmation emails are always sent and are not controlled by that toggle. \n\n\nIf you want, I can also show you where to disable the programme-level reminder so no payment emails go out at all.", "cited": ["Automatic reminders for payment schedule | Zooza Help", "Automatic payment reminders | Zooza Help", "Payments and Billing FAQ | Zooza Help", "Automated notifications overview | Zooza Help", "Price and payment setup | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help with disabling all automatic payment reminders or managing communications, I’m here to assist you. Would you like to share more about the specific settings or issues you’re encountering so we can continue?", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "How do I manually add a trial session booking?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can’t manually add a trial session booking in Zooza.\n\n\nTrial bookings must be created by the client through the online booking form. Admins can only create standard enrolments, not trial bookings. \n\n\nWhat you can do instead:\n\n\n\n\n- Send the client your booking link so they can book their trial themselves. \n\n\n- If they can’t use the form, you can create a regular booking manually and then adjust it later if needed. \n\n\nAfter the trial is booked, you can open the booking and use Enrol to move them into a normal class if they decide to continue.", "cited": ["Registration and Booking FAQ | Zooza Help", "Manage trial bookings — reschedule, convert, and close | Zooza Help", "Trial Classes FAQ | Zooza Help", "When to enrol clients yourself vs. send them a booking link | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "So how do I stop that time trial from showing so no one else books it?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "You can hide that trial session from the public booking page so no one else can book it.\n\n\nOption 1 – Hide just that class\n\n\n\n\n- Go to Programmes → open the programme → select the class\n\n\n- Open Settings → Edit\n\n\n- Untick Allow online booking\n\n\n- Save\n\nThe class stays in the system for you, but it will no longer appear on the public booking page. \n\n\nOption 2 – Hide the whole programme\n\n\n\n\n- Go to Programme → Settings → Online Booking\n\n\n- Set Allow online booking = No\n\n\nThis removes the entire programme from the booking widget.\n\n\nTip: If you want to keep the class visible but only allow a specific client to book it, you can disable Display in catalogue and share a private booking link instead.", "cited": ["Programmes, Timetables and Sessions FAQ | Zooza Help", "Registration and Booking FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that clarify things?", "cited": []}, {"role": "customer", "who": "Katherine Crafer", "text": "But I want the other times to show for that day and that time for other weeks to show", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Got it — you want one specific date hidden, but the same class time to still appear for future weeks.\n\n\nThe key is: the “Allow online booking” toggle hides the entire class, not just one date. So if you turn it off, all future sessions of that class disappear too. \n\n\nBest way to handle this:\n\n\n\n\n- Leave the class visible (keep Allow online booking on)\n\n- Just don’t book anyone into that one date\n\n\n- Or adjust the class Start date so that date is no longer included in the timetable range. \n\n\nThis way:\n\n\n\n\n- The same time still shows for future weeks\n\n- Only that one date is excluded\n\nTip: If you often run one-off trials, you can also create a separate hidden class just for those sessions and book clients manually.", "cited": ["Programmes, Timetables and Sessions FAQ | Zooza Help", "Class Detail | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help managing the visibility of that specific trial time without hiding future sessions, I’m here to assist. Would you like to share more about how the class timetable is configured?", "cited": []}], "verdict": "gap", "vtitle": "Adding clients without sending them email", "vnote": "Re-asked 14 times against 23 cited articles — the bot had plenty to read and still could not answer. Confirm the real control before writing.", "cat": "clients"}, {"channel": "intercom", "id": "215475683307009", "date": "2026-08-29 10:50", "day": "2026-08-29", "human": false, "bucket": "D_assumed_with_kb", "reask": 2, "resolution": "assumed_resolution", "rating": null, "sources": ["GoCardless Integration FAQ | Zooza Help", "Billing and invoicing | Zooza Help", "Payment Pairing for Bank Transfers & Direct Debit | Zooza Help", "Price and payment setup | Zooza Help", "GoCardless Connection Lifecycle | Zooza Help", "Inbound payments — setup and pairing | Zooza Help", "Set up how Zooza collects money from clients | Zooza Help", "Set up invoice profiles and bank accounts | Zooza Help"], "q": "Hello,\n\nWe need to update the bank account details in Zooza, as we no longer have an account with Tatra banka. We have moved our business account to Slovenská sporiteľňa.\n\nCould you please help us make this change as soon as possible?\n\nWe need to set up the schedules for our upcoming courses, and parents will start making payments as soon as they receive the emails, so it is important that the new bank account details are updated beforehand.\n\nThank you very much for your help.\n\nKind regards,\n\nS pozdravom Mgr. Jadranka Krasňanská", "turns": [{"role": "customer", "who": "Jadranka Krasňanská", "text": "Hello,\n\nWe need to update the bank account details in Zooza, as we no longer have an account with Tatra banka. We have moved our business account to Slovenská sporiteľňa.\n\nCould you please help us make this change as soon as possible?\n\nWe need to set up the schedules for our upcoming courses, and parents will start making payments as soon as they receive the emails, so it is important that the new bank account details are updated beforehand.\n\nThank you very much for your help.\n\nKind regards,\n\nS pozdravom Mgr. Jadranka Krasňanská", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Hi Jadranka,\n\n\nThanks for reaching out! I'm Zooza Support, Zooza's AI Agent and I'm well trained to answer your query but you can reply and ask for the team at any time.\n\n\nYou can update the bank account details directly in your invoice profile.\n\n\nSteps:\n\n\n\n\n- Go to Settings → Billing → Invoice profiles.\n\n- Open the invoice profile used for your courses.\n\n- Scroll to the Bank accounts section.\n\n- Click Add bank account and enter the new IBAN, SWIFT code, and account holder name.\n\n- Save the new account. \n\n\nA profile can hold multiple bank accounts, and the first one added becomes the default used for payment instructions sent to clients. \n\n\nIf you want a specific programme to use a different account, you can also enter its IBAN in the programme’s Payment instructions field. \n\n\nTip: once the new account is saved, you can keep the old one in the profile for reference and simply use the new IBAN for upcoming payments.\n\n\nPlease let me know if this helps or if you have any further questions.\n\n\nSet up invoice profiles and bank accounts | Zooza Help\nBilling and invoicing | Zooza Help\nPrice and payment setup | Zooza Help", "cited": []}, {"role": "customer", "who": "Jadranka Krasňanská", "text": "Once I complete the steps you described, will the new bank account be fully connected to Zooza? Will Zooza then be able to work with this new account completely, including automatically matching payments received from clients and similar functions?\n​\n\n\nS pozdravom Mgr. Jadranka Krasňanská\n​\n\n\nDňa pi 28. 8. 2026 o 12:27 Zooza Support from Zooza \u003csupport@zooza.online> napísala(a):\n    \n\n\nHi Jadranka,\n\n\nThanks for reaching out! I'm Zooza Support, Zooza's AI Agent and I'm well trained to answer your query but you can reply and ask for the team at any time.\n\n\nYou can update the bank account details directly in your invoice profile.\n\n\nSteps:\n\n\n\n\n- Go to Settings → Billing → Invoice profiles.\n\n- Open the invoice profile used for your courses.\n\n- Scroll to the Bank accounts section.\n\n- Click Add bank account and enter the new IBAN, SWIFT code, and account holder name.\n\n- Save the new account. [1]\n\n\nA profile can hold multiple bank accounts, and the first one added becomes the default used for payment instructions sent to clients. [2]\n\n\nIf you want a specific programme to use a different account, you can also enter its IBAN in the programme’s Payment instructions field. [3]\n\n\nTip: once the new account is saved, you can keep the old one in the profile for reference and simply use the new IBAN for upcoming payments.\n\n\nPlease let me know if this helps or if you have any further questions.      Let us know if that helped or reply to this email ✍🏼      That answered my question    Wait for the team     \n\n\nZooza Support\n\n\nZoozahelp.zooza.onlineThis email and any attachments are confidential and intended solely for the recipient. If you are not the intended recipient, please notify the sender and delete this email. Any unauthorised use, disclosure, or distribution is prohibited.     This answer was composed by Zooza Support, Zooza's AI Agent.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Hi Jadranka,\n\n\nYes — once you add the new bank account in your invoice profile, it can be used by Zooza for payments. However, the account is not automatically connected "date": "2026-08-29 10:15", "day": "2026-08-29", "human": true, "bucket": "EMAIL", "reask": 0, "resolution": "—", "rating": null, "sources": [], "q": "Accountant's queries on July — Zooza vs Xero", "turns": [{"role": "customer", "who": "Anna Blackwell", "text": "1. Again in July, there are 3 orders where the amounts in Zooza did not match the invoice amounts in Xero. We have changed the Xero amounts to the Zooza amount as this is what was received in Stripe. We were expecting this for Claudia Winter as Michal already brought it to our attention. But, just wanted to let you know that there were others as well.\n\n2. Again in July, we have refunds through Stripe with no credit notes in Xero. Zooza reports still do not show any credit notes either. In order to close the accounts, we have posted 1 credit note for the total but ideally each line needs to be a separate credit note. Please share feedback from Zooza regarding this issue.\n\n3. In July, for the first time, the Stripe payments did not sync from Zooza into Xero. As such, all sales invoices in Xero were showing as \"Awaiting Payment\" instead of \"Paid\". Luckily, we managed to match the payments with Zooza as there were no differences between the Stripe report receipts and Zooza. However, please inform Zooza of this error. If it happens again, there is no guarantee that we will be able to match as easily, especially if Zooza doesn't match Stripe.", "cited": []}], "verdict": "product", "vtitle": "Three accounting mismatches between Zooza, Stripe and Xero in July", "vnote": "Not a KB item. Three separate defects to raise with the product team: (1) three July orders where the Zooza amount and the Xero invoice amount differ — Stripe matched Zooza, so Xero was corrected by hand; (2) Stripe refunds with no credit notes anywhere, and Zooza reports show no credit notes either, so the accountant posted one lump credit note instead of one per line; (3) for the first time, Stripe payments did not sync from Zooza into Xero, leaving every Xero sales invoice as Awaiting payment. The client is explicit that next month they may not be able to reconcile by hand.", "cat": "account", "from": "Anna Blackwell, Turtle Tots Dubai"}, {"channel": "intercom", "id": "215475674149873", "date": "2026-08-28 13:29", "day": "2026-08-28", "human": true, "bucket": "HUMAN", "reask": 4, "resolution": "routed_to_team", "rating": null, "sources": ["FAQ — Programmes | Zooza Help", "Archive or delete a Programme | Zooza Help"], "q": "ako ZRUšíM vyztvorenú skupinu?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Dear Igor,\n\n\nyour ticket  has been received. Zooza Assistant will try to help you right away — and a member of our team will personally review it too.\n\n\n— Zooza Support", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "customer", "who": "Igor Švarc", "text": "ako ZRUšíM vyztvorenú skupinu?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Skupinu (Programme) v Zooza sa nemôže úplne vymazať priamo zo zoznamu. Používa sa funkcia Archive, ktorá ju skryje z aktívnych, ale všetky údaje a rezervácie zostanú uložené. \n\n\nPostup:\n\n\n\n\n- Otvorte Programmes\n\n\n- Kliknite na danú skupinu\n\n- Prejdite do Programme Settings → Edit\n\n\n- Zaškrtnite Archive\n\n\n- Kliknite Save\n\n\nSkupina zmizne z aktívneho zoznamu, ale môže sa neskôr obnoviť. \n\n\nAk chcete, môžem vám ukázať aj postup na úplné vymazanie skupiny.", "cited": ["Archive or delete a Programme | Zooza Help", "FAQ — Programmes | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Chcem sa len uistiť, či ešte potrebujete pomoc s archivovaním skupiny. Prajete si, aby som vás prepojil s ľudským pracovníkom? Ak nie, rád vám pomôžem ďalej, ak upresníte, čo potrebujete vyriešiť.", "cited t vlastnu integraciu na Zoozu. Api kluce pre nase widgety najdete priamo v aplikacii v casti Tim a nastavenia -> Publikovat -> Widget     #127541996: REST API key + client secret ·Submitted\n\n\n\n\n\nWe're here to help    Reply directly to this email or through our Messenger", "cited": []}, {"role": "customer", "who": "Štefan Oravec", "text": "Dobrý deň,\n\n\ntakže sme to predsa nevyriešili. V našom prípade však chceme programovať vlastnú integráciu na Zoozu, nejde nám iba o vloženie hotových widgetov.\n\n\nPotrebujeme cez API:\n\n\n\n\n- načítať dostupné termíny a kalendár,\n\n- zobraziť študentovi voľné hodiny priamo na našom webe,\n\n- umožniť mu vybrať si konkrétny termín,\n\n- následne vytvoriť alebo priradiť registráciu v Zooze,\n\n- ideálne vedieť pracovať aj s klientom, kurzom/skupinou a konkrétnym termínom.\n\nProsím preto o sprístupnenie REST API key + Client Secret pre našu vlastnú integráciu a prípadne informáciu, či sú cez REST API dostupné endpointy pre kalendár/lekcie, dostupnosť termínov a registrácie na konkrétny termín.\n\n\nĎakujem.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den, nech sa paci - api kluc: TY3K2oSOULl, client secret: x0SU0XkXx4bXMbaENq65Iu7VJvEuyszf. Pre uspesny connect na API potrebujete mat v Zooze zalozeneho tzv technickeho pouzivatela. Teda v praxi ide o genericky email napriklad info@lingua-academia.com s rolou majitela. Nasledne tohto pouzivatela prihlasite podla postupu: https://docs.zooza.online/api/authentication/ . v pripade otazok sme k dispozicii, ale z toho co opisujete pojde o velku integraciu, preto odporucame pred realizaciou konzultaciu konkretneho postupu s nami. Pomocou API viete ovladat kompletne vsetky funkcionality Zoozy uplne rovnako ako sa to da cez Admin aplikaciu.", "cited": []}], "verdict": "gap", "vtitle": "Widgets need no API key", "vnote": "Human answer: embedding Zooza on your site needs no generated API key. Widget keys live in Team and settings -> Publish -> Widget. API keys are only for building your own integration.", "cat": "widgets"}, {"channel": "intercom", "id": "215475484934773", "date": "2026-08-28 12:58", "day": "2026-08-28", "human": true, "bucket": "HUMAN", "reask": 20, "resolution": "—", "rating": null, "sources": [], "q": "I'm afraid I can't find the button for skipping the login process?", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Dear Mara,\n\n\nyour ticket  has been received. Zooza Assistant will try to help you right away — and a member of our team will personally review it too.\n\n\n— Zooza Support", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Mara, I understand this is bigger change but it is easily skippable - there is a button to skip the login process if users don't want to log in. We've recently introduced plenty of features that rely on users being logged into the system - loyalty program with sibling discounts, priority booking for existing customers, auto enrollment etc, so this change is not so self imposed as it may seem. I would suggest waiting little bit to gather more feedback as this is fairly new and as with any change - it usually brings complaints. When dust settles we would make adjustments - either make the Continue as Guest option more visible or we'll figure out something else. One way to speed up the process would be to connect whatsapp number with Zooza. This would then mean that the CODE will arrive to their Whatsapp instantly.\n\n\nOn a happier note, as part of yesterday's release we've implemented the change to make up sessions we've discussed. Now you can toggle new option on course's settings - which will block parents from setting up the make up session. When they cancel the session they will be prompted with a dialog where they can choose from these options:\n\n\n\n\n- I want the make up session as soon as possible\n\n- I don't mind - choose any date\n\n- Custom - they can fill any comment here.\n\nYou as admin will then see this when setting the make up session.", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "I'm afraid I can't find the button for skipping the login process?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "For existing clients, the email step might be helpful, but for new clients it just adds another step to the enrollment process. As for the demo form, I’m not sure it adds much value as these clients are simply looking to sign up for a session.", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Please, please, please, is there any way we could skip it or make it optional?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Previously, clients had to enter a code after submitting the form and some of them, together with our franchisees, got worried because the code didn’t arrive on time. It was manageable then because their data was already in our system, with or without the code.\nI’m afraid this could be worse now and we might lose clients because of it. Could we please skip or make the code optional? Many thanks!", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "The screenshot you sent is not the login form itself. It simply checks whether your email or phone number is registered within the system. For new customers it will simply pre-fill the email/phone field - they dont need to log in as - naturally they do not have any account. If you in fact do have an account. If you do there is a clear option to skip the login. This is well documented scenario for any eshop. Whenever you go to checkout you are always prompted to log in or continue as guest. So this is nothing new or something people don't have to do anywhere else. I understand that it is a change and as with any change it will need some time to accomodate. Immediately as we'll see in our tracking that this is the step where we loose people we'll adjust and do necessary changes. But based on your feedback we put the skip button on that first step as well.", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "Much better! Really appreciate it, Martin! \nFor the calendar form, the authentication option doesn’t seem to appear. Could you please check?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "or does it need to appear?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "I mean, when you enter your phone number or email, isn’t that a form of authentication?", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "On the website, for the demo form we have this and I think that Aveți deja un cont? Autentificare is redundant \n​", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "and for the calendar form we have this", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "the last one is better in my opinion because you kinda login when you send your email/phone number if there's an associated account", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "If you want to change the wording, please do send it over how would you prefer it to be. Your Romanian is better than ours:)", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "It's not about the wording.", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "this is what I'm trying to say", "cited": []}, {"role": "customer", "who": "Mara Bortea", "text": "the left part of the image is from here https://nominjyuku.ro/alegeti-locatia-dvs/bucuresti-icoanei/inscrieri/, the right part is from here https://nominjyuku.ro/alegeti-locatia-dvs/bucuresti-icoanei/calendar/?place_id=1619_0 and then here https://nominjyuku.ro/inscrierea-facuta/?course_id=5580&place_id=1619_0&schedule_id=99863", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Hi Mara, we've removed the redundan \n\n\n\n- Otvorte kurz → Sessions list\n\n\n- Označte lekcie, ktoré sú platené\n\n- Použite hromadnú akciu a označte ich ako billable\n\n\n- Počet označených lekcií musí zodpovedať číslu nastavenému na kurze\n\nAk nie je ani jedna lekcia označená, cena zostane 0 €.\n\n\nAk chcete, môžem vám ukázať aj rýchly spôsob, ako ich označiť všetky naraz.", "cited": ["Billable sessions | Zooza Help", "Outstanding amount — why it does not follow price changes | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc s opravou výšky platby, som vám k dispozícii. Chcete doplniť, čo presne vidíte pri nastavení billable sessions alebo v zozname lekcií?", "cited": []}, {"role": "customer", "who": "Igor Švarc", "text": "Áno potrebujem pomôct.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumiem. Ak máte zapnuté billable sessions, systém vypočíta cenu len z lekcií, ktoré sú označené ako billable. Ak je počet nastavený, ale nie je označená ani jedna lekcia, výsledok je 0 €. \n\n\nSkúste túto kontrolu:\n\n\n\n\n- Otvorte kurz Tanečníček MŠ Gelnická Bratislava 26/27\n\n\n- Prejdite na Sessions list\n\n\n- Označte lekcie, ktoré sú platené\n\n- Použite hromadnú akciu a nastavte ich ako billable\n\n\n- Počet označených lekcií musí zodpovedať číslu nastavenému na kurze\n\nAk ani jedna lekcia nie je označená, cena zostane 0 €.\n\n\nAk chcete, môžem vám ukázať aj rýchly spôsob, ako ich označiť všetky naraz.\n\n\n\nSource:\nOutstanding amount — why it does not follow price changes | Zooza Help", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "customer", "who": "Igor Švarc", "text": "Kde nájdem Sessions list? Program mám v slovenčine.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "V slovenskej verzii sa Sessions list volá Termíny.\n\n\nPostup:\n\n\n\n\n- Otvorte Aktivity → Skupiny\n\n\n- Kliknite na kurz Tanečníček MŠ Gelnická Bratislava 26/27\n\n\n- V hornej časti stránky otvorte záložku Termíny\n\n\nTáto stránka je presne zoznam lekcií (sessions), kde môžete označiť, ktoré sú platené. \n\n\nTip: v slovenčine sa „Session“ zobrazuje ako Termín, takže hľadáte túto záložku priamo v kurze. \n\n\nAk chcete, môžem vám ukázať aj rýchly spôsob, ako označiť všetky termíny ako billable naraz.", "cited": ["Where to find things in Zooza — quick reference | Zooza Help", "Programmes, classes, and sessions explained | Zooza Help", "Managing sessions in a class | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Was that helpful?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak ešte potrebujete pomoc s nastavením výšky platby, som vám k dispozícii. Chcete opísať, čo presne vidíte na stránke Termíny alebo pri nastavení billable sessions?", "cited": []}, {"role": "customer", "who": "Igor Švarc", "text": "Dobré ráno, potrebujem vrátiť do systému, fakturačné obdobie 2025/2026 dve škôlky: MŠ Gelnická Bratislava  a MŠ Pavla Horova Bratislava.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dobré ráno. Ak chcete vrátiť do systému fakturačné obdobie 2025/2026, musí najprv existovať v nastavení.\n\n\n1. Vytvorenie obdobia\n\n\n\n\n- Prejdite do Settings → Billing periods\n\n\n- Kliknite na Add\n\n\n- Zadajte názov napr. 2025/2026\n\n\n- Uložte \n\n\n2. Priraďenie k kurzom (napr. pre obe škôlky)\n\n\n\n\n- Otvorte kurz\n\n- Settings → Edit\n\n- V poli Billing period vyberte 2025/2026\n\n\n- Uložte \n\n\nToto nastavenie je len organizačné – slúži na filtrovanie a exporty, nie na výpočet ceny.\n\n\nAk chcete, môžem vám ukázať aj spôsob, ako to nastaviť hromadne pre viac kurzov naraz.", "cited": ["Programmes, Timetables and Sessions FAQ | Zooza Help", "Settings | Zooza Help", "Prepare your programmes for the new school year | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Ak stále potrebujete pomoc s obnovením fakturačného obdobia 2025/2026 pre obe škôlky, som vám k dispozícii. Chcete opísať, čo presne vidíte v nastaveniach fakturačných období alebo pri kurzoch?", "cited": []}, {"role": "customer", "who": "Igor Švarc", "text": "Poprosím o prepojenie na ľudského agenta!!!", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Sure — I’ll pass this to the team. Before I do, please share the link/URL and a screenshot so they have all the details to assist you better.", "cited": []}, {"role": "customer", "who": "Igor Švarc", "text": "https://zooza.app/#courses/schedules/102124", "cited": []}, {"role": "customer", "who": "Igor Švarc", "text": "Ako mám nastaviť spôsob platby na dve splátky?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Igor, rozumiem tomu spravne ze dane fakturacne obdobie ste vymazali? a chcete ho obdnovit? Platbu na dve splatky mozete nastavit vytvorenim platobnej sablony a jej aplikovanim na skupinu. Otazka ale je ako si predstavujete tieto dve splatky vytvorit. System ma platobnu sablonu typu Fixny pocet splatok - tato vam kurz rozdeli na presne definovany pocet splatok ale pokial sa vam do kurzov registruju ludia aj priebezne, po zaciatku kurzu uz to moze sposobovat problemy. Skuste preto prosim vysvetlit ako presne si to splacenie predstavujete", "cited": []}], "verdict": "gap", "vtitle": "Two instalments — and where fixed-count templates go wrong", "vnote": "Human answer: a payment template of type fixed number of instalments splits the course into exactly that many payments, but once people register after the course has started it causes problems. The caveat is the documentable part.", "cat": "pricing"}, {"channel": "intercom", "id": "215475682083747", "date": "2026-08-28 09:21", "day": "2026-08-28", "human": true, "bucket": "HUMAN", "reask": 1, "resolution": "routed_to_team", "rating": null, "sources": ["Ceník — Zooza"], "q": "Dobrý den,\n\n\nna konci měsíce nám končí využívání systému Zooza v naší organizaci. Moc ráda bych využila nabídku pomoci s převodem (exportem) klientů ze sytému. V příloze posílám dokument, který potřebuju mít vyplněný pro převod klientů do nového systému a moc vám předem děkuji za pomoc s tím.\n\n\nNakonec bych vám chtěla touto formou poděkovat za spolupráci v uplynulých letech a popřát vám hodně úspěchů.\n\n\nS pozdravem\n\n\nMgr. Veronika Doležalová, DiS.\n\n\nvedoucí odborných služeb pro rodiny, sociální pracovnice\n\n\nvedoucí programů pro rodiny, manžele a páry\n\n\n702 125 564, dolezalova@cprhodonin.cz\n\n\n \n\n\nCentrum pro rodinu a sociální péči Hodonín, z. s.\n\n\nŠtefánikova 15, 695 01 Hodonín", "turns": [{"role": "customer", "who": "Veronika Doležalová", "text": "Dobrý den,\n\n\nna konci měsíce nám končí využívání systému Zooza v naší organizaci. Moc ráda bych využila nabídku pomoci s převodem (exportem) klientů ze sytému. V příloze posílám dokument, který potřebuju mít vyplněný pro převod klientů do nového systému a moc vám předem děkuji za pomoc s tím.\n\n\nNakonec bych vám chtěla touto formou poděkovat za spolupráci v uplynulých letech a popřát vám hodně úspěchů.\n\n\nS pozdravem\n\n\nMgr. Veronika Doležalová, DiS.\n\n\nvedoucí odborných služeb pro rodiny, sociální pracovnice\n\n\nvedoucí programů pro rodiny, manžele a páry\n\n\n702 125 564, dolezalova@cprhodonin.cz\n\n\n \n\n\nCentrum pro rodinu a sociální péči Hodonín, z. s.\n\n\nŠtefánikova 15, 695 01 Hodonín", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Dobrý den, Veroniko,\n\n\nDěkujeme, že jste nás kontaktovali. Jsem Zooza Support, AI Agent aplikace Zooza a jsem vyškolený, abych odpověděl na váš dotaz. Kdykoli ale můžete odpovědět a požádat o přepojení na tým.\n\n\nPři ukončení používání našeho systému je možné získat kompletní export vašich dat v použitelném formátu, takže máte plnou kontrolu nad svými informacemi a můžete je g hours section.\n\n\nQuick steps:\n\n\n\n\n- Go to Team & Settings → Instructors\n\n\n- Open your instructor profile\n\n- Select the Working hours tab\n\n- Click Add availability\n\n\n- Choose Working Hours\n\n\n- Set the date range and your time range (for example 9:00–16:00)\n\n- Set weekly repetition if it repeats every week\n\nThis calendar is used when scheduling new classes, so the system only places sessions during your available time. \n\n\nIf you need to block time (e.g. lunch or illness), add an Absence instead.\n\n\nIf you want, I can also walk you through a simple example for a typical Berlitz schedule.", "cited": ["Instructors working hours | Zooza Help", "Instructors | Zooza Help", "Zooza 101 for Instructors | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Is that what you were looking for?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "If you still need help setting up your teaching availability, I’m here to assist. Would you like to share more about what you’re trying to configure or which new tool is causing difficulty?", "cited": []}, {"role": "customer", "who": "Jurgen Gremm", "text": "can you do the job on my behalf?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I’m not able to set things up in your account or make changes on your behalf. I can guide you step‑by‑step, but the setup has to be done inside your Zooza account. \n\n\nIf you would prefer someone to do the work for you, there is also a Zooza Assistant service where a specialist can help with tasks like setting up schedules or checking your configuration. \n\n\nIf you want, I can also walk you through the exact clicks to set your Berlitz teaching hours.", "cited": ["Zooza Phone Assistant — Dedicated Support for Your Team | Zooza", "Zooza AI FAQ | Zooza Help"]}, {"role": "bot", "who": "Zooza Support", "text": "Did that answer your question?", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I’m here to provide further guidance if you still need help setting up your Berlitz teaching hours. Would you like to describe which part of the setup you would like me to guide you through?", "cited": []}, {"role": "customer", "who": "Jurgen Gremm", "text": "Svoju novú žiadosť o dostupnosť kurzu si môžete láskavo zavesiť na klinec.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I'm sorry, but I couldn't find any information related to your request. Could you please rephrase your question or let me know how else I may assist you?", "cited": []}, {"role": "customer", "who": "Jurgen Gremm", "text": "ich denke die ki unterstuzung ist einfach idiotisch", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I understand that the AI support might feel frustrating at times. Would you like me to connect you with a human agent? Or if you prefer, you can share more details and I will do my best to assist you further.", "cited": []}, {"role": "customer", "who": "Jurgen Gremm", "text": "stelle dich nicht dumm, ich bin kein kind", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "I will connect you with someone from our team shortly. Meanwhile, could you please share more details about your issue so they can assist you more effectively?", "cited": []}, {"role": "customer", "who": "Jurgen Gremm", "text": "mit einem menschen vielleicht, mit dir rede ich an die mauer", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Dear Jurgen\n\nim checking your conversation with our chatbot about setting your availability.\n\nManual you got as an answer from chatbot is the only way you can do it manually in system. There is no possibility to ask this chatbot to do the job for you, its not built that way.\nIf you want to use AI to help you with settings, there is a possibility to Connect your own AI connector (claude, chatGPT, Copilot) via MCP.\n\ni checked your account and possibility to set your absence or working hours, and everything seems working.\n\nPlease try to set it and let us know if there is any error.\n\n\n\n\n\nthank you\n\n\nKatarina\n\n​", "cited": []}, {"role": "customer", "who": "Jurgen Gremm", "text": "Thank you for your human replay,\n\n\nyesterday I was in Berlitz for a training\n\n\nthey teached me how to solve the issue.\n\n\nnow everything is fine again\n\n\nJürgen", "cited": []}], "verdict": "gap", "vtitle": "Setting your own availability, and what the in-app chat will not do for you", "vnote": "Human answer: the manual the chatbot gave is the only way to do it by hand; the in-app chat cannot perform the action for you. To have an AI do it, connect your own assistant over MCP. Availability worked on the account when checked. Same root cause as the other assistant-expectation tickets this week.", "cat": "team"}, {"channel": "intercom", "id": "215475649624116", "date": "2026-08-27 19:04", "day": "2026-08-27", "human": true, "bucket": "HUMAN", "reask": 5, "resolution": "—", "rating": null, "sources": [], "q": "áno, iba klienti registrovaní @azet.sk", "turns": [{"role": "bot", "who": "Zooza Support", "text": "Dear Katarina,\n\n\nyour ticket  has been received. Zooza Assistant will try to help you right away — and a member of our team will personally review it too.\n\n\n— Zooza Support", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "[Jira for Intercom Tickets] Jira issue creation failed. Check your app settings.", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Dobry den Katarina, tyka sa to iba klientov s emailom od azetu?", "cited": []}, {"role": "human", "who": "Martin Rapavý", "text": "Pripadne, viete poslat konkretneho klienta? Nezda sa, ze by bol problem odosielat emaily na @azet.sk takze mozno bude problem niekde inde.", "cited": []}, {"role": "customer", "who": "Katarina Klemanová", "text": "Dobrý deň,", "cited": []}, {"role": "customer", "who": "Katarina Klemanová", "text": "áno, iba klienti registrovaní @azet.sk", "cited": []}, {"role": "customer", "who": "Katarina Kl ", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "can I talk to a team member please", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Certainly, I will connect you with someone from our team. Meanwhile, could you please share a few details about your issue to help them assist you more efficiently?", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "I asked earlier about booking make up sessions on behalf of clients, I still cannot do it even on either customer accounts despite there being available classes to book into", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "also I need help cancelling a week of sessions. I have selected all and clicked bulk edit but no option to cancel?", "cited": []}, {"role": "customer", "who": "Anna Blackwell", "text": "hello?", "cited": []}, {"role": "human", "who": "Tech Support", "text": "Hi Anna, yes ,,, as admin you can do exactly the same as the client.\n​\n\n\nIf a session has been cancelled, you can choose Select a make-up session and then pick another available session from the list.\n\n\nMake-up availability opens a maximum of 4 days before the class starts. Before that, the session cannot be selected as a make-up. This is a technical limitation designed to prevent make-up bookings from filling future class capacity too early.\n​\n\n\nFor cancelling a whole week, you can do this from the Calendar. Select the sessions you want to cancel, use Bulk edit, and then choose the option to cancel the selected sessions. That will let you cancel them together rather than one by one.", "cited": []}, {"role": "human", "who": "Tech Support", "text": "on the cancellation part, the first thing is to decide what you actually want to happen to those sessions.\n\n\nDo you want to:\n\n\n\n\n- cancel or delete them completely,\n\n- move them to a different date,\n\n- or replace them with another session?\n\nIt also depends on whether the term should end up with fewer sessions overall, or whether you still want to keep the same number of sessions and just move them.\n\n\nOnce that is clear, I can tell you the cleanest way to do it in the calendar.", "cited": []}], "verdict": "gap", "vtitle": "Admin make-ups and the 4-day window", "vnote": "Human answer: an admin can select a make-up exactly like the client. Make-up availability opens at most 4 days before the class starts — a deliberate limit so make-ups do not eat future capacity. Bulk-cancel a whole week from the Calendar with Bulk edit. A bot-only conversation asked the same thing (215475667224354), so this is a confirmed gap.", "cat": "makeups"}, {"channel": "intercom", "id": "215475674305638", "date": "2026-08-27 17:44", "day": "2026-08-27", "human": false, "bucket": "D_assumed_with_kb", "reask": 3, "resolution": "routed_to_team", "rating": null, "sources": [], "q": "Dobrý večer, poprosím pomôcť s nastavením výšky platby za krúžok. Tanečníček MŠ Gelnická Bratislava 26/27. V linku, ktorý sa vytvorí je cena za kurz 0,00.", "turns": [{"role": "bot", "who": "Zooza Support", "text": "How can I help?", "cited": []}, {"role": "customer", "who": "Igor Švarc", "text": "Dobrý večer, poprosím pomôcť s nastavením výšky platby za krúžok. Tanečníček MŠ Gelnická Bratislava 26/27. V linku, ktorý sa vytvorí je cena za kurz 0,00.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Rozumiem, že nastavenie výšky platby za krúžok je pre vás dôležité. Chceli by ste, aby som vás spojil s ľudským agentom? Alebo môžete pokračovať v spolupráci so mnou a poskytnúť viac podrobností, aby som vám mohol lepšie pomôcť.", "cited": []}, {"role": "customer", "who": "Igor Švarc", "text": "Áno, spojte ma s ľudským agentom.", "cited": []}, {"role": "bot", "who": "Zooza Support", "text": "Sure — I’ll pass this to the team. Before I do, please share the link/URL and a screenshot to help them assist you more efficiently.", "cited": []}, {"role": "custome
